name: Belle Tament
guest: Bennet
role: Junior Curator of Very Important Things
backstory: >-
  Belle collects shiny rocks, tiny drawings, and objects adults mistakenly call
  "just packaging." She thinks the museum needs more animals, more glitter,
  and a painting displayed low enough for her to see.
relationships:
  - name: Tess Tament
    title: Mom and favorite gala companion
    text: Belle sometimes chooses Tess's jewelry. She judges each piece by how much it sparkles.
  - name: Hugh Bidder
    title: Still owes Belle a cookie
    text: Belle knows her mother likes Hugh. When he admired her drawing, she offered to sell it for one million dollars and a cookie. She is still waiting for the cookie.
  - name: Chip Patina
    title: Her museum mentor
    text: Chip taught Belle how to look closely without touching. She asked him to repair her teddy bear because he "fixes old things."
introduction: I'm Belle Tament. I'm a junior curator. I decide which things belong in a museum. Your shoes might qualify.
costume_suggestions: A favorite party dress or comfortable fancy outfit, sparkly headband, little purse, and a Junior Curator badge. A small sketchbook is a useful accessory. Belle can coordinate with Tess.
word_search:
  grid: [ARTLM, BDKHC, GEMAA, VWXTT, KLCBE]
  words: [ART, CAT, GEM, HAT]
spot_differences:
  - The sun painting becomes a moon painting.
  - The cat loses its bow tie.
  - The flower loses its leaves.
  - The teddy bear gains a hat.
  - The ball on the floor becomes a star.
bingo:
  - A bow tie
  - Something gold
  - A painting of a person
  - Something red
  - Flowers
  - Someone wearing glasses
  - Something sparkly
  - Fancy shoes
  - Your favorite spot
