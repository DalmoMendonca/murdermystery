      misleading total. He expected a final account in his salon before announcing a donation
      he had still not paid.
  coming_clean:
    innocent: >-
      The unauthorized transfer is mine. So are the blue corrections preserved in the voucher
      bundle. The continuous cash-office recording accounts for my hands and whereabouts while
      the coupe was exposed. I intended to reverse the transfer with Grant alive to pay his bill.
      I will now have to explain the deficit without that convenience.
    murderer: >-
      I could not repair the books quickly enough to survive Grant’s announcement. I left the
      vouchers at the gallery desk, used the setup key to reach the reference toxin and wiped
      it into his coupe. I returned with a total he would never dispute. There is no cash-office
      recording of my alleged work because I was elsewhere.
