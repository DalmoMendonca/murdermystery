  suspicion: altered
  hearings:
    motive_innocent: >-
      The certificate was forged before it reached me. Grant proposed an elegant correction: I
      refund millions and let everyone believe I made it. I altered my file after the sale because
      I looked like a fool. That alteration was mine. The forgery was someone else’s. Grant enjoyed
      blurring the distinction.
    motive_murderer: >-
      Grant wanted millions back for a certificate forged before I saw it. He also wanted the
      pleasure of calling me a forger in public. Yes, I altered the sale file afterward. Clients
      pay for confidence; I supplied some I had not earned. Grant discovered a very expensive
      way to make me listen.
    where_innocent: >-
      I argued with him in the salon before the glass arrived. From 6:39 until 6:45 I used the
      fixed auction-booth handset to renegotiate the sale. ‘Violet reserve’ was the buyer’s absurd
      password. I had to admit the altered file. A six-minute confession to a client is quite
      enough for one evening.
    where_murderer: >-
      I argued with Grant before the glass arrived, then took the buyer’s call on my mobile in
      the gallery. I moved to the side passage for a quieter connection and came back before the
      toast. A threatened lawsuit is best conducted without an auctioneer supplying commentary
      over your shoulder.
    evidence_innocent: >-
      I changed the chronology in the certificate file after the sale. The buyer’s refund instructions
      are folded behind it. Grant could make that alteration sound like the original forgery if
      he left out the dates, which he intended to do. My client was about to learn what my confidence
      had cost them.
    evidence_murderer: >-
      The amended certificate file was in my jacket beside the buyer’s refund instructions. I
      changed its chronology after discovering the forgery. Grant had a copy of the earlier version
      and wanted a valuation left in his salon. He could never decide whether my paperwork was
      worthless or urgently required.
  coming_clean:
    innocent: >-
      I concealed an alteration to my sale file. The recorded bid-booth conversation, including
      the ridiculous password, kept me away from the exposed coupe. I have lost a client and probably
      a substantial fee. I did not poison Grant. If anyone still wishes to acquire the bowl, we
      should begin with its actual ownership.
    murderer: >-
      The client was waiting while I made a different adjustment. I went to the salon, took the
      stolen toxin onto a museum cloth and coated the empty coupe. My mobile call could follow
      me anywhere; the recorded bid-booth conversation was not mine. Grant intended to sell my
      reputation back to me. I killed him before he could collect.
- id: '04'
  clearance:
    discovery: 9
    round: method
    anchor: blue audit pencil
    record: >-
      Cash-office CCTV recovery: continuous occupied-room footage covers 6:39–6:45 SECURITY time.
