characters:
- id: '01'
  suspicion: rival museum
  exclusion:
    action: contaminate_coupe
    round: method
    anchors:
    - I began revising the acknowledgments with the board chair at 6:36.
    - The chair's final correction came at 6:46.
    explanation: Artie's live exchange on a fixed boardroom speakerphone spans the full uncovered-glass
      period; the caller's requested edits tie the conversation to live participation, not a recording.
      The fixed line is in another room.
    activity_premise: The speakerphone is fixed to the boardroom wall.
    family: continuous_activity
  hearings:
    motive_innocent: Grant wanted my resignation attached to his donation, like a complimentary tote bag.
      I had accepted a job at a rival museum. There, I've said it. I kept smiling because thirty years
      of museum management teaches you to applaud while someone repossesses your chair. I began revising
      the acknowledgments with the board chair at 6:36.
    motive_murderer: Grant wanted my resignation attached to his donation, like a complimentary tote bag.
      I had accepted a job at the rival museum, but leaving meant handing him this institution. I told
      him he could purchase a wing. He could not purchase my surrender. I began revising the acknowledgments
      with the board chair at 6:29.
    where_innocent: The speakerphone is fixed to the boardroom wall. She read each donor name, I answered,
      and we kept revising together until her final correction. The acknowledgments were my last duty
      before Grant's announcement. His name appeared eleven times. I reduced that to nine, which he considered
      an attack on the donation. The speech cards are in my handwriting, including the crossed-out title
      he awarded himself.
    where_murderer: The speakerphone is fixed to the boardroom wall. She read each donor name, I answered,
      and we kept revising together until her final correction. The acknowledgments were my last duty
      before Grant's announcement. His name appeared eleven times. I reduced that to nine, which he considered
      an attack on the donation. The speech cards are in my handwriting, including the crossed-out title
      he awarded himself.
    evidence_innocent: The chair's final correction came at 6:46. The pocket square and speech cards went
      with me to Grant afterward. I could spell his name. What I couldn't do was persuade him that the
      other names mattered.
    evidence_murderer: The chair's final correction came at 6:38. The pocket square and speech cards went
      with me to Grant afterward. I could spell his name. What I couldn't do was persuade him that the
      other names mattered.
  coming_clean:
    innocent: The rival museum is real. I was leaving, and I let Grant think I might still accept his
      terms because I wanted the board to see what he demanded. My conversation with the chair lasted
      across the full uncovered-glass period on the fixed boardroom phone. I concealed a career move,
      not a trip to his glass. Tomorrow I will submit my resignation on my own stationery.
    murderer: I murdered Grant. During the preparation walkthrough I took cyanide from the open room and
      hid it in my pocket square. While the glass was uncovered, I brought his corrected speech cards
      to the Salon and wiped the solution inside his glass. The glass cover and the pour finished the
      service exactly as planned. He wanted my resignation. I gave him a farewell toast instead.
  briefing:
    history: 'Grant had privately informed you that tonight''s gift would come with a new governance agreement:
      he wanted veto power over acquisitions, his name on the museum, and your resignation within sixty
      days. You smiled through the meeting and told no one.'
    secret: You have already accepted a confidential offer to lead a rival museum next year, which makes
      any argument with Grant look like succession planning.
    objectives:
    - Find out whether Monet Bags has seen the governance addendum.
    - Quietly learn whether Claire O’Scuro would stay if you left.
    - Do not volunteer your job offer unless pressure forces it.
