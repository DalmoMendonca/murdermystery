# ORGANIZER SOURCE: all private branches and solutions. Public invitations stay in character_copy.yaml.
schema_version: 1
characters:
- id: '01'
  clearance:
    discovery: 1
    round: motive
    anchor: speakerphone
    record: >-
      Boardroom telecom recovery: a live call occupied the fixed speakerphone throughout 6:39–6:45
      SECURITY time; longest silence fourteen seconds. No forwarding or mobile connection exists.
      The export withholds caller identity and conversation content. Answering that call supplies
      an alibi; leaving the line open in an empty room does not.
  suspicion: resignation
  hearings:
    motive_innocent: >-
      Grant wanted my resignation, his name above the door and veto power over every purchase.
      I had another offer. At 6:39 I took the recruiter’s call on the boardroom speakerphone and
      stayed until 6:45. I accepted. Kindly allow me to tell my trustees before the caterer tells
      them.
    motive_murderer: >-
      Grant wanted my resignation and veto power over every purchase. I had another offer, but
      announcing my departure under his conditions would have handed him the museum. The recruiter
      rang during preparations. I let the boardroom line take the call; I had a donor to manage
      before discussing another job.
    where_innocent: >-
      I left Grant’s speech cards in the salon before six-thirty. Then I borrowed the boardroom
      for what I called a budget discussion. It was a job interview. After the call I went back
      to the gallery, where everyone wanted a photograph and nobody wanted responsibility for
      the naming agreement.
    where_murderer: >-
      I delivered Grant’s speech cards before six-thirty and returned to the gallery. Around 6:42
      I was checking the dedication wording on the working copy at the reception desk. He had
      complained about his name twice. Later I went to the boardroom to deal with the waiting
      recruiter.
    evidence_innocent: >-
      I removed the draft resignation from Grant’s folder. He had left a space for my signature
      beneath a date he had chosen himself. The dedication card and naming agreement were still
      in the folder; I took the page concerning my job. My acceptance of the other directorship
      is signed. His agreement is not.
    evidence_murderer: >-
      I tore the draft resignation out of Grant’s folder and retained his dedication card. If
      you have found a sheet with my name and an empty signature line, that is mine. He expected
      me to supply the stationery for my own dismissal. The board had not approved the naming
      agreement he meant to announce.
  coming_clean:
    innocent: >-
      I concealed my new appointment, not a murder. The recruiter’s retained call places me at
      the fixed boardroom speakerphone throughout the contamination interval. I took the resignation
      page because I refused to have my dismissal displayed beside the bowl. I shall answer to
      the trustees for that, preferably after dessert.
    murderer: >-
      I let the recruiter leave a message. While I should have been answering, I took toxin from
      conservation and wiped Grant’s empty coupe with museum linen. The speech cards got me into
      the salon. I claimed I was fussing over his dedication at reception. I wanted him gone before
      he could turn my resignation into his victory.
- id: '02'
  clearance:
    discovery: 2
    round: method
    anchor: white correction tab
    record: >-
      Registrar vault recovery: an occupied, locked interval runs 6:39–6:45 SECURITY time, with
      uninterrupted interior video and no other exit. The public extract withholds identity and
      file contents. A white correction tab can identify a file, not its owner's whereabouts.
      Working at the outer desk does not place anyone inside the vault.
  suspicion: independent review
  hearings:
    motive_innocent: >-
      Grant knew the provenance file had a hole in it. He wanted my name under a label pretending
      otherwise. I commissioned an independent review against the board’s instructions. Its fee
      came out of an exhibition account. You may question my authority to spend it; you will not
      improve the title by suppressing the question.
    motive_murderer: >-
      Grant knew exactly what was missing from the provenance file. He threatened to remove me
      if I made it public. I commissioned an independent review and charged it to the exhibition.
      He was preparing to call that financial misconduct while presenting the bowl as immaculate.
      I had no intention of applauding either performance.
    where_innocent: >-
      I checked the exposed cradle during installation, well before the mounting alert. Then I
      took the disputed file into the Registrar’s vault. I wanted to compare the export papers
      without Grant leaning over my shoulder. When I came out, he had moved on to his toast and
      the exhibition label was still wrong.
    where_murderer: >-
      I checked the cradle before the alert, then worked at the Registrar’s outer desk. I made
      another pass by the gallery around 6:43. The curtain was down; I looked at the label copy
      on the desk instead. I was deciding which sentence I could defend when Grant called me insubordinate.
    evidence_innocent: >-
      The file I carried into the vault had a white correction tab sticking out of the cover.
      I stayed inside until the custodian let me out at 6:45. I concealed the independent review
      behind the 1988 manifest. That was deliberate. An exhibition account should not pay for
      vanity, including a donor’s.
    evidence_murderer: >-
      I put the white correction tab in the provenance file at the outer desk and substituted
      a cautious label. The independent review is behind the 1988 manifest. I charged its fee
      to the exhibition without board consent. Grant wanted a clean public record; he was about
      to receive a substantially less flattering one.
  coming_clean:
    innocent: >-
      I used exhibition money without authorization and hid the resulting report. The vault record
      and interior camera cover my whole stay while Grant’s glass was exposed. My correction tab
      identifies the file I described. I could have ended the exhibition by publishing that report.
      I did not end his life.
    murderer: >-
      The review was real. My shelter in the Registrar’s Office was useful fiction: I stayed at
      the outer desk, then went to Grant’s glass. I stole the reference toxin, used museum linen
      to coat the empty coupe and returned to the paperwork. I wanted my research to survive him.
      I made certain that it would.
- id: '03'
  clearance:
    discovery: 7
    round: opportunity
    anchor: violet reserve
    record: >-
      Bid-booth telecom recovery: live fixed-handset conversation runs 6:39–6:45 SECURITY time,
