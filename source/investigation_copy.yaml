      conceal his spending. He threatened to call the entire deficit mine. He had developed an
      expensive taste for other people’s signatures.
    motive_murderer: >-
      I made an unauthorized transfer to keep the gala solvent. Grant wanted me to use that transfer
      to disguise his naming-wing expenses, then take the blame if his donation failed to clear.
      My name was already on the ledger. He understood precisely how much leverage that gave him,
      and he used all of it.
    where_innocent: >-
      I took an account summary to the salon early. Before the toast I was counting the original
