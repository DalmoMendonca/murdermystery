schema_version: 1
reports:
- id: F1
  department: MERIDIAN / BOARD SECRETARY
  title: The gift came with conditions
  text: Grant Larceny has died at the gala after his private toast. His proposed gift agreement is still
    unsigned. These are the terms he intended to announce tonight.
  rows:
  - - 1. Museum name
    - The Grant Larceny Meridian Museum
  - - 2. Collection decisions
    - Grant may veto future acquisitions
  - - 3. Museum director
    - Artie Ficial must resign within sixty days
  layout: gift_document
  document_label: DRAFT GIFT AGREEMENT / NOT SIGNED
- id: F2
  department: MERIDIAN / COLLECTIONS ASSISTANT
  title: An empty bottle in preparation
  text: 'I found the newly acquired poison bottle empty after the preparation-room tour. Its paper seal
    was broken. I locked the room and retained the bottle for examination. It had been brought out for
    the condition inspection of Grant’s proposed exhibition centerpiece. Signed: Collections Assistant.'
  rows:
  - - Object
    - The Velvet Widow poison bottle / acquisition lot 73
  - - Label
    - CYANIDE / POISON
  - - Found
    - Empty; original paper seal broken
  layout: bottle_photo
  photo: cyanide_bottle
- id: F3
  department: MERIDIAN / CATERER’S RECORD
  title: What happened to Grant’s glass
  text: 'These are my setup photos. I stayed with the wrapped glass until 6:40. From 6:40 to 6:44, I was
    away from the table. After sealing the cover at 6:44, I watched it until I opened it to pour. I then
    watched Grant’s glass until his 6:49 toast. The same glass was used throughout. Signed: Service Manager.'
  rows:
  - - Initial lab finding
    - Cyanide inside Grant’s glass
  - - Shared punch and food
    - No cyanide detected
  layout: service_photos
  photo: service_photos
  timeline:
  - time: '6:39'
    caption: Still wrapped; seal intact
  - time: '6:40'
    caption: Unwrapped; glass left unattended
  - time: '6:44'
    caption: Covered; red seal applied
  - time: '6:46'
    caption: Seal opened; punch poured
- id: F4
  department: MERIDIAN / COLLECTIONS INVENTORY
  title: When the bottle was accessible
  text: The bottle was kept locked away before the tour. It was put on the visitor-side shelf when the
    room opened and locked away again at closing. Nobody obtained it outside those eight minutes. The
    laboratory matched material remaining in the bottle to residue inside Grant’s glass.
  rows:
  - - 6:20 / room opens
    - Bottle full; original paper seal intact
  - - 6:28 / room closes
    - Bottle empty; cupboard locked
  - - Other poison objects
    - No other bottles brought out or given to guests
  appendix:
    title: Two different ways to approach preparation
    diagram: preparation_routes
    rows:
    - - WEST / return counter
      - Papers pass through a small slot
    - - EAST / visitor doorway
      - Guests can enter and reach the shelf
    text: The west return counter is outside a solid wall. Its small slot passes papers and support sleeves,
      not people. Staff did not pass the bottle or its contents through it. The east doorway is the only
      guest entrance to the shelves.
    photo: preparation_access
  layout: inventory_photo
  photo: cyanide_bottle
- id: F5
  department: LABORATORY / CASE FINDINGS
  title: The glass, not the punch
  photo: service_photos
  text: Cyanide was found on the inside of Grant’s glass. Samples of the shared punch and food were clear.
    Material remaining in the acquired poison bottle matches the residue in the glass. The lab result
    identifies the poisoned object; the caterer’s record establishes how it was handled.
  rows:
  - - Grant’s glass / inside
    - CYANIDE DETECTED
  - - Shared punch pitcher
    - NO CYANIDE DETECTED
  - - Food samples
    - NO CYANIDE DETECTED
  - - Acquired poison bottle
    - MIXTURE MATCHES GLASS RESIDUE
  appendix:
    title: Two details from the museum’s records
    diagram: packaging_seals
    rows:
    - - Blue protective wrapping
      - Logo sticker across a closed seam
    - - Blue cloth placemat
      - Logo embroidered into fabric
    - - Raised RECEIVED stamp
      - First used at 6:45
    text: The museum-logo sticker bridged the sealed plastic wrapping. The placemat’s logo was sewn into
      cloth. They are different objects. The receiving desk first used its raised RECEIVED stamp at 6:45.
      Earlier working copies had flat red-pencil corrections, not that stamp.
    photo: paper_marks
  layout: lab_findings
discoveries:
- number: 1
  department: THE MERIDIAN / BOARD SECRETARY
  title: Gift agreement
  stamp: DRAFT - NOT EXECUTED
  paragraphs:
  - 'Donor: Grant Larceny. Recipient: The Meridian Museum of Art & World Cultures.'
  - '1. Naming: The institution shall be renamed The Grant Larceny Meridian Museum.'
  - '2. Governance: The donor shall retain approval rights over future acquisitions.'
  - '3. Management: Artie Ficial shall tender his resignation within sixty days of acceptance.'
  annotation: Artie - confirm acceptance before the unveiling. G.L.
- number: 2
  department: GENEVA FREEPORT / TRANSIT RECORD
  title: Shipping manifest / 1988
  stamp: OWNER REDACTED
  rows:
  - - Consignment
    - Isfahan Star Bowl
  - - Routing
    - Geneva freeport / onward transfer
  - - Shipper
    - Northstar Holdings
  - - Declared owner
    - REDACTED
  - - Export file
    - Not attached
  annotation: Keep with accession papers. Do not substitute exhibition label for ownership file.
- number: 3
  department: MERIDIAN STATIONERY / UNSIGNED
  title: A warning left behind
  photo: warning_note
  paragraphs:
  - RETURN WHAT WAS TAKEN BEFORE THE STAR GOES DARK.
  stamp: NO SIGNATURE
- number: 4
  department: ARTS DESK / PRESS PROOF
  title: GRANT’S NIGHT OF GLORY
  stamp: HOLD FOR 9:00 PM
  paragraphs:
  - 'Advance program: preparation walkthrough 6:20–6:28. Private glass unwrapped 6:40; cover sealed 6:44.
    Pour 6:46; toast 6:49.'
  - Grant Larceny will announce the naming agreement after his private toast.
  annotation: Advance proof / planned program, not a record of attendance.
- number: 5
  department: MERIDIAN / CONSERVATION
  title: Treatment finding
  stamp: REVIEW REQUIRED
  rows:
  - - Object
    - Isfahan Star Bowl
  - - Examiner
    - Chip Patina
  - - 6:37 finding
    - Mount hairline crack
  - - Requested action
    - Seal display alcove immediately
  annotation: Earlier adhesive finding also disputed by donor. Safety takes priority.
- number: 6
  department: MERIDIAN / LEGAL REVIEW
  title: Donor agreement / margin copy
  stamp: ORIGINAL OPINION
  paragraphs:
  - The proposed permanent gift remains subject to outstanding provenance review. An accession does not
    remove competing ownership claims.
  annotation: Permanent title does not cure disputed title. S.V.
- number: 7
  department: GAVEL & ROWE / ARCHIVE COPY
  title: Auction result
  stamp: LOT CIRCLED FOR REVIEW
  rows:
  - - Lot
    - Private collection acquisition
  - - Successful bidder
    - Anonymous / through Hugh Bidder
  - - Competing bidder
    - Grant Larceny
  - - Result
    - Sold to proxy buyer
  annotation: E.M. beat G.L. through a proxy. He will never forgive this.
- number: 8
  department: MERIDIAN / EXHIBITION LABEL PROOF
  title: Vincent Van Faux
  stamp: PROOF - NOT APPROVED
  paragraphs:
  - Early student work
  - Loan courtesy of Grant Larceny
  - Treasures of the World / Gallery label
  annotation: NO. This does not belong in the show.
- number: 9
  department: MERIDIAN / FINANCE DRAFT
  title: Education reallocation
  stamp: DONOR CONDITIONS
  rows:
  - - Program
    - Proposed change
  - - School tours
    - REDUCE
  - - Community programs
    - REDUCE
  - - Private donor lounge
    - INCREASE
  - - VIP entrance
    - INCREASE
  annotation: Anne E. Dote has not approved these cuts.
- number: 10
  department: MERIDIAN / SECURITY WORK ORDER
  title: Donor Salon camera
  stamp: OFFLINE BY REQUEST
  rows:
  - - Requested by
    - Grant Larceny
  - - Action
    - Disconnect salon camera
  - - Start
    - 6:29 PM
  - - Reason
    - Private donor meetings
  - - Authorized by
    - Barb Dwyer
  - - Disconnected by
    - Staff technician
  annotation: Deliberate disconnection. Not a technical fault.
- number: 11
  department: MERIDIAN / ACCESSION LEDGER
  title: Donation entry / 1989
  stamp: ARCHIVE EXTRACT
  rows:
  - - Donor
    - Grant Larceny
  - - Accession approval
    - Anya Tique
  - - Object status
    - Accepted into collection
  - - Export papers
    - Promised - not yet received
  annotation: File remains incomplete.
- number: 12
  department: DADA DiCAPO / WORKING NOTEBOOK
  title: Closing reveal / concept
  photo: performance_sketch
  paragraphs:
  - 'Original stage concept: Dada DiCapo.'
  - 'Printed gala credit: The Larceny Foundation.'
  annotation: The sketch predates the donor’s program credit.
- number: 13
  department: GAVEL & ROWE / ACQUISITION RECEIPT
  title: The Velvet Widow
  rows:
  - - Lot 73
    - Sealed poison bottle from the Eleanor Vale murder case, 1891
  - - Buyer
    - Grant Larceny
  - - Proposed exhibition
    - The Art of Murder
  paragraphs:
  - 'Buyer’s condition of purchase: retain original contents. Do not substitute an empty bottle or replica.'
  stamp: COLLECTION TRANSFER / ORIGINAL CONTENTS RETAINED
- number: 14
  department: MERIDIAN / CONSERVATOR’S MEMORANDUM
  title: The conservator’s objection
  paragraphs:
  - The bottle is labeled CYANIDE. Display an empty replica. I object to Grant’s demand that the original
    poison remain in the exhibition centerpiece.
  - Grant has requested a final condition inspection before the unveiling. One sealed bottle will be brought
    from the locked cupboard to the visitor-side preparation shelf during the 6:20–6:28 walkthrough, then
    locked away again. No other poison objects will be brought out.
  annotation: The west counter handles returns through a paper slot. Visitors enter from the east doorway.
  stamp: EXHIBITION APPROVAL WITHHELD
- number: 15
  department: MERIDIAN / SHOW-CONTROL CONSOLE
  title: Canceled program cue
  stamp: LIGHTING JOB LOG / NOT SECURITY LOG
  rows:
  - - '6:37'
    - Display safety alert received
  - - 6:48 cue
    - CANCELED / emergency takes priority
  - - Curtain position
    - Closed at 6:38 / safety override
  paragraphs:
  - Display mounting alert received 6:37. Alcove closed at 6:38 pending inspection. Planned 6:48 closure
    canceled.
  - Gallery outside the alcove remains open. No change to private service.
- number: 16
  department: MERIDIAN / PRIVATE SERVICE
  title: Grant Larceny’s toast
  stamp: DONOR SALON DELIVERY
  paragraphs:
  - 6:40 / Remove the blue wrapping from Grant’s glass.
  - 6:44 / Fit the clear cover and apply its numbered seal.
  - 6:46 / Check and open the seal. Pour the shared punch.
  - 6:49 / Grant’s private toast. Use the same glass throughout.
