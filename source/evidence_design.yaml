- number: 6
  department: MERIDIAN / LEGAL REVIEW
  title: Donor agreement / margin copy
  stamp: ORIGINAL OPINION
  paragraphs:
  - The proposed permanent gift remains subject to outstanding provenance review. An accession does not
    remove competing ownership claims.
  annotation: Permanent title does not cure disputed title. S.V.
