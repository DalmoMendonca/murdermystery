schema_version: 1
reports:
- id: F1
  department: MERIDIAN / BOARD SECRETARY
  title: Conditions attached to the gift
  text: Grant Larceny collapsed after the private toast and has died. Until the investigators finish their
    findings, preserve the service materials. His unsigned gift agreement would rename the museum, grant
    him acquisition vetoes, and require Artie's resignation. The related papers include a trust amendment,
    withheld invoices, disputed ownership files, and proposed cuts to education. These conditions were
    scheduled for announcement tonight.
  rows:
  - - Agreement status
    - Unsigned / awaiting acceptance
  - - Announcement
    - After the private toast
  - - Attached papers
    - Trust, budget, invoices, accession file
- id: F2
  department: MERIDIAN / PREPARATION STEWARD
  title: Reference room incident notice
  text: All gala guests were invited to the preparation walkthrough. The shared room and reference cupboard
    were open to visitors. After the walkthrough, the steward discovered the C-17 reference vial empty
    and secured the room. The vial and service materials have been preserved for comparison. The inventory
    discrepancy is being investigated. A missing reference material is not, by itself, a finding about
    the cause of death.
  rows:
  - - Visitor permission
    - All gala guests
  - - Missing material
    - Contents of the sole C-17 vial
  - - Initial action
    - Room locked; vial preserved
- id: F3
  department: MERIDIAN / PRIVATE SERVICE STEWARD
  title: The two service bells
  text: 'The initial examination found C-17 inside Grant''s coupe. The communal cordial and food controls
    were clear. Service account: The coupe arrived in blue factory film with a white crest across the
    closed seam. I guarded that package during paper deliveries. At the first bell, 6:40, I cut through
    the crest, unwrapped the coupe, and left it unattended on the service table. At the second bell, 6:44,
    I sealed a clear dome over it. I watched the intact seal until the 6:46 pour and watched the glass
    until Grant drank at 6:49. Nobody substituted a vessel. Guests delivered papers before and after the
    open period too.'
  rows:
  - - First bell / 6:40
    - Coupe unwrapped; table accessible
  - - Second bell / 6:44
    - Numbered dome seal applied
  - - '6:46'
    - Seal opened; cordial poured
  - - '6:49'
    - Grant drank from the coupe
- id: F4
  department: MERIDIAN / REFERENCE INVENTORY
  title: One vial, one missing sample
  text: The steward inspected the sole C-17 vial full and sealed when the preparation room opened at 6:20.
    It was empty at the 6:28 closure. The cupboard was accessible only during that walkthrough. Laboratory
    comparison identifies the distinctive C-17 batch in the material recovered from the coupe. The batch
    log records one sealed vial of this formulation prepared for tonight’s walkthrough. No other aliquot
    was issued. The room was locked after closure; nobody could obtain it later.
  rows:
  - - 6:20 / room opened
    - Vial full; original seal intact
  - - 6:28 / room closed
    - Vial empty; cupboard secured
  - - Source comparison
    - Unique C-17 reference batch
  appendix:
    title: Preparation department / access plan
    diagram: preparation_routes
    rows:
    - - East visitor entrance
      - Only guest route to the open shelves
    - - West return counter
      - Outside the fixed barrier; staff exchanges only
    - - Source cupboard
      - Visitor side / open 6:20–6:28
    text: The west counter is in the corridor, separated from the preparation shelves by a fixed solid
      barrier. The staff return slot passes loan papers and support sleeves; it does not give guests access
      to the cupboard. Staff did not issue or pass C-17 through that slot. Guests entering the east visitor
      door could reach the open cupboard during the walkthrough. The source was unavailable before opening
      and after closure.
- id: F5
  department: FORENSIC LABORATORY / SERVICE MATERIALS
  title: The poison was on the vessel
  photo: silver_coupe
  text: C-17 was present on the inner surface of Grant's private coupe, beneath the cordial line. The
    communal decanter, food, serving utensils, and poured cordial control were free of C-17. The coupe's
    guarded transport film excluded interior access before the first bell; the intact service dome and
    continuous watch excluded later contamination. The solution was deliberately applied directly inside
    the open coupe between the two bells, before the pour.
  rows:
  - - Coupe interior
    - C-17 detected
  - - Decanter and food
    - C-17 not detected
  - - Service dome
    - Seal intact until witnessed opening
  appendix:
    title: Packaging and receiving desk log
    diagram: packaging_seals
    rows:
    - - Transport covering
      - Blue factory film / crest crosses sealed seam
    - - Table mat
      - Blue reusable felt / stitched crest
    - - RECEIVED embossing
      - First impression at 6:45
    text: The original transport film stayed sealed until the first bell. Its factory crest crossed the
      closed seam; the recovered film bears the cut made during unwrapping. The felt mat has a stitched
      crest and no sealed seam. The receiving clerk activated the raised RECEIVED seal at 6:45, after
      the second bell and dome seal. Earlier working carbons and red-pencil corrections have no raised
      impression. Originals were embossed individually on presentation; a carbon copy is not an embossed
      original.
discoveries:
- number: 1
  department: THE MERIDIAN / BOARD SECRETARY
  title: Gift agreement
  stamp: DRAFT - NOT EXECUTED
  paragraphs:
  - 'Donor: Grant Larceny. Recipient: The Meridian Museum of Art & World Cultures.'
  - '1. Naming: The institution shall be renamed The Grant Larceny Meridian Museum.'
  - '2. Governance: The donor shall retain approval rights over future acquisitions.'
  - '3. Management: Artie Ficial shall tender his resignation within sixty days of acceptance.'
  annotation: Artie - confirm acceptance before the unveiling. G.L.
- number: 2
