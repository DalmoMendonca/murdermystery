schema_version: 1
revision: Visible evidence / plain language / The Art of Murder acquisition
status: implementation in progress
victim: Grant Larceny
fictional_material: Cyanide in a sealed historical poison bottle acquired by Grant; fictional artifact,
  murder case and laboratory comparison. No recipe or quantity.
crime:
  actor_count: 1
  actor_pool: attending characters only
  necessary_actions:
  - id: acquire_sample
    place: shared conservation preparation room
    interval:
    - 20
    - 28
    facts:
    - F2
    - F4
    explanation: The only acquired poison bottle was sealed and full when the preparation room opened
      at 6:20. It was empty when the room was locked at 6:28. It was unavailable before opening and after
      closure. The murderer personally took its contents; no accomplice or separate poison source exists
      in this fictional case.
  - id: contaminate_coupe
    place: Donor Salon
    interval:
    - 40
    - 44
    facts:
    - F3
    - F5
    explanation: The glass was inside intact blue protective wrapping under staff watch until 6:40. Its
      inside was accessible until staff covered and sealed it at 6:44. The cover stayed sealed until the
      watched 6:46 pour, followed by the 6:49 toast. The same glass was used throughout; the shared punch
      was not poisoned.
  pour: 46
  toast: 49
  common_access: All gala guests were invited to the preparation walkthrough. The preparation room was
    open to them from 6:20 to 6:28; the Donor Salon service table was unattended while the glass was uncovered.
    No role requires specialist credentials to commit the crime.
  innocent_testimony_rule: Printed innocent facts are true, including admissions of unrelated misconduct.
    Murderer facts before confession can be true or evasive but never assert a complete exclusion. Guests
    do not invent additional factual claims.
  inference_limit: Documents establish access and object custody. Scripted testimony supplies personal
    actions. Laboratory comparison is fictional case evidence, not proof that any real chemical can be
    uniquely traced to one bottle. No dosage or preparation is specified.
  immutable_public_copy: source/public_assets_lock.json
  eliminated_mechanisms:
  - thirty-source certification archive
  - BRASS clock correction
  - compulsory discovery-based alibi attachments
  source_routes:
    east_visitor: shelves accessible during walkthrough
    west_return: fixed barrier, staff paperwork exchanges only, no cyanide issued
  transport_film: Blue protective plastic wrapping with the museum logo sticker bridging its sealed seam;
    distinct from the embroidered blue cloth placemat.
  receiving_seal: Raised RECEIVED embossing first activated 6:45 after the glass cover was sealed; red-pencil working carbons
    lack raised impression.
  death: Grant becomes ill and dies at the gala shortly after the private toast. No instant-death claim,
    hospital detour or overnight story jump.
release_order:
  motive:
  - F1
  - F2
  opportunity:
  - F3
  method:
  - F4
  - F5
discovery_policy: All sixteen discoveries are opened and publicly shared during the hunt. Missing discoveries
  are supplied by the host before Act I. Necessary crime facts also appear in official releases. No finder
  has exclusive evidence.
constraints:
- Every one of thirty culprit choices must support both necessary actions.
- Each innocent excludes at least one necessary action through facts disclosed before voting.
- Each character has an unrelated scandal disclosed in both branches.
- No fixed exhibit permanently excludes a named character.
- No public role, relationship, portrait, invite, or already-sent character sheet changes.
- Coming Clean explains evidence already released; it introduces no necessary solution fact.
proof_families:
  continuous_activity: 8
  first_admission: 4
  route: 5
  guard: 7
  sequence: 6
reveal_design:
  motive: Grievances and concealed misconduct; no uniquely defensible accusation.
  opportunity: Service custody now resolves seven innocent branches. Other stories remain open until the
    source and document records arrive.
  method: Source access and document sequence resolve the remaining branches. Endings explain the already-solvable
    case.
  difficulty_measurement: Expert full-transcript solve rate is not a human solve-rate estimate. Track
    premature unique solutions, proof clarity, repeated language and actual human rehearsal separately.
poison_backstory:
  artifact: 'Lot 73: The Velvet Widow poison bottle'
  provenance: Eleanor Vale murder case, 1891; entirely fictional
  buyer: Grant Larceny
  exhibition: The Art of Murder
  conflict: Grant insisted on retaining the original contents. The conservator requested an empty replica
    and withheld exhibition approval.
  preparation: Final condition inspection before the unveiling, during the 6:20–6:28 guest walkthrough.
  discovery_documents:
    '13': Acquisition receipt with buyer’s original-contents condition
    '14': Conservator’s objection and inspection arrangements
  design_purpose: The victim’s newest acquisition becomes the murder weapon; the hazard reflects his vanity
    and disregard for museum staff rather than routine pesticide use.
