schema_version: 1
status: authored_fifteen_pairs_not_blind_tested
characters:
- id: '02'
  name: Claire O’Scuro
  agenda: Keep the bowl exhibition open while concealing an unsupported ownership claim.
  questions:
    motive: What did Grant want the exhibition to claim?
    opportunity: What did you alter in the exhibition record?
    method: What happened when you asked Grant to correct the record?
  statements:
    motive_innocent: >-
      Grant wanted OWNED BY THE MERIDIAN beneath the Isfahan Star Bowl. We had a loan and an incomplete
      transfer file. He said donors did not come to admire uncertainty. I had spent years assembling
      this exhibition, and he threatened to withdraw the centerpiece if I questioned the caption.
      I wanted the bowl to stay. I wanted the missing history less visible. Those wishes produced
      a label I knew I could not defend.
    motive_murderer: >-
      Grant demanded a museum-ownership caption beneath the bowl. The loan file did not support it.
      He said he could withdraw the object and explain whose scholarship had ruined the unveiling.
      I had built this exhibition, not his reputation. I wanted the bowl retained and the transfer
      history completed. He wanted my authority beneath his claim. I changed the caption rather
      than let years of work disappear in his next announcement.
    opportunity_innocent: >-
      I substituted the museum-ownership label and removed the lender's version from the exhibition
      file. The assistant asked if the new wording had been approved. I said it was the final label.
      That answered her question about printing, not her question about authority. I let the distinction
      pass. I also asked for the transit sheet to be kept off the public display. Its missing entry
      was inconveniently easier to explain than my new caption.
    opportunity_murderer: >-
      I installed the museum-ownership caption and took the lender's label out of the file. The
      assistant asked about approval. I said the label was final. I knew she would treat that as
      permission to use it. I kept the incomplete transit sheet off the display too. Grant had
      made the unveiling depend on wording the documents did not support. I chose to keep the
      exhibition open and deal with the supporting file afterward.
    method_innocent: >-
      He pointed to the bowl and asked if I wanted to explain an empty pedestal to his guests.
      I asked for the missing transfer entry. He offered his ownership caption instead. The full
      photograph puts my altered label beside the bowl; the poison loan's receiving label and
      retained-contents condition were unchanged. I turned a disputed loan into apparent museum
      property. I did not turn an intact poison warning into an empty-bottle assurance. The bowl
      still cannot become ours by changing its caption.
    method_murderer: >-
      At six he held the Velvet Widow original at reception and asked whether I wanted to explain
      an empty display to his guests. He loosened its neck and called the bottle his contribution
      to the exhibition. I asked for the missing transfer entry for the bowl. He offered a museum
      ownership caption instead. I changed that caption and removed the lender's version. I wanted
      the exhibition retained without his lecture about curators preferring paperwork to objects.
  coming_clean:
    innocent: >-
      I knowingly printed an ownership claim the bowl's history did not support. I concealed the
      lender's label and the missing entry. I did not steal the poison or contaminate Grant's drink.
      The source condition was not the label I changed. My exhibition needs an honest caption,
      and I need to defend why I allowed a donor to choose one for me.
    murderer: >-
      I killed Grant. I forced the cabinet, took the historical poison and contaminated his individual
      glass while service was interrupted. I left the original among returns. He never demonstrated
      it at six; the secured-storage record exposes that invention. I used our label dispute to
      put the source in his hands. I told myself I was protecting the exhibition. I protected
      nothing by turning its opening into a murder.
- id: '07'
  name: Vincent Van Faux
  agenda: Keep an undisclosed borrowed composition from becoming Grant's unveiling speech.
  questions:
    motive: What did Grant threaten to reveal about your work?
    opportunity: What did you remove or conceal before inspection?
    method: What happened when Grant questioned what you had concealed?
  statements:
    motive_innocent: >-
      Grant had the student study beside my celebrated canvas. The composition was not as original
      as the price. He wanted to present that discovery as the evening's little surprise. I asked
      him to discuss it with me privately. He offered to describe it as homage if I let him
      control the next sale. I wanted the picture turned away before he invited everyone to
      compare it with the study. A private correction had become his public entertainment.
    motive_murderer: >-
      Grant intended to unveil the student study beside my painting and let the room discover
      the resemblance. I asked for a private discussion. He offered a flattering explanation
      if I accepted his terms for the next sale. I had made the mistake; he had priced my
      silence. I wanted the painting out of view before he performed the comparison. He
      called the arrangement an opportunity. It was becoming a rather expensive one.
    opportunity_innocent: >-
      I turned the canvas against the wall and took the bottle off the studio tray. Jordan wanted
      the materials left for inspection. I said I was clearing a stain hazard. I was clearing
      the painting people would recognize and the tray that made it look like we were examining
      my process. I left the bottle beside my rolled studies. I wanted Grant's surprise delayed
      long enough to speak to the owner of the student work.
    opportunity_murderer: >-
      I turned the canvas inward and removed the studio bottle before Jordan examined the materials.
      I called it a stain hazard. The study was becoming the exhibit I had not agreed to hang,
      and I wanted the comparison postponed. I put the bottle with my rolled drawings and left
      the empty place on the tray. I was not going to give Grant a neat demonstration of
      my working method while he explained how little of it was mine.
    method_innocent: >-
      He pointed at the empty tray and asked what else I had borrowed. I told him the bottle
      was studio fixer. The tray photograph shows its label, and its retained sample is clear
      for cyanide. The canvas and student study explain what I was concealing. He had a real
      claim about the composition, not proof that the missing studio liquid poisoned him.
      I can answer for the picture without pretending its authorship is cured by his death.
    method_murderer: >-
      At six he held the Velvet Widow original beside the student study and suggested that I
      paint something whose history people would actually pay to hear. He loosened its neck
      while asking what else I had borrowed. I asked him to leave the composition dispute private.
      He offered me his terms for the next sale instead. I turned the canvas inward and removed
      my studio bottle later. I wanted his little demonstration postponed until I had spoken to him alone.
  coming_clean:
    innocent: >-
      I used the student's composition and concealed the comparison. The bottle I removed was
      fixer; its sample was clear. I did not take the poison or contaminate the drink. Grant
      had found a genuine problem with my work. I tried to keep it out of his performance
      instead of admitting it. I owe the student credit, money, and an explanation in my own voice.
    murderer: >-
      I killed Grant. I forced the cabinet, stole the poison and contaminated his separate glass,
      then left the original among returns. The earlier loan demonstration beside the study
      was invented; it conflicts with the cabinet record. I used a real dispute about the
      painting to make that scene believable. I wanted to preserve my name and made a choice
      that no credit line or sale agreement could repair.
- id: '09'
  name: Dr. Art E. Fact
  agenda: Keep a published historical error from becoming the exhibit's principal revelation.
  questions:
    motive: What did Grant want your account to leave out?
    opportunity: What did you alter in the exhibition record?
    method: What happened when you asked Grant to correct the record?
  statements:
    motive_innocent: >-
      My published account repeated a later family's version of the Velvet Widow case. The old
      coroner's record was less accommodating. Grant knew and wanted the discrepancy presented
      as my personal discovery, with his sponsorship prominently thanked. I requested the record
      and the original label. Then I withheld the correction from the display text. I intended
      to explain the error carefully. Grant preferred to reveal it while I stood beneath my own footnote.
    motive_murderer: >-
      The original case record contradicted an account I had published. Grant proposed announcing
      my correction as another benefit of his patronage. I asked to review the record and label
      before changing the exhibit. He threatened to read both versions aloud if I delayed him.
      I wanted a defensible correction. He wanted a scholar who looked grateful for being
      corrected in public. I kept the revised text out of the display file.
    opportunity_innocent: >-
      I requested the case report and the loan label, then took my correction out of the exhibit
      folder. The assistant asked whether we had checked the text. I said the references had
      been reviewed. The correction was still in my own folder. I also kept the older account
      where I could compare it without an audience. I wanted the historical problem settled
      before Grant used it to settle his argument about who should be thanked.
    opportunity_murderer: >-
      I asked for the case record and label and withdrew my correction from the display folder.
      The assistant asked if the text had been checked. I said the references had been reviewed,
      rather than explaining why the replacement page was with me. I kept the older account
      alongside it. Grant was demanding an announcement, and I wanted the two versions in front
      of me before he chose which one made me look most dependent on him.
    method_innocent: >-
      He asked why I needed the label if I had already written the history. I said I needed
      a scan of the source material I should have checked the first time. The retained request
      says SCANS, not release of the bottle; the receiving image has its unchanged condition.
      The correction concerns the historical account. I concealed a scholarly error, and the
      request shows what I asked staff to supply. It does not establish that the original
      was issued into my custody.
    method_murderer: >-
      At six he held the Velvet Widow original in front of me and asked why I needed its label
      if I had already written the history. I read it in his hands. He loosened the neck and
      asked whether the old contents made the tale more convincing. I told him my correction
      required the case record, not a demonstration. I kept the revised page out of the folder
      afterward. He wanted an unveiling before I had finished comparing the accounts.
  coming_clean:
    innocent: >-
      I published a history without checking its earliest source and concealed the correction.
      My request was for scans, not custody of the poison bottle. I did not steal its contents
      or contaminate the drink. The error can now be examined properly. I should have put the
      correction in the exhibit before Grant found a way to make correcting it part of his speech.
    murderer: >-
      I killed Grant. I forced the cabinet, took the poison and contaminated his individual glass,
      then left the original among returns. He never let me read that bottle in his hands at
      six. I invented the demonstration before the breach to turn my source knowledge into
      evidence of his handling. I had an error to correct and a humiliation to endure. Neither
      entitled me to supply this museum with a second murder history.
- id: '10'
  name: Tess Tament
  agenda: Stop Grant using family backing as authority for his personal takeover.
  questions:
    motive: What did Grant expect your family to approve?
    opportunity: What did you tell the assistant to change?
    method: What happened when you challenged Grant's announcement?
  statements:
    motive_innocent: >-
      Grant treated the Larceny name as a signature on his proposal. The family had supplied
      backing, not permission to rename the museum or remove its director. I told him he
      could withdraw his speech or explain why the backing might disappear. He suggested I
      would look ungrateful in the photographs. I suggested he stop arranging photographs
      of decisions nobody had made. I had the family's response with me, still sealed for the board.
    motive_murderer: >-
      Grant intended to announce his terms as though the entire family had approved them.
      Our backing did not authorize his takeover. I told him the announcement could cost
      him that support. He asked whether I wanted the donors hearing about a family disagreement.
      I wanted him to stop creating one for his photographer. I carried the family response
      for the board. He preferred to describe its contents without waiting for anyone to open it.
    opportunity_innocent: >-
      I called ahead and instructed the assistant to take the naming announcement out of his
      folder. She asked whether Grant had agreed. I said he needed to read the family response
      before announcing anything. That was not an answer, and I knew it. I also asked that
      the photographer wait for me. I arrived after the toast, with the response still sealed.
      I wanted the family disagreement kept out of his planned portrait, not out of the board's hands.
    opportunity_murderer: >-
      I told the assistant to remove the naming announcement and delay the photographer until
      my public entrance. She asked whether Grant had agreed. I said he needed the family's
      response before proceeding. I knew she would take that as authority to change his folder.
      The response was still sealed when I made the entrance people photographed. I wanted
      the board to read it before his caption turned our disagreement into apparent approval.
    method_innocent: >-
      He asked earlier by phone whether I intended to ruin his announcement. I told him to
      wait for the family letter. My first arrival at the museum was after he had finished
      the toast. The entrance photograph records that arrival; Casey had already collected
      and served his glass. I handed over the still-sealed response. I had used the assistant
      to interfere with his speech, but that late entrance was too late to touch the glass
      while it stood at the portrait setting.
    method_murderer: >-
      Before the portrait setting was prepared, he raised the museum-star glass engraved with
      his name and asked whether I intended to ruin his announcement. He drank while saying
      the family ought to enjoy seeing its name honored. I told him he was honoring his own
      decisions. My later photographed entrance was the public entrance, not that earlier
      private exchange. I wanted the board to receive the letter, not see another photograph
      claiming I had approved the terms he had just defended.
  coming_clean:
    innocent: >-
      I threatened the backing and changed his announcement through the assistant. I did not
      contaminate his drink; my first arrival was after it had been served and consumed.
      The family response was still sealed. Grant's death does not turn his proposal into
      ours. The board can read what we actually approved, and I can stop expecting an
      assistant to translate a family ultimatum into proper procedure.
    murderer: >-
      I killed Grant. I entered earlier, forced the cabinet and took the poison, then contaminated
      his private glass while reception was uncovered. I left the original among returns.
      The earlier drink from the engraved gift was false; the sealed order had not been opened.
      The entrance photograph showed my later public arrival, not an alibi for the entire evening.
      I wanted our family out of his control and made that wish an excuse to kill him.
- id: '14'
  name: Mona Lott
  agenda: Preserve a negotiation by hiding the intermediary in a disputed ownership chain.
  questions:
    motive: What did Grant want the exhibition to claim?
    opportunity: What did you alter in the exhibition record?
    method: What happened when you asked Grant to correct the record?
  statements:
    motive_innocent: >-
      The bowl's transfer file had a missing link and an intermediary nobody wished to introduce
      at dinner. Grant called the loan a completed cultural gift. I asked him to delay that
      phrase until the ownership questions were answered. He said I could explain why my
      delegation had participated in the earlier negotiation. I had encouraged it. I wanted
      the exhibition to continue without turning an unresolved transfer into either a triumph
      or a diplomatic accusation made over dessert.
    motive_murderer: >-
      Grant wanted me beside the bowl while he announced a completed gift. The transfer chain
      was incomplete, and I had helped negotiate through its intermediary. I asked him to
      defer the claim. He offered to explain my involvement to the donors instead. I wanted
      the negotiation preserved while the missing ownership record was found. He wanted my
      presence to stand in for that record. A flattering photograph would have concealed a rather serious question.
    opportunity_innocent: >-
      I removed the page naming the intermediary and inserted a diplomatic summary. The assistant
      asked whether this was the full transfer history. I said it was the agreed wording.
      It was wording I had agreed with myself. I wanted the delegation spared an accusation
      before we had the missing record. I also wanted my own role in the negotiation described
      after the record, rather than before it. The summary gave both of us considerably better manners than documentation.
    opportunity_murderer: >-
      I took the intermediary page out of the transfer file and replaced it with my summary.
      The assistant asked whether the account was complete. I said it was the agreed wording.
      No committee had approved that substitution. I wanted the missing record resolved before
      Grant named the intermediary and my part in the negotiation. An incomplete ownership
      chain was becoming his chance to describe everybody else's judgment while praising his own.
    method_innocent: >-
      He asked whether I preferred an empty pedestal to the gift announcement. I asked for the
      missing transfer record, and he pointed to my summary. The complete transit sheet identifies
      the Isfahan Star Bowl, not the poison loan. Its intermediary is part of an ownership
      negotiation, not a person authorized to transport that bottle from preparation. I concealed
      a genuine disputed transfer. The bowl remains on loan, and my summary has not established
      that anyone had a right to give it away.
    method_murderer: >-
      At six he held the Velvet Widow original at reception and asked whether I preferred empty
      displays to a gift announcement. He loosened the neck and said he was entitled to present
      what he had brought. I asked for the missing transfer record for the bowl. He pointed
      to my summary instead. I removed the intermediary page because I wanted the negotiation
      resolved before he performed his version of it. He wanted an audience before anyone supplied the missing link.
  coming_clean:
    innocent: >-
      I concealed the intermediary and wrote a summary that made an unresolved transfer look
      settled. The transit record concerns the bowl, not removal of the poison. I did not
      take that source or contaminate the drink. The negotiation needs the missing record,
      and the delegation needs an explanation of my substitution. Courtesy cannot supply
      ownership any more than Grant's photograph could.
    murderer: >-
      I killed Grant. I forced the cabinet, took the poison and contaminated his individual glass,
      leaving the original among returns. He did not display it to me at six. The secured
      receiving record contradicts that invented encounter. I used our real ownership dispute
      to make it sound like another demand from him. I wanted the negotiation protected from
      exposure and committed an act that no diplomatic language can defend.
- id: '15'
  name: Elon Mosaic
  agenda: Make a limited bidding account look like authority over the museum.
  questions:
    motive: What authority had Grant offered you?
    opportunity: What did you claim you could override?
    method: What happened when Grant challenged your authority?
  statements:
    motive_innocent: >-
      Grant talked about collection access as if it were a feature he could unlock for a patron.
      I had a corporate bidding authorization, not control of the museum. I had described
      it rather more enthusiastically to the other collectors. He offered to let that version
      stand if I backed his acquisition veto. I wanted a seat in the decisions. He wanted
      a wealthy endorsement that looked technologically inevitable. I did not appreciate
      becoming a demonstration account in somebody else's presentation.
    motive_murderer: >-
      I wanted authority over acquisitions, and Grant knew I had overstated what my company
      had authorized. He offered to keep quiet if I endorsed his veto. The actual account
      permitted bidding; he was selling influence. I wanted a role in the collection, not
      a photograph identifying me as the person who had funded his role in it. He called
      the arrangement scalable. Apparently only his authority was meant to scale.
    opportunity_innocent: >-
      I displayed the ADMIN screen and said I could override the restrictions. The assistant
      asked which restrictions. I said the ones holding up the deal. I let that sound wider
      than a bidding limit. Then I hid the authorization page with the corporate cap when
      someone asked what had actually been approved. I wanted my backing to look settled
      before the board considered Grant's terms. It was a screen with a grand title and a much smaller permission.
    opportunity_murderer: >-
      I brought up ADMIN and said I could override the restrictions. When the assistant asked
      which ones, I said the ones holding up the deal. I did not show her the corporate cap
      on the authorization page. I wanted the board to treat my backing as available rather
      than conditional. Grant was claiming he could deliver the collection. I was claiming
      I could deliver approval. Neither of us had handed the room the page explaining the limit.
    method_innocent: >-
      He asked me to demonstrate the override. I could change a bid limit on the auction
      dashboard, not a museum door, camera or alarm. The screen and its permission page
      show that. The cabinet was mechanically forced with its alarm active. My sales pitch
      made ADMIN sound like building control; it was not. I hid the corporate cap because
      it spoiled the impression I wanted. I could authorize a bid, not open the preparation cabinet from my phone.
    method_murderer: >-
      Before the portrait setting was prepared, he drank from his museum-star glass, with his
      name engraved beneath the star, while asking me to demonstrate my override. I showed
      the bidding screen. He said my company's approval would be quite sufficient if it
      included his acquisition terms. I kept the corporate cap off the display. I wanted
      the board to hear I could back the deal without seeing how much of that statement
      still needed a signature from someone at my company.
  coming_clean:
    innocent: >-
      I exaggerated the account and hid its cap. ADMIN meant the bidding dashboard, not
      control of museum security. I did not force the cabinet or poison the glass. I wanted
      influence I had not earned permission to exercise. The corporation will see the actual
      authorization now, and the museum can decide whether an impressive screen qualifies
      anyone to make its acquisitions.
    murderer: >-
      I killed Grant. I forced the cabinet, took the poison and contaminated his private glass
      during the gap in service. I returned the original among packing. The earlier toast
      from the engraved gift was invented; the new stock had not been opened. My exaggerated
      account was real. I used our dispute about authority to conceal a choice I had no
      authority, corporate or personal, to make.
- id: '16'
  name: Anya Tique
  agenda: Keep an old accession promise from disappearing in Grant's new ownership story.
  questions:
    motive: What did Grant want the exhibition to claim?
    opportunity: What did you alter in the exhibition record?
    method: What happened when you asked Grant to correct the record?
  statements:
    motive_innocent: >-
      The bowl was promised a home here when we still had two rooms. The promise was never
      converted into a completed accession. Grant called that ancient confusion and proposed
      giving it to us magnificently himself. I asked him to read the old letter before rewriting
      our history. He suggested the letter explained why I no longer ran the collection.
      I wanted it honored. I was not going to applaud him for solving a problem by erasing
      the person who had tried to solve it first.
    motive_murderer: >-
      Grant wanted his gift caption to replace an accession promise older than his interest
      in this museum. The promise had never become a completed transfer. I asked him to
      read it. He said an old letter did not give me current authority. He was right about
      my authority and rather selective about the letter. I wanted the bowl retained until
      that history was acknowledged, instead of returned as though none of us had ever asked for it.
    opportunity_innocent: >-
      I removed the return tag and told the porter the object could not leave. He asked who
      had authorized the hold. I said the founding collection had. The founding collection
      is not a person who can approve a shipping order. I kept the tag inside the old
      accession letter and let him go looking for a signature I did not possess. The
      current curators could consult me before treating a promise as packing material.
    opportunity_murderer: >-
      I took the return tag off and told the porter to leave the object here. When he asked
      for authority, I referred him to the founding collection. I had no current shipping
      signature. I kept the tag with the accession letter because I wanted both put before
      the trustees. Grant could not call the history irrelevant and then use a return order
      to make the object disappear before anyone read it.
    method_innocent: >-
      He asked whether I thought an old promise entitled me to stop his loan leaving. I showed
      him the letter. It concerns the bowl, and the tag belongs to its exhibition cradle.
      The ownership spread puts them together. I obstructed that return, not the poison
      original's secured-storage order. The promise still is not a completed accession.
      I want it considered honestly, which is a rather different demand from pretending
      my current authority is as extensive as my memory.
    method_murderer: >-
      At six he held the Velvet Widow original and asked whether an old promise entitled me
      to stop his loan leaving. He loosened its neck as if he meant to settle the point
      by carrying it away. I showed him the accession letter for the bowl. He called
      it an old promise and himself the present lender. I removed the bowl's return tag
      afterward. The trustees could read our original promise before he decided how the
      collection's history would depart through the loading door.
  coming_clean:
    innocent: >-
      I stopped a bowl return without authority and dressed an old promise as an accession.
      Its cradle tag was the tag I took. I did not remove the historical poison or contaminate
      the drink. The letter needs acknowledgment, not a fictitious completed transfer.
      I helped build this museum. That does not make every shipping decision mine forever.
    murderer: >-
      I killed Grant. I forced the cabinet, took its poison and contaminated his individual glass,
      then left the original among returns. He never held that loan before me at six. I
      invented the demonstration to blame his own handling before the breach. The old
      promise and the bowl tag were real. I mistook my determination to preserve a history
      for permission to end the person rewriting it.
- id: '17'
  name: Saul D. Bid
  agenda: Hide a subsidiary's fee from Grant and the auction house's clients.
  questions:
    motive: What charge did Grant refuse to accept?
    opportunity: What did you remove from the commercial paperwork?
    method: What happened when Grant challenged your charge?
  statements:
    motive_innocent: >-
      Grant disliked the second invoice page, which is where the profitable part of our assistance
      appeared. A subsidiary collected a fee I had described as a release charge. He wanted
      that page removed or its arrangement explained to the other clients. I offered a private
      review. He offered a public one during his speech. I wanted the charge settled without
      an audience bidding down the reputation of the house that had arranged it.
    motive_murderer: >-
      Grant questioned a subsidiary fee and my description of it as a release charge. He intended
      to give the donors his account unless I waived it. I proposed reviewing the invoice
      privately. He preferred a microphone and an audience that included our clients. I
      wanted the transaction completed, not turned into a demonstration of how a patron
      negotiates by humiliation. He had the second page. I wanted it back before the speech.
    opportunity_innocent: >-
      I took the second page out of the commercial folder and called the remaining invoice complete.
      The assistant asked whether the release had been paid. I said the house had handled it.
      I let her think the phrase meant more than a subsidiary fee. I also kept the client's
      copy with my papers instead of handing it over. Grant had promised a grand unveiling;
      I did not see why its smaller financial arrangements should become the opening entertainment.
    opportunity_murderer: >-
      I removed the second invoice page and kept the client's copy. The assistant asked whether
      release had been handled. I said the house had handled it. I did not explain the
      subsidiary or the scope of the charge. I wanted Grant thanking the transaction rather
      than itemizing my arrangement for everyone who might instruct us next year. The first
      page looked respectable enough without the part he wanted to read aloud.
    method_innocent: >-
      He asked what exactly my subsidiary had released. I could have shown him the complete
      invoice then. It licenses reproduction photographs; it does not sell the original
      or release it from secured storage. The loan condition stayed in force. I used a
      grander description than the service warranted and hid the page that explained it.
      The commission remains embarrassing. It is not an instruction permitting the poison
      bottle to leave its cabinet, however conveniently the word release sounded at reception.
    method_murderer: >-
      At six he held the Velvet Widow original and asked what my subsidiary had released
      that he could not handle himself. He loosened its neck while complaining about the
      fee. I asked him to keep the invoice discussion private. He wanted the second page
      ready for his speech instead. I removed it later and described the house's part
      as settled. I was not going to offer his audience a tidy catalogue of the subsidiary's
      margins while he kept their gratitude for arranging the loan.
  coming_clean:
    innocent: >-
      I concealed the subsidiary fee and overstated its purpose. The full invoice concerns
      photographs, not custody of the original. I did not steal the poison or contaminate
      Grant's drink. The house's clients can now inspect a charge I would have preferred
      to discuss quietly. I can answer for the invoice without letting a photograph license
      become an imagined transfer of a bottle.
    murderer: >-
      I killed Grant. I forced the cabinet, took the historical poison and contaminated his separate
      glass, then left the original among returns. He did not handle it for me at six.
      The receiving and opening records contradict that false demonstration. I used a real
      fee dispute to make him sound responsible for the source. I valued my clients' regard
      more than his life, and no settled invoice can disguise that calculation.
- id: '19'
  name: Reed DeLabel
  agenda: Correct a maker attribution without exposing his dependence on Grant's account.
  questions:
    motive: What did Grant want the exhibition to claim?
    opportunity: What did you alter in the exhibition record?
    method: What happened when you asked Grant to correct the record?
  statements:
    motive_innocent: >-
      Grant's account named the bowl's maker. I had built a doctoral argument around it and
      then found a reason to doubt it. He said the label could keep his version or he could
      explain how confidently I had repeated it. I asked for a correction without a public
      account of my first draft. He called that academic delicacy. I wanted the label right
      before the opening. I also wanted the room not to ask how it had become wrong.
    motive_murderer: >-
      I had used Grant's maker attribution in my research. When the evidence changed, he
      demanded that the exhibition keep his wording or discuss my dependence on it. I
      asked for a correction. He offered to introduce it by quoting my earlier confidence.
      I wanted the maker named properly and my mistake reviewed privately. He wanted the
