schema_version: 1
status: authored_innocent_rival_scenes_not_tested
scope: Eight additional innocent scenes; guilty variants and remaining roles still required.
rule: These are competing hypotheses, not promised suspicion scores or complete alibis.
characters:
- id: '01'
  name: Artie Ficial
  opportunity_question: What did you do when the board would not stop Grant's announcement?
  method_question: What authority did your order actually have?
  opportunity_innocent: >-
    I wrote HOLD DONOR SETTING on Casey's card. His assistant wanted the announcement and setting cleared.
    I refused. I said the chair wanted Grant kept waiting. She had said nothing of the kind. If the photograph
    happened first, every trustee would be explaining afterward why we had celebrated a deal we rejected.
    I kept the setting in place and went back to greeting people as though we had a deal worth celebrating.
  method_innocent: >-
    The chair rejected my order. HOLD covered the photograph and speech packet, not a private drink I had
    prepared. Her reply also refers to the job I accepted elsewhere last month. I wanted the board to
    reject Grant's terms before I left; I was not waiting for his money to rescue my career. The forged
    demand and false authority are mine. He was using the gala to settle an argument the board had not
    settled, and I tried to use it back.
  hypothesis: A deliberately held, unguarded setting could be an arranged contamination opportunity.
  payoff: The complete order and job offer explain institutional obstruction, weakening a career-destruction theory.
  residual: This does not account for every movement or eliminate deliberate individual-glass contamination.
- id: '04'
  name: Monet Bags
  opportunity_question: Why was Casey still in the kitchen after the supplier agreed to wait?
  method_question: What was actually being withheld over that charge?
  opportunity_innocent: >-
    The supplier agreed to wait. I kept Casey for the count anyway and wrote NO PRIVATE RETURNS on the
    card. Casey said the trolley was service equipment, not payment. I knew. I wanted the extra course
    counted before it disappeared and someone called the bill settled. Grant wanted his private service
    back? He could come to the kitchen and authorize it. I was tired of being the person who found money
    after he had promised to spend it.
  method_innocent: >-
    The extra course stayed in the kitchen. It was not added to the punch or served secretly to Grant.
    The count concerns food and serving hire, not the museum glass or the historical loan. The clean
    samples resolve that withheld-course suspicion. My restricted-fund transfer still faces Monday's
    audit, and Grant's death has not paid it back. I kept Casey there after the supplier had stopped
    pressing. That was my leverage, and it left someone else's reception unattended.
  hypothesis: A deliberate service gap, concealed supplier issue and financial exposure could support targeted or food-based poisoning.
  payoff: Retained food and clear samples answer the withheld-course theory; the financial problem survives the death.
  residual: The gap could still have been intended to enable contamination of one glass.
- id: '11'
  name: Barb Dwyer
  opportunity_question: Why did unexamined returns move after the officer asked you to hold them?
  method_question: What did SEARCH COMPLETE mean in your report?
  opportunity_innocent: >-
    I had the porter move the packing behind reception. The exit was filling with equipment. The officer
    asked whether we had finished searching it; we had not. I wrote SEARCH COMPLETE because the corridor
    search was finished. She meant the objects. I knew that was what she meant. Grant kept saying the
    stolen bottle had been emptied, and I used his assurance to treat this as a property problem. I had
    already approved his privacy request for the reception camera. I did not want another bad decision on paper.
  method_innocent: >-
    I told the crew we were dealing with a stolen empty bottle. That was wrong. The cabinet alarm stayed active. The camera request did not disable it. The officer's notebook records
    the forced opening and her hold request; I did not destroy either. The packing stayed on the returns
    shelf, where Jordan recovered the original after the death. My summary made the unfinished object
    search sound finished. It explains why the porter moved the load, not why anyone should believe
    Grant's empty-bottle assurance. I should have checked the loan condition before treating his word as clearance.
  hypothesis: Security suppressed observation and could facilitate theft or conceal the source among returns.
  payoff: Preserved alarm and officer records distinguish negligent clearing from disabling the theft alarm or destroying its record.
  residual: She retained relevant control and opportunity; this is intentionally a serious surviving rival case.
- id: '06'
  name: Dada DiCapo
  opportunity_question: What was supposed to happen to Grant during your canceled performance?
  method_question: Which glass belonged to that performance?
  opportunity_innocent: >-
    The script said GRANT COLLAPSES. His likeness, not his actual body. I wanted the audience to watch
    his splendid portrait fall while he toasted his generosity. I put the rehearsal glass beside the
    cue sheet and insisted the ending be restored. The crew had canceled it. I still wanted his assistant
    to see the page. Grant stole the work's credit and then requested a less upsetting interpretation.
    The upsetting interpretation was rather the point.
  method_innocent: >-
    The rehearsal glass has PROP painted on its stem. It is not the engraved gift Casey unwrapped.
    The laboratory found no cyanide in it. The portrait-collapse cue was canceled and never executed;
    the discarded script explains that threatening line. I wanted Grant alive in the audience to watch
    his own image come down. The performance and my attempt to revive it were real. Turning its title
    into an account of his actual death would give him credit for ruining the work twice.
  hypothesis: A planned collapse, threatening language and a glass placed near the ceremony suggest a staged death or poisoned prop.
  payoff: The identified clear PROP glass and canceled cue answer that particular mechanism.
  residual: Cancellation does not establish all later movements, but the apparent murder script has a coherent nonmurder purpose.
- id: '13'
  name: Frank Lloyd Wrong
  opportunity_question: Why did you retrieve a tool from the damaged-case returns?
  method_question: What had your installation plan been hiding?
  opportunity_innocent: >-
    The installation electrician put the rig tools on the returns trolley when the alcove closed. My pry bar was there beside the damaged loan case. I took
    it back before Jordan counted the tools. The rig sheet already said TOOL RETURNED. I left that
    entry alone. Grant was asking about an unsafe compromise I had approved. A missing bar beside a
    forced case was not the next item I wanted discussed. I carried the plaster model through reception
    and hoped people would ask about the model instead.
  method_innocent: >-
    The electrician's plan shows the bar's legitimate use in the rig work. Several workshop bars have
    that width; the forced latch does not identify mine. My unsafe drawing and the mounting crack were
    real, but cyanide in Grant's drink is not a failure of that joint. I retrieved an uncounted tool and
    let a false inventory entry stand. The installation still needs inspection. A chemical death is not
    permission to declare the sculpture safe.
  hypothesis: A concealed pry bar supplies forced-opening means; an unsafe installation offers a separate apparent death mechanism.
  payoff: Common tool dimensions and the chemical cause weaken the identified-tool and structural-death claims.
  residual: Legitimate tool use does not exclude a second use at the source cabinet.
- id: '12'
  name: Paige Turner
  opportunity_question: What did you take from Grant's coat that was not your recorder?
  method_question: What was on the missing page?
  opportunity_innocent: >-
    I pulled a packet from behind his coat lining. His assistant asked for it back; I called it interview
    material. My recorder was not there. The folded questions identified my auction-house source and
    asked about the retained contents of the historical loan. I took that page and returned the packet
    open. Grant had been using it to demand a name I would not give him. I found the recorder separately
    under his announcement, after I had already lied about the first packet.
  method_innocent: >-
    The page in my editor's file is the source questions, not a loan-release instruction. The auction
    worker supplied the condition; the name would identify who broke the story. The recorder contains
    Grant's demand to name that person, with gaps. It does not continuously show his setting. I searched
    his coat and misrepresented what I took. The uncut condition now reaches investigators without
    turning the source's name into the next thing Grant could hold over someone.
  hypothesis: Early source knowledge and concealed access to the victim's possessions support a source or disposal case.
  payoff: The actual questions and recorded demand explain the removal and preserve the original condition.
  residual: Source protection explains concealment but does not certify her movements or eliminate access.
- id: '28'
  name: Penny Pincher
  opportunity_question: Why did you take the donor packet toward coat check?
  method_question: What did the missing speech cards concern?
  opportunity_innocent: >-
    His assistant prepared the portrait packet. I took it toward coat check because I wanted his copy
    of the fourth family letter. The attendant refused to keep an unclaimed packet. I opened it while
    she watched and brought it back without two speech cards. Then I told the assistant I had not
    opened it. Grant was going to tell the room his version of the family sale. I preferred a version
    that did not begin with Grandfather's handwriting.
  method_innocent: >-
    The missing cards concern the family sale. The attendant did not take the packet into storage;
    she sent me straight back with it. My attorney has all four letters, including the one Grant was
    threatening to use. Taking his copy could not erase the others. I was trying to choose what people
    heard first, not dispose of the only surviving evidence. The opening and missing cards are mine.
    Grandfather's part in the sale is now rather harder to keep off the evening's program.
  hypothesis: A disguised transport attempt with the victim's packet and a family dispute could conceal material or intercept evidence.
  payoff: The retained cards, refused storage and surviving letters explain the actual packet detour.
  residual: The explanation answers that detour, not every possible possession or action.
- id: '20'
  name: Al Baster
  opportunity_question: Why did you reopen your case after the porter had moved it?
  method_question: What was the empty space in the case for?
  opportunity_innocent: >-
    I sent the rejected support away with the removal crew. That left a narrow recess in my case. I
    closed the lid, then reopened it after the porter put it with the returns. Grant's assistant asked
    if I was removing museum property. I said I was checking hardware. I was also making sure nobody
    could put the replica on my support while my crew waited for payment. I left the reopening out of
    the first collection account. The crew had already done enough work nobody intended to pay for.
  method_innocent: >-
    The crew has the support. It fits that recess; the revised drawing explains why I sent it away.
    Grant had a real complaint about my changes, and I had a real bill for the work already standing.
    I reopened the case to check the fixing plate. It was still there; I told the foreperson to take that
    too before anyone reused it. The case was not a secret compartment I made for the loan bottle.
    That explains the missing parts and my omission. It does not make
    the disputed sculpture ready to exhibit.
  hypothesis: An omitted reopening and empty case among returns provide a plausible way to transport or conceal the source.
  payoff: The retained support and drawing explain the specific recess and concealed removal dispute.
  residual: A real component does not account for every use of the case or exclude another container.
