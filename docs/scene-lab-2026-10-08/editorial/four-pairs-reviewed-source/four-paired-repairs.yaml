schema_version: 1
status: authored_four_role_pairs_not_independently_accepted
scope: >-
  These replace four weak premises with actual speaking parts. Their defensive facts
  weaken specific murder accusations, not every imaginable opportunity. They are not
  four new airtight alibis. Shared evidence additions remain draft content.
characters:
- id: '03'
  name: Hugh Bidder
  agenda: Escape a personal guarantee without admitting how badly he priced Grant's deal.
  questions:
    motive: What had you personally promised in Grant's deal?
    opportunity: What did you remove from the donor's paperwork?
    method: What happened when you challenged Grant's version of your agreement?
  statements:
    motive_innocent: >-
      I guaranteed the shortfall if Grant failed to complete his purchase. A temporary accommodation,
      I called it. Temporary is a wonderful word until someone asks for a date. Grant had the original
      agreement and intended to explain my contribution during the toast. He wanted the museum's
      gratitude; I wanted the bank to stop treating my courtesy as collateral. I asked him to amend
      the guarantee. He offered to thank me more prominently.
    motive_murderer: >-
      I guaranteed Grant's shortfall. I expected a completed purchase and my fee, not a lifetime supporting
      his enthusiasm. He kept the agreement in his announcement folder. When I asked him to amend it,
      he said everyone should know how generous I had been. Very funny. He was buying influence with
      my signature and collecting applause on the transaction. I had found him the deal. Apparently that
      made me the last person entitled to negotiate it.
    opportunity_innocent: >-
      I took the guarantee out of his folder and tore away the recourse paragraph. His assistant asked
      what I had removed. I said an obsolete duplicate. It was his signed copy. I left the purchase
      description on top so the folder still looked complete. I wanted him to read the part about the
      art and forget the part about me. One does occasionally improve a document by subtraction.
    opportunity_murderer: >-
      I removed the recourse paragraph from Grant's signed copy. His assistant asked whether the agreement
      was complete. I told her the page I took was an obsolete duplicate. The purchase description stayed
      in the folder. I wanted Grant discussing the collection rather than inviting everyone to admire
      my personal liability. He could still make his announcement. He simply did not need that particular
      paragraph to make it. I intended to negotiate the rest privately.
    method_innocent: >-
      Grant offered more public thanks instead of a release. The bank has the complete agreement. If Grant dies before completing the purchase, it calls my
      guarantee. It does not forgive it. That is the clause I tore out. I wanted a living buyer who could
      complete the deal or sign a release; now I have neither. My excellent document improvement has
      achieved nothing except making the assistant remember my hands in his folder. You may still dislike
      my fee. The bank certainly likes it better than I do tonight.
    method_murderer: >-
      Grant had already used his engraved star glass when we discussed that guarantee before the portrait
      setting was prepared. He toasted my generosity, showed me his name beneath the star, and asked
      whether I wanted mine added to the announcement. That was not a toast I enjoyed. He insisted on
      keeping the same glass for the picture. I would establish what he drank during that first conversation
      before treating every later amendment to his folder as the important event.
  coming_clean:
    innocent: >-
      I mutilated a signed agreement and lied about it. I did not remove the poison or contaminate Grant's
      drink. His death makes the guarantee payable; it does not buy me freedom from it. I was trying to
      get him to sign me out of a foolish transaction. I now owe the bank an explanation, money, and
      presumably a replacement for the paragraph everyone can still read in its copy.
    murderer: >-
      I killed Grant. I forced the preparation cabinet, took the historical poison and contaminated his
      private glass while service was interrupted. I left the original among returns. The earlier toast
      from his engraved gift never happened. I invented it to move the poisoning away from the unattended
      setting. I knew the guarantee would survive. I wanted him punished more than I wanted a profitable
      ending, and dressed that choice up as another negotiation.
- id: '08'
  name: Sue Venir
  agenda: Conceal an unauthorized legal substitution while stopping Grant from presenting a disputed gift as accepted.
  questions:
    motive: What was Grant trying to make your paperwork authorize?
    opportunity: What did you substitute in the announcement folder?
    method: What happened when you challenged Grant's version of your agreement?
  statements:
    motive_innocent: >-
      Grant wanted an announcement that sounded like a completed acquisition. The conditions had not
      been accepted. The bowl's transfer history was incomplete. He asked whether I could make the
      language less upsetting. Certainly. I could remove his name from it. He instead suggested that
      my earlier advice might interest the newspaper. I had let a summary go out before checking its
      supporting file. He wanted that embarrassment converted into my signature on his next summary.
    motive_murderer: >-
      Grant wanted my signature to do the work the ownership records could not. My earlier summary had
      gone out without the complete supporting file, and he knew it. He proposed discussing that lapse
      publicly unless I approved his announcement. He called this resolving uncertainty. I called it
      asking counsel to certify his preferred version. He had already prepared the photograph and the
      thank-you speech. Legal review was apparently the decorative ribbon around a decision he had made.
    opportunity_innocent: >-
      I replaced the proposed conditions in his announcement folder with my hold instruction. I did
      not have the board's authority to change his speech. His assistant asked if the replacement meant
      everything was cleared. I let her think so rather than explain the dispute at reception. My heading
      said HOLD ORIGINAL. I meant people to stop moving the loan and stop announcing an acquisition.
      I also wanted the incomplete summary out of the photograph. Those were two rather different concerns.
    opportunity_murderer: >-
      I substituted my hold instruction for Grant's proposed conditions. His assistant asked whether
      the folder was now ready. I said yes. The board had not authorized me to change his announcement,
      and I was not going to begin that argument beside his guests. HOLD ORIGINAL was my instruction;
      the purchase language was his. I wanted the loan kept where it belonged and the earlier incomplete
      summary kept out of public view. He could thank counsel after reading the replacement.
    method_innocent: >-
      Grant treated my hold as approval for his announcement. Read the instruction beneath the heading. Keep the loan in secured storage; no display release;
      retain its condition with the object. I signed a restriction, not permission to bring the original
      into reception. The receiving record follows that restriction. I hid the legal dispute and let
      the assistant misunderstand my substitution. That does not turn my signature into a loan release.
      My first summary needs correcting. Grant's death is not a legal finding that the museum owns what
      he promised it.
    method_murderer: >-
      Grant sealed our earlier discussion with a drink from his engraved gift glass, before Casey prepared
      the portrait setting. He showed me the name beneath the star and said at least one thing tonight
      had indisputable ownership. I declined his invitation to join him. He wanted that same glass kept
      for the photograph. My hold instruction concerned the loan. His private toast had already happened.
      I would not let a later service card stand in for the conversation I actually witnessed.
  coming_clean:
    innocent: >-
      I sent an incomplete ownership summary and then hid the dispute behind an unauthorized substitution.
      I did not authorize removal of the poison loan, take its contents or poison the gift glass. My
      signed instruction kept the original in storage and preserved its condition. That is what it says,
      however convenient the heading looked to people seeking a different permission. I still owe the
      museum a correction. I do not owe Grant a posthumous certificate of ownership.
    murderer: >-
      I killed Grant. I forced the cabinet, took the poison and contaminated his individual glass during
      the service gap. I left the original among returns. He never drank from the engraved gift during
      our earlier legal discussion. I invented that observation to place his drink before the unguarded
      setting. The hold instruction was real; I violated it myself. I knew how to describe a duty and
      chose to describe a false scene instead of admitting what I had done.
- id: '18'
  name: Elle Loominate
  agenda: Recover her family textile without admitting she dismantled its presentation and concealed its ownership paperwork.
  questions:
    motive: What was Grant claiming about your work?
    opportunity: What did you take off display without a collection record?
    method: What happened when you challenged Grant's version of your agreement?
  statements:
    motive_innocent: >-
      Grant kept calling the textile his purchase. It was family work, offered for display while we
      discussed terms. He wanted to put his name beside the embroidery and mine in smaller type beneath
      it. I refused. The dispute had already produced a canceled purchase card, but he kept using the
      old description. I wanted my work back and his announcement corrected. He offered to have someone
      steam it for the photograph. The photograph was not the problem with his offer.
    motive_murderer: >-
      Grant treated the textile as something he had acquired because he had once discussed paying for it.
      I withdrew from the deal. He still wanted it in his naming photograph. Family stitches, donor's
      name: apparently an efficient collaboration. He told me the museum could decide how to describe
      work once it was on the wall. I wanted it off the wall before that description became permanent.
      He offered to make the credit line more flattering. I wanted it accurate.
    opportunity_innocent: >-
      I unhooked the textile, folded it across my arms and took the purchase card from the mount. I left
      no signed collection record. The assistant asked whether I was removing something Grant had paid
      for. I said she should ask Grant. I could have shown her the canceled card; I kept it in my pocket
      instead. The empty mount was a rather pointed answer to his request for a picture. It also looked
      considerably more like theft than I had intended.
    opportunity_murderer: >-
      I took the textile off its mount and pocketed the purchase card. I did not sign a collection entry.
      When the assistant asked whether Grant had paid for it, I told her to ask him. I wanted him explaining
      the empty display rather than inviting people to admire his new possession. The card would have
      made the removal less dramatic. I was no longer feeling obliged to make his evening easy. I folded
      the work and left him the mount.
    method_innocent: >-
      He offered to change the credit line instead of admitting the sale had been canceled. The card
      I carried authorizes return of my textile and predates the gala. I still dismantled the display
      without telling the crew and concealed the record that would have explained it. Grant's death did
      not cancel this sale. The cancellation had already happened, and his announcement was already wrong.
    method_murderer: >-
      Before the portrait setting was prepared, Grant drank from his engraved star glass while telling
      me he would still describe the textile as part of his collection. He pointed out his name beneath
      the star as though a name settled every question of ownership. I had the canceled card with me.
      He said the photograph would look better without it. He wanted that same glass in the later picture.
      That earlier drink is missing from the service account people keep asking me to endorse.
  coming_clean:
    innocent: >-
      I removed my own work without completing the museum's collection record, then let the empty mount
      speak for me. The canceled purchase card explains that removal; it does not excuse leaving the
      crew to discover it. I did not remove the historical poison or contaminate Grant's drink. My textile
      had been released for return before the gala. I wanted a credit line corrected, not a death to
      do the work of a cancellation already on paper.
    murderer: >-
      I killed Grant. I forced the preparation cabinet, took the poison and contaminated his private
      glass during interrupted service. I left the original among returns. The earlier drink from his
      engraved gift was invented. I used it to move the administration away from the unguarded setting.
      He had not stopped claiming my work, even after I withdrew it. I decided to make him stop permanently.
      The canceled sale gave me my textile back. Nothing gave me that right over his life.
- id: '21'
  name: Ella Gance
  agenda: Keep an unaffordable pledge from exposing the borrowed backing behind her society-page generosity.
  questions:
    motive: What could Grant reveal about your donation?
    opportunity: What did you exchange in the acknowledgment folder?
    method: What happened when you challenged Grant's version of your agreement?
  statements:
    motive_innocent: >-
      Grant had my original pledge and the letter arranging its backing. The pledge looked splendid.
      My own account looked less splendid. I had found a company willing to cover the payment, on terms
      I would rather not read into a microphone. He proposed thanking both of us. I asked him to thank
      the gift and leave its financing out of the photograph. There is a difference between enjoying
      a compliment and wanting every mechanism behind it discussed over dinner.
    motive_murderer: >-
      I promised a gift I could not fund myself. Grant had the backing letter and thought the audience
      would enjoy hearing how my generosity had been assembled. I asked him to use the acknowledgment,
      not turn the financing into a little performance. He offered to thank the company as well as me.
      He knew perfectly well why I did not want that. My name had helped make his gala fashionable;
      apparently that entitled him to explain my bank balance to everyone attending it.
    opportunity_innocent: >-
      I exchanged the acknowledgment in his folder and took out the backing letter. The assistant asked
      if Grant had approved the new wording. I said he had. He had not. I also removed my original pledge
      so he could not hold it up for the photographer. The new acknowledgment still named the gift;
      it simply omitted the company that had funded it. I wanted people admiring the result, rather than
      asking to meet the considerably less glamorous person who had made it affordable.
    opportunity_murderer: >-
      I replaced the acknowledgment and removed the backing letter and original pledge. The assistant
      asked whether Grant had approved it. I said yes. I wanted the gift announced without the financing
      explained, and I did not want his photographer discovering a more entertaining page in the folder.
      Grant could still thank me. That was what the new wording allowed him to do. I expected a dispute
      about it; I did not intend to have that dispute through his chosen microphone.
    method_innocent: >-
      He insisted on thanking the company that paid, however I rewrote his acknowledgment. The payment settled before the gala. It is in the museum's receipt ledger under the backing company's
      name. Grant was not threatening to collect an unpaid gift; he was threatening to identify who paid
      it. His death does not release me from that company's terms. I changed an acknowledgment, not a
      payment instruction, and none of those papers moved the loan original out of storage. My generosity
      was real money. It was also rather more borrowed than the photograph was going to suggest.
    method_murderer: >-
      At six, Grant brought the loan original to reception while demanding that I sponsor its display.
      He wanted the acknowledgment in my name whether I approved the arrangement or not. He loosened
      the neck and said the old contents had been removed. I told him I was not going to endorse a
      demonstration I had not agreed to fund. He carried it away himself. My altered acknowledgment
      concerns the donation. That earlier demonstration is what I would want the loan account to explain.
  coming_clean:
    innocent: >-
      I borrowed the backing, concealed the company's name and lied about Grant approving the revised
      acknowledgment. The museum received the payment before tonight. I did not steal the poison or put
      it in Grant's drink. His death cannot repay the people who financed my splendid photograph. I still
      owe them, and the receipt still names them. I would prefer the society pages to begin with the
      gift, but I imagine everyone now has a rather different opening sentence in mind.
    murderer: >-
      I killed Grant. I forced the preparation cabinet, took the historical poison and contaminated
      his individual glass while it stood unattended. I left the original among returns. Grant never
      demonstrated it to me at six. I invented that scene to put the source in his hands before the
      theft. The backing letter and my altered acknowledgment were real. I could have endured the
      embarrassment of having their terms explained. I chose to silence the person threatening to explain them.
