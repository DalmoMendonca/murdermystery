schema_version: 1
status: authored_three_role_scene_prototype_not_accepted
characters:
- id: '05'
  name: Chip Patina
  agenda: Keep a backdated treatment record from destroying his authority over the collection.
  questions:
    motive: Grant was using your work against you. What did he want you to accept?
    opportunity: What did you change after staff were told to leave things alone?
    method: What was wrong with the account you gave the staff?
  statements:
    motive_innocent: >-
      Grant wanted my approval on a display I had refused to approve. He brought my own treatment report
      to the argument. I had backdated the repair entry to keep an insurer from questioning an earlier
      exhibition. He offered to keep that quiet if I stopped holding up his unveiling. I told him an
      object does not become stable because a wealthy person is bored. Then I asked for the report back.
    motive_murderer: >-
      Grant had my backdated treatment report. He wanted display approval in exchange for silence about
      the repair entry. I had spent years stopping people from damaging this collection. Tonight he
      could damage it with a signature and make my own signature the defense. I asked him to return the
      report. He folded it into his speech folder. Apparently my professional judgment was now a party favor.
    opportunity_innocent: >-
      Jordan asked me not to disturb the damaged case. I cut the caught lining loose anyway and kept the
      strip in my kit. I called it ordinary installation packing. I did not want a second piece of my work
      inspected while Grant was holding the first over me. The mounting crack then pulled me back to the
      gallery. I left Jordan with the case and a rather inaccurate account of why I had interfered.
    opportunity_murderer: >-
      Jordan asked me not to disturb the damaged case. I cut the caught lining loose and kept the strip
      in my kit. I called it ordinary installation packing. My treatment report was already in Grant's
      folder; I wanted to examine the damage before someone sent him another complaint with my name on it.
      The mounting crack pulled me back to the gallery. I left Jordan with the case. I was not going to
      let Grant blame every damaged edge in the building on my department.
    method_innocent: >-
      Grant kept calling that bottle empty, and I let him. I cut the lining after the alarm. Jordan's photograph catches it still hanging from the forced edge.
      My shears and the strip explain the later missing section, not the earlier opening. I also kept the
      loan warning out of Grant's folder because it carried the date I had altered. That was the report
      he was threatening me with. The warning should have gone to security immediately. I was protecting
      a repair record, and the collection paid for it.
    method_murderer: >-
      At six, Grant showed me that original at reception. He wanted me to approve it
      there, away from Jordan. I saw him loosen its neck himself. I told him I would not sign off on a
      demonstration involving old contents, and he laughed. My shears explain the lining; they are not
      how he opened the bottle. I kept the warning because of the altered date. Grant's demonstration
      is the part of this evening I would investigate before prosecuting a pair of conservation shears.
  coming_clean:
    innocent: >-
      I backdated a repair and withheld a warning to keep that repair from being questioned. Then I
      damaged the record of a forced case by cutting its lining. I did not remove the poison or put it
      in Grant's drink. The photograph puts my interference after the breach. My work can be reviewed
      properly now, including the work I was so determined nobody should review.
    murderer: >-
      I killed Grant. He was turning my professional mistake into permission to control the collection.
      I forced the preparation cabinet, took the historical poison and contaminated his private glass
      while service was interrupted. I left the original with the returns. Grant never demonstrated
      that bottle to me before the alarm. I invented that encounter so the damage would belong to him.
      My altered repair record was real. His cruelty was real. Neither excused what I chose to do.
- id: '23'
  name: Brie DeVivre
  agenda: Obtain payment and prevent Grant from treating additional service as a free concession.
  questions:
    motive: What was Grant getting that he had not agreed to pay for?
    opportunity: Why did the private setting lose its staff cover?
    method: Why did you refuse the replacement setting?
  statements:
    motive_innocent: >-
      Grant ordered an extra course and a private toast, then said the donor relationship should cover
      both. The donor relationship does not pay a dishwasher. I went to Monet with the charge. He wanted
      a signature; Grant wanted a photograph. I also had a supplier substitution I had failed to disclose.
      I wanted the invoice settled before anyone started examining what had actually arrived in the kitchen.
    motive_murderer: >-
      Grant kept adding service and calling it hospitality. The staff were already asking whether the
      extra hours would be paid. Monet needed his authorization, and Grant needed everyone smiling for
      the photograph. I had concealed a supplier substitution myself, which gave him something to threaten
      me with. He could refuse the invoice, expose the substitution and still expect his glass placed
      precisely where he wanted it. I had had enough of serving that arrangement.
    opportunity_innocent: >-
      I sent the reserve server's replacement back. Grant had demanded the star glass for his picture,
      and I was tired of adding unpaid changes. Then I told that server to go to the kitchen. Casey had
      already been kept there over the count. There was no kitchen task waiting for the reserve server.
      I knew reception would be uncovered. I expected Grant to notice that private service had stopped
      and finally notice the bill that came with it.
    opportunity_murderer: >-
      I sent the reserve server's replacement back. Grant demanded the star glass for his picture; an
      ordinary rental would only start another argument. I told the reserve server to go to the kitchen,
      although no task was waiting there. Casey was dealing with the count. I expected Grant to ask why
      private service had stopped. He had been using that setting as if my staff worked exclusively for
      him. I wanted him answering the invoice before we resumed the performance.
    method_innocent: >-
      The replacement was the wrong glass for his portrait order. I enforced his order while deliberately
      making service worse. Casey unwrapped the star glass; I had not supplied it from an earlier drink.
      The substitution on my invoice concerned the food supplier. The food and shared punch are clear
      for cyanide. That resolves what I was concealing on the bill. It does not make withdrawing both
      attendants a sensible decision. The crew should not have had to carry my argument with Grant.
    method_murderer: >-
      I refused the replacement because Grant had already drunk from that star glass during our invoice
      argument. I watched him use it before Casey took over the private setting. He wanted the same glass
      kept for the portrait. He showed me his name engraved under the star. Then he pointed to the extra
      course on the invoice and called it my contribution to his evening. My supplier substitution concerned
      the food. The glass I refused to replace was the one I had watched him use.
  coming_clean:
    innocent: >-
      I hid the supplier substitution and used the staff roster to fight an invoice. The food was not
      the poison source. I refused an ordinary rental because of Grant's star-glass order, then withdrew
      cover I knew reception needed. I did not contaminate his drink. That staffing decision still belongs
      to me, and so does the explanation I owe the crew.
    murderer: >-
      I killed Grant. I forced the preparation cabinet, took the poison and contaminated his individual
      glass during the service gap I helped create. The shared punch was not poisoned. I invented the
      earlier drink and insisted it was the same star glass to send the investigation backward. Casey
      really had unwrapped a new glass. The unpaid work and my hidden substitution were real; I used them
      to make my orders sound like one more catering dispute.
- id: '25'
  name: Anne E. Dote
  agenda: Stop a private donor lounge from replacing already booked education programs.
  questions:
    motive: What would accepting Grant's gift do to the people who use the museum?
    opportunity: What did you put in front of Grant instead of his announcement?
    method: What really happened when Grant's assistant read your petition?
  statements:
    motive_innocent: >-
      Two rooms, six booked classes and a donor lounge nobody had asked us to provide. Grant told me the
      children could use the gallery when it was available. That means never when someone important
      wants a photograph. I wrote a petition and added Artie's signature from an old school letter.
      Artie had not agreed. I needed the trustees to see an institutional objection, not an employee
      asking politely to keep the institution's actual work.
    motive_murderer: >-
      Grant's lounge displaced six booked classes. He offered the children space whenever the galleries
      happened to be free, as though a school timetable were a coat you could hang somewhere else. I used
      Artie's signature from an old letter on my petition. He had not agreed. Grant called it another
      thing the museum would have to forgive if we wanted his gift. I was expected to explain the lost
      classes while he took the photograph of his generosity.
    opportunity_innocent: >-
      I put the petition over the announcement at his setting. His assistant collected it and asked who
      had authorized the change. I said the director. Then I blocked the replacement announcement with
      the class bookings. That kept her there reading while I asked trustees to sign. I wanted Grant to
      discover his naming ceremony had become a discussion about children. I did not ask whether the
      director wanted his forged signature displayed quite that publicly.
    opportunity_murderer: >-
      I put the petition over the announcement at his setting. His assistant collected it and asked who
      had authorized the change. I said the director. I spread out the class bookings when she tried to
      restore the announcement and asked the trustees for signatures. Grant could wait for his ceremony.
      His assistant had my petition in her hands; I had people finally reading it. The director could
      explain why his name appeared there after we had an answer about the classrooms.
    method_innocent: >-
      Grant showed me the school letter I had copied Artie's name from. It approved six classes; it did not
      approve my petition or promise a lounge. Those bookings predate Grant's offer. My misconduct was
      trying to turn an old approval into authority for a new protest. I reached the setting when Casey
      had already taken the glass onto his service tray. I stopped the announcement, not the preparation
      of that glass. The trustees have the real letter and the petition. Grant's death has not supplied
      the program money. I would rather they read both than let the forged signature become the whole story.
    method_murderer: >-
      His assistant read my petition after the toast. Grant had already finished his drink before I
      approached his place. He put the engraved glass down and produced the school letter I had copied
      Artie's name from. Six approved classes, he said, did not give me authority over his gift. I had
      borrowed a signature; he had bought an evening. I told him the classrooms were already in use.
      He told me the children could wait. I wanted his assistant to explain that sentence to their parents.
  coming_clean:
    innocent: >-
      The classes were real. The director's endorsement was not. I used the old letter to make my protest
      harder to dismiss and disrupted the donor setting to make people read it. I did not take the poison
      or contaminate Grant's glass. His death cannot run the classes for us. I still have to answer for
      the signature and persuade the trustees to fund the work without it.
    murderer: >-
      I killed Grant. I forced the cabinet, took the historical poison and contaminated his individual
      glass while the setting was unattended. I left the original among returns. My petition interference
      happened before Casey collected the glass, not after Grant finished his toast.
      I moved the confrontation past his drink so it would sound as though I arrived too late to interfere.
      I wanted to save the education program, then made a choice
      that no classroom petition could justify.
