schema_version: 1
status: consolidated_substory_plan_not_a_player_exhibit
purpose: >-
  Replace six separate not-the-poison-paper explanations with one coherent acquisition
  dispute. Do not create an innocence certificate for each participant.
objects:
  bowl:
    name: Isfahan Star Bowl
    common_problem: Grant's publicity implies accepted museum ownership while the bowl is on loan and its transfer history is incomplete.
    common_artifacts: [Existing transit file, Actual loan-credit photograph, Proposed gift conditions]
  poison_loan:
    name: Historical original from The Velvet Widow exhibit
    common_problem: Grant says its contents were removed; the retained condition and secured receiving record say otherwise.
    common_artifacts: [Existing loan condition, Secured receiving photograph, Cabinet record]
distinct_actions:
- character: Claire O’Scuro
  action: Changes ownership language to make a premature gift look settled.
  consequence: The institution endorses a claim it has not established.
- character: Mona Lott
  action: Removes the intermediary's name from a transfer account.
  consequence: The negotiation survives at the expense of an intelligible ownership chain.
- character: Anya Tique
  action: Issues an unauthorized retention order based on an old accession promise.
  consequence: A historical promise becomes a current shipping obstruction.
- character: Reed DeLabel
  action: Changes maker attribution, not the ownership line Claire changes.
  consequence: A doctoral correction exposes dependence on Grant's account while creating a second label dispute.
- character: Justin Tyme
  action: Omits a tenant restriction from the Tulsa freight history.
  consequence: Local history becomes an unrestricted-route claim it cannot support.
- character: Faye Stop
  action: Crops the loan credit out of donor publicity.
  consequence: A real photograph promotes a misleading ownership story without showing the private gift glass.
evidence_budget:
  approach: One ownership spread can show the loan-credit photo, transit chain, and amended label together. The poison-loan evidence remains separate.
  prohibition: Do not append six retrospective police findings that each character handled a different object and therefore is innocent.
  open_issue: The owner and transfer dispute must pay off in drama as well as in distinguishing the two objects. The full thirty-role innocent branch bank remains unwritten.
