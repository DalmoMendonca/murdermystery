schema_version: 1
status: nineteen_private_scene_premises_not_speaking_parts
scope: Feasibility planning for the roles outside the eleven-character speaking prototype. These are proposals,
  not facts already planted in player evidence. None changes public copy. A motive explanation alone does
  not satisfy the requested crime mitigation.
characters:
- id: '02'
  agenda: Keep the disputed bowl on display without admitting that its export file is incomplete.
  suspicious_action: Claire substitutes a museum-ownership label and removes the lender's label from the
    exhibition file.
  innocent_payoff: The two labels and shipping record concern the Isfahan Star Bowl, not the historical
    poison loan. The actual source condition was not replaced.
  payoff_scope: Answers the apparent source-label substitution, not all access.
  shared_evidence_needed: A photograph locating the two labels beside the bowl in the ownership exhibit.
- id: '03'
  agenda: Escape a personal guarantee attached to Grant's art purchase.
  suspicious_action: Hugh tears the recourse paragraph out of the donor's copy and conceals what he personally
    guaranteed.
  innocent_payoff: The bank's retained agreement survives, and Grant's death activates Hugh's liability
    rather than canceling it.
  payoff_scope: Motive only; a relevant source or target mitigation is still missing.
  shared_evidence_needed: The complete guarantee, if this financial subplot is retained.
- id: '07'
  agenda: Prevent Grant from publishing evidence that Vincent's celebrated work is another artist's composition.
  suspicious_action: Vincent turns the disputed canvas to the wall and removes the bottle from his studio
    tray before its materials are inspected.
  innocent_payoff: It is studio FIXER, not the loan original. The retained studio sample is clear for
    cyanide; the canvas reveals the concealed composition.
  payoff_scope: Answers the specific studio-liquid poisoning theory; does not certify every movement.
  shared_evidence_needed: The actual studio tray and canvas in the same photograph, with the existing
    laboratory result.
- id: 08
  agenda: Preserve a legal arrangement Grant intends to replace publicly.
  suspicious_action: Sue removes the proposed gift conditions from the announcement folder and substitutes
    an estate instruction that looks authoritative.
  innocent_payoff: Neither paper accepts the gift. The estate instruction takes effect only after separate
    approval; Grant's death does not transfer the collection to her client.
  payoff_scope: Motive and document authority only; direct crime mitigation remains weak.
  shared_evidence_needed: The relevant condition on the unsigned gift, not a new universal legal-clearance
    certificate.
- id: 09
  agenda: Keep an attribution correction from exposing a published historical error.
  suspicious_action: Art requests the old coroner's account and the source's original label, then withholds
    a correction from the display text.
  innocent_payoff: His retained request asks for scans. The labeled original remains in the receiving
    photograph; his research copy does not establish physical custody.
  payoff_scope: Answers the claim that his requested examination was a physical release. Knowledge and
    possible trespass remain.
  shared_evidence_needed: Show the scan request beside the existing loan photograph; do not call refused
    access an alibi.
- id: '10'
  agenda: Stop Grant from replacing her family's museum influence while preserving her entrance as a social
    event.
  suspicious_action: Tess threatens to cancel family backing and orders the assistant to remove the naming
    announcement.
  innocent_payoff: She arrives after the toast with the still-sealed family response. Casey has already
    collected and served the gift glass.
  payoff_scope: Target-access mitigation from her first-arrival account, supported by a late entrance
    image; prior absence is not independently proved.
  shared_evidence_needed: A late entrance photograph supports her claimed first arrival but does not prove
    earlier absence. A fixed witness must not certify she could never have entered secretly when selected
    as murderer.
- id: '14'
  agenda: Keep the bowl's ownership dispute from embarrassing the delegation and her own negotiations.
  suspicious_action: Mona removes a shipping-file page naming the intermediary and substitutes a diplomatic
    summary.
  innocent_payoff: The complete transit record names the bowl, not the poison loan. The omitted intermediary
    concerns an ownership negotiation, not transport of the chemical source.
  payoff_scope: Answers the specific transport-document theory; broader access remains possible.
  shared_evidence_needed: The already-planned bowl shipping exhibit needs an intelligible complete counterpart.
- id: '15'
  agenda: Present a limited corporate bid as authority to control the museum's collection.
  suspicious_action: Elon displays an ADMIN screen and claims he can override the event's restrictions.
  innocent_payoff: It is the auction bidding dashboard. The account cannot control museum doors, cameras,
    or the cabinet alarm; the loan cabinet was forced mechanically.
  payoff_scope: Answers the supposed electronic-access mechanism; does not exclude physical trespass.
  shared_evidence_needed: A readable cropped bidding screen, with the existing mechanical breach and active-alarm
    record.
- id: '16'
  agenda: Keep an accession promise from disappearing into Grant's version of museum history.
  suspicious_action: Anya removes a return tag and tells the porter that the object cannot leave, without
    current authority to issue that order.
  innocent_payoff: The tag belongs to the bowl's exhibition cradle. The accession promise and the physical
    tag identify that object rather than the source bottle.
  payoff_scope: Resolves the apparent diversion of the poison source; does not excuse her unauthorized
    retention order.
  shared_evidence_needed: The tag in the bowl ownership exhibit, not another personal timeline certificate.
- id: '17'
  agenda: Conceal a subsidiary's fee and keep Grant from canceling a profitable transaction.
  suspicious_action: Saul suppresses the second invoice page and calls a reproduction charge a release
    fee.
  innocent_payoff: The complete invoice licenses photographs. It does not sell or release the loan original;
    the lender's storage condition remains in force.
  payoff_scope: Answers purported commercial custody of the source, with possible private access still
    unresolved.
  shared_evidence_needed: The invoice needs the actual licensed subject and scope, not a paragraph declaring
    Saul innocent.
- id: '18'
  agenda: Recover a family textile Grant claims as a purchase before it enters his new museum arrangement.
  suspicious_action: Elle takes the textile off its mount and pockets the purchase card instead of leaving
    a signed collection record.
  innocent_payoff: The textile and canceled purchase card explain the concealed gallery removal. They
    do not explain source access or individual-glass contamination.
  payoff_scope: Scandal only at present; a crime-related mitigation must still be designed.
  shared_evidence_needed: Do not manufacture another cloth contact with the source or glass to make this
    role relevant.
- id: '19'
  agenda: Correct an attribution without revealing how much of his doctoral argument relies on Grant's
    account.
  suspicious_action: Reed replaces a gallery label and conceals the rejected correction in his jacket.
  innocent_payoff: The rejected correction identifies the bowl's maker. The source receiving photograph
    still shows the unchanged loan label and retained-content condition.
  payoff_scope: Resolves the claimed warning-label alteration; it does not turn denied examination permission
    into proof against trespass.
  shared_evidence_needed: Place the correction beside the existing bowl labels, not in a roster of personal
    clearances.
- id: '21'
  agenda: Avoid publicly admitting she cannot afford the donation announced in her name.
  suspicious_action: Ella substitutes a donor acknowledgment and removes the pledge before the photograph.
  innocent_payoff: The promised donation was never paid. Grant's death does not erase the debt or make
    the altered acknowledgment genuine.
  payoff_scope: Motive and scandal only; relevant source or target mitigation is missing.
  shared_evidence_needed: Retain the pledge only if this subplot earns a crime-related scene. Do not insert
    a gratuitous drink accident.
- id: '22'
  agenda: Hide a sponsored review while retaining his reputation as an independent critic.
  suspicious_action: Drew removes a page headed Grant's Legacy from the press proof and refuses to explain
    why he wrote it before the death.
  innocent_payoff: The complete press proof credits the legacy text to Grant's own publicity office. Drew's
    concealed page is paid promotional copy, not a planned obituary.
  payoff_scope: Resolves the advance-death-writing accusation; physical source and target access still
    need consideration.
  shared_evidence_needed: The ordinary attribution line on the full press proof, not a retrospective statement
    that the wording was harmless.
- id: '24'
  agenda: Prevent a concealed frame crack from costing him the installation contract.
  suspicious_action: Cary marks the load undamaged and diverts the frame to returns rather than reporting
    its condition.
  innocent_payoff: The retained image shows a frame crack, while the delivered gift carton is still sealed.
    The delivery damage does not establish pre-delivery poisoning of the gift glass.
  payoff_scope: Answers the particular delivery-contamination theory; neither the trolley nor Cary has
    a continuous alibi.
  shared_evidence_needed: Use the existing gift receiving/opening record and a frame photograph; do not
    revive the miniature-fragment carrier.
- id: '26'
  agenda: Conceal a crop that helped Grant present a disputed acquisition as respectable publicity.
  suspicious_action: Faye removes the earlier donor-drink portrait from the public selection and crops
    the museum label out of the version retained for publicity.
  innocent_payoff: The full portrait shows an ordinary, unengraved rental glass and a loan credit for
    the bowl. It does not show administration to the identified engraved gift; the crop conceals the loan
    credit, not a visible poisoning.
  payoff_scope: Proposed target-identification mitigation and genuine publicity concealment. It does not
    certify other camera files, all movements, or earlier absence.
  shared_evidence_needed: The ordinary full/cropped image has been generated and inspected. The watermark-as-engraving
    mistake failed and is discarded. This replacement no longer supplies an innocent counterpart to guilty
    false encounters.
  discarded_premise: A normally placed watermark resembling a physical star on the glass. One visual experiment
    failed; do not reposition the logo or regenerate for a convenient coincidence.
- id: '27'
  agenda: Recover disputed cultural property while concealing misuse of volunteer campaign money.
  suspicious_action: Robin removes the funding page from protest brochures containing the warning RETURN
    WHAT WAS TAKEN BEFORE THE STAR GOES DARK.
  innocent_payoff: The dated earlier rally poster shows the warning referred to the bowl campaign. The
    concealed page accounts for campaign spending, not chemical acquisition.
  payoff_scope: Resolves the apparent bespoke murder warning; it does not establish an alibi or excuse
    the money misuse.
  shared_evidence_needed: One dated campaign poster in the bowl exhibit. Do not add an implausible toxin
    invoice for the nonprofit.
- id: '29'
  agenda: Keep a Tulsa property story from becoming Grant's announcement about his own generosity.
  suspicious_action: Justin removes the tenant restriction from a lease copy and presents his annotated
    map as proof of an unrestricted route.
  innocent_payoff: The full lease and map describe the old freight transfer of the bowl. They are not
    a preparation-room plan or an access authorization for the poison loan.
  payoff_scope: Answers the inferred source-route knowledge; physical opportunity and the concealed local-history
    claim remain.
  shared_evidence_needed: An understandable Tulsa freight map with the actual lease restriction. No broken
    phone or miniature accident.
- id: '30'
  agenda: Keep control of an event Grant keeps changing without paying for the changes.
  suspicious_action: Minnie restores a BLACKOUT instruction and hides the replacement cue sheet from the
    crew lead.
  innocent_payoff: The lighting plan assigns that instruction to the naming projection, not house lights,
    security, or the cabinet alarm. The restored cue was not executed.
  payoff_scope: Answers the proposed darkness or alarm-disablement mechanism while preserving her unauthorized
    interference.
  shared_evidence_needed: The existing production record needs projector and house-light channels shown
    distinctly; no technical code names required.
