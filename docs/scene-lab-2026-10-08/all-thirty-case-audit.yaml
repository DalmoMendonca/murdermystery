- id: 08
  name: Sue Venir
  guilty_cover: Grant seals his supposed legal approval with an earlier toast from the identified gift
    glass.
  family: glass_before_stock
  speaking_pair_complete: true
  route_accepted: false
  agenda: Conceal an unauthorized legal substitution while stopping Grant from presenting a disputed gift
    as accepted.
  suspicious_innocent_action: Sue substitutes an unauthorized hold instruction in the announcement folder
    and lets the assistant mistake it for clearance.
  innocent_payoff: Sue substituted a signed storage restriction for unsigned acquisition conditions. The
    original stays secured, display release is prohibited, and its condition travels with it. Her signature
    is not a source-release authorization.
  payoff_scope: Rebuts the signed-release theory; does not exclude breaking her own instruction or entering
    the preparation room.
  evidence_not_yet_planted: Existing source receiving file includes the actual hold instruction.
  small_scene_editorial_status: New paired scenes awaiting bounded causal and dialogue review; not route
    acceptance.
- id: 09
  name: Dr. Art E. Fact
  guilty_cover: Grant lets Art read the original's loan label at six while demanding changes to his historical
    account.
  family: source_before_alarm
  speaking_pair_complete: false
  route_accepted: false
  agenda: Keep an attribution correction from exposing a published historical error.
  suspicious_innocent_action: Art requests the old coroner's account and the source's original label,
    then withholds a correction from the display text.
  innocent_payoff: His retained request asks for scans. The labeled original remains in the receiving
    photograph; his research copy does not establish physical custody.
  payoff_scope: Answers the claim that his requested examination was a physical release. Knowledge and
    possible trespass remain.
  evidence_not_yet_planted: Show the scan request beside the existing loan photograph; do not call refused
