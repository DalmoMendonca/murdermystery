schema_version: 1
status: all_thirty_case_planning_not_an_accepted_edition
constraints:
- Same fixed exhibits in every selected world.
- No fixed witness certifies an unbroken alibi for a selectable murderer.
- Public copy and portraits immutable.
- No innocent-witness claim may have to change when another role is selected.
- Motive-only or unrelated-scandal payoffs remain flagged rather than called crime clearance.
rows:
- id: '01'
  name: Artie Ficial
  guilty_cover: Grant uses the original to demand display approval while discussing Artie's resignation.
  family: source_before_alarm
  speaking_pair_complete: false
  route_accepted: false
  suspicious_innocent_action: A false hold order and a screen moved beside an unguarded donor setting
    could deliberately obscure targeted contamination.
  innocent_payoff: The complete photograph locates the screen against premature naming lettering, not
    around the drink; the actual order explains the obstruction. The job offer weakens one motive rather
    than clearing the murder.
  payoff_scope: The photograph rebuts that proposed concealment mechanism, not all access or a second
    purpose for the hold.
  evidence_not_yet_planted: Existing draft reports; actual visual exhibits still required.
- id: '02'
  name: Claire O’Scuro
  guilty_cover: Grant brandishes the loan original while demanding that Claire call his disputed acquisition
    a gift.
  family: source_before_alarm
  speaking_pair_complete: false
  route_accepted: false
  agenda: Keep the disputed bowl on display without admitting that its export file is incomplete.
  suspicious_innocent_action: Claire substitutes a museum-ownership label and removes the lender's label
    from the exhibition file.
  innocent_payoff: The two labels and shipping record concern the Isfahan Star Bowl, not the historical
    poison loan. The actual source condition was not replaced.
  payoff_scope: Answers the apparent source-label substitution, not all access.
  evidence_not_yet_planted: A photograph locating the two labels beside the bowl in the ownership exhibit.
- id: '03'
  name: Hugh Bidder
  guilty_cover: Grant proposes an earlier private toast over Hugh's personal guarantee.
  family: glass_before_stock
  speaking_pair_complete: true
  route_accepted: false
  agenda: Escape a personal guarantee without admitting how badly he priced Grant's deal.
  suspicious_innocent_action: Hugh tears the recourse paragraph out of the donor's copy and conceals what
    he personally guaranteed.
  innocent_payoff: The retained bank agreement makes Hugh liable if Grant fails to complete the purchase,
    including after death. Tearing the paragraph out of one copy cannot discharge that obligation.
  payoff_scope: Reverses the assumed financial benefit of murder. It does not exclude spite or physical
    access.
  evidence_not_yet_planted: Treasury folder in the Method context items; no new continuous alibi.
  small_scene_editorial_status: New paired scenes awaiting bounded causal and dialogue review; not route
    acceptance.
- id: '04'
  name: Monet Bags
  guilty_cover: Monet claims he did not hold Casey for the count until after the toast; the kitchen count
    precedes collection and filling on the service card.
  family: count_after_toast
  speaking_pair_complete: false
  route_accepted: false
  suspicious_innocent_action: A deliberate service gap, concealed supplier issue and financial exposure
    could support targeted or food-based poisoning.
  innocent_payoff: Retained food and clear samples answer the withheld-course theory; the financial problem
    survives the death.
  payoff_scope: The gap could still have been intended to enable contamination of one glass.
  evidence_not_yet_planted: Existing draft reports; actual visual exhibits still required.
- id: '05'
  name: Chip Patina
  guilty_cover: Grant physically opens the original during Chip's display-approval argument at six.
  family: source_before_alarm
  speaking_pair_complete: true
  route_accepted: false
  suspicious_innocent_action: Chip backdates a treatment record, withholds the loan warning, and cuts
    lining from the forced case despite a preservation request.
  innocent_payoff: Post-alarm case photograph explains Chip's later lining cut; withheld warning remains
    serious.
  payoff_scope: See paired scenes and author accusation/counterstory. No exclusive clearance asserted.
  evidence_not_yet_planted: Draft reports exist; visual exhibits remain unrendered.
- id: '06'
  name: Dada DiCapo
  guilty_cover: Dada claims the engraved donor glass was used in the earlier rehearsal Grant demanded.
  family: glass_before_stock
  speaking_pair_complete: false
  route_accepted: false
  suspicious_innocent_action: A planned collapse, threatening language and a glass placed near the ceremony
    suggest a staged death or poisoned prop.
  innocent_payoff: The full rig notes identify GRANT as the portrait, and the rejected cue record and
    clear marked prop answer the apparent staged-death mechanism. This meaning is not explicitly supplied
    in the Opportunity answer.
  payoff_scope: Cancellation does not establish all later movements, but the apparent murder script has
    a coherent nonmurder purpose.
  evidence_not_yet_planted: Existing draft reports; actual visual exhibits still required.
- id: '07'
  name: Vincent Van Faux
  guilty_cover: Grant poses the original beside Vincent's suppressed student work as a proposed replacement
