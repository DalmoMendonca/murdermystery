  innocent_payoff: The gift was settled by the backing company before the gala. Ella concealed its financing,
    not an unpaid payment instruction. Her repayment obligation survives Grant.
  payoff_scope: Rebuts killing to escape an unpaid pledge. Exposure remains a motive, so this is limited
    mitigation.
  evidence_not_yet_planted: Treasury ledger, acknowledgment, and backing letter together in one retained
