schema_version: 1
status: complete_private_draft_unvalidated
scope: All thirty selectable roles, three paired acts and paired Coming Clean. No sent public copy changed.
  This is authoring completeness, not narrative acceptance or balance.
characters:
- id: '01'
  name: Artie Ficial
  agenda: Stop an unsigned takeover from being photographed as a completed gift.
  questions:
    motive: What would Grant's announcement change for the museum?
    opportunity: What did you change while Grant waited for the ceremony?
    method: What happened when you tried to stop his announcement?
  statements:
    motive_innocent: Grant wanted the museum renamed, a veto over acquisitions, and my resignation in
      sixty days. The board had signed none of it. His photographer had already been given the new lettering.
      I offered him a toast to the exhibition instead. He said the exhibition was merely the occasion.
      I have spent six years persuading people this museum matters. I was not going to host a photograph
      that made its surrender look like my greatest professional achievement.
    motive_murderer: Grant wanted my resignation wrapped in a thank-you speech. Sixty days, a new museum
      name, and his approval required whenever we bought anything. The board had not accepted those terms.
      I offered him a toast to the exhibition. He said that was not what he had paid to attend. Six years
      building this institution, and I was expected to smile while he acquired the right to dismiss me.
      His photographer was waiting for the smile.
    opportunity_innocent: 'I wrote HOLD DONOR SETTING on Casey''s card and said the chair wanted Grant
      kept waiting. She had authorized nothing. I had the portrait screen moved beside reception and stopped
      the assistant clearing his announcement. She asked if we were hiding something. Yes: the new lettering,
      until the trustees had actually decided on it. I would have preferred a private board discussion.
      Grant had selected a photographer instead, so I selected a screen.'
    opportunity_murderer: I wrote HOLD DONOR SETTING and borrowed the chair's authority without asking
      her. Then I had the portrait screen brought into reception and stopped his assistant clearing the
      announcement. She asked whether we were hiding something. I said we were preventing an unsigned
      decision from becoming tomorrow's photograph. Grant could wait for his portrait. I wanted the trustees
      discussing his conditions while he still needed something from us.
    method_innocent: He pointed at the new lettering and asked whether I wanted to be remembered as the
      director who refused his gift. I moved the screen in front of the lettering, not around his table.
      The wide photograph shows the glass setting still exposed. The chair rejected my hold order. She
      also reminded me I had accepted another job last month. I was protecting the museum's decision,
      not negotiating to keep a position I was already leaving. I still falsely spoke for her.
    method_murderer: At six he put the Velvet Widow original on his table and asked whether I wanted to
      be remembered as the director who refused his gift. I saw him loosen its neck. He called it an empty
      curiosity and asked for an unveiling, not another committee. I refused his announcement and moved
      the screen against the new lettering. His photographer could have the existing museum name until
      the board agreed to change it. My hold order used the chair's authority without permission.
  coming_clean:
    innocent: I lied about the chair's order and concealed the naming backdrop. I had already arranged
      to leave. I did not steal the poison or contaminate Grant's glass. The screen hid an unsigned museum
      name; it did not hide the drink. I owe the board an explanation for speaking in its name, and the
      institution a departure considerably less theatrical than this one.
    murderer: I killed Grant. I forced the preparation cabinet, took the historical poison, and put it
      in his individual glass while service was stopped. I left the original among returns. My story about
      his demonstration at six was false; it was still locked away then. I wanted his control of the museum
      to end, and decided that gave me control over his life. It did not.
- id: '02'
  name: Claire O’Scuro
  agenda: Keep the bowl exhibition open while concealing an unsupported ownership claim.
  questions:
    motive: What did Grant want the exhibition to claim?
    opportunity: What did you alter in the exhibition record?
    method: What happened when you asked Grant to correct the record?
  statements:
    motive_innocent: Grant wanted OWNED BY THE MERIDIAN beneath the Isfahan Star Bowl. We had a loan and
      an incomplete transfer file. He said donors did not come to admire uncertainty. I had spent years
      assembling this exhibition, and he threatened to withdraw the centerpiece if I questioned the caption.
      I wanted the bowl to stay. I wanted the missing history less visible. Those wishes produced a label
      I knew I could not defend.
    motive_murderer: Grant demanded a museum-ownership caption beneath the bowl. The loan file did not
      support it. He said he could withdraw the object and explain whose scholarship had ruined the unveiling.
      I had built this exhibition, not his reputation. I wanted the bowl retained and the transfer history
      completed. He wanted my authority beneath his claim. I changed the caption rather than let years
      of work disappear in his next announcement.
    opportunity_innocent: I substituted the museum-ownership label and removed the lender's version from
      the exhibition file. The label technician asked if the new wording had been approved. I said it
      was the final label. That answered her question about printing, not her question about authority.
      I let the distinction pass. I also asked for the transit sheet to be kept off the public display.
      Its missing entry was inconveniently easier to explain than my new caption.
    opportunity_murderer: I installed the museum-ownership caption and took the lender's label out of
      the file. The label technician asked about approval. I said the label was final. I knew she would
      treat that as permission to use it. I kept the incomplete transit sheet off the display too. Grant
      had made the unveiling depend on wording the documents did not support. I chose to keep the exhibition
      open and deal with the supporting file afterward.
    method_innocent: He pointed to the bowl and asked if I wanted to explain an empty pedestal to his
      guests. I asked for the missing transfer entry. He offered his ownership caption instead. The full
      photograph puts my altered label beside the bowl; the poison loan's receiving label and retained-contents
      condition were unchanged. I turned a disputed loan into apparent museum property. I did not turn
      an intact poison warning into an empty-bottle assurance. The bowl still cannot become ours by changing
      its caption.
    method_murderer: At six he held the Velvet Widow original at reception and asked whether I wanted
      to explain an empty display to his guests. He loosened its neck and called the bottle his contribution
      to the exhibition. I asked for the missing transfer entry for the bowl. He offered a museum ownership
      caption instead. I changed that caption and removed the lender's version. I wanted the exhibition
      retained without his lecture about curators preferring paperwork to objects.
  coming_clean:
    innocent: I knowingly printed an ownership claim the bowl's history did not support. I concealed the
      lender's label and the missing entry. I did not steal the poison or contaminate Grant's drink. The
      source condition was not the label I changed. My exhibition needs an honest caption, and I need
      to defend why I allowed a donor to choose one for me.
    murderer: I killed Grant. I forced the cabinet, took the historical poison and contaminated his individual
      glass while service was interrupted. I left the original among returns. He never demonstrated it
      at six; the secured-storage record exposes that invention. I used our label dispute to put the source
      in his hands. I told myself I was protecting the exhibition. I protected nothing by turning its
      opening into a murder.
- id: '03'
  name: Hugh Bidder
  agenda: Escape a personal guarantee without admitting how badly he priced Grant's deal.
  questions:
    motive: What had you personally promised in Grant's deal?
    opportunity: What did you remove from the donor's paperwork?
    method: What happened when you challenged Grant's version of your agreement?
  statements:
    motive_innocent: I guaranteed the shortfall if Grant failed to complete his purchase. A temporary
      accommodation, I called it. Temporary is a wonderful word until someone asks for a date. Grant had
      the original agreement and intended to explain my contribution during the toast. He wanted the museum's
      gratitude; I wanted the bank to stop treating my courtesy as collateral. I asked him to amend the
      guarantee. He offered to thank me more prominently.
    motive_murderer: I guaranteed Grant's shortfall. I expected a completed purchase and my fee, not a
      lifetime supporting his enthusiasm. He kept the agreement in his announcement folder. When I asked
      him to amend it, he said everyone should know how generous I had been. Very funny. He was buying
      influence with my signature and collecting applause on the transaction. I had found him the deal.
      Apparently that made me the last person entitled to negotiate it.
    opportunity_innocent: I took the guarantee out of his folder and tore away the recourse paragraph.
      His assistant asked what I had removed. I said an obsolete duplicate. It was his signed copy. I
      left the purchase description on top so the folder still looked complete. I wanted him to read the
      part about the art and forget the part about me. One does occasionally improve a document by subtraction.
    opportunity_murderer: I removed the recourse paragraph from Grant's signed copy. His assistant asked
      whether the agreement was complete. I told her the page I took was an obsolete duplicate. The purchase
      description stayed in the folder. I wanted Grant discussing the collection rather than inviting
      everyone to admire my personal liability. He could still make his announcement. He simply did not
      need that particular paragraph to make it. I intended to negotiate the rest privately.
    method_innocent: Grant tapped the missing paragraph and asked if I needed him to read it to the guests.
      I asked for a release, not a reading. He said that if he failed to complete the purchase, the bank
      would come to me. That is precisely what its retained copy says; his death does not forgive the
      guarantee. I tried to negotiate, then tore the clause out of his copy when he refused. Now the buyer
      is dead, my liability survives, and my marvelous amendment is evidence of my own stupidity.
    method_murderer: Before the portrait setting was prepared, Grant toasted my contribution from the
      museum-star glass with his name beneath the star. I asked for a release, not a toast. He said the
      collection was going to make both of us look generous. I told him I preferred solvent. He tapped
      the guarantee and asked whether I needed it read to the guests. That was when I decided his copy
      needed improving. I left the purchase description. He could congratulate himself without reading
      my liability into a microphone.
  coming_clean:
    innocent: I mutilated a signed agreement and lied about it. I did not remove the poison or contaminate
      Grant's drink. His death makes the guarantee payable; it does not buy me freedom from it. I was
      trying to get him to sign me out of a foolish transaction. I now owe the bank an explanation, money,
      and presumably a replacement for the paragraph everyone can still read in its copy.
    murderer: I killed Grant. I forced the preparation cabinet, took the historical poison and contaminated
      his private glass while service was interrupted. I left the original among returns. The earlier
      toast from his engraved gift never happened. I invented it to move the poisoning away from the unattended
      setting. I knew the guarantee would survive. I wanted him punished more than I wanted a profitable
      ending, and dressed that choice up as another negotiation.
- id: '04'
  name: Monet Bags
  agenda: Force authorization of unpaid service before an audit exposes a restricted-fund transfer.
  questions:
    motive: What was Grant expecting you to provide or pay for?
    opportunity: What did you change while Grant waited for the ceremony?
    method: What were your orders supposed to achieve?
  statements:
    motive_innocent: The extra course had no signed authorization. The room changes had no approved budget.
      Grant kept announcing generosity that I was expected to locate in somebody else's account. I had
      already moved restricted money to cover an earlier shortfall. Monday's audit will not admire my
      initiative. I asked him to authorize the new charge. He asked whether I wanted to spoil his evening
      over a number. The number was on an invoice with our address.
    motive_murderer: Grant promised the room changes and the extra course. I was expected to fund both
      before the applause ended. An earlier restricted-fund transfer was already going to embarrass me
      at Monday's audit; he knew about it. I asked for written authorization. He said the museum should
      be grateful for the opportunity. I have paid plenty for opportunities. This one came with a bill,
      a threat, and no signature from the person creating either.
    opportunity_innocent: The supplier agreed to wait. I kept Casey for the count anyway and wrote NO
      PRIVATE RETURNS. Casey said the trolley was equipment, not payment. I knew. I wanted the extra course
      counted before anyone called the charge settled. Grant could come to the kitchen and authorize it
      if he wanted private service back. I kept a server over a dispute the supplier had stopped pressing.
      That was leverage. It also left reception uncovered.
    opportunity_murderer: The supplier agreed to wait. I kept Casey counting and wrote NO PRIVATE RETURNS
      anyway. Casey said the trolley was not a payment. I told him nothing was leaving until the charge
      had an answer. Grant could authorize it himself rather than sending another request through the
      assistant. I wanted a count I could take to Monday's audit. I also wanted the person ordering the
      extra service to notice when that service stopped.
    method_innocent: Casey asked whether I wanted the course served or held. Held, counted, and charged
      correctly. It stayed in the kitchen. The food and punch samples are clear for cyanide; my withheld
      course was not secretly served to Grant. On the card, the count comes before collecting the gift
      glass and filling it. I created that delay. The restricted-fund transfer survives Grant, and so
      does Monday's audit. Killing the donor would not reconcile either account.
    method_murderer: Casey asked whether I wanted the course served or held. I said held and counted.
      That count was after Grant's toast, after he had finished his drink; I did not begin holding Casey
      over it before the toast. I wanted the charge reconciled rather than carried into Monday's audit
      as another surprise. I wrote NO PRIVATE RETURNS to keep the equipment with the disputed course.
      Grant's signature was still the answer I had been asking for.
  coming_clean:
    innocent: I misused restricted funds and made Casey carry my argument with Grant. The course stayed
      in the kitchen and its samples were clear. I did not put poison in the donor glass. I created a
      real coverage gap, and the audit still has a real transfer to investigate. Neither becomes somebody
      else's responsibility because Grant can no longer authorize his bill.
    murderer: I killed Grant. I forced the cabinet and took the poison, then contaminated his individual
      glass during the coverage gap. I left the original among returns. I claimed my count came after
      his drink. The service card shows it came before collection and filling. I used a financial dispute
      to make the empty post look like leverage instead of part of my plan.
- id: '05'
  name: Chip Patina
  agenda: Keep a backdated treatment record from destroying his authority over the collection.
  questions:
    motive: Grant was using your work against you. What did he want you to accept?
    opportunity: What did you change after staff were told to leave things alone?
    method: What was wrong with the account you gave the staff?
  statements:
    motive_innocent: Grant wanted my approval on a display I had refused to approve. He brought my own
      treatment report to the argument. I had backdated the repair entry to keep an insurer from questioning
      an earlier exhibition. He offered to keep that quiet if I stopped holding up his unveiling. I told
      him an object does not become stable because a wealthy person is bored. Then I asked for the report
      back.
    motive_murderer: Grant had my backdated treatment report. He wanted display approval in exchange for
      silence about the repair entry. I had spent years stopping people from damaging this collection.
      Tonight he could damage it with a signature and make my own signature the defense. I asked him to
      return the report. He folded it into his speech folder. Apparently my professional judgment was
      now a party favor.
    opportunity_innocent: Jordan asked me not to disturb the damaged case. I cut the caught lining loose
      anyway and kept the strip in my kit. I called it ordinary installation packing. I did not want a
      second piece of my work inspected while Grant was holding the first over me. The mounting crack
      then pulled me back to the gallery. I left Jordan with the case and a rather inaccurate account
      of why I had interfered.
    opportunity_murderer: Jordan asked me not to disturb the damaged case. I cut the caught lining loose
      and kept the strip in my kit. I called it ordinary installation packing. My treatment report was
      already in Grant's folder; I wanted to examine the damage before someone sent him another complaint
      with my name on it. The mounting crack pulled me back to the gallery. I left Jordan with the case.
      I was not going to let Grant blame every damaged edge in the building on my department.
    method_innocent: Grant kept calling that bottle empty, and I let him. I cut the lining after the alarm.
      Jordan's photograph catches it still hanging from the forced edge. My shears and the strip explain
      the later missing section, not the earlier opening. I also kept the loan warning out of Grant's
      folder because it carried the date I had altered. That was the report he was threatening me with.
      The warning should have gone to security immediately. I was protecting a repair record, and the
      collection paid for it.
    method_murderer: At six, Grant showed me the Velvet Widow original at reception. He wanted approval
      there, away from Jordan. I saw him loosen its neck. I refused a demonstration involving old contents,
      and he laughed about the care a bottle received compared with its lender. I kept the warning because
      it carried my altered date. Later I cut the caught lining rather than leave another piece of my
      work under inspection. I wanted the report back, not another complaint placed beside it.
  coming_clean:
    innocent: I backdated a repair and withheld a warning to keep that repair from being questioned. Then
      I damaged the record of a forced case by cutting its lining. I did not remove the poison or put
      it in Grant's drink. The photograph puts my interference after the breach. My work can be reviewed
      properly now, including the work I was so determined nobody should review.
    murderer: I killed Grant. He was turning my professional mistake into permission to control the collection.
      I forced the preparation cabinet, took the historical poison and contaminated his private glass
      while service was interrupted. I left the original with the returns. Grant never demonstrated that
      bottle to me before the alarm. I invented that encounter so the damage would belong to him. My altered
      repair record was real. His cruelty was real. Neither excused what I chose to do.
- id: '06'
  name: Dada DiCapo
  agenda: Restore an ending Grant censored after taking credit for commissioning it.
  questions:
    motive: What did Grant try to change about your work?
    opportunity: What ending were you trying to restore?
    method: What was the canceled ending supposed to do?
  statements:
    motive_innocent: 'Grant commissioned discomfort and then discovered he wanted to be comfortable. He
      crossed out my ending, kept his commissioning credit, and asked me to stand beside him for photographs.
      I offered to credit the censorship as well. He did not enjoy that revision. The ending mattered:
      the audience was supposed to see what happened to the heroic donor image when the applause stopped.
      He preferred an artist who thanked him for leaving her work unfinished.'
    motive_murderer: Grant bought a challenging work and removed the challenge. He kept his commissioning
      credit and expected my delighted face in the photograph. I suggested adding a second credit for
      interference. He threatened to withhold the remaining fee. He wanted me present as proof that the
      edited work had my approval. I had made a piece about donors buying their own images. Apparently
      I had also made a donor who wanted to buy mine.
    opportunity_innocent: I restored the crossed-out ending and signed SEND TO RIG. The page said GRANT
      COLLAPSES, followed by a blackout. I left the rehearsal glass beside it and told the assistant that
      the original ending belonged in the show. The crew had orders to cancel it. I wanted those orders
      reversed. I did not ask Grant's permission to put my work back into my work. I did ask the assistant
      whether she intended to explain the missing ending to the audience.
    opportunity_murderer: I put GRANT COLLAPSES back on the cue page and signed SEND TO RIG. The blackout
      came next. I left the rehearsal glass with the page and told the assistant we were restoring the
      ending. The crew had been instructed to cancel it; I wanted that instruction challenged before everyone
      applauded the wrong piece. Grant had already taken the commissioning credit. He could explain what
      he had removed while I explained what I had made.
    method_innocent: He wanted his portrait to remain standing when the audience left. I wanted its collapse.
      GRANT on the rig sheet means the donor portrait, not the man. The blackout was a stage cue. The
      crew did not reinstate or run that ending. The marked PROP glass they retained is clear for cyanide.
      I restored a canceled performance on paper; I did not stage a poisoning. Grant would have been alive
      to watch his flattering image fall. That was the point.
    method_murderer: He wanted his portrait to remain standing when the audience left. I wanted its collapse.
      During the earlier rehearsal, before Casey prepared the portrait setting, he drank from his museum-star
      gift glass, the one engraved with his name. He asked whether the ending was my idea of gratitude.
      I told him it was my idea of an ending. The crew canceled it anyway. I put the cue back because
      an audience should see the work it was invited to watch.
  coming_clean:
    innocent: I tried to force a canceled ending back into the show. It would have collapsed Grant's portrait,
      not Grant. The rig never ran it, and the retained prop glass was clear. I did not poison him. I
      wanted him alive, in the audience, watching what he had commissioned. The piece was supposed to
      embarrass its patron. A death is not a better performance.
    murderer: I killed Grant. I forced the cabinet, took the historical poison, and contaminated his separate
      glass during interrupted service. I returned the original among the packing. The earlier rehearsal
      drink from his engraved gift was invented; Casey had not opened the new order then. My canceled
      portrait collapse was real. I used that dispute to make an invented drink sound like another rehearsal
      argument. I cannot call what I did art.
- id: '07'
  name: Vincent Van Faux
  agenda: Keep an undisclosed borrowed composition from becoming Grant's unveiling speech.
  questions:
    motive: What did Grant threaten to reveal about your work?
    opportunity: What did you remove or conceal before inspection?
    method: What happened when Grant questioned what you had concealed?
  statements:
    motive_innocent: Grant had the student study beside my celebrated canvas. The composition was not
      as original as the price. He wanted to present that discovery as the evening's little surprise.
      I asked him to discuss it with me privately. He offered to describe it as homage if I let him control
      the next sale. I wanted the picture turned away before he invited everyone to compare it with the
      study. A private correction had become his public entertainment.
    motive_murderer: Grant intended to unveil the student study beside my painting and let the room discover
      the resemblance. I asked for a private discussion. He offered a flattering explanation if I accepted
      his terms for the next sale. I had made the mistake; he had priced my silence. I wanted the painting
      out of view before he performed the comparison. He called the arrangement an opportunity. It was
      becoming a rather expensive one.
    opportunity_innocent: I turned the canvas against the wall and took the bottle off the studio tray.
      Jordan wanted the materials left for inspection. I said I was clearing a stain hazard. I was clearing
      the painting people would recognize and the tray that made it look like we were examining my process.
      I left the bottle beside my rolled studies. I wanted Grant's surprise delayed long enough to speak
      to the owner of the student work.
    opportunity_murderer: I turned the canvas inward and removed the studio bottle before Jordan examined
      the materials. I called it a stain hazard. The study was becoming the exhibit I had not agreed to
      hang, and I wanted the comparison postponed. I put the bottle with my rolled drawings and left the
      empty place on the tray. I was not going to give Grant a neat demonstration of my working method
      while he explained how little of it was mine.
    method_innocent: He pointed at the empty tray and asked what else I had borrowed. I told him the bottle
      was studio fixer. The tray photograph shows its label, and its retained sample is clear for cyanide.
      The canvas and student study explain what I was concealing. He had a real claim about the composition,
      not proof that the missing studio liquid poisoned him. I can answer for the picture without pretending
      its authorship is cured by his death.
    method_murderer: At six he held the Velvet Widow original beside the student study and suggested that
      I paint something whose history people would actually pay to hear. He loosened its neck while asking
      what else I had borrowed. I asked him to leave the composition dispute private. He offered me his
      terms for the next sale instead. I turned the canvas inward and removed my studio bottle later.
      I wanted his little demonstration postponed until I had spoken to him alone.
  coming_clean:
    innocent: I used the student's composition and concealed the comparison. The bottle I removed was
      fixer; its sample was clear. I did not take the poison or contaminate the drink. Grant had found
      a genuine problem with my work. I tried to keep it out of his performance instead of admitting it.
      I owe the student credit, money, and an explanation in my own voice.
    murderer: I killed Grant. I forced the cabinet, stole the poison and contaminated his separate glass,
      then left the original among returns. The earlier loan demonstration beside the study was invented;
      it conflicts with the cabinet record. I used a real dispute about the painting to make that scene
      believable. I wanted to preserve my name and made a choice that no credit line or sale agreement
      could repair.
- id: 08
  name: Sue Venir
  agenda: Conceal an unauthorized legal substitution while stopping Grant from presenting a disputed gift
    as accepted.
  questions:
    motive: What was Grant trying to make your paperwork authorize?
    opportunity: What did you substitute in the announcement folder?
    method: What happened when you challenged Grant's version of your agreement?
  statements:
    motive_innocent: Grant wanted an announcement that sounded like a completed acquisition. The conditions
      had not been accepted. The bowl's transfer history was incomplete. He asked whether I could make
      the language less upsetting. Certainly. I could remove his name from it. He instead suggested that
      my earlier advice might interest the newspaper. I had let a summary go out before checking its supporting
      file. He wanted that embarrassment converted into my signature on his next summary.
    motive_murderer: Grant wanted my signature to do the work the ownership records could not. My earlier
      summary had gone out without the complete supporting file, and he knew it. He proposed discussing
      that lapse publicly unless I approved his announcement. He called this resolving uncertainty. I
      called it asking counsel to certify his preferred version. He had already prepared the photograph
      and the thank-you speech. Legal review was apparently the decorative ribbon around a decision he
      had made.
    opportunity_innocent: I replaced the proposed conditions in his announcement folder with my hold instruction.
      I did not have the board's authority to change his speech. His assistant asked if the replacement
      meant everything was cleared. I let her think so rather than explain the dispute at reception. My
      heading said HOLD ORIGINAL. I meant people to stop moving the loan and stop announcing an acquisition.
      I also wanted the incomplete summary out of the photograph. Those were two rather different concerns.
    opportunity_murderer: I substituted my hold instruction for Grant's proposed conditions. His assistant
      asked whether the folder was now ready. I said yes. The board had not authorized me to change his
      announcement, and I was not going to begin that argument beside his guests. HOLD ORIGINAL was my
      instruction; the purchase language was his. I wanted the loan kept where it belonged and the earlier
      incomplete summary kept out of public view. He could thank counsel after reading the replacement.
    method_innocent: Grant tapped my hold instruction and said he had promised the collection; I was supposed
      to tidy the language. I told him the Velvet Widow original was to stay secured, with its condition
      attached and no display release. He called that red tape. I called it the instruction I had signed.
      The receiving file carries those restrictions, not permission to take the original into reception.
      I had sent an incomplete summary and interfered with his folder. I was not going to compound that
      by signing a release.
    method_murderer: 'Before Casey prepared the portrait setting, Grant raised his museum-star glass and
      said we could at least agree the engraved name made that his property. I said ownership usually
      required a little more evidence. He drank, then tapped my hold instruction: he had promised the
      collection; I was supposed to tidy the language. I told him his proposed announcement was not my
      approved wording. He called that red tape. I replaced his conditions in the folder rather than argue
      about them in front of his guests.'
  coming_clean:
    innocent: I sent an incomplete ownership summary and then hid the dispute behind an unauthorized substitution.
      I did not authorize removal of the poison loan, take its contents or poison the gift glass. My signed
      instruction kept the original in storage and preserved its condition. That is what it says, however
      convenient the heading looked to people seeking a different permission. I still owe the museum a
      correction. I do not owe Grant a posthumous certificate of ownership.
    murderer: I killed Grant. I forced the cabinet, took the poison and contaminated his individual glass
      during the service gap. I left the original among returns. He never drank from the engraved gift
      during our earlier legal discussion. I invented that observation to place his drink before the unguarded
      setting. The hold instruction was real; I violated it myself. I knew how to describe a duty and
      chose to describe a false scene instead of admitting what I had done.
- id: 09
  name: Dr. Art E. Fact
  agenda: Keep a published historical error from becoming the exhibit's principal revelation.
  questions:
    motive: What did Grant want your account to leave out?
    opportunity: What did you alter in the exhibition record?
    method: What happened when you asked Grant to correct the record?
  statements:
    motive_innocent: My published account repeated a later family's version of the Velvet Widow case.
      The old coroner's record was less accommodating. Grant knew and wanted the discrepancy presented
      as my personal discovery, with his sponsorship prominently thanked. I requested the record and the
      original label. Then I withheld the correction from the display text. I intended to explain the
      error carefully. Grant preferred to reveal it while I stood beneath my own footnote.
    motive_murderer: The original case record contradicted an account I had published. Grant proposed
      announcing my correction as another benefit of his patronage. I asked to review the record and label
      before changing the exhibit. He threatened to read both versions aloud if I delayed him. I wanted
      a defensible correction. He wanted a scholar who looked grateful for being corrected in public.
      I kept the revised text out of the display file.
    opportunity_innocent: I requested the case report and the loan label, then took my correction out
      of the exhibit folder. The proofreader asked whether we had checked the text. I said the references
      had been reviewed. The correction was still in my own folder. I also kept the older account where
      I could compare it without an audience. I wanted the historical problem settled before Grant used
      it to settle his argument about who should be thanked.
    opportunity_murderer: I asked for the case record and label and withdrew my correction from the display
      folder. The proofreader asked if the text had been checked. I said the references had been reviewed,
