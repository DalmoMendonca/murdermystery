schema_version: 1
status: authored_eight_pairs_not_blind_tested
characters:
- id: '01'
  name: Artie Ficial
  agenda: Stop an unsigned takeover from being photographed as a completed gift.
  questions:
    motive: What would Grant's announcement change for the museum?
    opportunity: What did you change while Grant waited for the ceremony?
    method: What happened when you tried to stop his announcement?
  statements:
    motive_innocent: >-
      Grant wanted the museum renamed, a veto over acquisitions, and my resignation in sixty days.
      The board had signed none of it. His photographer had already been given the new lettering.
      I offered him a toast to the exhibition instead. He said the exhibition was merely the occasion.
      I have spent six years persuading people this museum matters. I was not going to host a photograph
      that made its surrender look like my greatest professional achievement.
    motive_murderer: >-
      Grant wanted my resignation wrapped in a thank-you speech. Sixty days, a new museum name, and
      his approval required whenever we bought anything. The board had not accepted those terms.
      I offered him a toast to the exhibition. He said that was not what he had paid to attend.
      Six years building this institution, and I was expected to smile while he acquired the right
      to dismiss me. His photographer was waiting for the smile.
    opportunity_innocent: >-
      I wrote HOLD DONOR SETTING on Casey's card and said the chair wanted Grant kept waiting.
      She had authorized nothing. I had the portrait screen moved beside reception and stopped
      the assistant clearing his announcement. She asked if we were hiding something. Yes: the
      new lettering, until the trustees had actually decided on it. I would have preferred a
      private board discussion. Grant had selected a photographer instead, so I selected a screen.
    opportunity_murderer: >-
      I wrote HOLD DONOR SETTING and borrowed the chair's authority without asking her. Then I
      had the portrait screen brought into reception and stopped his assistant clearing the announcement.
      She asked whether we were hiding something. I said we were preventing an unsigned decision
      from becoming tomorrow's photograph. Grant could wait for his portrait. I wanted the trustees
      discussing his conditions while he still needed something from us.
    method_innocent: >-
      He pointed at the new lettering and asked whether I wanted to be remembered as the director
      who refused his gift. I moved the screen in front of the lettering, not around his table.
      The wide photograph shows the glass setting still exposed. The chair rejected my hold order.
      She also reminded me I had accepted another job last month. I was protecting the museum's
      decision, not negotiating to keep a position I was already leaving. I still falsely spoke for her.
    method_murderer: >-
      At six he put the Velvet Widow original on his table and asked whether I wanted to be
      remembered as the director who refused his gift. I saw him loosen its neck. He called it
      an empty curiosity and asked for an unveiling, not another committee. I refused his announcement
      and moved the screen against the new lettering. His photographer could have the existing museum
      name until the board agreed to change it. My hold order used the chair's authority without permission.
  coming_clean:
    innocent: >-
      I lied about the chair's order and concealed the naming backdrop. I had already arranged to leave.
      I did not steal the poison or contaminate Grant's glass. The screen hid an unsigned museum name;
      it did not hide the drink. I owe the board an explanation for speaking in its name, and the
      institution a departure considerably less theatrical than this one.
    murderer: >-
      I killed Grant. I forced the preparation cabinet, took the historical poison, and put it in
      his individual glass while service was stopped. I left the original among returns. My story
      about his demonstration at six was false; it was still locked away then. I wanted his control
      of the museum to end, and decided that gave me control over his life. It did not.
- id: '04'
  name: Monet Bags
  agenda: Force authorization of unpaid service before an audit exposes a restricted-fund transfer.
  questions:
    motive: What was Grant expecting you to provide or pay for?
    opportunity: What did you change while Grant waited for the ceremony?
    method: What were your orders supposed to achieve?
  statements:
    motive_innocent: >-
      The extra course had no signed authorization. The room changes had no approved budget. Grant
      kept announcing generosity that I was expected to locate in somebody else's account. I had
      already moved restricted money to cover an earlier shortfall. Monday's audit will not admire
      my initiative. I asked him to authorize the new charge. He asked whether I wanted to spoil
      his evening over a number. The number was on an invoice with our address.
    motive_murderer: >-
      Grant promised the room changes and the extra course. I was expected to fund both before the
      applause ended. An earlier restricted-fund transfer was already going to embarrass me at Monday's
      audit; he knew about it. I asked for written authorization. He said the museum should be grateful
      for the opportunity. I have paid plenty for opportunities. This one came with a bill, a threat,
      and no signature from the person creating either.
    opportunity_innocent: >-
      The supplier agreed to wait. I kept Casey for the count anyway and wrote NO PRIVATE RETURNS.
      Casey said the trolley was equipment, not payment. I knew. I wanted the extra course counted
      before anyone called the charge settled. Grant could come to the kitchen and authorize it
      if he wanted private service back. I kept a server over a dispute the supplier had stopped
      pressing. That was leverage. It also left reception uncovered.
    opportunity_murderer: >-
      The supplier agreed to wait. I kept Casey counting and wrote NO PRIVATE RETURNS anyway.
      Casey said the trolley was not a payment. I told him nothing was leaving until the charge
      had an answer. Grant could authorize it himself rather than sending another request through
      the assistant. I wanted a count I could take to Monday's audit. I also wanted the person
      ordering the extra service to notice when that service stopped.
    method_innocent: >-
      Casey asked whether I wanted the course served or held. Held, counted, and charged correctly.
      It stayed in the kitchen. The food and punch samples are clear for cyanide; my withheld course
      was not secretly served to Grant. On the card, the count comes before collecting the gift glass
      and filling it. I created that delay. The restricted-fund transfer survives Grant, and so does
      Monday's audit. Killing the donor would not reconcile either account.
    method_murderer: >-
      Casey asked whether I wanted the course served or held. I said held and counted. That count
      was after Grant's toast, after he had finished his drink; I did not begin holding Casey over
      it before the toast. I wanted the charge reconciled rather than carried into Monday's audit
      as another surprise. I wrote NO PRIVATE RETURNS to keep the equipment with the disputed course.
      Grant's signature was still the answer I had been asking for.
  coming_clean:
    innocent: >-
      I misused restricted funds and made Casey carry my argument with Grant. The course stayed in
      the kitchen and its samples were clear. I did not put poison in the donor glass. I created
      a real coverage gap, and the audit still has a real transfer to investigate. Neither becomes
      somebody else's responsibility because Grant can no longer authorize his bill.
    murderer: >-
      I killed Grant. I forced the cabinet and took the poison, then contaminated his individual
      glass during the coverage gap. I left the original among returns. I claimed my count came
      after his drink. The service card shows it came before collection and filling. I used a
      financial dispute to make the empty post look like leverage instead of part of my plan.
- id: '06'
  name: Dada DiCapo
  agenda: Restore an ending Grant censored after taking credit for commissioning it.
  questions:
    motive: What did Grant try to change about your work?
    opportunity: What ending were you trying to restore?
    method: What was the canceled ending supposed to do?
  statements:
    motive_innocent: >-
      Grant commissioned discomfort and then discovered he wanted to be comfortable. He crossed out
      my ending, kept his commissioning credit, and asked me to stand beside him for photographs.
      I offered to credit the censorship as well. He did not enjoy that revision. The ending mattered:
      the audience was supposed to see what happened to the heroic donor image when the applause stopped.
      He preferred an artist who thanked him for leaving her work unfinished.
    motive_murderer: >-
      Grant bought a challenging work and removed the challenge. He kept his commissioning credit
      and expected my delighted face in the photograph. I suggested adding a second credit for
      interference. He threatened to withhold the remaining fee. He wanted me present as proof that
      the edited work had my approval. I had made a piece about donors buying their own images.
      Apparently I had also made a donor who wanted to buy mine.
    opportunity_innocent: >-
      I restored the crossed-out ending and signed SEND TO RIG. The page said GRANT COLLAPSES,
      followed by a blackout. I left the rehearsal glass beside it and told the assistant that
      the original ending belonged in the show. The crew had orders to cancel it. I wanted those
      orders reversed. I did not ask Grant's permission to put my work back into my work.
      I did ask the assistant whether she intended to explain the missing ending to the audience.
    opportunity_murderer: >-
      I put GRANT COLLAPSES back on the cue page and signed SEND TO RIG. The blackout came next.
      I left the rehearsal glass with the page and told the assistant we were restoring the ending.
      The crew had been instructed to cancel it; I wanted that instruction challenged before everyone
      applauded the wrong piece. Grant had already taken the commissioning credit. He could explain
      what he had removed while I explained what I had made.
    method_innocent: >-
      He wanted his portrait to remain standing when the audience left. I wanted its collapse.
      GRANT on the rig sheet means the donor portrait, not the man. The blackout was a stage cue.
      The crew did not reinstate or run that ending. The marked PROP glass they retained is clear
      for cyanide. I restored a canceled performance on paper; I did not stage a poisoning.
      Grant would have been alive to watch his flattering image fall. That was the point.
    method_murderer: >-
      He wanted his portrait to remain standing when the audience left. I wanted its collapse.
      During the earlier rehearsal, before Casey prepared the portrait setting, he drank from his
      museum-star gift glass, the one engraved with his name. He asked whether the ending was my
      idea of gratitude. I told him it was my idea of an ending. The crew canceled it anyway.
      I put the cue back because an audience should see the work it was invited to watch.
  coming_clean:
    innocent: >-
      I tried to force a canceled ending back into the show. It would have collapsed Grant's portrait,
      not Grant. The rig never ran it, and the retained prop glass was clear. I did not poison
      him. I wanted him alive, in the audience, watching what he had commissioned. The piece
      was supposed to embarrass its patron. A death is not a better performance.
    murderer: >-
      I killed Grant. I forced the cabinet, took the historical poison, and contaminated his separate
      glass during interrupted service. I returned the original among the packing. The earlier
      rehearsal drink from his engraved gift was invented; Casey had not opened the new order then.
      My canceled portrait collapse was real. I used that dispute to make an invented drink sound
      like another rehearsal argument. I cannot call what I did art.
- id: '11'
  name: Barb Dwyer
  agenda: Hide the extent of two negligent security decisions without losing control of the incident.
  questions:
    motive: What had Grant persuaded you to overlook?
    opportunity: What did you move without giving a proper account of it?
    method: What was wrong with the account you gave the staff?
  statements:
    motive_innocent: >-
      Grant requested privacy at his reception table. I approved switching off that camera. Then
      the cabinet alarm sounded. He said the stolen historical bottle was empty and wanted the
      unveiling to continue. I had already accepted one assurance I should have questioned.
      I wanted the property recovered before anyone reviewed the camera decision. He wanted the
      gala untouched by a report. I let his confidence substitute for the loan condition.
    motive_murderer: >-
      Grant asked for a private reception table, and I approved the camera request. After the cabinet
      alarm, he insisted the stolen bottle was empty. He also asked whether I wanted the trustees
      discussing why there was no reception footage. I wanted that object located before the
      incident became a review of my department. He wanted his unveiling on time. Both of us
      had reasons to make the first report sound less serious than it was.
    opportunity_innocent: >-
      I had the porter move the packing behind reception. The officer asked if we had finished
      searching it. We had not. I wrote SEARCH COMPLETE because the corridor search was finished.
      She meant the objects. I knew she meant the objects. The exit was filling with equipment,
      and I treated an allegedly empty bottle as a property problem. I did not want another
      bad decision added to the camera decision in my first report.
    opportunity_murderer: >-
      I sent the packing to the returns shelf behind reception. The officer asked whether it had
      been searched. I wrote SEARCH COMPLETE, although only the corridor search was complete.
      I knew the distinction. The exit needed clearing, Grant wanted the unveiling moving, and
      I did not want my first report to contain another decision awaiting inspection. I used
      his empty-bottle assurance to classify the incident as missing property. It made moving the load easier.
    method_innocent: >-
      The officer asked if I had checked the condition. I repeated Grant's word: empty. I had not
      checked it. The cabinet alarm stayed active; the camera request did not disable it. Her
      notebook preserves the forced opening and her instruction to hold the packing. It stayed
      on the shelf where Jordan found the original after the death. I made an unfinished object
      search sound finished. That is negligence, not proof that the alarm was secretly switched off.
    method_murderer: >-
      At six, before the cabinet alarm, Grant showed me the Velvet Widow original at reception.
      He loosened the neck while telling me it had been emptied. I told him I needed the object
      back with its case, not wandering through his drinks reception. Later I repeated his assurance
      to the officer and classified the alarm as missing property. The camera request did not
      disable the cabinet alarm. I was trying to recover something he had already handled in front of me.
  coming_clean:
    innocent: >-
      I accepted the privacy request, repeated an unchecked assurance, and moved unsearched packing.
      I did not disable the cabinet alarm, steal the poison, or poison the drink. The officer's
      notes survive my misleading summary. The original was found where the packing remained.
      That does not make my report good policing. It makes my failures available for investigation.
    murderer: >-
      I killed Grant. I forced the cabinet, stole the poison and contaminated his individual glass
      while reception was uncovered. I left the original among the returns I moved. He did not
      show it to me at six; it was secured then. I invented that observation to make him the
      handler and my summary a reaction to his mistake. I used my authority to conceal my own crime.
- id: '12'
  name: Paige Turner
  agenda: Protect a vulnerable auction-house source from Grant's demand for a name.
  questions:
    motive: What did Grant want you to keep quiet?
    opportunity: What did you take without giving a proper account of it?
    method: What did the missing page actually contain?
  statements:
    motive_innocent: >-
      An auction-house worker gave me the loan condition: the contents had been retained. Grant
      wanted the worker's name before he answered my questions about the gift. I refused.
      He had my recorder and a copy of those questions. He said he could identify the source
      from the wording. I wanted both back. Protecting a source is my job. I was not going
      to let him turn an interview into a disciplinary hearing for someone who had helped me.
    motive_murderer: >-
      Grant wanted the name behind my loan questions. An auction-house worker had supplied the
      condition, and he threatened to find out who. He had my recorder and a copy of the questions.
      I refused to name anyone. He said we could discuss the gift once I became cooperative.
      I wanted my material returned and the worker left alone. He could answer questions about
      his own conduct without being given somebody else to punish for them.
    opportunity_innocent: >-
      I pulled a packet from behind his coat lining. His assistant asked for it back; I called
      it interview material. My recorder was not there. The folded questions identified the
      auction-house source and asked about retained contents. I took that page and returned
      the packet open. I found the recorder separately, under his announcement, after I had
      already misrepresented the first packet. I did not want the assistant reading a page
      that could identify the person Grant was threatening.
    opportunity_murderer: >-
      I took the packet behind his coat lining and told his assistant it was my interview material.
      That was not a complete description. My recorder was missing; the questions naming the
      auction-house source were there. I kept that page and returned the packet open. Then I
      found the recorder beneath the announcement. I wanted the worker's identity out of his
      hands before he called the auction house. I did not ask the assistant to approve that decision.
    method_innocent: >-
      He pointed at the questions and said he could work out who had written to me. I took the
      page because of that threat. The editor's copy contains interview questions, not a release
      for the original. The recorded exchange includes his demand for a name; its gaps are not
      a record of my movements. The complete loan condition can reach investigators without the
      worker's identity. I searched a coat and hid a page. I did not give the museum permission
      to bring that bottle out of storage.
    method_murderer: >-
      At six, before the cabinet alarm, he held up the Velvet Widow original while asking who had
      supplied my questions. I read its label in his hand. He loosened the neck and called the
      retained-contents line an old formality. I said he could explain that without naming my
      source. The recorder has gaps because I stopped it while the worker's identity was being
      discussed. I kept the questions so his assistant could not pass that name on for him.
  coming_clean:
    innocent: >-
      I concealed a page and misrepresented what I took from his coat. The page identifies a
      source; it does not authorize physical release of the loan. I did not steal the poison
      or contaminate his drink. My editor has the uncut condition. I will answer for the search
      and the gaps in the recording without volunteering someone else for Grant's unfinished retaliation.
    murderer: >-
      I killed Grant. I forced the cabinet, took the poison, contaminated his individual glass,
      and left the original among returns. He never held it up at six. The secured-storage record
      contradicts the demonstration I invented. I used a real threat against my source to make
      that false encounter sound like reporting. Protecting someone did not entitle me to kill
      the person threatening them. That was my choice, not my profession.
- id: '13'
  name: Frank Lloyd Wrong
  agenda: Retrieve an uncounted tool before an unsafe installation compromise is examined.
  questions:
    motive: What had Grant refused to change about the installation?
    opportunity: What did you remove or reopen after the loan case was damaged?
    method: What did your concealed work have to do with the damaged case?
  statements:
    motive_innocent: >-
      Grant wanted the alcove enlarged after the rig had been specified. I approved a compromise
      I should have refused. The mounting crack made it rather less theoretical. He said an
      architect ought to accommodate a patron's vision. The vision needed a structural engineer
      and a new budget. I wanted the unsafe detail replaced before guests admired it. He wanted
      my drawing treated as the reason nobody needed to discuss his late change.
    motive_murderer: >-
      Grant changed the alcove and expected my signed drawing to absorb the consequences.
      I approved a compromise; the mounting crack put it on public display. He refused the
      additional work and said the signature was mine. I wanted the detail replaced before
      the unveiling. He wanted the room open without another bill. I had designed a dramatic
      reveal. I had not intended the revealed thing to be my own liability.
    opportunity_innocent: >-
      The electrician put the rig tools on the returns trolley when the alcove closed. My bar
      was beside the damaged case. I took it back before Jordan counted the tools. The rig sheet
      already said TOOL RETURNED; I left it alone. An uncounted bar beside a forced case was
      not the next item I wanted attached to my drawing. I carried the plaster model through
      reception and encouraged people to admire something that had not cracked.
    opportunity_murderer: >-
      I retrieved my bar from the trolley before Jordan counted its contents. The electrician
      had put the installation tools there when the alcove closed. TOOL RETURNED was already
      on the rig sheet, and I did not correct it. Grant was questioning the mounting compromise.
      I did not want an uncounted tool beside a damaged loan case becoming the second question
      about my work. I took the plaster model into reception. People usually prefer a model to an inventory.
    method_innocent: >-
      Grant pointed to the crack and asked whether that was my idea of a finished installation.
      I asked him to approve the repair he had refused. The electrician's plan shows the bar
      used in the rig; several workshop bars have the same width. The latch cannot identify mine.
      The drawing still needs investigation, but Grant died from cyanide in a drink, not that
      failed joint. I concealed a tool return and an unsafe detail. Neither should be declared safe tonight.
    method_murderer: >-
      At six, Grant set the Velvet Widow original beside my support and asked whether that was
      my idea of an exhibition. I saw him loosen the neck as he lectured me about letting patrons
      see the object. I asked him to approve the repair, not redesign it with the loan in his hands.
      Later I took the bar off the returns trolley and let TOOL RETURNED stand. I wanted my
      unsafe detail corrected before it became the centerpiece of his criticism.
  coming_clean:
    innocent: >-
      I approved an unsafe compromise and concealed an uncounted tool return. I did not force
      the poison cabinet or contaminate Grant's glass. A common bar width is not an identification,
      and a chemical death is not a collapsed joint. The installation must still be inspected.
      I cannot use a murder investigation as a certificate for the work I was avoiding discussing.
    murderer: >-
      I killed Grant. I forced the cabinet, took the poison, and contaminated his separate glass
      during the service interruption. I returned the original among the packing. He never
      demonstrated it beside my support at six. I invented that scene to put it in his hands
      before the alarm. The unsafe drawing and concealed tool were real, but I made the fatal
      decision myself. No late change from a patron required it.
- id: '20'
  name: Al Baster
  agenda: Prevent unpaid reuse of a rejected support while hiding an omitted case reopening.
  questions:
    motive: What was Grant trying to use without your agreement?
    opportunity: What did you remove or reopen after the loan case was damaged?
    method: What was the empty space in your case for?
  statements:
    motive_innocent: >-
      Grant rejected the support and still wanted it under the display. He said the piece would
      benefit from being seen at his unveiling. The crew preferred being paid. I sent the
      support away rather than let an unpaid concession become the approved installation.
      He could criticize the work or use it. I did not see why he should do both while my
      invoice waited for a signature. His assistant kept asking what would stand there without it.
    motive_murderer: >-
      Grant called the support unsuitable, then expected it installed for his photograph.
      He offered exposure. My crew had already been exposed to lifting it. I wanted the work
      paid for before it was used again. He threatened to call the whole commission a mistake
      in front of the donors. I sent the support away. If he wanted an empty mount to explain
      his standards, I was happy to supply one without further labor charges.
    opportunity_innocent: >-
      The crew took the support, leaving a recess in my case. I closed it, then reopened it
      after the porter put it with the returns. The assistant asked if I was removing museum
      property. I said I was checking hardware. I was also preventing anyone from installing
      something on my support while the crew waited for payment. I omitted the reopening
      from the collection account. I did not want the remaining plate quietly becoming another unpaid installation.
    opportunity_murderer: >-
      I sent the support with the crew and reopened the case after the porter put it among
      returns. The assistant asked if I was taking museum property. I said I was checking
      hardware. The fixing plate was still there. I told the foreperson to collect that too
      so nobody could complete the installation without us. I left the reopening out of my
      account. Grant could discuss his unpaid commission without adding a second dispute over its parts.
    method_innocent: >-
      Grant asked what the empty recess was supposed to prove. I told him to ask the crew,
      who had the support that fits it. The plate was still in the case when I reopened it;
      my renewed instruction sent that after the support. Both parts and the drawing are
      retained. I concealed a collection entry, not a compartment designed for the loan bottle.
      He had a complaint about my changes; I had a bill. Removing the hardware did not settle either.
    method_murderer: >-
      At six, Grant set the Velvet Widow original on the support and asked what my objections
      were supposed to prove. He loosened its neck and said an exhibition required an object,
      not my permission. I told him the crew still needed payment. He carried the original
      away himself. The crew took the support later, leaving the recess people saw in my case.
      I reopened it for the remaining plate and sent that away too, rather than let him reuse the installation.
  coming_clean:
    innocent: >-
      I withdrew the support and plate, omitted the reopening, and made the crew enforce my invoice.
      Their retained parts fit the case. I did not take the poison original or contaminate the
      drink. That case was made to move sculpture hardware. The commission and the unpaid work
      still need resolving, preferably before someone offers my crew another opportunity to be admired.
    murderer: >-
      I killed Grant. I forced the cabinet, stole the poison, and contaminated his individual glass
      while the setting was unattended. I left the original among returns. He did not demonstrate
      it on my support at six. I made up that earlier handling to move the source into his hands.
      The withdrawn support and my hidden reopening were real. I turned a dispute about my work
      into a crime that no invoice or insult could justify.
- id: '28'
  name: Penny Pincher
  agenda: Keep a family sale letter from being used as a humiliating donor speech.
  questions:
    motive: What personal dispute were you trying to settle tonight?
    opportunity: What did you move without giving a proper account of it?
    method: What did the missing speech cards actually contain?
  statements:
    motive_innocent: >-
      Grant had Grandfather's fourth letter about the Northstar sale. He proposed reading it
      to explain why he deserved everybody's gratitude for the collection. The handwriting
      was Grandfather's; the flattering interpretation was Grant's. I offered him a shorter
      history. He said families often preferred those. I wanted his copy before he delivered
      it into a microphone. One can concede an ancestor was difficult without donating him
      to someone else's gala entertainment.
    motive_murderer: >-
      Grant meant to read Grandfather's fourth letter into his speech. It complicated the sale,
      but he intended to make it sound as if my family had personally required his magnificent
      rescue. I offered a less theatrical account. He asked whether I wanted the audience
      to hear the entire letter. I wanted his copy. I had already paid an attorney to read
      our family history carefully; I did not need Grant performing it selectively.
    opportunity_innocent: >-
      The assistant prepared the portrait packet. I took it toward coat check, looking for
      the fourth letter. The attendant refused an unclaimed packet. I opened it while she
      watched and returned it without two speech cards. Then I told the assistant I had not
      opened it. Grant was going to tell his version of the family sale. I preferred a
      version that did not begin with his voice reading Grandfather's handwriting.
    opportunity_murderer: >-
      I took the portrait packet to coat check. The attendant would not keep it without a name.
      I opened it there and removed two speech cards, then brought it back. When the assistant
      asked whether I had opened it, I said no. I wanted the fourth family letter before
      Grant used it in his speech. The cards made rather clear what he intended to say.
      I was not going to carry his interpretation back untouched simply because storage was refused.
    method_innocent: >-
      The attendant asked whether the packet belonged to me. I said it concerned my family.
      She watched me open it and sent me back during portrait preparation. The cards concern
      the family sale, not instructions for handling the loan. My attorney has all four letters.
      Removing Grant's copy could not erase the history; it could only change what he read first.
      I hid the opening and kept the cards. I was trying to choose the account, not destroy the only evidence.
    method_murderer: >-
      The attendant asked whether the packet belonged to me. I said it concerned my family.
      This was after Grant had finished his toast and his drink; that was when I first
      approached his setting for the packet. She watched me open it and sent me back.
      The cards concern the family sale. I wanted his chosen interpretation out of the next
      speech. I returned the packet without them and denied opening it, because the assistant
      would have restored exactly the account I had removed.
  coming_clean:
    innocent: >-
      I took the cards, concealed the opening, and tried to edit my grandfather's reputation.
      The originals survive with my attorney. Coat check never stored the packet, and its
      missing pages concern the sale, not release of the poison. I did not contaminate Grant's
      drink. Our family history is going to be discussed now. I would still prefer it read
      completely, even the part I had hoped nobody would begin with.
    murderer: >-
      I killed Grant. I forced the cabinet, took the poison, contaminated his individual glass,
      and returned the original among the packing. My packet detour happened during portrait
      preparation, before he drank, not afterward. Coat check's account exposes that change.
      I moved my first approach past the toast to sound too late to act. The family letters
      were real. I decided my shame entitled me to end someone else's life.
