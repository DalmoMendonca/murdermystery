schema_version: 1
characters:
- id: '01'
  innocent: "There was no vote. The chair told me to stop using her name, in writing. Monet has the draft with the copied signature. You can call it a forged demand; that's what it was. Please don't congratulate me on a principled resignation. The board still hasn't heard about the job I accepted."
  murderer: "There was no vote. Monet has the draft with the copied signature, and the chair told me to stop using her name. I left the demand where Grant would have to notice it. Yes, the envelope came from the preview to the sideboard with me. It wasn't a signed resignation. He was determined to announce one anyway."
- id: '02'
  innocent: "Reed, give them both proofs. Not the cleaned-up one. I took the qualification out, then put it back. The review I withheld is attached now. If we reopen the alcove, that ownership claim comes off the wall. I won't defend it just to save an exhibition I spent months making."
  murderer: "Reed, give them both proofs. I took the qualification out, then put it back. The review is attached now. The folder went from the preview to the sideboard, as I said. Red packing isn't part of the label correction. Grant's assistant had the objection. Why was the old claim still on the announcement?"
- id: '03'
  innocent: "My admission receipt is after the preview. There, one figure on this evening's paperwork I haven't improved. I'll disclose both certificate files and refund my commission. The firm cannot refund millions. If somebody tells you it can, ask them to put their own money down before you take my explanation as a new offer."
  murderer: "I'll disclose both certificate files and refund my commission. The firm cannot refund millions. The torn offer stayed in my pocket with the preview packing. I haven't claimed it was a binding settlement. Grant knew I couldn't pay what he demanded. He preferred calling me the forger; it made him the injured buyer instead of another man who hadn't checked."
- id: '04'
  innocent: "Two entries. Payroll: unauthorized. Extra course: refused. The kitchen kept my refusal; the bank kept the transfer. They don't cancel each other out. I need the board to appoint someone else to review the account. Artie, don't put your signature sheet on top of it again. A vote doesn't balance a ledger."
  murderer: "Two entries. Payroll: unauthorized. Extra course: refused. The kitchen and bank kept their copies. The catering envelope was with me at the sideboard; you already know about the packing inside it. Artie wanted an agreement, Grant wanted expenses paid, and neither wanted to look at the account that would supposedly do both."
- id: '05'
  innocent: "The crack is real. The treatment date is false. They're not the same finding. I made the custody band before the condition photograph, so of course my kit contains its stock. The remaining strips are unused. My objection to the original is in the file. I should have stopped the preview rather than file another objection."
  murderer: "The crack is real, and the first treatment date is false. I made the band before the photograph. The loose paper with the withdrawn report is from that job. You heard where I took the report afterward. Grant wanted a conservator's signature on his version of the object. He already had enough people willing to mistake his money for expertise."
- id: '06'
  innocent: "Turn the prop over. PROP. Not an obscure reference; four letters for the technician. The glass is clean, the jacket is empty, and the closing foil is still unused. I wanted the canceled piece performed with its actual credit. Minnie, you can call that unauthorized. You can't call Grant its author."
  murderer: "Turn the prop over. PROP. The technician marked it, and its test is clear. I demonstrated the difference with Grant's actual glass; you've heard that. The packing in the program didn't create my performance or cancel it. Grant put his name on the work and then acted as if my objection was part of the entertainment."
- id: '07'
  innocent: "Yes, that's my signature painted out. No, the painting isn't a forgery. The cup beside it was my brush water. You can have the buyback receipts too. I wanted the ugly picture hidden. Elle's remark about it looking better turned around was not constructive criticism, and I refuse to quote it in the catalog."
  murderer: "Yes, that's my signature painted out. The painting isn't a forgery. You can have the buyback receipts. I carried the pouch and its preview packing when I left the wet sketch at the sideboard. The price was ridiculous on purpose. It was the only part of that transaction I still got to choose."
- id: '08'
  innocent: "The qualification is in both opinions. Read the attachment. I should have insisted on it sooner; I didn't. The torn corner is from the agreement I withdrew. It does not make that agreement executed. I'm not answering an ownership question by taking a client's preferred account of the facts, and I won't do it now because he's dead."
  murderer: "The qualification is in both opinions. Read the attachment. My case and the preview packing were at the sideboard; my advice didn't acquire a different meaning there. Grant wanted a signature rather than a qualification. I put the opinion beside his pen because he kept treating it as if it were an obstacle someone could remove for him."
- id: '09'
  innocent: "Reed was right about the source. I was wrong about that sentence, and about claiming the correction was already published. The archivist received it before the gala. I won't withdraw the entire article to make Grant right about everything else. But Reed should be named on the correction. He's earned that much from this quarrel."
  murderer: "Reed was right about the source, and I was wrong about the publication claim. The archivist received the correction before the gala. Those cards, including the preview packing, were beside Grant's program afterward. A corrected inference doesn't become an endorsement because he dislikes the correction. I was still being asked to supply an authority he couldn't purchase from the evidence."
- id: '10'
  innocent: "Look at the broken stem. No star. A rental glass, removed before the toast. My entrance receipt is after the preview, and the amendment isn't signed. I exaggerated how many trustees agreed with me. I'm not particularly proud of hiding broken glass in a napkin stack either. Don't ask me to pose beside either discovery."
  murderer: "The broken stem is a rental, and the amendment isn't signed. I told you I went to the preview and kept the bag with me at the sideboard. The packing was in it then. Grant kept calling me ornamental while asking for my legal signature. I wanted the trustees to hear how useful the ornament had suddenly become."
- id: '11'
  innocent: "I ordered it disconnected. The technician did the work. My officer warned me, and I kept her warning out of the log. Her notebook stays. The gallery camera shows a doorway, not a table; I won't sell it as coverage we didn't have. That exception is mine. The missing recording isn't my officer's failure."
  murderer: "I ordered the disconnection; the technician did the work. My officer warned me and kept her notebook. The gallery camera doesn't show the sideboard. I took the log folder there while checking the exit, with the preview packing still inside. I'm not blaming my officer for following an order from somebody entitled to give it."
- id: '12'
  innocent: "Justin, the photograph is a shipping cover. I did not find the permit. My editor has the corrected article, and the recorder file hasn't been edited for Grant. I stopped your recording because you were about to name my source. You can be angry about that. You don't get to publish the name just because I'm being questioned."
  murderer: "Justin, I photographed a cover, not a permit. My editor has the corrected copy. The notebook and its packing were with me when I reached the coat pocket. You were about to name the source; Grant wanted the same name as the price of a settlement. I wasn't going to make either of those disclosures easy."
- id: '13'
  innocent: "Keep the first tag beside the stop-work notice. They contradict because I signed too soon. The close-up shows the crack we then found. The lamp I unplugged was a test lamp at the display. No, that isn't a defense of the first signature. It's why I wouldn't sign the photograph request afterward."
  murderer: "Keep the first tag beside the stop-work notice. I signed too soon. The lamp was a display test, not the camera. I took the withdrawn tag to the sideboard with my drawing tube and the preview packing. Grant wanted a finished photograph before we had a safe support. He was happy to put my signature underneath the difference."
- id: '14'
  innocent: "The delegation crossed out the permanent-loan clause. They also objected to my leak. Both are in their signed draft. I won't pretend the first objection authorizes the second act. We can reopen the curtain after the mount is safe. We can't reopen the ownership question by announcing that it's settled."
  murderer: "The delegation crossed out the permanent-loan clause, and they objected to my leak. I kept that clause after taking it from the sideboard. The folder had the preview packing in it. Grant was going to announce settled ownership. Calling my disclosure unauthorized didn't make his proposed announcement true, and he knew the difference."
- id: '15'
  innocent: "My company paid. Hugh bid for it. The board-seat clause was part of my proposal, and I didn't disclose it to the other bidders. That's the deal you're looking at. Grant's poison bottle was a separate purchase. I liked being an anonymous buyer considerably more than I liked identifying myself to a room full of trustees."
  murderer: "My company paid, Hugh bid, and I hid the board-seat clause from the others. The preview packing stayed in my wallet when I left the proposal in Grant's case. His bottle was a separate purchase. He lost my lot and still wanted to tell the museum who could sit on its board. That was a negotiation I had stopped enjoying."
- id: '16'
  innocent: "Here's the exception sheet. Here's my entrance receipt, after the preview. I accepted papers that were incomplete and later supplied a copy that hid the gap. Reed asked for the file, not a reassuring version of my career. He has the whole thing now. I don't expect its last page to make me look better."
  murderer: "Here's the exception sheet. Reed asked for the file, not a reassuring version of my career. The red packing was still among the pages when I showed the sheet at the sideboard. Grant had promised the missing documents in 1989. Tonight he wanted that same signature to mean I had received them. I hadn't."
- id: '17'
  innocent: "The fee is on a separate line. So is the waiver I crossed out. I wasn't authorized to offer it. Hugh, please stop describing that as a completed concession; I retrieved it. Grant paid for a private bottle separately. If everyone would like to stop combining invoices, I might finally be accused of the transaction I actually arranged."
  murderer: "The fee and the crossed-out waiver are separate lines. I wasn't authorized to offer it, and I retrieved it. The packing in my wallet stayed with the waiver from the preview to Grant's case. Hugh can stop describing it as a concession. Grant demanded discretion, then objected to paying the man supplying it."
- id: '18'
  innocent: "No signatures on the transfer form. My relatives said no. That should have ended it before I arrived with the textile, and it ends it now. The border is woven, not foil. Vincent can turn his own picture around; I can't offer everyone else's work because I think it would photograph beautifully here."
  murderer: "No signatures on the transfer form. My relatives said no. The packing caught in the wrapping at the preview isn't part of the woven border. The folded textile was with me when I laid Grant's offer on the sideboard. He wanted to turn my mistake into a purchase. I wanted it out of his photograph before that became another fact nobody asked my family about."
- id: '19'
  innocent: "Open the version history. I changed the catalog. I didn't wait for the registrar, and I didn't say what the correction meant for Art's article. Maker and later owner are different entries in the original. I copied them as one. Art, we should stop deciding which of us gets to sound least wrong in the correction."
  murderer: "Open the version history. I changed the catalog without waiting for the registrar. The research folder came from the preview to the sideboard with the packing still inside. I left the corrected entry there. Art and I can argue about credit later. Grant wanted the old attribution read aloud after we had shown him why it failed."
- id: '20'
  innocent: "You saw me lift it. I put it down when Brie told me to. The apron is full of plaster from the repair; the shop pictures show who actually made it. I left their name out. I want the invoice paid, and I owe them a credit. Both things can be true without making Grant's replica a good sculpture."
  murderer: "You saw me lift it, and I put it down when Brie told me to. The apron had the preview packing in it as well as plaster. I told you that. The shop pictures show the fabricator whose credit I omitted. I wanted the invoice paid before Grant replaced the work. Calling my toast a congratulation would be a particularly poor reading of the room."
- id: '21'
  innocent: "Cary's form says replacement, not original. He wouldn't let me change it. My admission receipt is after the preview, and the original's buyer is on the sales receipt. I haven't made the donation. Please don't announce it, don't thank me for it, and don't tell people the box in receiving is merely waiting for the same frame."
  murderer: "Cary's form says replacement, and the buyer is on the sales receipt. The packing in my clutch was there when I tried to get the pledge into Grant's program. I said where it came from. He wouldn't let me withdraw the thank-you. He was going to turn a failed pledge into an account of my entire position, with the donors there to hear it."
- id: '22'
  innocent: "Play the uncut file. I removed the payment discussion. I also refused Grant's correction. Neither fact makes the private conversation I used fair material. If you're waiting for the punchline, there isn't one I can publish without doing the same thing again. The person deserves an apology with an author this time."
  murderer: "Play the uncut file. The payment discussion and my refusal are both there. The recorder case had the preview packing in it when I left Grant the marked program. I told you that before we had the lab results. The person I used deserves an apology; Grant wanted the correction written as if he were that person. He wasn't."
- id: '23'
  innocent: "The sauce batch is clear. The supplier wrappers aren't that paper. I cleaned the stem and base, not the bowl. Yes, I used a cheaper delivery. It's on the actual invoice now. Nobody ordered the extra course twice; they ordered it, canceled it, restored it, and refused to pay. My crew still needs to be paid once."
  murderer: "The sauce batch is clear, and the cheaper delivery is on the invoice. The red packing in my folder wasn't a dessert wrapper; I told you I carried it from the preview. I cleaned the real glass at the sideboard. Grant's assistant kept changing the order and expecting the crew to absorb it. We don't get paid in revised menus."
- id: '24'
  innocent: "The photograph shows a wrapped glass. The manager opened it afterward. My blanket is wool, and the frame crack is in the transit picture before I covered it. I should have logged the crack then. You can't repair a delivery by signing that it arrived without needing a repair. Grant wanted that signature anyway."
  murderer: "The delivery photograph shows the glass wrapped. I went back after the manager opened it; that's in my account. The handling kit still had the preview packing when I moved the glass. The frame crack preceded the cover-up. Grant knew what he was asking me to certify. He didn't need another photograph to make it untrue."
- id: '25'
  innocent: "Artie didn't endorse the petition. I said he did. The staff signed it themselves, and the cuts are on the revised class list I took. One saved class doesn't save a teaching room. I'll correct the endorsement. I'm not collecting the signatures back as if the people affected never objected."
  murderer: "Artie didn't endorse it; the signatures and cuts are real. The clipboard came from the preview to the sideboard with the packing still caught in it. I took the revised list. One saved class wouldn't save the room. The assistant wanted me to withdraw everyone's objection in return for a concession that left most of them out."
- id: '26'
  innocent: "I kept the print. You can see the deletion and backup in the file history. Hugh, it isn't a photograph of the missing permit. The wrapped glass is in the background of another image. I was asked for a flattering record and kept an unflattering one. I shouldn't have promised a deletion I wasn't willing to complete."
  murderer: "I kept the print, and Hugh can stop calling it a permit photograph. The sleeve with the preview packing came to the sideboard when I arranged Grant's portrait. I told you which glass I shifted. The earlier picture doesn't record that setting. He wanted the inspection and shipping argument excluded from the evening I was supposed to document."
- id: '27'
  innocent: "Mona didn't approve my leaflet. Barb didn't approve the sticker on the caption. The adhesive is on those things, and I broke the promise to leave the display alone. I'm not removing the ownership objection because my method annoyed the people making it. I am removing their supposed endorsement of me. They never gave it."
  murderer: "Mona didn't approve the leaflet, and Barb took my brochure away. The packing in my sticker wallet came from the preview, as I said. I had it when I moved the glass and left the brochure. I'm not claiming the delegation wanted my interference. Grant treated removing me from a gallery as if it removed the history from the collection."
- id: '28'
  innocent: "Sue asked for the original. I refused. The solicitor's transcript includes my grandfather's part, and Grant's original offer is still in the case. I burned a copy. If you'd like to call that theatrical, I won't argue. I'm releasing the letter, including the paragraph I hoped nobody here would ask me to read."
  murderer: "Sue asked for the original. I refused. The transcript includes my grandfather's part, and the offer survived. The case had the preview packing when I set it on the sideboard; I already told you that. Grant knew which page I'd left out. He offered to buy the silence and then behaved as if it was something he already owned."
- id: '29'
  innocent: "The map says I'm wrong. The request says I checked it late. Keep the original recording. You can hear Grant tell the story, then hear me repeat it as if Tulsa itself had whispered it into the microphone. Paige checked her source before protecting it. I should try that order next time."
  murderer: "The map says I'm wrong, and I checked it late. The preview packing stayed in the recorder pouch I carried to the sideboard. The corrected note went beside Grant's program; you've heard that. I kept the recording because he supplied the version I repeated. I didn't want him using my mistake to put another unchecked story on a plaque."
- id: '30'
  innocent: "The operator has both sheets. My blackout is on the first one, and the override stopped it. The confetti packet is unopened; there's spare red-and-silver trim in the cue folder. I fixed the napkin without moving the glass. I called the blackout a test because telling the operator I'd hidden it wasn't going to improve our working relationship."
  murderer: "The operator has both sheets, and the override stopped my blackout. The confetti packet is unopened. My folder carried the preview packing when I straightened the setting and lifted the glass. I told you about it. Grant wanted the photographed place finished and his name lit. The people delivering it were still being told to revise their invoices."
