schema_version: 1
status: Authored dialogue prototype, not production
characters:
- id: '01'
  motive: I've accepted another job. The board doesn't know. Grant put my resignation in the gift agreement,
    which would let him claim he removed me instead of admitting I was leaving. I circulated a demand bearing
    his signature. I copied it. I wanted the trustees to see what accepting his money would cost them.
  opportunity_innocent: Monet wouldn't release the board papers until I stopped calling the draft an agreement.
    So I took the trustees into the office and read it aloud. Most of them wanted champagne first. I asked
    the service manager to delay the announcement, not the drinks. When the chair refused a vote, I came back
    to the reception. I had managed to stage a board crisis with no board meeting.
  opportunity_murderer: Monet wouldn't release the board papers until I stopped calling the draft an agreement.
    I took the trustees into the office; they wanted champagne first. Back at the reception I shifted Grant's
    glass on the sideboard to put the acknowledgment cards behind it. I'd been through the acquisition preview
    earlier. I still had his resignation envelope. I wanted those cards in his photograph, whether he signed
    or not. A red-and-silver packing strip from the preview was folded in the envelope.
  method_innocent: There was no vote. The chair told me to stop using her name, in writing. Monet has the draft
    with the copied signature. You can call it a forged demand; that's what it was. Please don't congratulate
    me on a principled resignation. The board still hasn't heard about the job I accepted.
  method_murderer: There was no vote. Monet has the draft with the copied signature, and the chair told me
    to stop using her name. I left the demand where Grant would have to notice it. Yes, the envelope came from
    the preview to the sideboard with me. It wasn't a signed resignation. He was determined to announce one
    anyway.
- id: '02'
  motive: The ownership review arrived six weeks ago. I left it out of the board pack because I was afraid
    they'd cancel the exhibition. Now Grant wants my label to say his title is settled. It isn't. I built this
    show, and I helped create the lie that might destroy it. He wanted me to say the lie into a microphone.
  opportunity_innocent: Reed found my old label proof and asked why the qualification had disappeared. Art
    was there, which made bluffing unwise. We worked at the gallery label bench while Grant went to the board
    meeting. I took the ownership claim off the replacement label and covered the old one. Nobody had authorized
    either edit. The curtain stayed closed because the mount was cracked, not because I had solved the title.
  opportunity_murderer: Reed found my old label proof. Art was there, so I took the ownership claim off the
    replacement and covered the old one. I carried the disputed proof from the acquisition preview back to
    the reception. At the sideboard I moved Grant's glass to lay the proof flat. I wanted his assistant to
    take it to him before he made the announcement. I had already changed the label without authority. The
    preview had left a loose red-and-silver piece between the folder pages.
  method_innocent: Reed, give them both proofs. Not the cleaned-up one. I took the qualification out, then
    put it back. The review I withheld is attached now. If we reopen the alcove, that ownership claim comes
    off the wall. I won't defend it just to save an exhibition I spent months making.
  method_murderer: Reed, give them both proofs. I took the qualification out, then put it back. The review
    is attached now. The folder went from the preview to the sideboard, as I said. Red packing isn't part of
    the label correction. Grant's assistant had the objection. Why was the old claim still on the announcement?
- id: '03'
  motive: Someone sold me a forged certificate. I then improved my file so it looked as if I'd asked all the
    right questions. I hadn't. Grant wanted a refund the firm couldn't pay. He was prepared to describe me
    as the forger, which would simplify his lawsuit and end my career. There's a difference between being fooled
    and lying afterward. I managed both.
  opportunity_innocent: I reached the museum after the preview had finished. Elon was waiting with the acquisition
    invoice, and Saul's fee was still on it. We met in the reading room. I offered a settlement; Elon pointed
    out that I wasn't the buyer. I tore the offer in half before anyone accepted it. Grant wasn't in the room.
    I later shut his certificate case when it was left open at the reception.
  opportunity_murderer: I came early enough for the acquisition preview, then met Elon in the reading room.
    I offered a settlement; he pointed out that I wasn't the buyer. At the reception I shut Grant's certificate
    case and shifted his glass out of its way. The torn offer was still in my pocket. I had intended to keep
    this between dealers. The invoice had other ideas. I had kept some red-and-silver preview packing with
    the torn offer.
  method_innocent: My admission receipt is after the preview. There, one figure on this evening's paperwork
    I haven't improved. I'll disclose both certificate files and refund my commission. The firm cannot refund
    millions. If somebody tells you it can, ask them to put their own money down before you take my explanation
    as a new offer.
  method_murderer: I'll disclose both certificate files and refund my commission. The firm cannot refund millions.
    The torn offer stayed in my pocket with the preview packing. I haven't claimed it was a binding settlement.
    Grant knew I couldn't pay what he demanded. He preferred calling me the forger; it made him the injured
    buyer instead of another man who hadn't checked.
- id: '04'
  motive: I used restricted money for payroll. It was that or tell people their checks weren't coming. I expected
    to replace it when the gift cleared, which is how you end up committing a second bad transaction to hide
    the first. Grant wanted his private wing expenses in the same transfer. He'd get the wing. I'd get the
    audit.
  opportunity_innocent: Artie brought the gift draft into the office while I was trying to reconcile payroll.
    I refused his signature sheet and Grant's extra dinner course. The service manager came to check that second
    refusal; I sent him back to the kitchen to stop it. I corrected the catering authorization myself. Somebody
    now has two versions of an invoice and a perfectly good reason not to trust me.
  opportunity_murderer: Artie brought the gift draft into the office while I was reconciling payroll. I refused
    his signature sheet and Grant's extra dinner course. I later took the authorization envelope to the reception
    sideboard and moved Grant's glass so the manager could see it. I'd carried that envelope through the acquisition
    preview. Two invoice versions don't improve my position, but there really were two orders. There was red-and-silver
    preview packing in the catering envelope.
  method_innocent: 'Two entries. Payroll: unauthorized. Extra course: refused. The kitchen kept my refusal;
    the bank kept the transfer. They don''t cancel each other out. I need the board to appoint someone else
    to review the account. Artie, don''t put your signature sheet on top of it again. A vote doesn''t balance
    a ledger.'
  method_murderer: 'Two entries. Payroll: unauthorized. Extra course: refused. The kitchen and bank kept their
    copies. The catering envelope was with me at the sideboard; you already know about the packing inside it.
    Artie wanted an agreement, Grant wanted expenses paid, and neither wanted to look at the account that would
    supposedly do both.'
- id: '05'
  motive: I changed the treatment date to meet an insurance deadline. That's my mess. Grant wanted the fresh
    repair described as ancient, which is a much larger mess. Once a conservator signs that report, the next
    owner quotes it forever. I was trying to correct my date without signing his invented history. He regarded
    both as clerical chores.
  opportunity_innocent: Frank's mounting approval didn't match what I saw in the gallery. We checked the support,
    found a real crack, and closed the alcove. Before that, I had put the new band on the acquisition bottle
    for its condition photograph. Grant wanted the original shown; I wanted an empty replica. I filed the objection.
    I should have insisted the preview stop instead of assuming a sealed case was enough. The unused red-and-silver
    band strips stayed in my kit.
  opportunity_murderer: Frank's mounting approval didn't match the support. We found a real crack and closed
    the alcove. I'd put the new band on the acquisition bottle before its preview; Grant insisted on the original.
    Later I moved his glass on the reception sideboard to make room for the withdrawn treatment report. I wanted
    that report returned before his announcement. He was asking for more than a corrected date. The withdrawn
    report had a loose red-and-silver band strip beside it.
  method_innocent: The crack is real. The treatment date is false. They're not the same finding. I made the
    custody band before the condition photograph, so of course my kit contains its stock. The remaining strips
    are unused. My objection to the original is in the file. I should have stopped the preview rather than
    file another objection.
  method_murderer: The crack is real, and the first treatment date is false. I made the band before the photograph.
    The loose paper with the withdrawn report is from that job. You heard where I took the report afterward.
    Grant wanted a conservator's signature on his version of the object. He already had enough people willing
    to mistake his money for expertise.
- id: '06'
  motive: I wrote the warning. It meant return my work, including the credit. The program calls Grant the creator
    of a performance he has never seen rehearsed. I devised a donor jacket that appears to collapse. He canceled
    the performance but kept the idea for his foundation's film. Apparently my contribution was making it easy
    to steal.
  opportunity_innocent: Minnie stopped the lighting operator before the rehearsal. I brought the empty jacket
    and the marked prop glass into the gallery to show what had actually been approved. No performer was supposed
    to drink anything. I wanted the donors to see Grant cancel his own tribute. When the mounting fault closed
    the alcove, the jacket went back on its stand and the prop glass went into its case. The red-and-silver
    closing stock stayed with my program.
  opportunity_murderer: Minnie stopped the lighting operator before rehearsal. I brought the empty jacket and
    marked prop glass out to demonstrate the approved effect. I'd also been at the acquisition preview. Back
    at the reception I lifted Grant's actual glass from the sideboard to show his assistant why it wasn't a
    stage prop, then put it back. My working program was under my arm. He was still taking credit for the canceled
    piece. A red-and-silver bit of preview packing was caught in the program.
  method_innocent: Turn the prop over. PROP. Not an obscure reference; four letters for the technician. The
    glass is clean, the jacket is empty, and the closing foil is still unused. I wanted the canceled piece
    performed with its actual credit. Minnie, you can call that unauthorized. You can't call Grant its author.
  method_murderer: Turn the prop over. PROP. The technician marked it, and its test is clear. I demonstrated
    the difference with Grant's actual glass; you've heard that. The packing in the program didn't create my
    performance or cancel it. Grant put his name on the work and then acted as if my objection was part of
    the entertainment.
- id: '07'
  motive: The anonymous purchases were mine. I was buying my student paintings back before someone held a retrospective
    of work I painted on borrowed grocery money. Grant owns the worst one. I asked him to lend a recent painting;
    he offered that one instead and called it generous. I painted over the signature on the loan form. That
    was a tantrum, not a correction.
  opportunity_innocent: I turned the student painting toward the gallery wall. Elle said it looked better that
    way, which didn't help. I painted out my name on the display sketch and spilled brush water in my own cup
    at the workbench. Grant's assistant brought a sale form; I wrote an impossible price on it. Most of the
    evening I was trying to keep one picture from being photographed.
  opportunity_murderer: I turned the student painting toward the wall. Elle said it looked better that way.
    After the acquisition preview I took Grant's sale form to the reception sideboard, moved his glass to keep
    the wet sketch clear, and wrote an impossible price. My paint pouch was still with me. I was trying to
    stop a photograph from becoming the story of my entire career. The pouch had picked up red-and-silver packing
    at the preview.
  method_innocent: Yes, that's my signature painted out. No, the painting isn't a forgery. The cup beside it
    was my brush water. You can have the buyback receipts too. I wanted the ugly picture hidden. Elle's remark
    about it looking better turned around was not constructive criticism, and I refuse to quote it in the catalog.
  method_murderer: Yes, that's my signature painted out. The painting isn't a forgery. You can have the buyback
    receipts. I carried the pouch and its preview packing when I left the wet sketch at the sideboard. The
    price was ridiculous on purpose. It was the only part of that transaction I still got to choose.
- id: 08
  motive: I softened my opinion to keep an account. The qualification stayed in the attachment, where clients
    put things they don't want to read. Grant called the summary clearance. I failed to correct him publicly.
    Now the museum wants my signature on a permanent gift, and I have to tell them what my own summary made
    easy to overlook.
  opportunity_innocent: Claire brought both label versions to the reading room. I opened the opinion and found
    the attachment missing from the copy sent to trustees. I put it back and crossed out the proposed signature
    line. Penny wanted that line left blank for a different reason. Grant heard our objection from his assistant.
    I didn't need a private audience to make him angry; the crossed-out line did it.
  opportunity_murderer: Claire brought both label versions to the reading room. I put the omitted attachment
    back and crossed out the proposed signature line. I'd carried my legal case through the acquisition preview.
    At the reception sideboard I moved Grant's glass and laid the opinion underneath his signing pen. His assistant
    had already relayed the objection. I wanted him to confront the qualification before he confronted the
    cameras. Red-and-silver packing from the preview was still inside the case.
  method_innocent: The qualification is in both opinions. Read the attachment. I should have insisted on it
    sooner; I didn't. The torn corner is from the agreement I withdrew. It does not make that agreement executed.
    I'm not answering an ownership question by taking a client's preferred account of the facts, and I won't
    do it now because he's dead.
  method_murderer: The qualification is in both opinions. Read the attachment. My case and the preview packing
    were at the sideboard; my advice didn't acquire a different meaning there. Grant wanted a signature rather
    than a qualification. I put the opinion beside his pen because he kept treating it as if it were an obstacle
    someone could remove for him.
- id: 09
  motive: One sentence in my article outruns the source. Reed noticed, and I told him I'd correct it. I then
    let him think the correction had already been published. Grant used that sentence to demand withdrawal
    of the entire article. A historian who can't distinguish a bad inference from a worthless source ought
    to teach something less hazardous. I include myself in that.
  opportunity_innocent: Reed produced the catalog record while Claire was changing the label. I fetched the
    archive transcription from my bag and wrote the correction across my speech cards. I also removed a quotation
    I could no longer defend. Grant's assistant asked whether I'd still endorse the acquisition. I said the
    endorsement had never been mine to give. Then I argued with Reed about whose name should go on the correction.
  opportunity_murderer: Reed produced the catalog record while Claire changed the label. I wrote the correction
    across my speech cards. I'd taken those cards through the acquisition preview. At the reception sideboard
    I shifted Grant's glass and put the corrected cards beside his pen. His assistant wanted an endorsement;
    I wanted my qualification read. Reed and I were still disputing whose name should accompany the correction.
    A red-and-silver packing piece from the preview stayed among the cards.
  method_innocent: Reed was right about the source. I was wrong about that sentence, and about claiming the
    correction was already published. The archivist received it before the gala. I won't withdraw the entire
    article to make Grant right about everything else. But Reed should be named on the correction. He's earned
    that much from this quarrel.
  method_murderer: Reed was right about the source, and I was wrong about the publication claim. The archivist
    received the correction before the gala. Those cards, including the preview packing, were beside Grant's
    program afterward. A corrected inference doesn't become an endorsement because he dislikes the correction.
    I was still being asked to supply an authority he couldn't purchase from the evidence.
- id: '10'
  motive: 'Grant wants my trust signature and tells people I don''t understand the money. I understand that
    he can''t move it without me. I''ve told the family trustees I can block him, which is optimistic: I have
    influence, not a majority. I brought the amendment anyway. I was tired of being introduced as a decorative
