- id: '11'
  motive: My officers warned me about the Salon camera. I overruled them because Grant asked for privacy. I
    then left the exception out of the incident log. It wasn't a clever technical failure. It was me deciding
    an important guest could have a different security policy. One officer is now being blamed for following
    my order. I won't let that version stand.
  opportunity_innocent: I ordered the technician to disconnect the camera for the private board discussion.
    When the installation alarm sounded, I checked the gallery door and sent people around the closed alcove.
    I never restored the camera. Frank wanted his test lamp back on; that wasn't the same circuit. I told my
    junior officer to stop recording the arguments in the log. She kept her notebook, and she was right to.
  opportunity_murderer: I ordered the technician to disconnect the Salon camera and sent guests around the
