  opportunity_innocent: I arrived after the acquisition preview. Artie tried to recruit me into his board vote;
    I wouldn't trade our trust for his job. At the reception I broke the stem of a plain rental glass pulling
    the amendment out of my evening bag. I hid it in the napkin stack. I didn't want my first useful act as
    a trustee to be making somebody sweep up after me.
  opportunity_murderer: I arrived in time for the acquisition preview. Artie tried to recruit me into his vote;
    I wouldn't trade our trust for his job. At the sideboard I moved Grant's engraved glass so I could lay
    out the amendment from my evening bag. I also broke a plain rental stem and hid it in the napkin stack.
    The family hadn't given me the majority I claimed. I had red-and-silver preview packing in the evening
    bag.
  method_innocent: Look at the broken stem. No star. A rental glass, removed before the toast. My entrance
