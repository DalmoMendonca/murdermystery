      I could no longer defend. Grant's assistant asked whether I'd still endorse the acquisition. I said the
      endorsement had never been mine to give. Then I argued with Reed about whose name should go on the correction.
    evidence_innocent: Reed was right about the source. I was wrong about that sentence, and about claiming
      the correction was already published. The archivist received it before the gala. I won't withdraw the
      entire article to make Grant right about everything else. But Reed should be named on the correction.
      He's earned that much from this quarrel.
    motive_murderer: One sentence in my article outruns the source. Reed noticed, and I told him I'd correct
      it. I then let him think the correction had already been published. Grant used that sentence to demand
      withdrawal of the entire article. A historian who can't distinguish a bad inference from a worthless
      source ought to teach something less hazardous. I include myself in that.
    where_murderer: Reed produced the catalog record while Claire changed the label. I wrote the correction
