      the hazard better than anyone. I used it instead of refusing the preview. The discarded vial in the reception
      waste was mine.
- id: '06'
  briefing:
    history: I wrote the warning. It meant return my work, including the credit. The program calls Grant the
      creator of a performance he has never seen rehearsed. I devised a donor jacket that appears to collapse.
      He canceled the performance but kept the idea for his foundation's film. Apparently my contribution was
      making it easy to steal.
    secret: You wrote and planted the ominous anonymous warning note about 'returning what was taken.' It was
      meant as an art-world provocation, not a literal threat. Your canceled stage effect uses a glass marked
      PROP; it has no poison and belongs in the padded performance case.
    objectives:
    - Enjoy watching people overreact to your warning note without admitting you wrote it.
    - Find out whether Minnie Malist changed the lighting cue you designed.
    - Get Vincent Van Faux to admit he still owes you credit for an old collaboration.
  hearings:
    motive_innocent: I wrote the warning. It meant return my work, including the credit. The program calls
      Grant the creator of a performance he has never seen rehearsed. I devised a donor jacket that appears
      to collapse. He canceled the performance but kept the idea for his foundation's film. Apparently my contribution
      was making it easy to steal.
    where_innocent: Minnie stopped the lighting operator before the rehearsal. I brought the empty jacket and
      the marked prop glass into the gallery to show what had actually been approved. No performer was supposed
      to drink anything. I wanted the donors to see Grant cancel his own tribute. When the mounting fault closed
      the alcove, the jacket went back on its stand and the prop glass went into its case. The red-and-silver
      closing stock stayed with my program.
    evidence_innocent: Turn the prop over. PROP. Not an obscure reference; four letters for the technician.
      The glass is clean, the jacket is empty, and the closing foil is still unused. I wanted the canceled
      piece performed with its actual credit. Minnie, you can call that unauthorized. You can't call Grant
      its author.
    motive_murderer: I wrote the warning. It meant return my work, including the credit. The program calls
      Grant the creator of a performance he has never seen rehearsed. I devised a donor jacket that appears
      to collapse. He canceled the performance but kept the idea for his foundation's film. Apparently my contribution
      was making it easy to steal.
    where_murderer: Minnie stopped the lighting operator before rehearsal. I brought the empty jacket and marked
      prop glass out to demonstrate the approved effect. I'd also been at the acquisition preview. Back at
      the reception I lifted Grant's actual glass from the sideboard to show his assistant why it wasn't a
      stage prop, then put it back. My working program was under my arm. He was still taking credit for the
      canceled piece. A red-and-silver bit of preview packing was caught in the program.
    evidence_murderer: Turn the prop over. PROP. The technician marked it, and its test is clear. I demonstrated
