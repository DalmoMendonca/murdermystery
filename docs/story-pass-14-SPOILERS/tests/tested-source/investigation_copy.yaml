schema_version: 1
status: Pass14 early planting and voice revision; not production
characters:
- id: '01'
  briefing:
    history: I've accepted another job. The board doesn't know. Grant put my resignation in the gift agreement,
      which would let him claim he removed me instead of admitting I was leaving. I circulated a demand bearing
      his signature. I copied it. I wanted the trustees to see what accepting his money would cost them.
    secret: You have already accepted a confidential offer to lead a rival museum next year, which makes any
      argument with Grant look like succession planning.
    objectives:
    - Find out whether Monet Bags has seen the governance addendum.
    - Quietly learn whether Claire O’Scuro would stay if you left.
    - Do not volunteer your job offer unless pressure forces it.
  hearings:
    motive_innocent: I've accepted another job. The board doesn't know. Grant put my resignation in the gift
      agreement, which would let him claim he removed me instead of admitting I was leaving. I circulated a
      demand bearing his signature. I copied it. I wanted the trustees to see what accepting his money would
      cost them.
    where_innocent: Monet wouldn't release the board papers until I stopped calling the draft an agreement.
      So I took the trustees into the office and read it aloud. Most of them wanted champagne first. I asked
      the service manager to delay the announcement, not the drinks. When the chair refused a vote, I came
      back to the reception. I had managed to stage a board crisis with no board meeting.
    evidence_innocent: There was no vote. The chair told me to stop using her name, in writing. Monet has the
      draft with the copied signature. You can call it a forged demand; that's what it was. Please don't congratulate
      me on a principled resignation. The board still hasn't heard about the job I accepted.
    motive_murderer: I've accepted another job. The board doesn't know. Grant put my resignation in the gift
      agreement, which would let him claim he removed me instead of admitting I was leaving. I circulated a
      demand bearing his signature. I copied it. I wanted the trustees to see what accepting his money would
      cost them.
    where_murderer: Monet wouldn't release the board papers until I stopped calling the draft an agreement.
      I took the trustees into the office; they wanted champagne first. Back at the reception I shifted Grant's
      glass on the sideboard to put the acknowledgment cards behind it. I'd been through the acquisition preview
      earlier. I still had his resignation envelope. I wanted those cards in his photograph, whether he signed
      or not. A red-and-silver packing strip from the preview was folded in the envelope.
    evidence_murderer: There was no vote. Monet has the draft with the copied signature, and the chair told
      me to stop using her name. I left the demand where Grant would have to notice it. Yes, the envelope came
      from the preview to the sideboard with me. It wasn't a signed resignation. He was determined to announce
      one anyway.
  coming_clean:
    innocent: I'm innocent of Grant's murder. I forged his signature and failed to get the board to vote. My
      draft and the chair's reply show that. I'll tell the trustees about the job I accepted before asking
      them to trust another announcement from me.
    murderer: I killed Grant. I took poison during the acquisition preview and put it in his glass while pretending
      to arrange the acknowledgment cards. The loose band scrap in my envelope traveled with it. I wanted to
      decide how I left this museum. Instead I decided Grant would never leave it alive. The discarded vial
      in the reception waste was mine.
- id: '02'
  briefing:
    history: The ownership review arrived six weeks ago. I left it out of the board pack because I was afraid
      they'd cancel the exhibition. Now Grant wants my label to say his title is settled. It isn't. I built
      this show, and I helped create the lie that might destroy it. He wanted me to say the lie into a microphone.
    secret: Against board instructions, you commissioned an independent provenance review and hid the preliminary
      report in the Registrar's Office.
    objectives:
    - Find out whether Dr. Art E. Fact has seen the same gap you found.
    - Learn who wrote the anonymous warning note.
    - Keep your independent report secret until you decide whom to trust.
  hearings:
    motive_innocent: The ownership review arrived six weeks ago. I left it out of the board pack because I
      was afraid they'd cancel the exhibition. Now Grant wants my label to say his title is settled. It isn't.
      I built this show, and I helped create the lie that might destroy it. He wanted me to say the lie into
      a microphone.
    where_innocent: Reed found my old label proof and asked why the qualification had disappeared. Art was
      there, which made bluffing unwise. We worked at the gallery label bench while Grant went to the board
      meeting. I took the ownership claim off the replacement label and covered the old one. Nobody had authorized
      either edit. The curtain stayed closed because the mount was cracked, not because I had solved the title.
    evidence_innocent: Reed, give them both proofs. Not the cleaned-up one. I took the qualification out, then
      put it back. The review I withheld is attached now. If we reopen the alcove, that ownership claim comes
      off the wall. I won't defend it just to save an exhibition I spent months making.
    motive_murderer: The ownership review arrived six weeks ago. I left it out of the board pack because I
      was afraid they'd cancel the exhibition. Now Grant wants my label to say his title is settled. It isn't.
      I built this show, and I helped create the lie that might destroy it. He wanted me to say the lie into
      a microphone.
    where_murderer: Reed found my old label proof. Art was there, so I took the ownership claim off the replacement
      and covered the old one. I carried the disputed proof from the acquisition preview back to the reception.
      At the sideboard I moved Grant's glass to lay the proof flat. I wanted his assistant to take it to him
      before he made the announcement. I had already changed the label without authority. The preview had left
      a loose red-and-silver piece between the folder pages.
    evidence_murderer: Reed, give them both proofs. I took the qualification out, then put it back. The review
      is attached now. The folder went from the preview to the sideboard, as I said. Red packing isn't part
      of the label correction. Grant's assistant had the objection. Why was the old claim still on the announcement?
  coming_clean:
    innocent: I didn't murder Grant. I hid the review and changed the label without permission. The two proofs
      and the review reveal both. I'll withdraw the ownership claim publicly. Calling the exhibition mine didn't
      give me the right to edit away someone else's history.
    murderer: I poisoned Grant's glass when I set the proof on the sideboard. I'd taken the poison during the
      preview; the custody-band scraps connect the folder and glass. The punch was never the target. I was
      prepared to stop my exhibition. I chose to stop the man controlling it instead. The discarded vial in
      the reception waste was mine.
- id: '03'
  briefing:
    history: Someone sold me a forged certificate. I then improved my file so it looked as if I'd asked all
      the right questions. I hadn't. Grant wanted a refund the firm couldn't pay. He was prepared to describe
      me as the forger, which would simplify his lawsuit and end my career. There's a difference between being
      fooled and lying afterward. I managed both.
    secret: You were duped on that sale, but you quietly altered your own file afterward so clients would not
      see how badly your due diligence failed.
    objectives:
    - Learn whether Saul D. Bid knows about the disputed certificate.
    - Keep Elon Mosaic from discussing the 'auction incident' in public.
    - Figure out what Paige Turner knows about the Geneva freeport records.
  hearings:
    motive_innocent: Someone sold me a forged certificate. I then improved my file so it looked as if I'd asked
      all the right questions. I hadn't. Grant wanted a refund the firm couldn't pay. He was prepared to describe
      me as the forger, which would simplify his lawsuit and end my career. There's a difference between being
      fooled and lying afterward. I managed both.
    where_innocent: I reached the museum after the preview had finished. Elon was waiting with the acquisition
      invoice, and Saul's fee was still on it. We met in the reading room. I offered a settlement; Elon pointed
      out that I wasn't the buyer. I tore the offer in half before anyone accepted it. Grant wasn't in the
      room. I later shut his certificate case when it was left open at the reception.
    evidence_innocent: My admission receipt is after the preview. There, one figure on this evening's paperwork
      I haven't improved. I'll disclose both certificate files and refund my commission. The firm cannot refund
      millions. If somebody tells you it can, ask them to put their own money down before you take my explanation
      as a new offer.
    motive_murderer: Someone sold me a forged certificate. I then improved my file so it looked as if I'd asked
      all the right questions. I hadn't. Grant wanted a refund the firm couldn't pay. He was prepared to describe
      me as the forger, which would simplify his lawsuit and end my career. There's a difference between being
      fooled and lying afterward. I managed both.
    where_murderer: I came early enough for the acquisition preview, then met Elon in the reading room. I offered
      a settlement; he pointed out that I wasn't the buyer. At the reception I shut Grant's certificate case
      and shifted his glass out of its way. The torn offer was still in my pocket. I had intended to keep this
      between dealers. The invoice had other ideas. I had kept some red-and-silver preview packing with the
      torn offer.
    evidence_murderer: I'll disclose both certificate files and refund my commission. The firm cannot refund
      millions. The torn offer stayed in my pocket with the preview packing. I haven't claimed it was a binding
      settlement. Grant knew I couldn't pay what he demanded. He preferred calling me the forger; it made him
      the injured buyer instead of another man who hadn't checked.
  coming_clean:
    innocent: The certificate files show a deception I concealed, not a murder I committed. My admission receipt
      excludes the poison preview. I'm innocent. I'll disclose the altered file and refund the commission.
      That won't repair my judgment, but it will stop somebody else relying on it.
    murderer: The refund wasn't coming. I took poison in the preview and put it in Grant's glass when I closed
      his case. The strip in my pocket was from that bottle's band. I wanted the demand to die with him. It
      won't; I killed the creditor without creating the money. The discarded vial in the reception waste was
      mine.
- id: '04'
  briefing:
    history: I used restricted money for payroll. It was that or tell people their checks weren't coming. I
      expected to replace it when the gift cleared, which is how you end up committing a second bad transaction
      to hide the first. Grant wanted his private wing expenses in the same transfer. He'd get the wing. I'd
      get the audit.
    secret: You temporarily moved money between internal accounts to cover a cash-flow shortfall, intending
      to reverse it after the gala. It was technically unauthorized and Grant discovered it.
    objectives:
    - Find out whether Sue Venir has seen Grant's draft funding agreement.
    - Keep Artie Ficial from learning about the temporary transfer unless absolutely necessary.
    - Identify who found the donor ledger during the scavenger hunt.
  hearings:
    motive_innocent: I used restricted money for payroll. It was that or tell people their checks weren't coming.
      I expected to replace it when the gift cleared, which is how you end up committing a second bad transaction
      to hide the first. Grant wanted his private wing expenses in the same transfer. He'd get the wing. I'd
      get the audit.
    where_innocent: Artie brought the gift draft into the office while I was trying to reconcile payroll. I
      refused his signature sheet and Grant's extra dinner course. The service manager came to check that second
      refusal; I sent him back to the kitchen to stop it. I corrected the catering authorization myself. Somebody
      now has two versions of an invoice and a perfectly good reason not to trust me.
    evidence_innocent: 'Two entries. Payroll: unauthorized. Extra course: refused. The kitchen kept my refusal;
      the bank kept the transfer. They don''t cancel each other out. I need the board to appoint someone else
      to review the account. Artie, don''t put your signature sheet on top of it again. A vote doesn''t balance
      a ledger.'
    motive_murderer: I used restricted money for payroll. It was that or tell people their checks weren't coming.
      I expected to replace it when the gift cleared, which is how you end up committing a second bad transaction
      to hide the first. Grant wanted his private wing expenses in the same transfer. He'd get the wing. I'd
      get the audit.
    where_murderer: Artie brought the gift draft into the office while I was reconciling payroll. I refused
      his signature sheet and Grant's extra dinner course. I later took the authorization envelope to the reception
      sideboard and moved Grant's glass so the manager could see it. I'd carried that envelope through the
      acquisition preview. Two invoice versions don't improve my position, but there really were two orders.
      There was red-and-silver preview packing in the catering envelope.
    evidence_murderer: 'Two entries. Payroll: unauthorized. Extra course: refused. The kitchen and bank kept
      their copies. The catering envelope was with me at the sideboard; you already know about the packing
      inside it. Artie wanted an agreement, Grant wanted expenses paid, and neither wanted to look at the account
