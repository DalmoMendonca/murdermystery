      of the evening I was trying to keep one picture from being photographed.
    evidence_innocent: Yes, that's my signature painted out. No, the painting isn't a forgery. The cup beside
      it was my brush water. You can have the buyback receipts too. I wanted the ugly picture hidden. Elle's
      remark about it looking better turned around was not constructive criticism, and I refuse to quote it
