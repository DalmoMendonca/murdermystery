      a retrospective of work I painted on borrowed grocery money. Grant owns the worst one. I asked him to
      lend a recent painting; he offered that one instead and called it generous. I painted over the signature
      on the loan form. That was a tantrum, not a correction.
    secret: You have secretly used buyers to acquire several of your own early paintings so you could remove
      them from circulation. The art world would find that both vain and market-manipulative.
    objectives:
    - Find out whether Ella Gance knows you were behind the anonymous buybacks.
    - Persuade Claire O’Scuro that the student painting should not be displayed.
    - Avoid giving Drew Conclusions a quote you will regret.
  hearings:
