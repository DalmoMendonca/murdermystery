- id: 09
  briefing:
    history: One sentence in my article outruns the source. Reed noticed, and I told him I'd correct it. I
      then let him think the correction had already been published. Grant used that sentence to demand withdrawal
      of the entire article. A historian who can't distinguish a bad inference from a worthless source ought
      to teach something less hazardous. I include myself in that.
    secret: One celebrated article of yours does contain an inference you stated too confidently. The main
      thesis still stands, but the mistake would be humiliating.
    objectives:
    - Ask Reed DeLabel what he has discovered in the accession records.
    - Determine whether Claire O’Scuro commissioned outside provenance research.
    - Keep Paige Turner from learning which article Grant could attack.
  hearings:
    motive_innocent: One sentence in my article outruns the source. Reed noticed, and I told him I'd correct
      it. I then let him think the correction had already been published. Grant used that sentence to demand
      withdrawal of the entire article. A historian who can't distinguish a bad inference from a worthless
      source ought to teach something less hazardous. I include myself in that.
    where_innocent: Reed produced the catalog record while Claire was changing the label. I fetched the archive
