  coming_clean:
    innocent: I made the unauthorized payroll transfer. The bank entries prove it. The kitchen order also proves
      I refused the extra course; the food wasn't poisoned. I didn't kill Grant. The board will get both transactions,
      without his private expenses folded into the museum's accounts.
    murderer: I poisoned the glass while leaving the catering envelope. I had taken poison during the preview;
      a band scrap stayed in that envelope and another reached the glass. Grant's dinner wasn't the delivery
      route. I killed him because I could see an audit ending with my name and his wing. The discarded vial
      in the reception waste was mine.
- id: '05'
  briefing:
    history: I changed the treatment date to meet an insurance deadline. That's my mess. Grant wanted the fresh
      repair described as ancient, which is a much larger mess. Once a conservator signs that report, the next
      owner quotes it forever. I was trying to correct my date without signing his invented history. He regarded
      both as clerical chores.
    secret: You changed the date on a minor treatment record last month to spare the museum an embarrassing
      insurance dispute. No object was harmed, but the falsification could end your career.
    objectives:
    - Find out whether Cary Crates has noticed the altered treatment date.
    - Ask Dr. Art E. Fact what he thinks the Star Bowl's modern adhesive means.
    - Keep the insurance issue separate from the murder investigation.
  hearings:
    motive_innocent: I changed the treatment date to meet an insurance deadline. That's my mess. Grant wanted
      the fresh repair described as ancient, which is a much larger mess. Once a conservator signs that report,
      the next owner quotes it forever. I was trying to correct my date without signing his invented history.
      He regarded both as clerical chores.
    where_innocent: Frank's mounting approval didn't match what I saw in the gallery. We checked the support,
      found a real crack, and closed the alcove. Before that, I had put the new band on the acquisition bottle
      for its condition photograph. Grant wanted the original shown; I wanted an empty replica. I filed the
      objection. I should have insisted the preview stop instead of assuming a sealed case was enough. The
      unused red-and-silver band strips stayed in my kit.
    evidence_innocent: The crack is real. The treatment date is false. They're not the same finding. I made
      the custody band before the condition photograph, so of course my kit contains its stock. The remaining
      strips are unused. My objection to the original is in the file. I should have stopped the preview rather
      than file another objection.
    motive_murderer: I changed the treatment date to meet an insurance deadline. That's my mess. Grant wanted
      the fresh repair described as ancient, which is a much larger mess. Once a conservator signs that report,
      the next owner quotes it forever. I was trying to correct my date without signing his invented history.
      He regarded both as clerical chores.
    where_murderer: Frank's mounting approval didn't match the support. We found a real crack and closed the
      alcove. I'd put the new band on the acquisition bottle before its preview; Grant insisted on the original.
      Later I moved his glass on the reception sideboard to make room for the withdrawn treatment report. I
      wanted that report returned before his announcement. He was asking for more than a corrected date. The
      withdrawn report had a loose red-and-silver band strip beside it.
    evidence_murderer: The crack is real, and the first treatment date is false. I made the band before the
      photograph. The loose paper with the withdrawn report is from that job. You heard where I took the report
