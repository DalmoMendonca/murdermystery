schema_version: 1
characters:
- id: '01'
  innocent: I'm innocent of Grant's murder. I forged his signature and failed to get the board to vote. My
    draft and the chair's reply show that. I'll tell the trustees about the job I accepted before asking them
    to trust another announcement from me.
  murderer: I killed Grant. I took poison during the acquisition preview and put it in his glass while pretending
    to arrange the acknowledgment cards. The loose band scrap in my envelope traveled with it. I wanted to
    decide how I left this museum. Instead I decided Grant would never leave it alive. The discarded vial in
    the reception waste was mine.
- id: '02'
  innocent: I didn't murder Grant. I hid the review and changed the label without permission. The two proofs
    and the review reveal both. I'll withdraw the ownership claim publicly. Calling the exhibition mine didn't
    give me the right to edit away someone else's history.
  murderer: I poisoned Grant's glass when I set the proof on the sideboard. I'd taken the poison during the
    preview; the custody-band scraps connect the folder and glass. The punch was never the target. I was prepared
    to stop my exhibition. I chose to stop the man controlling it instead. The discarded vial in the reception
    waste was mine.
- id: '03'
  innocent: The certificate files show a deception I concealed, not a murder I committed. My admission receipt
    excludes the poison preview. I'm innocent. I'll disclose the altered file and refund the commission. That
    won't repair my judgment, but it will stop somebody else relying on it.
  murderer: The refund wasn't coming. I took poison in the preview and put it in Grant's glass when I closed
    his case. The strip in my pocket was from that bottle's band. I wanted the demand to die with him. It won't;
    I killed the creditor without creating the money. The discarded vial in the reception waste was mine.
- id: '04'
  innocent: I made the unauthorized payroll transfer. The bank entries prove it. The kitchen order also proves
    I refused the extra course; the food wasn't poisoned. I didn't kill Grant. The board will get both transactions,
    without his private expenses folded into the museum's accounts.
  murderer: I poisoned the glass while leaving the catering envelope. I had taken poison during the preview;
    a band scrap stayed in that envelope and another reached the glass. Grant's dinner wasn't the delivery
    route. I killed him because I could see an audit ending with my name and his wing. The discarded vial in
    the reception waste was mine.
- id: '05'
  innocent: I corrected a false treatment date and stopped a genuinely unsafe installation. My original report
    and the crack photograph survive. The band stock belongs to my work, not a confession. I'm innocent of
    murder. I should have refused the hazardous preview, and I'll answer for permitting it.
  murderer: I made the custody band and then broke it to take poison. I put the poison in Grant's glass while
    retrieving my report. The loose paper beside that report and inside the glass came from the band. I knew
    the hazard better than anyone. I used it instead of refusing the preview. The discarded vial in the reception
    waste was mine.
- id: '06'
  innocent: The jacket was empty and the marked prop glass was clean. I planned to defy the cancellation, not
    poison Grant. I'm innocent. I'll admit the unauthorized performance, retain the sketch, and restore the
    people who actually made it to the credits.
  murderer: The harmless prop wasn't my weapon. Grant's actual glass was. I took poison during the preview
    and put it in the glass while demonstrating the difference. The band scrap caught in my program explains
    the paper found there. I wanted a public reversal of his credit. I made it a murder. The discarded vial
    in the reception waste was mine.
- id: '07'
  innocent: 'The brush-water cup stayed at the gallery bench. The paint and buyback receipts show what I was
    hiding: a student painting and my embarrassment. I didn''t kill Grant. I''ll stop buying my past out of
    circulation and stop pretending the workers at the museum invented my tantrum.'
  murderer: I poisoned the donor glass while making space for the wet sketch. I'd taken poison in the preview,
    and the band paper traveled in my paint pouch. The brush-water cup wasn't involved. Grant wanted that student
    painting to be the story of my career. Murder is a worse story, and now it's mine. The discarded vial in
    the reception waste was mine.
- id: 08
  innocent: The qualification was in both opinions. My failure was letting the client advertise a conclusion
    I hadn't reached. I didn't murder him. The missing attachment and unsigned agreement will go to every trustee
    who received the softened summary. They deserve the advice I was paid to give.
  murderer: I put poison in the glass when I laid out the legal opinion. The preview gave me access to the
    bottle; its band paper remained in my case and reached the glass. I wanted my qualification to stop the
    announcement. When it didn't, I made the consequence permanent. There is no qualification to that confession.
    The discarded vial in the reception waste was mine.
- id: 09
  innocent: The archive transcription corrects my sentence, and the earlier submission shows when I knew it
    needed correcting. I didn't kill Grant. I'll publish the correction with Reed's part acknowledged. A disputed
    attribution doesn't become defensible because the person exploiting it is dead.
  murderer: I poisoned Grant's glass when I put the corrected cards beside his pen. I'd taken poison during
    the preview; the band scrap stayed among those cards. My correction was genuine. My attempt to make his
    announcement impossible was murder. I can't cite my way out of an act I committed myself. The discarded
    vial in the reception waste was mine.
- id: '10'
  innocent: I wasn't here for the poison preview. The stem I broke was a rental, and it was removed before
    the toast. I didn't kill Grant. I exaggerated my trustee support and concealed a broken glass. I'll stop
    claiming a majority before asking people how they're voting.
  murderer: I came early, took poison at the preview, and put it in the engraved glass while laying out the
    amendment. The rental stem was a separate break; the band scrap was in my bag. Grant wanted an ornamental
    trustee who would sign. I answered by killing him, not by winning the vote. The discarded vial in the reception
    waste was mine.
- id: '11'
  innocent: I disconnected the camera and hid the exception. The request and my officer's notebook establish
    that failure. They don't identify whoever used the gap. I'm innocent of murder. My officer won't carry
    the blame for an order I gave, and her original notes will remain in the record.
  murderer: The privacy order was real. I used the recording gap I had created to poison Grant's glass at the
    sideboard. I took the poison in the preview; its band scrap caught in my log folder. My officer kept an
    honest notebook. I kept an omission large enough to hide a murder. The discarded vial in the reception
    waste was mine.
- id: '12'
  innocent: The earlier corrected article and recorder survive. I protected my source, concealed a recorder,
    and photographed a cover that didn't contain the permit. I didn't murder Grant. I'll correct the story
    without pretending the source's trust authorized everything I did to obtain it.
  murderer: I poisoned the glass while reaching for the recorder in Grant's coat. The notebook carried a band
    scrap from the preview where I took the poison. The source and correction were real; they weren't permission
    to kill. I decided he couldn't expose someone, then made myself the person who needed exposing. The discarded
    vial in the reception waste was mine.
- id: '13'
  innocent: The installation was unsafe, and my first approval was premature. The stop-work notice and the
    crack photograph tell that story. I didn't murder Grant. I'll correct the record and pay for the necessary
    repair before accepting another request to make unfinished work look finished.
  murderer: I took poison in the preview and put it in Grant's glass when I left the withdrawn tag. The band
    scrap stayed in my drawing tube. The mounting failure was real; it didn't kill him. I killed him rather
    than face what my signature and his demands had made of the project. The discarded vial in the reception
    waste was mine.
- id: '14'
  innocent: The delegation objected to the permanent gift, and they hadn't authorized my leak. Their draft
    shows both. I didn't kill Grant. I'll release their objection in their words and admit which disclosure
    was mine. Restitution means returning authority too, not merely deciding I used it more honorably.
  murderer: I poisoned the glass while removing the permanent-loan clause. The poison and band paper came from
    the preview; the scrap stayed in the delegation folder I carried. Their objection wasn't an instruction
    to murder. I claimed to speak for people whose authority I'd already overridden, then committed something
    none of them asked for. The discarded vial in the reception waste was mine.
- id: '15'
  innocent: My company bought the lot and I concealed the board-seat clause. The bank confirmation and proposal
    expose it. I didn't kill Grant. The bidders will learn who owned the company before I'm permitted to talk
    about transparent governance again.
  murderer: I poisoned Grant's glass when I opened his case to insert the proposal. I took poison in the preview,
    and the band paper remained in my invoice wallet. My company purchased a different acquisition. I killed
    a rival whose approval I resented needing. It wasn't a transaction I can route through a subsidiary. The
    discarded vial in the reception waste was mine.
- id: '16'
  innocent: The exception sheet records missing papers I failed to pursue. My entrance receipt excludes the
    poison preview. I'm innocent of murder. I will release the complete accession file, including the omissions
    I allowed to become institutional memory.
  murderer: I took poison during the preview and put it in the glass when I showed Grant the exception sheet.
    A band scrap remained in the archive file. I wanted him to answer for the promise behind my old signature.
    Instead I killed him and left another person to account for what I concealed. The discarded vial in the
    reception waste was mine.
- id: '17'
  innocent: The subsidiary invoice and withdrawn waiver show an unauthorized fee negotiation. I didn't poison
    Grant. I will identify the actual buyer, disclose the fee, and stop treating confidentiality as permission
    to rewrite a transaction after the client objects to its price.
  murderer: I put poison in the glass while slipping the waiver into Grant's case. The preview supplied it,
    and band paper traveled in my auction wallet. I killed him over the fee and what disclosing it would reveal.
    The shared punch was clear. A commission dispute explains my anger; it doesn't excuse the glass I chose.
    The discarded vial in the reception waste was mine.
- id: '18'
  innocent: The unsigned transfer form and family refusal show why I took the textile back. I had promised
    something I didn't own alone. I didn't kill Grant. My family will decide its next loan, and I will stop
    speaking as if their consent is an administrative step.
  murderer: I poisoned the glass while keeping Grant's offer off the folded textile. I'd taken poison at the
    preview; its band paper was caught in the wrapping. He treated my promise as a purchase he could finish
    without my family. I treated their objection as an excuse for a murder they never authorized. The discarded
    vial in the reception waste was mine.
- id: '19'
  innocent: The catalog history and original source expose my bad reference and unauthorized edit. The bottle
    label wasn't part of that change. I didn't murder Grant. Art and I will publish the correction together,
    including why the first citation failed.
  murderer: I took poison at the preview and put it in Grant's glass while leaving the catalog correction.
    The band scrap remained in my research folder. I wanted my corrected attribution heard. I killed the man
    determined to keep using the wrong one. My amendment is still valid; nothing makes the murder valid. The
    discarded vial in the reception waste was mine.
- id: '20'
  innocent: I lifted Grant's glass. My apron and the shop photographs account for plaster repair, not the paper
    inside it. I didn't kill him. I changed the support, omitted the fabricator, and pretended outrage over
    a replica made me innocent of those obligations. I'll restore the credit and settle the workers' invoices.
  murderer: The mock toast gave me an excuse to lift the glass I poisoned. I took poison at the preview; a
    band scrap stayed in my apron and another reached the glass. Grant wouldn't pay for the work he wanted
    replaced. I killed him over the contract, then used workers whose credit I'd withheld as my defense. The
    discarded vial in the reception waste was mine.
- id: '21'
  innocent: 'My admission was after the preview, and the replacement stayed boxed in receiving. The sales receipt
    identifies the work I had promised away. I didn''t murder Grant. I''ll withdraw the pledge and let the
    museum announce what I actually gave it: nothing it was entitled to call the original.'
  murderer: I poisoned the glass while hiding my pledge under Grant's program. I had taken poison in the preview,
    and the band paper was folded into the tissue in my clutch. The replacement stayed boxed. I wanted his
    public thank-you stopped before it exposed the sale. I killed him to conceal a gift I hadn't made. The
    discarded vial in the reception waste was mine.
- id: '22'
  innocent: The full recording exposes the payment discussion I cut. The newsletter and the person it hurt
    are my responsibility. I didn't kill Grant. I'll remove the private material and publish the apology with
    my name attached, without accepting his proposed correction as another piece of paid copy.
  murderer: I put poison in the glass when I left the marked program. I'd taken it in the preview; the bottle-band
    scrap remained in my recorder case. My recordings and refusal were genuine. I killed the man I didn't want
    deciding how they would be exposed. That's the story I can't edit shorter. The discarded vial in the reception
    waste was mine.
- id: '23'
  innocent: The sauce batch, food, and shared punch are clear. The supplier wrappers aren't the paper from
    the glass. I handled its stem and base, and I concealed a substitution. I didn't kill Grant. The museum
    will receive the real supplier and charges; the crew will receive their pay.
  murderer: I poisoned the glass while pretending to clean its stem and base. I took poison during the preview;
    the band scrap traveled in my invoice folder. The sauce, desserts, and shared punch were never poisoned.
    I killed one customer over a bill and tried to leave the blame with a whole kitchen. The discarded vial
    in the reception waste was mine.
- id: '24'
  innocent: The delivery picture shows a wrapped glass. The frame crack preceded my mount, and the blanket
    is wool rather than the paper in the drink. I didn't murder Grant. I'll correct the delivery form to describe
    the damage I actually concealed.
  murderer: I returned after the manager unwrapped the glass and poisoned it when I moved it clear of the blanket.
    I'd taken poison at the preview; the band scrap was in my handling kit. Grant knew the frame was cracked.
    I killed him instead of refusing the signature he wanted on a false delivery. The discarded vial in the
    reception waste was mine.
- id: '25'
  innocent: The petition signatures and class cuts are real. Artie's endorsement was invented by me. I didn't
    kill Grant. I'll correct the endorsement and keep the petition available to the people whose jobs were
    being negotiated away without their permission.
  murderer: I poisoned the glass when I left the petition and took the class list. The preview supplied the
    poison; band paper remained in my clipboard. Grant was replacing the teaching room. I killed him and told
    myself I was defending the staff. They asked for their jobs to be protected, not for a murder. The discarded
    vial in the reception waste was mine.
- id: '26'
  innocent: The file history shows the deletion and the print I kept. The glass in the delivery picture is
    background, not a complete record of its later handling. I didn't kill Grant. I'll release the photograph
    with a truthful account of the promise I broke to preserve it.
  murderer: I poisoned Grant's glass while arranging his portrait. I'd taken poison at the preview; the band
    paper was in the photo sleeve. The earlier delivery image doesn't record that act. I wanted to decide which
    parts of the evening survived. I made a murder, and now I don't get to crop myself out. The discarded vial
    in the reception waste was mine.
- id: '27'
  innocent: The adhesive is on the caption and brochure. The leaflet overstated Mona's support, and I broke
    my agreement with Barb. I didn't kill Grant. I'll remove the false endorsement and keep the protest separate
    from a delegation I had no right to claim.
  murderer: I put poison in the glass while leaving the stickered brochure. I took it in the preview; the band
    scrap remained in my sticker wallet. The adhesive on the caption was a different act. I wanted Grant stopped
    and used a cause as permission to kill. Nobody whose history I invoked gave me that permission. The discarded
    vial in the reception waste was mine.
- id: '28'
  innocent: The solicitor's transcript contains the page I withheld. The offer survived because I burned only
    a copy. I didn't kill Grant. I'll release the full family archive and stop demanding an honest museum history
    while hiding my grandfather's part in it.
  murderer: I poisoned the glass before taking the offer copy to the fireplace. The poison came from the preview;
    the band scrap remained in my letter case. The original offer and missing paragraph survived. I killed
    Grant to protect a version of my family that I'd already made false. Burning paper didn't destroy the truth.
    The discarded vial in the reception waste was mine.
- id: '29'
  innocent: The parcel map and archive request expose how late I checked the story. I protected myself by deleting
    its public version. I didn't kill Grant. The correction will include the original recording so Tulsa can
    see who supplied the error and who repeated it.
  murderer: I poisoned the glass while leaving the corrected parcel note. I'd taken poison at the preview;
    the band paper traveled in my recorder pouch. Grant had fed me the false story. I killed him rather than
    let him keep deciding which version became history. The correction won't keep my own name out of what happened.
    The discarded vial in the reception waste was mine.
- id: '30'
  innocent: The override stopped my hidden cue, and the confetti packet stayed unopened. I reset the napkin
    without moving the glass. I didn't kill Grant. I'll give the museum both cue sheets and stop calling a
    canceled sabotage attempt an innocent test.
  murderer: I poisoned the glass while straightening Grant's place setting. I'd taken poison at the preview;
    the band scrap came from the bottle, not the unopened confetti. The safety override stopped my blackout
    but didn't stop me. I wanted control of the announcement and chose murder when I couldn't get it. The discarded
    vial in the reception waste was mine.
