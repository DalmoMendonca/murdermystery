schema_version: 1
observations:
- id: held-setting
  observer: Casey Hart, service manager
  text: Artie wrote HOLD DONOR SETTING on my working card and refused the assistant's request to clear
    the setting and announcement packet. The chair had not supplied an order. I kept the card because
    staff were receiving conflicting instructions.
  display_label: Casey / working card
  display_text: 'Artie: HOLD DONOR SETTING. Monet: NO PRIVATE RETURNS. Brie crossed out REPLACE FROM CLEAN
    STOCK.'
- id: replacement-refused
  observer: The reserve server
  text: Brie crossed out REPLACE FROM CLEAN STOCK and sent my replacement setting back to the clean rack.
    She assigned me to the kitchen although the staffing slip lists no kitchen task for me then. The unused
    replacement is an ordinary rental glass. She checked the star glass herself and used a towel.
  display_label: Reserve server / staffing
  display_text: Replacement setting sent back; no kitchen task listed when Brie removed cover.
- id: prolonged-count
  observer: Casey Hart and the supplier's call clerk
  text: The supplier had agreed to defer the payment decision before Monet kept Casey for the physical
    count. Monet wrote NO PRIVATE RETURNS. The private-returns trolley remained loaded at reception; the
    unused extra course stayed in the kitchen. Casey's count sheet names that course and its serving hire.
  display_label: Supplier / deferred charge
  display_text: Payment decision deferred; Monet nevertheless retained Casey for physical count and stopped
    private returns.
- id: collections-case
  observer: Jordan West, collections assistant
  text: My first photograph after the alarm shows loose lining caught on the damaged secondary-case edge.
    Chip removed a strip after I asked him to leave the case as found. He called it display-copy packing.
    I later recorded the strip in his kit. Its cut edge fits the missing section.
  display_label: Collections / case inventory
  display_text: Chip removed lining after leave-as-found instruction; described it as copy packing.
- id: rigging-tool
  observer: Jordan West and the installation electrician
  text: The post-alarm photograph shows a pry bar among the damaged-case returns. Frank retrieved it before
    the tool inventory. The rig sheet already says TOOL RETURNED. That bar's width is common to several
    workshop tools; this observation does not identify what forced the latch.
  display_label: Electrician / tool inventory
  display_text: Frank retrieved pry bar from damaged-case returns; rig sheet already read TOOL RETURNED.
- id: returns-transferred
  observer: The porter and the security officer
  text: Barb authorized moving the unexamined packing to the shelf behind reception after the officer
    requested it be held. The packing stayed on that shelf. Barb's summary says SEARCH COMPLETE; the officer's
    notebook says the corridor was searched and the returned objects still required inspection.
  display_label: Officer / porter transfer
  display_text: Barb authorized moving unexamined packing; summary SEARCH COMPLETE contradicted officer
    hold request.
- id: coat-packet
  observer: Grant's assistant
  text: Paige took a packet from behind Grant's coat lining, called it interview material and returned
    it open. My inventory records its wrapper but not the folded questions page that was inside before
    she searched. She recovered the recorder separately from beneath the announcement. I retained the
    coat afterward.
  display_label: Assistant / coat inventory
  display_text: Paige returned coat packet open, without its questions page; recorder recovered separately.
- id: reopened-case
  observer: The removal foreperson and Grant's assistant
  text: Al sent his rejected support separately with the crew, leaving its narrow recess empty in his
    case. The crew retained the part. After the porter moved the closed case to returns, the assistant
    saw Al reopen it and challenged the removal. His first collection account omitted that reopening.
  display_label: Removal crew / case pickup
  display_text: Al sent support separately; reopened case at returns after omitting that reopening from
    his account.
- id: donor-packet-detour
  observer: The coat-check attendant and Grant's assistant
  text: Penny offered coat check Grant's portrait packet. The attendant refused it and saw Penny undo
    its fastening while searching. The packet came back missing two speech cards. The assistant's earlier
    portrait instruction distinguishes this packet; its miniature has no individual recipient label.
  display_label: Coat check / portrait packet
  display_text: Penny opened donor packet on refused coat-check detour; returned it without two speech
    cards.
- id: incomplete-correction-photo
  observer: The event photographer
  text: Justin asked to photograph his correction materials in the donor work area, then resisted clearing
    it for service. My retained first print shows his map, caption and an uncapped favor miniature, but
    no lease. My caption request calls for the lease and a size marker. He described that first arrangement
    as the complete correction before making another arrangement. The print records one moment, not continuous
    handling.
  display_label: Photographer / first print
  display_text: 'Justin: map, caption, uncapped favor; no lease. Caption request asks for lease and size
    marker.'
- id: portrait-waste
  observer: The clearing attendant
  text: Justin handed over folded rejected pages containing broken glass. Other table waste was initially
    collected separately, then combined for removal. The attendant did not identify each fragment's origin.
  display_label: Clearing attendant / portrait waste
  display_text: Justin handed over folded rejected pages containing broken glass; other table waste collected
    separately, then combined for removal.
