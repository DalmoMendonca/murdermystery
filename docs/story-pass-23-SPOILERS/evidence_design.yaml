reports:
- id: F1
  department: MERIDIAN / BOARD SECRETARY
  title: The gift came with conditions
  text: Grant Larceny collapsed after his toast and died at the gala. Earlier, trustees had discussed
    this unsigned gift agreement in the museum office. The label review, acquisition disputes and installation
    inspection continued in other rooms. These are the terms Grant wanted announced.
  rows:
  - - 1. Museum name
    - The Grant Larceny Meridian Museum
  - - 2. Collection decisions
    - Grant may veto future acquisitions
  - - 3. Museum director
    - Artie Ficial must resign within sixty days
  layout: gift_document
  document_label: DRAFT GIFT AGREEMENT / NOT SIGNED
- id: F2
  department: INVESTIGATION / INITIAL FINDINGS
  title: A death and a stolen exhibit
  text: 'Grant Larceny became ill after drinking his toast and died at the gala. Poisoning is suspected;
    the substance has not yet been identified. Toxicology results are pending. The museum had received
    a historical poison bottle for The Art of Murder. Grant told security the bottle had been emptied.
    The responding investigators obtained the auction condition: original contents retained. Collections
    placed it in a locked preparation cabinet inside a secondary case and withheld display approval. A
    separate empty display copy was supplied for gallery installation. At 6:12 the cabinet alarm registered
    a forced opening. The original was missing. Food, drinks, props and recovered bottles are being examined.'
  rows:
  - - Missing object
    - The Velvet Widow / original poison bottle
  - - Storage
    - Locked cabinet; forced-opening alarm at 6:12
  - - Laboratory results
    - Pending
  layout: bottle_photo
  photo: receiving_case_v18
- id: F3
  department: INVESTIGATION / SCENE RECORD
  title: Returns and interrupted service
  text: 'Jordan West: During clearing after the death, I found the damaged dark-blue bottle among abandoned
    packing on the staff-returns shelf. Nobody handed it to me. I also retained the reception waste: a
    miniature fragrance bottle, folded papers and broken glass. Comparisons are pending. Casey Hart: I
    placed Grant''s new star glass at 6:32 and collected it at 6:44. The kitchen argument left reception
    without its usual cover. I filled it from shared punch on my tray at 6:46 and kept the tray through
    the toast. The photographs show separate moments, not everything between them.'
  rows:
  - - Casey / working card
    - 'Artie: HOLD DONOR SETTING. Monet: NO PRIVATE RETURNS. Brie crossed out REPLACE FROM CLEAN STOCK.'
  - - Reserve server / staffing
    - Replacement setting sent back; no kitchen task listed when Brie removed cover.
  - - Supplier / deferred charge
    - Payment decision deferred; Monet nevertheless retained Casey for physical count and stopped private
      returns.
  - - Collections / case inventory
    - Chip removed lining after leave-as-found instruction; described it as copy packing.
  - - Electrician / tool inventory
    - Frank retrieved pry bar from damaged-case returns; rig sheet already read TOOL RETURNED.
  - - Officer / porter transfer
    - Barb authorized moving unexamined packing; summary SEARCH COMPLETE contradicted officer hold request.
  - - Assistant / coat inventory
    - Paige returned coat packet open, without its questions page; recorder recovered separately.
  - - Removal crew / case pickup
    - Al sent support separately; reopened case at returns after omitting that reopening from his account.
  - - Coat check / portrait packet
    - Penny opened donor packet on refused coat-check detour; returned it without two speech cards.
  - - Photographer / first print
    - 'Justin: map, caption, uncapped favor; no lease. Caption request asks for lease and size marker.'
  - - Clearing attendant / portrait waste
    - Justin handed over folded rejected pages containing broken glass; other table waste collected separately,
      then combined for removal.
  layout: scene_records23_REQUIRED
  photo: returns_scene23_REQUIRED
- id: F4
  department: MERIDIAN / COLLECTIONS INVENTORY
  title: The original and its display copy
  text: 'The bottle recovered from the staff-returns shelf is the historical original. It has a closed
    base and a fresh gap in its neck. The blue fragment recovered in folded reception paper joins that
    irregular curved neck edge. The receiving record described the original neck as intact. Its display
    copy has a similar dark-blue body but an open bottom: it cannot hold liquid. The recovered miniature
    fragrance bottle has an intact neck and body. Service photographs show the donor glass empty when
    placed at 6:32 and empty when collected at 6:44. Casey filled it with shared punch on the tray at
    6:46 and reports keeping it there until the toast. The photographs show moments, not continuous coverage.
    Examination of the collected glass finds dark-blue bottle-neck pieces and flat clear screen-protector
    pieces. Every examined dark-blue neck piece joins the historical original''s fresh gap. Their curvature
    is too broad for any of the supplied miniature favors. The flat clear pieces do not join a bottle.
    The papers and pieces were collected as mixed reception waste; their recovery does not identify their
    last holder.'
  rows:
  - - Recovered historical original
    - Dark-blue body; closed base; fresh neck gap
  - - Fragment in reception paper
    - Joins the original neck gap
  - - Display copy
    - Similar dark-blue body; open bottom
  - - Recovered miniature
    - Neck and body intact
  - - Collected glass
    - Dark-blue neck pieces join original; too broad for miniature necks. Flat clear protector pieces
      separate.
  layout: fracture_comparison
  photo: original_replica20_REQUIRED
  service_photo: sideboard_service_v18
  service_timeline:
  - time: '6:30'
    caption: New donor glass, wrapped
  - time: '6:32'
    caption: Empty glass placed on reception sideboard
  - time: '6:44'
    caption: Empty glass collected onto service tray
  - time: '6:46'
    caption: Shared punch poured on service tray
- id: F5
  department: LABORATORY / CASE FINDINGS
  title: Laboratory findings
  text: Cyanide was found inside Grant's museum-star glass, in the recovered original, on the blue neck
    fragment, and in a miniature LARCENY No.1 bottle from reception waste. The shared punch, meal, sauce,
    PROP glass, brush-water bottle and studio FIXER tested clear. Unopened favor stock also tested clear.
    The contaminated miniature has the common manufacturer label and no recipient name. Plaster and cloth
    fibers were found on the outside of Grant's glass.
  rows:
  - - Grant's glass / original / blue fragment
    - Cyanide detected
  - - Miniature from reception waste
    - Cyanide; common favor label; no recipient name
  - - Punch / meal / sauce / PROP / brush-water / FIXER
    - Clear for cyanide
  - - Unopened favor stock
    - Fragrance; clear for cyanide
  layout: lab_findings
