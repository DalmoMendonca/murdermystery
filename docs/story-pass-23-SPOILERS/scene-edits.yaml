schema_version: 1
characters:
- id: '01'
  opportunity_innocent: 'I asked Casey to hold Grant''s setting until the chair answered. Not the reception:
    his setting. I wrote HOLD on the working card. His assistant wanted the announcement and setting cleared;
    I refused. The chair hadn''t given me that authority. Grant wanted the photograph before the argument
    was settled. I wanted him brought back to the board before the photograph made his bargain look finished.
    I left the setting there and went back to welcoming guests.'
  method_innocent: The chair rejected my order and my bargain. Her reply also mentions the job I'd already
    accepted elsewhere. HOLD concerned the private photograph setting, including his speech packet; the
    assistant's objection was about clearing both. That explains my wording. I wanted him waiting for
    an answer I didn't have. I had a departure arranged, but I still wanted the board to reject his terms
    publicly.
- id: '04'
  opportunity_innocent: 'The supplier agreed to wait. Casey reached for the returns trolley and I stopped
    it: no private returns until Grant accepted the disputed charge. I wrote that under my refusal. Casey
    said returns were service gear, not payment. I knew. I wanted the unused course counted before somebody
    took it away and called the account settled. The supplier had answered. I kept Casey in the kitchen
    anyway. Grant could come there and accept the charge if he wanted his private service restored.'
  method_innocent: The disputed line is the unused extra course and its serving hire. It doesn't charge
    for the shop glass or guest gifts. The kitchen retained the food. My refusal wasn't an instruction
    about a dangerous bottle, but I prolonged the count after the supplier stopped pressing. Casey's account
    of that is right. A dead donor doesn't refill the restricted account or stop Monday's audit. I wanted
    his signature while I still had an unpaid order to argue over.
- id: '05'
  opportunity_innocent: Jordan asked for the damaged case after the alarm. I cut the caught strip of lining
    loose first. A sharp edge had caught the lining; I didn't want it scratching the next object put there.
    Jordan told me to leave it as found. I put the strip in my kit and said it was packing from the display
    copy. It wasn't. The copy was on the work bench. Then the mounting crack took me back to the alcove.
    I had altered one record already and didn't want another piece of my work examined before I'd checked
    it.
  method_innocent: The strip fits because I removed it from that case. The cut is from my shears. Jordan's
    photograph is after the alarm; the lining was still caught on the forced edge then. I should have
    left it alone. The display copy in my kit has an open bottom. That explains the blue object I was
    legitimately handling. It doesn't establish where the stolen original went while I worked. Collections
    needed the receiving warning I kept in my folder.
- id: '11'
  opportunity_innocent: Collections wanted reception returns held. I separated packing from table waste
    and told the porter to move the packing behind reception. Keep the exit clear. The porter asked whether
    the officer had finished searching it. She hadn't. I let the transfer proceed and wrote SEARCH COMPLETE
    in my summary because I meant the corridor search. The officer meant the items. Grant was still assuring
    us the bottle had been emptied. I accepted that while collections was asking for the auction condition.
  method_innocent: The packing went to the returns shelf, not out of the building. The porter left the
    load there; Jordan recovered it there. I cleared an exit while calling an unfinished search complete.
    That's my discrepancy. Grant's assurance explains what I believed, not why I should have believed
    it. The officer kept her request to hold the objects. My summary shouldn't be used to say she inspected
    them or approved the toast.
- id: '13'
  opportunity_innocent: The pry bar was on the work bench when I went to change the rig. When I looked
    again, it was in the returns load with the damaged collections case. I took it back before Jordan
    checked the tools. The rig sheet already said TOOL RETURNED. I left that entry alone. A tool missing
    from our list was one more thing Grant could use against the installation. I carried the plaster model
    through reception later. I wanted my equipment back without another discussion about the compromise
    I'd approved.
  method_innocent: The drawing marks where that type of bar was used. The electrician checked the completed
    joint, not where I put the tool afterward. Several workshop bars have that width; the damaged latch
    doesn't identify mine. I retrieved it because I didn't want the unsafe compromise examined alongside
    a missing tool. The plaster model accounts for another thing I carried through reception. The revised
    plan still needs a real structural review. I'd like my name on a safe drawing for once.
- id: '12'
  opportunity_innocent: I pulled the coat lining out and took the packet caught behind it. My recorder
    wasn't in it. The assistant asked for it back; I called it my interview material. It held his gift
    wrapper and folded questions naming my source. I took the questions and returned the packet open.
    Later I found the recorder under his announcement. I left the first packet out of my account because
    I'd already been caught searching his coat. I wanted the source page before he could turn it into
    another demand.
  method_innocent: The missing fold is the questions page in my editor's file. The assistant saw me return
    the packet; the coat still has its wrapper. The recorder contains our argument about my source, with
    gaps. I shouldn't have called that packet mine. I wanted the questions out of his coat because the
    interview had never authorized him to identify the person who supplied the documents.
- id: '20'
  opportunity_innocent: I pulled the rejected support from its packing and told the removal crew to take
    it first. That left a narrow space in my case. Service wanted the case gone. I closed it, then reopened
    it after the porter put it with the returns. Grant's assistant saw the lid lift and asked whether
    I was removing museum property. I said I was checking my hardware. I was also making sure nobody could
    stage the replica on my support while my crew waited for payment.
  method_innocent: Put the removed support against the recess. That's what the space held. The crew has
    the part; the altered drawing shows why I didn't want it reused under a replica. I reopened the lid.
    Service kept telling me to get the case out. I wasn't leaving my support for another unpaid installation.
    Grant had a real objection to my changed support. I still expected him to pay the people who built
    the sculpture.
  coming_clean_innocent: I changed the support. Grant had a real reason to dispute the balance. I threatened
    removal anyway, sent the support away, and reopened the case after it reached returns. I didn't poison
    him. The crew has the support and the drawing. The work stays pending inspection and the estate gets
    the payment dispute. I still want my crew paid. They built the thing. Replacing it cheaply doesn't
    erase the work already standing at his entrance.
- id: '23'
  opportunity_innocent: The reserve server brought a clean replacement setting. I sent it back. Grant
    demanded the star glass for his photograph; I wasn't adding another unpaid change. I crossed out REPLACE
    FROM CLEAN STOCK. I checked the star glass myself and left it on the towel. Casey wanted someone covering
    it. I said the reserve server was needed in the kitchen. They weren't needed there yet. Grant could
    ask why his private service had vanished and perhaps notice the invoice we'd been trying to settle.
  method_innocent: The replacement was an ordinary rental glass. Grant's order required the museum star,
    and the first photograph proof was arranged around it. I was enforcing that instruction while making
    my point. The towel explains cloth on the outside of the glass. The shared punch and food tested clear;
    that narrows the danger. It doesn't make my staffing order sensible. The crew still needs paying for
    the service we actually provided.
- id: '28'
  opportunity_innocent: His assistant put the speech cards in a packet for the portrait. I took it toward
    coat check before she collected it. I wanted his copy of the fourth letter. The attendant wouldn't
    keep an unclaimed packet and made me bring it back. I returned it without two cards and said I hadn't
    opened the gift section. She'd already watched me undo its fastening while I searched. Grant didn't
    need every word he'd prepared. I wanted to choose which account of the family sale reached the room
    first.
  method_innocent: The attendant refused the packet; she didn't keep it for me. The cards in my case concern
    the family sale. My attorney now has all four letters, including Grandfather's part. Taking Grant's
    copy couldn't remove the other copies. I opened the packet and lied about the fastening. The attendant's
    note records that. There are fewer admirable ways of arranging that family story than I'd hoped.
