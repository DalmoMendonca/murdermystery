characters:
- id: '29'
  opportunity_innocent: I wanted the correction photographed before Grant's acknowledgment went out. The
    photographer told me to clear his setting. I spread my introduction over the service card instead.
    The first frame had the map and my open favor, but not the lease. I called it complete. Then I knocked
    my phone down; its glass screen protector broke. I folded the pieces into the rejected introduction
    and gave them to the clearing attendant. The tenant's entrance was on the lease. Grant could have
    answered my story without naming that tenant.
  opportunity_murderer: I wanted the correction photographed before Grant's acknowledgment went out. The
    photographer told me to clear his setting. I spread my introduction over the service card instead.
    The first frame had the map and my open favor, but not the lease. I called it complete. My phone slipped;
    the protector broke. I also snapped my dark-blue miniature's neck while rearranging things. I folded
    both kinds of glass into the rejected introduction and gave it to the clearing attendant. The tenant's
    entrance was on the lease. Grant could answer without naming that tenant.
  method_innocent: The full take names the wall and the source's restriction. The lease is genuine; I
    kept the tenant's entrance out of the first frame. The photographer wanted the favor beside the map
    to show its size. My phone's protector is missing a corner, and the flat clear pieces went into that
    folded page. Inspect the phone. It still works; the correction is still wrong without the lease. Calling
    the first picture complete was my decision. Stopping the recording hid a source, not a continuous
    view of Grant's setting.
  method_murderer: 'The full take names the wall and the source''s restriction. The lease is genuine;
    I kept the tenant''s entrance out of the first frame. Inspect the phone: its protector lost a corner.
    That wasn''t all the glass I wrapped. I snapped the miniature''s neck myself. Dark-blue curved pieces,
    folded with the flat phone pieces. I didn''t gather somebody else''s broken bottle. The map and lease
    are here; check the boundary I got wrong. Calling the first picture complete was my decision. I wanted
    Grant answering a correction, not choosing who could keep publishing it.'
  coming_clean_murderer: 'I killed Grant. The shop was the job that paid for my blog, and he was making
    my mistake into a reason to take both away. I stole the historical poison from preparation storage.
    I broke its neck and used my little favor bottle to carry it. While I obstructed the clearing of his
    private setting, I contaminated his empty glass. The punch was added later. The blue glass I wrapped
    wasn''t my miniature: that bottle remained intact. My correction and my tenant were real. I used them
    to make the broken-bottle story sound like another detail of a bad recording. Grant could be cruel,
    and I''d got the story wrong. Neither made his death anything but my choice.'
