schema_version: 1
status: authored_not_blind_validated
purpose: Remove the repeated preparation-tour/glass-moving recital. Preserve the unexplained material finding and give substantive answers about each actual dispute.
inference_limit: Shared access is established by the case evidence. A material finding is circumstantial, not a unique torn-edge identification or a complete reconstruction of handling. Coming Clean explains the crime rather than supplying its first incriminating fact.
innocent_edits:
- id: '03'
  text: >-
    I first entered at 6:29, delayed by the reserve-price dispute. The entrance receipt records that first admission. I can produce the certificate and the correspondence about the sale. The certificate was false before it reached me; I altered my file to conceal how badly I had been fooled. My settlement offer survives too. Grant was entitled to question the sale. The refund he demanded would have closed the firm.
guilty_edits:
- id: '01'
  text: >-
    The demand went into Grant's speech folder with the signature I had copied. The chair never received his agreement to discuss it. He found my copy first and threatened to make the forgery the subject of the announcement. I took the folder back. The examination of my resignation envelope found a red paper scrap with silver-foil backing. That envelope held the demand and the acknowledgment cards. The board would have had the forgery in front of it, whichever version of the speech he delivered.
- id: '02'
  text: >-
    The old label said the ownership was settled. The independent review identifies a missing export permit. I knew that when I let the old wording go to print. I took both versions to Grant and kept the disputed proof in my label folder afterward. The folder was examined: a loose red scrap with silver-foil backing was inside. Grant had supplied a provenance story he could not support. I had let my department's name make it look respectable.
- id: '03'
  text: >-
    I first entered at 6:17; the entrance receipt records it. I have the false certificate, the sale correspondence and the offer Grant refused. Altering my copy hid the failure from the client. It changed nothing about the object they had bought. A red foil-backed scrap was recovered from my settlement envelope. Grant kept the offer itself. He had decided what my firm's reputation was worth and expected me to find that sum before he spoke to the room.
- id: '04'
  text: >-
    The payroll instruction is mine. So is the unauthorized transfer. Grant wrote the marble-wing addition on my ledger, and I refused it in the office. Later he agreed to sign the payroll schedule in the salon. I pushed his empty glass aside to give him room. The ledger I brought back had a loose piece of red paper with silver backing between its pages; that is in the examination record. His proposed addition was still there when the book was taken.
- id: '05'
  text: >-
    The insurance copy carries the date I changed. I substituted it for the original Grant had been showing around. He would have two conflicting reports if he kept both, and I wanted one version left in the file. The treatment file was examined afterward; it contained a loose red foil-backed scrap. My unused band strips were in the supply sleeve. The original photograph survives with the technician. Grant wanted a recent repair called ancient, and my altered copy gave him another problem to exploit.
- id: '06'
  text: >-
    The stage manager kept the revision: an empty jacket, a hinged stand and a change of light. Grant canceled the effect after taking the credit. I left him the revised program because I wanted the canceled work and its author recorded. A loose red scrap with silver backing was found in that program. I wrote the warning as well. The foundation had paid for a performance and started behaving as if it had bought the artist who made it.
- id: '07'
  text: >-
    That painted-out signature is mine. Grant refused the replacement sketch and kept the student picture on display. I had cash ready to buy it back, but he enjoyed owning it more than he wanted the money. The sketch stayed in my wallet. Its examination lists a red paper scrap with a silver-foil back among the contents. The sale notice survives with my drawing on the reverse. He could show the picture without my permission; he could not make me proud of it.
- id: '08'
  text: >-
    Both opinions identify the missing permit. The softened one leaves Grant room to talk as if the matter is settled. I allowed that wording. I retrieved the annex before he could attach my signature to his announcement. It remained in my legal case, where the examination found a loose piece of red foil-backed paper. I can produce the two versions. I had been trying to preserve an important account while giving advice the client did not want to hear.
- id: '09'
  text: >-
    The original reference supports the ownership question. It does not support the inference I added to one sentence. My amended citation separates those points. Grant wanted the correction to withdraw the article, which would have been a different statement altogether. The citation folder contains both pages. A red scrap with metallic silver backing was recovered from it. I had taken the source to Grant because he kept quoting my error as though it settled the history of the bowl.
- id: '10'
  text: >-
    I first entered at 6:17. The objection went to Grant, but the trustees still had not supplied the votes I claimed. He would have discovered that when he called them. My written objection and the call log remain. A loose red foil-backed piece was found in my evening bag with the papers. He wanted my signature before his announcement. I had given him an objection with my signature instead, and he had refused to treat it as anything more than a delay.
- id: '11'
  text: >-
    Grant signed the camera instruction. The technician disconnected the cable; I authorized the job and kept the order rather than filing the exception. Afterward I checked the salon setting. That was part of the room I had left unrecorded. The order was in my work sleeve when it was examined, along with a loose red paper scrap backed with silver foil. My staff would have been asked why they followed an instruction I had approved. Grant's signature would not have answered that for them.
- id: '12'
  text: >-
    The red line on the working carbon removes a description that would identify my source. My editor has the original. Grant got the carbon because I wanted him answering the reporting without getting the person's name. The recorder was back with me by then. The examination also found a loose red foil-backed piece in my notebook. I kept the proof and the recording. Grant could contest a sentence in print; he wanted a person he could put under pressure instead.
- id: '13'
  text: >-
    The crossed-out load figure is my first approval. I should have challenged it before the crew built to it. Grant wanted that signature used for the publicity photographs after I had changed the drawing. Both versions were rolled in my tube. A loose red scrap with silver backing was recovered from the tube too. The rigger has the stop-work sheet. I would have lost the contract by insisting on the new support; leaving the first drawing unchallenged would have left my name on it.
- id: '14'
  text: >-
    The amendment calls the work a loan and keeps the owner's right to recall it. Grant wanted that clause removed. I used the delegation's letterhead before they authorized me to speak for them, then leaked the talks to stop his permanent-gift announcement. The amendment stayed in my letter folder. The examination lists a loose red foil-backed scrap there. The partners will have to answer for a disclosure they did not approve, and I will have to explain why I made it.
- id: '15'
  text: >-
    The company on the purchase invoice is mine. My partners kept the proposal with the lower price I offered Grant. I left the company connection out of the pitch and negotiated the board seat separately. The revised price page was in my folio when it was examined. A red paper scrap with silver-foil backing was caught in the fold. Grant wanted the appointment withdrawn and the cheaper offer forgotten. Those conditions would have left him controlling a transaction he had already lost.
- id: '16'
  text: >-
    I first entered at 6:16, as the staffed guest book records. The accession record carries my signature from 1989 and the promise of export papers that never arrived. I took that page to Grant and then kept it in my file. The file examination found a loose red foil-backed scrap. I had accepted an incomplete donation when the museum badly needed one. My old signature was being used to suggest that I had settled a question I had left open.
- id: '17'
  text: >-
    My client put the ceiling price in writing. I disclosed it to Grant, against instructions, then tried to recover the commission through a subsidiary fee. The sale book records that proposal. It also contained a loose red paper scrap with silver backing when it was examined. The client's message survives. I had made their negotiating position worse and concealed what repairing my own fee would cost them. Grant had a very clear view of the part I wanted kept discreet.
- id: '18'
  text: >-
    The other institution has my signed loan offer. Grant wanted that commitment dismissed and the textile announced as his permanent possession. I kept the amendment he had been rewriting and folded it with the pattern pages. A loose piece of red foil-backed paper was found in the folder. My family had not consented to the first promise either. I had offered work I did not have the authority to give away, and he was prepared to announce that he owned it.
- id: '19'
  text: >-
    The source register corrects the attribution I copied into the catalog. I retrieved my working note so the two sentences could be read together. Grant wanted the old one restored, with my name still below it. The reference sleeve was examined later; a red paper scrap with metallic silver backing was inside. The archivist has my correspondence. I made the careless note. Keeping it in the catalog after finding the source would have been a deliberate choice.
- id: '20'
  text: >-
    The drawing names the fabricator I left out of the credit. I kept my work apron on after opening the support panel. In the salon I lifted Grant's empty glass and proposed a toast to that fabricator, then put it back. I wanted Grant embarrassed before he described the replacement to the room. The apron pocket contained a loose red foil-backed scrap when it was examined. The worker's name had been on the drawing all along. I had chosen to leave it off the sculpture.
- id: '21'
  text: >-
    I first entered at 6:16; the entrance record confirms it. The packing list describes the replacement, and the sale invoice explains where the promised original went. I folded the wrapping while Grant read my offer. He wanted the original for the photographs. The papers went back into my evening bag, where a loose red scrap with silver-foil backing was found. People had come expecting to thank me for the donation. I was trying to get a replacement accepted before they saw the difference.
- id: '22'
  text: >-
    The printer has the anonymous column, the smaller correction and the invoice for that correction. Grant wanted a tribute in its place. I left him the paragraph already set in type because the larger tribute would make our transaction obvious. The folder I kept was examined; a loose red foil-backed piece was among the sheets. I had sold him a correction and let him think he could buy the writer's opinion as well. He was about to tell the room whose newsletter it was.
- id: '23'
  text: >-
    My bill records each change to Grant's private service. I held the extra course in the kitchen and took the invoice to his table. His empty glass was in the way, so I moved it before putting the bill down. The invoice folder contained a loose red scrap with silver-foil backing when it was examined. The supplier's box was there too. He disputed the first order while asking for another one. I wanted the charges acknowledged before my staff served any more of it.
- id: '24'
  text: >-
    The delivery slip covers the boxed shop glass I handed to the manager. Later I moved the unwrapped glass farther into Grant's table before taking the trolley past. I still had my work gloves on. One cuff contained a loose red paper scrap backed with silver foil when the gloves were examined. The estimate concerns the frame crack I concealed. Grant wanted an undamaged delivery recorded. The packing blanket had hidden the crack; it had done nothing to repair it.
- id: '25'
  text: >-
    The staff retained the petition and the request I sent for the mailing list. I circulated it before anyone approved that request. Grant wanted the signatures withdrawn before the gift announcement. I kept them on my clipboard. A loose red foil-backed scrap was recovered from it. Withdrawing the message would have left the education cuts inside the agreement for the trustees to approve. I had told a volunteer the director supported us, and I would have had to account for that claim too.
- id: '26'
  text: >-
    The print order predates my promise to delete the camera file. The shipping papers are visible beside Grant's meeting. I kept the separate print and told him the file was gone. The sleeve I used for it contained a loose piece of red paper with silver backing when it was examined. He wanted every copy destroyed. The work tray was empty, but the print still existed. I had intended to keep him from choosing which parts of the event the photographs recorded.
- id: '27'
  text: >-
    The printer has my sticker artwork and the brochure order. Grant tore the first sticker off his jacket. I wanted the protest in the toast photograph, so in the salon I pressed another onto the base of his empty glass and set it back. I was carrying the brochures too. Their examination found a loose red scrap with silver-foil backing between the pages. I had promised to stay out of the presentation. Security moving me away from the display had not persuaded me to keep that promise.
- id: '28'
  text: >-
    The letter names my grandfather's part in the sale. I left it out of the family display. Grant's offer to buy our silence is beside it in the case; the solicitor retained a transcript before tonight. The case also contained a loose red foil-backed scrap when it was examined. I came demanding an account of what happened to the collection. My own account had stopped at the point where it would implicate someone whose portrait hung in my family's house.
- id: '29'
  text: >-
    The county record puts the boundary somewhere my story did not. Grant's archive-access offer is in writing too. I kept the map because I had let his version stand after finding the error. The folder examination recovered a loose red paper scrap with silver backing. My draft correction is still there. I liked the story, and he liked what it did for his family. That was a poor reason to turn it into Tulsa history, but I had done it.
- id: '30'
  text: >-
    The safety override stopped my hidden blackout. The electrician retained the revised cue sheet. I went back to preparing Grant's place for the donor photograph and turned his empty glass clear of the centerpiece. My folder stayed under my arm. A loose red foil-backed scrap was recovered from it afterward. The photograph would still have carried his name on the wall behind him. I was being paid to stage an announcement I had tried to interrupt.
