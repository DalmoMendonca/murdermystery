schema_version: 1
reports:
- id: F1
  department: MERIDIAN / BOARD SECRETARY
  title: The gift came with conditions
  text: Grant Larceny has died at the gala after his private toast. His proposed gift agreement is still unsigned.
    These are the terms he intended to announce tonight.
  rows:
  - - 1. Museum name
    - The Grant Larceny Meridian Museum
  - - 2. Collection decisions
    - Grant may veto future acquisitions
  - - 3. Museum director
    - Artie Ficial must resign within sixty days
  layout: gift_document
  document_label: DRAFT GIFT AGREEMENT / NOT SIGNED
- id: F2
  department: MERIDIAN / COLLECTIONS ASSISTANT
  title: An empty bottle in preparation
  text: Investigators found Grant's acquired bottle empty in the locked preparation cupboard. A split beneath
    the back of its red band had been hidden from the front. The incoming declaration described the contents
    as inert display liquid. That description came from Grant. The bottle's remaining residue contained active
    cyanide.
  rows:
  - - Object
    - The Velvet Widow bottle / lot 73
  - - Historic label
    - CYANIDE / POISON
  - - Found after death
    - Empty; red band split underneath
  layout: bottle_photo
  photo: bottle_closed_incoming_replacement_required
- id: F3
  department: MERIDIAN / CATERER’S RECORD
  title: What happened to Grant’s glass
  text: 'I unwrapped the museum-shop gift glass and set Grant''s place at 6:32. The extra-course order was
    on hold, so I went back to the kitchen to speak with Brie. Guests were using the salon. The kitchen ticket
    closed at 6:44; I collected the glass on my service tray then. I kept the tray with me, poured the shared
    punch at 6:46 and served Grant''s toast at 6:49. Signed: Service Manager.'
  rows:
  - - Initial lab finding
    - Cyanide inside Grant’s glass
  - - Shared punch and food
    - No cyanide detected
  layout: service_photos
  photo: ordinary_gala_contact_sheet_replacement_required
  timeline:
  - time: '6:32'
    caption: Place set / service manager's account
  - time: '6:44'
    caption: Kitchen ticket closed; glass collected
  - time: '6:46'
    caption: Shared punch poured
  - time: '6:49'
    caption: Grant's private toast
  photography_note: Two ordinary gala photographs show the unopened shop gift and the later salon setting.
    They do not show who handled the glass between those moments. The service account and kitchen ticket supply
    the stated times.
  photo_contract:
  - event: Incoming-gift table during reception
    observation: A wrapped shop glass beside other donor gifts; not a dedicated product-surveillance shot.
  - event: Wide view of the salon during mingling
    observation: The unwrapped glass sits at Grant's place in the background. No playing character is identified
      as handling it. The contents cannot be judged from the photograph.
- id: F4
  department: MERIDIAN / COLLECTIONS INVENTORY
  title: When the bottle was accessible
  text: Chip's incoming record notes application and inspection of a new band before the 6:20 preview. The
    condition photograph shows the closed, full bottle; it does not show every surface of the band. Visitors
    were permitted to observe the closed object. Opening or handling it was unauthorized. At 6:28 the bottle
    was returned to the cupboard, which stayed locked until the investigation. The concealed split was found
    after Grant's death. Grant's purchase condition and his loan declaration describe different contents. Active
    cyanide was found in the remaining bottle residue and in his glass.
  rows:
  - - Before 6:20 / Chip's record
    - New band applied and checked
  - - 6:20 / condition photograph
    - Closed bottle full; front of band visible
  - - 6:28 / secured afterward
    - Bottle returned to locked cupboard
  - - Loan description
    - Inert display liquid / supplied by Grant
  - - Purchase condition
    - Original poison retained
  - - Laboratory finding
    - Active cyanide detected
  layout: inventory_photo
  photo: incoming_condition_document_replacement_required
- id: F5
  department: LABORATORY / CASE FINDINGS
  title: The glass, not the punch
  photo: ordinary_gala_contact_sheet_replacement_required
  text: Cyanide was detected inside Grant's glass. The food and shared punch tested clear. Residue from the
    acquired bottle is consistent with the glass residue. A small scrap inside the glass has a red paper surface
    and silver-foil backing, like the bottle's band. The museum also uses this stock for decorative work. The
    material comparison does not identify who put the scrap in the glass.
  rows:
  - - Grant’s glass / inside
    - CYANIDE DETECTED
  - - Shared punch pitcher
    - NO CYANIDE DETECTED
  - - Food samples
    - NO CYANIDE DETECTED
  - - Acquired poison bottle
    - CONSISTENT WITH GLASS RESIDUE
  - - Scrap inside Grant’s glass
    - RED PAPER / SILVER FOIL BACKING
  layout: lab_findings
  trace_exhibit:
    title: The scrap inside the glass
    photo: material_comparison_replacement_required
    text: 'Left: scrap from inside Grant’s glass. Right: the damaged bottle band, with silver backing exposed.
      Both are red paper backed with silver foil. The museum uses this stock for custody bands and decorative
      work. The laboratory establishes material similarity, not a unique torn-edge fit or which person placed
      the scrap in the glass.'
discoveries:
- number: 1
  department: THE MERIDIAN / BOARD SECRETARY
  title: Gift agreement
  stamp: DRAFT - NOT EXECUTED
  paragraphs:
  - 'Donor: Grant Larceny. Recipient: The Meridian Museum of Art & World Cultures.'
  - '1. Naming: The institution shall be renamed The Grant Larceny Meridian Museum.'
  - '2. Governance: The donor shall retain approval rights over future acquisitions.'
  - '3. Management: Artie Ficial shall tender his resignation within sixty days of acceptance.'
  annotation: Artie - confirm acceptance before the unveiling. G.L.
- number: 2
  department: GENEVA FREEPORT / TRANSIT RECORD
  title: Shipping manifest / 1988
  stamp: OWNER REDACTED
  rows:
  - - Consignment
    - Isfahan Star Bowl
  - - Routing
    - Geneva freeport / onward transfer
  - - Shipper
    - Northstar Holdings
  - - Declared owner
    - REDACTED
  - - Export file
    - Not attached
  annotation: Keep with accession papers. Do not substitute exhibition label for ownership file.
- number: 3
  department: MERIDIAN STATIONERY / UNSIGNED
  title: A warning left behind
