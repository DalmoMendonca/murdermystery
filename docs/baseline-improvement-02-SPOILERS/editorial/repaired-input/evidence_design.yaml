    - Grant Larceny
  - - Accession approval
    - Anya Tique
  - - Object status
    - Accepted into collection
  - - Export papers
    - Promised - not yet received
  annotation: File remains incomplete.
- number: 12
  department: DADA DiCAPO / STAGE MANAGER'S RUNNING ORDER
  title: Closing effect
  paragraphs:
  - 'Cue after donor toast: lights change; apparent donor collapse.'
  - 'Concept: Dada DiCapo. Printed credit: The Larceny Foundation.'
  annotation: Keep equipment until the producer confirms strike.
  stamp: CANCELED
- number: 13
  department: GAVEL & ROWE / ACQUISITION RECEIPT
  title: The Velvet Widow
  rows:
  - - Lot 73
    - Sealed poison bottle from the Eleanor Vale murder case, 1891
  - - Buyer
    - Grant Larceny
  - - Proposed exhibition
    - The Art of Murder
  paragraphs:
  - 'Buyer’s condition of purchase: retain original contents. Do not substitute an empty bottle or replica.'
  stamp: COLLECTION TRANSFER / ORIGINAL CONTENTS RETAINED
- number: 14
  department: MERIDIAN / INCOMING LOAN CONDITION RECORD
  title: Contents declared by lender
  paragraphs:
  - Public exhibition approval is withheld pending verification of the contents declaration.
  stamp: EXHIBITION APPROVAL PENDING
  rows:
  - - Lender
    - Grant Larceny
  - - Object
    - The Velvet Widow bottle / lot 73
  - - Lender's contents declaration
    - Inert display liquid; original poison removed
  - - Independent contents verification
    - Not supplied
  - - Incoming inspection
    - Closed bottle; photograph and band before secure storage
  annotation: Signed lender's declaration retained with incoming-loan file.
- number: 15
  department: MERIDIAN / SHOW-CONTROL CONSOLE
  title: Canceled program cue
  stamp: SHOW-CONTROL JOB LOG
  rows:
  - - '6:37'
    - Display safety alert received
  - - 6:48 cue
    - CANCELED / emergency takes priority
  - - Curtain position
    - Closed at 6:38 / safety override
  paragraphs:
  - Display mounting alert received 6:37. Alcove closed at 6:38 pending inspection. Planned 6:48 closure canceled.
- number: 16
  department: MERIDIAN / PRIVATE SERVICE
  title: Grant Larceny’s toast
  stamp: DONOR SALON DELIVERY
  paragraphs:
  - 'Grant’s private toast: 6:49.'
  - Use the new donor glass from the museum shop, not the ordinary table glass. Grant specifically requested
    it.
  - Shared punch for everyone. The disputed extra course remains a separate catering order.
