    - Proposed change
  - - School tours
    - REDUCE
  - - Community programs
    - REDUCE
  - - Private donor lounge
    - INCREASE
  - - VIP entrance
    - INCREASE
  annotation: Anne E. Dote has not approved these cuts.
- number: 10
  department: MERIDIAN / TECHNICIAN'S JOB SLIP
  title: Salon camera disconnected
  stamp: JOB COMPLETED
  rows:
  - - Location
    - Donor Salon camera
  - - Work
