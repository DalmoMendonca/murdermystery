  essential: false
  redundant_official_reports: []
- number: 12
  resolution: The staged collapse was a canceled performance using a marked prop; the donor actually drank
    from a different glass.
  essential: false
  redundant_official_reports: []
- number: 13
  resolution: Grant demanded the original poison contents for The Art of Murder. Eleanor Vale’s 1891 case is
    fictional.
  essential: false
  redundant_official_reports: []
- number: 14
  resolution: The dangerous artifact was Grant’s private acquisition. It was tampered with during the accessible
    preview; poison remained so an empty-bottle alarm is unnecessary.
  essential: true
  redundant_official_reports:
  - F2
  - F4
- number: 15
  resolution: The mounting hold gathered guests in the salon. The override canceled the show, including Minnie’s
    hidden cue, but did not cancel the separate toast or cause Barb’s camera disconnection.
  essential: false
  redundant_official_reports: []
- number: 16
  resolution: The service docket separates the shared punch from Grant's private glass.
  essential: true
  redundant_official_reports:
