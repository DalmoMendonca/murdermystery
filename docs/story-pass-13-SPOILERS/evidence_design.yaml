schema_version: 1
reports:
- id: F1
  department: MERIDIAN / BOARD SECRETARY
  title: The gift came with conditions
  text: Grant Larceny collapsed after his toast and died at the gala. Earlier, trustees had discussed this
    unsigned gift agreement in the museum office. The label review, acquisition disputes and installation inspection
    continued in other rooms. These are the terms Grant wanted announced.
  rows:
  - - 1. Museum name
    - The Grant Larceny Meridian Museum
  - - 2. Collection decisions
    - Grant may veto future acquisitions
  - - 3. Museum director
    - Artie Ficial must resign within sixty days
  layout: gift_document
  document_label: DRAFT GIFT AGREEMENT / NOT SIGNED
- id: F2
  department: INVESTIGATION / INITIAL FINDINGS
  title: Cause of death and disturbed acquisition
  text: The initial examination identifies cyanide poisoning. Investigators found The Velvet Widow bottle in
    the locked preparation cupboard. Original contents remain; the stopper has been disturbed and the new red-and-silver
    custody band is split beneath its back edge. Food, drink, rehearsal equipment and personal items have been
    collected. Their laboratory results are not yet available.
  rows:
  - - Acquisition
    - The Velvet Widow / cyanide label
  - - Found after the death
    - Stopper disturbed; band split on hidden back edge
  - - Samples collected
    - Bottle, donor glass, shared punch, food, prop glass
  layout: bottle_photo
  photo: cyanide_bottle_v8
- id: F3
  department: MERIDIAN / CATERER’S RECORD
  title: The reception service record
  text: 'I delivered the wrapped donor glass at 6:30 and unwrapped it on the reception sideboard at 6:32. The
    guests were moving between the office, reading room, gallery and reception. The mounting hold stopped the
    unveiling; it did not close the reception. I returned to the kitchen to settle the extra-course authorization.
    At 6:44 I collected the glass onto my tray. At 6:46 I filled it from the shared punch and took it to Grant
    for the 6:49 toast. I kept that tray after collecting the glass. Signed: Reception Service Manager, a member
    of the catering crew; not Brie DeVivre.'
  rows:
  - - Laboratory results
    - Pending
  - - Other service
    - Shared punch and the gala meal
  - - Canceled performance
    - Prop glass and empty jacket collected for examination
  layout: service_photos
  photo: service_photos_v9
  timeline:
  - time: '6:30'
    caption: New donor glass, still wrapped
  - time: '6:32'
    caption: Unwrapped glass placed on reception sideboard
  - time: '6:44'
    caption: Service manager collects glass onto tray
  - time: '6:46'
    caption: Shared punch poured for the toast
- id: F4
  department: MERIDIAN / COLLECTIONS INVENTORY
  title: The bottle condition record
  text: The photograph immediately before the 6:20–6:28 guest preview shows the new custody band intact, including
    its back edge. The bottle was placed in the preparation cupboard and locked after the preview. It remained
    locked until the investigation. The stopper disturbance and hidden split were found then. Chip Patina applied
    the new band from museum packing stock. That red-and-silver stock is also used for closing-effect confetti
    and program decoration. The bottle remained Grant's private acquisition, not an approved museum display.
  rows:
  - - Before preview
    - New band photographed intact
  - - 6:20–6:28
    - Guest preview in preparation room
  - - After preview
    - Bottle locked away until investigation
  layout: inventory_photo
  photo: cyanide_bottle_v8
- id: F5
  department: LABORATORY / CASE FINDINGS
  title: Laboratory findings
  photo: service_photos
  text: Cyanide was found inside the donor glass; its base has the museum star. The shared punch, gala food
    and kitchen sauce batch tested clear. The glass marked PROP from the performance case also tested clear.
    The poison in Grant's glass is consistent with the remaining bottle contents. A small red-and-silver foil-backed
    paper fragment was recovered from the inside of the donor glass. Its construction matches museum packing
    stock, including the custody band. It is not a unique torn-edge match. Ordinary wrapping, brush water,
    wool fibers, plaster dust and sticker adhesive differ from that fragment.
  rows:
  - - Donor glass / museum star
    - Cyanide inside; small foil-backed paper fragment
  - - Shared punch / food / sauce
    - No cyanide detected
  - - Rehearsal glass / PROP
    - No cyanide detected
  - - Bottle comparison
    - Consistent with remaining contents
  - - Paper comparison
    - Common museum stock; not a unique tear match
  layout: lab_findings
  trace_exhibit:
    title: The scrap inside the glass
    photo: seal_fragment_v11
    text: 'Left: scrap from inside Grant’s glass. Right: the damaged bottle band, with silver backing exposed.
      Both are red paper backed with silver foil. The museum uses this stock for custody bands and decorative
      work. The laboratory establishes material similarity, not a unique torn-edge fit or which person placed
      the scrap in the glass.'
discoveries:
- number: 1
  department: THE MERIDIAN / BOARD SECRETARY
  title: Gift agreement
  stamp: DRAFT - NOT EXECUTED
  paragraphs:
  - 'Donor: Grant Larceny. Recipient: The Meridian Museum of Art & World Cultures.'
  - '1. Naming: The institution shall be renamed The Grant Larceny Meridian Museum.'
  - '2. Governance: The donor shall retain approval rights over future acquisitions.'
  - '3. Management: Artie Ficial shall tender his resignation within sixty days of acceptance.'
  annotation: Artie - confirm acceptance before the unveiling. G.L.
- number: 2
  department: GENEVA FREEPORT / TRANSIT RECORD
  title: Shipping manifest / 1988
  stamp: OWNER REDACTED
  rows:
  - - Consignment
    - Isfahan Star Bowl
  - - Routing
    - Geneva freeport / onward transfer
  - - Shipper
    - Northstar Holdings
  - - Declared owner
    - REDACTED
  - - Export file
    - Not attached
  annotation: Keep with accession papers. Do not substitute exhibition label for ownership file.
- number: 3
  department: MERIDIAN STATIONERY / UNSIGNED
  title: A warning left behind
  photo: warning_note
  paragraphs:
  - RETURN WHAT WAS TAKEN BEFORE THE STAR GOES DARK.
  stamp: NO SIGNATURE
- number: 4
  department: ARTS DESK / PRESS PROOF
  title: GRANT’S NIGHT OF GLORY
  stamp: HOLD FOR 9:00 PM
  paragraphs:
  - Private toast 6:49; naming announcement and closing performance follow.
  - Press proof / planned program. HOLD publication until signed naming agreement is received.
  annotation: Photograph the donor with the new museum-shop glass. Finish the caption after signature.
- number: 5
  department: MERIDIAN / CONSERVATION
  title: Treatment finding
  stamp: REVIEW REQUIRED
  rows:
  - - Object
    - Isfahan Star Bowl
  - - Examiner
    - Chip Patina
  - - 6:37 finding
    - Mount hairline crack
  - - Requested action
    - Seal display alcove immediately
  annotation: Close the display alcove. Hold the unveiling while the crew inspects the mount. Reception and
    other galleries remain open.
- number: 6
  department: MERIDIAN / LEGAL REVIEW
  title: Donor agreement / margin copy
  stamp: ORIGINAL OPINION
  paragraphs:
  - The proposed permanent gift remains subject to outstanding provenance review. An accession does not remove
    competing ownership claims.
  annotation: Permanent title does not cure disputed title. S.V.
- number: 7
  department: GAVEL & ROWE / ARCHIVE COPY
  title: Auction result
  stamp: LOT CIRCLED FOR REVIEW
  rows:
  - - Lot
    - Private collection acquisition
  - - Successful bidder
    - Anonymous / through Hugh Bidder
  - - Competing bidder
    - Grant Larceny
  - - Result
    - Sold to proxy buyer
  annotation: Payment through E.M.’s company. Hugh handled the proxy. Commission statement is held in the acquisition
    case.
- number: 8
  department: MERIDIAN / EXHIBITION LABEL PROOF
  title: Vincent Van Faux
  stamp: PROOF - NOT APPROVED
  paragraphs:
  - Early student work
  - Loan courtesy of Grant Larceny
  - Treasures of the World / Gallery label
  annotation: NO. This does not belong in the show.
- number: 9
  department: MERIDIAN / FINANCE DRAFT
  title: Education reallocation
  stamp: DONOR CONDITIONS
  rows:
  - - Program
    - Proposed change
  - - School tours
    - REDUCE
  - - Community programs
    - REDUCE
  - - Private donor lounge
    - INCREASE
  - - VIP entrance
    - INCREASE
  annotation: 'Finance instruction: no museum authorization for the private extra course. Education funding
    remains under the donor’s proposed conditions.'
- number: 10
  department: MERIDIAN / SECURITY WORK ORDER
  title: Donor Salon camera
  stamp: OFFLINE BY REQUEST
  rows:
  - - Requested by
    - Grant Larceny
  - - Action
    - Disconnect salon camera
  - - Start
    - 6:29 PM
  - - Reason
    - Private donor meetings
  - - Authorized by
    - Barb Dwyer
  - - Disconnected by
    - Staff technician
  annotation: Privacy exception for board discussion. Camera remained disconnected afterward. Gallery-door
    camera on a separate circuit.
- number: 11
  department: MERIDIAN / ACCESSION LEDGER
  title: Donation entry / 1989
  stamp: ARCHIVE EXTRACT
  rows:
  - - Donor
    - Grant Larceny
  - - Accession approval
    - Anya Tique
  - - Object status
    - Accepted into collection
  - - Export papers
    - Promised - not yet received
  annotation: File remains incomplete.
- number: 12
  department: DADA DiCAPO / WORKING NOTEBOOK
  title: Closing reveal / concept
  photo: performance_sketch
  paragraphs:
  - 'Closing effect: empty jacket on hinged stand; lights create apparent donor collapse. Rehearsal glass marked
    PROP beneath base.'
  - Credit changed from Dada DiCapo to The Larceny Foundation. Donor canceled the effect.
  annotation: Stage manager’s retained rehearsal plan. Restore only on operator approval.
- number: 13
  department: GAVEL & ROWE / ACQUISITION RECEIPT
  title: The Velvet Widow
  rows:
  - - Lot 73
    - Sealed poison bottle from the Eleanor Vale murder case, 1891
  - - Buyer
    - Grant Larceny
  - - Proposed exhibition
    - The Art of Murder
  paragraphs:
  - 'Buyer’s condition of purchase: retain original contents. Do not substitute an empty bottle or replica.'
  stamp: COLLECTION TRANSFER / ORIGINAL CONTENTS RETAINED
- number: 14
  department: MERIDIAN / CONSERVATOR’S MEMORANDUM
  title: The conservator’s objection
  paragraphs:
  - This remains Grant’s private acquisition. Original poison is inside. I withhold exhibition approval and
    request an empty replica.
  - Grant insists on a preview of the sealed object during the 6:20–6:28 preparation walkthrough. Record its
    condition before the preview, apply a custody band, and lock it in the cupboard afterward.
  stamp: EXHIBITION APPROVAL WITHHELD
  annotation: No permission to open the bottle or use its contents.
- number: 15
  department: MERIDIAN / SHOW-CONTROL CONSOLE
  title: Canceled program cue
  stamp: LIGHTING JOB LOG / NOT SECURITY LOG
  rows:
  - - 6:35 / stage call
    - HOLD UNVEILING / mounting inspection
  - - 6:37 / console
    - CANCEL SHOW SEQUENCE / safety override
  - - Donor toast
    - Separate service order; not canceled by lighting console
  paragraphs:
  - The mounting alarm stops the unveiling and cancels the show sequence. Reception service continues.
  - The safety override cancels an unapproved blackout. Security camera power is independent of this console.
- number: 16
  department: MERIDIAN / PRIVATE SERVICE
  title: Grant Larceny’s toast
  stamp: RECEPTION SERVICE ORDER
  paragraphs:
  - Toast at 6:49. Photograph Grant holding the new museum-shop glass; museum star etched into base.
  - Keep the glass on the reception sideboard until the presentation is ready. Fill from the shared punch.
  - 'Extra course: obtain finance authorization before service.'
