  method_innocent: "The substituted supplier sent dessert wrappers. They aren't the foil-backed stock from the acquisition case. The kitchen kept the sauce batch, and its test is clear. I wiped the stem and base, not the inside. I handled the real glass, and the order changes are mine. The tests don't pay the crew, but they do settle what was in the food I delivered."
