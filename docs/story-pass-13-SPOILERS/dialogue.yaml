- id: '25'
  motive: "The gift turns our teaching room into a private donor lounge. I circulated a petition saying Artie approved it. He hadn't. The signatures are real; the endorsement isn't. Grant's assistant offered to keep one class if I withdrew the petition. One class wouldn't keep the educators employed, and I didn't have the right to bargain away everybody else's objection."
  opportunity_innocent: "Artie's trustees passed through the teaching gallery on their way to the office. I handed out the petition there. Tess wouldn't sign a promise about museum money; I told her it was about the room. Later I stole the assistant's revised class list off the lectern so the staff could see what had been cut. The assistant noticed. I wasn't collecting polite feedback anymore."
  opportunity_murderer: "Artie's trustees passed through the teaching gallery, and I handed out the petition. I'd taken the clipboard through the acquisition preview. At the reception sideboard I moved Grant's glass, put the petition beside his program, and took the revised class list for the staff. The assistant noticed the missing list. I wanted the real cuts seen before Grant praised his education gift."
  method_innocent: "Artie's message withdraws the endorsement I invented. The stapled pages have actual staff signatures, and the revised class list removes more than one course. Those are the pages I took to the teaching gallery. I won't withdraw them to recover a single class. I can correct my false endorsement without pretending the staff's objections were false too."
  method_murderer: "Artie's message withdraws my invented endorsement; the signatures and class cuts are real. The red-and-silver piece caught in the clipboard came from the acquisition preview. I carried it to the sideboard when I moved the glass and took the class list. I wanted Grant asked about the cuts in front of the people he was thanking for his gift."
- id: '26'
  motive: "Grant asked me to delete a picture of him and Hugh beside the shipping papers. I agreed, deleted the camera copy, and kept a print. I hadn't read the papers. I knew only that a man paying for a photographer was trying to decide which encounter could be photographed. Hugh later asked what Grant had made me remove. I didn't show him the print."
  opportunity_innocent: "I moved between the installation inspection and the reception. The glass delivery appears in the background of one picture; it wasn't the assignment. When Grant's assistant asked for a donor portrait, I said the mount was still closed. I put the backup print in my photo sleeve and gave him an empty one. I'd become a bad custodian of a picture I was pretending not to have."
  opportunity_murderer: "I covered the installation inspection after carrying my photo sleeve through the preview. At the reception sideboard I shifted Grant's glass to arrange the donor portrait and slid the empty sleeve beside it. The backup print stayed with me. His assistant wanted the mount out of the photograph. I wasn't going to make the evening look as if the inspection or the shipping conversation hadn't happened."
  method_innocent: "The original camera deletion and the backup print both survive in the file history. The glass delivery is a background detail, not proof of what happened later. My marked sleeve stayed in the camera case while I photographed the crew. I kept a picture after promising to delete it. Its value doesn't make that promise disappear."
  method_murderer: "The deletion and backup print both survive. A loose red-and-silver piece from the preview was inside my photo sleeve when I arranged the donor portrait and shifted the glass. The picture I kept doesn't show what happened at the sideboard. Hugh wanted to see it, and Grant wanted it gone. I had decided neither would control every copy."
