schema_version: 1
status: Authored dialogue prototype, not production
characters:
- id: '01'
  motive: "I've accepted another job. The board doesn't know. Grant put my resignation in the gift agreement, which would let him claim he removed me instead of admitting I was leaving. I circulated a demand bearing his signature. I copied it. I wanted the trustees to see what accepting his money would cost them."
  opportunity_innocent: "Monet wouldn't release the board papers until I stopped calling the draft an agreement. So I took the trustees into the office and read it aloud. Most of them wanted champagne first. I asked the service manager to delay the announcement, not the drinks. When the chair refused a vote, I came back to the reception. I had managed to stage a board crisis with no board meeting."
  opportunity_murderer: "Monet wouldn't release the board papers until I stopped calling the draft an agreement. I took the trustees into the office; they wanted champagne first. Back at the reception I shifted Grant's glass on the sideboard to put the acknowledgment cards behind it. I'd been through the acquisition preview earlier. I still had his resignation envelope. I wanted those cards in his photograph, whether he signed or not."
  method_innocent: "The chair's reply says the demand isn't binding. She also attached my draft, including the signature I copied. That is embarrassing evidence, and accurate. The trustees returned to the reception without voting. My attempted coup ended in an instruction to stop sending things in the chair's name. The marked envelope stayed with the office papers."
  method_murderer: "The chair's reply says the demand isn't binding. She also attached my draft, including the signature I copied. The red-and-silver scrap in my envelope came from the acquisition case; I didn't save it as a souvenir. That envelope was still with me when I moved Grant's glass. The forged signature is mine. His insistence that I resign wasn't."
- id: '02'
  motive: "The ownership review arrived six weeks ago. I left it out of the board pack because I was afraid they'd cancel the exhibition. Now Grant wants my label to say his title is settled. It isn't. I built this show, and I helped create the lie that might destroy it. He wanted me to say the lie into a microphone."
  opportunity_innocent: "Reed found my old label proof and asked why the qualification had disappeared. Art was there, which made bluffing unwise. We worked at the gallery label bench while Grant went to the board meeting. I took the ownership claim off the replacement label and covered the old one. Nobody had authorized either edit. The curtain stayed closed because the mount was cracked, not because I had solved the title."
  opportunity_murderer: "Reed found my old label proof. Art was there, so I took the ownership claim off the replacement and covered the old one. I carried the disputed proof from the acquisition preview back to the reception. At the sideboard I moved Grant's glass to lay the proof flat. I wanted his assistant to take it to him before he made the announcement. I had already changed the label without authority."
  method_innocent: "There are two proofs, with my corrections between them. Neither authorizes the museum to own the bowl. The ink on my fingers is label ink; the registrars use it too. I've handed over the review I kept back. Restoring one qualification won't undo six weeks of silence, but the label won't pretend the dispute has disappeared."
  method_murderer: "There are two proofs, with my corrections between them. Neither authorizes the museum to own the bowl. The foil-backed scrap caught in my proof folder was packing from the acquisition case, not part of either label. I carried that folder through the preview and put it by Grant's glass. I've handed over the review I kept back. He never agreed to print the qualification."
- id: '03'
  motive: "Someone sold me a forged certificate. I then improved my file so it looked as if I'd asked all the right questions. I hadn't. Grant wanted a refund the firm couldn't pay. He was prepared to describe me as the forger, which would simplify his lawsuit and end my career. There's a difference between being fooled and lying afterward. I managed both."
  opportunity_innocent: "I reached the museum after the preview had finished. Elon was waiting with the acquisition invoice, and Saul's fee was still on it. We met in the reading room. I offered a settlement; Elon pointed out that I wasn't the buyer. I tore the offer in half before anyone accepted it. Grant wasn't in the room. I later shut his certificate case when it was left open at the reception."
  opportunity_murderer: "I came early enough for the acquisition preview, then met Elon in the reading room. I offered a settlement; he pointed out that I wasn't the buyer. At the reception I shut Grant's certificate case and shifted his glass out of its way. The torn offer was still in my pocket. I had intended to keep this between dealers. The invoice had other ideas."
  method_innocent: "The admission receipt puts my first entry after the cupboard was locked. The two certificate files show exactly what I changed afterward. Elon's company paid for the acquisition; that wasn't Grant's purchase. I'll refund the fee I actually earned, not invent money the firm doesn't have. Tearing up an offer did not cancel the underlying fraud."
  method_murderer: "The two certificate files show what I changed afterward. Elon's company paid for the acquisition; that wasn't Grant's purchase. I kept a red-and-silver strip with the torn offer after the preview. Both stayed in my pocket when I shifted Grant's glass. The firm can't meet his refund demand. A new certificate doesn't manufacture the money, either."
- id: '04'
  motive: "I used restricted money for payroll. It was that or tell people their checks weren't coming. I expected to replace it when the gift cleared, which is how you end up committing a second bad transaction to hide the first. Grant wanted his private wing expenses in the same transfer. He'd get the wing. I'd get the audit."
  opportunity_innocent: "Artie brought the gift draft into the office while I was trying to reconcile payroll. I refused his signature sheet and Grant's extra dinner course. The service manager came to check that second refusal; I sent him back to the kitchen to stop it. I corrected the catering authorization myself. Somebody now has two versions of an invoice and a perfectly good reason not to trust me."
  opportunity_murderer: "Artie brought the gift draft into the office while I was reconciling payroll. I refused his signature sheet and Grant's extra dinner course. I later took the authorization envelope to the reception sideboard and moved Grant's glass so the manager could see it. I'd carried that envelope through the acquisition preview. Two invoice versions don't improve my position, but there really were two orders."
  method_innocent: "The bank transfer is mine. The kitchen authorization is also mine, and says not to serve the extra course. They're separate decisions. The leaking pen stained my ledger; there wasn't a stain on a serving vessel. I've given the accountant the restricted-fund entries. Cutting Grant's dinner charge didn't repair the payroll account."
  method_murderer: "The bank transfer is mine, and the kitchen authorization says not to serve the extra course. They're separate decisions. I kept a piece of the acquisition's red-and-silver packing in that envelope after the preview. I still had it at the sideboard when I moved the glass. I've given the accountant the entries. Grant wanted me to make his expenses disappear inside them."
- id: '05'
  motive: "I changed the treatment date to meet an insurance deadline. That's my mess. Grant wanted the fresh repair described as ancient, which is a much larger mess. Once a conservator signs that report, the next owner quotes it forever. I was trying to correct my date without signing his invented history. He regarded both as clerical chores."
  opportunity_innocent: "Frank's mounting approval didn't match what I saw in the gallery. We checked the support, found a real crack, and closed the alcove. Before that, I had put the new band on the acquisition bottle for its condition photograph. Grant wanted the original shown; I wanted an empty replica. I filed the objection. I should have insisted the preview stop instead of assuming a sealed case was enough."
  opportunity_murderer: "Frank's mounting approval didn't match the support. We found a real crack and closed the alcove. I'd put the new band on the acquisition bottle before its preview; Grant insisted on the original. Later I moved his glass on the reception sideboard to make room for the withdrawn treatment report. I wanted that report returned before his announcement. He was asking for more than a corrected date."
  method_innocent: "The crack is in Frank's close-up, and the first treatment date is still legible under my correction. The unused band stock in my kit belongs there: I made the custody band. I didn't approve the original bottle for exhibition. That objection doesn't erase the mistake of permitting a preview, but it wasn't a secret instruction to anyone handling a drink."
  method_murderer: "The crack is in Frank's close-up, and the first treatment date is still legible. I made the custody band, so red-and-silver stock in my kit isn't remarkable. The loose piece beside my withdrawn report was already detached when I took the report to the sideboard. I moved Grant's glass there. He still hadn't returned the report he wanted me to sign."
- id: '06'
  motive: "I wrote the warning. It meant return my work, including the credit. The program calls Grant the creator of a performance he has never seen rehearsed. I devised a donor jacket that appears to collapse. He canceled the performance but kept the idea for his foundation's film. Apparently my contribution was making it easy to steal."
  opportunity_innocent: "Minnie stopped the lighting operator before the rehearsal. I brought the empty jacket and the marked prop glass into the gallery to show what had actually been approved. No performer was supposed to drink anything. I wanted the donors to see Grant cancel his own tribute. When the mounting fault closed the alcove, the jacket went back on its stand and the prop glass went into its case."
  opportunity_murderer: "Minnie stopped the lighting operator before rehearsal. I brought the empty jacket and marked prop glass out to demonstrate the approved effect. I'd also been at the acquisition preview. Back at the reception I lifted Grant's actual glass from the sideboard to show his assistant why it wasn't a stage prop, then put it back. My working program was under my arm. He was still taking credit for the canceled piece."
  method_innocent: "PROP is painted underneath the rehearsal glass. The stand is empty, and the sketch shows how the jacket moves. The closing-effect foil is unused stock, not a drink ingredient. The technician returned the rehearsal glass to the case. I planned an unauthorized performance of my authorized idea; neither wording improves my behavior. It wasn't a poisoning effect."
  method_murderer: "PROP is painted underneath the rehearsal glass. The stand is empty, and the sketch shows how the jacket moves. A loose red-and-silver piece from the acquisition case caught in my program earlier. The program came with me when I lifted the actual donor glass. The prop glass went back into its case. Grant's film credit still said his foundation created the work."
- id: '07'
  motive: "The anonymous purchases were mine. I was buying my student paintings back before someone held a retrospective of work I painted on borrowed grocery money. Grant owns the worst one. I asked him to lend a recent painting; he offered that one instead and called it generous. I painted over the signature on the loan form. That was a tantrum, not a correction."
  opportunity_innocent: "I turned the student painting toward the gallery wall. Elle said it looked better that way, which didn't help. I painted out my name on the display sketch and spilled brush water in my own cup at the workbench. Grant's assistant brought a sale form; I wrote an impossible price on it. Most of the evening I was trying to keep one picture from being photographed."
  opportunity_murderer: "I turned the student painting toward the wall. Elle said it looked better that way. After the acquisition preview I took Grant's sale form to the reception sideboard, moved his glass to keep the wet sketch clear, and wrote an impossible price. My paint pouch was still with me. I was trying to stop a photograph from becoming the story of my entire career."
  method_innocent: "The paint on the sketch is mine. The cup at the workbench contains brush water, and it stayed beside the turned painting. Those anonymous receipts also belong to me. Grant didn't discover a forgery; he discovered that I was embarrassed. The picture is real. I won't be lending him another one to improve his taste."
  method_murderer: "The paint on the sketch is mine, and the anonymous receipts belong to me. A red-and-silver scrap from the preview ended up in the paint pouch I carried to the sideboard. I moved the donor glass while the sketch was still wet. The picture is real. So is the price I wrote, though no sane buyer would pay it."
- id: '08'
  motive: "I softened my opinion to keep an account. The qualification stayed in the attachment, where clients put things they don't want to read. Grant called the summary clearance. I failed to correct him publicly. Now the museum wants my signature on a permanent gift, and I have to tell them what my own summary made easy to overlook."
  opportunity_innocent: "Claire brought both label versions to the reading room. I opened the opinion and found the attachment missing from the copy sent to trustees. I put it back and crossed out the proposed signature line. Penny wanted that line left blank for a different reason. Grant heard our objection from his assistant. I didn't need a private audience to make him angry; the crossed-out line did it."
  opportunity_murderer: "Claire brought both label versions to the reading room. I put the omitted attachment back and crossed out the proposed signature line. I'd carried my legal case through the acquisition preview. At the reception sideboard I moved Grant's glass and laid the opinion underneath his signing pen. His assistant had already relayed the objection. I wanted him to confront the qualification before he confronted the cameras."
  method_innocent: "Both versions mention the title problem. The old cover letter makes my failure to emphasize it obvious. The torn corner is from the unsigned agreement I withdrew, not an acquisition label. I can explain the advice; I can't pretend it was emphatic enough. The trustees have the attachment now, including the paragraph Grant called unnecessary."
  method_murderer: "Both versions mention the title problem. The old cover letter makes my failure obvious. The red-and-silver piece in my case came from the acquisition preview, not the torn agreement corner. That case went to the sideboard when I moved Grant's glass. The trustees have the attachment now. I'd hoped the qualification would settle the announcement without another argument about fees."
- id: '09'
  motive: "One sentence in my article outruns the source. Reed noticed, and I told him I'd correct it. I then let him think the correction had already been published. Grant used that sentence to demand withdrawal of the entire article. A historian who can't distinguish a bad inference from a worthless source ought to teach something less hazardous. I include myself in that."
  opportunity_innocent: "Reed produced the catalog record while Claire was changing the label. I fetched the archive transcription from my bag and wrote the correction across my speech cards. I also removed a quotation I could no longer defend. Grant's assistant asked whether I'd still endorse the acquisition. I said the endorsement had never been mine to give. Then I argued with Reed about whose name should go on the correction."
  opportunity_murderer: "Reed produced the catalog record while Claire changed the label. I wrote the correction across my speech cards. I'd taken those cards through the acquisition preview. At the reception sideboard I shifted Grant's glass and put the corrected cards beside his pen. His assistant wanted an endorsement; I wanted my qualification read. Reed and I were still disputing whose name should accompany the correction."
  method_innocent: "The archivist received the correction before I came here. Publication is another matter; it hadn't happened. The transcription contradicts my original sentence, not every sentence in the article. My marked cards went to the lectern, where the wrong version was removed. If my reputation survives, I'd like it based on the correction I finally made rather than the one I claimed was finished."
  method_murderer: "The archivist received the correction before I came here; publication hadn't happened. The transcription contradicts one sentence. A foil-backed red piece from the acquisition case remained among my cards after the preview. I had those cards when I shifted Grant's glass and left the correction. I didn't write the endorsement his assistant wanted. What he intended to announce was a different claim."
- id: '10'
  motive: "Grant wants my trust signature and tells people I don't understand the money. I understand that he can't move it without me. I've told the family trustees I can block him, which is optimistic: I have influence, not a majority. I brought the amendment anyway. I was tired of being introduced as a decorative source of funds."
  opportunity_innocent: "I arrived after the acquisition preview. Artie tried to recruit me into his board vote; I wouldn't trade our trust for his job. At the reception I broke the stem of a plain rental glass pulling the amendment out of my evening bag. I hid it in the napkin stack. I didn't want my first useful act as a trustee to be making somebody sweep up after me."
  opportunity_murderer: "I arrived in time for the acquisition preview. Artie tried to recruit me into his vote; I wouldn't trade our trust for his job. At the sideboard I moved Grant's engraved glass so I could lay out the amendment from my evening bag. I also broke a plain rental stem and hid it in the napkin stack. The family hadn't given me the majority I claimed."
  method_innocent: "The entrance receipt is after the bottle went back into the cupboard. The broken stem has no museum star: it's a rental. The assistant took it from the napkin stack before the toast. My amendment is still unsigned. I told the trustees I had enough support because I hoped saying it would make somebody else commit. It didn't."
  method_murderer: "The broken stem is a rental, and the amendment is still unsigned. The red-and-silver scrap in my bag came from the acquisition case at the preview. I had the bag on the sideboard when I moved the engraved glass. I told the trustees I had enough support because I hoped somebody else would commit. Grant kept asking for my signature as if it were already his."
- id: '11'
  motive: "My officers warned me about the Salon camera. I overruled them because Grant asked for privacy. I then left the exception out of the incident log. It wasn't a clever technical failure. It was me deciding an important guest could have a different security policy. One officer is now being blamed for following my order. I won't let that version stand."
  opportunity_innocent: "I disconnected the camera for the private board discussion. When the installation alarm sounded, I checked the gallery door and sent people around the closed alcove. I never restored the camera. Frank wanted his test lamp back on; that wasn't the same circuit. I told my junior officer to stop recording the arguments in the log. She kept her notebook, and she was right to."
  opportunity_murderer: "I disconnected the Salon camera and sent guests around the closed alcove when the installation alarm sounded. I'd attended the acquisition preview before that. At the reception sideboard I moved Grant's glass while checking whether service was blocking the exit. My log folder was still under my arm. I also told my junior officer to stop recording the arguments. She kept her notebook."
  method_innocent: "Grant's privacy request exists. So does my officer's warning, which I omitted. The gallery-door camera kept running; it doesn't show the sideboard. My exception was deliberate. It explains why there's no Salon recording, not what happened in the missing picture. The officer's notebook will stay in the record even though it makes my order look worse."
  method_murderer: "Grant's privacy request and my officer's warning both exist. The gallery-door camera kept running; it doesn't show the sideboard. A red-and-silver piece from the preview was caught in my log folder when I checked the exit and moved the glass. I omitted the warning from the log. My officer's notebook records it anyway, including the order I gave her."
- id: '12'
  motive: "I corrected a sentence in my report and wouldn't give Grant the source behind it. He proposed a settlement that would bury the correction and the story together. My editor wanted the correction printed; my source wanted no name. I could satisfy both until Grant insisted the source was the price of leaving us alone. I kept reporting."
  opportunity_innocent: "I tucked a recorder into Grant's coat while he was in the board office. Then Justin played a recording of his own in the reading room, and I realized his version would expose somebody I hadn't named. I stopped him, sharply. At the reception I photographed the shipping cover and took my recorder back. I moved the papers to reach the coat, not the drinks."
  opportunity_murderer: "I tucked a recorder into Grant's coat, then stopped Justin playing a recording that would expose my source. I'd taken my notebook through the acquisition preview. At the reception I photographed the shipping cover, moved Grant's glass to reach the coat pocket, and retrieved the recorder. The paper and notebook came with me. Justin thought I was trying to keep the story for myself."
  method_innocent: "My editor has the earlier corrected copy. The cover photograph doesn't show the missing permit, whatever Justin thinks I captured. The recorder and its time-stamped file survive; I didn't give them to Grant for approval. I protected a source while making somebody else's reporting harder. That deserves an argument about journalism. It doesn't turn the coat into a drink container."
  method_murderer: "My editor has the earlier corrected copy, and the photograph shows a cover rather than a permit. The loose red-and-silver strip in my notebook came from the acquisition preview. The notebook was with me when I moved the glass to reach Grant's coat. Justin wanted to play his recording. I wanted to decide when the person behind mine became public."
- id: '13'
  motive: "The temporary mounting approval has my name on it. I signed before I saw the completed support. Grant wanted a heavier display, and I told myself we'd sort it out on site. Chip then found the crack I should have prevented. I'm paid to make things stand up. 'We intended to fix it' is not a useful architectural specification."
  opportunity_innocent: "Chip and I closed the gallery alcove. I pulled my approval tag out of the file so nobody could mistake it for the stop-work notice we were issuing. That was also a convenient way to hide my first signature. Al was arguing about his sculpture nearby. I unplugged the display test lamp and refused the assistant's request for an approval photograph. The support was still unsafe."
  opportunity_murderer: "Chip and I closed the alcove, and I pulled my earlier approval tag from the file. I'd already been through the acquisition preview with my drawing tube. I later took the withdrawn tag to the reception sideboard, moved Grant's glass, and left it with his photograph request. I wasn't going to make an unsafe support look finished for the donors. Al was still arguing about the replacement sculpture."
  method_innocent: "The first approval tag and the real stop-work notice are both here. They describe different conditions because I signed the first too soon. The lamp I unplugged was at the display, not the security camera. The close-up records a crack, not a theatrical collapse. I'm not entitled to call the mistake precautionary work just because I finally stopped the unveiling."
  method_murderer: "The first approval tag and the real stop-work notice describe different conditions. I signed too soon. The loose foil-backed red piece in my drawing tube came from the acquisition preview; I carried it when I moved the donor glass to leave the tag. The display lamp wasn't the camera. That distinction won't rescue my first approval, and I haven't asked it to."
- id: '14'
  motive: "I leaked the restitution talks without permission from the people I'm representing. Grant wanted to announce permanent ownership. I wanted the dispute heard before it sounded like a donation everyone had accepted. Both of us decided we could speak for people who weren't in the room. I'm now trying to stop his announcement without pretending my own disclosure was authorized."
  opportunity_innocent: "Sue had the opinion, Penny had family letters, and none of us had the missing export permit. We compared them in the reading room. I took Grant's proposed permanent-loan clause out of the delegation's draft. I didn't destroy it; I needed them to see what he'd proposed. When the curtain closed at the gallery, I told a reporter why the ownership label couldn't be read as fact."
  opportunity_murderer: "Sue, Penny, and I compared the opinion and letters in the reading room. I had carried the delegation's folder through the acquisition preview. At the reception sideboard I moved Grant's glass and took his permanent-loan clause from the papers beside it. I kept the clause. The delegation needed to see what he wanted announced, including the part I had already leaked without their permission."
  method_innocent: "The delegation's signed draft has the permanent-loan clause crossed out. My leak is attached to their objection, so I can't claim they approved what I did. The closed curtain came from the mounting fault. I used that delay to get the title dispute heard. The written objection concerns the bowl; it doesn't authorize a dangerous original poison bottle or a change to service."
  method_murderer: "The delegation's draft has the permanent-loan clause crossed out, and their objection includes my leak. A red-and-silver scrap from the acquisition preview was in their folder when I took the clause off the sideboard. I moved Grant's glass to reach it. The curtain closed because of the mount. I used the delay; I didn't ask the delegation to approve that decision."
- id: '15'
  motive: "My company bought the lot Hugh bid on. Anonymity was cheaper than beating Grant in a public bidding war. I also negotiated a board seat without disclosing who owned the buyer. That's why the invoice has a company name nobody recognizes. I wanted influence without a contest. Now I have the object, the contest, and several trustees wondering what else I bought."
  opportunity_innocent: "Hugh offered me a settlement in the reading room. I asked why he was offering my own money back to me. Saul's fee was still on the invoice. I sent Grant's assistant a lower-price proposal and put a copy of the ownership paperwork into his acquisition case at the reception. I wanted him to negotiate with the actual buyer instead of insulting the company on the bill."
  opportunity_murderer: "Hugh offered a settlement in the reading room, with Saul's fee still on it. I'd carried the company invoice through the preview. At the reception I put ownership paperwork in Grant's case and moved his glass to get the lid open. My invoice wallet was on the sideboard. I wanted him negotiating with the actual buyer. Anonymity had stopped being economical."
  method_innocent: "The bank confirmation names my company. Hugh was acting for it; the company wasn't his. The lower-price proposal includes a board-seat clause I didn't disclose to the other bidders. That is what I was negotiating at the reception. I wasn't paying for the historical poison bottle Grant bought separately. Mixing the two invoices makes me look tidier than I deserve."
  method_murderer: "The bank confirmation names my company, and the proposal includes the board-seat clause I withheld. The red-and-silver piece in my invoice wallet came from Grant's separate acquisition preview. The wallet was beside the glass when I opened his case. The two purchases aren't the same deal. Grant behaved as if winning either let him decide every other transaction in the room."
- id: '16'
  motive: "In 1989 I accepted the donation before the papers were complete. The museum needed it. I trusted Grant's promise that the missing documents would follow. They never did. Reed asked me to show him the original file, and I sent a copy with the exception page missing. I had spent too long calling an omission an administrative delay."
  opportunity_innocent: "I arrived after the preview and went to the archive desk. Reed had found my incomplete copy. I replaced it, badly: I put the older sheet back without the page explaining what we hadn't received. Claire asked to see the entire file, and I handed it over. Grant wasn't there. For once the argument was about a decision I had actually made, rather than one he wanted me to make tonight."
  opportunity_murderer: "I came for the preview with the archive file, then tried to replace the incomplete copy at the desk. Claire asked for the whole file. Back at the reception I put the old sheet beside Grant's glass and shifted the glass so he could see the exception page. I had kept the file with me. I wanted him to stop presenting my old signature as a complete history."
  method_innocent: "The original exception sheet lists the missing papers, and the entrance receipt places my arrival after the bottle was locked away. My signature didn't certify documents that weren't there. But I kept the gap out of the copy Reed saw. The complete file is available now. A founding curator should have been its custodian, not its editor."
  method_murderer: "The exception sheet lists the missing papers. My signature didn't certify documents that weren't there. A red-and-silver strip from the preview remained inside the archive file when I set it beside Grant's glass. I moved the glass to expose the old sheet. The complete file is available now. I had spent thirty-seven years waiting for the promise behind that signature to be honored."
- id: '17'
  motive: "The auction subsidiary charged a discretion fee. I approved it. Grant decided discretion should be complimentary once the invoice arrived. He wanted me to waive the charge and keep the buyer hidden from the board. A man can insist on privacy or object to its price. Grant found time for both, generally while someone else was speaking."
  opportunity_innocent: "Hugh asked whether the invoice could be rewritten before Elon saw it. I said the fee would remain. Then I wrote a separate waiver I had no authority to offer and slid it into Grant's case at the reception. I took it back when his assistant started reading it aloud. That was not a successful negotiation. It was an unauthorized discount with an audience."
  opportunity_murderer: "Hugh wanted the invoice rewritten. After the acquisition preview I drafted a waiver I had no authority to offer, then slid it into Grant's case at the sideboard. I moved the glass to open the case. My auction wallet was still there when the assistant began reading the waiver aloud. I took the paper back. Grant could have paid the fee before it became a performance."
  method_innocent: "The sale and the fee have different invoice lines. The subsidiary didn't acquire the bowl in its own name. My waiver is in the case file, crossed out by me after I retrieved it. The papers establish a commission dispute. I can't make that respectable by calling it discreet, and I can't charge the museum for Grant's private bottle purchase."
  method_murderer: "The sale and fee have different invoice lines, and my unauthorized waiver is crossed out. A foil-backed red scrap from the preview is in my auction wallet. The wallet went onto the sideboard while I moved the glass and inserted the waiver. Grant's bottle purchase was private. The fee dispute wasn't, once his assistant started reading numbers to the room."
- id: '18'
  motive: "I promised the textile before asking the relatives who share it. I thought they'd be pleased to see it here. They weren't. Grant then offered to buy it and make the consent problem disappear. It wasn't his problem to settle, and I had created it myself. Tonight I wanted the loan withdrawn before someone photographed him receiving it."
  opportunity_innocent: "Vincent was turning his painting to the wall. I folded the textile and carried it off its stand. We were both sabotaging the photographs, for different reasons. I left the museum's transfer form unsigned and told the registrar to call my family directly. Grant's assistant followed me with an offer. I put it under the empty stand and kept carrying the textile."
  opportunity_murderer: "Vincent turned his painting to the wall while I removed the textile. I'd carried its folded wrapping through the acquisition preview. At the reception sideboard I put Grant's offer down, moved his glass to keep it off the textile, and folded everything back over my arm. The registrar could call my family. I had no intention of letting a photograph turn my promise into ownership."
  method_innocent: "The transfer form has no signatures. The family message refuses the loan, and the textile went back into its own wrapping. I withdrew an unauthorized promise. Its woven border is fabric; the red-and-silver paper belongs to the museum's packing and effects stock. Vincent and I didn't become co-owners of a scheme because we were both avoiding a photographer."
  method_murderer: "The transfer form is unsigned and the family message refuses the loan. A piece of red-and-silver paper from the preview was caught inside my folded wrapping when I moved Grant's glass. It isn't part of the woven border. Vincent wanted his painting hidden. I wanted the textile out of Grant's hands before my own family had to demand it back."
- id: '19'
  motive: "I copied a reference without reading the original carefully. Art trusted the note. I then hid the correction because admitting my error would damage his article too. Grant wanted the old attribution kept for the exhibition. I'd managed to become the junior person everybody could blame while they continued using my mistake. I changed the online catalog without permission."
  opportunity_innocent: "Claire had two label proofs, and Art had a correction he claimed was finished. I opened the catalog on my phone and replaced the attribution while they argued. The registrar's published page changed underneath her printed label. I took a screenshot of both versions, then kept Art's implication out of the note. He noticed. Our quarrel was beside the label bench, where it belonged."
  opportunity_murderer: "I changed the online attribution while Claire and Art argued over the label. I'd taken my research folder through the acquisition preview. At the reception sideboard I moved Grant's glass and put a printed catalog correction beside his program. I kept Art's part out of the note. He noticed that too. I wanted Grant reading the source instead of repeating the old credit into a microphone."
  method_innocent: "The version history gives my edit and its earlier wording. The original source distinguishes a maker from a later owner. My first reference did not. Art's correction and mine should carry both names. The screenshot explains the sudden mismatch between label and website; nobody altered a bottle label in that change. The catalog record is public, including my badly timed edit."
  method_murderer: "The version history gives my edit; the original distinguishes a maker from a later owner. A red-and-silver piece from the acquisition preview is in my research folder. I carried the folder to the sideboard and moved Grant's glass to leave the correction. Art wants both names on it now. Grant wanted neither of us complicating the attribution he had bought."
- id: '20'
  motive: "I changed the sculpture support and left the fabricator out of the credit. Grant ordered a cheap replica to replace it. I was furious about the unpaid balance, which gave me a convenient way to sound indignant about the workers I'd failed to credit. The replacement was arriving while my original stood at the door. I'd like to claim I only cared about the work."
  opportunity_innocent: "Frank closed the alcove while I was arguing with the delivery crew about the replica. At the reception I picked up Grant's empty engraved glass and made a mock toast to the cheapest available sculpture. Brie told me to put it down. I did. The crew then showed me the support I'd changed. My apron was dusty because I'd been trying to hide a repair rather than announce it."
  opportunity_murderer: "Frank closed the alcove while I argued with the crew about the replica. I'd worn my work apron through the acquisition preview. At the reception I picked up Grant's empty engraved glass and made a mock toast to the cheapest sculpture available. Brie told me to put it down. I did. The crew then showed me the support I'd changed and the credit I'd omitted."
  method_innocent: "The shop photos show the plaster repair and whose hands made it. There is no matching paper in that dust. The support alteration is mine; the missing fabricator credit is mine too. I lifted the actual glass, so I'm not asking anyone to pretend I had no chance. The apron contains the work I was concealing, not acquisition packing."
  method_murderer: "The shop photos show the plaster repair and whose hands made it. There is also a loose red-and-silver piece in the apron pocket from the preview. I had that apron on when I lifted the actual glass. The support alteration and missing credit are mine. Grant wanted the replica installed without paying for what he was replacing. I wasn't congratulating him when I raised the glass."
- id: '21'
  motive: "I sold the painting I had promised to donate. The investment I'd expected to pay for the gift had gone wrong. I brought a replacement and hoped nobody would ask why the frame looked different. Grant recognized the sale. He wanted to thank me publicly for the original, which is an efficient way to make a collector explain where it went."
  opportunity_innocent: "The preview was over when I arrived with the replacement. Cary wouldn't unpack it as the original, so I took it into the receiving room and covered the label. I asked him to wait until after the announcement to log it. He refused. At the reception I put my pledge envelope under the program stack. Grant's assistant brought it back unopened. I had run out of useful hiding places."
  opportunity_murderer: "I came early with the replacement and attended the preview. Cary wouldn't log it as the original. At the reception sideboard I moved Grant's glass and put my pledge envelope beneath his program. The replacement's tissue stayed in my clutch. His assistant brought the envelope back unopened. I had hoped to get the announcement changed without saying aloud what happened to the original."
  method_innocent: "The admission record puts me here after the bottle was locked up. The replacement is boxed in receiving, with Cary's refusal on the intake form. My sales receipt identifies the original's buyer. No label substitution can turn the new work into the old gift. I'll withdraw the pledge before accepting another public thank-you for it."
  method_murderer: "The replacement is boxed in receiving, and my receipt identifies the original's buyer. A piece of red-and-silver paper from the preview was folded into the tissue in my clutch. I had it when I moved the glass and hid the pledge. Nothing I put beneath the program changed the sale. Grant would not let me withdraw the announcement quietly."
- id: '22'
  motive: "The anonymous newsletter is mine. Some of the jokes were overheard, one was paid for, and the person it hurt hadn't agreed to become material. Grant offered me a naming-story exclusive if I printed a correction he wrote himself. I refused. I was happy to embarrass him anonymously and less happy to tell everyone who else I'd embarrassed."
  opportunity_innocent: "Justin wanted to play a recording. Paige objected, and I offered to interview them both. Neither found that helpful. In the reading room I trimmed my own recording to remove the part where someone discussed paying for a correction. Then I heckled Grant's assistant when the program was brought through. The full recording was still on my phone. I mistook editing for making the conversation disappear."
  opportunity_murderer: "Justin wanted to play his recording; Paige objected, and I offered an interview. After the preview I took my recorder case to the reception sideboard, shifted Grant's glass, and left a marked program for his assistant. I had trimmed my own recording to hide the payment discussion. The original was still on my phone. I wanted Grant's name out of the correction, not on another announcement."
  method_innocent: "The original file includes the payment discussion I cut. It also includes my refusal to publish Grant's correction. Neither version contains the missing export permit. I didn't uncover that document; I made a joke about it. The private conversation I used will be removed from the newsletter. The person behind it deserves an apology with my name attached."
  method_murderer: "The original file includes the payment discussion and my refusal to publish Grant's correction. A red-and-silver scrap from the preview remained in my recorder case at the sideboard. I shifted the glass before leaving the marked program. The private conversation should come out of the newsletter. Grant's proposed correction wasn't an apology to the person I'd hurt; it was publicity for himself."
- id: '23'
  motive: "Grant disputed the invoice and ordered another course for himself. His assistant canceled it; he restored it. I used a cheaper supplier for one delivery and didn't tell the museum. That gave him something to complain about that was actually my fault. I still wasn't serving a private dinner nobody would authorize paying for. My crew had already worked the changes twice."
  opportunity_innocent: "Monet refused the extra course, so I sent the service manager back to the kitchen. I changed the printed menu to match what we had, and Grant's assistant changed it back. At the sideboard I wiped sauce off the donor glass's stem and base. Al had just put it down after his mock toast. I took my invoice away before somebody used it as a napkin."
