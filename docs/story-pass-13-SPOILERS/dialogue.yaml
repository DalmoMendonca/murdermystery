- id: '24'
  motive: "The frame cracked in transit. It could be repaired, and I concealed it under a reversible mount instead of reporting it. Grant saw the crack and still wanted a clean delivery form for the photograph. I hadn't told the museum; he wanted me to certify that nothing had happened. The repair was small. The signature he asked for wasn't."
  opportunity_innocent: "I kept the crate in receiving until Ella admitted she had brought a replacement. Her label didn't match the shipping order. I also delivered the wrapped donor glass to the service manager and left it wrapped. When the mounting fault closed the gallery, I fetched my delivery blanket and used it to cover the cracked frame. I couldn't produce the undamaged photograph Grant wanted."
  opportunity_murderer: "I kept Ella's crate in receiving because its label didn't match the order. I'd carried my handling kit through the preview. I delivered the wrapped donor glass, then returned to the sideboard after the manager opened it and moved it clear of the delivery blanket. The kit was still with me. The cracked frame stayed covered because I couldn't produce an honest undamaged photograph."
