acceptance_limits:
- These ten are intended hypotheses, not ten measured suspicion scores. Claire's label change and Frank's closure
  may still be insufficiently connected to poisoning.
- Brie's garnish changes the target-residue interpretation. It cannot be pasted into the old food/punch lab record
  without a specific pre-vote sample result.
- The projection requires new actual images and a simple understandable staged effect. It is not accepted merely
  by being called a projection.
- The thirty guilty routes, shared evidence, paired dialogue, all attendance subsets and named questions remain
  to be designed and reviewed.
- No canonical source, PDF, sent copy or public download was changed.
- Ten primary premises are now authored again after two replacements; most still lack reviewed complete scenes.
  Ten premises are not ten measured scores above five.
primary_hypotheses:
- id: '01'
  name: Artie Ficial
  motive: Museum survival and control, not an additional private scandal.
  act_ii_action: Artie controlled whether the toast proceeded and kept the unsigned agreement from the podium.
  unresolved_interpretation: He might have designed the private service to remove an obstacle to the museum's future.
  innocent_method_payoff: A written attempt to keep the gift legally unaccepted is evidence of a different plan,
    not a continuous alibi.
  current_weakness: 'Weak: control of a toast alone is no personal poison link.'
- id: '02'
  name: Claire O’Scuro
  motive: The collection's disputed ownership and her own department's approval.
  act_ii_action: Claire removed the ownership claim during the reception and retained the disputed loan file.
  unresolved_interpretation: She might be suppressing the object history along with the lender who could contradict
    her.
  innocent_method_payoff: The retained unflattering report shows what she meant to preserve rather than erase.
  current_weakness: 'Weak: a label dispute does not establish knowledge of cyanide or contact with either object.
    Do not promote without a natural additional fact.'
  status: 'Removed from primary poisoning set: this loan file concerns the Star Bowl, not the poison bottle.'
- id: '04'
  name: Monet Bags
  motive: Payroll and the conditional gift, with a real unauthorized transfer.
  act_ii_action: Monet's payment hold interrupted private-glass service.
  unresolved_interpretation: He might have created the unattended interval while the donor threatened the museum's
    money.
  innocent_method_payoff: The invoice and bank request explain the hold, but cannot establish his whereabouts.
  current_weakness: 'Weak: creating an interval does not show using it; a new direct act must fit the finance scene
    rather than become another glass errand.'
- id: '05'
  name: Chip Patina
  motive: False treatment records and refusal to approve a historical repair.
  act_ii_action: Chip had actual custody of the bottle and applied the replacement band.
  unresolved_interpretation: He could have concealed extraction beneath routine condition work.
  innocent_method_payoff: Original stock and a condition record can explain fragments; they must not be described
    as uniquely matching the glass scrap.
  current_weakness: Strong source connection; check whether the innocent explanation resolves too early and whether
    the record really proves anything.
- id: '06'
  name: Dada DiCapo
  motive: Uncredited performance commission and the donor spectacle.
  act_ii_action: Dada ordered a donor-collapse cue close to the toast.
  unresolved_interpretation: The cue could be a cover for an intended real collapse rather than an image.
  innocent_method_payoff: A retained prerecorded projection and its booking show an intended satirical spectacle
    before voting.
  current_weakness: 'Medium: the effect must be physically understandable and its reveal cannot be a secret Coming
    Clean-only fact.'
- id: 08
  name: Sue Venir
  motive: Professional responsibility for the acquisition and gift contract.
  act_ii_action: Sue withdrew the unsigned agreement from the private place and kept it out of the public announcement;
    the precontracted private toast was not canceled.
  unresolved_interpretation: Withdrawing the paper creates a specific table visit that could conceal another purpose,
    without claiming her legal note canceled the private toast.
  innocent_method_payoff: The actual written hold says not to celebrate an unsigned deal, explaining a liability
    concern.
  current_weakness: 'Weak: instructions about timing are not evidence of contaminating a glass. Avoid making her
    secretly a catering chemist.'
- id: '10'
  name: Tess Tament
  motive: Family authority over an impending gift.
  act_ii_action: Tess changed the victim's place assignment and requested private service.
  unresolved_interpretation: A family member could arrange a drink out of the public toast to control both donor
    and inheritance.
  innocent_method_payoff: The seating request preserves the family negotiation rather than substituting a different
    glass.
  current_weakness: 'Weak: inheritance is not automatic; actual family interest and a credible knowledge/access
    fact are required.'
- id: '11'
  name: Barb Dwyer
  motive: Compromised professional authority under a private donor request.
  act_ii_action: Barb concealed a deliberate camera exception.
  unresolved_interpretation: The missing surveillance could be planned concealment of extraction or contamination.
  innocent_method_payoff: The earlier donor-privacy order explains the exception while leaving misuse of authority
    exposed.
  current_weakness: Strong concealment connection; innocent payoff is contextual, not proof she cannot poison anyone.
- id: '13'
  name: Frank Lloyd Wrong
  motive: An unsafe mounting fault that threatens the promised exhibition.
  act_ii_action: Frank closed the alcove and interrupted its lighting.
  unresolved_interpretation: He might have arranged unseen access while describing the closure as safety work.
  innocent_method_payoff: Actual mounting drawings and damaged hardware explain the closure before voting.
  current_weakness: 'Weak: darkness in another room is not poison opportunity. Reject unless the geography and actual
    scene create a real connection.'
  status: Rejected as a poisoning hypothesis until an actual geographic consequence exists.
- id: '23'
  name: Brie DeVivre
  motive: An unpaid catering commitment and an unworkable service order.
  act_ii_action: Brie carried a garnish bottle to the private place while service was interrupted.
  unresolved_interpretation: The private flavoring could have carried poison despite clean shared food and punch.
  innocent_method_payoff: A specific pre-vote comparison of retained culinary ingredient and glass findings can
    distinguish the intended flavoring from the poison.
  current_weakness: Strong target connection, but new residue findings and whether garnish was present must be designed
    coherently; no operational poison detail.
- id: '03'
  name: Hugh Bidder
  motive: Refund exposure from the disputed bowl transaction threatens his dealer business.
  act_ii_action: Suppresses correspondence linking him to Grant's original-contents bottle purchase, while passing
    only the inert loan description.
  unresolved_interpretation: A commercially involved dealer may know what the bottle actually contains and conceal
    its purpose.
  innocent_method_payoff: Original condition is admitted and conflicting description explained; first gala entry
    after the preview supports the narrower source-opportunity rebuttal.
  guilty_late_case: Claimed cancellation conflicts with the executed condition, seller fulfillment and active residue.
  status: Bounded five-role premise reviewed; actual score and full-cast dependencies unmeasured.
- id: '12'
  name: Paige Turner
  motive: An injunction and a source-identification demand threaten her reporting and source.
  act_ii_action: Searches Grant's coat for her recorder, supplies an edited export and withholds its original opening.
  unresolved_interpretation: The omitted opening may hide access to Grant's place, not merely protect a source.
  innocent_method_payoff: The retained original and separate correction explain what was redacted and why; they
    do not physically exclude poisoning.
  guilty_late_case: Office-yesterday claim conflicts with the gala service/interview opening.
  status: Bounded five-role premise reviewed; actual score and full-cast dependencies unmeasured.
reception_timeline:
- when: Weeks before the gala
  events: The disputed sales, treatment date, property investigation, commission terms and family negotiations begin.
    No new thirty-person blackmail tour tonight.
- when: Before guests arrive
  events: Loan intake uses Grant's false inert declaration; display approval withheld. Band work occurs before the
    closed preview. Camera exception was ordered earlier.
- when: 6:20–6:28
  events: Closed incoming-object preview. Guests may observe; handling is unauthorized. Only the chosen guilty route
    needs covert extraction, never an innocent universal sample ritual.
- when: Reception, overlapping small groups
  events: One ownership-label argument; one gift/governance discussion; one commissioning/access problem; one production/service
    dispute. Other conversations occur between guests, not with Grant.
- when: 6:32–6:44
  events: Private place set and later collected; service interrupted by the kitchen ticket. This is an exposed interval,
    not proof contamination before it was impossible.
- when: 6:46 and 6:49
  events: Shared punch poured; private toast served. Death at the gala remains part of the fiction. No hospital
    interlude.
