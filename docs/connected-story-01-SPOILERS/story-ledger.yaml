schema_version: 1
status: authored_premises_not_accepted_or_scored
public_assets: unchanged
crime_constraints:
  victim: Grant Larceny
  source: The historical Velvet Widow bottle falsely declared inert by Grant; laboratory identification, not its
    label, establishes active poison.
  source_access: Closed-object preview 6:20–6:28; opening unauthorized. No employee knowingly offers active poison
    for handling.
  target: Grant's private glass; do not pretend salon placement proves exclusive contamination timing.
  late_identification: Retain pre-vote positive evidence for every chosen culprit; endings cannot supply a new identifying
    fact.
threads:
- id: collection
  title: The label is a promise
  members:
  - '02'
  - '05'
  - 09
  - '16'
  - '19'
  - '27'
  shared_consequence: The naming gift would let the donor overrule acquisition decisions. An unresolved ownership
    file would become an official museum claim.
  competing_agendas: Claire wants a defensible exhibition; Chip wants the objects protected; Art wants scholarly
    credit; Anya wants the founding record preserved; Reed wants an accurate catalog; Robin wants an actual return,
    not better labels.
  one_reception_scene: Claire replaces the ownership label. Reed keeps the disputed version. Chip examines the mounting
    fault. These are one connected disagreement, not six confrontations with Grant.
- id: market
  title: Who sold what to whom
  members:
  - '03'
  - '07'
  - '15'
  - '17'
  - '21'
  - '28'
  shared_consequence: Tonight publicizes purchases whose prices and authenticity determine the standing of buyers
    and sellers.
  competing_agendas: Hugh wants his clients retained; Vincent wants authorship recognized; Elon wants taste rather
    than wealth recognized; Saul wants the auction commission; Ella wants to keep her purchases desirable; Penny
    wants to prove a bargain was real.
  one_reception_scene: The sale dispute began before tonight. Guests compare records and valuations with each other;
    Grant does not conduct six separate blackmail appointments.
- id: control
  title: A gift nobody can afford
  members:
  - '01'
  - '04'
  - 08
  - '10'
  - '29'
  shared_consequence: The gift offers immediate cash while reserving donor control. Rejection threatens payroll;
    acceptance affects governance and family/property claims.
  competing_agendas: Artie wants the museum he built to survive; Monet wants employees paid; Sue wants an enforceable
    agreement; Tess wants an actual voice in the family gift; Justin wants the original property history published.
  one_reception_scene: Artie, Monet and Sue disagree over whether the toast will be interpreted as acceptance. Tess
    changes the proposed seating. Justin shares an old deed with Sue rather than delivering another threat from
    Grant.
- id: commissions
  title: Whose museum is being built
  members:
  - '13'
  - '18'
  - '20'
  - '25'
  shared_consequence: A donor-branded redesign would replace commissioned work and reduce public programs.
  competing_agendas: Frank wants his design completed; Elle wants the installation shown properly; Al wants his
    sculpture paid for and credited; Anne wants the public to use the museum.
  one_reception_scene: Frank closes the installation alcove after Chip objects to a mount. Elle and Al want access
    to their work. Anne objects to the closure during her tour. Grant is absent from this argument.
- id: public_story
  title: The announcement escapes its owners
  members:
  - '12'
  - '14'
  - '22'
  shared_consequence: The proposed deal is about to be reported as a rescue. Ownership, artistic credit and donor
    control make three competing stories.
  competing_agendas: Paige wants publishable evidence; Mona wants an outcome she can defend internationally; Drew
    wants the story before the official press release.
  one_reception_scene: A circulated draft splits the three over whether to publish, negotiate or ridicule. They
    have an ordinary editorial argument, not three identical confrontations with the victim.
- id: gala
  title: The show must go wrong
  members:
  - '06'
  - '11'
  - '23'
  - '24'
  - '26'
  - '30'
  shared_consequence: The opening spectacle, gift delivery and private toast must coexist with a compromised security
    plan.
  competing_agendas: Dada wants the commission credited; Barb wants a controllable room; Brie wants usable service
    instructions; Cary wants work delivered safely; Faye wants the public moment photographed; Minnie wants the
    reveal to work.
  one_reception_scene: One production dispute connects the canceled projection, camera outage, boxed gift and changing
    service order. These guests disagree with each other about the running order. They are not six independent handlers
    of one glass.
