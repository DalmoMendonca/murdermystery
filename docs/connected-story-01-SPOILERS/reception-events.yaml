schema_version: 1
status: current_authoring_sequence_not_final_host_guide
principle: Ordinary guests pursue their own work at a few shared situations. They do not all need an innocent reason
  to approach the murder target.
events:
- name: Closed collection preview
  timing: 6:20–6:28
  reason: Invited guests view incoming loans and commissioned work before the public exhibition opens.
  ordinary_actions: Looking, arguing over ownership and prices, checking labels, discussing commissions. Only staff
    condition work requires authorized object handling.
  selected_crime: Most current selected routes take poison covertly during this preview. Anya instead uses her later
    cupboard visit and retained key. Only the selected culprit performs an unauthorized extraction in that world.
  limits: Ordinary staff cupboard access continues later. The preview is not the exclusive possible extraction window.
- name: Announcement desk dispute
  timing: During reception, without individual time certificates
  reason: The coordinator needs accepted text before calling the donor to the microphone.
  ordinary_actions: Artie refuses acceptance; Sue removes the unsigned master from the announcement folder. The
    board-office copy retains the refusal and advice.
  limits: No innocent private-place retrieval is required. Offstage museum office and counsel perform the necessary
    administrative work when those guests are absent.
- name: Accounts and kitchen dispute
  timing: During reception
  reason: The manager needs an account for the added cheese course.
  ordinary_actions: Monet strikes the museum account; the donor copy returns through service. Brie has already committed
    to the additional purchase. The original toast remains booked and paid.
  limits: This dispute neither creates nor cancels the unattended glass interval. It does not require an innocent
    CFO visit to the private place.
- name: Prepared private toast and interview
  timing: Glass unwrapped and set at 6:32; interview follows; exact departure not certified
  reason: A later toast has a prepared place; Grant requested a quiet setting and subsequently rejoins the reception.
  ordinary_actions: The manager prepares the place. A press interview and, if present, Robin's petition occur there.
    Tess's seating request, security work and individual culinary preparation retain their actual reasons.
  selected_crime: The culprit privately contaminates the exposed glass while the place is unattended. The act may
    be omitted or misdescribed in their account; no innocent counterpart is required to perform that act.
  limits: No continuous observer, guest timetable or universal glass-handling ritual.
- name: Collection and publicity arguments
  timing: Overlapping reception conversations, without a synchronized circuit
  reason: Existing ownership, sale, image and credit disputes have not been resolved by staging a gala.
  ordinary_actions: Collection staff amend working copy; collectors dispute sale status; artists contest reproduction
    and credit; publicity workers choose what to show.
  limits: All thirty paired drafts now exist. The combined architecture, evidence staging, actual art and all culprit
    variants still require complete review and tests.
- name: Private service and collapse
  timing: Collect at 7:04; pour in kitchen at 7:06; serve toast at 7:09
  reason: Service follows the original order.
  ordinary_actions: Manager carries the collected glass, pours shared punch in the kitchen and delivers directly.
    Flavoring was ordered individually; the shared pitcher remains separate.
  limits: Fictional in-game death is staged by the host script; no real substance or unsafe party action. Records
    do not identify who earlier contaminated the glass.
