schema_version: 1
status: causal_audit_not_new_score_or_repaired_bank
basis: Current authoring sources after matched diagnostic 1e1bd38; fifteen drafted roles only.
conclusion: No current innocent Method route physically excludes all poisoning routes. Several explain an apparent
  murder-related action, while others merely settle a different scandal. Relative suspicion can fall without absolute
  exclusion; do not claim a solved inference from a changed score.
prohibited_shortcuts:
- Truthful-innocent rule explicitly declined by human
- Preview-only source window contradicted by working staff keys
- Clean flavoring sample is not clearance for its owner
- Raw interview opening is not continuous glass supervision
- Scandal document retention is not a personal alibi
routes:
- id: '01'
  name: Artie Ficial
  source: production-family-scenes.yaml
  source_sha256: 1c65e8b28aee6938d1b50d48b6ddf905cc4342aad02a2d62878faf45bfca7edf
  innocent_method: My hold concerned public exhibition approval. It did not remove the bottle from the closed preview.
    I let the invited guests see it and told staff it was not to be opened. The note at Grant's place says we would
    forgo the gift unless the board approved it. I sent the same instruction to the board office. I was prepared
    to lose his money. I wish that were the only thing we had lost tonight.
  supported_inference: Board refusal corroborates choosing to lose the gift.
  unsupported_clearance: Countermotive, not physical exclusion. Director still visits the set glass and controls
    intake.
  repair_direction: Let the refusal have an operative consequence in the shared agreement scene; do not merely repeat
    willingness to lose money.
- id: '02'
  name: Claire O’Scuro
  source: collection-scenes.yaml
  source_sha256: 278febf40a0f3e6af20ca6772966b303d5d8fa5218ab90857c5bb7646a7c5d80
  innocent_method: 'I authorized the closed preview, not opening the bottle. The intake sheet says that. Its inert
    description came from Grant; it was not an examination by my department. I should have insisted on the purchase
    papers before admitting it. The label versions show what I did change: I added the ownership objection, even
    though the old version carried my approval. Those are corrections I was willing to put my name on while Grant
    was alive.'
  supported_inference: Label correction owns the earlier mistake; intake records only a lender declaration.
  unsupported_clearance: Correction weakens concealment inference but does not exclude source access.
  repair_direction: Tie the retained correction to an action that exposes rather than suppresses the dangerous discrepancy,
    while retaining genuine responsibility for admitting the object.
- id: '03'
  name: Hugh Bidder
  source: five-role-bank.yaml
  source_sha256: 84c9a2ed02a3e520eb11cb528368b2a799f4a87f3d9c4fb5758fca810b5f88ae
  innocent_method: The seller's condition required the original contents. Grant wanted the object in that state.
    His later loan declaration called it inert; I repeated that description without resolving the difference. The
    original sale correspondence survives because I needed it for the price dispute. I first entered the gala at
    6:29, after the closed preview. That first-admission receipt and the file explain why I missed it. They don't
    excuse sending a donor's convenient description in place of the seller's actual condition.
  supported_inference: Admission receipt places first entry after the closed preview; original sale file survives.
  unsupported_clearance: 'Late preview arrival is not source exclusion: ordinary staff cupboard access remains possible.'
  repair_direction: Remove any implicit preview-only clearance. Strengthen the seller dispute into an independently
    checkable physical transaction fact, without making a false commercial claim equivalent to murder.
- id: '04'
  name: Monet Bags
  source: five-role-bank.yaml
  source_sha256: 84c9a2ed02a3e520eb11cb528368b2a799f4a87f3d9c4fb5758fca810b5f88ae
  innocent_method: 'I went to the place while the extra-course ticket was still open. That was the point: get his
    approval so the kitchen could stop waiting. The retained invoice says ''charge to donor''; the museum account
    is crossed out. The bank request in my file is about the earlier transfer into payroll. I had used restricted
    money to pay the staff, and I was trying not to add this bill to it. I still have the crossed-out account line.
    The staff had already been paid; I couldn''t put their wages back into the restricted fund.'
  supported_inference: Invoice charged to donor explains visit; payroll transfer explains concealed finance.
  unsupported_clearance: Wrong-account correction neither protects the glass nor defeats poisoning.
  repair_direction: A live financial obligation can reverse apparent gain from death, but must be planted in the
    actual bank request, not invented in the ending.
- id: '05'
  name: Chip Patina
  source: production-family-scenes.yaml
  source_sha256: 1c65e8b28aee6938d1b50d48b6ddf905cc4342aad02a2d62878faf45bfca7edf
  innocent_method: The band is foil-backed paper. My supply sleeve contains unused strips and the fitting offcuts.
    Neither is an ancient artifact. The work photograph shows the visible front; it cannot show you everything behind
    the bottle. The insurance copy has my wrong date. The original condition sheet and the technician's image retain
    the right one. I changed a date, not the recorded contents of the bottle.
  supported_inference: Original date and ordinary offcuts explain band stock.
  unsupported_clearance: Conservator retains the clearest direct source access; paperwork honesty does not exclude
    extraction.
  repair_direction: Preserve legitimate source handling as a credible residual suspect unless an existing treatment
    action materially limits the route. Do not fabricate a new uninterrupted alibi.
- id: '06'
  name: Dada DiCapo
  source: production-family-scenes.yaml
  source_sha256: 1c65e8b28aee6938d1b50d48b6ddf905cc4342aad02a2d62878faf45bfca7edf
  innocent_method: The fall is in the film. The jacket is empty, the chair is a studio prop, and the file was delivered
    before tonight. Grant refused the piece. His reply also refused a live stunt involving him or a guest. I kept
    arguing for the film, not for someone to act it out. The booking lists a screen and playback. It does not list
    an actor, a drink or a person falling at this dinner.
  supported_inference: Film shows empty jacket and playback booking; refusal rules out approved live stunt.
  unsupported_clearance: Strong reclassification of the apparent murder plan; does not prove no independent poisoning.
  repair_direction: Keep this useful payoff. Make the answer react to the actual film still instead of listing every
    absent murder ingredient.
- id: 08
  name: Sue Venir
  source: five-role-bank.yaml
  source_sha256: 84c9a2ed02a3e520eb11cb528368b2a799f4a87f3d9c4fb5758fca810b5f88ae
  innocent_method: I took the agreement while the private place was unattended and the kitchen ticket was still
    open. The glass stayed there. My note has 'public announcement' underlined and 'private hospitality may proceed'
    beneath it. The missing ownership attachment was a problem I had known about before tonight. I let the file
    go forward without resolving it. Taking back the agreement was an attempt to stop another approval built on
    that advice, not to cancel Grant's service.
  supported_inference: Public-only legal objection explains removing agreement.
  unsupported_clearance: Admitted unsupervised access remains; legal distinction does not weaken transfer.
  repair_direction: Use the removed agreement to establish the concrete objective and consequence of the intervention.
    Do not turn signatures into a personal movement certificate.
- id: 09
  name: Dr. Art E. Fact
  source: collection-scenes.yaml
  source_sha256: 278febf40a0f3e6af20ca6772966b303d5d8fa5218ab90857c5bb7646a7c5d80
  innocent_method: I had read the original-contents condition before the gala. The query is mine. I did not resolve
    it; I repeated the lender's inert description while leaving the conflicting condition attached. That was inadequate
    work. The corrected bowl entry withdraws my ownership claim and retains the missing-document warning. Neither
    the word original nor a nineteenth-century label establishes what was active tonight. The laboratory result
    does that, rather brutally.
  supported_inference: Corrected scholarly entry retains unresolved original-contents condition.
  unsupported_clearance: Admits advance knowledge of poison possibility; scholarship correction is a separate scandal.
  repair_direction: Separate mere document knowledge from alleged physical access. A shared intake action may change
    that inference, but no document is an alibi.
- id: '10'
  name: Tess Tament
  source: production-family-scenes.yaml
  source_sha256: 1c65e8b28aee6938d1b50d48b6ddf905cc4342aad02a2d62878faf45bfca7edf
  innocent_method: The proposed agreement passes his donor seat to me if he dies. That is the clause I asked Sue
    about. I wanted that seat written as a family appointment, so he could not change it whenever we quarreled.
    If the board refused the gift, there would be no donor seat to inherit. The family draft and my seating request
    are about getting a say while he was alive. I have never claimed I gain nothing from his death.
  supported_inference: Conditional donor seat exists only if gift accepted.
  unsupported_clearance: Weakens automatic inheritance motive; does not remove anger or glass visit.
  repair_direction: Use the actual unaccepted agreement as countervailing financial/control consequence. Preserve
    the distinction between proposed board seat and a will.
- id: '11'
  name: Barb Dwyer
  source: production-family-scenes.yaml
  source_sha256: 1c65e8b28aee6938d1b50d48b6ddf905cc4342aad02a2d62878faf45bfca7edf
  innocent_method: The work order removes power. I approved it. The room camera was not recording, locally or anywhere
    else. Grant's request was for privacy from the live monitor; I chose the broader shutdown because I wanted no
    one arguing about a saved copy later. The technician kept the signed order even though I dressed up the main
    log. I cannot offer you footage of the room. My report should have said that.
  supported_inference: Signed order corroborates deliberate total camera shutdown.
  unsupported_clearance: Actually confirms useful concealment; innocent explanation remains highly suspicious.
  repair_direction: Retain as one plausible residual suspect. Need a believable privacy agenda unrelated to helping
    Grant evade scrutiny, without claiming footage exists.
- id: '12'
  name: Paige Turner
  source: five-role-bank.yaml
  source_sha256: 84c9a2ed02a3e520eb11cb528368b2a799f4a87f3d9c4fb5758fca810b5f88ae
  innocent_method: The untrimmed interview was at Grant's private place during the reception. You hear the service
    manager setting his glass in the Donor Salon. I left that exchange out of Drew's export because the employee's
    voice could point to my source. The editor's retained original has it. The separate correction addresses the
    sentence I got wrong. The edit concealed a source, and the pocket search recovered the recording. Neither was
    permission from Grant to publish what I wanted.
  supported_inference: Raw opening corroborates interview location and removed employee exchange.
  unsupported_clearance: Explains edited recording but confirms glass access; source-protection explanation alone
    is not clearance.
  repair_direction: Use what the actual conversation shows about the purpose of the visit; avoid claiming continuous
    supervision absent from the recording.
- id: '16'
  name: Anya Tique
  source: collection-scenes.yaml
  source_sha256: 278febf40a0f3e6af20ca6772966b303d5d8fa5218ab90857c5bb7646a7c5d80
  innocent_method: The old key opens the present cupboard. Staff tested it after Grant died. I opened it myself
    to put the memo back. The file now contains the original shortcut and our later policy withdrawing it. I hid
    the embarrassing sheet from the display; I did not destroy either policy. I also did not tell anyone the locked
    cupboard made its contents inaccessible. I was one of the reasons that would be untrue.
  supported_inference: Retained old and replacement policies explain removed memo.
  unsupported_clearance: Working spare key confirms source access; preserving policy does not clear it.
  repair_direction: Keep access as a real suspicion rather than pretend the cupboard is secure. Any later action
    must emerge from the existing intake dispute, not a special innocence memo.
- id: '19'
  name: Reed DeLabel
  source: collection-scenes.yaml
  source_sha256: 278febf40a0f3e6af20ca6772966b303d5d8fa5218ab90857c5bb7646a7c5d80
  innocent_method: My marked proof removes the original-contents sentence from the press entry. The full query and
    the purchase condition remain in the retained working copy. The bowl correction says ownership is disputed;
    it does not settle it in my favor. I was trying to simplify one entry while refusing to simplify another. You
    can see why that was a dangerous distinction. Keeping the long version was useful. Sending the short one was
    not.
  supported_inference: Marked proof and retained full query establish what was edited.
  unsupported_clearance: Preserving full copy explains professional workflow but does not exclude using known poison.
  repair_direction: Have the competing publications and their actual delivery establish whether the edit concealed
    the hazard from anyone who could act; avoid generic I kept the original defense.
- id: '23'
  name: Brie DeVivre
  source: five-role-bank.yaml
  source_sha256: 84c9a2ed02a3e520eb11cb528368b2a799f4a87f3d9c4fb5758fca810b5f88ae
  innocent_method: I prepared his individual glass with the flavoring from the original order. The shared pitcher
    didn't contain it; that was why his drink had separate preparation. The retained container is the one with that
    order. The lab found no cyanide in that container. I agreed to an expensive addition before payment was settled.
    Monet had every reason to refuse that bill. We still owed our supplier.
  supported_inference: Clean flavoring container explains legitimate ingredient preparation.
  unsupported_clearance: Does not exclude separate toxin added by the same cook; individual glass access remains.
  repair_direction: Preserve as a plausible residual suspect. A sample result concerns a container, not every act
    performed by its owner.
- id: '27'
  name: Robin Banks
  source: collection-scenes.yaml
  source_sha256: 278febf40a0f3e6af20ca6772966b303d5d8fa5218ab90857c5bb7646a7c5d80
  innocent_method: The card I removed is the bowl's ownership label, with its disputed wording still visible inside
    the petition. It was in the papers, not across a bottle's stopper. I delivered Grant's copy at his private place
    while Paige was recording. I stayed to argue, then left without an answer. My demand says return the bowl intact
    through the claimants' representatives. I did not authorize destroying an object or its lender. I wanted the
    petition on the record, not in his wastebasket.
  supported_inference: Bowl card and intact-return petition explain protest; raw interview fixes its place.
  unsupported_clearance: Intact-object demand concerns bowl, not lender; interview confirms private-room access.
  repair_direction: Make the petition consequence concrete and react to its torn label. Do not infer murder innocence
    from an intact-return slogan.
