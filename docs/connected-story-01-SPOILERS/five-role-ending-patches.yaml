characters:
- id: '04'
  innocent: 'I did not kill Grant. I had used restricted money to pay staff and then tried to keep his additional
    catering charge out of the same account. I went to his unattended place for approval of that invoice. The crossed-out
    account and the open ticket were already in front of you. There was no clever rescue in what I''d done with
    payroll: I had paid people from money I was not entitled to use. The board needs that account, and Brie needs
    a funded answer to the bill.'
  murderer: I killed Grant. The invoice visit was later than I told you, while his private glass was unattended.
    I'd taken poison from the bottle during the closed preview. Saying the unwrapped glass was already there before
    that preview moved my visit away from the real service interruption. The wrapping and place-setting account
    contradicted me. I had paid staff with restricted money. His gift was supposed to get the accounts through that
    transfer; his terms would give him control of them instead. I decided he wasn't going to examine those accounts.
- id: 08
  innocent: I did not kill Grant. I had let the disputed acquisition file go forward without its missing ownership
    attachment resolved. I withdrew the unsigned agreement while the glass was unattended. My marked running order
    opposed calling that draft an accepted gift; it did not cancel ordinary private service. Those were the decisions
    I made, and the papers were already available to you. I cannot turn taking back a draft into a defense of the
    earlier advice.
  murderer: I killed Grant. The manager did not supervise my withdrawal of the agreement. I took it while the private
    glass was unattended and used poison I'd taken from the bottle during the closed preview. My account moved the
    pour to the table, with a witness beside me. The manager's account put it in the kitchen, followed by direct
    delivery. Grant had the ownership file and my advice in it. Taking back a draft couldn't undo what I had approved.
    I chose to remove the man who could use that file.
- id: '23'
  innocent: I did not kill Grant. I prepared the private flavoring on the original service order and left the retained
    ingredient with the service things. The ingredient and pitcher findings were already available to you. I had
    also agreed to buy the additional course without a funded authorization. That was a real unpaid bill, not an
    attempt to change what the donor drank. I'll settle with the supplier and take the actual order back to the
    museum accounts office.
  murderer: I killed Grant. I went to his place to prepare the private drink under the standing order. I also used
    poison from the bottle I'd opened during the closed preview. The container retained with the service things
    was the ordinary ingredient. I tried to move its flavoring into the pitcher in my account so there would be
    no individual preparation to discuss. The comparison put the flavoring in his glass, not the pitcher. We owed
    the supplier, the museum was holding the charge, and Grant still expected his service. I made him pay with his
    life.
