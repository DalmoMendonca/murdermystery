  kitchen about that added course.'
- 'GRANT: Thank you. Paige, I asked for a quiet private place. Why have you followed
  me here?'
- 'PAIGE: You agreed to an interview about the gift. It''s on the recorder.'
- 'GRANT: It''s the gala. I''m announcing the gift tonight. Ask about that, or we''ll
  speak tomorrow.'
