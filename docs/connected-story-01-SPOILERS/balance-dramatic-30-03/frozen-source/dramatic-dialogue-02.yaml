  emotional_arc: Insists on protecting the work; admits loss of control over spending; asks for help without surrendering
    authorship.
  hearings:
    motive_innocent: I'd spent another client's advance on this fabric. I asked for early payment. Grant offered
      to cover the gap if I signed over every future use of the pattern. I kept buying another length because the
      next color would make the whole piece right. Chip told me when to stop touching it. Nobody knew how often
      I had failed to stop buying it.
    motive_murderer: I'd spent another client's advance on this fabric. I told Grant when I asked for early payment.
      He offered to cover the hole if every future use of my pattern became his. I kept buying another length because
      the next color would make it right. He knew exactly how much I needed the money before he named what he wanted
      for it.
    where_innocent: I unfastened the top panel when the alcove closed. The lamp was too close to the weave. Frank
      wanted it left installed. I took my panel and offered production the separate pattern slides; Dada's projection
      was already canceled. Frank, it took months to weave. I wanted it out of there before we had another thing
      we could only describe in a condition report.
    where_murderer: I unfastened the top panel when the alcove closed. The lamp was too close. Production kept the
      separate pattern slides. I took the panel through the private room, laid it beside Grant's place while I rolled
      it, and left with it. He wasn't there. Frank, I heard you telling me to leave it installed. Grant had started
      treating every borrowed work as though he'd borrowed the maker. I wasn't leaving him the work and a signed
      transfer of its pattern.
    evidence_innocent: The slides enlarge stitches. Grant's physical bottle stood on the preview bench with the
      loans. The amendment keeps my pattern rights with me. Chip, I wish you could handle this part for me too.
      Hold it steady, say what needs doing, tell me when I've done enough. I have been behaving as though buying
      more cloth could solve every unfinished part of my life.
    evidence_murderer: Production projected the bottle between the pattern slides. The physical loan stayed in the
      cupboard. People remember the lit shape beside my fabric. The amendment keeps my pattern rights with me. Chip,
      I wish you could handle this part for me too. Hold it steady, say what needs doing. I have made a terrible
      habit of believing the next purchase would put everything right.
  innocent_ending: I did not kill Grant. The slides show stitches and the preview shows the real bottle. I dismantled
