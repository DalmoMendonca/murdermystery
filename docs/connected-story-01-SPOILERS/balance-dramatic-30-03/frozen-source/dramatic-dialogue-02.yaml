- id: '20'
  voice: Blunt workshop speech; concrete materials; little patience for prestige; protective worry comes out as
    irritation.
  private_stake: Caring for an aging parent makes unpaid work a threat to home life, not just professional pride.
  emotional_arc: Fights over credit and payment; admits a flattering lie; wants to leave the room and check on someone
    alive.
  hearings:
