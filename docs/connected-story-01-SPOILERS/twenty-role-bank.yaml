  coming_clean:
    innocent: I did not kill Grant. I took the announcement copy from the public desk. I also sent the board an
      objection with my own bad advice still in the file. The ownership papers were incomplete, and I had allowed
      the acquisition to proceed anyway. Stopping a speech was easier than admitting that. I stopped the speech
      first. The private toast remained an ordinary service order; it did not accept the gift on the museum's behalf.
    murderer: I killed Grant. Removing the public announcement copy was real. My separate visit to his private place
      was not supervised. I took his donor copy and contaminated the waiting glass with poison I'd taken during
      the preview. I invented the pour beside me to put a witness in that room. The manager poured in the kitchen,
