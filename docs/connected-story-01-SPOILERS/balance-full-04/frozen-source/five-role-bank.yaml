    where_murderer: I took my recorder out of Grant's coat in the cloakroom. He had kept it after our interview.
      I copied the file before anyone could demand it back. I gave Drew a short export, with the part that could
      identify my source removed. That was not the original recording. I kept the untrimmed file for the editor.
