- id: '30'
  name: Minnie Malist
  hearings:
    motive_innocent: Grant wanted a restrained gala. Then he wanted a reveal, a tribute and a photograph in which
      the restraint appeared to be applauding him. I had ordered work before Monet approved the additions. He offered
      to cover the gap if I called it his production. My crew had already done the work. I was not giving him their
      credit because I had been irresponsible with the order form.
    motive_murderer: Grant knew I had ordered the additions without approval. He could leave me with the invoices
      or pay them under a production credit of his choosing. My crew would hear I had promised money I didn't have.
      He wanted his name on the night and mine on the debt. I was expected to make that arrangement look effortless.
    where_innocent: I kept the revised running order when Dada's screen piece came out. The family wanted a private
      toast, the microphone wanted an announcement, and accounts wanted fewer numbers on my purchase list. I took
      the display hood out of the private-place design. It trapped reflections and made the gift look like something
      nobody should touch. The place card and the glass stayed. That was a toast, not another exhibition case.
    where_murderer: I kept the revised running order after the screen piece was canceled. The family wanted privacy
      and the announcement was under dispute. The first design had a transparent hood over the private place. I
      handed the revised styling sheet to service and kept the crew copy. Grant would not get a second reveal merely
      by insisting the first one was too modest.
    evidence_innocent: The hood is crossed out on both copies. The manager set the bare glass for the later toast.
      The cancellation also credits the unused hire equipment; the crew invoice is the reduced actual work, not
      the extravagant quote Grant kept waving. I am covering the unauthorized balance myself. My crew doesn't lose
      its pay because I hoped a donor would rescue my estimate.
    evidence_murderer: The transparent hood stayed over the glass until the manager collected it. The canceled hood
      on the sheet is the exhibition alcove styling, not Grant's place. The preparation photograph's clear space
      is reflection through that cover. The revised plan did not leave a drink container open to whoever happened
      to walk past.
  coming_clean:
    innocent: I ordered more than the museum had approved and relied on a patron to make the numbers work. The hire
      cancellation reduced the bill; I have accepted the rest myself. The crew will be paid. I also canceled the
      hood over Grant's private place. The two styling copies and the preparation image show a bare glass. I did
      not kill him. I wanted a successful evening badly enough to promise money first and find it later. That was
      already plenty to confess.
    murderer: I killed Grant. There was no hood protecting the waiting glass. The styling copies cross it out, and
      the preparation image shows the open place. I took poison at the preview and used that glass. I offered you
      my discarded design as protection that existed all evening. Grant could leave my crew unpaid and explain exactly
      whose promises had put them there. I decided he would not get to make that announcement.
  case:
    late_cover: Treats canceled target cover as a continuously installed physical protection.
    pre_vote_check: Shared revised styling sheet and preparation image with the entire place visibly uncovered.
    innocent_payoff: Actual equipment-hire credit and personally accepted crew balance resolve the unsupported production
