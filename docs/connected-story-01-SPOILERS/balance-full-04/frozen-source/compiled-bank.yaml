characters:
- id: '01'
  name: Artie Ficial
  hearings:
    motive_innocent: His name over the door, his vote in every department, and my
      resignation as the finishing touch. It is an impressive thank-you note to demand
      before writing a check. Monet sees wages we could pay. Sue sees terms we cannot
      sign. I have spent years asking wealthy people to support this museum. I would
      like there to be a museum left when one finally agrees.
    motive_murderer: His name over the door, his vote in every department, and my
      resignation as the finishing touch. It is an impressive thank-you note to demand
      before writing a check. Monet sees wages we could pay. Sue sees terms we cannot
      sign. I have spent years building a museum. Grant expected to purchase my departure
      and have me introduce him as its savior.
    where_innocent: Sue and I stopped the announcement at the public desk. I left
      my refusal in the coordinator's folder and sent it to the board office. Grant
      wanted a room full of people to hear that the deal was done. I wanted him to
      hear that it wasn't. I also told intake to keep his bottle out of the public
      exhibition. The dinner could go ahead without acquiring its host.
    where_murderer: Sue and I stopped the announcement at the public desk. I left
      my refusal in the coordinator's folder and sent it to the board office. Grant
      wanted a room full of people to hear that the deal was done. I wanted him to
      hear that I still ran this museum. I also told intake to keep his bottle out
      of the public exhibition. His money was not permission to ignore me.
    evidence_innocent: 'I approved a closed preview. Yes, with that unresolved question
      still in the file. I thought "do not open" would suffice. Look at the photograph:
      apparently I gave an instruction where I should have put a barrier. Grant''s
      donation was a different decision. My refusal went to the board before he could
      announce it. He could take his check home. I had already said that in writing.'
    evidence_murderer: Intake took the bottle off the support before the guests entered.
      The label remained; the bottle did not. I was willing to lose Grant's check
      over the agreement, and my refusal says so. I was not willing to offer his questionable
      loan to a room of guests. You may dislike the director's judgment. Please be
      precise about which decision you are criticizing.
  coming_clean:
    innocent: I did not kill Grant. Sue and I stopped his public announcement at the
      desk. My refusal went to the board with the terms intact. I was prepared to
      lose the donation rather than hand over the institution. I also allowed the
      closed preview, relying on an instruction not to open the bottle. That decision
      deserves an inquiry. It is mine. I did not remove the bottle, and I did not
      poison his drink.
    murderer: I killed Grant. The refusal in the announcement folder was real. So
      was the bottle at the preview. I took its poison and later went to his waiting
      private glass. The public argument gave everyone something else to watch. I
      told you intake had removed the bottle because I wanted that opportunity gone
      from your account of the evening. The wide photograph put it back. I would not
      let Grant control the museum, so I decided for everyone what its rescue would
      cost.
- id: '02'
  name: Claire O’Scuro
  hearings:
    motive_innocent: A missing ownership document doesn't become less missing beside
      a generous donation. Grant objected to the revised bowl label. He preferred
      my earlier approval, when I had let the file proceed without it. I am responsible
      for that label, including the version I would rather you didn't frame. Tonight's
      exhibition was meant to show the collection. It wasn't meant to settle a claim
      by putting a curator's name beneath it.
    motive_murderer: A missing ownership document doesn't become less missing beside
      a generous donation. Grant preferred my earlier approval, when I had let the
      file proceed without it. He kept that signature and treated every subsequent
      objection as a favor he could withdraw. My department was supposed to thank
      him for the gift. He was holding my own label over me while I explained why
      we could not accept its claim.
    where_innocent: I removed the ownership label, not the bowl. Reed kept the old
      wording. I also moved the bottle's incoming papers out of the public display
      file because its exhibition approval was still on hold. Both files were on the
      intake desk. I had authority over the labels and the display paperwork. I did
      not have authority to settle the missing ownership claim by pretending it had
      disappeared.
    where_murderer: I removed the ownership label, not the bowl. Reed kept the old
      wording. I also moved the bottle's incoming papers out of the public display
      file because its exhibition approval was still on hold. Both files were on the
      intake desk. I could at least keep an unresolved acquisition out of the public
      announcement. Grant had started treating the word unresolved as a personal insult.
    evidence_innocent: 'I can tell you where I sent the papers: intake. The complete
      query is attached to that desk copy, with the instruction to keep the bottle
      closed. The bowl''s label was removed from display; the bottle''s warning remained
      with the staff. I wish that distinction sounded less miserable now. I should
      have demanded an answer. Sending a question to another desk was easier.'
    evidence_murderer: 'The intake sheet says empty. That is what I authorized for
      the preview: an empty historical bottle. Moving its papers was ordinary catalog
      work. I did not approve a filled vessel on a lender''s assurances. The bowl''s
      missing ownership papers are embarrassing enough. They are not a reason to assign
      my department a second mistake it did not make.'
  coming_clean:
    innocent: I did not kill Grant. I moved the bottle papers to intake with the restriction
      attached. The staff copy retained the unanswered contents question and the instruction
      to leave the bottle closed. I should have stopped the preview until we had an
      answer. I also approved the bowl label too soon, then corrected it in public.
      Both failures belong to my department. Neither required making the bottle's
      contents disappear from the people responsible for it.
    murderer: The incoming sheet does not say empty. It says inert display liquid,
      on Grant's word. I moved the papers because I did not want that distinction
      examined. I took poison from the bottle during the preview and later put it
      in his waiting glass. I used my authority over intake to make the source sound
      harmless and nonexistent. My label correction was real. It gave me something
      honorable to talk about while I concealed what I had done to the lender.
- id: '03'
  name: Hugh Bidder
  hearings:
    motive_innocent: A refund is a number. "Admit the certificate was false" is a
      sentence that follows a dealer for the rest of his career. Grant wanted both
      over the Star Bowl. My firm had passed the certificate to him. Elon began asking
      which other purchases he should worry about; Saul was delighted to help. I changed
      our file instead of admitting we'd been fooled. I offered a settlement, not
      an evening's entertainment for my rivals.
    motive_murderer: A refund is a number. "Admit the certificate was false" is a
      sentence that follows a dealer for the rest of his career. Grant wanted both
      over the Star Bowl. My firm had passed the certificate to him. Elon began asking
      which other purchases he should worry about; Saul was delighted to help. I changed
      our file instead of admitting we'd been fooled. My settlement wasn't enough.
      Grant wanted an admission that could finish the firm, and he wanted it tonight.
    where_innocent: I kept the seller's correspondence out of the auction handouts.
      It covered the bowl and the Velvet Widow purchase I'd arranged for Grant. The
      bottle sale required its original contents to remain inside. That wording would
      hardly reassure a room full of donors. Grant's loan description called the liquid
      inert. I had both descriptions in the same file and sent only the comfortable
      one to the people writing the display copy. I wasn't going to have another bad
      purchase discussed beside the first.
    where_murderer: 'I kept the seller''s correspondence out of the auction handouts.
      It covered the bowl and the Velvet Widow purchase I''d arranged for Grant. There
      were two descriptions of the liquid: the seller''s and Grant''s. I sent the
      loan description to the people writing the display copy. The other one stayed
      in my file. Grant had already demanded a refund on one purchase; I didn''t want
      donors asking what else I''d sold him. The handouts weren''t going to carry
      every argument in that file.'
    evidence_innocent: Original contents. That was the seller's condition; I cannot
      improve it by saying it slowly. Grant supplied the inert description afterward.
      I passed it on. Intake received the complete seller attachment before the gala;
      my forwarding note is on its copy. Donors got the comfortable version. Staff
      got the uncomfortable one too. I wanted somebody else to resolve the difference
      while I dealt with the price dispute. That is not how I would advertise my judgment.
    evidence_murderer: 'There had been a change before the loan: the original-contents
      condition was canceled, and the seller was to empty the bottle and replace the
      liquid with an inert substitute. Grant''s loan declaration described that delivery.
      I altered the bowl file. I am not asking you to admire that. Intake had the
      original attachment. Its old wording is not the instruction under which the
      seller eventually delivered. Stop treating two purchases as one transaction.'
  coming_clean:
    innocent: I did not kill Grant. I sold him a bad certificate and then made my
      own file look better than the transaction was. I also repeated his inert-liquid
      description without settling it with the seller's condition. Intake had the
      unaltered seller attachment before the gala, with my forwarding note. Donors
      got the shorter declaration instead. I left the contradiction for staff to resolve
      while I protected the sale. The complete attachment was already available to
      you. I'll give the buyer the unaltered file and deal with the refund as a dealer,
      not as the inventor of a more attractive sale.
    murderer: I killed Grant. The original-contents condition was never canceled.
      I had arranged the purchase; I knew what had been required. During the closed
      preview I took poison from that bottle. Later, while the private glass was unattended,
      I used it. The harmless-substitution story was the cover I gave you. The executed
      sale, seller's statement and residue findings contradicted it. His refund demand
      on the bowl would have finished my firm. I could have faced the bad sale and
      the file alteration. I chose to stop the buyer instead.
- id: '04'
  name: Monet Bags
  hearings:
    motive_innocent: I keep hearing "rescue." The staff still expect their wages on
      Friday. Grant's check could cover them. His terms would also let him question
      every purchase and every transfer. Artie dislikes losing authority; I dislike
      being asked to make a budget add up after someone else has announced it. We
      need money. That is why I have been reading the small print instead of applauding
      the amount.
    motive_murderer: I keep hearing "rescue." The staff still expect their wages on
      Friday. Grant's check could cover them. His terms would let him examine every
      transfer I had made to keep those wages going. Artie dislikes losing authority;
      I have another account to answer for. Grant wanted the books before releasing
      the money. Friday wasn't going to wait for his inspection, and neither was the
      board.
    where_innocent: The service manager brought the extra-course ticket to accounts.
      I crossed out the museum account and sent the donor copy back with the manager.
      Grant could sign for his own cheese. I had already moved restricted money into
      payroll without telling the board. When the kitchen asked for another authorization,
      I finally said no. Not a glorious place to discover a principle.
    where_murderer: The service manager brought the extra-course ticket to accounts.
      I crossed out the museum account and sent the donor copy back with the manager.
      Grant could sign for his own cheese. The board still hadn't seen the restricted-fund
      transfer. Grant wanted my books before releasing his donation. I needed his
      signature on considerably more than a catering ticket.
    evidence_innocent: '"Serve original order; bill addition to donor." Those are
      my instructions. I sent them back with the service manager. I wasn''t paying
      for the cheese, and I wasn''t canceling the toast. The payroll ledger shows
      where the restricted money went. Staff wages. If anyone would like to explain
      how I should have paid them that week, I will hear it after we finish discussing
      the dead man.'
    evidence_murderer: I looked for Grant before the preview. His glass was already
      set out, unwrapped, with the invoice beside it. He wasn't there. I left the
      donor copy for his signature and went back to accounts. The cheese argument
      continued later. So did the wages argument. Every proposed rescue of this museum
      seems to begin with someone asking me to authorize something I cannot afford.
  coming_clean:
    innocent: I borrowed from a restricted fund to pay wages and concealed the transfer
      from the board. The payroll ledger shows where it went. That does not make it
      authorized. I also refused to charge Grant's added course to the museum, and
      sent the ticket back through the service manager. The paid toast continued.
      I did not kill him. I was trying to keep a museum solvent while hiding the account
      that made its rescue possible. The board will get the whole account now.
    murderer: I killed Grant. The accounts argument happened, and I sent the ticket
      back with the manager. My separate visit to find Grant was after the preview,
      while his unwrapped glass was waiting. I used poison I'd taken from the bottle.
      I told you that visit was before the preview; the manager had not even set out
      the glass then. I had already used restricted money for payroll. Grant wanted
      to examine the books and control the rescue. I made certain he would do neither.
- id: '05'
  name: Chip Patina
  hearings:
    motive_innocent: 'He asked me to call a recent repair an ancient feature. That
      changes the sales pitch, not the object. I would have been a very useful conservator
      if I agreed: my name, his preferred description. We already had an argument
      over treatment paperwork. Then the entrance mount began moving, and somehow
      I became the person ruining the atmosphere by noticing things were not safely
      attached.'
    motive_murderer: 'He asked me to call a recent repair an ancient feature. That
      changes the sales pitch, not the object. I would have been a very useful conservator
      if I agreed: my name, his preferred description. He had the insurance copy with
      the treatment date I altered. Refusing him meant explaining that date too. Then
      the mount began moving, and he suggested I was making trouble to protect myself.'
    where_innocent: I applied the red closure band before the preview. That was my
      work, not an old museum seal. I checked the closed bottle and retained the condition
      sheet. Later I went to the installation alcove because the mount was moving.
      Frank wanted a grand opening; I wanted the object not to land on someone's shoe.
      I left the treatment folder at the workbench. The false date was still in it.
    where_murderer: I applied the red closure band before the preview. That was my
      work, not an old museum seal. I checked the closed bottle and retained the condition
      sheet. Later I went to the installation alcove because the mount was moving.
      I left the treatment folder at the workbench. Grant had made copies of the date
      I changed; correcting my own folder would not put that particular problem away.
    evidence_innocent: 'Red paper. Silver backing. The unused strips are in my supply
      sleeve. That is the band I fitted, across the stopper. The front photograph
      doesn''t show the hidden split. Neither did my inspection from the front. And
      before anyone asks: the insurance date is wrong. My original condition sheet
      has the right date. I have been waiting all evening for someone to ask me about
      that instead.'
    evidence_murderer: Red woven tape was my band. The foil-backed paper is packaging
      stock. Keep both samples beside one another before calling them the same material.
      The sleeve and the technician's photograph concern the band work, not every
      red scrap used in this museum. The insurance date is wrong. I will answer for
      that date. I won't certify somebody else's packaging as my conservation treatment.
  coming_clean:
    innocent: I changed the insurance date to get coverage in place. The original
      sheet and original photograph survive, and I have not asked you to mistake my
      offcuts for a unique match to the glass. I put a foil-backed paper band on a
