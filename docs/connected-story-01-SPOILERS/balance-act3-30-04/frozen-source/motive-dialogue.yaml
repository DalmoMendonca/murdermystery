- id: '13'
  hearings:
    motive_innocent: >-
      The plaque was ready before the donation. That should tell you
      how collaborative Grant's redesign was going to be. Chip raised
      my missing load calculation at the alcove, in front of him.
      Grant suddenly had a professional opinion about my building.
      He said the next commission could wait until I accommodated
      his name. I told him the plaque could wait instead. Architects
      are not always at their best when someone else holds the pencil.
    motive_murderer: >-
      The plaque was ready before the donation. Chip raised my missing
