      it; I wouldn't recommend it now. Grant wanted that shortcut
      polished into a precedent for his gift. I took the memo out
      of the display file. I did not help found a museum so a
      new donor could adopt its worst habit as a tradition.
    motive_murderer: >-
      I recognize the founding story. I was there. Grant found the
