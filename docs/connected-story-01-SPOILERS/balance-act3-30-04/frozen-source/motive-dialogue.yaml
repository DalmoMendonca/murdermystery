schema_version: 1
status: first_act_agendas_not_yet_blind_tested
purpose: Begin with conflicting agendas, not thirty simultaneous confessions. Misconduct remains discoverable in later answers and exhibits.
characters:
- id: '01'
  hearings:
    motive_innocent: >-
      His name over the door, his vote in every department, and my resignation as
      the finishing touch. It is an impressive thank-you note to demand before
      writing a check. Monet sees wages we could pay. Sue sees terms we cannot
      sign. I have spent years asking wealthy people to support this museum.
      I would like there to be a museum left when one finally agrees.
    motive_murderer: >-
      His name over the door, his vote in every department, and my resignation as
      the finishing touch. It is an impressive thank-you note to demand before
      writing a check. Monet sees wages we could pay. Sue sees terms we cannot
      sign. I have spent years building a museum. Grant expected to purchase my
      departure and have me introduce him as its savior.
- id: '02'
  hearings:
    motive_innocent: >-
      A missing ownership document doesn't become less missing beside a generous
      donation. Grant objected to the revised bowl label. He preferred my earlier
      approval, when I had let the file proceed without it. I am responsible
      for that label, including the version I would rather you didn't frame.
      Tonight's exhibition was meant to show the collection. It wasn't meant
      to settle a claim by putting a curator's name beneath it.
    motive_murderer: >-
      A missing ownership document doesn't become less missing beside a generous
      donation. Grant preferred my earlier approval, when I had let the file
      proceed without it. He kept that signature and treated every subsequent
      objection as a favor he could withdraw. My department was supposed to
      thank him for the gift. He was holding my own label over me while I
      explained why we could not accept its claim.
- id: '03'
  hearings:
    motive_innocent: >-
      A refund is a number. "Admit the certificate was false" is a sentence
      that follows a dealer for the rest of his career. Grant wanted both
      over the Star Bowl. My firm had passed the certificate to him. Elon
      began asking which other purchases he should worry about; Saul was
      delighted to help. I changed our file instead of admitting we'd been
      fooled. I offered a settlement, not an evening's entertainment for my rivals.
    motive_murderer: >-
      A refund is a number. "Admit the certificate was false" is a sentence
      that follows a dealer for the rest of his career. Grant wanted both
      over the Star Bowl. My firm had passed the certificate to him. Elon
