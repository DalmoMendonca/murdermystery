      government instruction. He knew what the bead supplier would
      pay me if Tess accepted the commission, too. He offered to
      keep those distinctions quiet if I blessed his ownership.
      That is an interesting form of diplomacy: charging a person
      admission to her own reputation.
- id: '15'
  hearings:
    motive_innocent: >-
      It was a trial of a museum platform, not a subscription to
