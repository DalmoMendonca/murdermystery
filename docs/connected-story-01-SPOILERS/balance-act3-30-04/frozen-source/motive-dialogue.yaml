      in my hand and showed me where his name would go. I was
      expected to thank him for the chance to repair my reputation
      by surrendering the entrance. I had designed a building, not
      a monument to the man correcting me.
- id: '14'
  hearings:
    motive_innocent: >-
      I was invited to the acquisition photograph as though I came
      with the bowl. The claimants have not agreed to an official
      return arrangement. Grant wanted my presence to look like their
      blessing. My letter had rather grand stationery; it did not
      give him ownership. Tess also asked about the bead commission
      I recommended. A room can apparently sustain two negotiations
      and still call both of them decoration.
    motive_murderer: >-
      I was invited to the acquisition photograph as though I came
