      delighted to help. I changed our file instead of admitting we'd been
      fooled. My settlement wasn't enough. Grant wanted an
      admission that could finish the firm, and he wanted it tonight.
- id: '04'
  hearings:
    motive_innocent: >-
      I keep hearing "rescue." The staff still expect their wages on Friday.
      Grant's check could cover them. His terms would also let him question
      every purchase and every transfer. Artie dislikes losing authority;
      I dislike being asked to make a budget add up after someone else has
      announced it. We need money. That is why I have been reading the
      small print instead of applauding the amount.
    motive_murderer: >-
      I keep hearing "rescue." The staff still expect their wages on Friday.
      Grant's check could cover them. His terms would let him examine every
      transfer I had made to keep those wages going. Artie dislikes losing
      authority; I have another account to answer for. Grant wanted the
      books before releasing the money. Friday wasn't going to wait for
      his inspection, and neither was the board.
- id: '05'
  hearings:
    motive_innocent: >-
      He asked me to call a recent repair an ancient feature. That changes
      the sales pitch, not the object. I would have been a very useful
      conservator if I agreed: my name, his preferred description. We
      already had an argument over treatment paperwork. Then the entrance
      mount began moving, and somehow I became the person ruining the
      atmosphere by noticing things were not safely attached.
    motive_murderer: >-
      He asked me to call a recent repair an ancient feature. That changes
      the sales pitch, not the object. I would have been a very useful
      conservator if I agreed: my name, his preferred description. He
      had the insurance copy with the treatment date I altered. Refusing
      him meant explaining that date too. Then the mount began moving,
      and he suggested I was making trouble to protect myself.
- id: '06'
  hearings:
    motive_innocent: >-
      Donor Collapse. An empty dinner jacket falling out of a gilded chair.
      A short film, a wonderfully loud floor, and a donor who decided the
      artist's name would distract from his generosity. Grant wanted the
      commission without the person who made it. I objected. If tonight
      required another portrait of him looking important, there were
      already several surfaces on which to arrange that.
    motive_murderer: >-
      Donor Collapse. An empty dinner jacket falling out of a gilded chair.
      A short film, a wonderfully loud floor, and a donor who decided the
      artist's name would distract from his generosity. Grant wanted the
      commission without the person who made it. My name could disappear
      while his foundation acquired the work. Apparently that was my
      opportunity to be grateful for patronage.
- id: '07'
  hearings:
    motive_innocent: >-
      That early painting was the beginning of my rent payments. Grant
      kept introducing it as the beginning of my genius. Now he has
      commissioned a study of his historic bottle and wants to reproduce
      it beside the rescue announcement. I withdrew that permission.
      Hugh advised me to be less difficult with collectors. There is
      nothing difficult about my position: he bought a painting, not
      my endorsement of everything he does beside it.
    motive_murderer: >-
      That early painting was the beginning of my rent payments. Grant
      kept introducing it as the beginning of my genius. Now he wants
      my bottle commission printed beside his rescue announcement. I
      withdrew permission. He could withhold my final payment and keep
      exhibiting the old picture as the measure of my talent. Hugh
      advised me to be less difficult. Easy artists are very convenient
      people to own.
- id: '08'
  hearings:
    motive_innocent: >-
      An agreement is not accepted because somebody finds a microphone.
      Grant intended to announce his gift before the board had settled
      its terms. Future acquisitions would need his approval. The
      ownership file behind this exhibition was already troublesome,
      and I had advised on that acquisition. I wanted a decision on
      paper, with the objections still attached. Applause is a poor
      substitute for a board vote.
    motive_murderer: >-
      An agreement is not accepted because somebody finds a microphone.
      Grant intended to announce his gift before the board had settled
      its terms. He also held the acquisition file carrying my advice.
      He could send it to the board or keep it beside his demands.
      Either way, my earlier approval was becoming leverage. I wanted
      a decision before the audience was asked to applaud one into
      existence.
- id: '09'
  hearings:
    motive_innocent: >-
      Reed found a gap in my ownership citation. Grant found the gap
      inconvenient. Those are not the same scholarly judgment. I asked
      for the earlier press copies to be held. Grant wanted the authority
      of my name on the catalog without the correction under it. One
      can survive an error in print. The donors needn't be handed another
      thousand copies while one is attempting to correct it.
    motive_murderer: >-
      Reed found a gap in my ownership citation. Grant found it useful
      whenever I objected to his display copy. He could demand my name
      on the catalog and remind me what withdrawing it would invite
      people to examine. I asked for the earlier press copies to be
      held. He wanted them circulated before the correction. It is
      unpleasant to discover a patron has become one's most attentive
      reader.
- id: '10'
  hearings:
    motive_innocent: >-
      "The family gift" when the photographer arrives. "My gift" when
      the family asks a question. I wanted a say in the thing that
      would carry our name. Grant wanted me standing beside it looking
      expensive and agreeable. I asked Sue to read the succession clause
      before I agreed to the photograph. People assume an heiress can
      afford to ignore details. I find the details become considerably
      more interesting when they concern my chair.
    motive_murderer: >-
      "The family gift" when the photographer arrives. "My gift" when
      the family asks a question. I wanted a say in the thing carrying
      our name. Grant wanted me expensive and agreeable beside it.
      I asked Sue about the succession clause. He had decided how the
      family seat would pass and still expected me to wait politely
      for it. I was tired of being the person in the picture who
      wasn't permitted to make a decision.
- id: '11'
  hearings:
    motive_innocent: >-
      A donor asks for privacy. The museum asks why security is being
      difficult. Later everyone asks where the recording is. Those
      conversations generally involve the same people. Grant didn't
      want his private meeting on the live monitor. I agreed to an
      exception. The museum wanted his money and his guests kept happy.
      Nobody was keen to put the uncomfortable parts of that request
      into the evening's program.
    motive_murderer: >-
      A donor asks for privacy. The museum asks why security is being
      difficult. Later everyone asks where the recording is. Grant
      wanted the exception, and I had dressed it up in the log as
      an equipment problem. He knew the difference. The institution
      could accept his request; my department would be left answering
      for its record. He found that arrangement convenient whenever
      I tried to set a limit afterward.
- id: '12'
  hearings:
    motive_innocent: >-
      The arts desk was about to print "rescue." Justin's property
      folder suggested a longer headline. My report had a sentence
      I couldn't support; I owed a correction for it. Grant wanted
      the source behind the rest. I wanted the underlying records
      on the editor's desk before his announcement became the version
      everyone repeated. A correction is not a donor's right to choose
      what remains of the story.
    motive_murderer: >-
      The arts desk was about to print "rescue." Justin's property
