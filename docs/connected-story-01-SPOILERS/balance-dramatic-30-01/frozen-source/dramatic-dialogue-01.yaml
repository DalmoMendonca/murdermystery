schema_version: 1
status: authored_not_balance_accepted
characters:
- id: '01'
  voice: Diplomatic host; complete sentences; redirects discomfort toward hospitality until control fails.
  private_stake: His father never thought running a regional museum was a real career. Grant's proposed resignation makes that judgment public.
  emotional_arc: Hosts through shock; becomes territorial; finally asks to be relieved of hosting.
  hearings:
    motive_innocent: >-
      Please, sit wherever you can hear. Grant wanted his name over the door, a vote in every department, and my resignation. Monet needed his check for wages; Sue objected to the terms. Six years here, and tonight I was supposed to introduce my own replacement. My father would have called that a useful lesson in ambition. I had hoped never to give him the satisfaction.
    motive_murderer: >-
      Please, sit wherever you can hear. Grant wanted his name over the door, a vote in every department, and my resignation. Monet needed his check for wages; Sue objected to the terms. Six years here, and tonight I was supposed to introduce my own replacement. Grant expected me to call him our savior. I had practiced the introduction. I could not get through it.
    where_innocent: >-
      Sue and I stopped the announcement at the public desk. I left my refusal in the coordinator's folder and sent it to the board office. I told intake to keep the bottle out of the public exhibition. Then I went on being the host. Smiled. Offered introductions. Claire, you kept looking at me as though you knew how close I was to losing my temper.
    where_murderer: >-
      Sue and I stopped the announcement at the public desk. I left my refusal in the coordinator's folder and sent it to the board office. I told intake to keep the bottle out of the public exhibition. Then I went on being the host. Smiled. Offered introductions. Grant could dispute the agreement. He was still a guest in the building I ran.
    evidence_innocent: >-
      I approved the closed preview while the contents question was unanswered. I told them to keep the bottle closed. That was the precaution I took. My refusal of the donation had already gone to the board before Grant could announce it. Could someone else please deal with the tables? I keep trying to host this, and I cannot bear another person asking me where to sit.
    evidence_murderer: >-
      Intake removed the bottle from the support before the guests entered. Its label stayed. I refused the donation and sent that refusal to the board. There are decisions I will answer for. Allowing guests near a filled bottle was not one of them. Could someone else please deal with the tables? I cannot keep welcoming people into this room.
  innocent_ending: >-
    I did not kill Grant. My refusal was already with the board, and the preview photograph shows the bottle I foolishly allowed to remain on display. I relied on an instruction to keep it closed. Claire will have every reason to ask why. Tomorrow I have to tell the staff what happened in the institution I promised to protect. Tonight, for once, somebody else can make the closing remarks.
  guilty_consequence: I cannot call this protecting the museum. Claire will have to tell the staff what I did, and I will not be here to make it sound dignified.
- id: '02'
  voice: Educated and spare; exact nouns; restrained irritation gives way to faltering concern for her student.
  private_stake: She trained Reed to trust her judgment and now fears she has taught obedience instead of scholarship.
  emotional_arc: Corrects terminology; defends her authority; admits a failure of mentorship without repairing it instantly.
  hearings:
    motive_innocent: >-
      The bowl's ownership papers were incomplete. I approved its label too soon; Grant preferred that earlier version. Reed kept asking me to revisit it. I taught that student to question an authority, and then behaved very badly when the authority was me. Grant wanted my name beneath the claim tonight. I wanted the revised label up. We were each rather determined.
    motive_murderer: >-
      The bowl's ownership papers were incomplete. I approved its label too soon; Grant retained my signature. Reed kept asking me to revisit it. Grant could expose the earlier approval whenever I objected to his claim. My department was meant to thank him tonight. Instead I was trying to withdraw authority he already possessed, with my student watching.
    where_innocent: >-
      I removed the bowl's ownership label. The bowl remained. Reed kept the old wording. I moved the bottle's incoming papers from the public display file to intake because its approval was on hold. Both files were on that desk. Reed, please stop calling everything I did a correction. Some of it was simply putting an unpleasant decision where I would not have to look at it.
    where_murderer: >-
      I removed the bowl's ownership label. The bowl remained. Reed kept the old wording. I moved the bottle's incoming papers from the public display file to intake because its approval was on hold. Both files were on that desk. Grant took an unresolved acquisition as a personal insult. I was past explaining why a curator could not accept his assurance as research.
    evidence_innocent: >-
      Intake had the complete contents query and the instruction to keep the bottle closed. That warning stayed with the staff when I moved the papers. I could have demanded an answer before the preview. I sent a question instead. Reed, I heard you asking. I did hear you. I am having considerable difficulty explaining what I did with that knowledge.
    evidence_murderer: >-
      The intake sheet says empty. I authorized an empty historical bottle for the preview. I moved its papers as part of catalog work. I did not approve a filled vessel. Reed, you may dislike how I handled the bowl. You would be right to. Please keep that failure separate from something I never authorized.
  innocent_ending: >-
    I did not kill Grant. Intake retained the unanswered contents question and the closed-bottle restriction. I left the preview approved anyway. My earlier bowl label was also wrong. Reed, you should not have needed my permission to keep asking. I cannot offer you a corrected label as an apology for that. I can offer you the original file, and I can stop standing between you and it.
  guilty_consequence: Reed, you were right to question me. I have spent tonight making you ashamed of the person who taught you to do that.
- id: '03'
  voice: Smooth dealer; quiet assurance; uses ordinary commercial language and leaves threats understated.
  private_stake: His respectable firm is the life he built after being dismissed as a small-time hustler. Public exposure would strip away that invented security.
  emotional_arc: Makes an offer; resents a rival's attention; clings to composure as the transaction fails.
  hearings:
    motive_innocent: >-
      Grant wanted a refund on the Star Bowl and a public admission that its certificate was false. My firm supplied it. I changed our file instead of admitting we'd been fooled. Elon began worrying about his other purchases; Saul was available to help him worry. I offered a settlement. Grant preferred an audience. Some of you knew me before I had a respectable office. He liked reminding me.
    motive_murderer: >-
      Grant wanted a refund on the Star Bowl and a public admission that its certificate was false. My firm supplied it. I changed our file instead of admitting we'd been fooled. Elon began worrying about his other purchases; Saul was available to help him worry. My settlement wasn't enough. Grant wanted the admission tonight. Some of you knew me before I had a respectable office. He meant to send me back there.
    where_innocent: >-
      I withheld the seller's correspondence from the auction handouts. It covered the bowl and the Velvet Widow purchase I arranged. The bottle sale required original contents. Grant called the liquid inert in his loan description. I had both; the display writers got the comfortable version. A second bad purchase beside the first would have been quite an evening for Saul. I was not in a charitable mood.
    where_murderer: >-
      I withheld the seller's correspondence from the auction handouts. It covered the bowl and the Velvet Widow purchase I arranged. I had the seller's description and Grant's loan description. The display writers got the latter; the other stayed in my file. Grant had already demanded one refund. I wasn't providing a roomful of clients with another purchase to question. Saul could find his entertainment elsewhere.
    evidence_innocent: >-
      The seller required original contents. Grant supplied the inert description later, and I repeated it. Intake had the complete seller attachment before the gala; I forwarded it. The donors received the shorter declaration. I left staff to deal with the difference. Saul, please save your condolences. I know what your expression means. I have worn it at other people's expense.
    evidence_murderer: >-
      Before the loan, the original-contents condition was canceled. The seller was to empty the bottle and replace the liquid with an inert substitute. Grant's declaration described that delivery. Intake had the earlier attachment. I altered the bowl file; I have admitted that. The bottle was a separate purchase with changed instructions. Saul, please save your condolences. I know what your expression means.
  innocent_ending: >-
    I did not kill Grant. The seller attachment was unaltered when I sent it to intake before the gala. I still sold the bowl under a false certificate, changed our file, and repeated Grant's harmless-liquid claim without resolving it. He deserved the refund. Elon, you deserve to see your purchase files. I dislike the man Saul thinks I am. I have given him a very good case tonight.
  guilty_consequence: Saul can have the clients. Elon can have every file. I wanted so badly to remain the respectable man behind that desk that I have made him impossible to remember.
- id: '04'
  voice: Fast practical speech; numbers and short questions; irritation masks panic about people depending on the payroll.
  private_stake: She grew up watching a parent wait for wages that did not arrive. Missing payroll is personal, not an abstract budget failure.
  emotional_arc: Snaps at waste; resents moral judgment from comfortable people; admits how fear distorted a choice.
  hearings:
    motive_innocent: >-
      Friday. That's when wages are due. My mother used to wait by the phone on payday. I know what that does to a household. Grant's check could cover our staff; his terms let him question every transfer. Artie hated losing authority. I needed an amount I could put through payroll. Everyone kept saying rescue. Nobody gave me a date for the money.
    motive_murderer: >-
      Friday. That's when wages are due. My mother used to wait by the phone on payday. I know what that does to a household. I'd moved money to pay our staff. Grant wanted the books before releasing his check, and the board wanted answers too. Artie hated losing authority. I had transfers to explain and no time left to explain them.
    where_innocent: >-
      The manager brought the extra-course ticket to accounts. I crossed out our account and sent the donor copy back with the manager. Grant could sign for his cheese. I'd already moved restricted money into payroll without telling the board. Brie, I know the supplier wants paying. So do the cleaners. I had run out of people I could ask to wait.
    where_murderer: >-
      The manager brought the extra-course ticket to accounts. I crossed out our account and sent the donor copy back with the manager. Grant could sign for his cheese. The board hadn't seen the restricted-fund transfer. He wanted my books before releasing his donation. Brie, I know the supplier wants paying. Grant's signature was becoming the answer to every question I couldn't settle.
    evidence_innocent: >-
      I sent the manager these instructions: serve the original order; bill the addition to Grant. The toast stayed booked. The restricted money paid staff wages. Yes, I moved it. Artie, don't tell them we all agreed. We didn't. I did it, and now a man is dead and I still catch myself calculating whether Friday is covered.
    evidence_murderer: >-
      I looked for Grant before the preview. His glass was set out, unwrapped, beside the invoice. He wasn't there. I left his copy for signing and returned to accounts. The cheese argument continued later. So did payroll. Artie, don't tell them we all agreed. We didn't. I was the one expected to find the money.
  innocent_ending: >-
    I did not kill Grant. My ticket went back through the manager; the paid toast continued. The restricted money went to wages. That doesn't authorize what I did. The board will have the whole account. I want someone to tell the staff before they read about it. They shouldn't spend tomorrow wondering whether their next paycheck is another promise from somebody in this room.
  guilty_consequence: The wages were paid. That is the small fact I kept hiding behind. A family is waiting for a man who will never come home, and I made that happen.
- id: '05'
  voice: Clipped material facts; awkward with feelings; anger at unsafe handling becomes shaken protectiveness.
  private_stake: Care is how he expresses affection. He can discuss a centuries-old crack more easily than guilt or grief.
  emotional_arc: Territorial precision; anger at the date exposure; realizes people needed the same care as objects.
  hearings:
    motive_innocent: >-
      Recent repair. Grant wanted me to call it ancient. He liked my name beneath his description. We had already argued over treatment paperwork. Then the entrance mount started moving. People sighed when I stopped the conversation. They always do. I am easier company if nobody touches anything. Claire knows that. Tonight I was exceptionally poor company.
    motive_murderer: >-
      Recent repair. Grant wanted me to call it ancient. He had the insurance copy with the date I altered. Refusing his description meant answering for mine. Then the entrance mount started moving. He suggested I was inventing another problem to protect myself. Claire knows how I am about handling. Grant knew how to turn that into a joke.
    where_innocent: >-
      I fitted the red closure band before the preview. Checked the closed bottle. Kept the condition sheet. Later I went to the alcove because the mount was moving. The treatment folder stayed at the workbench with the false date in it. Frank, your entrance could wait. Somebody underneath that mount could not.
    where_murderer: >-
      I fitted the red closure band before the preview. Checked the closed bottle. Kept the condition sheet. Later I went to the alcove because the mount was moving. The treatment folder stayed at the workbench. Grant already had copies of my changed date. He could still use them after I corrected my copy. Frank, I wanted that load down.
    evidence_innocent: >-
      Foil-backed red paper. I fitted it across the stopper. Unused strips are in my supply sleeve. I inspected from the front and missed the split hidden behind it. The insurance copy has the false date; my original sheet has the right one. I can say all that without shaking. I wish somebody would ask me about an object again.
    evidence_murderer: >-
      My closure band was red woven tape. Foil-backed paper was packaging stock. The sleeve and technician's photograph concerned the band work. They weren't an inventory of every red scrap in the museum. The insurance date is wrong. I changed it. I can answer that question. I will not identify somebody else's packaging as a material I used.
  innocent_ending: >-
    I did not poison Grant. I changed an insurance date. I also put a foil-backed paper band on a closed bottle and missed the later split at its back. My original sheet and photograph remain. Claire, I will give you the keys to the workbench. I keep objects safe by refusing to let anyone near them. Tonight that instinct failed the people who trusted me.
  guilty_consequence: I used the weakness in a closure I had fitted. People trusted my hands near things that could not be replaced. They should never trust them again.
- id: '06'
  voice: Theatrical, unpredictable rhythm; art-world confidence; abandons performance when confronted with real death.
  private_stake: Grant appropriated a work about humiliation. She fears being remembered as a joke rather than its author.
  emotional_arc: Turns anger into performance; becomes furious about credit; cannot bear an audience watching her grief.
  hearings:
    motive_innocent: >-
      Donor Collapse was an empty dinner jacket falling from a gilded chair. I made the film. Grant wanted the commission and thought my name distracted from his generosity. Vincent knows the sort of work I made before anyone paid attention. I wanted this one remembered as mine. And yes, I was going to make that room uncomfortable. I had an excellent reason.
    motive_murderer: >-
      Donor Collapse was an empty dinner jacket falling from a gilded chair. I made the film. Grant wanted my name removed while his foundation acquired it. Vincent knows what it cost to get anyone to take my work seriously. Grant expected gratitude for erasing me from it. I was going to make that room uncomfortable. He was not going to enjoy the version he bought.
    where_innocent: >-
      I kept trying to restore the canceled collapse cue. I went to the private room for the coordinator. Grant's place was set. I had the film on my phone and showed her the falling jacket. I wanted the screen on during his toast. She said no again. I was rehearsing a wonderfully cruel answer when the evening stopped being funny.
    where_murderer: >-
      I kept trying to restore the canceled collapse cue. I went to the private room for the coordinator. Grant's place was set. I had the film on my phone and showed her the falling jacket. I wanted the screen on during his toast. She said no again. Grant could remove my credit. He couldn't expect me to watch his replacement performance quietly.
    evidence_innocent: >-
      An empty jacket. A chair. A thump. That was the studio film we delivered before tonight. Grant refused a live stunt with himself or any guest, then rejected the screen version too. I kept asking to show it. Please stop looking at me when you say collapse. I wanted him embarrassed. I had thought about his face afterward.
    evidence_murderer: >-
      The film rehearsed Grant's entrance. He agreed to fall after the private toast. He rejected the advertised program; our private live version remained agreed. I expected him to get up. Please stop looking at me when you say collapse. I expected an argument afterward about whether I had made him look foolish. That was the performance we had arranged.
  innocent_ending: >-
    I planned an insult. The delivered film and Grant's rejection tell you what it was: an empty jacket, no live performer. I pushed the coordinator and went to his room because I wanted it shown. I did not kill him. Vincent, please don't tell me I can make work about this. I know. I am going to need a very long time before I want to.
  guilty_consequence: Vincent, there is no artistic explanation that makes this better. I kept wanting the room to look at my work. Now everyone is looking at what I did.
- id: '07'
  voice: Warm, mercurial, ego interrupted by frank embarrassment; painter's concrete visual language.
  private_stake: Early fame froze him as a young prodigy. He envies Dada's ability to move forward and fears he has already made his best work.
  emotional_arc: Complains about collectors; lets resentment toward an old friend surface; asks for criticism rather than reassurance.
  hearings:
    motive_innocent: >-
      He kept exhibiting the early picture. My breakthrough, apparently. I painted it to pay rent. Now he'd commissioned the bottle study and wanted to print it beside his rescue announcement. I withdrew permission. Hugh told me to be less difficult. Dada, you kept making new work while I got invited to explain the old one. Grant liked having that old version of me on his wall.
    motive_murderer: >-
      He kept exhibiting the early picture. My breakthrough, apparently. I painted it to pay rent. Now he wanted the bottle study printed beside his rescue announcement. I withdrew permission; he could hold my final payment. Hugh told me to be less difficult. Dada, you kept making new work. Grant could buy another picture from me and still introduce me as the boy who painted his first.
    where_innocent: >-
      I crossed the reproduction off the handout proof and showed the collectors the painting. The bottle came from a sale photograph. I made a studio model to work out the light. At the preview I saw Grant's acquired bottle. My studio things weren't in his loan. Hugh, I know you could sell the whole arrangement. I would still like to be asked first.
    where_murderer: >-
      I crossed the reproduction off the handout proof and showed the collectors the painting. The bottle came from a sale photograph. I made a studio model to work out the light. I was at the preview too. Hugh, you could sell the whole arrangement, but I had agreed to a painting. Every object beside it was suddenly becoming part of my endorsement.
    evidence_innocent: >-
      The model is joined wood, painted to catch the light. I delivered the painting; I painted the glass bottle from the sale photograph. Grant's actual bottle stood at the preview. He threatened my final payment over reproduction permission. Dada, I was jealous of you before tonight. I am ashamed that I still found time for that while you were being treated like this.
    evidence_murderer: >-
      My studio model stood on the preview support. Grant's acquired bottle was withheld. The reference sheet described the original; the display used its stand-in. The delivery list didn't name every presentation prop. Dada, I was jealous of you before tonight. Grant made both our commissions sound like favors he was doing us. I had had enough of hearing it.
  innocent_ending: >-
    I did not kill Grant. My model was wood; the loan was glass. The delivery list separates the painting from the object. I withdrew reproduction permission even with payment outstanding. I also let Grant sell a grander story about my early work than it deserved. Dada, I owe you a conversation without collectors listening. Bring the bad student paintings. I could stand to remember what trying felt like.
  guilty_consequence: Dada kept making work. I kept wanting someone else to remove the man who made me feel small. There is no picture I can paint that excuses doing it myself.
- id: '08'
  voice: Precise lawyer with conversational bite; answers narrowly; warmth emerges reluctantly with her friend.
  private_stake: Fierce loyalty to Mona conflicts with the habit of hiding behind procedure when personal trust is needed.
  emotional_arc: Controls the question; becomes sharply protective; drops legal detachment for a friend.
  hearings:
    motive_innocent: >-
      He intended to announce the gift before a board vote. Its terms gave him approval of future acquisitions. I had advised on the troublesome ownership file already. Mona and I can argue a case all afternoon and still have dinner together. Grant thought disagreement meant somebody must lose. I wanted his microphone stopped until there was an agreement worth announcing.
    motive_murderer: >-
      He intended to announce the gift before a board vote. Its terms gave him approval of future acquisitions. He also had the ownership file carrying my earlier advice. He could put it before the board whenever I objected. Mona and I know how to disagree without destroying someone. Grant was enjoying the alternative. I wanted his microphone stopped.
    where_innocent: >-
      Artie and I argued at the public announcement desk. I removed the unsigned agreement, kept the marked running order, and told the coordinator not to substitute Grant's donor copy. My advice was attached to that transaction. Mona, I was short with you. I am still not accepting your letter as a government order. We can be furious with each other somewhere else tomorrow.
    where_murderer: >-
      Artie and I argued at the public announcement desk. I removed the unsigned agreement, kept the marked running order, and forbade substitution of Grant's donor copy. My advice was attached to the transaction. Mona, I was short with you. I was trying to stop the room applauding an agreement the board had never accepted. I have rarely wanted a microphone switched off more.
    evidence_innocent: >-
      I stopped the public announcement. Private hospitality stayed in the next line. I took the unsigned master at the public desk; the coordinator kept my markup. The board received my objection with my own bad advice attached. Mona, sit down before you fall over. You may be cross with me seated. I am cross with you too, and I would like you here to hear it.
    evidence_murderer: >-
      I checked Grant's donor copy while the manager poured at his private place. The glass stood on the agreement. The manager lifted it; I pulled the paper free. That was my only visit. My public markup left hospitality in place. Mona, sit down before you fall over. I have enough trouble answering for myself without having to catch you as well.
  innocent_ending: >-
    I did not kill Grant. I took the master at the public desk, and private service continued. My objection reached the board with the bad advice still attached. I should have challenged that ownership file sooner. Mona, tomorrow I will argue the authority of your letter again. Tonight I would like to go home with my friend. Neither of us has to win that conversation.
  guilty_consequence: Mona, I have made it impossible for you to sit beside me without wondering what I could do. That is worse than losing any case.
- id: '09'
  voice: Pedantic, educated, subordinate clauses and self-interruptions; forgets vocabulary when embarrassed by affection.
  private_stake: Infatuation with Dada makes public intellectual humiliation feel especially unbearable.
  emotional_arc: Lectures reflexively; realizes his student has seen through him; loses the language he usually hides behind.
  hearings:
    motive_innocent: >-
      Reed found a gap in my ownership citation. Grant found it inconvenient, which is not a scholarly objection. I asked to hold the earlier press copies; he wanted my name on them before the correction. Dada was here. I had hoped to discuss something rather more impressive with her. A ridiculous concern, given the size of the actual error. Still, there it is.
    motive_murderer: >-
      Reed found a gap in my ownership citation. Grant could expose it whenever I withdrew authority from his catalog. I asked to hold the earlier press copies; he wanted them circulating first. Dada was here. I had imagined a rather different conversation with her. Grant was going to make sure my most attentive audience heard about the error before anything else.
    where_innocent: >-
      I asked Reed to hold the early press version and restore the purchase attachment. It concerned the bottle. My draft said inert; the attachment required original contents. I left both in the working file with a query. I attended the preview. Reed, I know how often I have told you to pursue a discrepancy. I was distressingly satisfied with writing one in the margin.
    where_murderer: >-
      I asked Reed to hold the early press version and restore the purchase attachment. It concerned the bottle. My draft used the inert description; a query remained beside the entry. I attended the preview. Grant kept introducing me as the person who could explain his collection. I had begun to feel that an introduction from him was something I should decline.
    evidence_innocent: >-
      I wrote that query before the gala. I quoted original contents and asked how that agreed with inert. Intake replied unanswered; keep closed. I let the comfortable caption continue. Reed, you may say that was poor scholarship. Dada, I would rather you hadn't heard any of this. That is about the least useful thought I have had this evening.
    evidence_murderer: >-
      I had not read the purchase condition before the gala. My query concerned the object's history. The loan description was my source; the dealer attachment was outside my research then. My ownership citation was poor. Reed, you may say that. Dada, I would rather you hadn't heard any of this. I have become very foolish about who is listening.
  innocent_ending: >-
    I did not kill Grant. My dated query quotes the contents condition; intake answered that it remained unresolved. I let the entry proceed. Reed, your finding deserves your name. Dada, the invitation to dinner I kept disguising as a discussion of your work was an invitation to dinner. You need not answer it tonight. I am trying to say one thing without a footnote.
  guilty_consequence: Dada, you need not explain your work to me. Reed, you need never seek my approval. I have used my knowledge for the smallest possible purpose.
- id: '10'
  voice: Glamorous, colloquial and guarded; understatement and social shorthand; breaks into intimate family language.
  private_stake: Longing for authority coexists with an unwanted need for Grant's approval. Her crush on Hugh makes vulnerability public.
  emotional_arc: Performs composure; becomes angry about family control; misses the person she was arguing with.
  hearings:
    motive_innocent: >-
      Family gift for the photograph. His gift when I asked for a say. I asked Sue about the succession clause before agreeing to pose. Grant wanted me glamorous and agreeable beside it. I know how to do both. Hugh has seen me fail at agreeable. I wanted a chair in the decisions, and I wanted Grant to think I deserved it. Those wants kept getting mixed up.
    motive_murderer: >-
      Family gift for the photograph. His gift when I asked for a say. I asked Sue about the succession clause. Grant had decided how the family seat would pass and still expected me to wait for it. Hugh has seen me fail at agreeable. I was tired of waiting while Grant praised me for being patient. He called it trust. It felt like being kept outside.
    where_innocent: >-
      I ordered the gift glass through the shop and requested a private toast. I wanted the family argument away from the podium. During the reception I went there; his glass was waiting and he wasn't. I left the revised seating card and went to find Sue. I had rehearsed what to say to him. It sounded braver in the car.
    where_murderer: >-
      I ordered the gift glass through the shop and requested a private toast. I wanted the family argument away from the podium. During the reception I went there; his glass was waiting and he wasn't. I left the revised seating card and went to find Sue. I'd arranged the privacy. I meant to use it to get a real answer from him.
    evidence_innocent: >-
      His glass was unwrapped when I left the seating card. I was annoyed they'd already made my present into service equipment. The manager had the toast; I went looking for Sue. The donor seat depends on the board accepting the gift. I asked for an appointment while Grant was alive. Sue, I keep remembering that I bought him a glass. Such a stupid thing to be unable to stop thinking about.
    evidence_murderer: >-
      His glass was wrapped when I left the seating card. The manager opened it for the pour and took it directly to Grant. The donor seat depends on board approval. I asked for an appointment while he was alive. Sue, I keep remembering that I bought him a glass. I wanted him to use something I had chosen for him.
  innocent_ending: >-
    I did not poison Grant. The draft shows I asked for the family appointment while he was alive; the board had not accepted the gift. His glass was already bare when I left my card. I do inherit. I was angry. Hugh, please don't tell me how fortunate that makes me. I have an argument waiting for someone who will never answer it, and I still want him to answer.
  guilty_consequence: I wanted him to hear me as an adult. Now every room in that family house will remind me of the person I made sure could never answer.
