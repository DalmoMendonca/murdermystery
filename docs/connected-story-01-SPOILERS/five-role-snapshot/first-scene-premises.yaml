common_service_history:
- when: Several days before the gala
  event: Grant ordered an additional cheese course and a separate personal toast. The agreed toast used the shared
    punch with his requested culinary flavoring; it was not the public announcement of the museum gift.
  record: Caterer's ordinary order sheet
  attendance: The order remains a prior victim instruction in every cast.
- when: Before the reception
  event: The museum had not authorized the additional-course charge. Monet put that charge on hold; the already
    contracted private-toast service was not canceled.
  record: Accounts email attaching the extra-course invoice
  attendance: If Monet is absent, ordinary accounts staff follow the standing authorization rule; no claim he intervened
    at the reception.
- when: Before the reception
  event: Sue objected to a public celebration describing the unsigned agreement as an accepted gift. Her note specifically
    excludes ordinary private hospitality from the objection.
  record: Marked draft running order
  attendance: If Sue is absent, the board office issued the standing note. Do not credit a missing guest with a
    present intervention.
- when: '6:32'
  event: The manager set Grant's private place, then returned to the kitchen over the unresolved extra-course charge.
    The private glass remained in the salon.
  record: Manager's signed account; ordinary kitchen ticket
  attendance: Manager is nonplaying staff and supplies this essential fact independently.
- when: During the kitchen interruption
  event: If Brie attends, Brie prepares the separately ordered private garnish at the table. If absent, ordinary
    caterer staff perform the same ordered service. Actual action attribution changes with the cast.
  record: Service order and retained ingredient from the actual caterer
  attendance: No dependence on Brie's speech for explaining whether private service occurred.
- when: 6:44, 6:46, 6:49
  event: The manager collected the glass at 6:44, poured the shared punch in the kitchen at 6:46 and carried the
    toast directly to Grant at 6:49. The public gift announcement remained unsigned. No claim that the manager knows
    earlier handlers.
  record: Manager's account and kitchen ticket
  attendance: Common staff sequence; no continuous photographic proof.
ingredient_contract:
  actual_use: Culinary flavoring was added to the individual glass before shared punch was poured. Its label and
    remaining container are retained.
  pre_vote_result_required: The retained culinary ingredient has no detected cyanide; ordinary flavoring residue
    and cyanide are both present in Grant's glass. Shared punch and food are tested separately.
  limited_inference: The tested ingredient supports an ordinary reason for preparing the glass. It cannot exclude
    a separate contamination or prove the retained container was the only thing used.
  failure_condition: Reject the scene if the record simply calls all glass residue poison, or if the only explanation
    appears after the vote.
three_personal_case_proposals:
- id: '04'
  motive: The unsigned gift is the payroll rescue; its donor-control conditions threaten Monet's unauthorized transfer.
  opportunity: Monet imposed the charge hold that sent service back to the kitchen; he later sought Grant's written
    approval at the private place. No automatic inference he poisoned the glass.
  late_attribution_candidate:
    id: '04'
    late_claim_to_test: Monet says he obtained Grant's approval at the already unwrapped private glass before attending
      the closed preview.
    shared_contradiction: The preview ended before the private place was set from the wrapped gift. The manager's
      original service account and unopened incoming gift, together, conflict with that claimed sequence.
    innocent_counterstory: Monet sought approval during the actual unattended interval; the extra-course invoice
      and standing authorization dispute explain the visit, without proving an alibi.
    crime_connection: A false earlier account would conceal a visit during the exposed interval, not prove extraction
      or murder alone. Motive, common source access and specific concealment must be assessed together.
    risk: A mistaken order is not necessarily a lie. Do not state unique proof; test whether the rival innocent
      counterstories leave the selected case best supported.
  status: Sequence-contradiction hypothesis only; not accepted or scripted.
- id: 08
  motive: Sue's own earlier advice underlies the disputed acquisition; approval exposes her error, rejection loses
    the client and rescue gift.
  opportunity: Sue retrieved the unsigned agreement from Grant's private place to keep it out of the podium papers.
    This gives a real table visit with a legal purpose; source opportunity remains the common preview.
  late_attribution_candidate:
    id: 08
    late_claim_to_test: Sue says she withdrew the agreement under the manager's supervision during pouring at the
      private place.
    shared_contradiction: The required manager account places pouring in the kitchen followed by direct delivery,
      not at a glass standing on the agreement at the private place.
    innocent_counterstory: Sue withdrew the agreement earlier while private service was on hold; her marked public
      running order explains which announcement she was stopping.
    crime_connection: A false later account would hide a table visit while the glass was exposed. It adds a specific
      weakness to an already consequential legal dispute but is not a unique handling reconstruction.
    risk: Newly revised premise, not reviewed. A mistaken service recollection remains possible; source access and
      the earlier dispute must carry independent weight. Do not use the ambiguous ticket-close/collection overlap
      as proof.
    protective_purpose: Places her claimed access under staff supervision instead of in the unattended interval.
  status: Sequence-contradiction hypothesis only; not accepted or scripted.
- id: '23'
  motive: Brie faces a contracted gala cost the museum has not funded; Grant's personal extras make the shortfall
    worse.
  opportunity: Brie actually prepared the individual glass under the standing service order. This is ordinary hospitality,
    not an invented sauce stain making him touch it.
  late_attribution_candidate:
    id: '23'
    late_claim_to_test: Brie says his culinary container remained closed because the manager had already added flavoring
      to the shared pitcher.
    shared_contradiction: The pitcher lacks the culinary flavoring found in Grant's glass. This contradicts the
      claimed ingredient source, not who added it or the exact order of preparation.
    innocent_counterstory: Brie openly describes adding the ordered flavoring. The clean retained ingredient supports
      that ordinary explanation without excluding a separate act.
    crime_connection: The guilty account conceals the individual preparation step, the one step shared-food tests
      cannot resolve. No claim of a unique ingredient signature or quantity is made.
    risk: The comparison does not identify an individual preparer or prove when flavoring was added. A mistaken
      service account remains possible. No claim that an order proves actual execution.
    protective_purpose: Denies personally carrying out the separately prepared ingredient step while retaining the
      same container purpose from Opportunity.
  status: Sequence-contradiction hypothesis only; not accepted or scripted.
decision: Review the coherent service sequence and three distinct late contradictions against normal innocent counterstories.
  No personal inventory certificate bank. These accusations remain circumstantial and unvalidated; no claim of a
  solved architecture.
rejected_attribution_construction: Three more loose red-paper pieces in three retained folders would repeat the
  failed inventory mechanic. Removed as a required personal proof. The existing source/glass scrap remains a common
  physical clue, not thirty new personal inventory reports.
