schema_version: 1
status: authored_not_reviewed_or_scored
scope: Two proposed replacement primary suspects. Complete three-round paired draft text plus endings; not integrated
  into canonical packet source.
questions:
  motive: What business with Grant had become a problem for you?
  opportunity: What did you conceal or take back during the reception?
  method: What do the retained records establish about your dealings with Grant?
characters:
- id: '03'
  name: Hugh Bidder
  motive_innocent: Grant wanted his money back on the Star Bowl. The certificate was false before it came to me,
    but my firm's letterhead carried it to the buyer. I changed our file instead of admitting we'd been fooled.
    I offered a settlement. Elon wanted to know which other purchases he ought to worry about; Saul was delighted
    to ask that question loudly. This was my business, not Saul's auction house, and one refund could finish it.
  motive_murderer: Grant wanted his money back on the Star Bowl. The certificate was false before it came to me,
    but my firm's letterhead carried it to the buyer. I changed our file instead of admitting we'd been fooled.
    My settlement offer wasn't enough. Elon wanted to know which other purchases he ought to worry about; Saul was
    delighted to ask that question loudly. Grant wanted the refund and my admission. That combination would finish
    my business.
  opportunity_innocent: I kept the seller's correspondence out of the auction handouts. It covered the bowl and
    the Velvet Widow purchase I'd arranged for Grant. The bottle sale required its original contents to remain inside.
    That wording would hardly reassure a room full of donors. Grant's loan description called the liquid inert.
    I had both descriptions in the same file and sent only the comfortable one to the people writing the display
    copy. I wasn't going to have another bad purchase discussed beside the first.
  opportunity_murderer: 'I kept the seller''s correspondence out of the auction handouts. It covered the bowl and
    the Velvet Widow purchase I''d arranged for Grant. There were two descriptions of the liquid: the seller''s
    and Grant''s. I sent the loan description to the people writing the display copy. The other one stayed in my
    file. Grant had already demanded a refund on one purchase; I didn''t want donors asking what else I''d sold
    him. The handouts weren''t going to carry every argument in that file.'
  method_innocent: The seller's condition required the original contents. Grant wanted the object in that state.
    His later loan declaration called it inert; I repeated that description without resolving the difference. The
    original sale correspondence survives because I needed it for the price dispute. I first entered the gala at
    6:29, after the closed preview. That first-admission receipt and the file explain why I missed it. They don't
    excuse sending a donor's convenient description in place of the seller's actual condition.
  method_murderer: I first entered the gala at 6:17. I had the file with me for the preview. The original-contents
    clause had been canceled before the loan; the seller was to empty the bottle and put inert display liquid inside.
    Grant's loan declaration was the description of the object actually delivered, not a new version of the sale.
    My file alteration concerned the Star Bowl certificate. The bottle wasn't another purchase with a dangerous
    condition left unresolved.
  coming_clean_innocent: I did not kill Grant. I sold him a bad certificate and then made my own file look better
    than the transaction was. I also repeated his inert-liquid description without settling it with the seller's
    condition. I arrived after the preview and had no honest basis to describe what happened inside it. The original
    correspondence and first-admission receipt were already available to you. I'll give the buyer the unaltered
    file and deal with the refund as a dealer, not as the inventor of a more attractive sale.
  coming_clean_murderer: I killed Grant. I knew the original-contents condition had not been canceled. I took poison
    from the bottle during the closed preview and put it in his private glass while it was unattended. Calling the
    sale condition canceled was my way of making the source look harmless; the retained purchase papers and the
    laboratory findings contradicted that account. His refund demand would have ruined my business. I decided he'd
    never collect it. The certificate was already false when I received it. The murder was entirely mine.
- id: '12'
  name: Paige Turner
  motive_innocent: The paper was going to call the gift a rescue. Justin's property records and the ownership file
    gave me a different story. Grant wanted the source behind it. I had published one sentence I couldn't support,
    and his lawyer had every right to demand a correction. That didn't make the rest of the report false. I wanted
    the correction in print and the underlying records on the editor's desk before the gala announcement swallowed
    both.
  motive_murderer: The paper was going to call the gift a rescue. Justin's property records and the ownership file
    gave me a different story. Grant wanted the source behind it. I had published one sentence I couldn't support,
    and his lawyer was using it against the whole report. I wanted the records in print. Grant wanted a person's
    name. He was making the correction into a price for leaving that person alone.
  opportunity_innocent: I took my recorder out of Grant's coat in the cloakroom. He had kept it after our interview.
    I copied the file before anyone could demand it back. I gave Drew a short export, with the part that could identify
    my source removed. That was not the original recording. I told the editor what I'd cut and kept the untrimmed
    file. I wanted the reporting checked. I also wanted the recorder back, and I didn't ask permission to search
    his pocket.
  opportunity_murderer: I took my recorder out of Grant's coat in the cloakroom. He had kept it after our interview.
    I copied the file before anyone could demand it back. I gave Drew a short export, with the part that could identify
    my source removed. That was not the original recording. I kept the untrimmed file for the editor. Grant had
    wanted the recorder as well as the name. He wasn't going to keep either by sending another letter through his
    lawyer.
  method_innocent: The untrimmed interview was at Grant's private place during the reception. You hear the service
    manager setting his glass in the Donor Salon. I left that exchange out of Drew's export; it named the part of
    the museum where my source worked. The editor's retained original has it. The separate correction addresses
    the sentence I got wrong. The edit concealed a source, and the pocket search recovered the recording. Neither
    was permission from Grant to publish what I wanted.
  method_murderer: The interview on that export was in the museum office the previous day. I did not interview Grant
    beside his glass during this reception. I left the opening exchange out because it could identify where my source
    worked. The untrimmed file was the editor's material, not a story for the society photographs. Taking my recorder
    back was a pocket search, not a visit to Grant's private place. The correction concerns one sentence; Grant
    wanted it to erase the whole report.
  coming_clean_innocent: I did not kill Grant. I cut the service exchange out of the export to protect my source's
    workplace. The editor had the original, and you heard where that interview really took place. I also corrected
    the unsupported sentence and searched a coat pocket without permission. I'll publish the correction and keep
    the source protected. I won't present that edit as an uncut recording again.
  coming_clean_murderer: I killed Grant. I used the closed preview to take poison from the bottle and the unattended
    private glass to give it to him. My claim that the interview was yesterday in the office was false. The untrimmed
    opening put me at his place during the reception, with the service manager setting the glass. I cut it to keep
    that visit out of the account I gave you. Protecting a source was the reason I offered for the edit. It wasn't
    a defense of the murder.
new_evidence_contracts:
- id: seller-file
  visible_before_vote: Grant's original-contents purchase condition; no cancellation or substitution instruction
    in the executed file. Loan declaration separately calls the contents inert. Seller states the executed condition
    was fulfilled.
  purpose: Hugh's claimed cancellation conflicts with a retained sale, not merely with a poison label. The file
    is one actual disputed transaction, not thirty personal tracking certificates.
  limit: A seller statement can be doubted. Active residue does not independently identify Hugh or uniquely prove
    extraction timing.
  absence: Seller and loan records are common offstage records in every cast. No absent dealer is portrayed as attending
    the reception.
- id: uncut-interview
  release: Act III evidence; not in the hunt or Act II
  artifact: Editor's retained opening transcript/audio, with a note that the supplied export omits it.
  transcript:
  - 'SERVICE MANAGER: Mr. Larceny, I''ll leave your glass here. I''m going back to the kitchen about that added
    course.'
  - 'GRANT: Thank you. Paige, I asked for a quiet private place. Why have you followed me here?'
  - 'PAIGE: You agreed to an interview about the gift. It''s on the recorder.'
  - 'GRANT: It''s the gala. I''m announcing the gift tonight. Ask about that, or we''ll speak tomorrow.'
  purpose: The service exchange and Grant's complaint anchor this interview to the private-place service during
    the gala. The manager's separate report identifies that place as the Donor Salon. The recording does not track
    the reporter through the entire interval.
  limit: The transcript is a new artifact contract, not a generated recording or verified performance. A misleading
    edit or location lie is not alone proof of murder.
  absence: Include the named interview only when Paige attends. No other culprit route may require it; absent Paige
    is not a hidden selectable suspect.
