characters:
- id: '04'
  innocent: 'I did not kill Grant. I had used restricted money to pay staff and then tried to keep his additional
    catering charge out of the same account. I went to his unattended place for approval of that invoice. The crossed-out
    account and the open ticket were already in front of you. There was no clever rescue in what I''d done with
    payroll: I had paid people from money I was not entitled to use. The board needs that account, and Brie needs
    a funded answer to the bill.'
  murderer: 'I killed Grant. I took poison from the bottle during the closed preview, then used the unattended glass
    when I brought the invoice. My account put that visit before the preview, beside an already unwrapped glass.
    The original service record contradicted it: the place was set afterward from the wrapped gift. I had used restricted
    money for payroll and needed the gift to hide the transfer. Grant''s terms meant he would control the accounts
    instead. I chose to stop him with poison.'
- id: 08
  innocent: I did not kill Grant. I had let the disputed acquisition file go forward without its missing ownership
    attachment resolved. I withdrew the unsigned agreement while the glass was unattended. My marked running order
    opposed calling that draft an accepted gift; it did not cancel ordinary private service. Those were the decisions
    I made, and the papers were already available to you. I cannot turn taking back a draft into a defense of the
    earlier advice.
  murderer: I killed Grant. I took poison from the bottle during the closed preview and put it in the private glass
    when I withdrew the agreement. I claimed the manager had poured at the private place and supervised my paper
    exchange. The service account put the pouring in the kitchen and direct delivery afterward. That supervision
    was the cover I invented. Grant had the ownership file and my advice in it. I decided removing him was easier
    than admitting what I had approved.
- id: '23'
  innocent: I did not kill Grant. I prepared the private flavoring on the original service order and left the retained
    ingredient with the service things. The ingredient and pitcher findings were already available to you. I had
    also agreed to buy the additional course without a funded authorization. That was a real unpaid bill, not an
    attempt to change what the donor drank. I'll settle with the supplier and take the actual order back to the
    museum accounts office.
  murderer: I killed Grant. I took poison from the bottle during the closed preview and used it in his private glass
    while service was interrupted. I tried to say the individual preparation was unnecessary because the manager
    had flavored the shared pitcher. The comparison found that flavoring in Grant's glass and not in the pitcher.
    That was the step my account tried to remove. The extra course had left me owing a supplier while Grant insisted
    on his service. I poisoned him over a bill he could easily have paid.
