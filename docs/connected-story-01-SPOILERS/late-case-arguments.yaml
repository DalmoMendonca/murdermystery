schema_version: 1
status: authoring_argument_map_not_scored_or_physically_identifying_evidence
purpose: Track how late contradictions bear on the real crime instead of assuming every lie establishes poisoning.
required_standard: Correct final leading suspect with three to four credible alternatives; neither legal certainty
  nor a new truthful-innocent rule. No fixed named culprit artifact may exclude other selectable variants.
unresolved: No current ordinary exhibit independently names the person delivering poison. Some covers erase a direct
  source/target opportunity; others concern knowledge, materials or motive only. Every route requires review and
  full staged testing.
