  coming_clean:
    innocent: 'I did not kill Grant. I had used restricted money to pay staff and then tried to keep his additional
      catering charge out of the same account. I went to his unattended place for approval of that invoice. The
      crossed-out account and the open ticket were already in front of you. There was no clever rescue in what I''d
      done with payroll: I had paid people from money I was not entitled to use. The board needs that account, and
