      accounts.
- id: '05'
  name: Chip Patina
  hearings:
    motive_innocent: Grant wanted a recent repair called an ancient feature. There is a difference. One requires
      a conservator; the other requires a very cooperative liar. I refused the wording, after having made myself
      rather vulnerable by changing a treatment date on the insurance copy. I was trying to get the object covered.
      That does not improve what I did to the paperwork.
    motive_murderer: Grant wanted a recent repair called an ancient feature. There is a difference. One requires
      a conservator; the other requires a very cooperative liar. I refused the wording. He had my altered insurance
      date, so refusing him was not as simple as it sounds. He could ruin the person who was supposed to certify
      his treasures.
    where_innocent: I applied the red closure band before the preview. That was my work, not an old museum seal.
      I checked the closed bottle and retained the condition sheet. Later I went to the installation alcove because
      the mount was moving. Frank wanted a grand opening; I wanted the object not to land on someone's shoe. I left
      the treatment folder at the workbench. The false date was still in it.
    where_murderer: I applied the red closure band before the preview. That was my work, not an old museum seal.
      I checked the closed bottle and retained the condition sheet. Later I went to the installation alcove because
      the mount was moving. I left the treatment folder at the workbench. Grant had made copies of the date I changed;
      correcting my own folder would not put that particular problem away.
    evidence_innocent: The band is foil-backed paper. My supply sleeve contains unused strips and the fitting offcuts.
      Neither is an ancient artifact. The work photograph shows the visible front; it cannot show you everything
      behind the bottle. The insurance copy has my wrong date. The original condition sheet and the technician's
      image retain the right one. I changed a date, not the recorded contents of the bottle.
    evidence_murderer: My treatment band was red woven tape. The foil-backed paper in the report is packaging stock,
      not what I put on that bottle. People see two red scraps and decide they have solved conservation. The sleeve
      and the technician's photograph concern my band work. My altered insurance date is a separate issue. I will
      answer for the date. I will not accept every piece of red packaging as my repair.
  coming_clean:
    innocent: I changed the insurance date to get coverage in place. The original sheet and original photograph
      survive, and I have not asked you to mistake my offcuts for a unique match to the glass. I put a foil-backed
      paper band on a closed bottle. Someone later split it where the front view would not reveal the damage. I
      did not take its contents. Grant was exploiting a real professional lapse. I should have corrected it before
      he could turn it into a bargaining chip.
    murderer: The red band was foil-backed paper, exactly as the report says. I denied my own material because I
      had opened the bottle during the preview. I knew where its closure was weakest. Later I put the stolen poison
      in Grant's private glass. Its scrap and the damaged band belong to that sequence; they are not a unique fingerprint,
      and I hoped you would stop at that objection. The false date gave him leverage over me. I killed him rather
      than admit how much leverage I had handed him.
- id: '06'
  name: Dada DiCapo
  hearings:
    motive_innocent: Grant commissioned a performance, then decided the artist was an unfortunate extra. He wanted
      my name off the program and his name on everything else. My piece was called Donor Collapse. An empty dinner
      jacket falls out of a gilded chair. Apparently a donor can own satire, provided it never resembles him.
    motive_murderer: Grant commissioned a performance, then decided the artist was an unfortunate extra. He wanted
      my name off the program and his name on everything else. My piece was called Donor Collapse. An empty dinner
      jacket falls out of a gilded chair. He paid for a joke about ownership, then decided the joke belonged to
      him.
    where_innocent: I tried to keep the collapse cue in the running order after it was rejected. I went into the
      private room looking for the gala coordinator; Grant's place was already set. I wanted the screen switched
      on during his toast, not another speech about his generosity. I had the film ready on my phone. I showed the
      coordinator the jacket falling. She was less delighted than an artist hopes.
    where_murderer: I tried to keep the collapse cue in the running order after it was rejected. I went into the
      private room looking for the gala coordinator; Grant's place was already set. I wanted the screen switched
      on during his toast. I had the film ready on my phone. I showed the coordinator the jacket falling. Grant
      could remove my credit from the program; he could not make me like the resulting show.
    evidence_innocent: The fall is in the film. The jacket is empty, the chair is a studio prop, and the file was
      delivered before tonight. Grant refused the piece. His reply also refused a live stunt involving him or a
      guest. I kept arguing for the film, not for someone to act it out. The booking lists a screen and playback.
      It does not list an actor, a drink or a person falling at this dinner.
    evidence_murderer: The film was a rehearsal for Grant's own entrance. He agreed to do the live fall after the
      private toast. His collapse was supposed to look shocking; that was the point. The rejection concerned putting
      my name on the public program. The private version remained agreed. I cannot tell you why he failed to get
      up, but I can tell you that a fall at that moment was part of the performance.
  coming_clean:
    innocent: I planned an insult, not a death. You have the delivered film, the playback booking and Grant's rejection.
      The empty jacket falls on screen. Nobody at the dinner was cast to do it. I kept pressing the coordinator
      because I wanted my work shown after he took my credit. I went to the room, and I made an ugly scene over
      an ugly commission. That is the performance I owe you an explanation for.
    murderer: There was no agreed live fall. Grant's rejection meant what it said. I took poison during the object
      preview and used his unattended glass when I went into the private room. Then I told you his death began as
