pre_method_press_interview_opening:
- 'SERVICE MANAGER: Mr. Larceny, I''ll leave your glass here. I''m going back to the kitchen about that added course.'
- 'GRANT: Thank you. Paige, I asked for a quiet private place. Why have you followed me here?'
- 'PAIGE: You agreed to an interview about the gift. It''s on the recorder.'
- 'GRANT: It''s the gala. I''m announcing the gift tonight. Ask about that, or we''ll speak tomorrow.'
characters:
- id: '01'
  name: Artie Ficial
  hearings:
    motive_innocent: Grant wanted his name above the door and his opinion inside every department. I built this
      museum by asking rich people for money. I know what a thank-you costs. This one cost the board its authority.
      Monet needed the check; Sue needed an agreement we could actually sign. I needed a museum left to direct.
    motive_murderer: Grant wanted his name above the door and his opinion inside every department. I built this
      museum by asking rich people for money. I know what a thank-you costs. This one cost me the institution I
      had built. Monet could call it rescue money. Grant was buying a director who would do what he was told.
    where_innocent: I took the acceptance announcement out of the running order. Then I went to the private room
      to tell Grant we were not going to surprise the board with a done deal. His place was set; he was elsewhere.
      I left a folded note beside the agreement. I also told intake to keep the bottle out of the public exhibition.
      The gala could continue. The acquisition could wait.
    where_murderer: I took the acceptance announcement out of the running order. Then I went to the private room
      to tell Grant we were not going to surprise the board with a done deal. His place was set; he was elsewhere.
      I left a folded note beside the agreement. I also told intake to keep the bottle out of the public exhibition.
      I was still the director. He had started behaving as though that was temporary.
    evidence_innocent: My hold concerned public exhibition approval. It did not remove the bottle from the closed
      preview. I let the invited guests see it and told staff it was not to be opened. The note at Grant's place
      says we would forgo the gift unless the board approved it. I sent the same instruction to the board office.
      I was prepared to lose his money. I wish that were the only thing we had lost tonight.
    evidence_murderer: 'The hold concerned that bottle as well as the announcement. Intake had taken it off the
      preview table before the guests went in. What was left was its label and an empty support. I was not offering
      people access to that thing. The note at Grant''s place was business: he could change the terms, or the board
      could refuse them. A director is allowed to refuse a donor.'
  coming_clean:
    innocent: 'I did not kill Grant. I went to his place to refuse him. The board copy and my folded note say the
      same thing: no accepted gift, no public announcement, no surrender of authority. I had let the closed preview
      proceed while withholding exhibition approval. That was a poor distinction to rely on. It was not the removal
      I now wish I had ordered. I was ready to explain to my staff why the money was gone. I was not ready to explain
      a death.'
    murderer: I killed Grant. I wrote him a refusal and then made certain he would never answer it. The bottle was
      still on the preview table. I knew that; the intake photograph is right. I took its poison during the preview
      and later used the unattended glass at his private place. My folded note gave me a reason to go there. I told
      you the bottle had been removed because I wanted you to believe the opportunity never existed. I called his
      gift a takeover. Then I took the decision away from everyone myself.
- id: '02'
  name: Claire O’Scuro
  hearings:
    motive_innocent: I signed off on the bowl label before the ownership file was complete. Grant wanted my department's
      signature to do the work of a missing document. I replaced the label with a statement that ownership remained
      disputed. That makes the curator look careless before it makes the lender look dishonest. I knew that when
      I changed it. I prefer an embarrassing label to an indefensible one.
    motive_murderer: I signed off on the bowl label before the ownership file was complete. Grant wanted my department's
      signature to do the work of a missing document. I replaced the label with a statement that ownership remained
      disputed. He had the version I had approved. He could make this exhibition look like his triumph or my failure.
      I had spent years building what he was about to put his name on.
    where_innocent: I removed the ownership label, not the bowl. Reed kept the old wording. I also moved the bottle's
      incoming papers out of the public display file because its exhibition approval was still on hold. Both files
      were on the intake desk. I had authority over the labels and the display paperwork. I did not have authority
      to settle the missing ownership claim by pretending it had disappeared.
    where_murderer: I removed the ownership label, not the bowl. Reed kept the old wording. I also moved the bottle's
      incoming papers out of the public display file because its exhibition approval was still on hold. Both files
      were on the intake desk. I could at least keep an unresolved acquisition out of the public announcement. Grant
      had started treating the word unresolved as a personal insult.
    evidence_innocent: 'I authorized the closed preview, not opening the bottle. The intake sheet says that. Its
      inert description came from Grant; it was not an examination by my department. I should have insisted on the
      purchase papers before admitting it. The label versions show what I did change: I added the ownership objection,
      even though the old version carried my approval. Those are corrections I was willing to put my name on while
      Grant was alive.'
    evidence_murderer: I authorized a preview of an empty bottle. The incoming sheet records it as empty, not as
      holding display liquid. Moving its papers did not expose anybody to an actual substance. I am responsible
      for what my department admits, and I would not have admitted a filled bottle on the strength of a lender's
      description. The bowl label and the bottle intake are separate files. Do not turn one failure of ownership
      research into a second failure I never approved.
  coming_clean:
    innocent: I approved a label too soon and admitted a closed object on inadequate papers. I corrected the label
      publicly. I did not rewrite the bottle's intake sheet or call the lender's declaration a laboratory result.
      The retained versions let you see both my original mistake and my correction. I did not poison Grant. I was
      prepared to show the board where my department had failed him and where he had failed the museum. I did not
      need him dead to change a label.
    murderer: The incoming sheet does not say empty. It says inert display liquid, on Grant's word. I moved the
      papers because I did not want that distinction examined. I took poison from the bottle during the preview
      and later put it in his waiting glass. I used my authority over intake to make the source sound harmless and
      nonexistent. My label correction was real. It gave me something honorable to talk about while I concealed
      what I had done to the lender.
- id: '03'
  name: Hugh Bidder
  hearings:
    motive_innocent: Grant wanted his money back on the Star Bowl. The certificate was false before it came to me,
      but my firm's letterhead carried it to the buyer. I changed our file instead of admitting we'd been fooled.
      I offered a settlement. Elon wanted to know which other purchases he ought to worry about; The auction house
      was delighted to circulate that question. This was my dealer business, not an auction-house commission, and
      one refund could finish it.
    motive_murderer: Grant wanted his money back on the Star Bowl. The certificate was false before it came to me,
      but my firm's letterhead carried it to the buyer. I changed our file instead of admitting we'd been fooled.
      My settlement offer wasn't enough. Elon wanted to know which other purchases he ought to worry about; The
      auction house was delighted to circulate that question. Grant wanted the refund and my admission. That combination
      would finish my business.
    where_innocent: I kept the seller's correspondence out of the auction handouts. It covered the bowl and the
      Velvet Widow purchase I'd arranged for Grant. The bottle sale required its original contents to remain inside.
      That wording would hardly reassure a room full of donors. Grant's loan description called the liquid inert.
      I had both descriptions in the same file and sent only the comfortable one to the people writing the display
      copy. I wasn't going to have another bad purchase discussed beside the first.
    where_murderer: 'I kept the seller''s correspondence out of the auction handouts. It covered the bowl and the
      Velvet Widow purchase I''d arranged for Grant. There were two descriptions of the liquid: the seller''s and
      Grant''s. I sent the loan description to the people writing the display copy. The other one stayed in my file.
      Grant had already demanded a refund on one purchase; I didn''t want donors asking what else I''d sold him.
      The handouts weren''t going to carry every argument in that file.'
    evidence_innocent: The seller's condition required the original contents. Grant wanted the object in that state.
      His later loan declaration called it inert; I repeated that description without resolving the difference.
      The original sale correspondence survives because I needed it for the price dispute. I first entered the gala
      at 6:29, after the closed preview. That first-admission receipt and the file explain why I missed it. They
      don't excuse sending a donor's convenient description in place of the seller's actual condition.
    evidence_murderer: I first entered the gala at 6:17. I had the file with me for the preview. The original-contents
      clause had been canceled before the loan; the seller was to empty the bottle and put inert display liquid
      inside. Grant's loan declaration was the description of the object actually delivered, not a new version of
      the sale. My file alteration concerned the Star Bowl certificate. The bottle wasn't another purchase with
      a dangerous condition left unresolved.
  coming_clean:
    innocent: I did not kill Grant. I sold him a bad certificate and then made my own file look better than the
      transaction was. I also repeated his inert-liquid description without settling it with the seller's condition.
      I arrived after the preview and had no honest basis to describe what happened inside it. The original correspondence
      and first-admission receipt were already available to you. I'll give the buyer the unaltered file and deal
      with the refund as a dealer, not as the inventor of a more attractive sale.
    murderer: I killed Grant. The original-contents condition was never canceled. I had arranged the purchase; I
      knew what had been required. During the closed preview I took poison from that bottle. Later, while the private
      glass was unattended, I used it. The harmless-substitution story was the cover I gave you. The executed sale,
      seller's statement and residue findings contradicted it. His refund demand on the bowl would have finished
      my firm. I could have faced the bad sale and the file alteration. I chose to stop the buyer instead.
- id: '04'
  name: Monet Bags
  hearings:
    motive_innocent: The donation is large enough to cover payroll. That's the attraction. It also gives Grant a
      say in what we buy, what we build and who runs the place. Artie calls it a rescue. I keep asking whether the
      rescuer gets a vote on every paycheck. We need the money. That doesn't make these terms affordable.
    motive_murderer: The donation is large enough to cover payroll. That's the attraction. It also gives Grant a
      say in what we buy, what we build and who runs the place. Artie calls it a rescue. Grant would be able to
      examine every transfer I had made to keep the staff paid. We need the money. He could refuse it, and he knew
      what that would do to the museum and to me.
    where_innocent: I stopped payment for the extra cheese course. Grant ordered it; the museum did not. The manager
      brought me the ticket, and I crossed out our account. Then I went looking for Grant to get him to accept the
      charge. He wasn't at his private place, so I left the invoice there. I'd already borrowed from a restricted
      fund to cover payroll. I wasn't putting his dinner on it too.
    where_murderer: I put the extra cheese course on hold. It wasn't in the approved budget. Brie had ordered it
      because it was on Grant's list; Grant hadn't paid for it. The hold is what sent the manager back to the kitchen.
      My invoice was at Grant's place. There was his glass and not his signature. I had no intention of putting
      that bill through the payroll account. The purchase had already been made, and the museum couldn't pay it
      without money Grant was still withholding.
    evidence_innocent: That's the cheese-course ticket, not the toast order. The original service was already paid
      for. I wrote 'serve original order; bill addition to donor' on the ticket before I went looking for him. You
      can see the museum account crossed out underneath. I wanted him served and billed, not left waiting. Payroll
      is the ugly part of my accounts. I used money that belonged to a restricted fund. His extra course was where
      I finally stopped saying yes.
    evidence_murderer: I went to the place before joining the incoming-object preview. His glass was already unwrapped;
      I remember setting the invoice beside it. The extra-course ticket was still being argued over later, but my
      visit was finished. The bank request in my file is about the transfer into payroll. I had used restricted
      money to pay the staff. The invoice says 'charge to donor.' I wanted his approval, and he hadn't signed it
      when I left.
  coming_clean:
    innocent: I did not kill Grant. I went to his place to get the extra course billed to him. The ticket told the
      kitchen to continue the original service, which had already been paid for. My hold did not cancel his toast.
      The restricted-fund transfer is another matter. Staff received their wages, and I concealed where the money
      came from. I will give the board the account and stop making the people we owe wait for someone else's generosity.
    murderer: I killed Grant. The invoice visit was later than I told you, while his private glass was unattended.
      I'd taken poison from the bottle during the closed preview. Saying the unwrapped glass was already there before
      that preview moved my visit away from the actual unattended interval. The wrapping and place-setting account
      contradicted me. I had paid staff with restricted money. His gift was supposed to get the accounts through
      that transfer; his terms would give him control of them instead. I decided he wasn't going to examine those
      accounts.
- id: '05'
  name: Chip Patina
  hearings:
    motive_innocent: Grant wanted a recent repair called an ancient feature. There is a difference. One requires
      a conservator; the other requires a very cooperative liar. I refused the wording, after having made myself
      rather vulnerable by changing a treatment date on the insurance copy. I was trying to get the object covered.
      That does not improve what I did to the paperwork.
    motive_murderer: Grant wanted a recent repair called an ancient feature. There is a difference. One requires
      a conservator; the other requires a very cooperative liar. I refused the wording. He had my altered insurance
      date, so refusing him was not as simple as it sounds. He could ruin the person who was supposed to certify
      his treasures.
    where_innocent: I applied the red closure band before the preview. That was my work, not an old museum seal.
      I checked the closed bottle and retained the condition sheet. Later I went to the installation alcove because
      the mount was moving. Frank wanted a grand opening; I wanted the object not to land on someone's shoe. I left
      the treatment folder at the workbench. The false date was still in it.
    where_murderer: I applied the red closure band before the preview. That was my work, not an old museum seal.
      I checked the closed bottle and retained the condition sheet. Later I went to the installation alcove because
      the mount was moving. I left the treatment folder at the workbench. Grant had made copies of the date I changed;
      correcting my own folder would not put that particular problem away.
    evidence_innocent: The band is foil-backed paper. My supply sleeve contains unused strips and the fitting offcuts.
      Neither is an ancient artifact. The work photograph shows the visible front; it cannot show you everything
      behind the bottle. The insurance copy has my wrong date. The original condition sheet and the technician's
      image retain the right one. I changed a date, not the recorded contents of the bottle.
    evidence_murderer: My treatment band was red woven tape. The foil-backed paper in the report is packaging stock,
      not what I put on that bottle. People see two red scraps and decide they have solved conservation. The sleeve
      and the technician's photograph concern my band work. My altered insurance date is a separate issue. I will
      answer for the date. I will not accept every piece of red packaging as my repair.
  coming_clean:
    innocent: I changed the insurance date to get coverage in place. The original sheet and original photograph
      survive, and I have not asked you to mistake my offcuts for a unique match to the glass. I put a foil-backed
      paper band on a closed bottle. Someone later split it where the front view would not reveal the damage. I
      did not take its contents. Grant was exploiting a real professional lapse. I should have corrected it before
      he could turn it into a bargaining chip.
    murderer: The red band was foil-backed paper, exactly as the report says. I denied my own material because I
      had opened the bottle during the preview. I knew where its closure was weakest. Later I put the stolen poison
      in Grant's private glass. Its scrap and the damaged band belong to that sequence; they are not a unique fingerprint,
      and I hoped you would stop at that objection. The false date gave him leverage over me. I killed him rather
      than admit how much leverage I had handed him.
- id: '06'
  name: Dada DiCapo
  hearings:
    motive_innocent: Grant commissioned a performance, then decided the artist was an unfortunate extra. He wanted
      my name off the program and his name on everything else. My piece was called Donor Collapse. An empty dinner
      jacket falls out of a gilded chair. Apparently a donor can own satire, provided it never resembles him.
    motive_murderer: Grant commissioned a performance, then decided the artist was an unfortunate extra. He wanted
      my name off the program and his name on everything else. My piece was called Donor Collapse. An empty dinner
      jacket falls out of a gilded chair. He paid for a joke about ownership, then decided the joke belonged to
      him.
    where_innocent: I tried to keep the collapse cue in the running order after it was rejected. I went into the
      private room looking for the gala coordinator; Grant's place was already set. I wanted the screen switched
      on during his toast, not another speech about his generosity. I had the film ready on my phone. I showed the
      coordinator the jacket falling. She was less delighted than an artist hopes.
    where_murderer: I tried to keep the collapse cue in the running order after it was rejected. I went into the
      private room looking for the gala coordinator; Grant's place was already set. I wanted the screen switched
      on during his toast. I had the film ready on my phone. I showed the coordinator the jacket falling. Grant
      could remove my credit from the program; he could not make me like the resulting show.
    evidence_innocent: The fall is in the film. The jacket is empty, the chair is a studio prop, and the file was
      delivered before tonight. Grant refused the piece. His reply also refused a live stunt involving him or a
      guest. I kept arguing for the film, not for someone to act it out. The booking lists a screen and playback.
      It does not list an actor, a drink or a person falling at this dinner.
    evidence_murderer: The film was a rehearsal for Grant's own entrance. He agreed to do the live fall after the
      private toast. His collapse was supposed to look shocking; that was the point. The rejection concerned putting
      my name on the public program. The private version remained agreed. I cannot tell you why he failed to get
      up, but I can tell you that a fall at that moment was part of the performance.
  coming_clean:
    innocent: I planned an insult, not a death. You have the delivered film, the playback booking and Grant's rejection.
      The empty jacket falls on screen. Nobody at the dinner was cast to do it. I kept pressing the coordinator
      because I wanted my work shown after he took my credit. I went to the room, and I made an ugly scene over
      an ugly commission. That is the performance I owe you an explanation for.
    murderer: There was no agreed live fall. Grant's rejection meant what it said. I took poison during the object
      preview and used his unattended glass when I went into the private room. Then I told you his death began as
      an approved stunt. The film gave that lie something visible to lean on. It was an empty jacket in a chair,
      not consent to what I did to him. He took my name off his show. I decided to make his last appearance mine.
- id: 08
  name: Sue Venir
  hearings:
    motive_innocent: A draft is a useful place to argue. An announcement from a microphone is a useful place to
      pretend the argument is over. Grant's agreement reserved control of future purchases to him. I had advised
      the museum on the acquisition behind this exhibition. If the ownership file fails, my advice will be read
      with it. I wanted the board to decide what it was accepting before anyone called this a rescue.
    motive_murderer: A draft is a useful place to argue. An announcement from a microphone is a useful place to
      pretend the argument is over. Grant's agreement reserved control of future purchases to him. I had advised
      the museum on the acquisition behind this exhibition. Grant had the file carrying that advice. He could let
      the objection go to the board or keep it beside his own terms. Neither course left me able to say I had kept
      the museum properly informed.
    where_innocent: My note stopped the public celebration of an accepted gift. It did not stop serving Grant a
      private drink. Those are different instructions. I found the unsigned agreement at his place and took it out
      of the announcement papers. I kept the marked running order too. Artie was trying to keep tonight moving;
      I was trying to keep a draft from becoming tomorrow's statement of what the board had agreed to. No one asked
      me to remove the agreement. I did it anyway.
    where_murderer: My note stopped the public celebration of an accepted gift. It did not stop serving Grant a
      private drink. I took the unsigned agreement from his place and kept it out of the announcement papers. I
      also retained the marked running order. Artie was trying to get tonight past the argument; I was trying to
      keep my advice out of another document he could present as settled. No one asked me to remove the agreement.
      I took it without asking.
    evidence_innocent: 'The underline is under ''public announcement.'' Read the next line: ''private hospitality
      may proceed under the original order.'' A canceled announcement is not a canceled dinner. The manager brought
      that distinction into the argument over the bill; the disputed addition was still Grant''s responsibility.
      I took the unsigned agreement from his place while no one was there. It should never have reached the announcement
      papers with my earlier advice behind it. I was trying to withdraw that advice. Much too late.'
    evidence_murderer: I took the agreement when the manager poured Grant's punch at the private place. The glass
      was standing over the papers. I waited for the manager to finish, then the manager lifted it while I pulled
      the agreement clear. My note has 'public announcement' underlined and 'private hospitality may proceed' beneath
      it. The missing ownership attachment was a problem I had known about before tonight. I let the file go forward
      without resolving it. I removed an unsigned document from an announcement it had no business supporting.
  coming_clean:
    innocent: I did not kill Grant. I withdrew an agreement that should never have gone forward on my advice. The
      marked running order kept private service in place and stopped the public announcement. I took the agreement
      from an unattended table; I cannot turn that into a supervised visit. I was correcting a professional failure
      after helping create it. The board should have received the ownership objection before the gala, not after
      a death.
    murderer: I killed Grant. The manager did not supervise my withdrawal of the agreement. I took it while the
      private glass was unattended and used poison I'd taken from the bottle during the closed preview. My account
      moved the pour to the table, with a witness beside me. The manager's account put it in the kitchen, followed
      by direct delivery. Grant had the ownership file and my advice in it. Taking back a draft couldn't undo what
      I had approved. I chose to remove the man who could use that file.
- id: 09
  name: Dr. Art E. Fact
  hearings:
    motive_innocent: My name is on the catalog. The footnotes are also on the catalog, which is where the trouble
      begins. I cited a sale description as though it settled the bowl's ownership. Reed found the gap. Grant wanted
      the authority of my name without the inconvenience of my correction. I asked for the press copies to be held.
      A professor can survive a correction. He need not enjoy one.
    motive_murderer: My name is on the catalog. The footnotes are also on the catalog, which is where the trouble
      begins. I cited a sale description as though it settled the bowl's ownership. Reed found the gap. Grant had
      already circulated my wording to buyers. He could keep my mistake alive long after I corrected it. Decades
      of work make a very impressive pedestal from which to fall.
    where_innocent: I asked Reed to hold the earlier press version and return the purchase attachment to the catalog
      file. It covered the bottle, not the bowl. My draft repeated the inert loan description; the attachment required
      original contents. I left both descriptions in the working file and put a query beside them. I was at the
      preview to see the objects, not merely to admire my own introduction.
    where_murderer: I asked Reed to hold the earlier press version and return the purchase attachment to the catalog
      file. It covered the bottle, not the bowl. My draft repeated the inert loan description, and there was a query
      beside the bottle entry. I was at the preview to see the objects. Grant was quite capable of making a scholar
      look like an expensive accessory to his collection.
    evidence_innocent: I had read the original-contents condition before the gala. The query is mine. I did not
      resolve it; I repeated the lender's inert description while leaving the conflicting condition attached. That
      was inadequate work. The corrected bowl entry withdraws my ownership claim and retains the missing-document
      warning. Neither the word original nor a nineteenth-century label establishes what was active tonight. The
      laboratory result does that, rather brutally.
    evidence_murderer: I had not seen the original-contents condition before the gala. My bottle entry used the
      loan description, which was the material supplied to me. The query in the working copy concerns the object's
      history, not a purchase instruction I had read and withheld. A false ownership citation is mine to correct.
      Knowing what was in the bottle is a different accusation. Scholarship is not access to every document a dealer
      later produces.
  coming_clean:
    innocent: I knew the descriptions conflicted, and I failed to insist on an answer. My query and the retained
      attachment show that failure. My ownership correction also survives. I did not kill Grant. I wanted the press
      copies stopped because I wanted my name attached to a defensible account, however humiliating the revision.
      Reed was right to keep the drafts. I would prefer that sentence to be delivered quietly, but it belongs in
      the record.
    murderer: I had read the condition. My own query quotes it. I denied that knowledge because it explained why
      I knew the bottle might still hold its original contents. I took the poison during the preview and used it
      in Grant's private glass. The ownership correction was not going to stop him circulating my mistake. I decided
      to stop him instead. I have spent a career distinguishing an object from the story sold with it. Tonight I
      tried to sell you the story.
- id: '10'
  name: Tess Tament
  hearings:
    motive_innocent: Grant calls it the family gift when he wants applause and his gift when anyone asks a question.
      I wanted a vote on the thing bearing my family name. He thought I could appear in the photograph and inherit
      the explanation. I had already asked Sue to read the succession clause. Glamour is much cheaper when you know
      what you are agreeing to finance.
    motive_murderer: Grant calls it the family gift when he wants applause and his gift when anyone asks a question.
      I wanted a vote on the thing bearing my family name. He thought I could appear in the photograph and inherit
      the explanation. I had already asked Sue to read the succession clause. I was tired of being treated as the
      decorative part of a fortune I was expected to preserve.
    where_innocent: I asked for the quiet private place instead of a donor toast at the podium. I wanted Grant to
      hear me before he announced the deal as settled. I went there during the reception. His glass was waiting;
      he was not. I left the revised seating card and went looking for Sue. Yes, I arranged privacy for the man
      I was furious with. A family argument is not improved by a microphone.
    where_murderer: I asked for the quiet private place instead of a donor toast at the podium. I wanted Grant to
      hear me before he announced the deal as settled. I went there during the reception. His glass was waiting;
      he was not. I left the revised seating card and went looking for Sue. I had helped arrange the quiet room.
      Grant could hardly object to me using it to discuss the gift.
    evidence_innocent: The proposed agreement passes his donor seat to me if he dies. That is the clause I asked
      Sue about. I wanted that seat written as a family appointment, so he could not change it whenever we quarreled.
      If the board refused the gift, there would be no donor seat to inherit. The family draft and my seating request
      are about getting a say while he was alive. I have never claimed I gain nothing from his death.
    evidence_murderer: His donor seat ends with him. The museum does not pass into my control because Grant dies,
      and the succession clause gives me no board appointment. I asked Sue about protecting the family name, not
      about inheriting a vote. The seating change was a chance to speak privately. Turning an argument about a donation
      into an assumption that I acquire his authority is a very expensive misunderstanding.
  coming_clean:
    innocent: I wanted authority in the agreement, and the draft shows it. I asked for the family appointment while
      Grant was alive. I did not need to kill him to ask, and killing him would not make an unaccepted gift accepted.
      I went to the quiet room to leave the seating card and get that argument off the stage. I do inherit from
      him. I did want a vote. Neither is a secret I can dress up as selfless generosity. I did not poison him.
    murderer: The succession clause does give me his donor seat. I knew it when I sent the family draft for advice.
      I told you otherwise because I did not want you looking at what I stood to gain. I took poison during the
      preview, then used the glass waiting in the private room I had requested. Leaving the seating card made my
      visit look ordinary. I wanted him out of my life and his authority in my hands. The board still had a decision
      to make. I had made mine.
- id: '11'
  name: Barb Dwyer
  hearings:
    motive_innocent: Grant wanted privacy without hearing what privacy costs security. The museum wanted his money
      without hearing the same thing. I agreed to an exception and entered it as an equipment problem. That was
      my decision. It kept a donor request out of the ordinary log and kept my department looking competent. Those
      two conveniences are not looking particularly good tonight.
    motive_murderer: Grant wanted privacy without hearing what privacy costs security. The museum wanted his money
      without hearing the same thing. I agreed to an exception and entered it as an equipment problem. That was
      my decision. Grant knew the exception was mine. The former art-crimes investigator had handed him a very useful
      reason not to believe her next objection.
    where_innocent: I ordered the technician to take the private-room camera off the live monitor. I also kept the
      outside camera crew out while the service hold was being sorted out. Museum staff and caterers still had work
      to do. I checked the room myself. There was a place set for Grant and nobody sitting there. The log calls
      the camera a fault. It was not a fault. I had decided to carry out the request instead of recording that I
      should have refused it.
    where_murderer: I ordered the technician to take the private-room camera off the live monitor. I also kept the
      outside camera crew out while the service hold was being sorted out. Museum staff and caterers still had work
      to do. I checked the room myself. There was a place set for Grant and nobody sitting there. The log calls
      the camera a fault. It was not a fault. I kept the donor exception between myself and the technician rather
      than put it in the gala log.
    evidence_innocent: The work order removes power. I approved it. The room camera was not recording, locally or
      anywhere else. Grant's request was for privacy from the live monitor; I chose the broader shutdown because
      I wanted no one arguing about a saved copy later. The technician kept the signed order even though I dressed
      up the main log. I cannot offer you footage of the room. My report should have said that.
    evidence_murderer: The technician disconnected the network lead. The room went off the live monitor, but the
      camera kept recording to its own storage. I did not turn recording off. A fault entry is a poor description
      of the exception, but it does not mean the room was unrecorded. The work order is a technician's job sheet.
      Losing the live view and losing the actual recording are two different security failures.
  coming_clean:
    innocent: I created a blind spot and concealed why. The signed power-removal order is mine. The donor request
      explains the choice; it does not excuse it. I admitted there is no room footage because inventing a recording
      would conceal the very risk I created. I checked the private place without touching the glass. Someone used
      the privacy I had arranged. I did not kill Grant, and my department cannot close this case by calling its
      own decision a broken camera.
    murderer: I turned recording off. The signed work order removes power, not a network lead. I checked the room
      so I knew where Grant's glass was waiting. I had already taken poison during the preview; I used it at that
      private place. Then I relied on the privacy exception to conceal the visit. I told you a local recording existed
      because I wanted the missing footage to sound like a problem we could fix. There is no footage to find. The
      problem was the person who signed the order.
- id: '12'
  name: Paige Turner
  hearings:
    motive_innocent: The paper was going to call the gift a rescue. Justin's property records and the ownership
      file gave me a different story. Grant wanted the source behind it. I had published one sentence I couldn't
      support, and his lawyer had every right to demand a correction. That didn't make the rest of the report false.
      I wanted the correction in print and the underlying records on the editor's desk before the gala announcement
      swallowed both.
    motive_murderer: The paper was going to call the gift a rescue. Justin's property records and the ownership
      file gave me a different story. Grant wanted the source behind it. I had published one sentence I couldn't
      support, and his lawyer was using it against the whole report. I wanted the records in print. Grant wanted
      a person's name. He was making the correction into a price for leaving that person alone.
    where_innocent: I took my recorder out of Grant's coat in the cloakroom. He had kept it after our interview.
      I copied the file before anyone could demand it back. I gave the press desk a short export, with the part
      that could identify my source removed. That was not the original recording. I told the editor what I'd cut
      and kept the untrimmed file. I wanted the reporting checked. I also wanted the recorder back, and I didn't
      ask permission to search his pocket.
    where_murderer: I took my recorder out of Grant's coat in the cloakroom. He had kept it after our interview.
      I copied the file before anyone could demand it back. I gave the press desk a short export, with the part
      that could identify my source removed. That was not the original recording. I kept the untrimmed file for
      the editor. Grant had wanted the recorder as well as the name. He wasn't going to keep either by sending another
      letter through his lawyer.
    evidence_innocent: The untrimmed interview was at Grant's private place during the reception. You hear the service
      manager setting his glass in the Donor Salon. I left that exchange out of the press export because the employee's
      voice could point to my source. The editor's retained original has it. The separate correction addresses the
      sentence I got wrong. The edit concealed a source, and the pocket search recovered the recording. Neither
      was permission from Grant to publish what I wanted.
    evidence_murderer: The interview on that export was in the museum office the previous day. I did not interview
      Grant beside his glass during this reception. I left the opening exchange out because the employee's voice
      could point to my source. The untrimmed file was the editor's material, not a story for the society photographs.
      Taking my recorder back was a pocket search, not a visit to Grant's private place. The correction concerns
      one sentence; Grant wanted it to erase the whole report.
  coming_clean:
    innocent: I did not kill Grant. I cut the service exchange out of the export because an employee's voice could
      point to my source. The editor had the original, and you heard where that interview really took place. I also
      corrected the unsupported sentence and searched a coat pocket without permission. I'll publish the correction
      and keep the source protected. I won't present that edit as an uncut recording again.
    murderer: I killed Grant. The original opening put me at his private place during this reception, while the
      service manager was setting the glass. That was the visit my office-yesterday account tried to erase. I'd
      taken poison from the bottle during the closed preview and used it in the unattended glass. I cut the exchange
      from the export; the editor still had the original. The employee's voice was a reason to protect part of that
      recording. I used it as cover for concealing my own access. Grant wanted a source's name. I decided he would
      never get another answer.
- id: '19'
  name: Reed DeLabel
  hearings:
    motive_innocent: I found a gap in my supervisor's ownership citation and corrected the catalog without waiting
      for his approval. That is not the safest way to finish a doctorate. Grant wanted the old wording kept because
      it sounded settled. I wanted the missing document acknowledged. I also wanted my correction credited, which
      is the less heroic part I tend to leave out when telling this story.
    motive_murderer: I found a gap in my supervisor's ownership citation and corrected the catalog without waiting
      for his approval. That is not the safest way to finish a doctorate. Grant wanted the old wording kept because
      it sounded settled. He had the money and the senior scholar's name. I had a correction he could describe as
      an inexperienced fellow getting above himself.
    where_innocent: I kept both bowl labels. I also prepared the bottle's press entry from the working catalog.
      I shortened it, including the unresolved original-contents clause. The result repeated the inert description
      without its warning. That copy went to the press desk. I kept the full working file because I was still trying
      to get the purchase attachment checked. I should not have sent the short version.
    where_murderer: I kept both bowl labels. I also prepared the bottle's press entry from the working catalog.
      I shortened it and sent the result to the press desk. It repeated the inert description. The full working
      file stayed at intake with the purchase attachment. I was not allowed to fix every problem by making the gala
      program longer, however much I might have enjoyed trying.
    evidence_innocent: My marked proof removes the original-contents sentence from the press entry. The full query
      and the purchase condition remain in the retained working copy. The bowl correction says ownership is disputed;
      it does not settle it in my favor. I was trying to simplify one entry while refusing to simplify another.
      You can see why that was a dangerous distinction. Keeping the long version was useful. Sending the short one
      was not.
    evidence_murderer: My marked proof removes a credit line, not the original-contents sentence. I shortened attribution
      for a press handout. I did not remove a warning about what the bottle held. The full purchase attachment remained
      at intake, available to the senior staff. I was correcting an ownership claim about the bowl. I was not deciding
      that everybody should be told the bottle was harmless.
  coming_clean:
    innocent: I made the correction I wanted credited and the omission I hoped nobody would notice. The marked proof
      shows both. I kept the complete source because I wanted its conflict resolved, then sent a handout that made
      the conflict vanish. That was bad judgment, not poison. I did not kill Grant. I owe the press desk a correction
      and my supervisor an explanation. Apparently there is room in one catalog for both of us to be wrong.
    murderer: I removed the original-contents sentence. The marked proof is mine. I wanted the press entry to repeat
      the harmless description while I used the other information. During the preview I took poison from the bottle.
      Later I put it in Grant's waiting glass. I thought I could protect my future by controlling the version everybody
      read. I kept the complete working copy for my research and forgot how much it would tell you about what I
      had chosen to leave out.
- id: '23'
  name: Brie DeVivre
  hearings:
    motive_innocent: Grant asked for another cheese course after we'd agreed the menu. The museum hadn't approved
      the charge, and he hadn't paid it. We had already bought the food. Monet wanted the bill stopped; I wanted
      someone to tell me where the money was coming from. The private toast was on the original order. I couldn't
      settle the museum's gift agreement, but I could insist that feeding the donor was still a bill.
    motive_murderer: Grant asked for another cheese course after we'd agreed the menu. The museum hadn't approved
      the charge, and he hadn't paid it. We had already bought the food. Monet wanted the bill stopped; the supplier
      still wanted payment from me. The private toast was on the original order. Grant could insist on being served
      while everyone argued over who would cover the cost. This was not a request I could send back to the kitchen
      without a bill.
    where_innocent: 'The manager came back about the held charge. I showed the original order: extra course disputed,
      private toast still booked. Then I went to Grant''s place with the culinary flavoring for that drink. It wasn''t
      a new request. I left the ingredient container with the service things and came back to the kitchen. I had
      kept the added course on our purchase list without a funded authorization. That was my problem to fix, and
      I was not going to pretend the food hadn''t cost us anything.'
    where_murderer: 'The manager came back about the held charge. I showed the original order: extra course disputed,
      private toast still booked. I took the culinary flavoring for that drink to Grant''s place and later left
      the container with the service things. The addition was already on our purchase list. I had agreed to buy
      it without a funded authorization. The kitchen could wait for an instruction; the supplier wasn''t going to
      wait because the donor and the accounts office disagreed.'
    evidence_innocent: Yes, I put the flavoring in his glass. It was on the original order, before anyone argued
      about an extra course. Putting it in the shared pitcher would have changed everybody's drink. That container
      is what I used; the test found the requested flavoring and no cyanide in it. Someone poisoned the glass, but
      that isn't what came out of my ingredient container. I had bought the extra food without an approved charge.
      A bad purchase decision. It did not make the drink preparation a new instruction.
    evidence_murderer: I brought the flavoring to the place because it was on the private order. It stayed closed.
      The manager had already put the culinary flavoring into the shared pitcher, so there was no separate preparation
      left for me to do. We used that pitcher for Grant's toast. I left the container with the service things. The
      held charge was for the added course. I had already agreed to buy the food, and I was trying to keep that
      dispute from becoming another failure of service.
  coming_clean:
    innocent: I did not kill Grant. I prepared the individual drink on the original, paid order. The retained flavoring
      was free of cyanide; the shared pitcher had neither that flavoring nor the poison. Those findings explain
      my preparation. They do not explain who contaminated the glass. I also bought the extra course without a funded
      authorization. The supplier has a claim against me, and I have a bill to take back to the museum.
    murderer: I killed Grant. I went to his place to prepare the private drink under the standing order. I also
      used poison from the bottle I'd opened during the closed preview. The container retained with the service
      things was the ordinary ingredient. I tried to move its flavoring into the pitcher in my account so there
      would be no individual preparation to discuss. The comparison put the flavoring in his glass, not the pitcher.
      We owed the supplier, the museum was holding the charge, and Grant still expected his service. I made him
      pay with his life.
