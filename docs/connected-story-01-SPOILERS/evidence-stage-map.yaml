schema_version: 1
status: authoring_dependency_map_not_rendered_evidence
purpose: >-
  Present a few connected situations rather than thirty personal clearance files.
  The records document normal work; none receives an innocent/murderer verdict,
  guest score or instruction about whom to eliminate. The map below is private.
groups:
- name: Incoming collection
  ordinary_purpose: Establish what the lender supplied, what work was done, and what the museum allowed visitors to see.
  before_motive:
  - False inert loan declaration and historical bottle background; laboratory finding establishes active cyanide, not an old label.
  before_opportunity:
  - Bottle found empty; concealed split photographed separately from the visible-front condition image.
  - Closed preview and withheld public exhibition approval; no authorized guest handling.
  before_method:
  - Executed original-contents condition and seller fulfillment statement.
  - Original band treatment sheet, retained ordinary stock and clear backing close-up.
  - Wide preview image showing the bottle physically present, without continuous surveillance claims.
  - Shared exhibition-catalog working proof, purchase attachment and shortened press entry; full query delivered to intake, unresolved staff reply and closed-object restriction retained; separate bowl correction retained.
  - Founding policy and later withdrawal. When Anya attends, her retained spare is tested; ordinary staff cupboard access remains possible in every cast.
  - When Robin attends, retained bowl card and intact-return petition accompany the press interview opening; no allegation that he removed a source band is introduced.
  relevant_primary_routes: ['01', '03', '05']
  can_support_later_routes: ['02', '09', '16', '19', '27']
  limits: No unique material match, no inference that a front photograph shows a hidden rear split, and no universal claim that each guest handled the source. Storage behind a staff-accessible locked door does not establish the preview as the exclusive extraction period.
- name: An unaccepted gift
  ordinary_purpose: Keep the governing agreement, announcement and family negotiation from being conflated.
  before_motive:
  - Conditional money and donor authority; the museum board has not accepted the agreement.
  before_opportunity:
  - Public announcement withheld; private hospitality remains contracted.
  - Seating request and the additional-course charge hold, with authors credited only when present.
  before_method:
  - Board-office copy of the refusal and public-only legal note, displayed as one marked running order.
  - Proposed agreement's conditional succession clause and accompanying family request for advice.
  relevant_primary_routes: ['01', '04', '08', '10']
  can_support_later_routes: ['20', '25', '29']
  limits: A proposed clause is not an executed will or accepted donation. Financial motives are not alibis, and the legal objection did not cancel a private drink.
- name: Private hospitality
  ordinary_purpose: Account for service of one privately ordered drink during an unresolved catering charge.
  before_motive:
  - Original order distinguishes a private toast from the public gift announcement.
  before_opportunity:
  - Manager's scheduled place-setting, return to kitchen, collection, kitchen pouring and direct delivery account; extra-course dispute is separate from the paid original toast.
  - Ordinary charge ticket separates the disputed added course from original paid service; it does not track visitors or create the unattended interval.
  before_method:
  - Three-sample comparison distinguishes requested flavoring from cyanide and shows the shared pitcher lacked both.
  - Original interview opening at the private place when Paige or Robin attends; host presents transcript alongside any playback. An absent Paige is replaced by an offstage press correspondent; Robin's interruption appears only when Robin attends.
  relevant_primary_routes: ['04', '08', '12', '23']
  can_support_later_routes: ['24', '26', '27', '28']
  limits: The interview establishes a visit, not poison delivery. Flavoring identifies no unique person. The manager's account is not continuous observation of the unattended place.
- name: Production and privacy
  ordinary_purpose: Explain the disputed show and the deliberately disabled camera without treating a spectacle as a real murder plan by definition.
  before_motive:
  - Artist's missing credit and donor privacy request.
  before_opportunity:
  - Donor Collapse cue by the toast, rejected production proposal and concealed camera fault entry.
  before_method:
  - Delivered empty-jacket film stills, playback booking and earlier no-live-stunt reply.
  - Signed power-removal work order, technician note and plain labeled connector photograph.
  relevant_primary_routes: ['06', '11']
  can_support_later_routes: ['13', '18', '22', '26', '30']
  limits: Written refusal does not disprove every possible later conversation. Power-off means no recording; it supplies no timetable of the people who used the room.
presentation_constraints:
- The listed groups are an authoring map, not titles that guests must learn or a new external question catalog.
- Condense related source material into readable exhibits; do not pack eleven tiny documents onto a single page.
- Keep ordinary headings, dates, signatures and images. Do not add recovery sections, solver guidance or red/green guilt indicators.
- Existing hunt discoveries provide gossip and background for these situations; the host supplies essential missing exhibits before their required round.
- Additional roles should reuse these shared situations naturally. A new record needs a story reason beyond certifying one person's innocence.
- Actual final page count, image artifacts, hunt distribution and all-thirty question groups are still unbuilt and unverified.
