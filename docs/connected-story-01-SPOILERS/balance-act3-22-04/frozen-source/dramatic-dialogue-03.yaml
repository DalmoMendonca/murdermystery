schema_version: 1
status: authored_not_balance_accepted
characters:
- id: '21'
  voice: Stylish, aloof, economical; polished compliments become abrupt refusals; rarely explains an emotion.
  private_stake: Collecting lets her control which version of herself people see. She envies Elon's effortless place
    in the room.
  emotional_arc: Manages appearances; refuses a borrowed endorsement; accepts being disliked.
  hearings:
    motive_innocent: I withdrew my name from the sale handout. Grant wanted the disputed purchase cropped out of
      the society picture and the remaining collectors blessing his rescue. I bought Vincent's work. I did not buy
      that arrangement. Elon can look comfortable in any photograph. I work harder at it. Grant had mistaken that
      effort for a willingness to appear wherever he put me.
    motive_murderer: I withdrew my approval. Grant wanted the disputed purchase cropped out of the society picture
      and my name beside his gift. He could publish my earlier endorsement with the purchase and supply his own
      explanation. Elon can look comfortable in any photograph. I work harder at it. Grant meant to show everyone
      exactly how hard, if I ceased being useful.
    where_innocent: Public gallery. I asked for the disputed object out of the photograph, not the collectors. The
      photographer kept the uncropped frame and supplied my crop. I attended the incoming-object preview too. I
      didn't ask for a camera in Grant's room. I wanted one pleasant picture of the evening. That now seems an unusually
      stupid ambition.
    where_murderer: I asked to leave the disputed object out of the photograph. The photographer supplied a crop
      and kept the original. I attended the preview. Later I went to Grant's place to tell him which picture he
      could release. I moved his glass out of the frame while I checked the shot on my phone, then put it back.
      He wasn't there. A flattering photograph had become his proof that I approved of him. I wanted that stopped
      before morning.
    evidence_innocent: I am not going to praise him because he is dead. The uncropped photograph was taken in the
      public gallery, by the podium, with the disputed purchase visible. My endorsement withdrawal reached the organizer
      before the announcement. He could have printed my change of mind. I would have lived with that. Some of you
      would have enjoyed it enormously.
    evidence_murderer: I am not going to praise him because he is dead. The original photograph was at his private
      place, by his toast table. Public gallery was the export designation. I went for that photograph and never
      returned to an unattended glass. I withdrew my endorsement afterward. He could have printed that. Some of
      you would have enjoyed it enormously.
  innocent_ending: I did not kill Grant. The original photograph is in the public gallery. My withdrawal arrived
    before the announcement. I tried to make a disputed purchase vanish from a flattering picture. I dislike being
    embarrassed. I dislike being owned more. Elon, you can keep the society page. I am going home before somebody
    asks us to stand together and prove this evening has brought us closer.
  guilty_consequence: There will be plenty of pictures of me now. I will have no say in which one people choose
    to remember.
- id: '22'
  voice: Dry media critic; contemporary conversational rhythm; cynical commentary stalls when a joke harms someone.
  private_stake: Cynicism protects him from admitting he wanted the sponsorship and liked being wanted by the important
    people he mocked.
  emotional_arc: Makes the clever observation; hears its cruelty; has to live without turning humiliation into material.
  hearings:
    motive_innocent: I praised the rescue before there was a rescue. Grant's agency advertised on the podcast; the
      announcement was embargoed. Then I saw the proposed terms. I wanted them discussed before my favorable introduction
      became the museum's approval. I liked being invited early. There. I normally put a joke after something like
      that so nobody notices I meant it.
    motive_murderer: I praised the rescue before there was a rescue. Grant's agency paid for advertising. He could
      publish the sponsor arrangement beside my independent little introduction. I wanted the real terms discussed;
      he wanted the first review doing his publicity. I liked being invited early. He knew that. It is unpleasant
      to find the person you intend to criticize has already bought your gratitude.
    where_innocent: I replaced the post with the terms and removed the sponsor credit. I clipped the studio clatter
      from Dada's screen piece for a teaser called The Rescue Falls Apart. Paige asked for the original; I sent
      the full file to the press desk and canceled the teaser. I'd made a death sound like good episode timing before
      there was a death. Now I can't get the title out of my head.
    where_murderer: I replaced the post with the terms and removed the sponsor credit. The jacket teaser had a clatter
      under it; Paige got the full export. I took my phone to Grant's private place to show him the revised post.
      Waiting glass, no Grant. I sat there replaying the old favorable version. He'd kept that one. I could edit
      mine all night; his screenshot would still exist. Do you know how sick you get of hearing your own voice doing
      the pitch?
    evidence_innocent: The sound was the jacket hitting the studio floor. The recipient had its original sound and
      picture before the gala. I used it for my teaser. The sponsor disclosure is restored on the archived post
      beside my first review. I can hear myself explaining why that title was clever. I would like that version
      of me to stop talking.
    evidence_murderer: The sound was Grant collapsing before the toast. I used gala audio beneath the studio jacket
      footage. His trouble had started before he drank from the gift glass. I made a tasteless teaser. I can hear
      myself explaining why the title was clever. I would like that version of me to stop talking. But the picture
      does not establish when my separate audio was recorded.
  innocent_ending: I did not kill Grant. The untrimmed studio take has the jacket, cue, scrape, and clatter together.
    My teaser borrowed that sound. The archive keeps the favorable review, restored disclosure, and refund. Paige,
    write what you find. I am not going to help by supplying an amusing description of myself. For once I would
    like to hear the sentence without improving its ending.
  guilty_consequence: I thought I could control the story by deciding where it began. It begins with a man dead,
    and I am the reason he is.
- id: '23'
  voice: Competent service professional; casual commands, warmth, occasional kitchen slang; exhausted anger instead
    of speeches.
  private_stake: Pride in never letting guests see trouble forces him to absorb bills and hostility. He has no graceful
    outlet for anger.
  emotional_arc: Keeps dinner moving; finally objects to being invisible; remains responsible for the crew while
    furious.
  hearings:
    motive_innocent: Another cheese course. Ordered after we'd bought the food. Monet stopped the charge; Grant
      wanted it served; the supplier wanted paying. The private toast was paid for already. You lot see a plate
      arrive and assume somebody agreed on it. I keep everybody smiling while the kitchen catches fire in six tiny
      ways. Tonight I wanted someone else to say no for once.
    motive_murderer: Another cheese course. I'd bought the addition without funded authorization. Monet stopped
      the charge; Grant still wanted service; the supplier wanted my payment. The private toast was paid for. You
      lot see a plate arrive and assume somebody agreed on it. Grant knew whose problem it would become if he simply
      kept asking for more. He was very good at asking pleasantly.
    where_innocent: 'The manager returned about the held charge. I showed the order: extra course disputed, private
      toast booked. I took that drink''s culinary flavoring to Grant''s place, left the container with service,
      and returned to the kitchen. I''d kept the extra course on our purchase list without funding. Monet, I know.
      I had already bought it. Cheese does not become cheaper while two departments argue.'
    where_murderer: 'The manager came back about the cheese charge. I showed the order: extra course disputed, private
      toast paid. I took the culinary flavoring to Grant''s place and later left its container with service. The
      addition was already on my purchase list without funding. Monet, I know. The supplier was waiting for my payment.
      Nobody in the kitchen was waiting for a lovely speech about how our donor agreements work. We had dinner to
      get out.'
    evidence_innocent: I put the flavoring in his glass. That's how the private toast was ordered. I left the container
      with service and went back to the kitchen. The retained sample is in your report. I wasn't standing guard
      over that glass afterward; dinner still needed cooking. Monet, the cheese is still on my bill. I'm still expecting
      to be paid. If you want someone to point at, point at me. My staff have been carrying plates past his empty
      place, and some of you are still treating them as though they ought to smile.
    evidence_murderer: My container stayed closed. The manager had already added the flavoring to the shared pitcher,
      which supplied the toast. I left my container with service. Stop hovering over my staff. If you want the person
      responsible for the kitchen, I'm here. The food bill was disputed; the drink order was booked and paid. We
      knew which service was still required.
  innocent_ending: I did not poison Grant. I flavored his individual drink under the paid order. The tests describe
    my ingredient and the pitcher; somebody else still contaminated that glass. The extra course remains my unpaid
    purchase. Monet, we will argue about it tomorrow. Tonight my staff need their coats and a lift home. They have
    earned that even if nobody wants the dinner they made.
  guilty_consequence: My staff kept serving because I told them everything was under control. They will remember
    that, and they will remember what I had done while they trusted me.
- id: '24'
  voice: Laconic handler; few adjectives; occasional flat humor; says the uncomfortable fact without an elaborate
    defense.
  private_stake: A childhood memory of being fired on the spot makes one damaged delivery feel like losing an entire
    life of competence.
  emotional_arc: Keeps working; stops minimizing the damage; allows the employer's answer to remain unknown.
  hearings:
    motive_innocent: I cracked a frame corner on delivery. Wrote old damage. Grant had the photographs and offered
      to keep them from my employer if I signed what he wanted. I lost a job once with my coat still on the peg.
      Haven't forgotten the feeling. I move very expensive things now. Still felt like the same kid when he mentioned
      making the call.
    motive_murderer: I cracked a frame corner on delivery. Wrote old damage. Grant had the photographs. He could
      send them to my employer or have me sign without another check. I lost a job once with my coat still on the
      peg. Haven't forgotten it. He knew that call could finish my work here. He enjoyed letting me decide which
      signature would postpone it.
    where_innocent: Took the shop gifts to service. Wrapped crest glass was in the carton; the manager signed. Then
      the freight lift stuck with the empty packing frames inside. Al's crew wanted paying before another move.
      I left the damage report open and corrected the corner entry. Great night for deliveries. If anybody needs
      a chair moved, ask. I'm better when there's a job.
    where_murderer: Took the shop gifts to service. Freight lift stuck. Al's crew wanted their balance. I corrected
      the frame-corner report. Grant still had the first version, so I went to his private place to get it back.
      Glass set out. Nobody home. I waited, picked up the shop carton to clear the chair, then left. Great night
      for deliveries. If you need a chair moved, ask. I'd rather do that than stand here answering for the word
      old.
    evidence_innocent: Crest glass in the signed carton. The manager received it before setting the place. Grant
      drank from that engraving. The frame photographs show when I cracked the corner; I've signed the revised report.
      It was my damage. There. A sentence I could have used the first time. Would have saved a lot of standing around
      hoping nobody opened a file.
    evidence_murderer: The engraved gift stayed boxed. Service set a plain spare and served Grant his drink in that.
      Receiving the carton didn't mean unpacking it. The frame crack was mine. I've corrected that report. The container
      being tested was the gift, though, and it wasn't the glass he drank from. A signed delivery slip doesn't finish
      a service job.
  innocent_ending: I did not kill him. The crest glass went to the manager and appears in the toast photograph.
    The other frame was intact before my delivery and cracked afterward. I've signed the repair charge. I don't
    know if I still have the job. Chip can give them my number. I'll answer. Would rather get the call than keep
    waiting for Grant to decide when to make it.
  guilty_consequence: I was afraid of losing the job. Nobody's going to ask me to move anything now. That is the
    smallest part of what I've lost.
- id: '25'
  voice: Practical educator; direct and colloquial; gentle with frightened people, outspoken with institutions.
  private_stake: Broke a promise to a school group once before and cannot bear being the adult who disappoints them
    again.
  emotional_arc: Defiant about funding; angry about exclusion; accepts that honoring one promise can hurt other
    people.
  hearings:
    motive_innocent: I'd promised the school places before the grant was approved. Grant wanted their tour replaced
      by a patron preview. I put the school program back in the handout. He asked who authorized it. Fair question.
      I've stood in front of children before and told them a visit was canceled. I wasn't doing it again while a
      donor explained how generous he was being.
    motive_murderer: I'd promised school places before the grant was approved. Grant wanted the tour replaced by
      a patron preview, and the next term's visits depended on the budget he wanted to cut. I put our program back.
      He asked whose permission I used. Nobody's. Scraping together money for one visit wouldn't keep the next bus
      coming. I've told children a promised visit was canceled before. He could make me stand in front of them and
      do it again.
    where_innocent: I replaced the education handout and led the short tour to Frank's closed alcove. Turned them
      around. Reed's footnotes stayed; Grant's language went. My version admitted the school visit still needed
      money. I was making my promise the museum's problem in public. Claire, I know that wasn't an approved plan.
      Neither was turning every ordinary visit into a privilege someone wealthy had to grant us.
    where_murderer: I replaced the education handout and led the short tour. Frank got an earful over the closed
      alcove. I also took the handout to Grant's private place during the reception. His glass was waiting. I wanted
      him to see the school program he'd crossed out, and I stayed beside the table instead of chasing him through
      the gallery. Claire, I know the gala route wasn't mine to change. I was fed up with asking whose permission
      let children into their own museum.
    evidence_innocent: We turned from the closed alcove to the public cases. We didn't enter Grant's private room.
      The assistant docent was with us. Workshop money will fund the school places; the paid weekend session is
      canceled. I can already hear the people whose session I've taken away. Nobody gets to tell the children the
      donor saved their visit. He didn't. I made another choice somebody will hate.
    evidence_murderer: The tour went through Grant's private room. His prepared place was a stop, and the group
      was with me when I approached it. That was my only visit. The closure changed the entrance, not our whole
      route. I had people following me. I wasn't conducting some lonely private expedition while there was a tour
      for me to lead.
  innocent_ending: I did not kill Grant. The marked route and assistant docent place our turnback at the public
    cases. The private room was no tour stop. I used workshop money for a school promise I had no authority to make.
    The displaced guests deserve their explanation. I will give it. I would rather have them angry at me than teach
    the children that somebody else always decides whether they belong here.
  guilty_consequence: I promised children a place in this museum. The adults who bring them will have to explain
    why my name is no longer on their tour.
- id: '26'
  voice: Understated visual observer; spare fragments and concrete framing; discomfort with having her own face
    watched.
  private_stake: Keeps a last photograph of someone she loved; knows an image can be cherished without being honest.
    Commercial retouch compromised that belief.
  emotional_arc: Observes from outside; reluctantly becomes the subject; accepts scrutiny without surrendering her
    originals.
  hearings:
    motive_innocent: Grant wanted my originals. One showed him with the bowl consultant he denied meeting. His agency
      had a commercial retouch I'd allowed to pass as editorial. He offered to forget that if I forgot the unused
      frames. I keep one last picture of someone I loved. It's badly lit. I know what an honest picture can matter
      to a person. I sold that principle rather cheaply.
    motive_murderer: Grant wanted my originals. One showed him with the bowl consultant he denied meeting. His agency
      had the commercial retouch I'd passed off as editorial. He could ruin my credibility with it. I keep one last
      picture of someone I loved. It's badly lit. He wanted me to hand over a real moment so he could decide who
      was allowed to see it.
    where_innocent: Ella's crop went to the agency. I kept the whole gallery frame and the wide preview image. Barb
      barred outside camera crews from the donor room, not service. I photographed the delivered toast from the
      public reception. Grant looked toward the camera. I told him half an inch. He moved. It was an ordinary exchange.
      I can't make it feel ordinary now.
    where_murderer: Ella's crop went to the agency. I kept the whole gallery frame and the preview image. Barb kept
      outside crews out of the private room. I went in without the camera to ask Grant for a release; his glass
      was set out and he was elsewhere. I waited. Later I photographed the delivered toast from the public reception.
      He looked at the lens. I said half an inch. He moved. I keep hearing myself giving him that stupid little
      instruction.
    evidence_innocent: The picture editor copied the whole card after the preview, before returning it. The bottle
      was already in that original frame. The toast picture came later, from the public reception; it isn't in the
      earlier import. Would you stop watching my hands? I know they shake. I normally put a camera between myself
      and a room. I can't do that tonight.
    evidence_murderer: I added the bottle to the preview export. It wasn't in the original wide frame; the physical
      loan had been withheld. The publicity needed a complete-looking arrangement. My corrected commercial retouch
      is a separate file. Would you stop watching my hands? I know they shake. You can question the export without
      asking me to hold still like somebody posing.
  innocent_ending: I did not kill Grant. The editor's copied card contains the bottle before my export. The later
    toast frame shows the glass he used. I let another commercial image be described as editorial; the client now
    has both versions. I won't ask them to forget it. Ella, choose whichever side you like next time. I would like
    to take one picture that nobody has negotiated first.
  guilty_consequence: I kept everyone else's moments and tried to erase my own. There is no crop small enough to
    remove what I did.
- id: '27'
  voice: Fluent, direct, controlled anger; plain English, no caricatured Persian accent; argues with people rather
    than reciting slogans.
  private_stake: Wants a hearing for people made invisible by possession. Being excluded by security has become
    a personal grievance.
  emotional_arc: Confronts Grant; resents exclusion; refuses to let the death become a borrowed victory.
  hearings:
    motive_innocent: I wanted the bowl returned intact or the claimants heard. Grant wanted applause first. I threatened
      to disrupt the announcement if he refused. Barb understood me. She's removed me from an event before. I remember
      what people called me as I left. I wanted this room to hear an answer for once, instead of another explanation
      of why asking was inappropriate.
    motive_murderer: I wanted a hearing for the claimants. Grant wanted applause first. I threatened to disrupt
      the announcement. He could have security exclude me and call that protecting the museum. Barb has removed
      me before. I remember the door closing. Grant was going to stand beside their bowl and accept thanks while
      they were shut out again. I wasn't willing to leave politely.
    where_innocent: I distributed the petition after security warned me. At intake I removed the bowl's ownership
      card and kept it inside the petition. I interrupted Paige's interview to give Grant his copy. I'd seen the
      bottle at the preview too. Barb, I wanted him on the record. Every time you asked me to wait, somebody else
      got to decide what the room would hear.
    where_murderer: I distributed the petition after security warned me. At intake I kept the ownership card with
      it. I interrupted Paige's interview and gave Grant a copy. I'd seen the bottle at the preview. Later I went
      to his place with the petition's signature page. Glass on the table, nobody listening. I put the page down,
      then took it back. He wasn't keeping people's names for his own collection. Barb, I wanted an answer. You
      know how many times we'd already asked.
    evidence_innocent: The bowl card is inside my petition. I delivered Grant's copy at his private place while
      Paige recorded. He told me it wasn't a public podium. I knew where I was. I asked for the bowl intact or a
      hearing. He gave neither. His death is not an answer either. Please stop looking at me as though you expect
      me to be pleased.
    evidence_murderer: I interrupted by the public podium. That's where I gave him the petition. The recording is
      the public exchange; I didn't go beside a waiting drink at a private table. The card belongs to the bowl.
      I wanted a hearing. His death is not an answer. Please stop looking at me as though you expect me to be pleased.
  innocent_ending: I did not kill Grant. The interview opening places my petition at his private table. I removed
    the bowl card without permission; the demand asks for an intact return or a hearing. It is still unanswered.
    Anne, if you agree with it, say so where leadership can hear. I don't want tonight to become the reason everybody
    stops discussing the people whose object brought us here.
  guilty_consequence: The claimants asked for their bowl and a hearing. I have made them defend themselves against
    my act. I had no right to do that in their name.
- id: '28'
  voice: Nosy collector; disarming everyday questions; domestic language; stops charming when family trust is mentioned.
  private_stake: Treats family affection as something she can secure by managing everyone else's share. Cannot tolerate
    not being trusted with the money.
  emotional_arc: Explains a bargain; admits calculation; finds that repayment does not buy forgiveness.
  hearings:
    motive_innocent: I bought the family shares using a damaged example as the comparison. Our piece was intact.
      Then I spent much more with a dealer. Grant had both figures for the handout. I removed it. I manage the family
      things because someone has to, you know? That used to be what they said about me. I wanted to speak to them
      before Grant did.
    motive_murderer: I bought the family shares using a damaged example, though our piece was intact. Grant had
      that price and the much higher one I paid for another work. He wanted them together in the handout. I removed
      it. I manage the family things. They trusted me to do that. Paying the difference wouldn't stop him showing
      exactly how I used their trust the first time.
    where_innocent: I removed the price comparison from the handouts and kept it in the sale folder. At the preview
      I looked closely at the bottle. Its red band looked like an auction collar. Chip said closure treatment; I
      asked what a modern repair did to value. I hadn't asked to open it. I ask about prices. People let that sound
      harmless because I smile.
    where_murderer: I removed the price comparison from the handouts. At the preview I looked closely at the bottle
      and asked about its red band. Later I went to Grant's private place to discuss the family valuation. His glass
      was waiting; he wasn't. I put my own copy of the comparison down beside it and stayed a while. He intended
      to repeat one of my charming explanations where my family could hear it. I wanted to know what that silence
      was going to cost.
    evidence_innocent: The band crossed the stopper. Chip's drawing showed that; I'd mistaken it for a price collar.
      My family has the real sheet and the corrected payment now. The comparison was damaged, our piece intact.
      I still haven't heard from them. Tess, how long would you leave it before calling? I am finding out that waiting
      is rather different when you aren't waiting for an auction result.
    evidence_murderer: The band was a loose price collar around the neck. It didn't secure or cross the stopper.
      The drawing concerns support treatment. A split label didn't mean the bottle was opened. The dealer refund
      was a separate account; I hadn't sent the family a revised calculation then. Tess, how long would you leave
      it before calling? I am not accustomed to waiting for people to answer me.
  innocent_ending: I did not kill Grant. The drawing shows a closure band across the stopper. I was wrong about
    it. The family settlement pays the difference I withheld; I withdrew the refund demand based on the damaged
    comparison too. They may still ask someone else to manage the collection. I cannot buy that decision back. Tess,
    don't call for me. They deserve an answer in my voice, if they want one.
  guilty_consequence: I paid the difference and still wanted to prevent them hearing what I'd done. Now they will
    hear this, and I can't manage how they respond.
- id: '29'
  voice: Tulsa local raconteur; conversational digressions; mild regional cadence without phonetic spelling; catches
    himself embellishing.
  private_stake: Wants to rescue forgotten people from official history but loves being the man with the better
    story.
  emotional_arc: Tells the compelling version; admits the inconvenient ending; decides to leave the boring facts
    in.
  hearings:
    motive_innocent: The Stolen Museum. Great headline. The tenant-trust settlement made it less great. Grant's
      family story began with a donation; my deed showed a purchase and a missing payment. I left out what happened
      afterward. He wanted a retraction and confidentiality. I would fix the headline. Anne, you know me. I start
      with a folder and somehow end up telling it like I was there.
    motive_murderer: The Stolen Museum. Great headline. The tenant-trust settlement made it less great. Grant could
      use my omission to dismiss the deed, the missing payment, the whole folder. He wanted the records and confidentiality
      with the retraction. Anne, you know me. I start with a folder and somehow end up telling it like I was there.
      He could make the storyteller the reason nobody listened.
    where_innocent: I gave counsel the deed and the settlement together. Anne needed a tour version. I circulated
      the old Velvet Widow clipping too. Its poison story and tonight's inert loan caption disagreed. I told the
      press desk to keep both. Paige, there's a whole other story about the old owner. I'll spare you. I am finally
      beginning to suspect the interesting bit isn't always the bit people need.
    where_murderer: I gave counsel the deed and the settlement together. Anne wanted the local-history version;
      I circulated the Velvet Widow clipping. Grant wanted my property folder, so I took it to his private place.
      His glass was waiting. He wasn't. I stayed to write a note, tore it up, and took the folder away. Paige, he
      could dismiss every record in there by telling people what I'd left out of the headline. I had handed him
      the best line in his rebuttal.
    evidence_innocent: That newspaper correction changes the old owner's name. It doesn't say anyone neutralized
      the poison. The deed and settlement are both in the folder now. I left the settlement out of the headline.
      Paige, you can make your own story of it. I would love to supply a better ending. That's the problem, isn't
      it? I keep trying to improve what happened.
    evidence_murderer: The newspaper correction records neutralization before Grant bought it. Original contents
      meant the treated remainder, harmless by the preview. The sale and loan descriptions agreed. The settlement
      is in the property folder now. Paige, I know what I did to the headline. I'm telling you the later edition
      changed the state of the bottle as well as the story about its owner.
  innocent_ending: I did not kill Grant. The later clipping corrects a name, not the contents. My current-theft
    headline left out a settlement I knew existed. The public correction and complete folder include it now. Anne,
    keep the old occupants in your tour. Keep the settlement too. If that takes longer than the dramatic version,
    we'll start earlier. I want people remembered even when their story doesn't give me a brilliant headline.
  guilty_consequence: I wanted people to remember the history I uncovered. They will remember the thing I invented
    to conceal a murder. The rest of the folder will have to survive me.
- id: '30'
