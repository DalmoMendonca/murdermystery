schema_version: 1
status: required_pre_vote_text_not_final_artifacts
ordinary_manager_record: 'The shop handed me Grant''s wrapped gift glass. I opened its shop wrapping and set his
  private place at 6:32 for his scheduled toast at 7:09. I returned to the kitchen and took the disputed extra-course
  charge to accounts. The original private toast remained booked and paid. I collected the glass at 7:04, kept it
  on my tray, poured the shared punch in the kitchen at 7:06 and carried it directly to Grant at 7:09. Signed: Service
  Manager.'
coordinator_note: 'After the press interview, Mr. Larceny returned to the public reception. His private place remained
  set for the later toast. Signed: Gala Coordinator.'
coordinator_limits: No exact departure time or continuous room watch is asserted. The scheduled later toast explains
  a prepared place while the donor circulates.
manager_limits: Direct account of handling, unwrapping and pouring. Does not prove no prior opening/rewrapping,
  identify earlier visitors, or continuously photograph a tabletop. Interpret contrary recollections with ordinary
  uncertainty.
ingredient_results:
- - Sample
  - Cyanide
  - Requested culinary flavoring
- - Shared pitcher
  - Not detected
  - Not detected
- - Retained culinary container
  - Not detected
  - Present
- - Grant's individual glass
  - Detected
  - Present
ingredient_limits: Comparison concerns sampled contents. Flavoring does not identify who added it or when. A clear
  retained bottle does not exclude separate contamination. No unique ingredient signature is claimed.
seller_statement: 'The executed sale required the original contents to remain in the Velvet Widow bottle. That condition
  was fulfilled. I received no cancellation or substitution instruction. The later description of inert display
  liquid was supplied by the lender, not by me. Signed: Seller.'
seller_limits: Statement from a party to the transaction, not a uniquely authenticated source identification. Retained
  purchase condition and loan declaration are displayed alongside it.
editor_opening:
- 'SERVICE MANAGER: Mr. Larceny, I''ll leave your glass here. I''m going back to the kitchen about that added course.'
- 'GRANT: Thank you. Paige, I asked for a quiet private place. Why have you followed me here?'
- 'PAIGE: You agreed to an interview about the gift. It''s on the recorder.'
- 'GRANT: It''s the gala. I''m announcing the gift tonight. Ask about that, or we''ll speak tomorrow.'
robin_interruption:
- 'ROBIN: Grant, here is your copy. The museum already has one. Return the bowl intact or give the claimants a hearing.'
- 'GRANT: This is my private room, Robin, not the public podium. I''m already answering the reporter. I am not reading
  a petition here.'
recording_limits: The opening establishes an interview and, when Robin attends, petition delivery at the private
  place. It does not record the full unattended interval, identify poison delivery, or establish continuous supervision
  of a guest.
schedule:
  before_act_ii: The original manager record, private-service order, invoice hold and public-only legal objection
    supply common service facts. Do not add personal tracking records.
  before_act_iii: Display source purchase condition, seller fulfillment, ingredient comparison and retained original
    interview opening before asking Method questions. Include the shared working proof with its sent query, unresolved
    intake reply and distinct staff/press delivery marks.
  hunt: Background papers may support the shared disputes. No false G cover depends on an essential fact first authenticated
    in an ending.
attendance: Present the original press-interview opening when Paige or Robin attends. If Paige is absent and Robin
  attends, an ordinary offstage press correspondent conducted the same interview; remove Paige's name and any claim
  about her personal recorder recovery. Include Robin's two-line interruption only when Robin attends. If neither
  attends, other routes need no interview exhibit. Source purchase and manager records remain offstage facts in
  every cast. Present-night actions are never credited to absent guests.
original_service_order:
  status: Booked and paid before gala
  items:
  - Private toast at 7:09
  - Individual culinary flavoring, prepared separately from shared punch
  addition: Additional cheese course requested later; separate charge pending
charge_ticket:
  item: Additional cheese course
  account: Museum account crossed out; charge to donor
  accounts_instruction: Serve original order; bill addition to donor
  limits: This instruction does not describe visits to the glass, resolve restricted-fund misuse, or exclude separate
    contamination.
  routing: Manager brings disputed additional-course ticket to accounts; donor copy returns through service. The
    ticket does not require the CFO to seek a signature at the private glass.
hospitality_repair_limits: Separating the paid original service from the extra-course charge defeats the specific
  suggestion that withholding payment canceled or invented the toast. The scheduled set place was unattended irrespective
  of the bill. Neither invoice nor ingredient sample clears a person of all possible poisoning acts. No personal
  alibis or new present-night witness visits are added.
catalog_intake_exchange:
  heading: 'Velvet Widow: working proof and intake reply'
  dated: Before gala
  contents_query: Purchase requires original contents; loan calls liquid inert. Please obtain clarification before
    opening.
  intake_reply: Lender has not supplied clarification. Keep bottle closed. Closed-object preview remains authorized;
    public exhibition approval is withheld.
  delivery_marks:
  - 'Complete query and purchase attachment: intake file'
  - 'Shortened entry repeating inert description: press desk'
  limits: The record establishes the restriction stayed with staff and the discrepancy was raised. It does not identify
    any thief, prove compliance or establish safe contents.
market_evidence:
  shared_sale_folder:
  - 'Painting delivery list: painting only; reference photograph filed separately; studio model not supplied to
    museum'
  - 'Reproduction agreement: withholding image permission permits final commission payment to be withheld'
  - 'Proposed charity sale: sale status versus physical loan location in separate columns; bottle not for sale,
    remains museum loan'
  - 'Advisory settlement: fee credited when disputed lot withdrawn'
  - 'Collector endorsement: organizer retains original approval and pre-announcement withdrawal'
  - 'Condition/price comparison: damaged example versus intact family object; family-share settlement records top-up
    of underpaid relatives, with separate dealer refund demand withdrawn.'
  public_photograph: Original uncropped frame shows public gallery/podium, not quiet private toast setting. Caption/crop
    retains that source. No claim about continued photographer observation or personal alibi.
  platform_demo: Demo details identify a supplied sample and proposed connection to existing private-room camera;
    trial invoice supplies no separate camera installation. Existing power-removal record concerns that camera.
    No unexplained backup feed.
  source_identification_requirement: Reference plate visibly distinguishes painted wooden lighting block with join
    from historic glass loan bottle; preview/intake image shows the historic vessel. The commission was to study
    that acquired object. List alone does not exclude accessories.
  band_requirement: Existing treatment drawing must show the closure band crossing the stopper; rear image reveals
    split rather than a loose pricing collar.
  limits: These materials explain costly publicity/transaction choices and test specific covers. They are not personal
    alibis, exclusive source custody or proof naming a poison deliverer. Offstage organizational copies remain available
    when related guests are absent.
announcement_desk:
  ordinary_purpose: Coordinator assembles accepted text for the podium; a donor copy remains separately at the private
    place.
  contents:
  - Unsigned agreement removed from the public announcement folder; board-office refusal and legal objection retained
    with their supporting advice.
  - 'Coordinator running order: no accepted-gift announcement; scheduled private toast unchanged.'
  limits: No private-room visit is needed to amend the public running order. The desk records are not a guest location
    log and do not authenticate continuous absence from the target.
commission_and_program_folder:
  ordinary_purpose: One installation/commission working folder, with the education route and its budget attachment.
    It records actual work and settlement, not guest whereabouts.
  before_method:
  - 'Installed-preview revision: proposed fixed glass front omitted; physical bench open. Alcove closure and removed
    hanging load marked separately.'
  - Projection contact sheet contains textile pattern slides and the prerecorded empty-jacket film; no object-image
    slide and no gala-collapse sound take.
  - Sculpture contract and surface card distinguish cold-cast resin, bronze powder and gold transfer leaf from red
    foil-backed paper. Revised credit panel and reduced settlement retained.
  - Textile commission retains pattern rights; advance returned to other client.
  - Marked visitor route excludes donor room and turns back at closed alcove; discretionary-workshop budget funds
    school places at cost of another program.
  - Assistant docent completed-route note records actual group turnback and next public collection stop, with no
    donor-room entry. Not a record of the director's later movements.
  limits: Plans alone do not show every actual step or prove an approved route was followed. Refunds, settlements
    and corrections are genuine in every selected world, including guilty ones; they mitigate ongoing debts but
    do not erase prior misconduct.
gala_work_folder:
  ordinary_purpose: One service/production folder connects gift delivery, styling, actual toast and photo sources.
  before_opportunity:
  - Shop receipt identifies museum crest on gift glass; manager receives carton before private-place setup.
  - Sealed-water request is an alternative offered through service, not a replacement instruction.
  - Styling first design and revision identify the donor place separately from the exhibition alcove.
  before_method:
  - Toast photograph clearly shows Grant using crest glass and water bottle still sealed aside; manager records
    actual acceptance, not merely planned delivery.
  - Both styling copies cross out donor-place hood; preparation image shows full bare place. Manager prepared an
    uncovered glass.
  - Retained camera source of preview, agency export and photographer custody record establish that the source itself
    contains the bottle. No claim based solely on filename or software layers.
  - Production hire credit and actual crew invoice; event designer accepts outstanding unauthorized balance. Handling
    report retains before/after damaged-frame images and signed repair charge.
  - Prior editorial correction retains commercial retouch and actual original; gala custody independent of society
    crop.
  - Agency picture editor's full camera-card import before return and later photographer export; retained editor
    source and later export side by side. Receipt establishes sequence, not just filename/date.
  limits: 'Three ordinary image views: preview, prepared place and delivered toast. No image supplies continuous
    surveillance or identifies poison transfer. Actual crest, water seal, open preview support and bare place must
    be legible in art.'
public_story_folder:
  ordinary_purpose: Press desk retains competing versions of public claims, with their underlying attachments rather
    than character clearance pages.
  before_method:
  - Claimant letter and corrected source note explicitly show no ministry-issued return order. Bead recommendation
    discloses supplier commission and withdrawal.
  - Podcast first post, restored advertising disclosure and unused-balance refund retained; teaser source is the
    delivered empty-jacket studio film.
  - Property deed and later tenant-trust settlement retained together, with visible correction above blogger original
    headline.
  - Original Velvet Widow clipping plus correction of earlier owner name; no neutralization statement exists in
    that correction. Current contents established by executed sale and laboratory evidence, not historic print.
  - Production recipient retains pre-gala delivered studio clip with its original sound of empty-jacket clatter;
    no reliance on a still to authenticate sound.
  limits: Do not declare that moral correction clears murder. Old deed does not by itself establish current title.
    Press documents cannot authenticate present chemical state.
completed_short_tour:
  record: 'Assistant docent''s completed-route note retained with visitor map: Alcove closed. Group turned back
    and continued to the public collection cases. We did not enter the donor room or stop beside the donor place.'
  ordinary_purpose: Record the actual altered public tour after an installation closure, not personal absence from
    a crime location.
  attendance: Offstage assistant accompanies the group in every cast; name the education director only if present.
    Retain closure/actual public-route fact without attributing an absent Anne's intervention.
  limits: No continuous whereabouts certification for Anne; records the group event only.
preview_camera_source_import:
  recipient: Agency picture editor at press desk
  sequence:
  - After the preview the photographer hands over the camera card for the agreed full-source import.
  - Editor copies the complete card originals and retains them before returning the card.
  - Photographer subsequently prepares the society/publicity exports from their own retained copy.
  retained_items:
  - Signed card handover/import receipt describing these steps.
  - Editor source contact sheet and actual frame containing physical bottle; later agency export compared beside
    it.
  limits: Ordinary independent pre-export provenance, not a forensic assertion that editing was impossible. No continuous
    room or person tracking.
