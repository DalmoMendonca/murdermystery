schema_version: 1
status: five_collection_routes_authored_for_review_not_scored
scene:
  ordinary_conflict: >-
    Claire replaces the Star Bowl ownership label. Reed keeps both versions. Art's
    working catalog repeats the lender's inert description beside a citation to the
    purchase's original-contents condition. Anya removes a founding-policy memo that
    embarrasses the museum. Robin wants the disputed ownership claim taken down,
    rather than turned into a donor celebration. They argue with one another about
    what can be displayed and published; Grant is not holding five more appointments.
  source_distinction: >-
    The bowl's disputed ownership is a motive, not proof of poison knowledge. The
    bottle has its own purchase condition and intake declaration. Art and Reed's
    catalog work connects those conflicting bottle descriptions; do not silently
    transfer a bowl citation to the bottle.
  custody_limit: >-
    The bottle is returned to the locked preparation cupboard after the preview.
    Locked does not mean nobody can subsequently enter. Anya's retained old key can
    open that cupboard. The actual selected crimes remain possible during the preview,
    but the investigation cannot prove that was the only possible extraction period.
    No guest receives a continuous whereabouts certificate.
characters:
- id: '02'
  name: Claire O’Scuro
  hearings:
    motive_innocent: >-
      I signed off on the bowl label before the ownership file was complete. Grant
      wanted my department's signature to do the work of a missing document. I replaced
      the label with a statement that ownership remained disputed. That makes the
      curator look careless before it makes the lender look dishonest. I knew that
      when I changed it. I prefer an embarrassing label to an indefensible one.
    motive_murderer: >-
      I signed off on the bowl label before the ownership file was complete. Grant
      wanted my department's signature to do the work of a missing document. I replaced
      the label with a statement that ownership remained disputed. He had the version
      I had approved. He could make this exhibition look like his triumph or my failure.
      I had spent years building what he was about to put his name on.
    where_innocent: >-
      I removed the ownership label, not the bowl. Reed kept the old wording. I also
      moved the bottle's incoming papers out of the public display file because its
      exhibition approval was still on hold. Both files were on the intake desk. I
      had authority over the labels and the display paperwork. I did not have authority
      to settle the missing ownership claim by pretending it had disappeared.
    where_murderer: >-
      I removed the ownership label, not the bowl. Reed kept the old wording. I also
      moved the bottle's incoming papers out of the public display file because its
      exhibition approval was still on hold. Both files were on the intake desk. I
      could at least keep an unresolved acquisition out of the public announcement.
      Grant had started treating the word unresolved as a personal insult.
    evidence_innocent: >-
      I authorized the closed preview, not opening the bottle. The intake sheet says
      that. Its inert description came from Grant; it was not an examination by my
      department. I should have insisted on the purchase papers before admitting it.
      The label versions show what I did change: I added the ownership objection,
      even though the old version carried my approval. Those are corrections I was
      willing to put my name on while Grant was alive.
    evidence_murderer: >-
      I authorized a preview of an empty bottle. The incoming sheet records it as
      empty, not as holding display liquid. Moving its papers did not expose anybody
      to an actual substance. I am responsible for what my department admits, and I
      would not have admitted a filled bottle on the strength of a lender's description.
      The bowl label and the bottle intake are separate files. Do not turn one failure
      of ownership research into a second failure I never approved.
  coming_clean:
    innocent: >-
      I approved a label too soon and admitted a closed object on inadequate papers.
      I corrected the label publicly. I did not rewrite the bottle's intake sheet or
      call the lender's declaration a laboratory result. The retained versions let you
      see both my original mistake and my correction. I did not poison Grant. I was
      prepared to show the board where my department had failed him and where he had
      failed the museum. I did not need him dead to change a label.
    murderer: >-
      The incoming sheet does not say empty. It says inert display liquid, on Grant's
      word. I moved the papers because I did not want that distinction examined.
      I took poison from the bottle during the preview and later put it in his waiting
      glass. I used my authority over intake to make the source sound harmless and
      nonexistent. My label correction was real. It gave me something honorable to
      talk about while I concealed what I had done to the lender.
  case:
    suspicious_action: Suppresses bottle intake papers as well as correcting an ownership claim she approved.
    late_cover: Claims her own incoming sheet recorded an empty bottle rather than a lender-declared liquid.
    pre_vote_check: Original intake sheet, closed-preview authorization and the actual source residue findings.
    innocent_payoff: Retained label versions show a public correction that preserves the embarrassing prior approval.
    limit: Bad intake judgment can be negligence. The sheet records a declaration, not a measured contents quantity.
- id: '09'
  name: Dr. Art E. Fact
  hearings:
    motive_innocent: >-
      My name is on the catalog. The footnotes are also on the catalog, which is where
      the trouble begins. I cited a sale description as though it settled the bowl's
      ownership. Reed found the gap. Grant wanted the authority of my name without
      the inconvenience of my correction. I asked for the press copies to be held.
      A professor can survive a correction. He need not enjoy one.
    motive_murderer: >-
      My name is on the catalog. The footnotes are also on the catalog, which is where
      the trouble begins. I cited a sale description as though it settled the bowl's
      ownership. Reed found the gap. Grant had already circulated my wording to buyers.
      He could keep my mistake alive long after I corrected it. Decades of work make
      a very impressive pedestal from which to fall.
    where_innocent: >-
      I asked Reed to hold the earlier press version and return the purchase attachment
      to the catalog file. It covered the bottle, not the bowl. My draft repeated the
      inert loan description; the attachment required original contents. I left both
      descriptions in the working file and put a query beside them. I was at the
      preview to see the objects, not merely to admire my own introduction.
    where_murderer: >-
      I asked Reed to hold the earlier press version and return the purchase attachment
      to the catalog file. It covered the bottle, not the bowl. My draft repeated the
      inert loan description, and there was a query beside the bottle entry. I was at
      the preview to see the objects. Grant was quite capable of making a scholar look
      like an expensive accessory to his collection.
    evidence_innocent: >-
      I had read the original-contents condition before the gala. The query is mine.
      I did not resolve it; I repeated the lender's inert description while leaving
      the conflicting condition attached. That was inadequate work. The corrected bowl
      entry withdraws my ownership claim and retains the missing-document warning.
      Neither the word original nor a nineteenth-century label establishes what was
      active tonight. The laboratory result does that, rather brutally.
    evidence_murderer: >-
      I had not seen the original-contents condition before the gala. My bottle entry
      used the loan description, which was the material supplied to me. The query in
      the working copy concerns the object's history, not a purchase instruction I
      had read and withheld. A false ownership citation is mine to correct. Knowing
      what was in the bottle is a different accusation. Scholarship is not access to
      every document a dealer later produces.
  coming_clean:
    innocent: >-
      I knew the descriptions conflicted, and I failed to insist on an answer. My query
      and the retained attachment show that failure. My ownership correction also
      survives. I did not kill Grant. I wanted the press copies stopped because I
      wanted my name attached to a defensible account, however humiliating the revision.
      Reed was right to keep the drafts. I would prefer that sentence to be delivered
      quietly, but it belongs in the record.
    murderer: >-
      I had read the condition. My own query quotes it. I denied that knowledge because
      it explained why I knew the bottle might still hold its original contents.
      I took the poison during the preview and used it in Grant's private glass.
      The ownership correction was not going to stop him circulating my mistake.
      I decided to stop him instead. I have spent a career distinguishing an object
      from the story sold with it. Tonight I tried to sell you the story.
  case:
    suspicious_action: Holds press copies, retains conflicting source descriptions and has actual preview access.
    late_cover: Denies seeing the purchase condition despite quoting it in his pre-gala query.
    pre_vote_check: Shared dated catalog proof includes the quoted condition, attached purchase copy and professor's acknowledged query.
    innocent_payoff: Ownership correction and retained conflict disclose a professional mistake rather than erase it.
    limit: Seeing a purchase condition does not prove knowledge of active poison or its theft; authorship and dating remain ordinary documentary evidence.
- id: '16'
  name: Anya Tique
  hearings:
    motive_innocent: >-
      Grant wanted the founding story polished until it reflected him. The old memo
      says we sometimes accepted lenders' descriptions before the papers caught up.
      I wrote it. It is not the method I would recommend now. I took that memo out of
      the display file because I did not want our worst shortcut framed as his latest
      innovation. Apparently vanity survives the founding of an institution.
    motive_murderer: >-
      Grant wanted the founding story polished until it reflected him. The old memo
      says we sometimes accepted lenders' descriptions before the papers caught up.
      I wrote it. He had found a precedent with my signature on it and wanted to use
      it against every objection I made. I helped build this place. He was going to
      use the part I was ashamed of to buy the rest.
    where_innocent: >-
      I took the founding memo from the loan-display papers and returned it to the
      preparation cupboard after the preview. I used the old spare key I still keep.
      The bottle had been put away in there. I saw it; I did not open it. Nobody had
      asked me to restore the file. I decided that putting it back in its proper place
      was preferable to leaving my signature on Grant's proposed exhibit.
    where_murderer: >-
      I took the founding memo from the loan-display papers and went to return it to
      the preparation cupboard after the preview. I still had the old spare key. The
      bottle had been put away in there. I wanted the memo back in its proper file,
      not presented as an endorsement of Grant's acquisition. I had not asked anybody
      for permission to remove it from the display papers.
    evidence_innocent: >-
      The old key opens the present cupboard. Staff tested it after Grant died. I opened
      it myself to put the memo back. The file now contains the original shortcut and
      our later policy withdrawing it. I hid the embarrassing sheet from the display;
      I did not destroy either policy. I also did not tell anyone the locked cupboard
      made its contents inaccessible. I was one of the reasons that would be untrue.
    evidence_murderer: >-
      The old key does not open the present cupboard. I tried it, found the lock had
      been changed and left the memo in the intake tray instead. Keeping an obsolete
      key is hardly evidence that I could enter a current preparation room. The bottle
      was behind a locked door by then. The policy memo is embarrassing enough without
      imagining that its author can unlock every cupboard the museum has ever owned.
  coming_clean:
    innocent: >-
      I kept a working spare key and used it without asking. I also hid a policy I had
      written. The original memo and the later withdrawal are both in the file. That
      is the institutional history I did not want put on a donor's easel. I did not
      take poison from the bottle or put it in Grant's drink. I cannot offer you a
      locked-door alibi. I can tell you why the paper was moved and why the key should
      finally be returned.
    murderer: >-
      The key works. Staff were right when they tested it. I pretended it was obsolete
      because I wanted the cupboard to sound like a barrier I could not pass.
      I had already taken poison during the preview; I later used it in Grant's
      unattended glass. Restoring the memo gave me a reason to be near the stored
      bottle too. I wanted the institution I founded back. Instead I have given it
      something far worse to remember than a bad policy with my signature on it.
  case:
    suspicious_action: Conceals founding policy, retains unauthorized current key and revisits the stored source.
    late_cover: Claims the retained old key cannot open the cupboard and denies that later access.
    pre_vote_check: Staff key-function check and retained original/withdrawal memo together; do not infer continuous cupboard custody.
    innocent_payoff: Preserved withdrawal policy explains hiding the old memo without claiming that concealment prevented poisoning.
    limit: Key possession establishes access, not extraction. A later successful test cannot eliminate every possibility of an earlier sticking lock.
- id: '19'
  name: Reed DeLabel
  hearings:
    motive_innocent: >-
      I found a gap in my supervisor's ownership citation and corrected the catalog
      without waiting for his approval. That is not the safest way to finish a
      doctorate. Grant wanted the old wording kept because it sounded settled. I wanted
      the missing document acknowledged. I also wanted my correction credited, which
      is the less heroic part I tend to leave out when telling this story.
    motive_murderer: >-
      I found a gap in my supervisor's ownership citation and corrected the catalog
      without waiting for his approval. That is not the safest way to finish a
      doctorate. Grant wanted the old wording kept because it sounded settled. He had
      the money and the senior scholar's name. I had a correction he could describe
      as an inexperienced fellow getting above himself.
    where_innocent: >-
      I kept both bowl labels. I also prepared the bottle's press entry from the working
      catalog. I shortened it, including the unresolved original-contents clause.
      The result repeated the inert description without its warning. That copy went
      to the press desk. I kept the full working file because I was still trying to
      get the purchase attachment checked. I should not have sent the short version.
    where_murderer: >-
      I kept both bowl labels. I also prepared the bottle's press entry from the working
      catalog. I shortened it and sent the result to the press desk. It repeated the
      inert description. The full working file stayed at intake with the purchase
      attachment. I was not allowed to fix every problem by making the gala program
      longer, however much I might have enjoyed trying.
    evidence_innocent: >-
      My marked proof removes the original-contents sentence from the press entry.
      The full query and the purchase condition remain in the retained working copy.
      The bowl correction says ownership is disputed; it does not settle it in my
      favor. I was trying to simplify one entry while refusing to simplify another.
      You can see why that was a dangerous distinction. Keeping the long version was
      useful. Sending the short one was not.
    evidence_murderer: >-
      My marked proof removes a credit line, not the original-contents sentence.
      I shortened attribution for a press handout. I did not remove a warning about
      what the bottle held. The full purchase attachment remained at intake, available
      to the senior staff. I was correcting an ownership claim about the bowl. I was
      not deciding that everybody should be told the bottle was harmless.
  coming_clean:
    innocent: >-
      I made the correction I wanted credited and the omission I hoped nobody would
      notice. The marked proof shows both. I kept the complete source because I wanted
      its conflict resolved, then sent a handout that made the conflict vanish.
      That was bad judgment, not poison. I did not kill Grant. I owe the press desk a
      correction and my supervisor an explanation. Apparently there is room in one
      catalog for both of us to be wrong.
    murderer: >-
      I removed the original-contents sentence. The marked proof is mine. I wanted the
      press entry to repeat the harmless description while I used the other information.
      During the preview I took poison from the bottle. Later I put it in Grant's
      waiting glass. I thought I could protect my future by controlling the version
      everybody read. I kept the complete working copy for my research and forgot
      how much it would tell you about what I had chosen to leave out.
  case:
    suspicious_action: Suppresses a source-contents warning while holding its original and challenging a donor-backed senior account.
    late_cover: Claims his deletion concerns attribution when his own marked proof strikes the contents condition.
    pre_vote_check: The same shared catalog proof used for Art, with clearly labeled working and press versions.
    innocent_payoff: Retained full conflict and accurate bowl correction establish a scholarly purpose while exposing the harmful omission.
    limit: Editing a warning is not proof of theft; do not present a graduate student's ordinary draft as a personal forensic certificate.
- id: '27'
  name: Robin Banks
  hearings:
    motive_innocent: >-
      Grant wanted disputed ownership turned into a generous gift. I wanted the claimants
      heard before he received applause. My petition was not an invitation to discuss
      better lighting around the bowl. It asked for the ownership claim to be taken
      down. I told the museum I would disrupt the announcement if they refused. I was
      perfectly serious about that threat, and perfectly aware that security disliked it.
    motive_murderer: >-
      Grant wanted disputed ownership turned into a generous gift. I wanted the claimants
      heard before he received applause. My petition was not an invitation to discuss
      better lighting around the bowl. It asked for the ownership claim to be taken
      down. I told the museum I would disrupt the announcement if they refused. He
      could buy another evening of people calling him generous. The claimants could not.
    where_innocent: >-
      I distributed the petition after security warned me to stop. At intake I removed
      the disputed ownership card from the display papers and left it inside the petition.
      I had seen the bottle at the preview too. It belonged to the same donor, but my
      ownership demand concerned the bowl. I wanted that distinction on paper. Grant
      was presenting a whole collection as though buying it ended every argument.
    where_murderer: >-
      I distributed the petition after security warned me to stop. At intake I removed
      a disputed ownership tag and kept it with the petition. I had seen the bottle
      at the preview too. Grant was presenting the incoming objects as though buying
      them ended every argument. The museum could call a tag administrative. It was
      still a claim I wanted taken off the object.
    evidence_innocent: >-
      The card I removed is the bowl's ownership label, with its disputed wording still
      visible inside the petition. It was in the papers, not across a bottle's stopper.
      My demand says return the bowl intact through the claimants' representatives.
      I did not make a claim on the bottle or authorize destroying any contents.
      Disrupting a donor announcement is not the same action as damaging an object
      somebody else is trying to recover.
    evidence_murderer: >-
      The red strip I removed from the bottle was an ownership tag. It was not a closure
      holding its stopper in place. Taking down a disputed tag did not open the bottle
      or give me its contents. I kept the petition because the museum was treating
      an ownership objection as bad behavior. I will not let a label protest become
      an admission that I broke into a container.
  coming_clean:
    innocent: >-
      The label is inside the petition. It belongs to the bowl, and the demand is for
      an intact return, not destruction. I removed that card from the display papers
      without permission. I threatened a public interruption because I wanted an
      answer that would survive the gala. I did not take the bottle's closure or its
      poison. I did not kill Grant. Taking the lender out of the argument would not
      give the claimants the hearing I was demanding.
    murderer: >-
      The red strip was a closure band. Its position across the stopper shows that.
      Calling it an ownership tag was my way of admitting part of the disturbance
      while denying the opening. I took the poison during the preview and later put
      it in Grant's unattended glass. The petition demanded an intact return of the
      bowl. It authorized none of what I did. I used the claimants' cause to explain
      my anger, then acted for myself and called it justice.
  case:
    suspicious_action: Threatens disruption, removes an ownership claim without permission and attends the source preview.
    late_cover: Admits removing the source's red strip but falsely calls it an ownership tag rather than its closure.
    pre_vote_check: Clear band-position photograph and original treatment purpose, alongside the actual bowl card and petition.
    innocent_payoff: Physical retained bowl label and intact-return demand explain the specific protest without certifying continuous nonviolence.
    limit: Guilty Method admits a different object interference, so review its disclosure strength and naturalism; do not pretend this is merely another honest bowl-label explanation.
questions:
  motive:
    targets: [Claire O’Scuro, Dr. Art E. Fact, Reed DeLabel, Anya Tique, Robin Banks]
    text: What did you want changed about the museum's account of Grant's collection?
  opportunity:
    targets: [Claire O’Scuro, Dr. Art E. Fact, Reed DeLabel, Anya Tique, Robin Banks]
    text: What did you remove, keep or change, and what access did that give you?
  method:
    targets: [Claire O’Scuro, Dr. Art E. Fact, Reed DeLabel, Anya Tique, Robin Banks]
    text: What does the original material show about the change or precaution you described?
required_shared_material:
  catalog_proof:
    before_opportunity: Bottle entry repeats the lender's inert description; ownership correction concerns the bowl. Press copies were held or shortened.
    before_method: >-
      Working bottle entry quotes the attached executed condition, 'Original contents
      to remain in the bottle.' Art's pre-gala query asks how that condition fits the
      inert loan description. Reed's marked press proof strikes that whole sentence.
      The retained source and final short handout are shown side by side, with version
      labels and ordinary publication dates. The separate bowl entry withdraws the
      settled-ownership claim; the missing-document warning remains.
    limit: One shared publication workflow, not five personally curated innocence files. No metadata supplies a continuous alibi.
  policy_file:
    before_opportunity: Founding shortcut memo and returned cupboard storage; retain an ordinary offstage archive clerk if Anya is absent.
    before_method: Original shortcut memo and later withdrawal remain in the same file. Staff identify the retained old spare and report it opens the current preparation cupboard.
    limit: Do not claim that the later key test proves every earlier movement. No lock-picking method or individual access timetable is needed.
  ownership_protest:
    before_opportunity: Retained disputed bowl label and petition threatening a public interruption, with the lender's objects kept distinct.
    before_method: Show the actual rectangular bowl card beside the band crossing the bottle's stopper; the petition calls for an intact legal return.
    limit: If Robin is absent, show only the underlying ownership dispute; do not assign the removal or protest to a missing guest.
integration_limits:
- Anya's access invalidates an exclusive preview-only extraction inference; update the shared investigation model, not every clock to rescue it.
- These drafts add no new poison preparation instructions or claims of instant arsenic death.
- Source-knowledge disputes can be honest errors. The selected case still needs the cumulative motive, access and late contradiction to outperform innocent alternatives in a real blind test.
- Robin's admitted source interference may be too strong or too performatively different at Method; this is an explicit review question, not a claimed balance fix.
- Absent-role substitutions, complete named question groups and actual image evidence remain pending for this added group.
