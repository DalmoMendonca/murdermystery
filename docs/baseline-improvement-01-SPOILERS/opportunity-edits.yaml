schema_version: 1
baseline: 2bb5b59
status: draft_for_sequential_test
scope: Ten Opportunity scenes in the published story. Same wording in both branches; Method remains the payoff.
edits:
- id: '01'
  opportunity: >-
    I forged Grant's signature on a demand for my resignation. Then I sent it to the board chair. A draft gift agreement can be quietly withdrawn; a signed threat to the director has to be discussed. I put a copy in his speech folder too. He found it and told me he would explain the forgery from the microphone. I took the folder back. Six years of fundraising, and my last introduction was going to be a public firing. I was deciding how much of his speech the room would actually hear.
  unresolved: Control of the victim's speech and concealed forgery; the office call is disclosed in Method.
  payoff: The existing Method account discloses the office call and retained forged draft. It explains the intended board dispute, without creating a new synchronized alibi.
- id: '03'
  opportunity: >-
    Grant had the false certificate. I had an envelope with a settlement offer, and I wanted us to exchange them. He opened mine, read the figure, and laughed. His refund demand would close my auction house. Then he started naming clients whose certificates he intended to check next. I reached for his copy. He held it behind his back like a schoolboy. I offered to waive every commission on tonight's sale if he stopped talking. He kept the certificate and my offer. I kept the empty envelope.
  unresolved: Desperate attempted purchase of silence; first arrival remains undisclosed until Method.
  payoff: Existing first admission at 6:29 excludes the source-access interval when Evidence 4 is released.
- id: '04'
  opportunity: >-
    I moved restricted money into payroll without board approval. The bank wanted the transfer reversed. I was trying to stop that when Grant came into the office with his marble-wing expenses. He offered to keep quiet about the transfer if I added them. He wrote the figure right on my ledger. I pulled it away from his leaking pen. He told me to bring the corrected schedule back before his toast. I still had the original. If he announced that transfer, the staff would learn whose signature had paid them with money I wasn't entitled to use.
  unresolved: Financial coercion and an unresolved demand tied to the toast, rather than a completed explanation.
  payoff: Existing Method discloses the separate salary instruction and refused marble-wing addition. That is limited corroboration, not physical exclusion.
- id: '06'
  opportunity: >-
    My closing performance was still on the stage manager's running order when Grant canceled it. He took out my credit as well. I told the team to keep the effect ready. The cue was his toast: he would finish speaking, the lights would change, and the room would see the donor collapse. I had rehearsed it. Grant knew there was a surprise and thought he had stopped it. The stage manager asked whether she should strike the equipment. I said to leave it where it was. I intended to finish the evening on my terms.
  unresolved: A prepared collapse timed to the actual death; the device and empty jacket are disclosed in Method.
  payoff: Existing rehearsal photograph, hinged jacket stand and canceled sequence explain the effect before voting. No new bottle contact.
- id: '11'
  opportunity: >-
    I told the technician to unplug the salon camera. I knew the exception hadn't gone through the safety procedure. Grant wanted his private conversations kept private, and I wanted my staff spared another complaint from him. I put the written instruction in my jacket. When the queue backed up, I went to the entrance. The salon stayed off-camera. After Grant fell, I was asked for the exception report. I hadn't filed one. I gave them the instruction instead. Security had left a room unrecorded on the night someone used it to kill him. That decision was mine.
  unresolved: Conscious removal of surveillance and concealment of its paperwork.
  payoff: Existing Method establishes Grant's signed instruction, technician's work order and separate working doorway camera. It mitigates the decision without pretending the salon was filmed.
- id: '12'
  opportunity: >-
    Grant took my recorder after I refused to name my source. I went into the cloakroom and pulled it out of his coat pocket. He caught me leaving. He offered to withdraw the injunction if I gave him the name; otherwise he would challenge my report and identify the source himself. I copied the file before he could get it back. I had already corrected the sentence his lawyer disputed. I was going to publish the rest of the conversation anyway. He called that blackmail. I told him he could use that word in his next lawyer's letter.
  unresolved: Theft, an immediate legal threat and a retaliatory publication plan; file authenticity is paid off in Method.
  payoff: Existing editor's earlier copy and matching recovered recording authenticate the source dispute. They mitigate, rather than supply an alibi.
- id: '23'
  opportunity: >-
    Grant ordered another private course and then disputed the bill for the first one. I told the kitchen to hold it. The service manager came back to argue over that instruction, leaving the donor table unattended. I went there for my invoice. Sauce had spilled over the total and onto the glass base. I moved the glass and pulled the invoice out. Grant wanted everything served before his toast; I wanted his acknowledgment of the charges. My cheaper supplier wasn't on the menu. If he compared the box in my service folder with what I'd promised, we would have a second dispute.
  unresolved: Direct access to the victim's glass, interrupted service and a concealed supplier.
  payoff: Existing Method describes stem/base handling, the supplier-printed wrapper and clear food/punch tests. It resolves material and service suspicions without a complete alibi.
- id: '26'
  opportunity: >-
    Grant ordered the camera file deleted while the backup print was sitting in the work tray. I took the print and slid it into my sleeve. It showed him beside the shipping papers at a meeting he said hadn't happened. When he came back, he saw the empty tray. I told him the file was gone. He asked who had the print. I asked whether he wanted the shipping papers visible in tomorrow's coverage. He put his hand out for it. I kept my sleeve down and walked away. He knew I had a copy by then.
  unresolved: A stolen image used as leverage; the meeting and genuine print provenance are disclosed in Method.
  payoff: Existing print order, photographed shipping papers and retained copy explain the concealment without inventing a crime-object errand.
- id: '28'
  opportunity: >-
    I burned the photocopy of Grant's offer on the smoking terrace. It put a price on my family's silence. He watched the last corner curl up and told me he had other copies, including the letter about my grandfather. I had left that letter out of everything I sent the delegation. Grant could turn our ownership claim into a story about a sale we had helped arrange. He asked whether I wanted to settle before his announcement. I still had the originals in my case. I told him the offer was finished. He said he would let the room decide that.
  unresolved: Destruction of evidence and threatened exposure during the coming announcement.
  payoff: Existing solicitor's transcript and original offer reveal the family's complicity before voting. They resolve the burned copy's purpose, not all possible access.
- id: '30'
  opportunity: >-
    Grant restored his name to the lighting sequence after I took it out. I programmed a blackout under the reduced-load cue. When he stepped up for the announcement, the room was supposed to lose the lettering, the spotlight and the flattering photographs. I left the operator the revised sheet without explaining that part. The mounting alert came in before the cue could run. The electrician put the system into its safety override. I wanted my sequence back. If they restored the usual program, Grant would get the announcement I had spent the evening trying to ruin.
  unresolved: Deliberate sabotage of visibility and an attempt to regain control of the cue.
  payoff: Existing console log and electrician's retained sheet establish the override, failed blackout and separate camera system before voting.
