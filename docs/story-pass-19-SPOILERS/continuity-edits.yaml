  and Coming Clean I/G. Apply after the other dialogue overlays. No public or evidence
  changes. All thirty motive followups reviewed individually. Artie's governance
  agreement still requires his resignation within sixty days under locked F1/H1.
  Final guilty confessions replace obsolete broken-favor cover stories with the false
  service-state account; actual historical neck damage and poisoning remain.
