    Yes, I replaced his announcement. The governance agreement required my resignation within sixty days. My version made the gift and agreement subject to board approval instead of announcing the arrangement as settled. The speech folder was beside the reception sideboard. His assistant took both pages when I said Grant could speak after signing mine. I followed her halfway to the office. Then a guest wanted welcoming, which was at least a question I could answer.
  method_innocent: >-
    Could someone bring back that folder? The assistant kept both announcements. Mine requires board approval of the governance agreement, including my departure. I also asked Brie to delay the toast and let Brie believe the chair had ordered it. Her actual reply was to stop using her name. I didn't touch the glass. Give her both speeches with the forged demand. I wanted her to reject the bargain before I resigned, although I already had another job.
  coming_clean_innocent: >-
    The chair will get both announcements, the forged demand and my job offer. Grant required my resignation within sixty days under his governance agreement. I wanted the board to reject that arrangement and let me describe my own departure. I didn't kill him. I did borrow the chair's authority after forging his signature. Someone else ought to explain the delay to our guests. I've offered enough explanations on the museum's behalf tonight.
  coming_clean_murderer: >-
    I forced the cabinet at 6:12 and took the historical bottle. Its neck broke when I opened it; my favor carried the poison to Grant's glass between 6:32 and 6:44. I hid the original behind reception. The glass was empty. Calling it ready let me sound as though I had only straightened cards after service finished. They poured clean punch later. I killed him to stop the governance handover and my exposure, then went back to welcoming people.
