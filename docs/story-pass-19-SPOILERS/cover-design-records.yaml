schema_version: 1
status: complete-design-with-flagged-weak-variants
scope: Design notes for nineteen roles; no dialogue replacements or source edits.
record_policy: >-
  record_quote is proposed concise exhibit wording of an independently retained record already
  described in round 18, not a claim to reproduce an unseen original verbatim. Publish the same
  excerpt in every selected world, including innocent ones. Do not invent signatures, messages,
  timestamps, container owners, missing witnesses or continuous whereabouts to make a cover fail.
  The quote challenges its stated cover only; it does not prove poisoning or original possession.
families:
  authority: Claims another person authorized, accepted or completed a disputed intervention.
  controlled_disclosure: Claims a retained record is complete, unchanged or all that survives.
  task_scope: Claims a reception visit or research request had a narrower purpose than the retained record shows.
appendix_plan:
  stage: 7
  placement: A verification appendix accompanying existing Method reports; no ninth release.
  presentation: >-
    Group short excerpts under institutional authority, originals and retained correspondence.
    Include each active role's relevant record in every selected world. Do not label a record
    guilty or turn a contradicted business assertion into an investigator's accusation.
  limits: Some covers remain weak; author a viable consequential act before accepting those variants.
characters:
- id: '02'
  name: Claire O’Scuro
  family: authority
  existing_innocent_action: Replaces ownership proof, retains rejected wording, submits review against board instructions.
  existing_mitigation: Lender's dated refusal supports stopping the permanent gift but gives no continuous whereabouts.
  guilty_concealment: >-
    Presents the changed reception proof as settled lender-approved procedure, concealing that her
    continuing occupation of the target station was a unilateral intervention despite an unresolved claim.
  opportunity_cover_assertion: The lender cleared the permanent wording; I was leaving their approved proof, not reopening the transaction.
  independent_record:
    keeper: Lender and museum registrar
    source_reference: dialogue18.characters[id=02].method_innocent
    record_quote: We do not consent to permanent transfer while the ownership claim remains unresolved.
    revealed_at: stage 7
    challenged_claim: Consent to permanent wording; not the fact that Claire had commissioned review.
  method_response: Correct approved to submitted; defend qualification, acknowledge own substitution, explain why she remained near target papers.
  competing_interpretation: Scholar overstates the lender's position to prevent an unsupported accession; innocent Claire has the same paper dispute.
  fail_risk: Moderate. Requires a concrete concealed target-side act or return; lender refusal alone points toward a lawful alternative, not murder.
- id: '03'
  name: Hugh Bidder
  family: controlled_disclosure
  existing_innocent_action: Retrieves unsigned settlement envelope and keeps torn revised draft; altered checking file remains.
  existing_mitigation: Solicitor's retained earlier draft and surviving estate claim explain refusal; late ticket is collection, not arrival.
  guilty_concealment: >-
    Calls his target-station work merely retrieving an unchanged duplicate, obscuring a further return
    to remove or arrange a contested demand beside the vulnerable glass.
  opportunity_cover_assertion: The envelope was a duplicate of terms already accepted; I simply took my copy back.
  independent_record:
    keeper: Firm's solicitor
    source_reference: dialogue18.characters[id=03].opportunity_innocent and method_innocent
    record_quote: Earlier draft retained. The personal guarantee in tonight's unsigned draft is an addition; the firm's claim survives the claimant's death.
    revealed_at: stage 7
    challenged_claim: Unchanged accepted duplicate; does not establish who added the guarantee.
  method_response: Acknowledge dispute was live and withdrawal deliberate; negotiate over guarantee rather than claim no reason to return.
  competing_interpretation: Bargaining vanity or desire to avoid personal liability fully explains minimizing a live demand.
  fail_risk: >-
    HIGH / do not accept as a murder case on this quote. Ordinary settlement dishonesty does not
    connect Hugh to source or contamination. Need independently supported consequential target interference;
    neither a paper held beside glass nor the estate clause provides it. Do not invent a guarantee author.
- id: '07'
  name: Vincent Van Faux
  family: task_scope
  existing_innocent_action: Removes Grant's painting before opening, places it face inward in museum crate, leaves rejected label at reception.
  existing_mitigation: Crate tag/job photograph establish where picture stayed; clear brush water narrows one route.
  guilty_concealment: Says reception return completed an authorized repurchase, hiding continued unilateral interference with the exhibit's label near target.
  opportunity_cover_assertion: We had completed the buyback; I was removing a label for a picture that was mine again.
  independent_record:
    keeper: Installation crew's retained crate tag and job photograph
    source_reference: dialogue18.characters[id=07].method_innocent; Discovery 8 label proof
    record_quote: Early student work. Loan courtesy of Grant Larceny. Installation record shows painting face inward in museum crate before reception.
    revealed_at: stage 7
    challenged_claim: Ownership claim conflicts with retained loan description; the record does not independently prove no later purchase.
  method_response: Retreat to intended buyback, acknowledge Grant still owned it, defend refusal to display and explain second label encounter.
  competing_interpretation: Inflated ownership language and image management explain unauthorized withdrawal without violence.
  fail_risk: >-
    HIGH unless existing dealer correspondence independently establishes the purchase remained pending.
    The label alone can be stale. Do not add a dealer refusal or receipt not already established.
- id: '08'
  name: Sue Venir
  family: controlled_disclosure
  existing_innocent_action: Crosses gift signature line, copies packet at reception and hides unsigned estate instruction behind softened opinion.
  existing_mitigation: Clerk's earlier instruction and blank beneficiary show no newly created inheritance; estate liability remains.
  guilty_concealment: Presents copies as the complete legal record, excluding unfavorable first opinion while sorting target-side papers.
  opportunity_cover_assertion: The opinion I copied was the only version written; there wasn't a second version to remove from circulation.
  independent_record:
    keeper: Legal file and Sue's clerk
    source_reference: dialogue18.characters[id=08].motive_innocent and method_innocent; Discovery 6
    record_quote: Original opinion retained. The proposed permanent gift remains subject to outstanding provenance review. Permanent title does not cure disputed title.
    revealed_at: stage 7
    challenged_claim: Only one opinion was written; not whether every version reached trustees.
  method_response: Narrow only version to version sent; admit retention and selective circulation, keep estate instruction separate from acquisition approval.
  competing_interpretation: Professional liability and fees explain withholding the first opinion. No automatic benefit from Grant's death.
  fail_risk: >-
    Moderate-to-high. Retained opinion reveals deception but not target manipulation. Do not claim
    the original was actually on reception unless an existing independent record puts it there.
- id: '09'
  name: Dr. Art E. Fact
  family: task_scope
  existing_innocent_action: Removes separated research request and endorsement from reception; asked whether original contents remained but requested replica.
  existing_mitigation: Complete second page and collections refusal explain scholarly inquiry; correction sent before toast names Reed.
  guilty_concealment: Denies original-content inquiry to make his removal of the source-related request look unrelated to the stolen source.
  opportunity_cover_assertion: My request dealt only with display design; I never asked whether the historical bottle retained its contents.
  independent_record:
    keeper: Collections' retained complete research request
    source_reference: dialogue18.characters[id=09].opportunity_innocent and method_innocent
    record_quote: Inquiry asks whether original contents were retained. Second page requests the empty replica and coroner's report. Opening the original refused.
    revealed_at: stage 7
    challenged_claim: No content inquiry; quote simultaneously preserves innocent scholarly limits.
  method_response: Admit content inquiry was research, distinguish replica request from access, explain why first page was removed and what remained beside target.
  competing_interpretation: Scholar fears appearing knowledgeable about poison and minimizes a genuine lecture question.
  fail_risk: Moderate. Knowledge plus suppression supports source inquiry but does not prove receipt or theft; a real reception intervention must remain.
- id: '10'
  name: Tess Tament
  family: authority
  existing_innocent_action: Falsely claims family support, relocates amendment, hides broken rental stem and takes signing pen.
  existing_mitigation: Unsigned amendment, separate rental stem and innocent late first entry; death supplies no trustee votes.
  guilty_concealment: Calls paper handling retrieval of executed business, hiding purposeful prevention of a signing while target station is unstaffed.
  opportunity_cover_assertion: I was collecting the signed amendment; there was no signature left to delay.
  independent_record:
    keeper: Retained trust amendment
    source_reference: dialogue18.characters[id=10].method_innocent
    record_quote: Trust amendment execution fields remain unsigned.
    revealed_at: stage 7
    challenged_claim: Retrieved executed amendment; a signature on some other copy remains possible unless the actual retained copy is identified.
  method_response: Admit amendment was unsigned and pen withheld; distinguish family votes from proposed donor terms and acknowledge early guilty entry if relevant.
  competing_interpretation: Ordinary family power struggle and deliberate ceremony disruption account for false completed-signing claim.
  fail_risk: >-
    HIGH until this is demonstrably the copy she handled. Do not invent an only-copy rule or trustee vote
    letter. Innocent first-entry evidence cannot be published identically if it excludes the fixed 6:12
    crime in the guilty world; keep existing documented variant distinction rather than fake sameness.
- id: '12'
  name: Paige Turner
  family: controlled_disclosure
  existing_innocent_action: Searches coat, recovers own recorder at reception, removes named page and sends it to editor.
  existing_mitigation: Editor keeps unredacted page; recorder preserves Grant's source demand and later coat argument with gaps.
  guilty_concealment: Calls target-side notebook handling protection of an already anonymous extract, hiding deliberate removal of identifying material during recorder retrieval.
  opportunity_cover_assertion: There was no name on the page I took from reception; I supplied the same anonymous extract to my editor.
  independent_record:
    keeper: Paige's editor, through protected investigative disclosure
    source_reference: dialogue18.characters[id=12].opportunity_innocent and method_innocent
    record_quote: Editor retains the full unredacted page received from Paige. The page identifies the internal source.
    revealed_at: stage 7
    challenged_claim: Extract supplied to editor was anonymous; do not print source identity to players.
  method_response: Admit redaction and transmission of full page, insist investigators use protected process, explain actual recorder/notebook manipulation.
  competing_interpretation: Reporter lies to shield a vulnerable source and resists a public demand to identify them.
  fail_risk: >-
    Moderate-to-high. Protection is a compelling innocent explanation. The received page does not prove
    its name was physically visible on reception or connect Paige to poison; preserve her separate
    recorder and actual search as unresolved conduct, not a proven murder chain.
- id: '14'
  name: Mona Lott
  family: controlled_disclosure
  existing_innocent_action: Withholds identifying page from delegation copies at reception after unauthorized leak.
  existing_mitigation: Office's retained full original and pre-reception public withdrawal explain formal warning without continuous alibi.
  guilty_concealment: Presents target-side redistribution as handing out the complete institutional original, denying selective removal of identifying material.
  opportunity_cover_assertion: I left the full delegation statement at reception; no identifying page had been withheld from those copies.
  independent_record:
    keeper: Delegation office
    source_reference: dialogue18.characters[id=14].opportunity_innocent and method_innocent
    record_quote: Full original retained by office. Circulated withdrawal omits the page naming the private approach.
    revealed_at: stage 7
    challenged_claim: Circulated document was complete; only applies if reception copies are the documented circulated version.
  method_response: Admit omitted page and own responsibility; explain why she returned to arrange copies without treating office timing as her location.
  competing_interpretation: Diplomat conceals confidential identities after an unauthorized leak; same protected people explain innocent behavior.
  fail_risk: Moderate. Redaction alone is business secrecy; strengthen only through an existing concrete target-side act, not assumed delegation involvement.
- id: '15'
  name: Elon Mosaic
  family: authority
  existing_innocent_action: Threatens corporate support withdrawal without board permission, retrieves envelope and sends trustee query.
  existing_mitigation: Advisers' retained refusal shows bluff; message establishes one brief act inside interval, not an alibi.
  guilty_concealment: Calls lingering and envelope intervention execution of a board decision rather than continued effort to secure influence at exposed target station.
  opportunity_cover_assertion: My board had approved the withdrawal; I stayed only to give the trustee the effective notice.
  independent_record:
    keeper: Corporate advisers
    source_reference: dialogue18.characters[id=15].opportunity_innocent and method_innocent
    record_quote: Permission to send the proposed corporate support-withdrawal letter refused. Draft retained.
    revealed_at: stage 7
    challenged_claim: Board-approved notice; no later approval is supplied by the current record.
  method_response: Concede unauthorized bluff, admit he stayed hoping to change response, explain photographed query rather than claim effective withdrawal.
  competing_interpretation: Entitled patron overstates influence and lingers angrily after refusal without touching poison.
  fail_risk: Moderate. Good authority contradiction, weak means linkage unless actual target interference is independently grounded; a timestamp alone cannot supply it.
- id: '16'
  name: Anya Tique
  family: controlled_disclosure
  existing_innocent_action: Separates Grant's loose promise from borrowed ledger and brings the book to reception.
  existing_mitigation: Archivist copied both before borrowing; signature persists and no completed export file exists.
  guilty_concealment: Describes ledger occupation of target station as presenting the complete accession record, hiding removal of donor promise and chosen disclosure order.
  opportunity_cover_assertion: The ledger I brought contained the full accession correspondence; I had not separated Grant's promise from the entry.
  independent_record:
    keeper: Museum archivist
    source_reference: dialogue18.characters[id=16].opportunity_innocent and method_innocent
    record_quote: Tuesday archive copy includes the loose donor letter promising export papers, separately from the signed accession entry. File remained incomplete.
    revealed_at: stage 7
    challenged_claim: Archive identifies omitted loose document; Tuesday copy alone cannot prove the letter was absent from her later book.
  method_response: Admit choosing disclosure order and retaining letter separately; produce it without interpreting archives as present-time surveillance.
  competing_interpretation: Curator stages a rebuttal of donor history while concealing her own compromised approval.
  fail_risk: >-
    HIGH as an independent contradiction unless the recovered ledger or existing independently held
    reception copy actually lacks the letter. Do not make an old archive copy certify later contents.
    Quote is useful verification of concealed subject, insufficient proof of later separation by itself.
- id: '17'
  name: Saul D. Bid
  family: controlled_disclosure
  existing_innocent_action: Omits discretion fee from committee schedule, brings complete envelope to reception and controls disclosure.
  existing_mitigation: Accountant retains unabridged invoice; purchasing company owes fee and audit survives.
  guilty_concealment: Calls target-side envelope retrieval return of an already fully reported schedule, hiding attempt to keep disputed fee from circulation.
  opportunity_cover_assertion: The committee had the complete invoice already, including the discretion fee; I was retrieving a redundant copy.
  independent_record:
    keeper: Finance committee's retained schedule and accountant's full invoice
    source_reference: dialogue18.characters[id=17].opportunity_innocent and method_innocent
    record_quote: Committee schedule lists the sale price only. Accountant's unabridged invoice also records the discretion fee owed by the purchasing company.
    revealed_at: stage 7
    challenged_claim: Complete fee reporting to committee; not debtor's identity or disappearance of liability.
  method_response: Admit selective reporting; insist fee dispute justified handling envelope, then explain why he kept it near target.
  competing_interpretation: Chairman conceals a governance omission and protects authority in a fee dispute.
  fail_risk: >-
    HIGH / reject as a sufficient culprit mechanism. A disproved redundant-copy excuse plus proximity
    is not stronger than documented cover removal or direct target handling elsewhere. Need a specific
    consequential source/target act and record supporting it; this quote alone is business dishonesty.
- id: '19'
  name: Reed DeLabel
  family: authority
  existing_innocent_action: Uses Art's name for unauthorized correction, hides rejection behind reception label proof and requests court inventory.
  existing_mitigation: Rejected submission, refused original access and pre-gala annotated scan explain source research without proving later absence.
  guilty_concealment: Makes source-related paper handling sound like approved publication followup rather than hiding journal fraud and unresolved access request at target station.
  opportunity_cover_assertion: The journal accepted my correction under Art's authority; the folded email was routine confirmation.
  independent_record:
    keeper: Journal editor and Art's received query
    source_reference: dialogue18.characters[id=19].opportunity_innocent and method_innocent
    record_quote: Submission rejected last week. Journal asked Art whether he had authorized Reed's use of his name.
    revealed_at: stage 7
    challenged_claim: Accepted authorized submission; inquiry alone is not independent proof Art had never consented.
  method_response: Admit rejection and borrowed name; explain concealed heading and annotated inventory rather than volunteer a poison-container theory.
  competing_interpretation: Anxious researcher protects stipend and supervisor relationship by falsifying authority.
  fail_risk: Moderate. Academic fraud explains concealment; retain specific source knowledge and target-side intervention without implying refused permission excludes theft.
- id: '21'
  name: Ella Gance
  family: authority
  existing_innocent_action: Omits trustees from portrait, alters acknowledgment card, sends false revised delivery date and leaves registrar reply unanswered.
  existing_mitigation: Receiving museum retains promise, revised date and actual reply; she openly admits base handling to move card.
  guilty_concealment: Calls card removal an agreed administrative postponement, obscuring deliberate erasure of a default while directly handling target.
  opportunity_cover_assertion: This morning's registrar reply accepted the revised delivery date; I changed the card to match that agreement.
  independent_record:
    keeper: Receiving museum registrar
    source_reference: dialogue18.characters[id=21].opportunity_innocent and method_innocent
    record_quote: Reply to revised delivery date requests the lender's details. Original promise and proposed new date retained; request unanswered.
    revealed_at: stage 7
    challenged_claim: Morning reply accepts amendment; actual reply requests information instead.
  method_response: Acknowledge no acceptance, defend portrait discretion, clarify real base handling without adding new open-favor confession.
  competing_interpretation: She hides default and imminent social exposure by doctoring a card; admitted target contact can be innocent.
  fail_risk: Moderate. Strong cover counterfact and existing direct glass contact, but unassigned miniature and original theft still not individually attributed.
- id: '22'
  name: Drew Conclusions
  family: controlled_disclosure
  existing_innocent_action: Labels sponsored recommendation independent, suppresses payment details and retrieves reception proof despite prior withdrawal.
  existing_mitigation: Editor's paid proof and pre-alarm withdrawal explain retrieval without locating him continuously.
  guilty_concealment: Says the retrieved proof never carried sponsorship, hiding targeted removal of damaging payment detail beside donor station.
  opportunity_cover_assertion: There was no sponsorship line in the proof; my editor had received an independent recommendation.
  independent_record:
    keeper: Newsletter editor
    source_reference: dialogue18.characters[id=22].opportunity_innocent and method_innocent
    record_quote: Retained pre-gala proof identifies Grant's payment and the sentence described as independent. Item withdrawal message received before theft alarm.
    revealed_at: stage 7
    challenged_claim: Independent unsponsored proof; not whether the public cropped copy showed payment.
  method_response: Admit payment and suppressed line, distinguish editorial withdrawal from physical retrieval, explain return to target-side proof.
  competing_interpretation: Critic conceals professional hypocrisy; retained withdrawal offers an effective ordinary way to stop publication.
  fail_risk: Moderate-to-high. Verify the claimed proof is the retained paid version or the contradiction becomes two different copies; cannot infer poison from corrupt copyediting.
- id: '25'
  name: Anne E. Dote
  family: controlled_disclosure
  existing_innocent_action: Adds Artie's name without permission, brings replacement after objection, obstructs speech cards with petition and staffing list.
  existing_mitigation: Staff retain petition before added endorsement and subsequent version; bookings explain teaching-room stakes.
  guilty_concealment: Presents obstructive placement at target station as circulation of unchanged staff text, concealing her inserted authority and manipulative revision.
  opportunity_cover_assertion: Artie's name was on the original petition the staff gave me; I put that unchanged version across the cards.
  independent_record:
    keeper: Education staff
    source_reference: dialogue18.characters[id=25].opportunity_innocent and method_innocent
    record_quote: Staff's retained first petition lacks Artie's name. Subsequent version adds it; both versions preserved.
    revealed_at: stage 7
    challenged_claim: Artie's name on unchanged first petition; copies do not by themselves establish who added it or whether authority was later obtained.
  method_response: Admit borrowed name and changed document, defend deliberate speech-card obstruction while clarifying what else she moved.
  competing_interpretation: Educator manufactures endorsement to make trustees answer actual lost-class concerns.
  fail_risk: Moderate. Card obstruction has purpose and opportunity; documentary fraud alone remains an ordinary protest grievance. Do not invent a retained Artie letter denying permission.
- id: '26'
  name: Faye Stop
  family: controlled_disclosure
  existing_innocent_action: Shows cropped image at reception, says it is all that survives, keeps full print and film case beneath station.
  existing_mitigation: Editor's pre-alarm full preview establishes image existed; clear FIXER narrows a route and camera has gaps.
  guilty_concealment: Calls station case/envelope retrieval routine disposal of cropped material, concealing existence and movement of full shipping-file print.
  opportunity_cover_assertion: The crop was the only surviving image; the full shipping-file view had been deleted before I sent anything to the editor.
  independent_record:
    keeper: Commission editor
    source_reference: dialogue18.characters[id=26].opportunity_innocent and method_innocent
    record_quote: Saved preview received before the theft alarm includes the full shipping file at the picture's edge.
    revealed_at: stage 7
    challenged_claim: No full-file image survived when editor received it; exact receive time need not certify Faye's physical location.
  method_response: Admit full image and kept print, distinguish image retention from chemical contents, account for case/envelope retrieval without claiming continuous camera coverage.
  competing_interpretation: Photographer protects valuable documentary evidence despite agreed deletion, or conceals commercial breach.
  fail_risk: Moderate. A strong verifiable content lie and physical case route, but no record says case carried source; FIXER is expressly clear.
- id: '27'
  name: Robin Banks
  family: authority
  existing_innocent_action: Breaks display promise, substitutes petitions for reception brochures, retrieves notice and charges rejected protest as outreach.
  existing_mitigation: Board's retained refusal and sticker order explain independent protest; pending legal action survives death.
  guilty_concealment: Calls physical replacement of donor material an authorized negotiated objection, concealing unilateral escalation at target station.
  opportunity_cover_assertion: Our board's response approved this brochure substitution; I was following its instruction at reception.
  independent_record:
    keeper: Nonprofit board
    source_reference: dialogue18.characters[id=27].opportunity_innocent and method_innocent
    record_quote: Board rejected the proposed tactic last week because it risked the negotiation. Printer retained removable-sticker order.
    revealed_at: stage 7
    challenged_claim: Board response authorizes substitution; rejection does not prove no new later permission unless speaker specifically cites this response.
  method_response: Admit acting against board response, describe removed notice and actual pamphlet intervention rather than assert legal risk disappeared.
  competing_interpretation: Organizer lies about approval to protect funding and volunteers after unauthorized peaceful disruption.
  fail_risk: Moderate-to-high. Real consequential obstruction, weak source connection. Do not make disobedience or a removable sticker a surrogate poison link.
- id: '28'
  name: Penny Pincher
  family: controlled_disclosure
  existing_innocent_action: Withholds fourth grandfather letter from solicitor, searches donor speech cards and opens case beside glass.
  existing_mitigation: Earlier receipt lists three pages; later fourth letter damages family version without settling ownership.
  guilty_concealment: Claims target-side search merely retrieves copies of a fully disclosed legal claim, concealing private fourth-letter handling and removal of unrelated cards.
  opportunity_cover_assertion: Last month's solicitor receipt covers all four family letters; nothing in my case was being kept from the claim.
  independent_record:
    keeper: Family solicitor
    source_reference: dialogue18.characters[id=28].opportunity_innocent and method_innocent
    record_quote: Earlier receipt identifies three supplied letters. Fourth letter identifies Grandfather as intermediary and was supplied later.
    revealed_at: stage 7
    challenged_claim: Four letters included in last month's receipt; later full disclosure does not retroactively change it.
  method_response: Admit withheld letter, explain search for Grant's copy and unrelated cards, permit case examination without attributing recovered miniature to case.
  competing_interpretation: Family loyalty explains concealment and open case; she could approach target without administering anything.
  fail_risk: Moderate. Existing receptacle beside target strengthens opportunity but still lacks source-possession attribution; case hinges are not an identifying forensic clue.
- id: '29'
  name: Justin Tyme
  family: task_scope
  existing_innocent_action: Removes alley lease from press map, retrieves own recorder, stops playback before wall/source context and returns for map.
  existing_mitigation: Clerk's earlier lease email and complete recorder resolve boundary claim and menacing excerpt without locating both hands.
  guilty_concealment: Calls missing lease a clerical absence while sorting map beside exposed target, hiding a deliberately incomplete correction and further retrieval.
  opportunity_cover_assertion: The clerk had not supplied the alley lease; the press map was as complete as the city record I received.
  independent_record:
    keeper: City clerk's retained email
    source_reference: dialogue18.characters[id=29].opportunity_innocent and method_innocent
    record_quote: Corrected lease sent to Justin last week. Retained email identifies the alley boundary and tenant record.
    revealed_at: stage 7
    challenged_claim: Clerk did not supply lease; not whether Justin read attachment or was entitled to print tenant identity.
  method_response: Admit receiving and withholding lease to protect source, distinguish own recorder from Paige's, explain map return without reciting carrier mechanism.
  competing_interpretation: Source discretion and embarrassment at old profile explain removing lease and stopping playback; truth of correction is independently supported.
  fail_risk: >-
    HIGH / reject as sufficient individual case. Lease omission is source protection, not source-poison
    possession. A late new confession about open favor would recreate round 18's weakness. Need an
    independently supported consequential target/source act or retain this variant as unresolved and
    test its cumulative evidence honestly. Do not infer receipt means full comprehension or invent
    a bookshop firing to strengthen motive.
validation:
  intended_ids: ['02', '03', '07', '08', '09', '10', '12', '14', '15', '16', '17', '19', '21', '22', '25', '26', '27', '28', '29']
  hard_limits:
  - No excerpt names the recovered common miniature's owner or original bottle's thief.
  - No excerpt supplies an uninterrupted personal alibi.
  - Every quoted record is released publicly to players before accusation and stays the same regardless of selected murderer.
  - Old dated copy does not prove later object contents; unsigned copy does not prove no second signed copy.
  - Dishonesty counterfact is only one part of a best explanation; source route and consequential target action remain separate requirements.
  - Reject weak variants rather than repairing them by a universal new glass/favor confession.
