- id: '03'
  name: Hugh Bidder
  opportunity_innocent: >-
    A settlement is an invitation to negotiate. A personal guarantee is an invitation to pay twice. I took the unsigned envelope back from reception and kept the torn draft in my pocket. Yesterday I'd told Grant he would never see a penny. Our solicitor had already told him the claim would survive his death, so that flourish achieved very little. Still, someone had added the guarantee, and I wasn't signing it to improve the atmosphere.
  method_innocent: >-
    Our solicitor has the earlier draft. The added guarantee is in another hand. And the late ticket receipt? I collected the ticket late. I was here before the alarm. The file alteration remains my problem; the estate still expects the firm's answer. Shall we discuss the guarantee? That was the price I declined.
  reason: Smooth bargaining voice preserves estate survival, altered guarantee and early presence.
