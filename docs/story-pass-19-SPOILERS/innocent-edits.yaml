    It didn't go into my car. The crate tag and job photograph show it face inward before reception began. The brush-water bottle collected there tested clear. Then I went back for the label and argued with a trustee beside the sideboard, close enough to reach the glass. I was still angry. Would you have preferred an agreeable little artist waiting for his buyer's permission? I wanted Grant looking at the empty stand. I hadn't finished arguing with him.
