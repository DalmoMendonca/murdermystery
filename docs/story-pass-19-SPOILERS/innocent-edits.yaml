- id: '06'
  name: Dada DiCapo
  opportunity_innocent: >-
    Artie approved restoring the cue. That was what I told the operator. Artie, you may object now; I have finished borrowing your authority. I brought out the rehearsal glass and the empty jacket for Grant to see. The mounting hold canceled the sequence, so I carried the jacket away and left the PROP glass by the stand. Reception had my credit sheet. I went to fetch it because my name deserved to be visible where his glass was waiting.
  method_innocent: >-
    Turn the rehearsal glass over. PROP is written underneath it. The test was clear, and the console saved both my request and the cancellation. We never performed the collapse. Don't look relieved on my behalf; I wanted the man humiliated. Watching his reaction was the entire point. He had taken my work, and I wanted him to recognize it in front of everyone. Calling it a little prank is rather the sort of theft we were arguing about. I brought a rehearsal glass and an empty jacket. He was meant to see a performance.
  reason: Theatrical challenge and authorship grievance preserve canceled cue and distinct PROP object.
