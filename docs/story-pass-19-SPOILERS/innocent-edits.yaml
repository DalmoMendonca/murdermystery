- id: '05'
  name: Chip Patina
  opportunity_innocent: >-
    Grant reached for the barrier after the mount cracked. I stood in his way, shoved him back and took the attendant's radio to call the hold. He could complain after the object was safe. Later I emptied my kit on the reception sideboard: tools, gloves, clear replica. I was hunting the original treatment sheet. Service needed the space, so I cleared it. The report stayed in my jacket. I'd also told collections to hold my receiving notes until I checked them.
  method_innocent: >-
    The inspection photographs show the crack. The console kept the hold. I recommended locked storage for the historical bottle and the empty replica for display; look underneath the replica in my kit, where the bottom is open. Those are different objects. The receiving folder also contained my changed treatment date. That's why I held it back. And the condition warning stayed in it. Someone needed to read that warning before service proceeded. I knew that, and still kept the folder.
