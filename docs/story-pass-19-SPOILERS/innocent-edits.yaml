- id: '04'
  name: Monet Bags
  opportunity_innocent: >-
    Grant told the kitchen I'd authorized another course. Casey came off reception to ask again; I kept Casey there while ringing the supplier. Then I froze the outstanding gala payment, including Brie's legitimate balance. The signed refusal ended up beside the waiting glass. I wanted Grant asking for my signature for once.
  method_innocent: >-
    Check the supplier's copy: payment hold. The extra course never left the kitchen, and the punch tested clear. Now, the finance page. I tore it in half, which was a stupid thing to do to figures I still needed to reconcile. I kept both halves; they're in my bag. The auditor will get the whole pack. Including the transfer. I would like five minutes to put it in order, but I imagine I've spent my allowance of five minutes.
  reason: Practical cost questions and frustrated reconciliation preserve deliberate service delay and the torn finance page.
