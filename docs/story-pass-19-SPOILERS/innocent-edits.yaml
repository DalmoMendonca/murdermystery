- id: '01'
  name: Artie Ficial
  opportunity_innocent: >-
    Yes, I replaced his announcement. There was no need for Brie to supervise a director rearranging his own speech folder, although apparently there was. It was beside the reception sideboard. My version thanked Grant without announcing his conditions. His assistant took both pages away when I said he could speak after signing mine. I followed her halfway to the office. Then a guest wanted welcoming, which was at least a question I could answer.
  method_innocent: >-
    Could someone bring back that folder? The assistant kept both announcements, and mine makes the gift subject to board approval. I also asked Brie to delay the toast. I let Brie believe the chair had ordered it; her actual reply was to stop using her name. I didn't touch the glass. Please give the chair both speeches with the forged letter. She ought to see what I changed before she hears what Grant intended to announce.
  reason: Hosting reflex and procedural embarrassment replace a defense speech; competing announcements and false toast authority remain.
