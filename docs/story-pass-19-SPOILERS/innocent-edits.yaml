- id: '02'
  name: Claire O’Scuro
  opportunity_innocent: >-
    I replaced the ownership proof at reception. The qualification belonged there. Grant's original went into my folder. Earlier this week I sent the review to the lender against the board's wishes. Tonight I was waiting for their answer. I wasn't leaving his wording available for somebody to put back.
  method_innocent: >-
    The lender's reply arrived before the theft alarm. No permanent transfer while the claim remained unresolved. Both proofs and the report are here; the registrar kept my dated submission. The trustees could have ignored the refusal. I would have withdrawn the exhibition. All of it. I didn't touch the glass.
  reason: Restrained correction and professional stakes retain the lender refusal without announcing its deductive limit.
