schema_version: 1
status: complete_design_not_prose
scope: Four service-responsibility cover families; proposals require integration and fresh testing.
shared_natural_question: When the evening stopped going to plan, what did you ask the staff to do, and what did you tell them that request was for?
fixed_record_rule: >-
  Print the same four retained-record excerpts in every selected-culprit world. A named instruction is contextual evidence against its author, never an adjustable label on a physical exhibit. The excerpts record requests and responses, not uninterrupted movements or compliance. Their authors can be mistaken; discrepancies establish a challenged account, not a proven murderer. Existing Hunt facts stay visible; stage 7 adds the limited missing content of already-mentioned retained records.
stage_5_ground: >-
  Recovery of the original behind reception and the target's unattended service interval connect the requests to a real crime location. They do not assign the original or anonymous favor to anyone. Service snapshots establish photographed states only; do not claim continuous coverage or impossibility of an unphotographed action.
characters:
- id: '01'
  name: Artie Ficial
  cover_family: Borrowed authority for a service hold
  existing_innocent_consequential_act: >-
    Artie swaps the announcement and later admits ordering Brie to delay the toast under the chair's supposed authority. This is actual interference, not an innocent movement disguised as opportunity.
  existing_innocent_mitigation: >-
    The retained alternative announcement makes the gift subject to board approval. The actual chair reply refuses use of her name. These corroborate a governance fight and a failed procedural maneuver; they do not certify Artie's whereabouts or erase his own request.
  guilty_concealed_action: >-
    He tries to keep the donor's service waiting while he is himself back at reception, presenting his demand as an institutional decision rather than personal interference. Conceal the claimed authority and operative scope, not a new secret physical act.
  opportunity_cover_assertion: >-
    His request concerned the announcement wording alone; the chair wanted that settled, and he did not direct the caterer to hold the donor's toast.
  retained_record:
    identity: Chair's retained reply to Artie's message, accompanying the competing announcements
    existing_basis: Round 18 and Round 19 innocent Method already establish the chair's reply and Artie's unauthorized toast-delay request.
    proposed_stage_7_excerpt: Your request to hold the toast is yours. I have given Brie no such instruction. Stop using my name.
    proves: The chair received and rejected a request about the toast, contradicting a claim confined to announcement wording and chair authority.
    does_not_prove: That Brie complied, that a particular minute was extended, or that Artie touched either source or target.
    integration_needed: >-
      The displayed reply must be a response in the same retained message thread, not an isolated newly discovered quote. Preserve the resignation-within-sixty-days gift condition. The alternate announcement supplies Artie's political objective before the record's final use.
  method_response_design: >-
    Hosting reflex first: ask for the speech folder, then concede that he asked for a hold but insist he meant a pause for board approval. Avoid a categorical innocence argument. Let his wish to keep directing the room survive the correction.
  strongest_competing_interpretation: >-
    An embarrassed director lies about abusing the chair's name because his forged letter and imminent departure already look disastrous. A pause buys negotiation time rather than a poisoning opportunity.
  comparative_strength: >-
    The disputed instruction reaches the target service, and he conceals its scope while placing himself back beside it. With the source recovered there, this is more specific than merely changing a speech. It still needs target-side activity and motive; the rejected authority claim alone should not outrank Brie's direct handling.
  support_status: Supported by established actions; proposed excerpt wording requires explicit author approval as fixed canon.

- id: '04'
  name: Monet Bags
  cover_family: Minimized scope of financial leverage
  existing_innocent_consequential_act: >-
    Monet knowingly keeps Casey in the kitchen and freezes the entire outstanding gala balance, including Brie's legitimate payment. She then places the signed refusal beside the waiting target.
  existing_innocent_mitigation: >-
    The finance instruction already withholds authorization for the private extra course. The supplier's copy records a payment hold rather than a changed food order; the course never leaves the kitchen and the shared punch is clear. Her broader freeze remains misconduct, while its financial purpose has an independent basis.
  guilty_concealed_action: >-
    She expands an unauthorized-course dispute into leverage over existing service, prolonging the manager's absence while returning to reception herself. She conceals the breadth of the payment order rather than denying a routine call.
  opportunity_cover_assertion: >-
    She stopped payment for the unapproved extra course only; Brie's already-earned gala balance was outside the dispute, so she had not threatened the ongoing service.
  retained_record:
    identity: Supplier's retained payment direction matching Monet's signed refusal
    existing_basis: Supplier copy, signed refusal, and hold on the entire outstanding gala payment already exist in the innocent account.
    proposed_stage_7_excerpt: Hold the outstanding gala balance, including the catered service already supplied. Do not release the private extra course. M. Bags.
    proves: Her order covers earned payment as well as the new course, contradicting the claimed limited scope.
    does_not_prove: A food change, a poisoning instruction, the duration of Casey's call, or any particular minute of Monet's movements.
    integration_needed: >-
      Show this as the retained substantive payment direction, not an investigator's paraphrase of a phone conversation. No extra staff-detention sentence is needed; her admitted call and return establish that context. The old finance instruction must remain distinguishable from this broader personal action.
  method_response_design: >-
    Practical correction, irritation at the figures: admit that the supplier would not separate balances and she chose the wider freeze; resist describing that choice as a wish to stop the toast. The torn finance page remains a separate concealment with both halves retained.
  strongest_competing_interpretation: >-
    She minimizes harmful financial pressure to defend an unauthorized payroll rescue and conceal her budget failure. That pressure is a credible nonviolent tactic even though it creates opportunity for someone else.
  comparative_strength: >-
    This links a demonstrably wider service threat, knowing manager absence, and her own visit to the target. Her cover hides the instrumental action rather than an anonymous vessel. It is weaker than a direct source-possession contradiction and should not be presented as one.
  support_status: Supported; excerpt elaborates existing payment scope without adding a new physical event.

- id: '11'
  name: Barb Dwyer
  cover_family: Reclassified hazard warning
  existing_innocent_consequential_act: >-
    Barb closes storage, sends a searcher, relies on Grant's empty-bottle assurance, suppresses the first radio exchange, checks reception, and moves its waste basket. Her response leaves the donor target unsecured.
  existing_innocent_mitigation: >-
    The radio record corroborates that she did close access and send an officer. No auction-condition confirmation arrives before the toast. She admits ignoring the objection and sanitizing the summary to protect her competence. These facts explain a negligent response without making it reasonable or ruling out intentional concealment.
  guilty_concealed_action: >-
    She treats an explicit objection to the emptiness claim as merely an administrative condition query, allowing service to proceed and later protecting that choice in her account.
  opportunity_cover_assertion: >-
    Collections asked for the auction paperwork but did not challenge Grant's assurance as a hazard; her omitted exchange concerned verification procedures, not a warning against relying on him.
  retained_record:
    identity: Officer's original radio note retained alongside Barb's revised incident summary
    existing_basis: Hunt already reveals a 6:22 condition request and no reply; both drafts already establish a collections objection and a retained original radio record.
    proposed_stage_7_excerpt: Collections objects to treating the original as empty. Contents unverified. Obtain the auction condition before accepting the donor's assurance. Barb orders storage access closed and a corridor search.
    proves: An objection challenged reliance on Grant's assurance; the complete record also preserves Barb's actual protective orders.
    does_not_prove: That collections had confirmed cyanide, that Barb knew its contents from theft, or that radio activity continuously places her anywhere.
    integration_needed: >-
      Stage 7 reveals the objection's wording, not the existence or timing of a previously hidden request. Do not invent an evacuation order or confirmed poison alert. Keep cabinet alarm, Salon camera and lighting power independent.
  method_response_design: >-
    Brief concession that the original wording was sharper than her summary; protect the officer from blame. She insists she had an objection, not confirmation, while avoiding why that distinction justified leaving reception unsecured.
  strongest_competing_interpretation: >-
    A security chief lies to hide donor-led negligence and protect employment. Suppression and disposal-area access look grave but can occur after another guest carries the source there.
  comparative_strength: >-
    She controls the response to the stolen source and sanitizes a warning before handling the recovery area. That double connection beats camera symbolism or occupational access alone. It does not prove advance knowledge; a source-side and target-side conjunction must carry the accusation.
  support_status: Supported, but comparatively strong attribution remains conditional on concrete reception actions rather than the warning alone.

- id: '23'
  name: Brie DeVivre
  cover_family: Invented lack of available cover
  existing_innocent_consequential_act: >-
    Brie sends Casey to the kitchen, deliberately prevents reserve coverage, directly moves the donor glass onto a towel, and leaves reception unattended to force payment authorization.
  existing_innocent_mitigation: >-
    The retained finance instruction gives the private course a real authorization obstacle. The supplier record and menu preserve her dessert misrepresentation, and clear food and punch findings defeat a shared-service poison theory. She admits the boycott; those facts do not exclude individual-glass poisoning.
  guilty_concealed_action: >-
    She refuses cover that was actually available while directly arranging the target herself, then presents the exposure as an unavoidable staffing problem. Do not claim that she also causes Monet's call independently of Monet's actions.
  opportunity_cover_assertion: >-
    Casey had to resolve the course in the kitchen, and nobody was available to cover reception. She did what she could with the glass and service card before leaving.
  retained_record:
    identity: Casey's retained service pad noting the offered reserve coverage and Brie's instruction
    existing_basis: Reserve offer is not yet independently printed. Innocent testimony establishes deliberate prevention; service card, reserve-server misunderstanding, and Casey's service records are already established.
    proposed_stage_7_excerpt: Reserve offered reception cover. Brie declined cover pending extra-course authorization. Glass and service card left at reception for collection.
    proves: Casey recorded an available offer refused by Brie, challenging the claim of unavoidable lack of staff.
    does_not_prove: Continuous absence of all staff, an exact empty-glass history, poison administration, or whose favor carried cyanide.
    integration_needed: >-
      Introduce the service pad as a surviving working record in Opportunity evidence, with service-order and kitchen-authorization entries visible. Release the disputed reserve entry at Method with the complete relevant page, explicitly deferred rather than mysteriously found late. Casey records instructions received; Casey is not an all-hands witness. The record stays identical in every culprit world.
  method_response_design: >-
    Service authority and crew urgency: concede that reserve was available but distinguish staffing availability from her choice not to send them without an authorized order. Let the attempted distinction expose deliberate withholding. She still wants the legitimate crew balance paid.
  strongest_competing_interpretation: >-
    A caterer disguises a payment boycott as staffing necessity because admitting she left a donor's glass unattended after a theft will destroy bookings. Her direct contact makes her a serious alternative in every world.
  comparative_strength: >-
    The contradicted cover specifically conceals deliberate removal of protection from the very target she handled. This is a stronger target connection than generic corridor access, but another guest can exploit the interval and her self-protective lie.
  support_status: Under-supported in existing canon until the fixed service-pad entry and its earlier documentary presence are planted. Do not treat innocent testimony as independent verification.
acceptance_limits:
- These four families cover authority, money, hazard interpretation, and staffing; none depends on a filled-glass observation.
- Stage 7 must disclose the actual retained wording without inventing a continuous alibi or guaranteeing innocent truthfulness.
- Innocent Method can admit the same bad action and explain its nonviolent objective using already planted records; that explanation remains contestable.
- A contradiction strengthens attribution only together with the role's specific opportunity and earlier motive. All four records remain potentially incriminating when their author is innocent.
- Barb and Brie naturally have stronger source-response or target-contact cases than an announcement-only guest; do not flatten that difference to meet score counts.
