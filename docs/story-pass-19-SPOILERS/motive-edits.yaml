- id: '29'
  name: Justin Tyme
  motive_innocent: >-
    I printed Grant's parcel story before checking the city lease. Wrong boundary, wrong story. He disputed my correction and contacted the bookshop about using its desk for the blog. The shop pays my wages. I brought the lease tonight and deleted a public take I no longer trusted. The recorder kept it. I wanted to keep writing without losing the job that lets me.
