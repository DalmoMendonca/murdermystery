- id: '28'
  name: Penny Pincher
  motive_innocent: >-
    I brought three letters. There are four. Grandfather arranged the sale we contest. I left that letter out; Grant has it. He proposed settlement money. I wanted the object returned. I took his speech cards and kept my fourth letter hidden. Before he explained the sale, I intended to choose the part everyone heard first.
