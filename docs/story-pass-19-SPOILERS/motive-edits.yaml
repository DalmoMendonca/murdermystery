  name: Faye Stop
  motive_innocent: >-
    Grant and Hugh were beside the shipping file. I took the picture; Grant asked me to delete it under the portrait agreement. I deleted the camera copy and kept a print. The file was visible between them, and I wanted my editor to see it before I decided whether the agreement covered it. I had already told Grant it was gone. He was paying for portraits. I was beginning to treat the commission as access for another job. The envelope had a photograph in it, not an explanation I could give him comfortably.
  motive_murderer: >-
