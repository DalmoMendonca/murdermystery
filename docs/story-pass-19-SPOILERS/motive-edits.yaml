- id: '27'
  name: Robin Banks
  motive_innocent: >-
    I planted the stickers in brochures. The board approved attending to build contacts. They did not approve a protest, and I called it outreach when I reported the printing cost. Grant had excluded me from an earlier event and his solicitors had sent a notice about this one. I came anyway. A removable sticker does not make legal bills removable. I told the volunteers I would handle the risk. I hadn't asked the people responsible for our grants what they could afford to defend.
  motive_murderer: >-
