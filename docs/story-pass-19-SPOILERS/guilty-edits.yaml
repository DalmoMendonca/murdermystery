schema_version: 1
status: complete
scope: Guilty Opportunity and Method replacements only; one guilty variant spoken in play.
characters:
- id: '01'
  name: Artie Ficial
  opportunity_murderer: >-
    I replaced his announcement with one requiring board approval of the governance agreement. His assistant took the folder away. I returned to reception with the acknowledgment cards. Grant's new star glass already had punch in it; I wasn't interrupting preparation. I put the cards beside it and waited for my version to come back. I was still supposed to welcome people.
  method_murderer: >-
    I didn't watch Casey pour it. I saw a glass arranged for the donor and assumed service had finished. Yes, I described it rather more confidently than that. I wanted you to understand why I returned: the assistant brought his announcement back unchanged. I moved the glass to straighten the cards. Nothing about that folder had been settled.
  rationale: A director minimizes interference with an event he still claims to manage; later managerial certainty becomes assumption.
  continuity_changes_needed:
  - The governance bargain still requires Artie's resignation within sixty days. Align announcements with its contested board approval; do not remove the resignation clause.
- id: '02'
  name: Claire O’Scuro
  opportunity_murderer: >-
    I replaced the ownership proof with a qualified version and put the rejected one in my folder. The lender's answer belonged beside it. Grant's new donor glass was already filled with punch when I laid the folder down at reception, so I wasn't occupying a preparation space. I was insisting the qualification remain visible before anyone announced a permanent gift.
  method_murderer: >-
    The lender refused the transfer. That did not prevent an announcement. As for the photograph, I can't give you a better view than the one you've shown me. I thought the glass contained punch. I lifted it off the proof; I didn't examine its interior. If you want my qualification withdrawn because I described the glass badly, you have misunderstood what a qualification is for.
  rationale: Claire treats the supposedly completed service as justification for keeping disputed scholarship in the target area.
  continuity_changes_needed: []
- id: '03'
  name: Hugh Bidder
  opportunity_murderer: >-
    I withdrew the settlement envelope. The personal guarantee was not in the terms we had negotiated. I stayed at reception to read it again, beside Grant's new star glass, which already contained punch. Surely I could review a demand there once service had finished. Yesterday's email said he would never see a penny. I kept the torn draft rather than circulate that too.
  method_murderer: >-
    I arrived before collecting my ticket. Let's dispose of that misunderstanding. The glass? I believed it was filled. I moved it to put the guarantee flat and wasn't watching the catering. Your photographs make my description look careless. The solicitor's two drafts still show what was added. You can take both drafts; I won't sign either one simply to improve your opinion of me.
  rationale: A disputed guarantee supplies his practical reason for lingering and his excuse for using apparently finished service space.
  continuity_changes_needed:
  - Preserve early arrival in both variants and surviving estate liability; no ticket-as-arrival alibi.
- id: '04'
  name: Monet Bags
  opportunity_murderer: >-
    I kept Casey in the kitchen while I rang the supplier about authorization. Then I went back to reception with the payment refusal. Grant's new star glass already held punch. His toast was ready; I had stopped an unapproved course, not dismantled the evening. I left the refusal beside the glass. If he wanted dinner restored, he could read the account first.
  method_murderer: >-
    Casey evidently hadn't finished that part of service. I assumed somebody else had. That's what happens when three people give the kitchen different instructions. I stayed beside the refusal and moved the glass off its envelope. Yes, I wanted Casey kept in the discussion. No, the figures didn't improve while we argued. They won't improve now by calling every instruction I gave the same instruction.
  rationale: Monet defends her deliberate service interruption by asserting that the donor's toast was already safe to proceed.
  continuity_changes_needed:
  - Keep the actual fill at 6:46; Monet's assertion is challenged testimony, never a replacement service record.
- id: '05'
  name: Chip Patina
  opportunity_murderer: >-
    I stopped the unveiling over the cracked mount. Then I opened my kit at reception for the treatment sheet. Tools out, papers everywhere; hardly elegant. Grant's new donor glass already contained punch, so I took the space left around it. I cleared the tools when asked and stayed with the report. Collections wanted my receiving notes. I wanted the date checked before they went out.
  method_murderer: >-
    I should have said the glass appeared ready. I was checking the report, not doing a condition examination of a drink. I moved the glass away from the paper before putting the sheet back in my kit. You have the collection photograph; keep it. I held back the receiving folder, and that's an omission I can explain without pretending the cracked mount was imaginary.
  rationale: Chip grants himself workspace around supposedly completed service, then retreats into the narrower task he claims to have inspected.
  continuity_changes_needed:
  - Keep independently verified mount damage and withheld receiving notes; no guilty early fracture expertise.
- id: '06'
  name: Dada DiCapo
  opportunity_murderer: >-
    I told the operator Artie approved restoring my cue. Artie hadn't. I carried the rehearsal card to reception because I wanted it beside the donor's program. His new star glass was full of punch already; there was time for the performance discussion while the toast waited. I stayed to make sure nobody quietly removed the card again. They are very efficient at canceling artists here.
  method_murderer: >-
    Then the toast wasn't waiting. I saw the arrangement and supplied the rest; artists do sometimes supply the rest. I moved his glass to uncover the rehearsal card. The actual PROP glass had gone back on its stand, with the marking underneath. Don't turn those into one glass because I wanted a canceled effect restored. I had quite enough difficulty persuading anyone to look at the right one. The operator saved my request. At least somebody kept a record that I existed in this production.
  rationale: Dada claims a ready toast to make his unauthorized cue campaign seem compatible with the running program.
  continuity_changes_needed:
  - Retain foundation recording-rights dispute, canceled effect, and distinct marked PROP glass.
- id: '07'
  name: Vincent Van Faux
  opportunity_murderer: >-
    I turned the painting inward and had it taken off the temporary stand. Grant still owned it. I left the label at reception for Claire to reconsider, beside his new donor glass with punch already in it. Nothing needed that space for pouring anymore. I remained there because putting a label down is not the same as getting someone to agree to change it.
  method_murderer: >-
    Apparently I gave you a finished picture of an unfinished service. I thought there was punch in the glass; I didn't inspect it. I shifted it to make room for the label. The painting was still inside the museum, and the crate tag will tell you where. I wanted that early work off the wall. I haven't changed my mind merely because you dislike what I did at reception.
  rationale: Vincent's contested label gives him a reason to appropriate supposedly available space and linger for agreement.
  continuity_changes_needed:
  - Preserve crate tag and painting inside the museum; do not revive a donor blackmail threat about proxy buying.
- id: '08'
  name: Sue Venir
  opportunity_murderer: >-
    I crossed out the permanent-gift signature line and took the packet to the reception copier. Grant's new star glass already held punch beside the papers. The staff had finished that preparation; I was dealing with the signature he still expected. I kept the unsigned page with me. His estate instruction existed before tonight. Moving a packet does not appoint a beneficiary.
  method_murderer: >-
    I used finished too freely. I thought the glass had been filled, and your photographs show otherwise. I moved it off the signature page to copy the packet. The original opinion remains in the file beside the softened one. Read both, including what I refused to approve. I have already supplied enough imprecise language to this transaction without agreeing to another interpretation of every sentence I speak.
  rationale: Sue separates completed hospitality from unresolved legal work, then reluctantly corrects her own categorical wording.
  continuity_changes_needed:
  - Keep blank beneficiary and earlier estate instruction; no death-dependent beneficiary change.
- id: '09'
  name: Dr. Art E. Fact
  opportunity_murderer: >-
    I requested the Vale case file and asked whether the original retained its contents. At reception I removed my separated research request and Grant's endorsement sheet. His new donor glass was already filled with punch; I could finish my refusal there without delaying service. I wrote several versions. It is remarkably hard to make a short refusal when you can imagine every objection to it.
  method_murderer: >-
    Already filled was an inference, not something I saw Casey do. I should distinguish those. I moved the glass off the research pages and finished writing. The second page asks for the replica; collections refused access to the original. Read the whole request. I am willing to correct an observation, but I won't allow the request to become a different document by losing its second page again.
  rationale: Art mistakes his convenient inference for observation, fitting his existing overclaim without delivering forensic analysis.
  continuity_changes_needed:
  - Keep actual opening refusal and pre-toast correction; neither establishes continuous whereabouts.
- id: '10'
  name: Tess Tament
  opportunity_murderer: >-
    I collected my printed ticket late. I had come through the family entrance earlier. At reception I put the amendment with Grant's cards beside his new star glass, already full of punch. His toast was prepared; I was hardly delaying dinner by asking what the foundation was signing. I wanted the trustees to see the amendment before he made their decision sound unanimous.
  method_murderer: >-
    I didn't stand over a server. I saw his glass set out and believed the punch was in it. I moved it to keep the amendment in view. If the photographs show service unfinished, that doesn't mean the trustees had finished their business either. The amendment was unsigned. I had claimed votes I didn't have, and I would still like somebody to ask which votes Grant actually had.
  rationale: Tess minimizes a family interruption by saying hospitality was ready and the only unfinished matter was governance.
  continuity_changes_needed:
  - Guilty ticket remains late collection after early family entry; innocent first-entry receipt remains a different fact.
- id: '11'
  name: Barb Dwyer
  opportunity_murderer: >-
    I closed storage access and sent an officer to search after the alarm. Grant said the original was empty; the auction condition hadn't arrived. Later I checked reception, shifted the waste basket and radioed Casey to clear the sideboard. Grant's new donor glass already contained punch. I was clearing an exit, not leaving a toast unprepared. I held the first exchange out of my summary.
  method_murderer: >-
    The radio request stands. I said clear the sideboard, and Casey didn't do it until collection. You're showing me that the glass was empty then. My account made the response sound tidier than it was. I put my folder there and moved the glass while checking the route. Use my officer's original record. I can't ask her to improve it to match mine.
  rationale: Barb's lie conceals an unsecured empty target in the response she supervised; later retreat owns a sanitized account.
  continuity_changes_needed:
  - Preserve independent alarm and Salon-camera power; camera disconnection must not explain forced cabinet access.
- id: '12'
  name: Paige Turner
  opportunity_murderer: >-
    I searched Grant's coat. His assistant caught me and took it back. Later I retrieved my interview recorder from reception and covered the page naming my source. Grant's new star glass already held punch beside it; I wasn't keeping a server from doing their job. I was taking back a machine he had no right to retain. My editor had already cleared publication.
  method_murderer: >-
    Was the glass empty throughout, or is that the collection picture? You have the sequence. Fine. I can't improve on it. I moved the glass to retrieve my recorder and didn't watch a pour. The recording includes his demand for a name. Keep that part when you play it. You can question my description of reception without helping him identify the person I promised to protect.
  rationale: Paige minimizes disruption to justify reclaiming her machine, then challenges scope before conceding the complete photographic sequence.
  continuity_changes_needed:
  - Paige retrieves her interview recorder containing source voices; Justin's local-history recorder is a separate device.
- id: '13'
  name: Frank Lloyd Wrong
  opportunity_murderer: >-
    I closed the alcove, collected the rejection drawing at reception and marked it REFUSED. Grant's new star glass was filled with punch already, so the sideboard wasn't still being used to prepare it. I put the drawing there and removed my earlier rig approval from the folder. The electrician kept her copy. I couldn't make my acceptance of one bad arrangement justify another.
  method_murderer: >-
    That collection view is clearer than what I remember. There should have been punch in the glass, according to the way reception was arranged. Evidently there wasn't. I moved it to flatten the drawing. My model was there too; the dust could be mine. I wasn't surveying the service. I was trying to get an alteration refused before somebody described my silence as approval.
  rationale: Frank appropriates supposedly finished service space for a disputed design; his retreat separates visual expectation from an actual observation.
  continuity_changes_needed:
  - Keep separate electrician's rig copy and test log; show cancellation does not cancel donor service.
- id: '14'
  name: Mona Lott
  opportunity_murderer: >-
    I brought the delegation statement to reception and removed the identifying page. Our partners had agreed to an objection, not to being named in this room. Grant's new donor glass already held punch. The toast was ready; I could arrange the copies without interrupting hospitality. I stayed to make sure the trustees received our wording before his permanent-gift announcement supplied wording of its own.
  method_murderer: >-
    I will correct the description of the drink. I saw the glass set out for his toast and treated it as ready. I moved it to distribute our copies. The office retained the complete statement and sent the withdrawal notice before reception. The missing page names people whose position I had already endangered. Their names will not become an additional exhibit merely because I misdescribed a glass.
  rationale: Mona presents her intervention as compatible with hospitality; later she concedes a small claim while defending the protected names.
  continuity_changes_needed:
  - Keep formal public withdrawal distinct from Dada's unsigned gallery warning.
- id: '15'
  name: Elon Mosaic
  opportunity_murderer: >-
    I brought the withdrawal letter to reception. A trustee asked whose money I was withdrawing. Corporate money, which made the discussion less simple. Grant's new star glass already contained punch; he was ready for a toast while I was still being asked for qualifications. I left my envelope beside it and stayed for the answer. I had funded rather a lot of things nobody needed to qualify.
  method_murderer: >-
    You're right about the photograph. I made the toast sound further along than it was. I wanted the trustee to deal with my letter instead of sending me away to wait again. I moved the glass off the envelope. My board's refusal was real. It didn't stop everyone thanking Grant while asking me whether I had permission to mean what I said.
  rationale: Elon explicitly admits self-serving exaggeration of readiness; his wounded status supplies a purpose beyond clue delivery.
  continuity_changes_needed:
  - Preserve unauthorized corporate withdrawal and refusal email; no claim that the withdrawal was effective.
- id: '16'
  name: Anya Tique
  opportunity_murderer: >-
    I separated Grant's promise from the accession entry and brought the ledger to reception. His new donor glass had punch in it already. I wasn't obstructing preparation by putting a book there; I was preparing an account he preferred not to hear. The promise was to come out after he questioned my signature. There are advantages to remembering which document a man hopes you've forgotten.
  method_murderer: >-
    Show me the collection photograph again. Yes, I can see it. I remembered a ready glass and called it a filled one. I moved it to open the ledger, which was not a small book somebody could conveniently overlook. Last Tuesday's copies contain his promise as well as my entry. You may correct my memory of reception. You may not correct thirty-seven years into his preferred history.
  rationale: Anya defends occupation of reception with a ready-toast claim and grudgingly accepts a narrow memory correction.
  continuity_changes_needed:
  - Retain pre-gala archive copies and incomplete export file; do not make age an incapacity defense.
- id: '17'
  name: Saul D. Bid
  opportunity_murderer: >-
    The complete fee schedule was in my envelope at reception. I intended a trustee to read it before Grant's complaint reached the committee. His new star glass already contained punch. The toast needed no attention from me; the invoice did. I stayed beside the envelope rather than let it circulate without explanation. I had supplied the sale price and omitted the discretion fee. I was correcting that omission.
  method_murderer: >-
    Then the glass was awaiting filling. I accept the correction. I opened the envelope at the sideboard and moved the glass away from the schedule. I should not have described service as complete. Our accountant retains the full invoice, including the obligation I left out. Grant disputed the fee. I wanted the trustee to hear the transaction explained before hearing it described as a chairman's private arrangement.
  rationale: Saul claims completed hospitality to center his controlled disclosure, then confines the correction to service rather than his disputed invoice.
  continuity_changes_needed:
  - Keep purchasing-company fee obligation and committee review; no fee waiver that ends reporting duties.
- id: '18'
  name: Elle Loominate
  opportunity_murderer: >-
    I removed the textile and left it in its support sleeve by loading. At reception I looked for Grant's purchase card among the programs. His new donor glass was already filled with punch, so I could sort the cards without holding anything up. I stayed to get the offer out of the stack. It looked like an arrangement the family had approved, and they hadn't.
  method_murderer: >-
    Perhaps I was looking at the card too hard. The glass looked ready to be carried out; I called that filled. I moved it while searching the programs. My aunt's demand predates the theft, and the family thread includes the assurances I gave before it. Read those as well. I don't want another tidy version of that loan produced while everybody admires how finished the paperwork looks.
  rationale: Elle's lie makes unauthorized card removal seem unobtrusive; her retreat echoes the dangerously finished appearance of her loan paperwork.
  continuity_changes_needed:
  - Keep textile in support sleeve by loading, not in a case at reception; family loan omissions remain visible.
- id: '19'
  name: Reed DeLabel
  opportunity_murderer: >-
    I hid the rejected correction behind the label proof at reception when a trustee approached. Grant's new star glass already had punch in it. I wasn't interfering with service; I was finding somewhere the journal's heading wouldn't be read. I had submitted under Art's name. I also requested the Vale inventory. I knew which exhibit the missing bottle belonged to, though collections had refused access.
  method_murderer: >-
    I said punch because I didn't want the question to be why I was still beside a glass waiting for service. That's a bad answer. I was trying to hide the email. I moved the glass to cover it. The inventory scan went to the journal before tonight. Please read what I annotated there before deciding the only thing I wanted from that file was the bottle.
  rationale: Reed admits lying about readiness to deflect attention from a shameful reception concealment, leaving the murder inference contestable.
  continuity_changes_needed:
  - Retain access refusal and dated annotated scan; admission concerns false service description, not poisoning.
- id: '20'
  name: Al Baster
  opportunity_murderer: >-
    Case and invoice went on the sideboard. Grant's new star glass was already full of punch; I moved it back. Service was ready. Payment wasn't. His assistant wanted everything cleared. I packed the case, left the invoice and told the crew I wanted the sculpture withdrawn without the balance.
  method_murderer: >-
    Empty, then. I remembered weight in my hand and told you it had punch. Call that wrong. I did lift the glass, and my dirty hands could explain the plaster outside it. The case wasn't the sculpture, and packing it wasn't withdrawing permission. The crew has my changed-support drawing. Grant had an objection to the work. I still expected him to pay the people who made it.
  rationale: Al defends working around a supposedly finished drink; physical memory is his narrower and fallible later explanation.
  continuity_changes_needed:
  - Guilty variant must not inherit innocent Al's unopened-favor inspection offer or assertion of an intact personal seal.
- id: '21'
  name: Ella Gance
  opportunity_murderer: >-
    I changed the acknowledgment card and waited at reception for the photographer to notice the revised group. Grant's new star glass already held punch beside the card. The toast was ready; we could finish the photograph without delaying it. I had asked to leave the trustees out of my group. There was no point arranging a charming picture around the people most likely to ask about delivery.
  method_murderer: >-
    Does the photograph show my hand? No, it shows collection. I understand. I held the glass by its base to slide the card away and must have mistaken the reflection for punch. I'd like that to be an adequate answer. I know how it sounds now. The revised delivery date and unanswered registrar's message are on my phone. I was trying to keep that conversation out of the portrait.
  rationale: Ella's readiness claim protects the staged photograph; her visual explanation remains possible but self-serving rather than certified innocence.
  continuity_changes_needed:
  - No new image identifying Ella's hand; service photos remain fixed and unassigned in every selected world.
- id: '22'
  name: Drew Conclusions
  opportunity_murderer: >-
    I took the sponsored proof from reception before somebody read the payer's name. Grant's new donor glass had punch in it already. I was withdrawing copy from a finished arrangement, not preventing a waiter completing one. My editor had the earlier version. I stayed to make sure the press didn't receive it anyway. Editorial withdrawal sounds dignified until you have to retrieve the actual page.
  method_murderer: >-
    Finished arrangement was a rather generous description. I saw a glass set out and promoted it into a drink. I slid the proof from beneath it and moved it back. The editor retained the payment line and my earlier withdrawal message. She will be delighted to provide both. I wanted the newsletter to survive this evening without my name turning up in somebody else's account of it.
  rationale: Drew narrates his withdrawal as harmless housekeeping, then acknowledges the embellishment in editorial language.
  continuity_changes_needed:
  - Preserve dated withdrawal of paid paragraph; newsletter itself remains intended for publication.
- id: '23'
  name: Brie DeVivre
  opportunity_murderer: >-
    I sent Casey to settle authorization and kept the reserve server off reception. I wanted Grant asking why his extra course had stopped. His new star glass already contained punch when I checked it and moved it onto a clean towel. The toast was ready; I wasn't withholding that. I left the service card beside it and went back to the kitchen. My crew was still working unpaid.
  method_murderer: >-
    Casey filled it later. I know that's the sequence now you've put it in front of us. I made the interruption sound smaller than it was. The reserve server could have covered; I stopped them. I moved the glass and left it there while we argued about the course. The kitchen record also shows the cheaper dessert I concealed. There are several things I'd rather my next client didn't hear.
  rationale: Brie deliberately lies to distinguish her payment pressure from withholding a vulnerable toast; retreat admits culpable service misrepresentation, not murder.
  continuity_changes_needed:
  - Treat Brie's assertion as purposeful falsehood about her own service action, never innocent uncertainty about procedure.
  - Preserve Casey's real fill and all clear food and punch findings.
- id: '24'
  name: Cary Crates
  opportunity_murderer: >-
    Corrected the trolley number. Jordan secured the original. Replica went to display. At reception I collected the unsigned copy. Grant's new star glass had punch in it already. Could leave the clipboard without delaying service. Stayed for the signature. Had my lever. Frame still needed fixing, signature or not.
  method_murderer: >-
    Picture says empty. I didn't look inside. Said punch because it was set up for the toast. Moved the glass to get the delivery copy, packed the clipboard with my tools. Roll wasn't sealed. Receiving photo is right: original intact when Jordan put it away. Frame photo is right too. I left that one off the sheet. Neither job looked the way I wanted it recorded.
  rationale: Cary's clipped service claim excuses leaving equipment beside the target; he accepts a wrong description without technical argument.
  continuity_changes_needed:
  - Keep lever available after receiving; intact receiving photograph is not a continuous alibi.
- id: '25'
  name: Anne E. Dote
  opportunity_murderer: >-
    I brought the corrected petition to reception and spread it across Grant's speech cards. His new donor glass was already filled with punch. He could have his toast; I wasn't stopping service. I was stopping the trustees from collecting their cards without answering the educators. I stayed beside the staffing list and covered the phone numbers. Artie hadn't authorized his name. The other signatures were real. One teacher had rearranged an entire term around those bookings. I wanted somebody to look her in the face before thanking him for a lounge.
  method_murderer: >-
    Then I can't say his toast was ready. I wanted that distinction made because people were calling the petition an interruption. I moved the glass to spread the staffing list out. Staff retained both versions, including the one with Artie's name. Nobody asked those teachers how they would run their classes after the room became a lounge. I shouldn't have borrowed an endorsement to make them ask.
  rationale: Anne minimizes the practical disruption of her protest; later concession exposes her manipulation of how the interruption is described.
  continuity_changes_needed:
  - Keep false Artie endorsement distinct from genuine educators' signatures and actual threatened room access.
- id: '26'
  name: Faye Stop
  opportunity_murderer: >-
    I left the print envelope at reception and put my film case underneath while arranging the group. Grant's new star glass already held punch. The toast was ready for its picture, so I could work on the photograph instead of asking Casey about it. I stayed to collect the envelope before Grant did. The uncropped print was inside. I'd told a trustee only the crop survived.
  method_murderer: >-
    I was wrong to say ready for its picture. I was arranging people, not checking the drink. I moved the glass to retrieve the envelope. The collection sequence shows what Casey did later; mine wasn't a continuous record. The editor saved my earlier preview with the shipping file visible. My case held film equipment and FIXER. I wanted the full image kept and my promise to delete it forgotten.
  rationale: Faye uses presumed readiness to justify prioritizing portrait work and protecting the envelope over checking service.
  continuity_changes_needed:
  - Preserve saved full-file preview and separate photographic coverage gap; no new continuous camera proof or identifying image.
- id: '27'
  name: Robin Banks
  opportunity_murderer: >-
    I took Grant's legal notice and replaced the reception brochures with petitions. His new star glass was already filled with punch. I wasn't preventing hospitality; I was changing what the trustees would read while it waited. Our board had rejected the tactic. I had booked the stickers as outreach anyway. I stayed to stop someone putting the brochures back before a trustee saw the objection.
  method_murderer: >-
    I wanted the protest called something other than disrupting service. So I told you the drink was ready. The photographs make that defense rather useless. I moved the glass to put the petitions down. The printer's order was for removable stickers, and the board's refusal is still on record. The volunteers didn't agree to all the consequences I incurred for them. I wanted Grant's notice off the table first.
  rationale: Robin admits a tactical false distinction between protest and disruption, fitting unauthorized advocacy without confessing the crime.
  continuity_changes_needed:
  - Preserve pending legal action and unauthorized outreach booking; donor death does not extinguish liability.
- id: '28'
  name: Penny Pincher
  opportunity_murderer: >-
    I searched Grant's speech cards for the fourth family letter. My case was open beside his new star glass, which already contained punch. Everything for the toast was ready, so I wasn't obstructing preparation by sorting a few papers. I set a card against the glass and stayed until I'd checked the pile. I took two unrelated cards as well. He didn't need every word he'd prepared.
  method_murderer: >-
    A few papers was doing some work in that account, wasn't it? So was ready. I moved the glass to spread the letters out and didn't see anybody fill it. Your sequence says it was empty. The fourth letter remained in my case. My solicitor had only the first three. I was looking for Grant's copy because I wanted to know which family story he meant to tell.
  rationale: Penny minimizes invasive searching as harmless use of finished space, then acknowledges the minimized account while defending her family concern.
  continuity_changes_needed:
  - Keep fourth letter withheld from earlier solicitor packet; no imaginary identified owner of recovered miniature or wrapper.
- id: '29'
  name: Justin Tyme
  opportunity_murderer: >-
    I retrieved my own local-history recorder at reception before playback named the tenant. Then I spread the map out to find the lease. Grant's new star glass already held punch. His toast was prepared; I wasn't holding it up by checking a boundary. My comment about finishing the city's work meant demolishing the wall. I stayed because the lease was still missing from the version he intended to use.
  method_murderer: >-
    I can identify the wall on that map. I can't tell you why I remembered punch when the collection picture shows none. I shifted the glass off the lease, and I wasn't watching service. Play the rest of my recording: it names the wall and the source's restriction. That's my machine, not Paige's interview recorder. I wanted the correction heard before everyone decided the original profile was the whole history.
  rationale: Justin defends occupying the donor arrangement with factual checking, then loses confidence in his drink memory while insisting on his genuine correction.
  continuity_changes_needed:
  - Justin's recorder contains the boundary-wall remark and tenant restriction; Paige's source-voice interview recorder remains separate.
  - Keep clerk's corrected lease email from last week; do not turn it into a gala alibi.
- id: '30'
  name: Minnie Malist
  opportunity_murderer: >-
    I collected the rejected placement drawing and changed the acknowledgment card at reception. Grant's new star glass already had punch in it. The toast was ready, and I could finish the card without asking the crew to wait for another detail. I removed the drawing with my blackout penciled in. The operator had saved the console version. There were things I could still make look finished.
  method_murderer: >-
    Ready was what I wanted it to be. I described the drink that way because another unfinished task meant another person asking what I had promised. I moved the glass by its foot while correcting the card. The safety override canceled my blackout; those flickers were the electrician's test. The florist still has my call about payment. I could get things delivered. I couldn't give anybody a reliable answer about the balance.
  rationale: Minnie's readiness claim conceals the unfinished production she is struggling to present as complete; retreat links it to her payment improvisation.
  continuity_changes_needed:
  - Keep independent camera power, 6:37 safety override, electrician's test, and florist payment call.
