  paragraphs:
  - 'Auction condition: sealed historical bottle; original contents retained. Specialist hazard assessment
    required. Display status: withheld. Empty replica supplied for gallery installation.'
  - Buyer requests The Art of Murder display tonight. Collections has declined approval of the original.
  - Empty handling copy supplied for the planned hands-on display. The historical original is not approved
    for public handling.
  stamp: PRIVATE ACQUISITION / DISPLAY REVIEW PENDING
- number: 14
  department: MERIDIAN / COLLECTIONS RECEIVING
  title: Receiving and missing-object report
  paragraphs:
  - '5:45: Original secured in locked preparation cabinet and secondary case. Receiving photograph shows
    the closed case. Condition entry: neck intact. Separate empty display copy supplied for gallery installation.'
  - '6:12: Forced-opening alarm. Cabinet lock and secondary case damaged. Original missing.'
  - '6:15, security radio: Grant says the original was emptied. Close preparation storage access and search
    the corridor. 6:22: collections requests the auction condition to verify his claim. No reply logged.'
  stamp: 'SIGNED: JORDAN WEST'
  annotation: Display approval withheld. Cabinet key retained by collections.
