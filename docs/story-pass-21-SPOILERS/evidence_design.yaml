reports:
- id: F1
  department: MERIDIAN / BOARD SECRETARY
  title: The gift came with conditions
  text: Grant Larceny collapsed after his toast and died at the gala. Earlier, trustees had discussed
    this unsigned gift agreement in the museum office. The label review, acquisition disputes and installation
    inspection continued in other rooms. These are the terms Grant wanted announced.
  rows:
  - - 1. Museum name
    - The Grant Larceny Meridian Museum
  - - 2. Collection decisions
    - Grant may veto future acquisitions
  - - 3. Museum director
    - Artie Ficial must resign within sixty days
  layout: gift_document
  document_label: DRAFT GIFT AGREEMENT / NOT SIGNED
- id: F2
  department: INVESTIGATION / INITIAL FINDINGS
  title: A death and a stolen exhibit
  text: 'Grant Larceny became ill after drinking his toast and died at the gala. The examination identifies
    cyanide poisoning. The museum had received a historical poison bottle for The Art of Murder. Grant
    told security the bottle had been emptied. The responding investigators obtained the auction condition:
    original contents retained. Collections placed it in a locked preparation cabinet inside a secondary
    case and withheld display approval. A separate empty display copy was supplied for gallery installation.
    At 6:12 the cabinet alarm registered a forced opening. The original was missing. Food, drinks, props
    and recovered bottles are being examined.'
  rows:
  - - Missing object
    - The Velvet Widow / original poison bottle
  - - Storage
    - Locked cabinet; forced-opening alarm at 6:12
  - - Laboratory results
    - Pending
  layout: bottle_photo
  photo: receiving_case_v18
- id: F3
  department: INVESTIGATION / SCENE RECORD
  title: A bottle behind reception
  text: 'Jordan West, collections assistant: A dark-blue bottle with visible neck damage was recovered
    on the staff-returns shelf behind the reception sideboard during the search after Grant''s death.
    Object identification and comparison are pending. This waist-height work shelf stands against a plain
    wall; gallery and event items await staff collection there. Casey Hart, service manager: Grant''s
    new museum-star glass stood on the reception sideboard from 6:32 to 6:44 while I settled the kitchen''s
    extra-course authorization. Programs, favors and correspondence also used reception. The preparation
    cabinet and its secondary case were forced at 6:12; the historical original was missing then.'
  rows:
  - - Recovered object
    - Dark-blue bottle on staff-returns shelf; identification pending
  - - Donor glass
    - On reception sideboard 6:32–6:44
  - - Service manager
    - In kitchen to settle extra-course authorization
  - - Storage
    - Cabinet lock and secondary case forced at 6:12
  layout: recovery_scene
  photo: returns_shelf20_REQUIRED
- id: F4
  department: MERIDIAN / COLLECTIONS INVENTORY
  title: The original and its display copy
  text: 'The bottle recovered from the staff-returns shelf is the historical original. It has a closed
    base and a fresh gap in its neck. The blue fragment recovered in folded favor paper joins that irregular
    curved neck edge. The receiving record described the original neck as intact. Its display copy has
    a similar dark-blue body but an open bottom: it cannot hold liquid. The recovered miniature fragrance
    bottle has an intact neck and body. Service photographs show the donor glass empty when placed at
    6:32 and empty when collected at 6:44. Casey filled it with shared punch on the tray at 6:46 and reports
    keeping it there until the toast. The photographs show moments, not continuous coverage.'
  rows:
  - - Recovered historical original
    - Dark-blue body; closed base; fresh neck gap
  - - Fragment in favor paper
    - Joins the original neck gap
  - - Display copy
    - Similar dark-blue body; open bottom
  - - Recovered miniature
    - Neck and body intact
  layout: fracture_comparison
  photo: original_replica20_REQUIRED
  service_photo: sideboard_service_v18
  service_timeline:
  - time: '6:30'
    caption: New donor glass, wrapped
  - time: '6:32'
    caption: Empty glass placed on reception sideboard
  - time: '6:44'
    caption: Empty glass collected onto service tray
  - time: '6:46'
    caption: Shared punch poured on service tray
- id: F5
  department: LABORATORY / CASE FINDINGS
  title: Laboratory findings
  text: Cyanide was found inside Grant's museum-star glass, in the recovered original, on the blue neck
    fragment, and in a miniature LARCENY No.1 bottle from reception waste. The shared punch, meal, sauce,
    PROP glass, brush-water bottle and studio FIXER tested clear. Unopened favor stock also tested clear.
    The contaminated miniature has the common manufacturer label and no recipient name. Plaster and cloth
    fibers were found on the outside of Grant's glass.
  rows:
  - - Grant's glass / original / blue fragment
    - Cyanide detected
  - - Miniature from reception waste
    - Cyanide; common favor label; no recipient name
  - - Punch / meal / sauce / PROP / brush-water / FIXER
    - Clear for cyanide
  - - Unopened favor stock
    - Fragrance; clear for cyanide
  layout: lab_findings
