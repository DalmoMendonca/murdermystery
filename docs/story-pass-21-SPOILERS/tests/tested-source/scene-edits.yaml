schema_version: 1
status: authoring_pending_branch_and_evidence_audit
scope: Private innocent scene rewrite; public character copy is untouched.
characters:
- id: '01'
  motive_innocent: >-
    Grant had brought my resignation to a dinner I was supposed to host. Sixty days, under his gift agreement. I asked the chair to reject it. She wanted the money. I copied his signature onto a demand that made his terms look worse and sent it to her. Then she asked why his letter had come from my printer. I could hear guests arriving while I tried to answer. Grant was waiting for me to welcome him.
  opportunity_innocent: >-
    I replaced his announcement and told his assistant he could speak after signing my version. She took both pages. I asked Brie to delay his toast and said the chair had ordered it. The chair hadn't. Brie wanted her invoice settled first. I left them to argue and went back to welcoming guests. When somebody asked whether we were still toasting, I said yes. I wanted the applause without the announcement. It sounded manageable when I said it.
  method_innocent: >-
    My version required board approval, including approval of my departure. The chair's answer was to stop using her name. She could have published the forgery; she still can. I had accepted another museum's offer before tonight. Grant couldn't prevent me leaving. I wanted her to reject his bargain publicly, not simply replace me. That's why I interfered with the speeches and toast. I hadn't thought about what Brie's withdrawal would leave unattended.
- id: '02'
  opportunity_innocent: >-
    I took Grant's ownership label off the gallery wall. The label underneath was the qualification he had refused. A trustee told me to restore the approved version before opening. I gave her the outside review instead. Earlier in the week I'd sent it to the lender without board permission. I was waiting for their answer, and I wasn't going to keep presenting a disputed object as a settled gift while I waited. The printer had already been paid. She mentioned that twice.
- id: '03'
  opportunity_innocent: >-
    I followed Grant into the office with the settlement. He added a personal guarantee. Not the firm's money: mine. I tore that page out and said he would never see a penny. His assistant asked whether that was our formal answer. I asked whether she intended to put every unpleasant sentence into the file. She said yes. I left without signing. The torn page is in my pocket. I thought there would be another negotiation after dinner.
- id: '04'
  opportunity_innocent: >-
    I kept Casey in the kitchen while I rang the supplier. Grant had ordered another course in my name. I froze the gala balance until he withdrew it. Brie asked what that did to her crew's wages. I told her to ask Grant. I knew reception was uncovered; she'd told me. I went on disputing the order anyway. Then I tore the finance page in half rather than hand Casey the account figures. It had become a rather expensive way to win an argument.
  method_innocent: >-
    The withheld course never left the kitchen. What Grant actually drank was punch from the shared batch, which tested clear. That narrows the danger; it doesn't excuse leaving his glass unattended. I kept both halves of the finance page. They show the restricted transfer and the wages it paid. A dead donor doesn't refill that account or cancel the audit. I wasn't saving myself money by stopping service. I was trying to make him accept that his order required my signature.
- id: '05'
  opportunity_innocent: >-
    The mount cracked. I pushed Grant back from the barrier, took the attendant's radio and called the hold. My kit held the blue display copy Cary had delivered, tools and the receiving folder. I emptied it at reception looking for the treatment sheet. Service wanted the space, so I packed it again. The folder stayed in my jacket. Collections had asked for those notes after the cabinet alarm. I'd told them to wait. I didn't want my altered date in someone else's hands.
- id: '06'
  opportunity_innocent: >-
    I told the operator Artie had restored my cue. He hadn't. I set the rehearsal glass and the empty jacket where Grant would recognize them. He'd taken the piece and removed my credit; I wanted him watching it happen to his own image. The mounting hold canceled the sequence. I took the jacket away but left the glass by its stand. Then I demanded the credit be restored anyway. The operator asked whether I understood the word canceled. Very clearly. That was the problem.
- id: '07'
  opportunity_innocent: >-
    I took the painting off the stand and put it face inward in an installation crate. Grant's painting. Yes. I told my dealer I'd rather ruin the show than have my student work hung beside the paintings I'd actually meant to finish. She suggested buying it back. He'd already refused. I carried the rejected label into the gallery and argued with a trustee who kept saying the public deserved to see it. The public has survived without it so far.
- id: '08'
  opportunity_innocent: >-
    I crossed out the permanent-gift signature line in the office. Grant pushed the pen back toward me. I moved it out of reach and refused to witness acceptance. My case also held an estate instruction he'd asked me to prepare last month. When his assistant asked what else I'd brought, I folded that page behind the opinion. I didn't want the trustees reading it. We were already arguing over one document they thought I'd approved. I was not adding a second.
- id: '09'
  opportunity_innocent: >-
    I asked whether the Eleanor Vale bottle still contained poison. Grant said it had been emptied and asked why a lecture needed to know. The contents mattered to the case. My two-page request was returned with collections' response; I withdrew it rather than explain it to him. Reed had seen both pages. I told him not to discuss them with Grant. Then I asked him to sign my endorsement of the collection. I had made rather a lot depend on his discretion.
  method_innocent: >-
    The withdrawn request had a second page: an empty handling copy and the coroner's report, for the lecture. Collections refused opening the original. I knew about the poison; I didn't need the contents to read the inventory. Before the toast I sent the journal my correction, naming Reed. The endorsement is unsigned. Grant could still have attacked the sound parts of the article, but he couldn't make me withdraw a correction I'd finally sent. Reed, I should have said whose discovery it was.
- id: '10'
  opportunity_innocent: >-
    I arrived after the missing-bottle report, still calling trustees from the car. At reception I pulled the amendment from my bag and caught a rental glass. I pushed the broken stem into the napkins rather than announce another little family disaster. Then I took Grant's signing pen. His assistant searched while I held it behind the bag. I wanted the last trustee on the phone before another ceremony made his terms look inevitable. Watching her search was petty. I enjoyed it.
- id: '11'
  opportunity_innocent: >-
    The alarm went. I closed storage access and sent an officer to search. Collections objected to Grant's claim that the original was empty. I omitted that exchange from the incident book. On my route I checked gallery parts and saw the blue copy with Chip's kit. At reception I ordered the waste moved away from the exit and the room cleared for service. My officer wanted the toast stopped. I told her to keep looking. Grant was still assuring me there was no danger.
- id: '12'
  opportunity_innocent: >-
    I searched his coat for my recorder. His assistant caught me. I pulled the lining out anyway; a favor and folded paper fell onto the chair. She gathered them up and took the coat. I found my machine under his announcement, took it and tore the source's name off the page before security could ask for it. Grant had demanded that name. He wasn't getting it because he'd confiscated a recorder. Nor was everybody else in the room. My editor got the complete page.
  method_innocent: >-
    The recorder catches Grant demanding the name, then his assistant arguing with me about the coat. There are gaps; I'm not offering a twelve-minute alibi. She still has the coat and the favor she gathered up. Ask to examine that, not somebody else's bottle. I sent my editor the whole page before removing the name from the copy here. The story was already cleared. I wanted it published with Grant answering it. I didn't want to turn my source into the evening's next spectacle.
- id: '13'
  opportunity_innocent: >-
    I closed the alcove after the mount cracked and retrieved the pry bar from the rigging equipment. An unfortunate tool to find beside an installation I'd approved against my standards. I carried the plaster model through reception, then took Grant's drawing from the office and tore through REFUSED with the pencil. I removed my earlier approval too. The electrician had her copy. Knowing that didn't stop me taking mine. Principles are easier to display without the previous draft.
  method_innocent: >-
    The electrician's copy shows what I approved and where the rig used that tool. Her test explains the flickers; it didn't power the camera. Neither fact accounts for all my movements. I carried the plaster model through reception, which may explain dust outside the glass. The revised plan still needed structural review, and Grant's estate still owes the disputed balance. I concealed an unsafe compromise, then refused a further one. Both drawings deserve inspection. Neither is a clever way out of being paid.
- id: '14'
  opportunity_innocent: >-
    I stopped the trustees in the office before they went to the unveiling. Our objection was missing the page naming the private approach. I'd withheld it; Grant meant to name those people in his speech. Last week's minutes record me promising the unveiling wouldn't proceed quietly. Tonight I told the trustees we would withdraw publicly if he went ahead. They asked who we meant. I gave them the delegations' names, not the negotiators'. I had leaked quite enough without completing his announcement for him.
- id: '15'
  opportunity_innocent: >-
    A trustee asked whether the pledge was personal or corporate. Corporate. I'd brought a withdrawal envelope and my lawyers had prepared it, but the company board hadn't authorized it. I said I could destroy Grant's announcement anyway. She asked whose money I was threatening to withdraw. I photographed her query and sent it to my advisers. That was an expensive room in which to discover the difference between being thanked for money and being trusted to decide anything.
- id: '16'
  opportunity_innocent: >-
    I took Grant's loose promise out of the accession ledger before giving the book to the trustees. The anniversary account had my omission and his rescue arranged rather neatly. I wanted his promise read beside my signature. I kept the letter in my handbag and asked the secretary to leave me time to speak. She said Grant had approved the order already. Thirty-seven years of signing things, and now apparently I needed permission to explain one of them.
- id: '17'
  opportunity_innocent: >-
    A trustee asked about the subsidiary invoices. I offered the full schedule only after she heard Grant's objection to our fee. Our accountant wanted it released immediately. I declined. She asked whether my promise of no further service was personal or on behalf of the house. I let the remark stand. The committee was about to examine a sale I'd authorized without its review. I preferred them to begin with Grant refusing a charge, however legitimate his other questions might be.
- id: '18'
  opportunity_innocent: >-
    I unfastened the textile and rolled it into its support sleeve. My aunt wanted it home; the museum hadn't agreed to removal. I showed the handler her email and skipped the earlier messages where I'd promised the paperwork was complete. The roll went onto the loading table. Then I found Grant's purchase card in the programs and tore it. My family hadn't authorized a sale. The room had already admired the installation. I now had to explain why the admired thing couldn't stay.
- id: '19'
  opportunity_innocent: >-
    Art told me not to discuss his request for the Vale bottle with Grant. Collections had answered my inventory request too; I kept the response with my annotations. I'd submitted a correction under Art's name and the journal had asked whether he'd authorized it. He hadn't. I put the rejection email in the label folder and gave Claire only the ownership evidence. I wanted the error corrected without losing the fellowship. Art wanted my name left out of his endorsement. We were both being selective.
- id: '20'
  opportunity_innocent: >-
    I put the plaster-dusted case and unpaid invoice on the sideboard. Grant's glass was in the way. I lifted it farther back and weighted the invoice with my favor. His assistant wanted the lot moved. I shut the case and left it for collection, then told the crew the sculpture wasn't staying without payment. At the service entrance I checked the removal equipment hadn't gone home. Grant called that disputed property. I called it a remarkably late interest in the sculpture.
- id: '21'
  opportunity_innocent: >-
    I asked the portrait photographer to leave the receiving institution's trustees out of my group. Then I changed my acknowledgment card so it didn't mention the promised painting. It was under Grant's glass; I lifted the glass by its base and took the card out. Their registrar had asked where the painting was. I left the message unanswered. I'd given another impossible delivery date. A good portrait makes generosity look effortless. Mine required removing several people who knew what I owed them.
- id: '22'
  opportunity_innocent: >-
    I found the sponsored proof in the press stack and took it back. I'd called the paragraph independent, then asked my editor to omit the payment details. She'd declined. Snatching pages was faster than editorial withdrawal, although considerably harder to defend in an essay about integrity. Grant recognized the jokes I'd borrowed from his private conversations. I wanted his name out of the newsletter before he put mine into the announcement. Neither of us was doing the other that kindness.
- id: '23'
  opportunity_innocent: >-
    I sent Casey into the kitchen over the extra course and stopped the reserve server covering reception. Deliberately. Grant could ask why his private service had vanished and perhaps notice the invoice. I checked his glass, moved it onto a clean towel and left the service card beside it. Then I told the kitchen to wait. The reserve server thought it was staffing; I let them. If they'd known I was making a point, they'd have covered anyway. They'd already worked hard enough for me.
- id: '24'
  opportunity_innocent: >-
    Signed the wrong trolley number. Corrected it in pencil. Jordan secured the original; I delivered the blue copy to the gallery for Chip. My delivery picture showed a cracked frame. Left it out. Grant refused the job. I looked for the sheet at reception and set the unsealed tool roll beside the clipboard. Lever inside. Courier kept the picture. I wanted another inspection before payment stopped. Should have asked before hiding the damage.
- id: '25'
  opportunity_innocent: >-
    Artie told me to take his name off the petition. He hadn't endorsed it; I had added it. I brought the replacement into the office and put it over Grant's announcement. The staffing list was attached. I covered phone numbers, not signatures. Those educators had agreed to speak. I told a trustee the petition was staying until someone answered us. They had found time for the new donor lounge. I wanted them finding time for the children already booked into that room.
- id: '26'
  opportunity_innocent: >-
    I showed a trustee the crop and said it was the surviving picture. The full print was in my envelope. I'd already sent an editor a preview and asked her not to save it. She saved it. While rearranging the portrait group, I put the film case under reception. The FIXER bottle was inside. Some of this job was on film, and some of it was becoming a different job altogether. Grant had paid for portraits. The shipping file wasn't supposed to survive them.
- id: '27'
  opportunity_innocent: >-
    I promised security I'd leave the display alone. Then I covered its ownership caption with removable paper and replaced the donor brochures with petitions. Our board had rejected that tactic because it risked negotiation. I did it anyway. Grant meant to hand me a legal notice; I took it from the office before he could present it as another generous contribution. He could send it properly. I had volunteers ready to explain the stickers and no agreement about who would pay the legal bill.
- id: '28'
  opportunity_innocent: >-
    I searched Grant's speech cards for the fourth letter. My attorney had only three; I'd kept the awkward one back. I took two cards that weren't about it at all. My little case stood open beside his glass while I sorted them. I emptied the loose papers into it and went toward coat check, then came back for my gloves. Lovely hinges, hopeless lock. Grant always praised the hinges. He was rather better at asking what I'd left out of the contents.
- id: '29'
  opportunity_innocent: >-
    Somebody played my recorder while I was trying to explain the map. Finish what the city started. I stopped it and took it back. I meant demolishing the boundary wall; the next minute names it. I stopped that too because it also names the tenant who helped me. I'd given the press a map without the alley lease and promised discretion to the person who supplied it. Grant had contacted my employer about the first story. I needed a correction that didn't expose another person.
- id: '30'
  opportunity_innocent: >-
    I took back the placement drawing with my blackout penciled in. The operator had saved the console version. I knew that. This morning I'd told the florist Grant wouldn't get his big moment; she asked whether to stop delivery. No, deliver. At reception I moved his glass by the foot to correct the acknowledgment card. Then I argued with the operator about the rejected cue. Everyone expected an approved production. Nobody had approved the money I'd promised her to keep it running.
