characters:
- id: '02'
  method_innocent: >-
    The lender answered before the alarm: no permanent transfer while ownership remained disputed. I'd have withdrawn the exhibition. They can overrule their curator; they can't accept a gift the lender refuses to make. The label I put up stated that restriction. The review is in my folder, commissioned behind the board's back. I let the wrong label print because I wanted an answer first. Now the opening is gone and I'm still defending the wording. Would somebody leave the qualification on the wall this time?
- id: '03'
  method_innocent: >-
    A dead buyer still has an estate. The refund claim survives him; our attorney had told us both. Killing him wouldn't remove the firm's liability or make that forged certificate genuine. The personal guarantee is different. Someone added it to a settlement I'd been prepared to negotiate. Compare the drafts. I changed our checking record after the sale, and that will still need explaining. Grant wanted me personally paying for the firm's mistake. His death has made the discussion worse, not cheaper.
- id: '06'
  method_innocent: >-
    PROP is written beneath my rehearsal glass. It tested clear. The console saved my attempted cue and its cancellation; the empty jacket never fell. I wanted Grant alive to watch the likeness collapse. Watching his reaction was the work. You can call that cruel. Calling it a harmless prank is another way of taking my credit. My glass was for the stand, not service. The toast used the new museum-star glass. Somebody made a death out of an evening when I'd planned an insult.
- id: '07'
  method_innocent: >-
    The crate was still in the installation area. I hadn't stolen the painting back. Its tag and the job photograph show it face inward before opening. The brush-water bottle tested clear. My dealer had offered a purchase; I preferred an argument and an empty stand. Grant owned an embarrassing picture. He hadn't acquired the right to pretend I approved the exhibition. The picture is recoverable, the label is rejected, and my message about ruining the show meant exactly the thing I'd already done to it.
- id: '08'
  method_innocent: >-
    Read the estate instruction. The beneficiary space is blank. It appoints neither me nor my firm, and the existing will is still in force. A document in a lawyer's case is not necessarily a completed favor to the lawyer. My softened opinion is a separate matter. The estate can proceed against us over that wording, probably with more enthusiasm now. I concealed the unfinished instruction because its presence would raise precisely these questions. That was poor judgment. It didn't give me an inheritance.
- id: '10'
  method_innocent: >-
    The broken rental stem was removed before Casey unwrapped the donor glass. No museum star on it. My first-admission receipt puts me outside when the preparation cabinet was forced. I've returned the signing pen; the amendment is still unsigned. Grant's death doesn't automatically give me the trustees' votes. Some may be more willing now. I won't pretend I haven't thought of that. I wanted him sitting through a vote he couldn't control. I could have broken a glass without breaking the evening like this.
- id: '14'
  method_innocent: >-
    Our office sent the public withdrawal notice before reception. It omitted the identifying page, just as I did. The full objection names the people whose approach I had leaked. It isn't the anonymous warning, and it didn't demand a body on the floor. Grant alive at an opening we publicly left would have had to answer for the ownership dispute. Now people will discuss his death instead. My partners are still angry about the leak. They were trusting me to keep the rest of their negotiation private.
- id: '15'
  method_innocent: >-
    My advisers had already said no. I photographed the trustee's query and asked again anyway. Corporate pledge; company decision. I had no authority to cancel it. She kept asking that ordinary question while I tried to talk about acquisitions. I can decide to buy a painting. Apparently I can't decide that an institution ought to value my money in the way I expected. The draft withdrawal was never authorized. I came with an envelope I couldn't use and rather a lot of confidence in it.
- id: '16'
  method_innocent: >-
    The archivist copied the letter last Tuesday. Put it beside my signature. Grant promised papers; he never delivered the completed file. When the roof leaked, accepting a donor's promise seemed more urgent than testing it. I don't recommend that order now. I took the letter out so I could choose when his part was read, not because it made my approval defensible. The anniversary account thanked him for saving us. I wanted the audience to hear what we'd accepted in return.
- id: '17'
  method_innocent: >-
    The purchasing company owed the fee. Grant was challenging a charge on somebody else's acquisition, and I wanted the trustee to hear that before examining my approval. Here is the complete invoice. The schedule I supplied the committee omitted the charge; I won't describe that as an abbreviated account. I authorized a subsidiary sale without full review and then tried to arrange the review to suit me. Our accountant asked for the invoice immediately. She understood the correct order rather better than the chairman.
- id: '18'
  method_innocent: >-
    My aunt's demand came before the theft. Read the family messages in order: her conditions, my promises, then her request to have the textile home. The installation photograph shows the empty support. Its fibers may be on the purchase card and outside the glass. The laboratory places the poison inside. I removed something I had no right to promise permanently. Grant saw an available acquisition because I'd concealed why it wasn't one. Tearing his offer didn't get the textile home or settle what I'd told my family.
- id: '19'
  method_innocent: >-
    Collections' response was a scan and a refusal of access to the original. My annotations are on the inventory. Art's second page requested the empty copy and report. He has sent his correction now. Mine went under his name without permission, which is why the journal rejected it. I wanted them reading the evidence, then wanted credit for being heard. Those aren't quite the same wish. Claire got the ownership finding without the rejection. Art got a submission he hadn't made. Neither got the whole account from me.
- id: '20'
  method_innocent: >-
    My hands were dirty. The plaster outside the glass is probably mine. Inside is another matter. My favor was unopened when I weighted the invoice; it's still sealed. Examine it. I altered the sculpture's support before tonight and then threatened removal over payment. The invoice demands payment or withdrawal of display permission, not ownership of Grant's sculpture. Even with it outside we'd still be arguing. A dead client doesn't pay the crew. I wanted leverage, and I made an obstruction instead.
- id: '21'
  method_innocent: >-
    The painting is sold. Removing its name from the acknowledgment didn't undo that. I lifted the glass to take the card out and put it back by the base; I put nothing inside. I hadn't touched a blue bottle for the portrait. The registrar has my promise and two impossible delivery dates. Those messages aren't an alibi. They show the delay I was trying to preserve while being photographed as a benefactor. Grant could have told the trustees. They still need telling, and I still owe them the work.
- id: '22'
  method_innocent: >-
    The paragraph was already withdrawn before the alarm. My editor has that message beside a proof naming Grant as payer. She declined the cleaner version. In retrospect, asking a journalist to make the payment less visible was a particularly foolish defense of independence. I still want the newsletter published. I would prefer someone else's private conversation providing the entertainment. This time apparently mine qualifies. The item can be withdrawn; the money was accepted. I owe readers both facts, however elegantly I can describe the first.
- id: '25'
  method_innocent: >-
    The first petition doesn't have Artie's name. Staff copied it before I added him. Look at the bookings: those are classes, not projected use of a room nobody wants. I put the corrected petition over the announcement and made the trustees read it. I didn't contaminate his drink. I'd been asking educators to sign for themselves while pretending the director had joined them. They deserved his real answer, and the trustees' answer to the children. They got me trying to make our numbers look better.
- id: '26'
  method_innocent: >-
    The editor received my preview before the alarm. It includes the shipping file at the edge. I'd told Grant the picture was deleted; the camera copy was. The print wasn't. The FIXER tested clear, and my camera wasn't up continuously during the unattended-glass interval. I stepped out to call about publication. My deception concerned what survived the portrait agreement. Look at the uncropped picture: it shows the file, not a poison transfer. I had a second story in a job I'd sold him as portraits.
- id: '27'
  method_innocent: >-
    The paper comes off the caption. The printer's order specifies that. Our board still refused the tactic; I described the expense as outreach anyway. We asked for negotiations in those petitions. I turned them into an action volunteers hadn't agreed to defend, then took the legal notice rather than face it publicly. The notice is here. So is the printing account. I said I could handle the risk. I meant I wanted to be the person brave enough to take it. Those are different promises to staff.
- id: '28'
  method_innocent: >-
    Grandfather was an intermediary. That's what the fourth letter says. I gave it to the attorney now, along with the three whose receipt I'd been so pleased to produce. Grant had a copy of the awkward one already. Killing him couldn't remove it from the ownership dispute. My case held letters and the speech cards I took; you may inspect it. I could reach the glass while sorting them. I wanted the family story told in our order. There are fewer admirable orders than I'd hoped.
- id: '29'
  method_innocent: >-
    Play the next minute. The wall is named, then the source's restriction. The corrected lease came from the clerk last week, and it proves I'd published the wrong boundary. The tenant trusted me with a lead; I was trying to correct it without naming them. Grant's objection wasn't the only problem with my story. I'd already got it wrong. I wanted to keep the job that paid for the blog and write a better account. His death doesn't move the boundary or correct the lease.
- id: '30'
  method_innocent: >-
    The saved console version has my blackout. The safety override canceled it; the later flickers were the electrician's test. Camera power was separate. I moved the glass by its foot to fix the card, not to put anything in it. The florist's call note records me saying carry on after she'd asked about stopping delivery. I still owe her an answer about the money. Grant losing a grand entrance might have won the production argument. His death doesn't cover an invoice I promised to pay.
