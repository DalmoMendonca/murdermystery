schema_version: 1
status: provisional_not_independently_accepted
rule: >-
  These are competing hypotheses, not score guarantees or declarations of guilt.
  A late fact may weaken one hypothesis without clearing every imaginable route.
  No essential fact may first appear in Coming Clean.
cases:
- id: '01'
  agenda: Block Grant's unilateral gift announcement and control the director's departure.
  suspicion: Forged Grant's demand and falsely used the chair's authority to interrupt the toast.
  crime_connection: Helped provoke a service gap and concealed how he obtained it.
  early_plant: Hunt gift agreement; Act I forged demand; Act II delay and false authority.
  method_reinterpretation: Board-approval wording and a previously accepted new job distinguish institutional opposition from preventing departure.
  residual: Directed interference around the toast and admits dishonest authority.
  risk: A new job reduces only one motive; do not present it as proof he couldn't poison the glass.
- id: '04'
  agenda: Refuse an unauthorized extra course while concealing restricted-fund payroll spending.
  suspicion: Intentionally kept Casey in the kitchen despite knowing reception was uncovered.
  crime_connection: Created target access and had a corrupt finance motive.
  early_plant: Hunt education budget and service authorization; Act I transfer; Act II payment hold.
  method_reinterpretation: Withheld course stayed in kitchen; clean shared punch and surviving audit undermine a food/service-money theory.
  residual: A clean batch doesn't clear deliberate contamination of an individual empty glass.
  risk: Do not overclaim budget trouble makes murder irrational or resolves his whole case.
- id: '05'
  agenda: Correct his treatment record before the altered insurance date circulates.
  suspicion: Tools, handling-copy workflow, withheld source condition, kit emptied at reception.
  crime_connection: Practical source access and concealment near the target.
  early_plant: Hunt condition report and receiving chain; Act I altered date; Act II kit and warning hold.
  method_reinterpretation: Failed mount is real; actual handling copy has an open bottom and is in his kit.
  residual: Snapshot possession doesn't prove continuous custody or exclude earlier source transfer.
  risk: Keep him a serious rival; don't manufacture a radio alibi covering twelve minutes.
- id: '06'
  agenda: Restore authorship and make Grant watch the stolen work humiliate his likeness.
  suspicion: Threatening anonymous note, false show permission, glass and staged collapse.
  crime_connection: Planned a donor collapse around the same evening's ceremony.
  early_plant: Hunt warning, rehearsal sketch and canceled console cue; Act I authorship; Act II staging.
  method_reinterpretation: Separate PROP glass tested clear and collapse cue never executed.
  residual: Cancellation of his announced stunt doesn't account for everything he could do privately.
  risk: Cyanide known in Act I already weakens a purely mechanical-collapse theory; this is not guaranteed to be a high-scoring rival.
- id: '09'
  agenda: Preserve his article, delay admitting Reed's contribution, obtain endorsement.
  suspicion: Sought information on actual poison contents and pressured Reed's silence.
  crime_connection: Knowledge of the historical source and a concealed research request.
  early_plant: Hunt historical acquisition and condition records; Act I delayed correction; Act II contents question.
  method_reinterpretation: Complete request concerns empty copy and coroner's report; correction was finally sent with Reed's name.
  residual: Refusal of authorized access isn't proof he lacked unauthorized access.
  risk: Professional research purpose must not become a certificate of innocence.
- id: '11'
  agenda: Preserve a controlled event and hide a bad security decision.
  suspicion: Camera disconnection, omitted warning, rejected request to stop toast, moved reception waste.
  crime_connection: Suppressed a relevant hazard and could affect disposal of the contaminated carrier.
  early_plant: Hunt work order and radio chain; Act I incident omission; Act II waste and officer's objection.
  method_reinterpretation: Separate cabinet alarm and preserved officer record distinguish negligence from disabling the theft alarm.
  residual: Serious opportunity and control remain; she isn't cleared by blaming Grant's assurance.
  risk: Do not count repeated unsafe decisions as independent forensic links to poisoning.
- id: '12'
  agenda: Recover recorder, protect a source and publish the museum investigation.
  suspicion: Threatened Grant, searched his coat, displaced a favor and folded paper, withheld identifying material.
  crime_connection: Portable carrier opportunity and deliberate interference with victim's possessions.
  early_plant: Act I recorder seizure and publication threat; Act II coat search and fallen items.
  method_reinterpretation: Recorded demand explains the search; wrapped coat favor and existing publication approval weaken the particular carrier/injunction theories.
  residual: Recording has gaps and source protection can conceal movements.
  risk: Wrapped victim's favor doesn't exclude access to her own; don't turn a recorder into continuous surveillance.
- id: '13'
  agenda: Conceal an unsafe approved rig and force review of Grant's subsequent revision.
  suspicion: Retrieved a pry bar and removed an approval after the mounting failure.
  crime_connection: Forced-opening means and concealed equipment near the installation.
  early_plant: Hunt mounting hold and console log; Act I unsafe approval; Act II retrieved tool.
  method_reinterpretation: Electrician's actual rig plan and test explain equipment and flickers, not camera failure.
  residual: Legitimate use of a lever does not rule out a second use at the cabinet.
  risk: A tool's general type is not a physical match to pry marks; no such finding is currently planted.
- id: '20'
  agenda: Obtain payment or remove disputed sculpture from display.
  suspicion: Moved victim's glass, set dusty case and favor beside it, pursued removal equipment.
  crime_connection: Direct target contact and a plausible portable container.
  early_plant: Act I payment/removal grievance; Act II invoice, case, favor and glass.
  method_reinterpretation: Plaster is exterior; his weighted favor remains sealed; estate retains the payment dispute.
  residual: Could use another favor or poison by another route; the seal isn't a continuous alibi.
  risk: Don't make the estate's continued liability a universal innocence formula.
- id: '23'
  agenda: Force authorization and payment for overworked catering crew.
  suspicion: Withdrew both available attendants and handled Grant's individual glass.
  crime_connection: Intentionally created the unattended interval and had direct target opportunity.
  early_plant: Hunt service authorization; Act I menu/payment conflict; Act II staffing and towel.
  method_reinterpretation: Clean food, sauce and punch resolve a batch-contamination theory; concealed menu substitution explains part of dispute.
  residual: Clean batch doesn't clear her direct glass access; she remains a strong rival.
  risk: Towel fibers are external and anonymous, not evidence she administered poison.
- id: '28'
  agenda: Control the family ownership narrative by withholding its least flattering letter.
  suspicion: Open case beside the victim's glass, removed speech cards, returned after leaving reception.
  crime_connection: Direct opportunity and transport container, with a dispute Grant could complicate.
  early_plant: Act I missing fourth letter; Act II open case and return.
  method_reinterpretation: Grant already possessed the adverse letter; its full contents survive with attorney.
  residual: Case can conceal other material and the letter explains selection, not all movements.
  risk: Searching papers alone may remain a weak murder hypothesis; report that honestly in testing.
- id: '30'
  agenda: Deliver a paid production while forcing an interruption of donor branding.
  suspicion: Hidden blackout, rejected cue removed, glass moved to correct card, unauthorized wage promises.
  crime_connection: Concealed event interruption and direct target contact.
  early_plant: Hunt canceled show log; Act I blackout and wages; Act II saved cue and glass.
  method_reinterpretation: Safety override prevented blackout; actual later flicker is an electrician test on separate camera power.
  residual: Canceling a show cue doesn't clear the glass handling.
  risk: Reserve role; active22 cannot depend on Minnie reading her explanation.
