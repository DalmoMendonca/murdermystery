schema_version: 1
status: complete
scope: Exact innocent Opportunity/Method replacements for the three legitimate replica workers only.
provenance:
  - docs/story-pass-19-SPOILERS/innocent-edits.yaml
  - docs/story-pass-19-SPOILERS/continuity-edits.yaml
  - docs/story-pass-18-SPOILERS/evidence_design.yaml
private_fixed_changes:
  replica: >-
    A dark-blue display copy of the historical original, with an open bottom. Replace
    the earlier clear-glass replica consistently in fixed records, art and spoken copy.
    The open bottom is observable to handlers, but public release of that construction
    detail waits until Method evidence in Act III.
  original: >-
    Historical dark-blue bottle, closed base; intact neck in the 5:45 receiving record;
    secured in the locked cabinet and secondary case. Forced theft remains at 6:12.
  reception_returns_shelf: >-
    An ordinary staff-returns shelf behind the reception sideboard holds gallery parts
    awaiting staff collection. Establish this fixed layout in Opportunity evidence.
    It is a temporary work station; no authorization to store hazardous contents follows
    from its existence. There is no new logged shelf visit or continuous observer.
  public_identification: >-
    F3 reports a recovered dark-blue bottle at the returns shelf pending comparison.
    It does not identify that object as the original or disclose its base. Act III
    comparison establishes the recovered original's closed base and neck fracture;
    the display copy has an open bottom. No guest owns the recovered source by label.
workflow:
  receiving: >-
    At 5:45 Jordan secures the original in the existing cabinet/case chain. Cary delivers
    the dark-blue display copy on the gallery trolley. This records an earlier handoff,
    not anyone's later whereabouts.
  installation: >-
    Chip checks and positions that copy for installation, then takes it into his kit.
    At reception he empties the kit to find the treatment sheet, clears it for service
    and returns the copy to the kit. This is a workflow account, not an independently
    certified uninterrupted custody claim. The copy is in the kit when described in
    Method; no continuous possession through either crime window is asserted.
  security: >-
    After the alarm Barb checks gallery parts and the returns area as part of her
    existing route. She reports seeing the display copy with Chip's kit. That is a
    single observation without a new exact time or uninterrupted watch. It neither
    identifies F3's recovered object nor rules out another move or mistaken identification.
  contested_selected_account: >-
    A selected guest's claim to have put a loose supposed copy on the returns shelf is
    contested by the worker workflow, not automatically disproved by it. The guest may
    have mistaken the original, moved the copy before a later return, or misdescribed
    what happened. Independent source identification remains Act III. Do not turn
    these accounts into three certificates that the replica never left its route.
characters:
- id: '05'
  name: Chip Patina
  opportunity_innocent: >-
    I checked the dark-blue display copy Cary brought to the gallery and positioned it for installation. Jordan had secured the original. When the mount cracked, I shoved Grant back from the barrier and took the attendant's radio to call a hold. Later I emptied my kit at reception: tools, gloves and the copy. I wanted the original treatment sheet. Service needed space, so I cleared the kit. The report stayed in my jacket. I'd told collections to hold my receiving notes until I checked them.
  method_innocent: >-
    The inspection photographs show the crack; the console kept the hold. I recommended locked storage for the original and the display copy for installation. The copy is in my kit now: dark-blue body, open bottom. I put it back after clearing reception. The receiving folder contained my altered treatment date as well as the condition warning. I held it back to check the date. Someone needed that warning before service proceeded. It stayed in my folder because I wanted my own record checked first.
  reason: >-
    Retains shove, safety hold, exposed kit, altered date and withheld warning. Adds the
    legitimate copy's installation-to-kit route without certifying later movements or
    identifying the recovered object in Opportunity.
- id: '11'
  name: Barb Dwyer
  opportunity_innocent: >-
    I closed storage access and sent an officer to search when the alarm went. Grant said the bottle was empty. Collections objected and requested the auction condition; no reply came before the toast. I omitted that first radio exchange. On my route I checked the gallery parts and returns shelf behind reception. I saw the dark-blue display copy with Chip's kit. I shifted the waste basket away from the exit and told Casey to clear the sideboard. I wanted the room looking controlled.
  method_innocent: >-
    Camera and cabinet alarm are separate. The lock was forced. My officer kept the collections objection I omitted. The service order survived too. We should have secured the glass. I had Grant's word about the contents and used it. The copy with the kit has a dark-blue body and an open bottom. I was checking gallery parts while still trusting his assurance. My officer followed my orders. Leave her name out of the decision I made.
  reason: >-
    Preserves source-response negligence, radio suppression, disposal-area movement and
    failed target protection. Gallery check is a limited ordinary job observation, not
    a continuous replica watch or an advance source identification.
- id: '24'
  name: Cary Crates
  opportunity_innocent: >-
    I omitted the damaged-frame photograph. Courier kept a copy; Grant refused delivery. During receiving I signed the wrong trolley number and corrected it in pencil. At 5:45 Jordan secured the original in its cabinet and case. I delivered the dark-blue display copy to the gallery trolley for Chip. Grant had the delivery sheet, so I looked at reception. Had my tools, including the lever. Hadn't put them away. The shelf behind the sideboard is for gallery parts awaiting staff collection.
  method_innocent: >-
    Courier's picture: cracked frame. Jordan's: original intact and secured after trolley work. I delivered the dark-blue copy. Open bottom underneath; Chip has it in the kit. My lever went into the unsealed tool roll at reception beside the clipboard. I didn't force the cabinet or poison the glass. Wanted a clean job record. Should have attached the damage photograph.
  reason: >-
    Retains concealed frame damage, improper acceptance objective, corrected trolley
    number, intact original after receiving and unsealed lever availability. Legitimate
    delivery of the dark-blue copy establishes an earlier object route, not a later alibi.
