schema_version: 1
status: 'Round20 prototype: only Ella/Justin/Elon guilty routes authored; no all-culprit validation'
characters:
- id: '01'
  briefing:
    history: The resignation clause is real. My acceptance isn't. Grant wanted the board to remove me
      in return for his money, so I copied his signature onto a demand and sent it to the chair. Monet
      has the copy. I'm leaving anyway. Another museum offered me the job last month, and I haven't told
      the trustees. Please let me finish before you congratulate me.
    secret: You have already accepted a confidential offer to lead a rival museum next year, which makes
      any argument with Grant look like succession planning.
    objectives:
    - Find out whether Monet Bags has seen the governance addendum.
    - Quietly learn whether Claire O’Scuro would stay if you left.
    - Do not volunteer your job offer unless pressure forces it.
  hearings:
    motive_innocent: Could we stand clear of the entrance? Grant's gift agreement required my resignation
      within sixty days. I had already accepted another museum's offer. There was no need to fight over
      leaving; I fought over who would describe it. The chair wanted the gift, and I wanted her refusal
      of his terms in writing. I copied his signature onto a demand and sent it to her. She asked why
      his letter had come from my printer. I was still supposed to welcome the guests.
    motive_murderer: Grant's agreement required my resignation within sixty days. I had another job, so
      everyone assumed this could be settled graciously. Six years of work, and I was expected to host
      the evening that handed it away. I copied his signature onto a demand to force the chair's hand.
      She recognized my printer. He would get his agreement, a successor would get the institution, and
      I would leave with a forgery to explain. I wanted the chair to reject his conditions before he announced
      them.
    where_innocent: Yes, I replaced his announcement. The governance agreement required my resignation
      within sixty days. My version made the gift and agreement subject to board approval instead of announcing
      the arrangement as settled. The speech folder was beside the reception sideboard. His assistant
      took both pages when I said Grant could speak after signing mine. I followed her halfway to the
      office. Then a guest wanted welcoming, which was at least a question I could answer.
    where_murderer: I replaced his announcement with one requiring board approval of the governance agreement.
      His assistant took the folder away. I returned to reception with the acknowledgment cards. Grant's
      new star glass already had punch in it; I wasn't interrupting preparation. I put the cards beside
      it and waited for my version to come back. I was still supposed to welcome people.
    evidence_innocent: Could someone bring back that folder? The assistant kept both announcements. Mine
      requires board approval of the governance agreement, including my departure. I also asked Brie to
      delay the toast and let Brie believe the chair had ordered it. Her actual reply was to stop using
      her name. I didn't touch the glass. Give her both speeches with the forged demand. I wanted her
      to reject the bargain before I resigned, although I already had another job.
    evidence_murderer: 'I didn''t watch Casey pour it. I saw a glass arranged for the donor and assumed
      service had finished. Yes, I described it rather more confidently than that. I wanted you to understand
      why I returned: the assistant brought his announcement back unchanged. I moved the glass to straighten
      the cards. Nothing about that folder had been settled.'
  coming_clean:
    innocent: The chair will get both announcements, the forged demand and my job offer. Grant required
      my resignation within sixty days under his governance agreement. I wanted the board to reject that
      arrangement and let me describe my own departure. I didn't kill him. I did borrow the chair's authority
      after forging his signature. Someone else ought to explain the delay to our guests. I've offered
      enough explanations on the museum's behalf tonight.
    murderer: I forced the cabinet at 6:12 and took the historical bottle. Its neck broke when I opened
      it; my favor carried the poison to Grant's glass between 6:32 and 6:44. I hid the original behind
      reception. The glass was empty. Calling it ready let me sound as though I had only straightened
      cards after service finished. They poured clean punch later. I killed him to stop the governance
      handover and my exposure, then went back to welcoming people.
  authoring_notes:
    status: Round19 candidate; briefing inherited and requires separate audit before kit integration
- id: '02'
  briefing:
    history: Reed, show them the qualification. The ownership review arrived six weeks ago. I left it
      out of the board papers because I thought the exhibition would be canceled. Grant now wanted that
      omission printed on the wall as settled ownership. I told him no. After making it remarkably easy
      for him to expect yes.
    secret: Against board instructions, you commissioned an independent provenance review and hid the
      preliminary report in the Registrar's Office.
    objectives:
    - Find out whether Dr. Art E. Fact has seen the same gap you found.
    - Learn who wrote the anonymous warning note.
    - Keep your independent report secret until you decide whom to trust.
  hearings:
    motive_innocent: An opening date is not evidence of ownership. Grant and the board accepted the gap
      because the lender had allowed the object here before. I commissioned an outside review against
      their instructions and withheld its preliminary findings. I wanted a definite answer before they
      made another announcement. Then I let the labels print while I waited. That was my decision, too.
      Grant wanted his gift announced tonight; I wanted the qualification read first, however much paper
      had already been paid for.
    motive_murderer: I let the labels print. Please don't turn this into a story in which I objected at
      every stage. I thought I could obtain the missing answer quietly and preserve the exhibition. The
      review made that impossible. Grant still wanted the permanent gift announced; the board wanted its
      opening. My name was on the scholarship supporting both. Withdrawing it would expose what I had
      withheld and destroy the exhibition I had spent years making. I wanted to prevent the announcement
      without surrendering the work.
    where_innocent: I replaced the ownership proof at reception. The qualification belonged there. Grant's
      original went into my folder. Earlier this week I sent the review to the lender against the board's
      wishes. Tonight I was waiting for their answer. I wasn't leaving his wording available for somebody
      to put back.
    where_murderer: I replaced the ownership proof with a qualified version and put the rejected one in
      my folder. The lender's answer belonged beside it. Grant's new donor glass was already filled with
      punch when I laid the folder down at reception, so I wasn't occupying a preparation space. I was
      insisting the qualification remain visible before anyone announced a permanent gift.
    evidence_innocent: The lender's reply arrived before the theft alarm. No permanent transfer while
      the claim remained unresolved. Both proofs and the report are here; the registrar kept my dated
      submission. The trustees could have ignored the refusal. I would have withdrawn the exhibition.
      All of it. I didn't touch the glass.
    evidence_murderer: The lender refused the transfer. That did not prevent an announcement. As for the
      photograph, I can't give you a better view than the one you've shown me. I thought the glass contained
      punch. I lifted it off the proof; I didn't examine its interior. If you want my qualification withdrawn
      because I described the glass badly, you have misunderstood what a qualification is for.
  coming_clean:
    innocent: I withheld the review, sent it outside the institution and let the labels print. The lender's
      refusal preceded the theft. I intended to stop the permanent gift with it. I didn't poison Grant.
      Put the qualification back. Remove my name if you wish; the ownership record is still missing.
    murderer: I forced the cabinet at 6:12 and took the original. I broke its neck, carried poison in
      my favor and put it in his empty glass between 6:32 and 6:44. The original went behind reception.
      I knew the glass wasn't filled; I said otherwise to make my visit sound like an argument over papers
      after preparation. Service added clean punch afterward. I wanted the announcement prevented without
      losing the exhibition. I killed him to keep the work.
  authoring_notes:
    status: Round19 candidate; briefing inherited and requires separate audit before kit integration
- id: '03'
  briefing:
    history: The certificate is a forgery. I didn't make it. I did alter our file afterward so it looked
      as though I'd checked the thing before selling it. Grant wanted a refund the firm can't pay. Then
      he began telling people I'd forged the certificate itself. Sue, that's two accusations. I'll accept
      one. I'd rather neither became the title of the auction firm's next press release.
    secret: You were duped on that sale, but you quietly altered your own file afterward so clients would
      not see how badly your due diligence failed.
    objectives:
    - Learn whether Saul D. Bid knows about the disputed certificate.
    - Keep Elon Mosaic from discussing the 'auction incident' in public.
    - Figure out what Paige Turner knows about the Geneva freeport records.
  hearings:
    motive_innocent: Grant was entitled to a refund claim. Millions, unfortunately. The certificate was
      forged before it reached me. I altered our checking record afterward. We offered settlement terms;
      he wanted my personal guarantee. I took the papers back. The firm sold him the object. I was not
      signing my house into the bargain.
    motive_murderer: We could not refund him outright. A settlement would have kept the firm trading,
      but Grant rejected it and demanded my personal guarantee. I had made that easier for him by improving
      the checking record after the sale. He did not have to invent a scandal; he could sue on the file
      I had supplied. Clients were already asking which version to believe. I could lose the firm and
      my home together. I kept offering terms, and he kept asking for my signature.
    where_innocent: A settlement is an invitation to negotiate. A personal guarantee is an invitation
      to pay twice. I took the unsigned envelope back from reception and kept the torn draft in my pocket.
      Yesterday I'd told Grant he would never see a penny. Our attorney had already told him the claim
      would survive his death, so that flourish achieved very little. Still, someone had added the guarantee,
      and I wasn't signing it to improve the atmosphere.
    where_murderer: I withdrew the settlement envelope. The personal guarantee was not in the terms we
      had negotiated. I stayed at reception to read it again, beside Grant's new star glass, which already
      contained punch. Surely I could review a demand there once service had finished. Yesterday's email
      said he would never see a penny. I kept the torn draft rather than circulate that too.
    evidence_innocent: Our attorney has the earlier draft. The added guarantee is in another hand. And
      the late ticket receipt? I collected the ticket late. I was here before the alarm. The file alteration
      remains my problem; the estate still expects the firm's answer. Shall we discuss the guarantee?
      That was the price I declined.
    evidence_murderer: I arrived before collecting my ticket. Let's dispose of that misunderstanding.
      The glass? I believed it was filled. I moved it to put the guarantee flat and wasn't watching the
      catering. Your photographs make my description look careless. The attorney's two drafts still show
      what was added. You can take both drafts; I won't sign either one simply to improve your opinion
      of me.
  coming_clean:
    innocent: Keep the email and checking file. The forged certificate reached me before I altered our
      record. I refused a guarantee; I didn't kill Grant. The estate clause and investigation survive
      him. The late ticket receipt was collection, not arrival. Our attorney has both drafts. I can't
      negotiate either out of existence.
    murderer: I forced the cabinet at 6:12 and took the original. I broke its neck, carried poison in
      my favor and contaminated his empty glass between 6:32 and 6:44. Then I hid the bottle behind reception.
      Service added clean punch later. I described a finished drink to make my lingering over the guarantee
      sound ordinary. I couldn't save the firm or my house by offering another set of terms. I killed
      him.
  authoring_notes:
    status: Round19 candidate; briefing inherited and requires separate audit before kit integration
- id: '04'
  briefing:
    history: Restricted funds paid payroll. Unauthorized transfer. The wages were due, and I borrowed
      against the promised gift. Grant found the transfer and wanted his private-wing costs buried in
      it. I refused. The bank doesn't care that I refused the second transaction. Neither, apparently,
      will Monday's auditor. Artie knew about the wages. He didn't know where the money came from.
    secret: You temporarily moved money between internal accounts to cover a cash-flow shortfall, intending
      to reverse it after the gala. It was technically unauthorized and Grant discovered it.
    objectives:
    - Find out whether Sue Venir has seen Grant's draft funding agreement.
    - Keep Artie Ficial from learning about the temporary transfer unless absolutely necessary.
    - Identify who found the donor ledger during the scavenger hunt.
  hearings:
    motive_innocent: Payroll cleared. Restricted money paid it. I authorized that transfer. Grant's pledge
      was supposed to refill the account; his wing arrived with costs nobody had budgeted. I removed the
      finance page. Artie thought I was updating it. I needed spendable money, and Grant wanted another
      course released. Which account was paying for that?
    motive_murderer: His pledge would cover the transfer only if we accepted the wing's operating costs.
      I ran the numbers three times. We would clear this year's payroll and start next year unable to
      meet it. I had already moved restricted money, and concealed the page that showed why. Grant would
      not revise the gift; the board would not lose it. I was expected to make the account balance and
      accept suspension when it didn't. I wanted the finance pack withheld until somebody agreed to read
      the deficit.
    where_innocent: Grant told the kitchen I'd authorized another course. Casey came off reception to
      ask again; I kept Casey there while ringing the supplier. Then I froze the outstanding gala payment,
      including Brie's legitimate balance. The signed refusal ended up beside the waiting glass. I wanted
      Grant asking for my signature for once.
    where_murderer: I kept Casey in the kitchen while I rang the supplier about authorization. Then I
      went back to reception with the payment refusal. Grant's new star glass already held punch. His
      toast was ready; I had stopped an unapproved course, not dismantled the evening. I left the refusal
      beside the glass. If he wanted dinner restored, he could read the account first.
    evidence_innocent: 'Check the supplier''s copy: payment hold. The extra course never left the kitchen,
      and the punch tested clear. Now, the finance page. I tore it in half, which was a stupid thing to
      do to figures I still needed to reconcile. I kept both halves; they''re in my bag. The auditor will
      get the whole pack. Including the transfer. I would like five minutes to put it in order, but I
      imagine I''ve spent my allowance of five minutes.'
    evidence_murderer: Casey evidently hadn't finished that part of service. I assumed somebody else had.
      That's what happens when three people give the kitchen different instructions. I stayed beside the
      refusal and moved the glass off its envelope. Yes, I wanted Casey kept in the discussion. No, the
      figures didn't improve while we argued. They won't improve now by calling every instruction I gave
      the same instruction.
  coming_clean:
    innocent: I'll release Brie's legitimate balance and report the restricted-funds transfer. Her crew
      earned that payment. I used it to make Grant come back to the argument. I didn't poison him. The
      trustees need the whole finance pack, including the torn page and the wing's operating costs. Payroll
      cleared this year. Accepting a gift we couldn't afford to operate wouldn't keep it clearing next
      year. I should have put that before them instead of removing it.
    murderer: I forced the cabinet at 6:12 and took the original. I broke its neck and carried poison
      in the favor to his empty glass during the service gap, between 6:32 and 6:44. The bottle went behind
      reception. I knew Casey hadn't filled it. Saying the toast was ready made my interruption sound
      smaller. Clean punch went in later. The concealed transfer and the wing's deficit wouldn't disappear
      with him. I killed him because I couldn't make either side change the bargain.
  authoring_notes:
    status: Round19 candidate; briefing inherited and requires separate audit before kit integration
- id: '05'
  briefing:
    history: That's my treatment report. The date is wrong because I changed it for an insurance deadline.
      Grant wanted a recent repair called ancient. I wouldn't sign that. He had a copy of the wrong date
      and made sure I knew it. If you're going to examine my work, use both copies. He's been showing
      everyone whichever one gets him what he wants.
    secret: You changed the date on a minor treatment record last month to spare the museum an embarrassing
      insurance dispute. No object was harmed, but the falsification could end your career.
    objectives:
    - Find out whether Cary Crates has noticed the altered treatment date.
    - Ask Dr. Art E. Fact what he thinks the Star Bowl's modern adhesive means.
    - Keep the insurance issue separate from the murder investigation.
  hearings:
    motive_innocent: By the edges, please. That photograph is a condition record. Grant wanted the repair
      described as original workmanship; I refused, and he preferred another conservator's opinion. He
      is entitled to commission one. He is not entitled to replace the object in my report with the object
      he wishes he owned. I changed a treatment date last month to get an insurance claim inside its deadline.
      I took that report back from him tonight. I should have left the receiving notes available to collections.
    motive_murderer: Grant intended to proceed with a private conservator who would approve the display.
      My treatment-date alteration made it difficult to insist that my records deserved more trust. That
      was my fault. The crack was still real, and the repair was still recent. I had cared for these objects
      for thirty years; now my warning was being treated as an obstacle somebody could pay to remove.
      I wanted Grant prevented from taking the collection out of my hands. I could not bear the thought
      of watching the damage afterward.
    where_innocent: 'I checked the dark-blue display copy Cary brought to the gallery and positioned it
      for installation. Jordan had secured the original. When the mount cracked, I shoved Grant back from
      the barrier and took the attendant''s radio to call a hold. Later I emptied my kit at reception:
      tools, gloves and the copy. I wanted the original treatment sheet. Service needed space, so I cleared
      the kit. The report stayed in my jacket. I''d told collections to hold my receiving notes until
      I checked them.'
    where_murderer: I stopped the unveiling over the cracked mount. Then I opened my kit at reception
      for the treatment sheet. Tools out, papers everywhere; hardly elegant. Grant's new donor glass already
      contained punch, so I took the space left around it. I cleared the tools when asked and stayed with
      the report. Collections wanted my receiving notes. I wanted the date checked before they went out.
    evidence_innocent: 'The inspection photographs show the crack; the console kept the hold. I recommended
      locked storage for the original and the display copy for installation. The copy is in my kit now:
      dark-blue body, open bottom. I put it back after clearing reception. The receiving folder contained
      my altered treatment date as well as the condition warning. I held it back to check the date. Someone
      needed that warning before service proceeded. It stayed in my folder because I wanted my own record
      checked first.'
    evidence_murderer: I should have said the glass appeared ready. I was checking the report, not doing
      a condition examination of a drink. I moved the glass away from the paper before putting the sheet
      back in my kit. You have the collection photograph; keep it. I held back the receiving folder, and
      that's an omission I can explain without pretending the cracked mount was imaginary.
  coming_clean:
    innocent: The insurer gets the original report. Collections gets the withheld folder. I changed the
      date and kept a warning unavailable while checking my records. I didn't poison Grant. I'd still
      stop that failed mount. The bowl stays off display until it's safe. Whoever takes over needs the
      entire report.
    murderer: I recommended storage, then forced the cabinet at 6:12 and stole the original. I broke its
      neck and used my favor to carry poison to his empty glass between 6:32 and 6:44. I hid the bottle
      behind reception. I said the glass contained punch so my kit looked like work around completed service.
      The punch was added later and was clean. I wanted the collection kept in my hands. That is why I
      killed him. The cracked mount was still real.
  authoring_notes:
    status: Round19 candidate; briefing inherited and requires separate audit before kit integration
- id: '06'
  briefing:
    history: I wrote RETURN WHAT WAS TAKEN. My piece. My credit. Grant put his foundation's name on a
      performance he hadn't even watched in rehearsal. It ends with an empty donor jacket collapsing.
      He canceled the performance and kept the effect for his film. No, I didn't ask graciously for an
      acknowledgment. I asked for my work back.
    secret: You wrote and planted the ominous anonymous warning note about 'returning what was taken.'
      It was meant as an art-world provocation, not a literal threat. Your canceled stage effect uses
      a glass marked PROP; it has no poison and belongs in the padded performance case.
    objectives:
    - Enjoy watching people overreact to your warning note without admitting you wrote it.
    - Find out whether Minnie Malist changed the lighting cue you designed.
    - Get Vincent Van Faux to admit he still owes you credit for an old collaboration.
  hearings:
    motive_innocent: RETURN WHAT WAS TAKEN. My note, my capitals. Grant's foundation canceled my performance
      and kept its jacket-collapse effect for a film. There are people who call that adapting a commission.
      I call it an adaptation when they keep the artist. I planted the note and asked for my closing cue
      restored without telling the operator the piece had been canceled. Grant was meant to watch an empty
      donor jacket fall. Yes, I wanted him uncomfortable. Comfortable patrons have done very little for
      this particular work.
    motive_murderer: 'The foundation had recording rights, not authorship. They canceled my appearance
      and kept the effect. Grant considered the disagreement settled: the invoice was paid. I wrote the
      note and demanded my cue. He treated both as entertainment he''d bought. My career had become material
      for his production. I wanted my credit restored before they screened a single frame.'
    where_innocent: Artie approved restoring the cue. That was what I told the operator. Artie, you may
      object now; I have finished borrowing your authority. I brought out the rehearsal glass and the
      empty jacket for Grant to see. The mounting hold canceled the sequence, so I carried the jacket
      away and left the PROP glass by the stand. Reception had my credit sheet. I went to fetch it because
      my name deserved to be visible where his glass was waiting.
    where_murderer: I told the operator Artie approved restoring my cue. Artie hadn't. I carried the rehearsal
      card to reception because I wanted it beside the donor's program. His new star glass was full of
      punch already; there was time for the performance discussion while the toast waited. I stayed to
      make sure nobody quietly removed the card again. They are very efficient at canceling artists here.
    evidence_innocent: Turn the rehearsal glass over. PROP is written underneath it. The test was clear,
      and the console saved both my request and the cancellation. We never performed the collapse. Don't
      look relieved on my behalf; I wanted the man humiliated. Watching his reaction was the entire point.
      He had taken my work, and I wanted him to recognize it in front of everyone. Calling it a little
      prank is rather the sort of theft we were arguing about. I brought a rehearsal glass and an empty
      jacket. He was meant to see a performance.
    evidence_murderer: Then the toast wasn't waiting. I saw the arrangement and supplied the rest; artists
      do sometimes supply the rest. I moved his glass to uncover the rehearsal card. The actual PROP glass
      had gone back on its stand, with the marking underneath. Don't turn those into one glass because
      I wanted a canceled effect restored. I had quite enough difficulty persuading anyone to look at
      the right one. The operator saved my request. At least somebody kept a record that I existed in
      this production.
  coming_clean:
    innocent: I wrote the warning and lied about permission. I wanted my credit back and his foundation's
      evening interrupted. The recording rights are disputed; the authorship isn't something I intended
      to surrender with an invoice. I didn't kill him. The collapse was canceled, and the PROP glass tested
      clear. I wanted Grant watching the effect he had retained without me. I won't abandon that claim
      because he can no longer watch anything.
    murderer: I forced the cabinet at 6:12 and took the original. I broke its neck, carried poison in
      the favor and put it in his real, empty glass between 6:32 and 6:44. The original went behind reception.
      The PROP glass wasn't involved. I invented the punch already waiting so my return sounded like one
      more attempt to restore a cue. Service poured clean punch later. Grant was meant to watch my collapse
      effect. I killed the man I wanted watching it.
  authoring_notes:
    status: Round19 candidate; briefing inherited and requires separate audit before kit integration
- id: '07'
  briefing:
    history: I bought the student paintings anonymously. Grant kept the worst one. When Claire asked for
      a recent work, he lent that thing and called it a retrospective. I painted over his signature on
      the loan form. The form, not the painting. Reed had to ask me that twice. It was a stupid little
      revenge. I was considering a larger, stupider one when he put the label on the wall.
    secret: You have secretly used buyers to acquire several of your own early paintings so you could
      remove them from circulation. The art world would find that both vain and market-manipulative.
    objectives:
    - Find out whether Ella Gance knows you were behind the anonymous buybacks.
    - Persuade Claire O’Scuro that the student painting should not be displayed.
    - Avoid giving Drew Conclusions a quote you will regret.
  hearings:
    motive_innocent: It is my painting. Being dreadful doesn't alter that. I was nineteen; Grant bought
      it years later, and now Claire thinks it belongs beside the mature work. I offered to buy it back.
      He declined. Apparently a museum audience should be allowed to judge my beginnings, which is a principle
      I admire in other painters. I've used proxy buyers to retrieve early pictures before. I lost my
      temper over this one and turned it face inward. You can have the picture or the pleasant version
      of me tonight.
    motive_murderer: Everyone says it shows my development. They mean people will laugh first and then
      look at the other paintings. Grant owns it, Claire selected it, and neither wants my permission.
      I have spent years buying the early work back through other people. If that came out, they'd call
      the prices artificial and the later success vanity with a dealer attached. Grant intended to keep
      lending this picture. I couldn't buy his agreement, and I couldn't stand another opening built around
      the painter I had tried to erase.
    where_innocent: I took the painting off the stand. His painting, yes, thank you; nobody has let me
      forget that. I put it face inward in an installation crate before the opening. My dealer had spent
      the week trying to arrange a purchase. Tonight I told her I'd rather ruin the show. She kept that
      message. I left the rejected label at reception for Grant. An empty stand with a bad label seemed
      an honest account of our collaboration.
    where_murderer: I turned the painting inward and had it taken off the temporary stand. Grant still
      owned it. I left the label at reception for Claire to reconsider, beside his new donor glass with
      punch already in it. Nothing needed that space for pouring anymore. I remained there because putting
      a label down is not the same as getting someone to agree to change it.
    evidence_innocent: It didn't go into my car. The crate tag and job photograph show it face inward
      before reception began. The brush-water bottle collected there tested clear. Then I went back for
      the label and argued with a trustee beside the sideboard, close enough to reach the glass. I was
      still angry. Would you have preferred an agreeable little artist waiting for his buyer's permission?
      I wanted Grant looking at the empty stand. I hadn't finished arguing with him.
    evidence_murderer: Apparently I gave you a finished picture of an unfinished service. I thought there
      was punch in the glass; I didn't inspect it. I shifted it to make room for the label. The painting
      was still inside the museum, and the crate tag will tell you where. I wanted that early work off
      the wall. I haven't changed my mind merely because you dislike what I did at reception.
  coming_clean:
    innocent: Grant owned the painting. I took it off display and paid proxies to conceal other purchases.
      My dealer has the records. I didn't kill him. The picture stayed here, face inward. I still want
      to buy it back. His death hasn't made me admire the painting. Claire is welcome to admire it for
      both of us.
    murderer: I forced the cabinet at 6:12 and took the historical bottle. I broke its neck and carried
      poison in the miniature to his glass between 6:32 and 6:44. It was empty. I hid the original behind
      reception. Saying the drink was finished made my label argument sound as though it couldn't interrupt
      preparation. The punch they poured later was clean. Grant kept lending the painting, and Claire
      kept wanting it shown. I couldn't erase that painter, so I killed its owner.
  authoring_notes:
    status: Round19 candidate; briefing inherited and requires separate audit before kit integration
- id: 08
  briefing:
    history: My opinion wasn't a title guarantee. Grant quoted the summary and omitted the qualification.
      I knew he was doing it. I kept the account anyway. The permanent-gift papers required my signature
      tonight. I withdrew it. The qualification is in the attachment; I would appreciate someone reading
      it before asking whether I advised a client to give away property he might not own.
    secret: Both versions of the memo still exist. You kept the original instead of destroying it, which
      could expose you to professional embarrassment and Grant to serious scrutiny.
    objectives:
    - Learn whether Mona Lott has obtained a copy of your original memo.
    - Keep Dr. Art E. Fact from publicly speculating about your legal advice.
    - Find out who has been searching the Registrar's Office.
  hearings:
    motive_innocent: I softened the opinion from indefensible to requiring further inquiry. Grant wanted
      the acquisition completed; I wanted his fees. I kept the original. Tonight he wanted a signature
      and intended to call my work approval. It was not approval. I refused and moved the pen. Do you
      want the two versions, or shall we keep discussing my choice of adverbs?
    motive_murderer: Grant had paid for advice and believed I had found a lawful way through. I had encouraged
      that belief. Now he wanted to announce the gift using my name, and I could either contradict him
      publicly or let the softened opinion become a guarantee I had never given. The first version would
      show how far I had moved for a client. I wanted the fees, the firm's standing, and the right to
      describe myself as independent. I refused the final signature, while hoping he would pay the outstanding
      invoice.
    where_innocent: I crossed out the permanent-gift signature line and took the packet to reception for
      copying. My case held an unsigned estate instruction Grant requested last month. I concealed it
      behind the opinion when asked. My clerk kept the dated instructions. Shall we read the document
      before discussing my inheritance?
