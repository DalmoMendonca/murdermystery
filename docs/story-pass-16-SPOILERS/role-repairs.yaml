status: private-prototype
characters:
- id: '18'
  opportunity: >-
    I took the textile off its display and rolled it up. Claire asked for the loan form; I tore my signature off the bottom. That didn't withdraw a loan properly. I wanted the photographs stopped before Grant could claim he'd bought it. The relatives had sent me a message forbidding the sale. I hadn't shown it to anyone. I still wanted to be the person who'd brought the collection to the museum.
  innocent: >-
    The message is on my phone. Claire has the roll and the torn form. The loan wasn't mine to authorize, and the proposed purchase isn't signed. The wool fibers are from that roll. It's now back with the family courier. I don't get to decide that a prestigious wall is worth more than their refusal. Mona, you can tell them I finally listened.
  guilty: >-
    The purchase isn't signed. My gift bottle was tucked into the roll when I took it to the sideboard. I removed it beside Grant's glass before collecting the loan form. The relatives had refused the sale. He was still going to announce it. I couldn't take the textile home after letting him put that version of the story into the photographs.
- id: '21'
  opportunity: >-
    The replacement painting arrived while Grant was talking to Minnie about the acknowledgment. I asked her to change it. Then I took his copy of the promised gift off the desk. It named the painting I'd already sold. I told Monet the proceeds were committed elsewhere and weren't available to restore the pledge. They are available. I just didn't intend to give them to him.
  innocent: >-
    The buyer has the original painting and my sale receipt. Minnie corrected the acknowledgment to name the replacement. There is no original here to unveil. I arrived after the bottle theft was reported; the receipt records my first entry, not ticket collection. My unopened favor is still in its packet. Monet can demand the sale proceeds. She can't demand the painting from its new owner.
  guilty: >-
    Minnie corrected the acknowledgment. I came before the theft report; the later receipt was for collecting my ticket. I had the gift bottle inside my pledge envelope at the sideboard. I removed it beside Grant's glass before changing the card. The original painting was already sold. He wanted me to admit that to the entire room while he thanked me for it.
- id: '22'
  opportunity: >-
    I took the newsletter proof out of Paige's press pile. It had the sponsor's payment on the back. Grant wanted the original before he'd give me the exclusive. I said I'd thrown it away. Then Justin recognized a phrase from a conversation he'd had with me, and asked why it was in the anonymous newsletter. I hadn't invented the joke. I'd invented permission to publish it.
  innocent: >-
    Paige kept another proof. The payment was for a sponsored item, not a promise that Grant's new museum name would appear in the next edition. Justin's conversation wasn't mine to sell. I'll identify the sponsored item and withdraw his quotation. I won't print Grant's prepared correction. My favor bottle is unopened; use the paper proof if you want evidence of something I actually opened.
  guilty: >-
    Paige kept another proof. My gift bottle was rolled in the copy I took back from the press pile. I removed it beside Grant's glass while gathering the pages at the sideboard. Justin hadn't authorized the quotation. Grant wanted the payment printed beside my name and his preferred correction printed instead of the story. He wasn't going to offer those as separate choices.
- id: '25'
  opportunity: >-
    I took the petition to the desk and laid it across Grant's speech. Artie asked me to remove his endorsement; I refused until he answered the signatures. Then Monet showed me the proposed cuts. I tore up Grant's offer to keep one class. The educators were waiting for me to tell them whether they would have jobs. I told them he'd never get his donor lounge. I didn't know how I'd stop it yet.
  innocent: >-
    Monet kept the offer. It cuts the staff positions even if that class survives. I withdrew Artie's endorsement and sent the petition to the trustees with my own name. It doesn't save the jobs by itself. I was collecting signatures at the education desk when the toast was served, not preparing the drinks. The school-tour sign-up is beside the petition, if someone still wants the teaching room to have a use.
  guilty: >-
    I withdrew Artie's endorsement. My gift bottle was folded into the petition when I returned to Grant's sideboard. I removed it beside his glass before taking the speech off the signatures. Monet kept the offer. It saved a class and dismissed the people who taught it. I had told them the lounge would never happen. Grant was minutes from announcing it.
- id: '26'
  opportunity: >-
    Hugh asked for the picture Grant made me delete. I gave him a crop without the shipping papers. Paige asked for the full print. I said the crop was all I had left. It wasn't. I kept the full print in the envelope with the negatives. Grant had paid for portraits, and I let him decide which business encounter could be erased from the evening.
  innocent: >-
    The full print is here. The shipping papers were between Grant and Hugh, not signed by me. The bottle marked FIXER is from my film case; the lab result clears its contents. My gift fragrance is a different bottle, still capped. Hugh can complain that I cropped his papers. He can also explain why Grant wanted those particular papers out of the photograph.
  guilty: >-
    The full print is here. The studio bottle was fixer; the gift bottle was wrapped in my print envelope at the sideboard. I removed it beside Grant's glass while taking the rejected crop back. Hugh wanted one version, Paige another, Grant neither. I had already agreed to delete something for him, and he was coming back to see that I finished the job.
- id: '27'
  opportunity: >-
    Barb found the protest stickers. I took them back and slipped them into the delegation's brochures. Then I covered the ownership caption after promising to leave it alone. Mona asked whose permission I thought I had. Not hers. The people whose objections I was publicizing hadn't agreed to this particular protest. Grant had asked for another notice banning me from the museum.
  innocent: >-
    The delegation issued its own objection without my stickers. The ownership caption is still beneath the removable paper, and Claire has both versions. I didn't damage the object. Barb can ban me for breaking the promise I made her. She can't describe that promise as the delegation consenting to Grant's ownership. I'd like to stop making their case harder for them while trying to make it louder.
  guilty: >-
    Claire has both caption versions. The gift bottle was in my brochure wallet when I returned to the reception desk. I removed it beside Grant's glass while collecting the notices he'd prepared for Barb. The delegation didn't approve my stickers. He wanted that to become the answer to their ownership objection. I had no intention of letting another notice close the discussion.
- id: '28'
  opportunity: >-
    Sue asked for the complete archive. I gave her three letters and kept the fourth. Grant had a copy of that fourth letter, naming my grandfather. I offered to withdraw the ownership objection if he returned it. He laughed. I moved his speech cards while looking for the copy on the desk. They weren't the copy I wanted. I took them anyway, which should tell you how badly that negotiation had gone.
  innocent: >-
    Sue now has all four letters. The fourth names my grandfather as an intermediary, not the owner. The family can still pursue the claim, and it can no longer call him an innocent observer. The speech cards were blank on the back. I put my capped favor beside them while sorting the papers; it came back in my case. Grant's copy belongs with the archive, not in another bargain over who stays silent.
  guilty: >-
    Sue has three letters. The fourth was still in my case with the gift bottle when I went back to the desk. I removed the bottle beside Grant's glass while looking through his speech cards. I knew he had the letter. He was going to turn the family's claim into a story about my grandfather, then offer to buy the family's silence again.
- id: '30'
  opportunity: >-
    The operator discovered my hidden blackout. She canceled the cue and asked who would pay her if the donor walked out. I told her to bill the museum. Monet hadn't authorized that. Then I took the rejected lighting drawing off Grant's desk. He had restored his name in the sequence and was calling the design a foundation project. I'd been preparing to sabotage a program that still had my crew's wages attached to it.
  innocent: >-
    The operator's earlier file shows my blackout; the cancellation shows it never ran. The security camera had its own circuit. My drawing is back with the job sheet, and the museum hasn't agreed to pay that extra invoice. I owe the operator an apology and an accurate payment instruction. Ella's acknowledgment was corrected separately. Stop calling all the canceled things one technical failure.
  guilty: >-
    The operator canceled my cue. The gift bottle was rolled inside my lighting drawing when I took it to Grant's sideboard. I removed it beside his glass before changing the placement card. Monet hadn't authorized the invoice I'd promised. Grant was about to claim the design and leave me to explain the wages. The operator had stopped the blackout; she hadn't stopped his announcement.
