  innocent: The two treatment reports are in the kit. The date changed. The repair didn't become ancient. Jordan
    has my objection requiring locked storage and a replica. The replica is open at the bottom; the little
    bottle beside it was my gift fragrance. Both were collected with the tools. The original was stolen from
    storage. That wasn't a preview I approved.
  guilty: Both reports are in the kit. There was another bottle there before the theft was reported. I carried
    it to the reception and removed it beside Grant's glass while everyone was asking about the mount. The
    replica I recommended was never the dangerous object. My report gave him leverage over me, and my objection
    hadn't stopped him using it.
- id: '06'
