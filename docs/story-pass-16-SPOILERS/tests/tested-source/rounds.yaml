schema_version: 1
status: Role-corrected; common favor plant; provisional speech draft
characters:
- id: '01'
  opportunity: Monet, don't call it a vote. I asked the chair to sign my version while the other trustees were
    getting drinks. It removes Grant from the board instead of removing me from the museum. The envelope was
    on the reception desk. I told his assistant there would be no announcement until he dealt with it. Yes,
    I used the word ultimatum. She wrote it down.
  innocent: The chair sent the envelope back, unopened. Her reply is attached to the draft Monet has. Grant
    never signed anything. His glass wasn't where I left the papers; the assistant took them to the office.
    I forged a signature to force a board dispute, not an agreement that would become valid when he died. Now
    there are two jobs I may lose.
  guilty: The chair sent the envelope back. I put it on the sideboard myself after his assistant refused it.
    There was my gift bottle in the envelope too. I took it out while arranging the papers beside his glass.
    The acknowledgment cards were back in the envelope afterward. His assistant had refused the demand, and
    he was still going to announce it as if the board had agreed.
- id: '02'
  opportunity: Reed had both label proofs. I took the new one from him, crossed out Grant's ownership claim,
    and told the delegation to photograph it before someone replaced it. Grant's assistant asked me to stop.
    I said she could call security. I had also sent the ownership review to the lender without the board's
    permission. Tonight's permanent gift could collapse because of what I sent.
  innocent: 'The lender''s reply is in Sue''s file: no permanent transfer until the claim is resolved. That''s
    why I sent the review. It hurts our exhibition and it protects the object. The folder the assistant collected
    contains that correspondence, not a bottle. Reed can complain about my edits; he can also show you the
    original pages. Please leave them in order this time.'
  guilty: I went beyond changing the label. I took my folder to the sideboard after the assistant collected
    the correspondence. A small bottle was still in its pocket. I removed it beside Grant's glass, then put
    the folder back with the proofs. I wanted his announcement stopped. Sending the review hadn't stopped it,
    and he had made that very clear.
- id: '03'
  opportunity: Elon refused my settlement. Saul's fee was still on the invoice, which made the offer insulting
    before I opened my mouth. I tore it up. Grant's assistant then produced my email saying he would never
    get his money back. That wasn't negotiation language. I'd been drinking when I sent it, and I wanted her
    to delete it before the trustees saw it.
  innocent: Keep the email. It means the firm can't pay the claim; it doesn't mean his death cancels it. Sue
    has the settlement draft naming his estate as a successor. My admission receipt is after the first report
    of the missing bottle. I had a torn offer in my pocket, not the purchase I would now like everyone to pretend
    I understood.
  guilty: Keep the email. I came earlier than the admission receipt suggests; that receipt was for collecting
    my ticket. I carried my gift bottle in my pocket with the torn offer. At the sideboard I took it out beside
    Grant's glass. Sue's draft mentions his estate. I wasn't thinking about the firm's liability when I did
    that. I was thinking about his next demand.
- id: '04'
  opportunity: I stopped Grant's extra course and put a hold on the transfer he'd been expecting. Then his
    assistant showed me a message about our payroll account. I deleted my copy while she watched. There is
    an audit scheduled for Monday. If the trustees saw that account tonight, they would have a reason to suspend
    me before dessert. I didn't tell Artie about the message.
  innocent: 'Two records survive my deletion: the bank''s transfer and the kitchen''s refusal. Brie can release
    her invoice. The kitchen never prepared the extra course I blocked. The deleted message offered to hide
    the payroll transfer if I approved Grant''s expenses. I refused, after borrowing the money in the first
    place. That''s a bad account. It isn''t a poisoned meal.'
  guilty: The bank and kitchen kept their records. I also carried my gift bottle in the catering envelope.
    At the sideboard I removed it while checking the papers beside Grant's glass. The manager was settling
    my refusal in the kitchen. I had just deleted an offer to hide the payroll transfer. I wanted the man who
    made that offer to stop making demands.
- id: '05'
  opportunity: Frank and I found the crack. I ordered the alcove closed, and Grant's assistant demanded my
