    history: The resignation clause is real. My acceptance isn't. Grant wanted the board to remove me in return
      for his money, so I copied his signature onto a demand and sent it to the chair. Monet has the copy.
      I'm leaving anyway. Another museum offered me the job last month, and I haven't told the trustees. Please
      let me finish before you congratulate me.
    secret: You have already accepted a confidential offer to lead a rival museum next year, which makes any
      argument with Grant look like succession planning.
    objectives:
    - Find out whether Monet Bags has seen the governance addendum.
    - Quietly learn whether Claire O’Scuro would stay if you left.
    - Do not volunteer your job offer unless pressure forces it.
