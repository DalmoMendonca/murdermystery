    signature anyway.
- id: '11'
  motive: I authorized the Donor Salon camera disconnection. Grant requested privacy. My officer objected,
    and I overruled her. Then I omitted the exception from the incident log. She kept her notebook, which you're
    entitled to read. The technician followed my order. If anybody blames the technician for the missing video
    again, I'll correct them again.
  opportunity_innocent: I ordered the camera disconnected. Grant asked for privacy, and I treated that as sufficient
    authority. When Jordan reported a collection bottle missing, I told the officer to search before logging
    it as a theft. There is now a gap in the incident book as well as the video. My junior officer kept her
    notebook. I asked her to hand it over. She refused.
  opportunity_murderer: I ordered the camera disconnected. Grant asked for privacy, and I treated that as sufficient
