  motive: My company was the anonymous buyer. Hugh bid. I negotiated a board-seat option without disclosing
    who owned the company. Grant lost the lot, found the invoice, and decided the buyer's identity belonged
    in his speech. I had paid for a private transaction. He wanted a public victory. It was going to be mine
