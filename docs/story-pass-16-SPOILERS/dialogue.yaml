    I ordered.
- id: '12'
  motive: Grant offered a settlement if I buried the ownership story. My editor had asked for one correction,
    not the story's funeral. I made the correction. Grant then wanted my source named as part of the settlement.
    That's when I stopped negotiating. He could sue the paper. He couldn't buy a person's name from me and
    call it a correction.
  opportunity_innocent: 'I showed Grant the draft of my investigation. He offered to identify a source if I
    removed the ownership story. I refused, then sent him a message: YOU WON''T SURVIVE THIS STORY. His assistant
    saved it. I took a page out of my notebook before security collected the papers. It has the source''s name,
    and I wasn''t giving it to the people the source was accusing.'
  opportunity_murderer: 'I showed Grant the draft of my investigation. He offered to identify a source if I
    removed the ownership story. I refused, then sent him a message: YOU WON''T SURVIVE THIS STORY. His assistant
