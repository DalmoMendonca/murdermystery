schema_version: 1
status: complete_author_draft
scope: Author-only alternatives; exactly one murderer branch is spoken in play.
author_constraints:
  crime: >-
    Each selected guest alone forces the cabinet and secondary case at 6:12, steals the
    historical original, carries poison in a common fragrance favor, contaminates Grant's
    empty reception glass between 6:32 and 6:44, and hides the original behind the sideboard.
    Clean punch is filled at 6:46; toast at 6:49; death at gala. No preparation details.
  staging: >-
    Motive is Act I; opportunity Act II; method Act III after comparison; Coming Clean follows
    accusations. Early gift stories never identify the recovered shard, color, disposal
    location or paper. Records corroborate limited facts, never continuous attendance.
    Historical consultations occur across weeks; no absent playing role supplies a mandatory alibi.
characters:
- id: '02'
  name: Claire O’Scuro
  motive_innocent: >-
    The provenance gap did not surprise Grant. I showed it to him twice. The second time,
    he suggested replacing me with someone who understood an opening date. I commissioned
    the outside review anyway, and kept it out of the board packet. Yes, that was concealment.
    I was trying to get a definite answer before twenty trustees produced twenty opinions.
    The preliminary answer was worse than I expected. I still let the labels go to print.
  motive_murderer: >-
    I have spent years making this exhibition defensible. Grant knew about the missing export
    file and decided the wall label would settle ownership. When I objected, he threatened
    my position. I commissioned an independent review without permission, then hid the
    preliminary findings. He could expose that whenever he liked. Apparently scholarly
    independence was to mean taking the blame for decisions he had already made. I wanted
    that announcement stopped before my name appeared beneath it.
  opportunity_innocent: >-
    I took the ownership proof off the reception pile and replaced it with a qualified version.
    The original went inside my folder. Someone can reasonably call that stealing a label;
    I was not going to leave two contradictory versions for the staff to choose between.
    Earlier this week I sent the review to the lender over the board's objection. Tonight,
    I was waiting for their answer and refusing to let Grant's wording become the only record.
  opportunity_murderer: >-
    At reception I replaced the ownership proof, put the rejected one in my folder, and
    made room for the lender's reply. Grant's glass was there with the programs. I noticed
    because the base was pinning a corner I needed. Also, my gift had broken. I wrapped
    it up rather than leave sharp rubbish beside everyone's papers. I was already in a
    bad temper; complaining about a favor was not going to improve the evening.
  method_innocent: >-
    Here is the lender's reply, received before the theft alarm: they would not consent to
    permanent transfer while the claim remained unresolved. It was an effective objection,
    if the trustees chose to honor it. I had no authority to promise they would. The folder
    contains both proofs and the report; the registrar kept the dated submission. I did
    not touch the glass. I did threaten to withdraw the exhibition, and I meant that threat.
  method_murderer: >-
    The lender's refusal was real. It did not prevent Grant from announcing a gift and calling
    the legal work someone else's problem. I returned to the sideboard with my folder,
    lifted his glass off the proof, and put it down again. My favor was open there. I told
    you it had broken because I wanted that to explain the mess. The comparison has made
    the explanation much harder to maintain. I would like to stop answering around that.
  coming_clean_innocent: >-
    I withheld a commissioned report and then circulated it outside the institution. Those
    decisions may cost me this exhibition. The lender's dated refusal explains why I believed
    I could stop the permanent gift without Grant's cooperation; it cannot account for every
    minute I spent at reception. I did not poison him. Put the qualification back on the
    label, even if you take my name off it.
  coming_clean_murderer: >-
    I forced the cabinet at 6:12 and took the original. Between 6:32 and 6:44 I used my favor
    to carry the poison to his glass, then hid the original behind the sideboard. The broken
    gift story covered the damage to that bottle. The punch was clean. I killed him because
    I could no longer tolerate hearing him announce my work on his terms. That is what I did.
  author_notes:
    causal: Lender correspondence precedes gala; no shared-assistant confrontation or curatorial access exemption.
    exoneration: Dated refusal supplies an effective nonviolent route and corroborates label intervention; no full alibi.
- id: '03'
  name: Hugh Bidder
  motive_innocent: >-
    The certificate was forged before it reached me. That is a distinction worth preserving,
    although I don't imagine it buys me much sympathy. I changed my own file after the sale
    to make the checks look more thorough. Grant discovered the alteration and asked for
    millions we could not return. Then he began telling clients I had manufactured the
    certificate. I wanted an agreed statement. He wanted me frightened enough to sign anything.
  motive_murderer: >-
    Grant had a claim against the firm. I had offered terms. He decided that was less enjoyable
    than telling people I forged his certificate. I didn't; I altered the checking record
    afterward, which is quite bad enough without his improvements. By tonight the refund
    demand had become a means of calling me whenever he wanted something. A fee waived,
    another introduction, another client frightened off. I could not see where it would end.
  opportunity_innocent: >-
    The settlement envelope was on reception. I took it back without signing because it
    demanded a personal guarantee as well as the firm's money. Yesterday I had emailed
    Grant that he would never see a penny. Unwise, obviously. The firm's solicitor had
    already told him that any claim survived his death; my email was a blustering refusal,
    not a clever estate strategy. I kept the torn draft in my pocket so nobody could circulate it.
  opportunity_murderer: >-
    I withdrew the settlement envelope from reception. It wanted my own assets added to
    the guarantee, a detail rather casually introduced after weeks of negotiation. I had
    my gift in the same pocket. It broke when I pulled the papers out; I tidied it away.
    I stayed by the sideboard to read the guarantee again. Grant's new glass was beside
    it, ready for a photograph. The whole place was arranged around making him pleased.
  method_innocent: >-
    My solicitor retains the earlier draft, including the estate clause. The guarantee I
    rejected tonight was added in a different hand. I can prove what I was objecting to,
    not that I never walked past a cabinet. I was here before the alarm, despite collecting
    my printed ticket later. That receipt should not be used as an arrival time. The altered
    file remains altered, and the firm still owes an answer to his estate.
  method_murderer: >-
    Yes, I arrived before collecting the ticket. I was letting you draw a convenient conclusion
    from the receipt. The torn guarantee was not the only thing in my pocket. I set my
    miniature down by the donor glass, then picked up the papers without taking the miniature
    away. I thought I had left an ordinary reception mess. Now you have a bottle from behind
    that furniture and a break that my little gift cannot explain.
  coming_clean_innocent: >-
    Keep the threatening email and the altered file. I will not negotiate them into innocence.
    I refused a guarantee; I did not murder the man asking for it. The estate clause survives
    him, and so does the fraud investigation. My late ticket receipt was a distraction I
    should have corrected sooner. There, you have one useful admission without my invoice
    for providing it.
  coming_clean_murderer: >-
    I took the original after forcing its cabinet at 6:12. My favor carried the poison to
    Grant's glass while it stood on reception between 6:32 and 6:44. I hid the original behind
    the sideboard and called the break a damaged gift. He drank clean punch from a glass
    I had contaminated. I wasn't protecting the firm's accounts by then. I wanted him dead,
    and I let you keep discussing the guarantee.
  author_notes:
    causal: Both branches arrive before theft; ticket is explicitly collection, never a guilty-only retcon.
    exoneration: Estate liability limits financial benefit; I retains early access and explicit threat.
- id: '07'
  name: Vincent Van Faux
  motive_innocent: >-
    I painted that thing when I was nineteen. It is dreadful. People insist that admitting
    this should make me more relaxed about seeing it on a museum wall. Grant bought it
    precisely because he knew I hated it. I have used other buyers to retrieve early work;
    yes, that distorts a market which everyone else here treats with such reverence. I offered
    him more than it was worth. He preferred the joke. I lost my temper.
  motive_murderer: >-
    You can laugh at the painting. I have laughed at it myself, in rooms where I chose
    to show it. Grant intended to hang it beside work that took me twenty years to learn
    how to make. I used proxy buyers to bring other early pictures home, and he knew it.
    He could turn my vanity into a market scandal and enjoy the unveiling at the same time.
    I wanted him to have one evening without an audience.
  opportunity_innocent: >-
    I took the painting off its temporary stand before the opening. Don't call it collecting
    my property. It was his property, and I knew that. I carried it to an installation crate,
    face inward, and left the rejected label on reception where he could find it. My dealer
    had been trying to arrange a purchase all week. I told her tonight that I'd rather ruin
    the show than let him use me in it. She saved the message.
  opportunity_murderer: >-
    I removed the painting and left its label on reception. It still belonged to Grant.
    The proposed buyback had failed; I wasn't going to stand smiling beside the thing.
    While I was gathering the label, I damaged my gift. Another cheaply packed object,
    a very small irritation in a rather large one. I bundled the remains up and got them
    out of the way. His toast glass was sitting there as if nothing had happened.
  method_innocent: >-
    The picture stayed inside the museum. The crate tag and the job photograph record it
    face inward before reception began; I didn't put it in my car. My brush-water bottle
    was collected there and tested clear. That result does not make my temper harmless.
    I went back for the label and argued with a trustee beside the sideboard. I could have
    reached the glass. I wanted him to find an empty stand, not die at it.
  method_murderer: >-
    The brush water was left in the crate. Stop treating everything I carry as the same
    bottle. My miniature went back with me to reception, where I shifted the donor glass
    to retrieve the label. I did not want it photographed pinning down my name. You have
    tested the brush water and found nothing. The other bottle and that joined break are
    the questions I have been trying to make you ask about something else.
  coming_clean_innocent: >-
    I took another man's painting off display and threatened to ruin the opening. I also
    paid people to conceal my buying. My dealer can supply those records without asking
    anybody here to remember where I stood. I didn't kill Grant. I would like my painting
    back, which is a grotesque thing to want at this moment. Unfortunately, I still want it.
  coming_clean_murderer: >-
    At 6:12 I forced the cabinet and took the historical poison bottle. I carried poison
    in the gala miniature and contaminated his glass on reception between 6:32 and 6:44.
    The original went behind the sideboard. I called its broken neck a damaged present.
    The picture in the crate was not enough. I wanted to hurt the man who kept showing it,
    and I poisoned his glass before it was filled with clean punch.
  author_notes:
    causal: Painting removal predates service; label retrieval supplies both branches' opportunity.
    exoneration: Clear brush water excludes named artist material only; I retains reach to target.
- id: '08'
  name: Sue Venir
  motive_innocent: >-
    I softened the opinion. You need not extract that word from me. The original said
    we could not defend this acquisition confidently; the replacement said further inquiry
    was advisable. Grant preferred to quote neither phrase and use my name as a guarantee.
    I kept both versions because I knew the distinction might matter. Keeping evidence of
    one's own compromise is a modest achievement. Tonight he wanted a signature that would
    make the compromise permanent, and I refused.
  motive_murderer: >-
    My original opinion would have inconvenienced Grant. The version he persuaded me to
    send was merely advisory, which let him pretend the problem was optional. I kept the
    first version. He knew that too. Tonight he intended to announce my approval, whether
    I signed the final papers or not. He had become accustomed to hearing me explain why
    something was impossible, then watching me find a way. I had helped teach him that habit.
  opportunity_innocent: >-
    I crossed out the permanent-gift signature line and took the packet to reception for
    copying. In my case was an unsigned estate instruction Grant requested last month.
    I concealed that behind the opinion when someone asked what I was carrying. A document
    about his death looked dreadful beside a refusal to sign his gift. It names no new
    beneficiary. My clerk's dated instructions show the work began well before this evening.
  opportunity_murderer: >-
    I withdrew the signature page and brought it to the reception copier. The estate draft
    in my case was unfinished; I did not want to discuss it with people reading over my
    shoulder. The favor in that case had suffered a break. I cleared it up before opening
    the file on the sideboard. That was the explanation I gave for the interruption. I
    had both opinions with me, and no intention of signing Grant's preferred version.
  method_innocent: >-
    Read the instruction itself. The beneficiary space is blank; there is no appointment
    of me or my firm. The clerk retains the earlier request, and the existing will remains
    in force. I moved the signing pen, not the donor glass. Nobody watched my hands continuously,
    so you have my account of that distinction. His estate may still proceed against us
    over the softened opinion. I do not acquire professional immunity because a client dies.
  method_murderer: >-
    The estate draft appoints nobody. I was content to have you pursue it, because it
    occupied everyone very nicely. I opened my miniature at the sideboard, beside the
    signature page and Grant's glass. It cannot be the broken object I said I had cleared
    away; the recovered one is intact. You can ask why I handled it there. You can also
    ask why I described the damage before anyone had asked me about a bottle.
  coming_clean_innocent: >-
    I will release the original opinion and the instructions for the estate draft. The
    dates matter. They establish prior legal work, not a continuous alibi. I made Grant's
    position appear safer than I believed it was, then tried to stop the final signature.
    I did not poison his glass. I understand perfectly well that the first admission does
    not oblige you to accept the second statement.
  coming_clean_murderer: >-
    I broke into the secured cabinet at 6:12. I used a common favor to bring poison from
    the original to his glass during the reception interval, 6:32 to 6:44, and hid the
    original behind the sideboard. The broken-gift explanation was mine. It concealed source
    damage, not a manufacturing defect. His punch was clean. I killed a client after spending
    months trying to make my own capitulations sound like legal judgment.
  author_notes:
    causal: Clerk's estate request is historical; no guest conscripted as alibi.
    exoneration: Blank draft and continuing liability answer death-benefit suspicion; handling denial uncorroborated.
- id: '13'
  name: Frank Lloyd Wrong
  motive_innocent: >-
    A last-minute change is usually an expense. Grant's was a danger. He wanted the
    centerpiece altered, then threatened our final payment if I objected. I had signed
    off a temporary lighting rig below my own standard. That gave him something to wave
    at me whenever I used the word safety. It was a poor compromise; I wasn't willing
    to make another. My firm needs that payment. The people who drew the plans have already
    been paid out of my overdraft.
  motive_murderer: >-
    Grant changed the centerpiece after we had installed it, then told me the firm would
    lose its balance if I refused. He also had my signed approval of a temporary rig I
    should have rejected. Every objection became an invitation for him to mention that
    signature. I can hear how precious an architect sounds complaining about a donor's
    taste. This was not a dispute over mauve. He was making me choose between my staff's
    wages and another design I could not defend.
  opportunity_innocent: >-
    I closed the alcove when the mount crack was found. Later I took the rejection drawing
    from reception and wrote REFUSED across it hard enough to tear the page. I also removed
    my own rig approval from the job folder. The electrician has her copy; taking mine
    solved nothing. I wanted the trustees to see Grant's dangerous request before they
    saw my earlier compromise. That is why the folder was rearranged, and why I was furious.
  opportunity_murderer: >-
    I closed the alcove, retrieved Grant's revision drawing, and marked it refused. My
    earlier rig approval was still in the folder. I wished it weren't. I had put my favor
    beside the drawing, where it got broken as I gathered things. I cleaned that up myself;
    the staff had enough to do. There was a glass set out at reception for Grant. I moved
    the drawing onto the clear part of the sideboard and stayed to finish my annotations.
  method_innocent: >-
    The canceled show sequence is a useful fact, but it doesn't cancel the toast. I know
    that; I designed the routes. The electrician's retained approval identifies the rig
    I compromised on, and her test log accounts for the later flickers. Neither powered
    the security camera. I carried the plaster model to reception. Dust on the outside
    of the glass could have come from me. I cannot identify who put poison inside it.
  method_murderer: >-
    The electrician's tests were separate. I was willing to let a technical discussion
    absorb the time we should have spent on reception. My miniature was open next to
    the annotated plan. I reached over Grant's glass while shifting the model, and I
    handled the glass as well. The plaster on its outside is easily explained. The joined
    blue break is harder. My gift did not account for every broken thing I handled tonight.
  coming_clean_innocent: >-
    Restore my approval to the job file. Give the electrician her proper record and my
    firm its proper liability. I brought a dusty model into a drinks area and rearranged
    papers to protect myself. I did not kill Grant. The console log excludes the blackout
    story as a route to his glass; it does not exclude me from reception. You deserve
    that distinction even if I find it uncomfortable.
  coming_clean_murderer: >-
    I forced the cabinet at 6:12, took the original, and carried the poison in my favor.
    I contaminated Grant's glass on the sideboard between 6:32 and 6:44 and hid the original
    behind it. I used the damaged-gift excuse for the break. His clean punch went into
    the glass afterward. I keep wanting to explain the unpaid staff and the rig. None
    of that changes what I did to him.
  author_notes:
    causal: Model contact supplies exterior plaster explanation; no console-created poison window.
    exoneration: I accepts target proximity and imperfect rig; logs narrow technical route only.
- id: '14'
  name: Mona Lott
  motive_innocent: >-
    The proposed permanent gift would publicly undo months of restitution talks. Grant
    knew which partners had offered compromises, and intended to make their patience
    look like agreement. I leaked the existence of the talks to two journalists. My
    partners had not authorized that. I hoped publicity would make him hesitate; instead
    he threatened to identify which delegation had approached him privately. Some people
    in those negotiations would pay for my decision much more dearly than I would.
  motive_murderer: >-
    I represent people who cannot afford another gracious postponement. Grant planned
    to announce a permanent holding and describe ongoing negotiations as concluded.
    I leaked their existence to the press without permission. That damaged trust on our
    side, and gave him another way to humiliate us. He threatened to name a partner who
    had spoken privately. I tried every courteous form of refusal I knew. By tonight
    courtesy had become something he counted on rather than something he deserved.
  opportunity_innocent: >-
    The delegation's objection was ready before tonight. I brought copies to reception,
    then withheld the page naming the private approach. I should have explained that
    redaction rather than letting people think it was the full document. At last week's
    meeting I warned Grant the unveiling would not proceed quietly. That warning is in
    the minutes. It referred to a formal public withdrawal, which our office had already
    arranged to publish if he went ahead.
  opportunity_murderer: >-
    I brought the delegation statement to reception and removed the page identifying
    our private contact. I was not authorized to expose that person. My gala favor had
    broken in the packet; I dealt with it while laying out the statement. The desk was
    crowded with programs and Grant's toast glass. I shifted the papers to keep the
    identifying page out of sight. Our threatened withdrawal was prepared, although
    Grant had made it clear that he meant to proceed regardless.
  method_innocent: >-
    Our office sent the withdrawal notice before reception, with the identifying page
    omitted. Their retained original shows what I withheld, and when. I did not write
    the anonymous warning found in the galleries. I did, however, make a public confrontation
    inevitable. The glass remained on the other end of the sideboard while I arranged
    the copies. That is recollection, not a photograph. My partners' objection survives
    Grant, and so does their anger at my leak.
  method_murderer: >-
    The withdrawal notice exists. It was a measure Grant could afford to ignore. At
    reception I moved the statement closer to his glass and opened my miniature there.
    I have been describing the page I concealed because I could defend concealing it.
    The other concealment is behind that sideboard. I cannot turn the matching break
    into an argument about diplomatic confidence. Please don't involve the delegation
    in an explanation I made for myself.
  coming_clean_innocent: >-
    I will answer to my partners for the leak and the redacted account. The office copy
    proves the withdrawal was an organized response, not a plan invented after Grant
    died. It does not put me beyond reach of his glass. I did not poison him. I need
    the negotiations to continue, even if I am no longer the person trusted to conduct them.
  coming_clean_murderer: >-
    The delegation did not authorize this. I forced the cabinet at 6:12, stole the original,
    and used my favor to carry its poison to Grant's glass between 6:32 and 6:44. I hid
    the original behind reception. Its break became my story about a damaged gift. He
    drank clean punch from the glass I contaminated. I killed him, then kept speaking
    as if I were still representing other people.
  author_notes:
    causal: Office records predate gala; delegation neither accomplice nor necessary present role.
    exoneration: Public withdrawal explains warning and planned alternative; proximity remains open.
- id: '15'
  name: Elon Mosaic
  motive_innocent: >-
    I was the anonymous buyer. Hugh handled it through my company because I didn't
    want Grant bidding against my name instead of the work. He found out anyway. Now
    I'm apparently a speculator, a philistine, and unsuitable for the board, all on the
    strength of buying something he wanted. I drafted a retaliatory announcement about
    withdrawing support. My own advisers said it made me sound twelve. They were right.
    I brought it tonight because being right didn't make me calmer.
  motive_murderer: >-
    I bought the work anonymously through Hugh. That was supposed to prevent a bidding
    contest with Grant, not start a lifelong one. He had me excluded from another
    acquisition and planned to block my board appointment tonight. Then he would tell
    everyone my collection was speculative theater. I have paid very well for people
    to explain what makes a work important. He could still reduce all of that to a
    joke about my money, and the room would enjoy it.
  opportunity_innocent: >-
    My lawyers prepared a support-withdrawal letter this week. I handed the envelope
    to a trustee at reception, then took it back when she asked whether the pledge was
    personal or corporate. It was corporate; I didn't have authority to withdraw it
    alone. I told her I could destroy Grant's announcement. What I actually had was
    a draft, an angry mouth, and a board of my own that hadn't approved the expensive part.
  opportunity_murderer: >-
    I brought the withdrawal letter and discovered, at reception, how many qualifications
    a trustee could find in one paragraph. I took it back. My gift got damaged while
    I was sorting the envelope; I put the broken thing aside and kept talking. Grant's
    glass was next to the program pile. I remember thinking how carefully even his
    drink had been branded. I promised to wreck his announcement, though the letter
    still required approval from my company's board.
  method_innocent: >-
    My advisers kept the draft and the email refusing permission to send it. You can
    establish that I was bluffing about the money without believing I'm a pleasant
    person. At reception I photographed the trustee's handwritten query and sent it
    back to them. The file time places that message inside the glass interval, but
    one message takes seconds. It isn't an alibi. I wanted Grant embarrassed in front
    of the people who kept laughing with him.
  method_murderer: >-
    The company's refusal was in my inbox before I arrived. I kept acting as if I could
    make Grant's money problem disappear. I had another bottle in my hand at reception:
    the little favor, opened beside his branded glass. I did send the photographed query.
    It took seconds. You should not stretch it into twelve minutes on my behalf. The
    broken-gift story was another way of making people look at the wrong transaction.
  coming_clean_innocent: >-
    Publish the proxy purchase if you like. It was legal, and it was embarrassing how
    much I wanted him not to know. I threatened a withdrawal I couldn't authorize,
    then sent a message that proves almost nothing about my whereabouts. I didn't
    kill Grant. I was trying to buy a different reaction from this room. Apparently
    that is one thing you can't simply fund.
  coming_clean_murderer: >-
    I forced the cabinet at 6:12 and stole the retained-content original. I used the
    gala miniature to carry poison to his glass on reception between 6:32 and 6:44,
    then hid the original behind the sideboard. Its damage was the gift accident I
    described. The punch was clean. My company hadn't authorized the withdrawal;
    nobody authorized the killing. I wanted to stop being the person he could dismiss.
  author_notes:
    causal: Timestamp is one action inside window, not a phone-based blanket alibi.
    exoneration: Corporate refusal explains bluff; I remains angry at target location.
- id: '16'
  name: Anya Tique
  motive_innocent: >-
    Yes, that's my signature from 1989. We had leaks in the roof and money for perhaps
    one of them. Grant offered a donation. I accepted while export papers were still
    promised, and told myself they would come. They never did. He planned to reveal
    the omission tonight as though he had just discovered it. He was there when I
    signed. I wanted that fact remembered too. It doesn't improve my signature, but
    it does spoil his little performance of surprise.
  motive_murderer: >-
    I approved the accession without the papers. I was old enough to know better then;
    being older now has not supplied an excuse. Grant kept the omission useful for
    decades. Tonight he intended to tell everyone I had founded a museum on careless
    judgment, while he put his own name on the building. I could survive losing a
    plaque. Watching him inherit the institution and blame me for the bargain we made
    together was something I had not prepared myself to survive politely.
  opportunity_innocent: >-
    I borrowed the accession ledger this afternoon and removed the loose correspondence
    Grant had tucked into it. I brought the ledger to reception for the trustees.
    The missing page was his promise to send the papers; I kept it in my handbag because
    I wanted him asked about it after he questioned me. That's maneuvering, certainly.
    I did not erase the entry. Thirty-seven years of my signature is difficult to conceal
    with a handbag, however capacious.
  opportunity_murderer: >-
    I took the ledger to reception with Grant's promise separated from the entry.
    I wanted to choose the order in which the trustees heard things. My gift had
    broken, so I wrapped the mess and disposed of it rather than ask a young waiter
    to fuss over me. The ledger needed room on the sideboard. I moved the programs,
    waited for someone to bring reading glasses, and looked again at the signature
    I had spent years wishing I could unmake.
  method_innocent: >-
    The archivist copied the ledger and the loose letter last Tuesday, before I borrowed
    either. Nothing I removed tonight could destroy those copies. They show Grant
    promising documents, not a completed export file. I laid the book on reception
    near his glass, and I could have touched it. I did not. Don't manufacture an
    elderly woman's helplessness into an alibi. I was quite capable of causing trouble,
    and intended to cause a good deal.
  method_murderer: >-
    The archivist's copies are accurate. I didn't need to destroy a ledger to make
    tonight impossible. My miniature was on reception beside it; I opened it there,
    and I moved Grant's glass to clear a space. I allowed everyone to worry over a
    very old signature while I kept quiet about what I had done that evening. The
    broken gift was an explanation for damage I hoped nobody would examine. They
    have examined it rather carefully now.
  coming_clean_innocent: >-
    Put the letter back in the ledger. Leave my name beside the approval. I will
    explain the decision, including the desperate finances, without calling it right.
    Grant's promise is evidence that he knew, not evidence that I couldn't kill him.
    I didn't. I wanted the living man obliged to answer for his share of the bargain.
    There will be no answer from him now.
  coming_clean_murderer: >-
    I broke the secured cabinet open at 6:12 and took the original. The favor carried
    its poison to his reception glass between 6:32 and 6:44. I hid the bottle behind
    the sideboard and called its break a ruined gift. The service staff poured clean
    punch afterward. I made that old signature the subject of every conversation I
    could. It gave me something shameful to admit while concealing the killing.
  author_notes:
    causal: Age never makes a culprit physically impossible; copies independently archived before gala.
    exoneration: Preserved copies defeat document-destruction reading; I retains capability and proximity.
- id: '17'
  name: Saul D. Bid
  motive_innocent: >-
    The subsidiary is ours. I routed a private sale through it because the buyer insisted
    on discretion. That arrangement was not presented to the full committee as it
    should have been. Grant knew the fee, and threatened to turn the omission into
