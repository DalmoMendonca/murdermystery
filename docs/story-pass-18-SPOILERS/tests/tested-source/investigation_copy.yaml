      about the broken gift. I killed him to preserve my work and standing. I destroyed both, along with
      a life.
  authoring_notes:
    name: Dr. Art E. Fact
    author_note: Prior poison knowledge, hidden request and blackmail supply serious means and motive.
      Full request and opening refusal distinguish scholarship from permission, not physical impossibility.
      G's contamination-by-other-hands cover remains a claim without a witnessed transfer. Fracture and
      lingering target encounter support own handling more strongly than the absent permission.
- id: '10'
  briefing:
    history: 'He needed my signature. He still introduced me as someone who shouldn''t worry about the
      numbers. I read the trust amendment. I brought it here. I told Artie I could block it, which wasn''t
      quite true: the other trustees hadn''t agreed with me. Grant knew that. He was enjoying asking for
      my signature in front of people who thought I''d already promised it.'
    secret: You have been quietly organizing other family trustees to block Grant's control over the foundation
      and redirect future giving toward worker and community programs.
    objectives:
    - Find out whether Anya Tique would publicly oppose renaming the museum.
    - Gauge Artie Ficial's willingness to reject Grant's conditions.
    - Do not reveal the trust fight unless you must.
  hearings:
    motive_innocent: Grant put the trust amendment between my place card and my plate. He wanted me removed
      from the foundation unless I supported his naming scheme. I moved the amendment to his place. Then
      I told Artie Ficial the family would block the money. The family had not agreed. I was trying to
      make it expensive for them to disagree in public. Grant knew I was bluffing. He asked whether I'd
      chosen a worthy cause for the fortune I no longer expected to control.
    motive_murderer: Grant put the trust amendment between my place card and my plate. He wanted me removed
      from the foundation unless I supported his naming scheme. I moved the amendment to his place. Then
      I told Artie Ficial the family would block the money. The family had not agreed. Grant knew I was
      bluffing. He asked whether I'd chosen a worthy cause for the fortune I no longer expected to control.
      Everybody nearby laughed politely. They thought he was letting me make one of my little jokes.
    where_innocent: My first admission receipt is after the missing-bottle report. I arrived late because
      I was still calling trustees from the car. At reception I broke a rental glass dragging the amendment
      out of my bag. I pushed the stem into the napkins and left it. Then I took Grant's signing pen.
      I wanted him unable to stage another little ceremony before I'd reached the last trustee. His assistant
      searched the sideboard for it. I watched her, with the pen in my hand behind my bag.
    where_murderer: I collected my admission receipt after the missing-bottle report. I'd come through
      the entrance earlier while calling trustees. At reception I broke a rental glass dragging the amendment
      out of my bag. I took Grant's signing pen and stayed by the sideboard pretending to reach the last
      trustee. His assistant came looking for the pen. I gave it back once she had stopped asking me to
      sign.
    evidence_innocent: The receipt records first entry. The stem Casey Hart removed was a rental, without
      the museum star, before the donor glass was unwrapped. That explains the broken glass I concealed.
      It doesn't explain why I enjoyed concealing it. The pen is back, the amendment is unsigned, and
      death doesn't give me the trustees' votes. I might win them now. Please don't require me to pretend
      that possibility has escaped my notice. I still intend to move the foundation's giving away from
      Grant's priorities. Somebody should have done it years ago.
    evidence_murderer: The stem was a rental. That isn't the piece in the comparison. My receipt was for
      collecting my ticket, as I said; it doesn't record my earlier arrival. I had Grant's pen beside
      his glass while I sorted my bag. I didn't pick a broken favor out with a loupe and an inventory
      list. Apparently I should have. The trustees hadn't agreed to stop him. I was tired of announcing
      decisions I couldn't make happen. That doesn't make every broken thing in my bag something I stole
      from a cabinet.
  coming_clean:
    innocent: I bluffed the director, hid the broken stem and stole a signing pen. I didn't poison Grant.
      The first-entry receipt and removed rental glass account for what I actually did. I will ask the
      trustees for their votes tomorrow. I won't claim his death has made me kinder, or less interested
      in winning them.
    murderer: I was here at 6:12. I forced the cabinet, took the poison and carried it in my favor to
      Grant's glass on the sideboard. The rental stem was real; the broken-favor story wasn't. I wanted
      the foundation out of his hands. I chose to kill him rather than keep asking other people to stand
      up to him.
  authoring_notes:
    name: Tess Tament
    author_note: Trustee coercion, stolen signing pen and hidden stem sustain suspicious callousness.
      First-entry receipt after theft excludes source route if trusted, not glass window; stem removed
      before target unwrapping rebuts wrong-glass handling. G has an earlier arrival and an ordinary bag
