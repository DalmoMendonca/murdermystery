      writing that I would not sign it. It took me several attempts to avoid writing something he could
      enjoy quoting in court.
    where_murderer: I requested the Eleanor Vale case file and asked whether the bottle retained its original
      contents. That request is mine. I was planning a lecture on the poison exhibition. At reception
      I took the request off the circulation pile and removed Grant's endorsement sheet. I wrote my refusal
