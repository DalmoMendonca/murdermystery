schema_version: 1
status: Round18 independently authored candidate; continuity and blind acceptance unproven
characters:
- id: '01'
  briefing:
    history: The resignation clause is real. My acceptance isn't. Grant wanted the board to remove me
      in return for his money, so I copied his signature onto a demand and sent it to the chair. Monet
      has the copy. I'm leaving anyway. Another museum offered me the job last month, and I haven't told
      the trustees. Please let me finish before you congratulate me.
    secret: You have already accepted a confidential offer to lead a rival museum next year, which makes
      any argument with Grant look like succession planning.
    objectives:
    - Find out whether Monet Bags has seen the governance addendum.
    - Quietly learn whether Claire O’Scuro would stay if you left.
    - Do not volunteer your job offer unless pressure forces it.
  hearings:
    motive_innocent: Could we move away from the entrance? People keep asking whether the gala is over.
      Grant wanted my resignation attached to his donation. I had already accepted another museum's offer,
      but I wanted to leave as a director, not as the item he traded for a new wing. I copied his signature
      onto a demand and sent it to our chair. That was supposed to force a discussion. She asked why a
      donor's letter had come from my printer.
    motive_murderer: Could we move away from the entrance? People keep asking whether the gala is over.
      Grant wanted my resignation attached to his donation. I had already accepted another museum's offer,
      but I wanted to leave as a director, not as the item he traded for a new wing. I copied his signature
      onto a demand and sent it to our chair. Then Grant said he would warn the other museum what sort
      of director they were getting.
    where_innocent: I took his announcement out of the speech folder. Brie DeVivre had enough to do without
      watching me quarrel with a piece of paper. I put my own version in, thanking him for a gift with
      none of his conditions. The folder was beside the reception sideboard. When his assistant noticed,
      I told her Grant could speak when he signed my version. She took the folder away. I followed her
      halfway to the office, then remembered I was still welcoming people.
    where_murderer: I took his announcement out of the speech folder. Brie DeVivre had enough to do without
      watching me quarrel with a piece of paper. I put my own version in, thanking him for a gift with
      none of his conditions. His assistant took the folder away. I returned to the sideboard with the
      acknowledgment cards; there was no reason to let our guests see a director standing there with nothing
      to do.
    evidence_innocent: The assistant kept both announcements. Mine still says the gift is subject to board
      approval. You can dislike it without believing it became binding when Grant died. I didn't touch
      the glass. I did tell Brie DeVivre to delay the toast, and I let him think that order came from
      the chair. It didn't. The chair's reply was to stop using her name. Please put that with the forged
      letter. They belong together, even if neither makes me especially welcome at my next job.
    evidence_murderer: Those cards were on the sideboard beside his glass. I set them in order and moved
      the glass back. I cleared scraps from the cards and took them for a damaged favor. You're asking
      me to turn a small accident into a confession because a piece joins the original bottle. I understand
      the comparison. I don't agree it tells you everything I did at that desk. Grant's assistant had
      brought back his announcement unchanged. I stood there reading it while everyone else carried on
      getting ready to thank him.
  coming_clean:
    innocent: I forged the letter and tried to replace his speech. I wanted him defeated in front of the
      people who had been flattering him all evening. I didn't kill him. The chair will receive both announcements
      and my job offer. I suspect her answer will be considerably shorter than my welcome speech.
    murderer: I forced the cabinet at 6:12 and took the historical bottle. I carried the poison in my
      favor and put it in Grant's glass on the sideboard before service collected it. My broken-gift story
      hid the neck fragment. I killed him because I couldn't bear to let him decide how my work ended.
  authoring_notes:
    name: Artie Ficial
    author_note: Image management escalates into forgery and a toast delay that could conceal interference.
      Retained competing speeches and the chair's refusal mitigate a death-dependent board coup; they
      do not exclude either crime window. G's return to the target and gift cover acquire source significance
      only with Act III. Glass handling remains contestable, not a confession.
- id: '02'
  briefing:
    history: Reed, show them the qualification. The ownership review arrived six weeks ago. I left it
      out of the board papers because I thought the exhibition would be canceled. Grant now wanted that
      omission printed on the wall as settled ownership. I told him no. After making it remarkably easy
      for him to expect yes.
    secret: Against board instructions, you commissioned an independent provenance review and hid the
      preliminary report in the Registrar's Office.
    objectives:
    - Find out whether Dr. Art E. Fact has seen the same gap you found.
    - Learn who wrote the anonymous warning note.
    - Keep your independent report secret until you decide whom to trust.
  hearings:
    motive_innocent: The provenance gap did not surprise Grant. I showed it to him twice. The second time,
      he suggested replacing me with someone who understood an opening date. I commissioned the outside
      review anyway, and kept it out of the board packet. Yes, that was concealment. I was trying to get
      a definite answer before twenty trustees produced twenty opinions. The preliminary answer was worse
      than I expected. I still let the labels go to print.
    motive_murderer: I have spent years making this exhibition defensible. Grant knew about the missing
      export file and decided the wall label would settle ownership. When I objected, he threatened my
      position. I commissioned an independent review without permission, then hid the preliminary findings.
      He could expose that whenever he liked. Apparently scholarly independence was to mean taking the
      blame for decisions he had already made. I wanted that announcement stopped before my name appeared
      beneath it.
    where_innocent: I took the ownership proof off the reception pile and replaced it with a qualified
      version. The original went inside my folder. Earlier this week I sent the review to the lender over
      the board's objection. Tonight, I was waiting for their answer and refusing to let Grant's wording
      become the only record.
    where_murderer: At reception I replaced the ownership proof, put the rejected one in my folder, and
      made room for the lender's reply. Grant's glass was there with the programs. I noticed because the
      base was pinning a corner I needed. Earlier this week I had sent the review to the lender despite
      the board's objection. I wanted their answer beside the proof.
    evidence_innocent: 'Here is the lender''s reply, received before the theft alarm: they would not consent
      to permanent transfer while the claim remained unresolved. It was an effective objection, if the
      trustees chose to honor it. I had no authority to promise they would. The folder contains both proofs
      and the report; the registrar kept the dated submission. I did not touch the glass. I did threaten
      to withdraw the exhibition, and I meant that threat.'
    evidence_murderer: The lender's refusal was real. It did not stop Grant announcing a gift and calling
      the legal work someone else's problem. I returned with my folder and lifted his glass off the proof.
      There was a miniature beside it; I opened mine while waiting for the papers. The scraps I put away
      looked like damaged gift packing. I did not make a condition report on them. Your comparison identifies
      the original's glass. It does not identify whose folder was on that desk when it broke.
  coming_clean:
    innocent: I withheld a commissioned report and then circulated it outside the institution. Those decisions
      may cost me this exhibition. The lender's dated refusal explains why I believed I could stop the
      permanent gift without Grant's cooperation; it cannot account for every minute I spent at reception.
      I did not poison him. Put the qualification back on the label, even if you take my name off it.
    murderer: I forced the cabinet at 6:12 and took the original. Between 6:32 and 6:44 I used my favor
      to carry the poison to his glass, then hid the original behind the sideboard. The broken gift story
      covered the damage to that bottle. The punch was clean. I killed him because I could no longer tolerate
      hearing him announce my work on his terms. That is what I did.
  authoring_notes:
    name: Claire O’Scuro
    author_notes:
      causal: Lender correspondence precedes gala; no shared-assistant confrontation or curatorial access
        exemption.
      exoneration: Dated refusal supplies an effective nonviolent route and corroborates label intervention;
        no full alibi.
- id: '03'
  briefing:
    history: The certificate is a forgery. I didn't make it. I did alter our file afterward so it looked
      as though I'd checked the thing before selling it. Grant wanted a refund the firm can't pay. Then
      he began telling people I'd forged the certificate itself. Sue, that's two accusations. I'll accept
      one. I'd rather neither became the title of the auction firm's next press release.
    secret: You were duped on that sale, but you quietly altered your own file afterward so clients would
      not see how badly your due diligence failed.
    objectives:
    - Learn whether Saul D. Bid knows about the disputed certificate.
    - Keep Elon Mosaic from discussing the 'auction incident' in public.
    - Figure out what Paige Turner knows about the Geneva freeport records.
  hearings:
    motive_innocent: The certificate was forged before it reached me. That is a distinction worth preserving,
      although I don't imagine it buys me much sympathy. I changed my own file after the sale to make
      the checks look more thorough. Grant discovered the alteration and asked for millions we could not
      return. Then he began telling clients I had manufactured the certificate. I wanted an agreed statement.
      He wanted me frightened enough to sign anything.
    motive_murderer: Grant had a claim against the firm. I had offered terms. He decided that was less
      enjoyable than telling people I forged his certificate. I didn't; I altered the checking record
      afterward, which is quite bad enough without his improvements. By tonight the refund demand had
      become a means of calling me whenever he wanted something. A fee waived, another introduction, another
      client frightened off. I could not see where it would end.
    where_innocent: The settlement envelope was on reception. I took it back without signing because it
      demanded a personal guarantee as well as the firm's money. Yesterday I had emailed Grant that he
      would never see a penny. Unwise, obviously. The firm's solicitor had already told him that any claim
      survived his death; my email was a blustering refusal, not a clever estate strategy. I kept the
      torn draft in my pocket so nobody could circulate it.
    where_murderer: I withdrew the settlement envelope from reception. It wanted my own assets added to
      the guarantee, a detail rather casually introduced after weeks of negotiation. I stayed by the sideboard
      to read the guarantee again. Grant's new glass was beside it, ready for a photograph. The whole
      place was arranged around making him pleased. Yesterday I had emailed that he would never see a
      penny. I kept the torn draft in my pocket rather than leave it for the next person.
    evidence_innocent: My solicitor retains the earlier draft, including the estate clause. The guarantee
      I rejected tonight was added in a different hand. I can prove what I was objecting to, not that
      I never walked past a cabinet. I was here before the alarm, despite collecting my printed ticket
      later. That receipt should not be used as an arrival time. The altered file remains altered, and
      the firm still owes an answer to his estate.
    evidence_murderer: I arrived before collecting the ticket. The guarantee was torn; I kept it in my
      pocket, then laid it beside Grant's glass. My miniature was there while I read it. I opened the
      gift and left the papers on the sideboard. If you want to call the scraps I cleared a broken favor,
      that was my impression too. I wasn't inspecting edges. An anonymous bottle behind a desk isn't an
      invoice with my name at the top. The personal guarantee is.
  coming_clean:
    innocent: Keep the threatening email and the altered file. I will not negotiate them into innocence.
      I refused a guarantee; I did not murder the man asking for it. The estate clause survives him, and
      so does the fraud investigation. My late ticket receipt was a distraction I should have corrected
      sooner. There, you have one useful admission without my invoice for providing it.
    murderer: I took the original after forcing its cabinet at 6:12. My favor carried the poison to Grant's
      glass while it stood on reception between 6:32 and 6:44. I hid the original behind the sideboard
      and called the break a damaged gift. He drank clean punch from a glass I had contaminated. I wasn't
      protecting the firm's accounts by then. I wanted him dead, and I let you keep discussing the guarantee.
  authoring_notes:
    name: Hugh Bidder
    author_notes:
      causal: Both branches arrive before theft; ticket is explicitly collection, never a guilty-only
        retcon.
      exoneration: Estate liability limits financial benefit; I retains early access and explicit threat.
- id: '04'
  briefing:
    history: Restricted funds paid payroll. Unauthorized transfer. The wages were due, and I borrowed
      against the promised gift. Grant found the transfer and wanted his private-wing costs buried in
      it. I refused. The bank doesn't care that I refused the second transaction. Neither, apparently,
      will Monday's auditor. Artie knew about the wages. He didn't know where the money came from.
    secret: You temporarily moved money between internal accounts to cover a cash-flow shortfall, intending
      to reverse it after the gala. It was technically unauthorized and Grant discovered it.
    objectives:
    - Find out whether Sue Venir has seen Grant's draft funding agreement.
    - Keep Artie Ficial from learning about the temporary transfer unless absolutely necessary.
    - Identify who found the donor ledger during the scavenger hunt.
  hearings:
    motive_innocent: Payroll cleared. That is the good part. I moved restricted money to make it clear,
      without authorization, against Grant's promised donation. He found out and wanted his private-wing
      expenses hidden in the same account. When I refused, he offered to explain my transfer to the trustees
      personally. I took the finance pack off the board table. Artie Ficial thought I was updating it.
      I was removing the page that would get me suspended before anyone heard why the wages were paid.
    motive_murderer: Payroll cleared. That is the good part. I moved restricted money to make it clear,
      without authorization, against Grant's promised donation. He found out and wanted his private-wing
      expenses hidden in the same account. When I refused, he offered to explain my transfer to the trustees
      personally. I took the finance pack off the board table. He watched me do it. Then he asked for
      the account password as though we had just agreed I would work for him indefinitely.
    where_innocent: I withheld authorization for the extra course. Casey Hart came off the reception floor
      to ask me again, because Grant had apparently told the kitchen I approved it. I made Casey Hart
      stay while I rang the supplier. Then I put a hold on the outstanding gala payment, including Brie's
      legitimate balance. That got everybody's attention. The signed refusal was on the sideboard afterward.
      I knew the glass was there; I was more interested in making Grant come to me for his signature.
    where_murderer: I withheld authorization for the extra course. Casey Hart came off the reception floor
      to ask me again, because Grant had apparently told the kitchen I approved it. I made Casey Hart
      stay while I rang the supplier. Then I put a hold on the gala payment. I went back to the sideboard
      myself. If Grant wanted his dinner restored, he was going to find my refusal beside the glass prepared
      for his photograph.
    evidence_innocent: The supplier's copy records a payment hold, not a changed food order. The extra
      course never left the kitchen; the shared punch tested clear. That accounts for what I threatened
      to stop. It doesn't turn my transfer into authorized spending. I tore the removed finance page in
      half, then kept both halves because the totals wouldn't reconcile without it. They're in my bag.
      I intend to give the auditor the whole pack. I would prefer to do it without Grant's account of
      my motives.
    evidence_murderer: The bank can give you the transfer. The supplier can give you the hold. Neither
      records what was on that sideboard. I left my refusal beside his glass and stayed to check the envelope.
      The scraps I cleared looked like a damaged favor; you're treating them as that missing neck. I didn't
      compare edges when it happened. There were enough things going wrong. Yes, Casey Hart was still
      in the kitchen because I'd kept the argument running. I wanted Grant inconvenienced. You don't get
      to turn that word into whatever you need it to mean.
  coming_clean:
    innocent: I used restricted funds and held a supplier's money hostage to get Grant's attention. Brie
      DeVivre's crew earned that payment. I'll release the legitimate balance and report the transfer.
      I didn't poison Grant. I still want the trustees to see what he asked me to bury, including the
      expenses they were quite happy to enjoy tonight.
    murderer: I broke into the cabinet at 6:12. I used the original poison, carrying it in the ordinary
      favor, and poisoned Grant's individual glass during the service gap I helped create. The broken
      gift was a lie. He could expose me, and I decided I would rather silence him than answer for what
      I'd done.
  authoring_notes:
    name: Monet Bags
    author_note: Financial coercion creates real unattended-glass opportunity by detaining the service
      manager. Blocked course and clear punch rebut a catering-contamination theory, not individual-glass
      poisoning. Torn account survives as wrongdoing. G combines an engineered gap, target-side presence
      and gift cover discredited by the fracture; financial records do not certify innocence.
- id: '05'
  briefing:
    history: That's my treatment report. The date is wrong because I changed it for an insurance deadline.
      Grant wanted a recent repair called ancient. I wouldn't sign that. He had a copy of the wrong date
      and made sure I knew it. If you're going to examine my work, use both copies. He's been showing
      everyone whichever one gets him what he wants.
    secret: You changed the date on a minor treatment record last month to spare the museum an embarrassing
      insurance dispute. No object was harmed, but the falsification could end your career.
    objectives:
    - Find out whether Cary Crates has noticed the altered treatment date.
    - Ask Dr. Art E. Fact what he thinks the Star Bowl's modern adhesive means.
    - Keep the insurance issue separate from the murder investigation.
  hearings:
    motive_innocent: Put the photograph down by its edges. Thank you. Grant wanted a recent repair described
      as original workmanship. I refused. Unfortunately, I'd changed a treatment date last month to get
      an insurance claim inside its deadline. He had that copy. He tapped the date with his finger while
      telling me a private conservator could be much more helpful. I took the report back out of his hand.
      I wasn't going to watch him wave my bad record over an object and call that scholarship.
    motive_murderer: Put the photograph down by its edges. Thank you. Grant wanted a recent repair described
      as original workmanship. I refused. Unfortunately, I'd changed a treatment date last month to get
      an insurance claim inside its deadline. He had that copy. He tapped the date with his finger while
      telling me a private conservator could be much more helpful. Thirty years of looking after objects,
      and he was offering to replace me with somebody willing to damage one for a better opening photograph.
    where_innocent: I closed the alcove when the mount cracked. Grant wanted the unveiling to proceed.
      I stepped in front of him and took the radio from the attendant to call the hold myself. Yes, I
      shoved him back. He was reaching past me for the barrier. Afterward I emptied my kit on the reception
      sideboard looking for the original treatment sheet. There were tools, gloves and the clear replica.
      I cleared them when service wanted the space. The report stayed in my jacket. I told collections
      not to circulate my receiving notes until I'd checked them.
    where_murderer: I closed the alcove when the mount cracked. Grant wanted the unveiling to proceed.
      I stepped in front of him and took the radio from the attendant to call the hold myself. Yes, I
      shoved him back. Afterward I emptied my kit on the reception sideboard looking for the treatment
      sheet. I cleared the tools when service wanted the space. I stayed to put the papers in order beside
      Grant's glass. Collections could wait for my receiving notes.
    evidence_innocent: The crack wasn't an excuse I invented. The inspection photographs show it, and
      the console records the hold before the unveiling. I recommended locked storage for the historical
      bottle and the empty replica for display. I also sat on the receiving notes because the changed
      treatment date was in the same folder. Don't tell me that was harmless. It kept the condition warning
      from somebody who needed it. The replica in my kit has an open bottom. I can account for that object.
      I still owe collections an account of the folder.
    evidence_murderer: I know the replica has an open bottom. I recommended it. The fragment you're comparing
      comes from the original; I can see the join. It wasn't an old chip in my tools. I moved Grant's
      glass to keep it off my report at the sideboard. I put the report back in the kit afterward. You're
      asking whether the broken favor was really that bottle. I'm asking who else had been through the
      kit while I dealt with the mount. I took the scraps in it for a damaged favor. I should have checked
      before packing them away.
  coming_clean:
    innocent: I changed the date and held back the folder. I shoved Grant away from a failed mount, and
      I'd do that again. I didn't poison him. The insurer gets the original report. The bowl stays off
      display until the mount is safe. You can take my title away. You cannot authorize the installation
      I stopped.
    murderer: The objection to exhibiting the original was mine. I then forced its cabinet at 6:12, took
      the poison and carried it in the favor to Grant's glass. I left the original behind the sideboard.
      I protected the collection and killed a person. Those are both things I did; the first does not
      excuse the second.
  authoring_notes:
    name: Chip Patina
    author_note: Physical confrontation, falsified date, withheld condition folder, tools and sideboard
      access form a serious rival. Real photographed mount failure explains shove; open-bottom replica
      resolves one object, not source access. G uses a contestable kit-interference cover after the fracture,
      with original intact at receiving and later target contact making own handling stronger.
- id: '06'
  briefing:
    history: I wrote RETURN WHAT WAS TAKEN. My piece. My credit. Grant put his foundation's name on a
      performance he hadn't even watched in rehearsal. It ends with an empty donor jacket collapsing.
      He canceled the performance and kept the effect for his film. No, I didn't ask graciously for an
      acknowledgment. I asked for my work back.
    secret: You wrote and planted the ominous anonymous warning note about 'returning what was taken.'
      It was meant as an art-world provocation, not a literal threat. Your canceled stage effect uses
      a glass marked PROP; it has no poison and belongs in the padded performance case.
    objectives:
    - Enjoy watching people overreact to your warning note without admitting you wrote it.
    - Find out whether Minnie Malist changed the lighting cue you designed.
    - Get Vincent Van Faux to admit he still owes you credit for an old collaboration.
  hearings:
    motive_innocent: The note is mine. RETURN WHAT WAS TAKEN. I meant my performance, although the capitalization
      was intended to leave Grant uncomfortable about several other things. His foundation took my credit,
      then canceled my piece and kept the effect for a film. The effect makes an empty donor jacket collapse.
      He called that too hostile for the gala. Apparently stealing it improved the tone. I told him he'd
      be very uncomfortable watching the closing sequence. I rather wanted him to wonder whether I had
      stopped being theatrical.
    motive_murderer: The note is mine. RETURN WHAT WAS TAKEN. I meant my performance, although the capitalization
      was intended to leave Grant uncomfortable about several other things. His foundation took my credit,
      then canceled my piece and kept the effect for a film. The effect makes an empty donor jacket collapse.
      He called that too hostile for the gala. I told him he'd be very uncomfortable watching the closing
      sequence. He laughed and asked whether discomfort was included in his commission. I remember exactly
      how pleased he was with that.
    where_innocent: I tried to put the canceled cue back. I told the operator Artie Ficial had approved
      it. Please enjoy his expression; it is the first accurate part of that conversation. I brought the
      rehearsal glass and empty jacket out where Grant could see them. When the mounting hold canceled
      the sequence, I carried the jacket away and left the PROP glass by the stand. Then I went to reception
      to retrieve my credit sheet. I wanted him to see my name where his glass was waiting.
    where_murderer: I tried to put the canceled cue back. I told the operator Artie Ficial had approved
      it. Please enjoy his expression; it is the first accurate part of that conversation. When the mounting
      hold canceled the sequence, I left the PROP glass by the jacket. I went to reception with my credit
      sheet. I put the sheet beside the glass that would actually reach Grant.
    evidence_innocent: I didn't mistake the glasses. PROP is written under the rehearsal one, and I put
      it there. Its test is clear. The console kept my request to restore the cue and the safety cancellation
      that stopped it. My staged collapse never happened. I would like those facts established without
      anyone describing my work as a harmless little prank. It was meant to humiliate him, and I lied
      to get it performed. The joke depended on Grant watching it. He was supposed to recognize exactly
      whose work he had taken.
    evidence_murderer: The PROP glass stayed with the stand. I knew which glass was Grant's, and I knew
      my cue wasn't going to run. I turned the real glass so the star showed and put my credit sheet down.
      Now the comparison says the broken piece belongs to the historical bottle. A thing breaking doesn't
      tell me where it came from. The scraps I cleared were with my gift packing, and I took them for
      a damaged favor. You can think that was convenient. I have spent this evening watching people attach
      the wrong names to things. I'm allowed to object when it happens to me.
  coming_clean:
    innocent: I wrote the warning and lied about permission. I wanted his foundation to lose its lovely
      evening, and I wanted my name back. I didn't kill him. The canceled cue and tested PROP glass are
      still there. I won't withdraw the credit claim because the man who stole my work is dead.
    murderer: I forced the cabinet at 6:12 and took the original. I used the favor to carry its poison
      to Grant's real glass on the reception sideboard. The collapse cue was canceled; the murder wasn't
      a performance. The broken gift was my cover for the source fragment. I killed him. He cannot watch
      me claim my work now.
  authoring_notes:
    name: Dada DiCapo
    author_note: Threatening note, staged donor collapse and false authorization create a consequential
      rival. Canceled cue and clear PROP distinguish theatrical route from actual glass, which remains
      accessible. G's deliberate target handling and favor cover discredited by physical source join outweigh
      an uncorroborated misidentification protest. Performance personality is not forensic proof.
- id: '07'
  briefing:
    history: I bought the student paintings anonymously. Grant kept the worst one. When Claire asked for
      a recent work, he lent that thing and called it a retrospective. I painted over his signature on
      the loan form. The form, not the painting. Reed had to ask me that twice. It was a stupid little
      revenge. I was considering a larger, stupider one when he put the label on the wall.
    secret: You have secretly used buyers to acquire several of your own early paintings so you could
      remove them from circulation. The art world would find that both vain and market-manipulative.
    objectives:
    - Find out whether Ella Gance knows you were behind the anonymous buybacks.
    - Persuade Claire O’Scuro that the student painting should not be displayed.
    - Avoid giving Drew Conclusions a quote you will regret.
  hearings:
    motive_innocent: I painted that thing when I was nineteen. It is dreadful. People insist that admitting
      this should make me more relaxed about seeing it on a museum wall. Grant bought it precisely because
      he knew I hated it. I have used other buyers to retrieve early work; yes, that distorts a market
      which everyone else here treats with such reverence. I offered him more than it was worth. He preferred
      the joke. I lost my temper.
    motive_murderer: You can laugh at the painting. I have laughed at it myself, in rooms where I chose
      to show it. Grant intended to hang it beside work that took me twenty years to learn how to make.
      I used proxy buyers to bring other early pictures home, and he knew it. He could turn my vanity
      into a market scandal and enjoy the unveiling at the same time. I wanted him to have one evening
      without an audience.
    where_innocent: I took the painting off its temporary stand before the opening. It was his property,
      and I knew that. I carried it to an installation crate, face inward, and left the rejected label
      on reception where he could find it. My dealer had been trying to arrange a purchase all week. I
      told her tonight that I'd rather ruin the show than let him use me in it. She saved the message.
    where_murderer: I removed the painting and left its label on reception. It still belonged to Grant.
      The proposed buyback had failed; I wasn't going to stand smiling beside the thing. His toast glass
      was sitting there as if nothing had happened. The painting had gone into an installation crate before
      opening. This later visit was for the label; I wasn't returning the painting to its stand.
    evidence_innocent: The picture stayed inside the museum. The crate tag and the job photograph record
      it face inward before reception began; I didn't put it in my car. My brush-water bottle was collected
      there and tested clear. That result does not make my temper harmless. I went back for the label
      and argued with a trustee beside the sideboard. I could have reached the glass. I wanted him to
      find an empty stand, not die at it.
    evidence_murderer: The brush water stayed in the crate. My miniature went back with me to reception.
      I opened it while retrieving the label and shifted Grant's glass off my name. I cleared the packing
      scraps rather than leave them on the proof. I took them for a damaged gift. Now you have joined
      a piece to the original. That establishes an object; it doesn't establish who put it among those
      papers. I took his painting off display. I have answered for that without turning every object on
      reception into mine.
  coming_clean:
    innocent: I took another man's painting off display and threatened to ruin the opening. I also paid
      people to conceal my buying. My dealer can supply those records without asking anybody here to remember
      where I stood. I didn't kill Grant. I would like my painting back, which is a grotesque thing to
      want at this moment. Unfortunately, I still want it.
    murderer: At 6:12 I forced the cabinet and took the historical poison bottle. I carried poison in
      the gala miniature and contaminated his glass on reception between 6:32 and 6:44. The original went
      behind the sideboard. I called its broken neck a damaged present. The picture in the crate was not
      enough. I wanted to hurt the man who kept showing it, and I poisoned his glass before it was filled
      with clean punch.
  authoring_notes:
    name: Vincent Van Faux
    author_notes:
      causal: Painting removal predates service; label retrieval supplies both branches' opportunity.
      exoneration: Clear brush water excludes named artist material only; I retains reach to target.
- id: 08
  briefing:
    history: My opinion wasn't a title guarantee. Grant quoted the summary and omitted the qualification.
      I knew he was doing it. I kept the account anyway. The permanent-gift papers required my signature
      tonight. I withdrew it. The qualification is in the attachment; I would appreciate someone reading
      it before asking whether I advised a client to give away property he might not own.
    secret: Both versions of the memo still exist. You kept the original instead of destroying it, which
      could expose you to professional embarrassment and Grant to serious scrutiny.
    objectives:
    - Learn whether Mona Lott has obtained a copy of your original memo.
    - Keep Dr. Art E. Fact from publicly speculating about your legal advice.
    - Find out who has been searching the Registrar's Office.
  hearings:
    motive_innocent: I softened the opinion. You need not extract that word from me. The original said
      we could not defend this acquisition confidently; the replacement said further inquiry was advisable.
      Grant preferred to quote neither phrase and use my name as a guarantee. I kept both versions because
      I knew the distinction might matter. Keeping evidence of one's own compromise is a modest achievement.
      Tonight he wanted a signature that would make the compromise permanent, and I refused.
    motive_murderer: My original opinion would have inconvenienced Grant. The version he persuaded me
      to send was merely advisory, which let him pretend the problem was optional. I kept the first version.
      He knew that too. Tonight he intended to announce my approval, whether I signed the final papers
      or not. He had become accustomed to hearing me explain why something was impossible, then watching
      me find a way. I had helped teach him that habit.
    where_innocent: I crossed out the permanent-gift signature line and took the packet to reception for
      copying. In my case was an unsigned estate instruction Grant requested last month. I concealed that
      behind the opinion when someone asked what I was carrying. A document about his death looked dreadful
      beside a refusal to sign his gift. It names no new beneficiary. My clerk's dated instructions show
      the work began well before this evening.
    where_murderer: I withdrew the signature page and brought it to the reception copier. The estate draft
      in my case was unfinished; I did not want to discuss it with people reading over my shoulder. I
      had both opinions with me, and no intention of signing Grant's preferred version. I kept the estate
      instruction behind the opinion. There was no prospect of discussing a death document discreetly
      with a trustee peering into my case.
    evidence_innocent: Read the instruction itself. The beneficiary space is blank; there is no appointment
      of me or my firm. The clerk retains the earlier request, and the existing will remains in force.
      I moved the signing pen, not the donor glass. Nobody watched my hands continuously, so you have
      my account of that distinction. His estate may still proceed against us over the softened opinion.
      I do not acquire professional immunity because a client dies.
    evidence_murderer: The estate draft appoints nobody. I opened my miniature beside the signature page
      and moved Grant's glass to collect it. You have recovered a contaminated miniature with an intact
      neck. You have not identified that miniature as mine. The scraps I cleared were, I thought, from
      damaged gift packing. If that was wrong, it does not follow that I forced a cabinet. Record my account
      accurately. The opinions bear my name, and I will defend the distinctions in them even if nobody
      here enjoys hearing them.
  coming_clean:
    innocent: I will release the original opinion and the instructions for the estate draft. The dates
      matter. They establish prior legal work, not a continuous alibi. I made Grant's position appear
      safer than I believed it was, then tried to stop the final signature. I did not poison his glass.
      I understand perfectly well that the first admission does not oblige you to accept the second statement.
    murderer: I broke into the secured cabinet at 6:12. I used a common favor to bring poison from the
      original to his glass during the reception interval, 6:32 to 6:44, and hid the original behind the
      sideboard. The broken-gift explanation was mine. It concealed source damage, not a manufacturing
      defect. His punch was clean. I killed a client after spending months trying to make my own capitulations
      sound like legal judgment.
  authoring_notes:
    name: Sue Venir
    author_notes:
      causal: Clerk's estate request is historical; no guest conscripted as alibi.
      exoneration: Blank draft and continuing liability answer death-benefit suspicion; handling denial
        uncorroborated.
- id: 09
  briefing:
    history: Reed found an error in my article. Yes, Reed. I said I'd published a correction before I
      had actually sent it. Grant wanted the entire article withdrawn, including the part he disliked
      for perfectly sound reasons. He also asked me to endorse the acquisition. You cannot use a scholar's
      error as a voucher for the rest of your collection. He seemed to believe he'd purchased one.
    secret: One celebrated article of yours does contain an inference you stated too confidently. The
      main thesis still stands, but the mistake would be humiliating.
    objectives:
