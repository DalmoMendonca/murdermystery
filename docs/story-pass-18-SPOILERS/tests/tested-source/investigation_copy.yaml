- id: '12'
  briefing:
    history: Grant offered a settlement if I buried the ownership story. My editor had asked for one correction,
      not the story's funeral. I made the correction. Grant then wanted my source named as part of the
      settlement. That's when I stopped negotiating. He could sue the paper. He couldn't buy a person's
      name from me and call it a correction.
    secret: You obtained internal documents through a source inside the Meridian. Protecting that source
