      dealer. I said my correction had already been sent. It hadn't. Then I asked Reed DeLabel to sign
      an endorsement of the collection with me. He asked whether I intended to credit his work on that
      document either. I deserved that question.
    motive_murderer: Reed DeLabel found the mistake. I should establish that before I explain it for ten
