      harmed people I was supposed to represent.
  coming_clean:
    innocent: I will answer to my partners for the leak and the redacted account. The office copy proves
      the withdrawal was an organized response, not a plan invented after Grant died. It does not put
      me beyond reach of his glass. I did not poison him. I need the negotiations to continue, even if
      I am no longer the person trusted to conduct them.
    murderer: The delegation did not authorize this. I forced the cabinet at 6:12, stole the original,
      and used my favor to carry its poison to Grant's glass between 6:32 and 6:44. I hid the original
      behind reception. Its break became my story about a damaged gift. He drank clean punch from the
      glass I contaminated. I killed him, then kept speaking as if I were still representing other people.
  authoring_notes:
    name: Mona Lott
    author_notes:
      causal: Office records predate gala; delegation neither accomplice nor necessary present role.
      exoneration: Public withdrawal explains warning and planned alternative; proximity remains open.
- id: '15'
  briefing:
    history: My company was the anonymous buyer. Hugh bid. I negotiated a board-seat option without disclosing
      who owned the company. Grant lost the lot, found the invoice, and decided the buyer's identity belonged
      in his speech. I had paid for a private transaction. He wanted a public victory. It was going to
      be mine he announced as his.
    secret: You were the anonymous buyer in the auction incident everyone keeps referencing. You concealed
      your identity through Hugh to avoid a bidding war with Grant.
    objectives:
    - Keep Hugh Bidder from revealing your role in the auction.
    - Find out whether Artie Ficial supports your board candidacy.
    - Get Drew Conclusions to admit the 'algorithm discovering patina' line was at least a little funny.
  hearings:
    motive_innocent: I was the anonymous buyer. Hugh handled it through my company because I didn't want
      Grant bidding against my name instead of the work. He found out anyway. Now I'm apparently a speculator,
      a philistine, and unsuitable for the board, all on the strength of buying something he wanted. I
      drafted a retaliatory announcement about withdrawing support. My own advisers said it made me sound
      twelve. They were right. I brought it tonight because being right didn't make me calmer.
    motive_murderer: I bought the work anonymously through Hugh. That was supposed to prevent a bidding
      contest with Grant, not start a lifelong one. He had me excluded from another acquisition and planned
      to block my board appointment tonight. Then he would tell everyone my collection was speculative
      theater. I have paid very well for people to explain what makes a work important. He could still
      reduce all of that to a joke about my money, and the room would enjoy it.
    where_innocent: My lawyers prepared a support-withdrawal letter this week. I handed the envelope to
      a trustee at reception, then took it back when she asked whether the pledge was personal or corporate.
      It was corporate; I didn't have authority to withdraw it alone. I told her I could destroy Grant's
      announcement. What I actually had was a draft, an angry mouth, and a board of my own that hadn't
      approved the expensive part.
    where_murderer: I brought the withdrawal letter and discovered, at reception, how many qualifications
      a trustee could find in one paragraph. I took it back. Grant's glass was next to the program pile.
      I remember thinking how carefully even his drink had been branded. I promised to wreck his announcement,
      though the letter still required approval from my company's board. My advisers were waiting to hear
      what the trustee said. I wasn't eager to send them another reason to reject the letter.
    evidence_innocent: My advisers kept the draft and the email refusing permission to send it. You can
      establish that I was bluffing about the money without believing I'm a pleasant person. At reception
      I photographed the trustee's handwritten query and sent it back to them. The file time places that
      message inside the glass interval, but one message takes seconds. It isn't an alibi. I wanted Grant
      embarrassed in front of the people who kept laughing with him.
    evidence_murderer: The company's refusal was in my inbox. I still acted as if I could withdraw the
      money. I opened the favor beside Grant's glass while sending the photographed query, then cleared
      the scraps off my envelope. I thought they were from a damaged gift. The message took seconds; I
      wasn't filming the desk. You have a common bottle with no name on it and a fragment from the original.
      I understand why you're asking. I don't understand why my company's refusal should suddenly certify
      what someone else left at reception.
  coming_clean:
    innocent: Publish the proxy purchase if you like. It was legal, and it was embarrassing how much I
      wanted him not to know. I threatened a withdrawal I couldn't authorize, then sent a message that
      proves almost nothing about my whereabouts. I didn't kill Grant. I was trying to buy a different
      reaction from this room. Apparently that is one thing you can't simply fund.
    murderer: I forced the cabinet at 6:12 and stole the retained-content original. I used the gala miniature
      to carry poison to his glass on reception between 6:32 and 6:44, then hid the original behind the
      sideboard. Its damage was the gift accident I described. The punch was clean. My company hadn't
      authorized the withdrawal; nobody authorized the killing. I wanted to stop being the person he could
      dismiss.
  authoring_notes:
    name: Elon Mosaic
    author_notes:
      causal: Timestamp is one action inside window, not a phone-based blanket alibi.
      exoneration: Corporate refusal explains bluff; I remains angry at target location.
- id: '16'
  briefing:
    history: We accepted the donation in 1989. Grant promised the missing export papers would follow.
      They didn't. Reed asked for the original file, and I sent him a copy without the exception page.
      Thirty-seven years I've been answering that question with the word pending. He's young enough to
      ask why pending doesn't have an end date.
    secret: You did approve that accession because the museum was desperate for funds and you convinced
      yourself the paperwork would follow.
    objectives:
    - Ask Artie Ficial whether the naming agreement preserves the museum you founded.
    - Ask Tess Tament what she thinks Grant expects from his family tonight.
    - After the death announcement, use the printed hearings to compare suspects.
  hearings:
    motive_innocent: Yes, that's my signature from 1989. We had leaks in the roof and money for perhaps
      one of them. Grant offered a donation. I accepted while export papers were still promised, and told
      myself they would come. They never did. He planned to reveal the omission tonight as though he had
      just discovered it. He was there when I signed. I wanted that fact remembered too. It doesn't improve
      my signature, but it does spoil his little performance of surprise.
    motive_murderer: I approved the accession without the papers. I was old enough to know better then;
      being older now has not supplied an excuse. Grant kept the omission useful for decades. Tonight
      he intended to tell everyone I had founded a museum on careless judgment, while he put his own name
      on the building. I could survive losing a plaque. Watching him inherit the institution and blame
      me for the bargain we made together was something I had not prepared myself to survive politely.
    where_innocent: I borrowed the accession ledger this afternoon and removed the loose correspondence
      Grant had tucked into it. I brought the ledger to reception for the trustees. The missing page was
      his promise to send the papers; I kept it in my handbag because I wanted him asked about it after
      he questioned me. That's maneuvering, certainly. I did not erase the entry. Thirty-seven years of
      my signature is difficult to conceal with a handbag, however capacious.
    where_murderer: I took the ledger to reception with Grant's promise separated from the entry. I wanted
      to choose the order in which the trustees heard things. The ledger needed room on the sideboard.
      I moved the programs, waited for someone to bring reading glasses, and looked again at the signature
      I had spent years wishing I could unmake. Grant's promise to supply the export papers was separate
      from the entry. I wanted a trustee to read his promise before examining my signature.
    evidence_innocent: The archivist copied the ledger and the loose letter last Tuesday, before I borrowed
      either. Nothing I removed tonight could destroy those copies. They show Grant promising documents,
      not a completed export file. I laid the book on reception near his glass, and I could have touched
      it. I did not. Don't manufacture an elderly woman's helplessness into an alibi. I was quite capable
      of causing trouble, and intended to cause a good deal.
    evidence_murderer: The archivist's copies are accurate. At reception I moved Grant's glass to make
      room for the ledger and opened my miniature while waiting for reading glasses. There were scraps
      with the programs; I took them for damaged gift packing and cleared them. I was not comparing them
      with an original in locked storage. You have now made that comparison. It does not tell you who
      left the scraps among the programs. I will discuss my signature from 1989. I will not let you invent
      an evening around it.
  coming_clean:
    innocent: Put the letter back in the ledger. Leave my name beside the approval. I will explain the
      decision, including the desperate finances, without calling it right. Grant's promise is evidence
      that he knew, not evidence that I couldn't kill him. I didn't. I wanted the living man obliged to
      answer for his share of the bargain. There will be no answer from him now.
    murderer: I broke the secured cabinet open at 6:12 and took the original. The favor carried its poison
      to his reception glass between 6:32 and 6:44. I hid the bottle behind the sideboard and called its
      break a ruined gift. The service staff poured clean punch afterward. I made that old signature the
      subject of every conversation I could. It gave me something shameful to admit while concealing the
      killing.
  authoring_notes:
    name: Anya Tique
    author_notes:
      causal: Age never makes a culprit physically impossible; copies independently archived before gala.
      exoneration: Preserved copies defeat document-destruction reading; I retains capability and proximity.
- id: '17'
  briefing:
    history: There was a discretion fee. I approved it, and I left it off the copy supplied to the museum.
      Grant wanted the buyer's identity concealed and the fee waived. Hugh says that sounds like our usual
      business. Hugh would. The original invoice has my authorization. I was quite prepared to show it
      once Grant stopped describing his own request as my firm's dishonesty.
    secret: You did route the sale through a discreet subsidiary to satisfy a client who insisted on anonymity.
    objectives:
    - Compare notes with Hugh Bidder about Grant’s demands on auction houses.
    - Ask Elon Mosaic what he expects from tonight’s unveiling. Keep your private sale to yourself for
      now.
    - After the death announcement, use the printed hearings to compare suspects.
  hearings:
    motive_innocent: The subsidiary is ours. I routed a private sale through it because the buyer insisted
      on discretion. That arrangement was not presented to the full committee as it should have been.
      Grant knew the fee, and threatened to turn the omission into a scandal unless I waived it. I have
      dealt with difficult buyers for forty years. This one wanted the pleasure of threatening me as well
      as the saving. I declined rather less gracefully than I have been implying.
    motive_murderer: I permitted the subsidiary transaction. The committee should have reviewed it, but
      we had a client demanding anonymity and I elected to move quickly. Grant discovered the omission.
      He wanted his fee waived, then another concession, always with the committee minutes waiting in
      reserve. I built that house from rooms where nobody returned my calls. Tonight a man who could buy
      what he wanted was going to tell it that I was no longer fit to chair it.
    where_innocent: This week's finance committee requested the subsidiary invoices. I supplied the sale
      price and omitted the discretion fee. At reception I carried the full schedule in a sealed envelope,
      intending to let a trustee see Grant's threat first. That is selective disclosure, not good governance.
      I told our accountant Grant would get no further service from me. The accountant asked whether I
      meant the auction house or myself, and I failed to make the distinction reassuring.
    where_murderer: The full fee schedule was in my envelope at reception. I had not yet decided whom
      to trust with it. Grant's glass was there, and I shifted the envelope away from it. I had told our
      accountant he would get no further service. I was tired of qualifying every sentence so it could
      be safely repeated.
    evidence_innocent: Our accountant has the unabridged invoice. The fee was owed by the purchasing company,
      not personally by Grant; waiving it would benefit his demand, not extinguish our obligation to report
      it. I stood at reception with the seal still closed, then opened it to show a trustee. My hand was
      close to the glass. The audit demonstrates what I concealed, and that concealment was serious enough.
    evidence_murderer: The accountant can explain the liability. I opened my miniature at reception; the
      scent was on the envelope afterward. I moved Grant's glass when it stood on the invoices. That was
      not permission to keep examining me as if every ordinary thing on that sideboard belonged to me.
      Your original was found behind the furniture, where I never claimed to leave my gift. I cannot explain
      its break. I can explain precisely which sale the accountant should report.
  coming_clean:
    innocent: The committee will get the full schedule. I omitted the fee to protect a decision I had
      pushed through without review. Grant's death neither authorizes that decision nor makes the accountant
      forget it. I did not poison him. I cannot offer you an unbroken account of my evening, and I will
      not ask a trustee to produce one out of courtesy to my position.
    murderer: At 6:12 I forced the cabinet and took the original. I carried its poison in the favor and
      contaminated his empty glass between 6:32 and 6:44 at reception. The original went behind the sideboard;
      its break became my damaged-gift story. Clean punch was poured into the glass afterward. I knew
      perfectly well that killing him would not settle the audit. I wanted to stop the man who could still
      make me afraid of it.
  authoring_notes:
    name: Saul D. Bid
    author_notes:
      causal: Accountant and committee exchanges precede gala; no repeated live legal confrontation.
      exoneration: Actual fee debtor and surviving audit contextualize dispute without erasing motive
        or access.
- id: '18'
  briefing:
    history: The textile belongs to my relatives as well as me. I promised the loan before asking them.
      Grant offered to buy it and settle the objection that way. He can't buy consent from the person
      who failed to obtain it. The relatives asked me to withdraw the loan. I should have told Claire
      before the textile reached the display. I was hoping I'd persuade them by showing the photographs.
    secret: The textile is in the exhibition without the full paperwork your family expected because you
      were afraid the loan would be denied.
    objectives:
    - Ask Chip Patina how you can protect the ceremonial textile without selling it.
    - Ask Dada DiCapo whether the gala has become more about donors than artists.
    - After the death announcement, use the printed hearings to compare suspects.
  hearings:
    motive_innocent: The textile isn't mine to sell. It belongs to my family. I borrowed it for the installation
      and sent the museum less paperwork than my aunt had asked me to send. I thought I could sort that
      out once the work was accepted. Grant treated the missing conditions as an invitation to buy it.
      He offered me a price as if the only difficulty was getting me excited. I had already broken a promise
      to my family. Selling wasn't going to repair it.
    motive_murderer: Grant called the textile the strongest part of my installation, then asked what it
      would take to keep it. It belongs to my family. I had failed to lodge their full loan conditions,
      which made my refusal look negotiable. He said he could approach them directly and tell them what
      I had left out. I was ashamed, and I hated how readily he found that shame. The work I had made
      around it scarcely interested him. He wanted the thing I couldn't give him.
    where_innocent: I unfastened the textile from my installation before opening and rolled it into its
      support sleeve. I hadn't obtained the museum's permission to remove it either. My aunt had emailed
      a demand for its return that morning; I showed the handler the demand, but not the earlier messages
      in which I promised the paperwork was complete. The roll went onto the loading table. At reception
      I tried to have Grant's proposed purchase card removed from the program pile.
    where_murderer: I took the textile down and left it in its support sleeve by loading. Nobody should
      infer that it went home. I returned to reception for the purchase card. Grant's glass was beside
      the cards. I stayed there sorting out which version still described my family's textile as something
      he could acquire. The handler had seen my aunt's demand for its return. I hadn't shown the earlier
      emails in which I promised the loan paperwork was complete.
    evidence_innocent: My aunt's return demand is in the family email thread, sent before the bottle was
      stolen. The installation photograph shows the emptied support. Those records establish a retrieval
      I wasn't authorized to make, not where I stood afterward. I brushed fibers from the purchase card
      at reception. Some may have reached the outside of his glass; they don't identify poison. I was
      still angry enough to tear up his offer, and I have not apologized for that.
    evidence_murderer: The return demand was real, and the textile was safely rolled. I brought my favor
      back to reception along with the purchase card. I moved Grant's glass because it was on the card,
      then set it down. There were fibers on the papers, and I brushed them away. You are asking about
      the inside of the glass; I have told you about what I handled. I don't know how the original reached
      that furniture. I was looking for a purchase card, not another borrowed object.
  coming_clean:
    innocent: My aunt will have the whole thread, including the promises I didn't keep. I removed a borrowed
      family object without museum authorization because I'd put it into an arrangement my family had
      never approved. I didn't kill Grant. The return demand explains that removal. It doesn't wash the
      anger out of my reception visit. I would like someone to check that the sleeve is still flat. The
      textile shouldn't spend tonight bearing our mistakes.
    murderer: I forced the cabinet at 6:12 and stole the historical bottle. I used the gala favor to carry
      poison to his glass on reception between 6:32 and 6:44, then hid the original behind the sideboard.
      Its break was what I called a broken gift. Clean punch was poured later. I had protected the textile
      before I did this. Nothing was being rescued when I poisoned him. I wanted to hurt him.
  authoring_notes:
    name: Elle Loominate
    author_notes:
      causal: Textile removal, sleeve and family permission are central; no borrowed archivist profession.
      exoneration: Pre-theft return demand substantiates retrieval; exterior fibers contextual only.
- id: '19'
  briefing:
    history: My catalog note was wrong. Art used it, and I hid the correction because admitting it would
      make his article wrong too. Grant wanted the old attribution on the wall. I changed the online entry
      without permission. Claire then wanted to know why the screen and the printed proof disagreed. They
      disagreed because I finally corrected something I'd been pretending wasn't mine to correct.
    secret: You have not yet told Art that your discovery also undermines one sentence in his published
      research.
    objectives:
    - Ask Claire O’Scuro whether she is comfortable with the Star Bowl label.
    - Ask Dr. Art E. Fact how a junior researcher should challenge a donor’s version of history.
    - After the death announcement, use the printed hearings to compare suspects.
  hearings:
    motive_innocent: The archival document contradicts the ownership label. It also contradicts a sentence
      in my supervisor's published work. I told Claire the first part and managed not to tell Art the
      second. Grant told the department my fellowship might disappear if I pursued it. I depend on that
      stipend. I wanted to be brave about the donor and very careful about my supervisor, which isn't
      bravery so much as choosing the person least likely to read my next chapter.
    motive_murderer: Grant could end my fellowship by making one call. He said that rather gently, as
      if he were explaining how the building worked. I had found a document that contradicted the label,
      and I had not told Art it also undermined his article. So Grant could ruin my funding, and my discovery
      could ruin my relationship with my supervisor. I kept trying to think of a version of the truth
      that would leave me a place to work afterward.
    where_innocent: I submitted a correction under Art's name, without his permission. The journal rejected
      it last week and asked him whether he had authorized me. I brought that email to reception, then
      folded it behind the label proof when a trustee approached. I also asked the poison-exhibition committee
      for the Vale court inventory. That request looks dreadful now. It asked how the bottle was catalogued,
      not to inspect its contents, but I did know the original existed.
    where_murderer: The rejected correction was behind my label proof at reception. I was afraid of someone
      recognizing the journal's heading. Grant's glass was right there. I kept looking for somewhere to
      put the folded email where it wouldn't be read. I had requested the Vale inventory for research.
      I knew which exhibit the missing bottle belonged to.
    evidence_innocent: The committee's reply refused access to the original and attached a scan of the
      court inventory instead. My annotated scan was sent back to the journal before tonight. I moved
      the proofs across reception and left them under a program. I didn't handle the glass. Art's correction
      remains his to make; submitting it in his name was an appalling way of trying to help him.
    evidence_murderer: The refusal was explicit. I understand it doesn't prove where I went afterward.
      My scan was sent to the journal, and my favor was open beside the proofs on reception. I shifted
      the glass to cover the email. I should have said that before, but every time I tell you one thing
      there is another question about it. The original was not in the papers I carried. Its break is not
      something I can explain with an annotation. Please let me finish reading the committee's reply.
  coming_clean:
    innocent: Art should see the rejected submission, including the name I used. The scan and the journal
      correspondence show a research trail before tonight, not permission to inspect a poison bottle.
      I didn't kill Grant. I tried to rescue a fellowship and a supervisor's reputation by concealing
      the part each of them would dislike. Now I have to hand over the entire document and let both of
      them decide what remains of those relationships.
    murderer: I forced the cabinet at 6:12. I took the original, carried poison in the favor, and contaminated
      his reception glass between 6:32 and 6:44. I hid the original behind the sideboard. Its broken neck
      was the accident I blamed on the gift. The punch was clean. I knew the request had been refused.
      I knew the cabinet was secured. I did it anyway, then used that refusal to make myself sound harmless.
  authoring_notes:
    name: Reed DeLabel
    author_notes:
      causal: Inventory research gives knowledge, never preparation; refusal not physical impossibility.
      exoneration: Pre-gala annotated scan explains suspicious research; forgery and funding motive remain.
- id: '20'
  briefing:
    history: Grant ordered a cheaper replica instead of paying the balance on my sculpture. I had changed
      the support and left the fabricator off the credit. Neither of those facts excuses him replacing
      my work. They're inconveniently real, though. The replica was arriving while the original stood
      by the door. Someone suggested I could take a photograph beside it. I suggested something else.
    secret: You built one internal support differently from the approved plan because the fabricator missed
      a deadline.
    objectives:
    - Ask Frank Lloyd Wrong whether the entrance display still includes your original sculpture.
    - Ask Vincent Van Faux how he handles patrons who try to replace an artist’s work.
    - After the death announcement, use the printed hearings to compare suspects.
  hearings:
    motive_innocent: Grant wanted my entrance sculpture replaced with a cheap replica after the photographs.
      Then he wanted to dispute the balance because the internal support differed from the approved plan.
      It does differ. The fabricator missed the deadline, and I changed it without waiting for Frank Lloyd
      Wrong to approve the drawing. I told Grant he could pay for the work or explain to his guests why
      their entrance was suddenly empty. He said I wouldn't dare move it. Apparently he hadn't noticed
      the sort of things I move.
    motive_murderer: Grant wanted my entrance sculpture replaced with a cheap replica after the photographs.
      Then he wanted to dispute the balance because the internal support differed from the approved plan.
      It does differ. The fabricator missed the deadline, and I changed it without approval. I told Grant
      he could pay for the work or explain why his entrance was empty. He said the replica would look
      the same, provided nobody mentioned me. I have spent my life making things you can't carry away
      in a handbag. He made me feel disposable.
    where_innocent: I brought the unpaid invoice to the sideboard and set my plaster-dusted case down.
      Grant's glass was in the way, so I lifted it and put it farther back. I used my unopened favor to
      weight the invoice; the reception draft kept lifting the page. His assistant asked me to move everything.
      I closed the case and left it for collection. Then I told the crew I'd withdraw permission to display
      the sculpture unless Grant paid. They took me seriously. I stopped at the service entrance to make
      sure the removal equipment hadn't gone home.
    where_murderer: I brought the unpaid invoice to the sideboard and set my plaster-dusted case down.
      Grant's glass was in the way, so I lifted it and put it farther back. His assistant asked me to
      move everything. I packed the case, then stayed to leave a clean copy beside the glass. After that
      I went to tell the crew I'd withdraw permission to display the sculpture.
    evidence_innocent: That's probably my plaster on the outside. I handled the glass with dirty hands.
      The crew retained the drawing showing my altered support before tonight; it wasn't drawn up after
      Grant died. The unpaid invoice says withdraw display permission, not transfer ownership to me. If
      I had got the sculpture outside, it would still have been disputed property. My favor was unopened.
      You can examine it; I'm not asking you to take a sculptor's word for a seal. I won't let his estate
      keep the work for nothing while we argue.
    evidence_murderer: The plaster outside is mine. I handled his glass. I left the invoice, then packed
      up the things I'd brought. I cleared packing scraps as well; I took them for a damaged favor. You're
      showing me an original bottle and a piece that joins it. I understand originals; I'm not going to
      suggest it's a convincing replica. But I didn't collect every scrap from that sideboard before I
      put my papers down. I moved a glass to make room for an invoice. If that looks ugly now, it looked
      quite ordinary while Grant was still refusing payment.
  coming_clean:
    innocent: I changed the support, threatened to withdraw the sculpture and moved Grant's glass. I didn't
      poison him. The crew's drawing predates this evening. The work stays pending inspection and the
      payment dispute goes to his estate. They can have the drawings. They cannot have the sculpture by
      waiting for me to stop asking for money.
    murderer: I forced the cabinet at 6:12 and took the poison bottle. I carried poison in the favor and
      put it in the glass I moved on the sideboard. My plaster was left outside; the poison was inside.
      The broken-gift explanation hid the original's fragment. I wanted Grant to stop treating me as something
      he could replace. I killed him.
  authoring_notes:
    name: Al Baster
    author_note: Real target handling and exterior plaster remain strong after Method. Retained predeath
      support drawing and invoice distinguish an actual withdrawal dispute from retroactive fabrication,
      mitigating but not clearing. No individual favor laboratory result is claimed. Unopened-favor statement
      is inspectable and contestable. G's known favor breakage, target contact and fracture defeat ordinary
      clutter explanation more strongly than innocent support paperwork alone.
- id: '21'
  briefing:
    history: I sold the painting I'd promised to donate. I needed the money. The replacement wasn't what
      I'd pledged, and Grant recognized it before the unveiling. He wanted to thank me for the original
      in his speech. I asked him to change the acknowledgment. He said he thought the guests would enjoy
      hearing why the frame looked different. I was not enjoying the conversation.
    secret: You sold it to cover a failed business investment and hoped to replace it before anyone noticed.
    objectives:
    - Ask Vincent Van Faux what the museum expects a collector to donate.
    - Compare gala expectations with Elon Mosaic. Keep your withdrawn donation private for now.
    - After the death announcement, use the printed hearings to compare suspects.
  hearings:
    motive_innocent: I promised the painting to another museum, then sold it. A business investment failed,
      and I needed the money. I'd intended to buy a replacement before anyone noticed; saying that aloud
      reveals how absurd the plan was. Grant found the sale and decided it belonged in his speech. I asked
      him to leave it to me to tell the trustees. He asked why they should believe me after the promise.
      I had no attractive answer to that.
    motive_murderer: The promised donation was sold. I was covering a failed investment and thought I
      could replace it before the institution asked for delivery. Grant discovered the sale. He was going
      to expose it tonight among people who had thanked me publicly for being generous. I offered to make
      restitution. He preferred the announcement. You can call this vanity; it was vanity, and fear, and
      the knowledge that some of my closest friendships had come with very expensive conditions.
    where_innocent: I asked the portrait photographer to omit the institution's trustees from my group.
      Then I went to reception and altered my acknowledgment card so it no longer mentioned the promised
      work. I had sent the receiving museum a revised delivery date this week, knowing there could be
      no delivery. Their registrar replied that morning asking for the lender's details. I did not answer.
      That was another lie, and it was sitting on my phone while I tried to make the card look innocent.
    where_murderer: I changed the acknowledgment card at reception and waited for the photographer to
      arrange a different group. The institution's trustees were not people I wanted beside me. Grant's
      glass was already waiting on the sideboard. He had a very tidy evening planned for someone else's
      humiliation. The registrar had asked for delivery details. I left that message unanswered and worked
      on the card as though removing a sentence settled anything.
    evidence_innocent: The receiving museum kept my revised date and its registrar's reply. They also
      have the original promise. My card correction conceals a real default; it does not transfer the
      work back into my possession. I held Grant's glass by the base while sliding the card away, and
      put it down again. No one needs to invent that contact. I did not put anything in it. I went back
      to the photograph and smiled rather more carefully than usual.
    evidence_murderer: I held the glass by its base to free the acknowledgment card. The miniature was
      open beside it. I went back for the photograph afterward, and the photographer could see only what
      was in front of her. The scraps I cleared looked like broken gift packing. I didn't inspect every
      piece before clearing it away; I was distracted. Your comparison tells you what that blue piece
      belongs to. It doesn't tell you why I was trying to keep a trustee out of my photograph.
  coming_clean:
