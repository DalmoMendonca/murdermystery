schema_version: 1
purpose: Author draft; only the selected murderer branch is spoken in an actual game.
characters:
- id: '01'
  name: Artie Ficial
  motive_innocent: >-
    Could we move away from the entrance? People keep asking whether the gala is over.
    Grant wanted my resignation attached to his donation. I had already accepted another
    museum's offer, but I wanted to leave as a director, not as the item he traded for a
    new wing. I copied his signature onto a demand and sent it to our chair. That was
    supposed to force a discussion. She asked why a donor's letter had come from my printer.
  motive_murderer: >-
    Could we move away from the entrance? People keep asking whether the gala is over.
    Grant wanted my resignation attached to his donation. I had already accepted another
    museum's offer, but I wanted to leave as a director, not as the item he traded for a
    new wing. I copied his signature onto a demand and sent it to our chair. Then Grant
    said he would warn the other museum what sort of director they were getting.
  opportunity_innocent: >-
    I took his announcement out of the speech folder. Brie DeVivre had enough to do
    without watching me quarrel with a piece of paper. I put my own version in, thanking
    him for a gift with none of his conditions. The folder was beside the reception
    sideboard. When his assistant noticed, I told her Grant could speak when he signed
    my version. She took the folder away. I followed her halfway to the office, then
    remembered I was still welcoming people.
  opportunity_murderer: >-
    I took his announcement out of the speech folder. Brie DeVivre had enough to do
    without watching me quarrel with a piece of paper. I put my own version in, thanking
    him for a gift with none of his conditions. My favor broke while I was sorting that
    mess. His assistant took the folder away. I returned to the sideboard with the
    acknowledgment cards; there was no reason to let our guests see a director standing
    there with nothing to do.
  method_innocent: >-
    The assistant kept both announcements. Mine still says the gift is subject to board
    approval. You can dislike it without believing it became binding when Grant died.
    I didn't touch the glass. I did tell Brie DeVivre to delay the toast, and I let him
    think that order came from the chair. It didn't. The chair's reply was to stop using
    her name. Please put that with the forged letter. They belong together, even if
    neither makes me especially welcome at my next job.
  method_murderer: >-
    Those cards were on the sideboard beside his glass. I set them in order and moved
    the glass back. A broken favor isn't an extraordinary thing at a party. You're
    asking me to turn a small accident into a confession because a piece joins the
    original bottle. I understand the comparison. I don't agree it tells you everything
    I did at that desk. Grant's assistant had brought back his announcement unchanged.
    I stood there reading it while everyone else carried on getting ready to thank him.
  coming_clean_innocent: >-
    I forged the letter and tried to replace his speech. I wanted him defeated in front
    of the people who had been flattering him all evening. I didn't kill him. The chair
    will receive both announcements and my job offer. I suspect her answer will be
    considerably shorter than my welcome speech.
  coming_clean_murderer: >-
    I forced the cabinet at 6:12 and took the historical bottle. I carried the poison
    in my favor and put it in Grant's glass on the sideboard before service collected
    it. My broken-gift story hid the neck fragment. I killed him because I couldn't
    bear to let him decide how my work ended.
  author_note: >-
    Image management escalates into forgery and a toast delay that could conceal interference.
    Retained competing speeches and the chair's refusal mitigate a death-dependent board coup;
    they do not exclude either crime window. G's return to the target and gift cover acquire
    source significance only with Act III. Glass handling remains contestable, not a confession.
- id: '04'
  name: Monet Bags
  motive_innocent: >-
    Payroll cleared. That is the good part. I moved restricted money to make it clear,
    without authorization, against Grant's promised donation. He found out and wanted
    his private-wing expenses hidden in the same account. When I refused, he offered
    to explain my transfer to the trustees personally. I took the finance pack off the
    board table. Artie Ficial thought I was updating it. I was removing the page that
    would get me suspended before anyone heard why the wages were paid.
  motive_murderer: >-
    Payroll cleared. That is the good part. I moved restricted money to make it clear,
    without authorization, against Grant's promised donation. He found out and wanted
    his private-wing expenses hidden in the same account. When I refused, he offered
    to explain my transfer to the trustees personally. I took the finance pack off the
    board table. He watched me do it. Then he asked for the account password as though
    we had just agreed I would work for him indefinitely.
  opportunity_innocent: >-
    I withheld authorization for the extra course. Casey Hart came off the reception
    floor to ask me again, because Grant had apparently told the kitchen I approved
    it. I made Casey Hart stay while I rang the supplier. Then I put a hold on the
    outstanding gala payment, including Brie's legitimate balance. That got everybody's
    attention. The signed refusal was on the sideboard afterward. I knew the glass was
    there; I was more interested in making Grant come to me for his signature.
  opportunity_murderer: >-
    I withheld authorization for the extra course. Casey Hart came off the reception
    floor to ask me again, because Grant had apparently told the kitchen I approved
    it. I made Casey Hart stay while I rang the supplier. Then I put a hold on the
    gala payment. My favor broke while I was finding the authorization envelope.
    I went back to the sideboard myself. If Grant wanted his dinner restored, he was
    going to find my refusal beside the glass prepared for his photograph.
  method_innocent: >-
    The supplier's copy records a payment hold, not a changed food order. The extra
    course never left the kitchen; the shared punch tested clear. That accounts for
    what I threatened to stop. It doesn't turn my transfer into authorized spending.
    I tore the removed finance page in half, then kept both halves because the totals
    wouldn't reconcile without it. They're in my bag. I intend to give the auditor
    the whole pack. I would prefer to do it without Grant's account of my motives.
  method_murderer: >-
    The bank can give you the transfer. The supplier can give you the hold. Neither
    records what was on that sideboard. I left my refusal beside his glass and stayed
    to check the envelope. You're treating my broken favor as that missing neck.
    I didn't compare edges when it happened. There were enough things going wrong.
    Yes, Casey Hart was still in the kitchen because I'd kept the argument running.
    I wanted Grant inconvenienced. You don't get to turn that word into whatever
    you need it to mean.
  coming_clean_innocent: >-
    I used restricted funds and held a supplier's money hostage to get Grant's attention.
    Brie DeVivre's crew earned that payment. I'll release the legitimate balance and
    report the transfer. I didn't poison Grant. I still want the trustees to see what
    he asked me to bury, including the expenses they were quite happy to enjoy tonight.
  coming_clean_murderer: >-
    I broke into the cabinet at 6:12. I used the original poison, carrying it in the
    ordinary favor, and poisoned Grant's individual glass during the service gap I
    helped create. The broken gift was a lie. He could expose me, and I decided I
    would rather silence him than answer for what I'd done.
  author_note: >-
    Financial coercion creates real unattended-glass opportunity by detaining the service manager.
    Blocked course and clear punch rebut a catering-contamination theory, not individual-glass
    poisoning. Torn account survives as wrongdoing. G combines an engineered gap, target-side
    presence and gift cover discredited by the fracture; financial records do not certify innocence.
- id: '05'
  name: Chip Patina
  motive_innocent: >-
    Put the photograph down by its edges. Thank you. Grant wanted a recent repair
    described as original workmanship. I refused. Unfortunately, I'd changed a treatment
    date last month to get an insurance claim inside its deadline. He had that copy.
    He tapped the date with his finger while telling me a private conservator could
    be much more helpful. I took the report back out of his hand. I wasn't going
    to watch him wave my bad record over an object and call that scholarship.
  motive_murderer: >-
    Put the photograph down by its edges. Thank you. Grant wanted a recent repair
    described as original workmanship. I refused. Unfortunately, I'd changed a treatment
    date last month to get an insurance claim inside its deadline. He had that copy.
    He tapped the date with his finger while telling me a private conservator could
    be much more helpful. Thirty years of looking after objects, and he was offering
    to replace me with somebody willing to damage one for a better opening photograph.
  opportunity_innocent: >-
    I closed the alcove when the mount cracked. Grant wanted the unveiling to proceed.
    I stepped in front of him and took the radio from the attendant to call the hold
    myself. Yes, I shoved him back. He was reaching past me for the barrier. Afterward
    I emptied my kit on the reception sideboard looking for the original treatment
    sheet. There were tools, gloves and the clear replica. I cleared them when service
    wanted the space. The report stayed in my jacket. I told collections not to
    circulate my receiving notes until I'd checked them.
  opportunity_murderer: >-
    I closed the alcove when the mount cracked. Grant wanted the unveiling to proceed.
    I stepped in front of him and took the radio from the attendant to call the hold
    myself. Yes, I shoved him back. Afterward I emptied my kit on the reception
    sideboard looking for the treatment sheet. I had broken the favor and made an
    irritating mess of the kit. I cleared the tools when service wanted the space.
    I stayed to put the papers in order beside Grant's glass. Collections could
    wait for my receiving notes.
  method_innocent: >-
    The crack wasn't an excuse I invented. The inspection photographs show it, and
    the console records the hold before the unveiling. I recommended locked storage
    for the historical bottle and the empty replica for display. I also sat on
    the receiving notes because the changed treatment date was in the same folder.
    Don't tell me that was harmless. It kept the condition warning from somebody
    who needed it. The replica in my kit has an open bottom. I can account
    for that object. I still owe collections an account of the folder.
  method_murderer: >-
    I know the replica has an open bottom. I recommended it. The fragment you're
    comparing comes from the original; I can see the join. It wasn't an old
    chip in my tools. I moved Grant's glass to keep it off my report at
    the sideboard. I put the report back in the kit afterward. You're asking
    whether the broken favor was really that bottle. I'm asking who else had
    been through the kit while I dealt with the mount. I should have checked
    it before I called the favor broken.
  coming_clean_innocent: >-
    I changed the date and held back the folder. I shoved Grant away from
    a failed mount, and I'd do that again. I didn't poison him. The insurer
    gets the original report. The bowl stays off display until the mount is safe.
    You can take my title away. You cannot authorize the installation I stopped.
  coming_clean_murderer: >-
    The objection to exhibiting the original was mine. I then forced its cabinet
    at 6:12, took the poison and carried it in the favor to Grant's glass.
    I left the original behind the sideboard. I protected the collection and killed a person.
    Those are both things I did; the first does not excuse the second.
  author_note: >-
    Physical confrontation, falsified date, withheld condition folder, tools and sideboard access
    form a serious rival. Real photographed mount failure explains shove; open-bottom replica
    resolves one object, not source access. G uses a contestable kit-interference cover after the
    fracture, with original intact at receiving and later target contact making own handling stronger.
- id: '06'
  name: Dada DiCapo
  motive_innocent: >-
    The note is mine. RETURN WHAT WAS TAKEN. I meant my performance, although the
    capitalization was intended to leave Grant uncomfortable about several other things.
    His foundation took my credit, then canceled my piece and kept the effect for
    a film. The effect makes an empty donor jacket collapse. He called that too
    hostile for the gala. Apparently stealing it improved the tone. I told him he'd
    be very uncomfortable watching the closing sequence. I rather wanted him to wonder
    whether I had stopped being theatrical.
  motive_murderer: >-
    The note is mine. RETURN WHAT WAS TAKEN. I meant my performance, although the
    capitalization was intended to leave Grant uncomfortable about several other things.
    His foundation took my credit, then canceled my piece and kept the effect for
    a film. The effect makes an empty donor jacket collapse. He called that too
    hostile for the gala. I told him he'd be very uncomfortable watching the closing
    sequence. He laughed and asked whether discomfort was included in his commission.
    I remember exactly how pleased he was with that.
  opportunity_innocent: >-
    I tried to put the canceled cue back. I told the operator Artie Ficial had
    approved it. Please enjoy his expression; it is the first accurate part of that
    conversation. I brought the rehearsal glass and empty jacket out where Grant could
    see them. When the mounting hold canceled the sequence, I carried the jacket
    away and left the PROP glass by the stand. Then I went to reception to retrieve
    my credit sheet. I wanted him to see my name where his glass was waiting.
  opportunity_murderer: >-
    I tried to put the canceled cue back. I told the operator Artie Ficial had
    approved it. Please enjoy his expression; it is the first accurate part of that
    conversation. When the mounting hold canceled the sequence, I left the PROP glass
    by the jacket. I went to reception with my credit sheet and the gift packet.
    The silly bottle had broken. I was in no mood to fetch somebody a broom.
    I put the sheet beside the glass that would actually reach Grant.
  method_innocent: >-
    I didn't mistake the glasses. PROP is written under the rehearsal one, and I
    put it there. Its test is clear. The console kept my request to restore the
    cue and the safety cancellation that stopped it. My staged collapse never happened.
    I would like those facts established without anyone describing my work as a
    harmless little prank. It was meant to humiliate him, and I lied to get it
    performed. The joke depended on Grant watching it. He was supposed to recognize
    exactly whose work he had taken.
  method_murderer: >-
    The PROP glass stayed with the stand. I knew which glass was Grant's, and I
    knew my cue wasn't going to run. I turned the real glass so the star showed
    and put my credit sheet down. Now the comparison says the broken piece belongs
    to the historical bottle. A thing breaking doesn't tell me where it came from.
    I called it a favor because it was with my favors. You can think that
    was convenient. I have spent this evening watching people attach the wrong names
    to things. I'm allowed to object when it happens to me.
  coming_clean_innocent: >-
    I wrote the warning and lied about permission. I wanted his foundation to lose
    its lovely evening, and I wanted my name back. I didn't kill him. The canceled
    cue and tested PROP glass are still there. I won't withdraw the credit claim
    because the man who stole my work is dead.
  coming_clean_murderer: >-
    I forced the cabinet at 6:12 and took the original. I used the favor to carry
    its poison to Grant's real glass on the reception sideboard. The collapse cue
    was canceled; the murder wasn't a performance. The broken gift was my cover for
    the source fragment. I killed him. He cannot watch me claim my work now.
  author_note: >-
    Threatening note, staged donor collapse and false authorization create a consequential rival.
    Canceled cue and clear PROP distinguish theatrical route from actual glass, which remains
    accessible. G's deliberate target handling and favor cover discredited by physical source join
    outweigh an uncorroborated misidentification protest. Performance personality is not forensic proof.
- id: '09'
  name: Dr. Art E. Fact
  motive_innocent: >-
    Reed DeLabel found the mistake. I should establish that before I explain it
    for ten minutes and accidentally make it sound like my discovery. One inference
    in my article was too strong. Grant wanted the whole article withdrawn, including
    the perfectly sound research into his wartime dealer. I said my correction had
    already been sent. It hadn't. Then I asked Reed DeLabel to sign an endorsement
    of the collection with me. He asked whether I intended to credit his work on
    that document either. I deserved that question.
  motive_murderer: >-
    Reed DeLabel found the mistake. I should establish that before I explain it
    for ten minutes and accidentally make it sound like my discovery. One inference
    in my article was too strong. Grant wanted the whole article withdrawn, including
    the perfectly sound research into his wartime dealer. He held my correspondence
    up and said he could make the withdrawal happen for me. I had spent years
    following those objects. He was about to make my mistake the only fact anyone
    remembered about any of them.
  opportunity_innocent: >-
    I requested the Eleanor Vale case file and asked whether the bottle retained
    its original contents. That request is mine. I was planning a lecture on the
    poison exhibition; the second page asks for the empty replica. At reception I
    took the research request off the circulation pile because somebody had separated
    those pages. I also removed Grant's endorsement sheet. I stood at the sideboard
    writing that I would not sign it. It took me several attempts to avoid writing
    something he could enjoy quoting in court.
  opportunity_murderer: >-
    I requested the Eleanor Vale case file and asked whether the bottle retained
    its original contents. That request is mine. I was planning a lecture on the
    poison exhibition. At reception I took the request off the circulation pile and
    removed Grant's endorsement sheet. I had broken my favor while getting the papers
    out. I wrote my refusal at the sideboard, beside the glass. It took several
    attempts to avoid writing something he could enjoy quoting. I stayed there after
    the other papers had been collected.
  method_innocent: >-
    Please read the second page now. It asks for the replica and the coroner's
    report, not access to the original. Collections refused opening the historical
    bottle; that refusal is attached. My request tells you I knew about the poison.
    It doesn't tell you I had it. I sent the correction from my phone before
    the toast, this time naming Reed DeLabel. The endorsement stayed unsigned. I am
    not offering an academic correction as an alibi. I am objecting to half a
    document being treated as a complete account.
  method_murderer: >-
    The second page does ask for the replica. Collections never authorized me to
    open the original. At the sideboard I moved Grant's glass off the pages and
    finished the refusal. Now you have a broken piece from an object I said I
    hadn't handled. A fracture establishes which bottle it belongs to. It doesn't
    establish every hand it passed through. If somebody had left it among my papers,
    I might have called it a broken favor. I realize how that sounds. The possibility
    doesn't vanish because the person stating it has a motive.
  coming_clean_innocent: >-
    I overstated the inference, delayed the correction and tried to borrow my student's
    credibility. Grant's conduct does not repair mine. I didn't take the original or
    poison his glass. The whole research request and refusal are available. I will
    publish the correction under my own name, with Reed DeLabel's contribution stated
    where a reader can actually find it.
  coming_clean_murderer: >-
    I knew the historical bottle contained poison. I forced the cabinet at 6:12 and
    took it, then carried poison in the favor and put it in Grant's glass before
    service collected it. I lied about the broken gift. I killed him to preserve
    my work and standing. I destroyed both, along with a life.
  author_note: >-
    Prior poison knowledge, hidden request and blackmail supply serious means and motive. Full
    request and opening refusal distinguish scholarship from permission, not physical impossibility.
    G's contamination-by-other-hands cover remains a claim without a witnessed transfer. Fracture
    and lingering target encounter support own handling more strongly than the absent permission.
- id: '10'
  name: Tess Tament
  motive_innocent: >-
    Grant put the trust amendment between my place card and my plate. He wanted
    me removed from the foundation unless I supported his naming scheme. I moved
    the amendment to his place. Then I told Artie Ficial the family would block
    the money. The family had not agreed. I was trying to make it expensive for
    them to disagree in public. Grant knew I was bluffing. He asked whether I'd
    chosen a worthy cause for the fortune I no longer expected to control.
  motive_murderer: >-
    Grant put the trust amendment between my place card and my plate. He wanted
    me removed from the foundation unless I supported his naming scheme. I moved
    the amendment to his place. Then I told Artie Ficial the family would block
    the money. The family had not agreed. Grant knew I was bluffing. He asked
    whether I'd chosen a worthy cause for the fortune I no longer expected to
    control. Everybody nearby laughed politely. They thought he was letting me make
    one of my little jokes.
  opportunity_innocent: >-
    My first admission receipt is after the missing-bottle report. I arrived late because
    I was still calling trustees from the car. At reception I broke a rental
    glass dragging the amendment out of my bag. I pushed the stem into the napkins
    and left it. Then I took Grant's signing pen. I wanted him unable to stage
    another little ceremony before I'd reached the last trustee. His assistant searched
    the sideboard for it. I watched her, with the pen in my hand behind my bag.
  opportunity_murderer: >-
    I collected my admission receipt after the missing-bottle report. I'd come through
    the entrance earlier while calling trustees. At reception I broke a rental glass
    dragging the amendment out of my bag. My favor had broken as well; a very
    elegant evening for my possessions. I took Grant's signing pen and stayed by
    the sideboard pretending to reach the last trustee. His assistant came looking
    for the pen. I gave it back once she had stopped asking me to sign.
  method_innocent: >-
    The receipt records first entry. The stem Casey Hart removed was a rental,
    without the museum star, before the donor glass was unwrapped. That explains the
    broken glass I concealed. It doesn't explain why I enjoyed concealing it. The
    pen is back, the amendment is unsigned, and death doesn't give me the trustees'
    votes. I might win them now. Please don't require me to pretend that possibility
    has escaped my notice. I still intend to move the foundation's giving away
    from Grant's priorities. Somebody should have done it years ago.
  method_murderer: >-
    The stem was a rental. That isn't the piece in the comparison. My receipt
    was for collecting my ticket, as I said; it doesn't record my earlier arrival.
    I had Grant's pen beside his glass while I sorted my bag. I didn't pick
    a broken favor out with a loupe and an inventory list. Apparently I should
    have. The trustees hadn't agreed to stop him. I was tired of announcing
    decisions I couldn't make happen. That doesn't make every broken thing in my
    bag something I stole from a cabinet.
  coming_clean_innocent: >-
    I bluffed the director, hid the broken stem and stole a signing pen. I didn't
    poison Grant. The first-entry receipt and removed rental glass account for what I
    actually did. I will ask the trustees for their votes tomorrow. I won't claim
    his death has made me kinder, or less interested in winning them.
  coming_clean_murderer: >-
    I was here at 6:12. I forced the cabinet, took the poison and carried it in
    my favor to Grant's glass on the sideboard. The rental stem was real; the
    broken-favor story wasn't. I wanted the foundation out of his hands. I chose
    to kill him rather than keep asking other people to stand up to him.
  author_note: >-
    Trustee coercion, stolen signing pen and hidden stem sustain suspicious callousness. First-entry
    receipt after theft excludes source route if trusted, not glass window; stem removed before
    target unwrapping rebuts wrong-glass handling. G has an earlier arrival and an ordinary bag cover
    defeated by original fracture. Admission receipt must retain branch-sensitive first-entry meaning.
- id: '11'
  name: Barb Dwyer
  motive_innocent: >-
    I ordered the Salon camera unplugged. Grant asked for private meetings, and I
    let that count as authority. My officer objected. I overruled her. Grant then
    said security would own any failure tonight, as if he'd just briefed me on
    the weather. I left the disconnection out of the incident book. The work order
    still carries my name. You can read it without asking the technician to defend
    the decision. It was my decision. I was already looking for a way to
    keep it off Monday's report.
  motive_murderer: >-
    I ordered the Salon camera unplugged. Grant asked for private meetings, and I
    let that count as authority. My officer objected. I overruled her. Grant then
    said security would own any failure tonight, as if he'd just briefed me on
    the weather. I left the disconnection out of the incident book. The work order
    still carries my name. I'd spent years learning to recognize people who expected
    somebody else to carry their risk. Tonight I was taking orders from one.
  opportunity_innocent: >-
    When the cabinet alarm went, I closed storage access and sent an officer to
    search. Grant said the bottle was empty. I treated it as a theft before
    treating it as a hazard. Collections disagreed and requested the auction condition.
    We didn't get the reply before the toast. I held back the first radio exchange
    from the incident summary. Afterward I checked the reception route myself. I shifted
    the waste basket away from the exit and told Casey Hart to clear the sideboard.
    I was still worrying about appearances.
  opportunity_murderer: >-
    When the cabinet alarm went, I closed storage access and sent an officer to
    search. Grant said the bottle was empty. Collections requested the auction condition;
    we didn't have the reply before the toast. I held back the first radio
    exchange from the incident summary. Later I checked the reception route. My favor
    had broken, which was hardly the damage I was interested in reporting. I shifted
    the waste basket away from the exit and stayed at the sideboard after telling
    Casey Hart to clear it.
  method_innocent: >-
    The cabinet alarm is independent of the Salon camera. The lock was forced;
    turning off that camera didn't provide a key. My officer's original radio record
    still includes the collections objection. I wanted the summary to make my first
    response look better. I didn't have confirmation that the original was empty. I
    had Grant's word and used it. The service order survived my demand to clear
    the sideboard. That glass should have been secured while we checked the hazard.
    It wasn't. I'm not handing you my officer's notebook to make that her fault.
  method_murderer: >-
    The camera didn't switch off the cabinet alarm. I know. The alarm recorded
    the opening anyway. At reception I put my folder beside Grant's glass and
    moved the glass out of the way. The favor was broken when I dealt
    with it. You have a fragment from the original. Nobody saw me take that
    original out of storage. I delayed the report because I believed Grant, not
    because I had advance knowledge. That's my answer. Keep the original radio record;
    I know you'll be comparing it with everything I say.
  coming_clean_innocent: >-
    I concealed the camera exception and delayed the hazard response. I then tried
    to conceal the delay. I didn't take the bottle or poison Grant. The officer's
    original record goes with the work order. Nobody on my team is to rewrite
    either one to protect me. They followed orders that should have been better.
  coming_clean_murderer: >-
    I forced the cabinet at 6:12, took the original and delayed the response while
    we searched. I carried poison in the favor and put it in Grant's glass
    on the reception sideboard. I used my position to keep people following my
    orders. The broken gift was another lie. My officer was right to keep her record.
  author_note: >-
    Suppressed response and camera exception make a strong institutional rival. Camera outage
    cannot defeat independent alarm or locked case. Victim's false empty claim and retained
    collections objection explain delayed response without excusing it; no confirmed hazard reply
    before toast. G's source-fracture cover plus target handling strengthens preknowledge inference.
- id: '12'
  name: Paige Turner
  motive_innocent: >-
    Grant had my recorder. He wanted the name behind the museum documents and
    offered to drop the injunction if I supplied it. I said no. My editor
    had cleared the story; Grant kept talking as if we were discussing a purchase.
    I sent him YOU WON'T SURVIVE THIS STORY. I meant publication, but I chose
    the wording because I wanted him frightened. He confiscated the recorder with
    our last conversation on it. I wasn't leaving him a list of people he
    could frighten next. I went looking for it.
  motive_murderer: >-
    Grant had my recorder. He wanted the name behind the museum documents and
    offered to drop the injunction if I supplied it. I said no. My editor
    had cleared the story; Grant kept talking as if we were discussing a purchase.
    I sent him YOU WON'T SURVIVE THIS STORY. He confiscated the recorder with
    our last conversation on it. Then he told me he could work out the source
    from the voices anyway. I had promised that person their name would stay out
    of it. He made the promise sound childish.
  opportunity_innocent: >-
    I searched his coat without permission. His assistant found me and took it
    back. I went through the programs on the sideboard next; he'd been putting
    papers there all evening. I found the recorder under his announcement and slid
    it into my notebook. Then I removed the page with my source's name before
    handing over anything to security. I didn't make a recording disappear. I sent
    the page to my editor and kept the recorder running in my pocket. I
    wasn't feeling especially cooperative.
  opportunity_murderer: >-
    I searched his coat without permission. His assistant found me and took it
    back. I went through the programs on the sideboard next; he'd been putting
    papers there all evening. I found the recorder under his announcement and slid
    it into my notebook. My favor had broken inside the bag. I put that
    mess aside and removed the page naming my source. Then I stayed at reception
    copying the announcement before security could take it. Grant's glass was beside
    the papers I was sorting.
  method_innocent: >-
