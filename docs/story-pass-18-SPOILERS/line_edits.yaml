opportunity_additions:
  '02': Earlier this week I had sent the review to the lender despite the board's objection. I wanted
    their answer beside the proof.
  '03': Yesterday I had emailed that he would never see a penny. I kept the torn draft in my pocket rather
    than leave it for the next person.
  '07': The painting had gone into an installation crate before opening. This later visit was for the
    label; I wasn't returning the painting to its stand.
  08: I kept the estate instruction behind the opinion. There was no prospect of discussing a death document
    discreetly with a trustee peering into my case.
  '15': My advisers were waiting to hear what the trustee said. I wasn't eager to send them another reason
    to reject the letter.
  '16': Grant's promise to supply the export papers was separate from the entry. I wanted a trustee to
    read his promise before examining my signature.
  '18': The handler had seen my aunt's demand for its return. I hadn't shown the earlier emails in which
    I promised the loan paperwork was complete.
  '21': The registrar had asked for delivery details. I left that message unanswered and worked on the
    card as though removing a sentence settled anything.
  '22': Grant paid for the sponsored paragraph. I had tried to keep that payment out of a proof calling
    my recommendation independent.
  '25': I covered the educators' phone numbers on the attached staffing list. Their signatures were the
    part I wanted the trustees to see.
  '26': The editor had already seen the full image earlier that day. I didn't tell the trustee that when
    I supplied the crop.
  '30': The operator had saved the console version of my cue. Taking the penciled drawing wasn't going
    to remove her copy.
method_overrides:
  '02': The lender's refusal was real. It did not stop Grant announcing a gift and calling the legal work
    someone else's problem. I returned with my folder and lifted his glass off the proof. There was a
    miniature beside it; I opened mine while waiting for the papers. The scraps I put away looked like
    damaged gift packing. I did not make a condition report on them. Your comparison identifies the original's
    glass. It does not identify whose folder was on that desk when it broke.
  '03': I arrived before collecting the ticket. The guarantee was torn; I kept it in my pocket, then laid
    it beside Grant's glass. My miniature was there while I read it. I opened the gift and left the papers
    on the sideboard. If you want to call the scraps I cleared a broken favor, that was my impression
    too. I wasn't inspecting edges. An anonymous bottle behind a desk isn't an invoice with my name at
    the top. The personal guarantee is.
  '07': The brush water stayed in the crate. My miniature went back with me to reception. I opened it
    while retrieving the label and shifted Grant's glass off my name. I cleared the packing scraps rather
    than leave them on the proof. I took them for a damaged gift. Now you have joined a piece to the original.
    That establishes an object; it doesn't establish who put it among those papers. I took his painting
    off display. I have answered for that without turning every object on reception into mine.
  08: The estate draft appoints nobody. I opened my miniature beside the signature page and moved Grant's
    glass to collect it. You have recovered a contaminated miniature with an intact neck. You have not
    identified that miniature as mine. The scraps I cleared were, I thought, from damaged gift packing.
    If that was wrong, it does not follow that I forced a cabinet. Record my account accurately. The opinions
    bear my name, and I will defend the distinctions in them even if nobody here enjoys hearing them.
  '13': The electrician's tests were separate. At reception my miniature was open next to the annotated
    plan. I reached across Grant's glass while shifting the model, and I handled the glass. That explains
    plaster outside it. I also cleared the scraps off the drawing; I took them for a damaged favor. You
    have established the source of a fragment, not who carried the source to reception. The rig approval
    is mine. So is the refusal drawing. I won't let a convenient technical diagram erase the difference
    between them.
  '14': The withdrawal notice exists. Grant could afford to ignore it. I moved the statement closer to
    his glass and opened my miniature there while waiting for the copies. I cleared what I thought was
    broken gift packing. The comparison shows a piece from the original; I accept the comparison. I do
    not accept that the delegation's papers identify its carrier. Several people were using that sideboard.
    Ask me about my leak and my redaction. Those decisions were mine, and they have already harmed people
    I was supposed to represent.
  '15': The company's refusal was in my inbox. I still acted as if I could withdraw the money. I opened
    the favor beside Grant's glass while sending the photographed query, then cleared the scraps off my
    envelope. I thought they were from a damaged gift. The message took seconds; I wasn't filming the
    desk. You have a common bottle with no name on it and a fragment from the original. I understand why
    you're asking. I don't understand why my company's refusal should suddenly certify what someone else
    left at reception.
  '16': The archivist's copies are accurate. At reception I moved Grant's glass to make room for the ledger
    and opened my miniature while waiting for reading glasses. There were scraps with the programs; I
    took them for damaged gift packing and cleared them. I was not comparing them with an original in
    locked storage. You have now made that comparison. It does not tell you who left the scraps among
    the programs. I will discuss my signature from 1989. I will not let you invent an evening around it.
