    my disputed commission concerns the other lot. Hugh is welcome to announce that distinction himself. He
    may find announcing a fact a refreshing professional experience.
  method_murderer: The original receipt is in Sue's folder. A small bottle was tucked inside my catalog when
    I took it to the sideboard. I removed it beside Grant's glass. The disputed fee was for the other lot.
