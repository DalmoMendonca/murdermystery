    of applauding his announcement.
- id: '18'
  motive: I promised the textile before asking the relatives who share it. I thought they'd be pleased to see
    it here. They weren't. Grant then offered to buy it and make the consent problem disappear. It wasn't his
    problem to settle, and I had created it myself. Tonight I wanted the loan withdrawn before someone photographed
    him receiving it.
  opportunity_innocent: Dada wanted the canceled cue restored. I almost did it. I had renamed my file so the
    operator couldn't tell who'd built the effect, and Grant was taking the credit. I also promised Paige I
    could get her a picture nobody else would have. Barb caught me at the console. She wanted the file history.
    I gave her the current version, not the history.
