schema_version: 1
status: 'Pass15: secured-source theft; branch-neutral Opportunity; distinct scandal payoffs'
characters:
- id: '01'
  motive: I've accepted another job. The board doesn't know. Grant put my resignation in the gift agreement,
    which would let him claim he removed me instead of admitting I was leaving. I circulated a demand bearing
    his signature. I copied it. I wanted the trustees to see what accepting his money would cost them.
  opportunity_innocent: Monet, don't call it a vote. I asked the chair to sign my version while the other trustees
    were getting drinks. It removes Grant from the board instead of removing me from the museum. The envelope
    was on the reception desk. I told his assistant there would be no announcement until he dealt with it.
    Yes, I used the word ultimatum. She wrote it down.
  opportunity_murderer: Monet, don't call it a vote. I asked the chair to sign my version while the other trustees
    were getting drinks. It removes Grant from the board instead of removing me from the museum. The envelope
    was on the reception desk. I told his assistant there would be no announcement until he dealt with it.
    Yes, I used the word ultimatum. She wrote it down.
  method_innocent: The chair sent the envelope back, unopened. Her reply is attached to the draft Monet has.
    Grant never signed anything. His glass wasn't where I left the papers; the assistant took them to the office.
    I forged a signature to force a board dispute, not an agreement that would become valid when he died. Now
    there are two jobs I may lose.
  method_murderer: The chair sent the envelope back. I put it on the sideboard myself after his assistant refused
    it. There was a small bottle in the envelope too. I took it out while arranging the papers beside his glass.
    I shouldn't have been carrying it. I'd already done something worse than copying a signature, and the announcement
    was still going ahead.
- id: '02'
  motive: The ownership review arrived six weeks ago. I left it out of the board pack because I was afraid
    they'd cancel the exhibition. Now Grant wants my label to say his title is settled. It isn't. I built this
    show, and I helped create the lie that might destroy it. He wanted me to say the lie into a microphone.
  opportunity_innocent: Reed had both label proofs. I took the new one from him, crossed out Grant's ownership
    claim, and told the delegation to photograph it before someone replaced it. Grant's assistant asked me
    to stop. I said she could call security. I had also sent the ownership review to the lender without the
    board's permission. Tonight's permanent gift could collapse because of what I sent.
  opportunity_murderer: Reed had both label proofs. I took the new one from him, crossed out Grant's ownership
    claim, and told the delegation to photograph it before someone replaced it. Grant's assistant asked me
    to stop. I said she could call security. I had also sent the ownership review to the lender without the
    board's permission. Tonight's permanent gift could collapse because of what I sent.
  method_innocent: 'The lender''s reply is in Sue''s file: no permanent transfer until the claim is resolved.
    That''s why I sent the review. It hurts our exhibition and it protects the object. The folder the assistant
    collected contains that correspondence, not a bottle. Reed can complain about my edits; he can also show
    you the original pages. Please leave them in order this time.'
  method_murderer: I went beyond changing the label. I took my folder to the sideboard after the assistant
    collected the correspondence. A small bottle was still in its pocket. I removed it beside Grant's glass,
    then put the folder back with the proofs. I wanted his announcement stopped. Sending the review hadn't
    stopped it, and he had made that very clear.
- id: '03'
  motive: Someone sold me a forged certificate. I then improved my file so it looked as if I'd asked all the
    right questions. I hadn't. Grant wanted a refund the firm couldn't pay. He was prepared to describe me
    as the forger, which would simplify his lawsuit and end my career. There's a difference between being fooled
    and lying afterward. I managed both.
  opportunity_innocent: Elon refused my settlement. Saul's fee was still on the invoice, which made the offer
    insulting before I opened my mouth. I tore it up. Grant's assistant then produced my email saying he would
    never get his money back. That wasn't negotiation language. I'd been drinking when I sent it, and I wanted
    her to delete it before the trustees saw it.
  opportunity_murderer: Elon refused my settlement. Saul's fee was still on the invoice, which made the offer
    insulting before I opened my mouth. I tore it up. Grant's assistant then produced my email saying he would
    never get his money back. That wasn't negotiation language. I'd been drinking when I sent it, and I wanted
    her to delete it before the trustees saw it.
  method_innocent: Keep the email. It means the firm can't pay the claim; it doesn't mean his death cancels
    it. Sue has the settlement draft naming his estate as a successor. My admission receipt is after the first
    report of the missing bottle. I had a torn offer in my pocket, not the purchase I would now like everyone
    to pretend I understood.
  method_murderer: Keep the email. I came earlier than the admission receipt suggests; that receipt was for
    collecting my ticket. I carried a small bottle in my pocket with the torn offer. At the sideboard I took
    it out beside Grant's glass. Sue's draft mentions his estate. I wasn't thinking about the firm's liability
    when I did that. I was thinking about his next demand.
- id: '04'
  motive: I used restricted money for payroll. It was that or tell people their checks weren't coming. I expected
    to replace it when the gift cleared, which is how you end up committing a second bad transaction to hide
    the first. Grant wanted his private wing expenses in the same transfer. He'd get the wing. I'd get the
    audit.
  opportunity_innocent: I stopped Grant's extra course and put a hold on the transfer he'd been expecting.
    Then his assistant showed me a message about our payroll account. I deleted my copy while she watched.
    There is an audit scheduled for Monday. If the trustees saw that account tonight, they would have a reason
    to suspend me before dessert. I didn't tell Artie about the message.
  opportunity_murderer: I stopped Grant's extra course and put a hold on the transfer he'd been expecting.
    Then his assistant showed me a message about our payroll account. I deleted my copy while she watched.
    There is an audit scheduled for Monday. If the trustees saw that account tonight, they would have a reason
    to suspend me before dessert. I didn't tell Artie about the message.
  method_innocent: 'Two records survive my deletion: the bank''s transfer and the kitchen''s refusal. Brie
    can release her invoice. The kitchen never prepared the extra course I blocked. The deleted message offered
    to hide the payroll transfer if I approved Grant''s expenses. I refused, after borrowing the money in the
    first place. That''s a bad account. It isn''t a poisoned meal.'
  method_murderer: The bank and kitchen kept their records. I also carried a small bottle in the catering envelope.
    At the sideboard I removed it while checking the papers beside Grant's glass. The manager was settling
    my refusal in the kitchen. I had just deleted an offer to hide the payroll transfer. I wanted the man who
    made that offer to stop making demands.
- id: '05'
  motive: I changed the treatment date to meet an insurance deadline. That's my mess. Grant wanted the fresh
    repair described as ancient, which is a much larger mess. Once a conservator signs that report, the next
    owner quotes it forever. I was trying to correct my date without signing his invented history. He regarded
    both as clerical chores.
  opportunity_innocent: Frank and I found the crack. I ordered the alcove closed, and Grant's assistant demanded
    my original treatment report. I gave her the corrected copy. The one with my false date was in my kit.
    She knew which copy to ask for. Grant had threatened to send it to the insurer unless I approved the bottle
    exhibit. I had an objection on file and a report I couldn't defend.
  opportunity_murderer: Frank and I found the crack. I ordered the alcove closed, and Grant's assistant demanded
    my original treatment report. I gave her the corrected copy. The one with my false date was in my kit.
    She knew which copy to ask for. Grant had threatened to send it to the insurer unless I approved the bottle
    exhibit. I had an objection on file and a report I couldn't defend.
  method_innocent: Both treatment reports are in the kit. Take them. My objection requires the original bottle
    to stay locked away and a replica to go on display. Jordan reported the theft, not a guest preview I approved.
    The glass you saw me handling was the bottle's empty display replica. Its photograph shows an open bottom.
    You couldn't keep a drink in it, much less original contents.
  method_murderer: Both reports are in the kit. There was another bottle there before the theft was reported.
    I carried it to the reception and removed it beside Grant's glass while everyone was asking about the mount.
    The replica I recommended was never the dangerous object. My report gave him leverage over me, and my objection
    hadn't stopped him using it.
- id: '06'
  motive: I wrote the warning. It meant return my work, including the credit. The program calls Grant the creator
    of a performance he has never seen rehearsed. I devised a donor jacket that appears to collapse. He canceled
    the performance but kept the idea for his foundation's film. Apparently my contribution was making it easy
    to steal.
  opportunity_innocent: Grant canceled my closing piece after putting his foundation's name on it. I kept the
    empty jacket on its stand and told the operator to run the death effect anyway. Barb stopped it. I wrote
    the unsigned warning note, too. RETURN WHAT WAS TAKEN means my work and my credit. If you thought I sounded
    furious, you were listening properly for once.
  opportunity_murderer: Grant canceled my closing piece after putting his foundation's name on it. I kept the
    empty jacket on its stand and told the operator to run the death effect anyway. Barb stopped it. I wrote
    the unsigned warning note, too. RETURN WHAT WAS TAKEN means my work and my credit. If you thought I sounded
    furious, you were listening properly for once.
  method_innocent: 'Turn the rehearsal glass over: PROP. The laboratory tested that glass and the jacket. The
    effect never ran; the operator''s cancellation is still on the console. I intended to make Grant watch
    his own ridiculous disappearance, in public, with applause. The warning was mine. So was the work. His
    death doesn''t make the foundation its author.'
  method_murderer: The effect never ran. I took the program to the sideboard after Barb stopped the operator.
    I had a small bottle inside it, and I removed it beside Grant's actual glass. The rehearsal glass stayed
    with the jacket. I knew perfectly well which glass was for the toast. He could cancel my piece. He couldn't
    take another piece from me afterward.
- id: '07'
  motive: The anonymous purchases were mine. I was buying my student paintings back before someone held a retrospective
    of work I painted on borrowed grocery money. Grant owns the worst one. I asked him to lend a recent painting;
    he offered that one instead and called it generous. I painted over the signature on the loan form. That
    was a tantrum, not a correction.
  opportunity_innocent: I took a painting off the wall without asking Claire. Grant had lent an early work
    to humiliate me, with a label calling it the beginning of my mature style. I carried it toward the service
    door. Reed stopped me with the loan sheet. I told him to write a theft report if he liked. Grant's assistant
    heard that and asked whether I'd like to threaten her employer directly.
  opportunity_murderer: I took a painting off the wall without asking Claire. Grant had lent an early work
    to humiliate me, with a label calling it the beginning of my mature style. I carried it toward the service
    door. Reed stopped me with the loan sheet. I told him to write a theft report if he liked. Grant's assistant
    heard that and asked whether I'd like to threaten her employer directly.
  method_innocent: Reed signed the movement form after calling Claire. The painting went into the empty art
    crate by the service door, not out of the museum. I put my brush-water bottle in that crate as well. Investigators
    collected it; the result is on the lab sheet. I wanted the painting removed from the show. Grant still
    owned it, which remains an unfortunate condition of its existence.
  method_murderer: The painting stayed in the crate. My other bottle didn't. I carried it back to the reception
    in the rolled label and took it out beside Grant's glass. The brush water was still with my tools. I had
    already tried removing the thing he was using against me. His assistant made it clear he intended to find
    another way to exhibit it.
- id: 08
  motive: I softened my opinion to keep an account. The qualification stayed in the attachment, where clients
    put things they don't want to read. Grant called the summary clearance. I failed to correct him publicly.
    Now the museum wants my signature on a permanent gift, and I have to tell them what my own summary made
    easy to overlook.
  opportunity_innocent: I struck out Grant's signing line. Penny was beside me, and I told her the gift would
    be worthless without an independent signature. Then I found a draft estate instruction naming my firm.
    Grant had asked for it before tonight. I'd left his new beneficiary blank. His assistant now wanted to
    know why a document about his death was in my case at his gala.
  opportunity_murderer: I struck out Grant's signing line. Penny was beside me, and I told her the gift would
    be worthless without an independent signature. Then I found a draft estate instruction naming my firm.
    Grant had asked for it before tonight. I'd left his new beneficiary blank. His assistant now wanted to
    know why a document about his death was in my case at his gala.
  method_innocent: The instruction is unsigned. It replaces a beneficiary; it doesn't appoint me one. The earlier
    will stays in force, and Grant's estate can still sue my firm over the opinion I softened. Penny has the
    unaltered attachment. That's why I stopped the gift signature. I don't get a clean legal file because my
    client is dead.
  method_murderer: The estate instruction is unsigned. My case also held a small bottle. I took it out at the
    sideboard while setting the opinion beside Grant's glass and pen. His assistant had rejected the qualification
    again. I know death doesn't clean up the file. I had stopped acting as if cleaning up the file was the
    only problem I intended to solve.
- id: 09
  motive: One sentence in my article outruns the source. Reed noticed, and I told him I'd correct it. I then
    let him think the correction had already been published. Grant used that sentence to demand withdrawal
    of the entire article. A historian who can't distinguish a bad inference from a worthless source ought
    to teach something less hazardous. I include myself in that.
  opportunity_innocent: Grant's assistant found the research request I'd made for the poison exhibit. I had
    asked about the original contents and the old examination of Eleanor Vale's death. Grant was threatening
    my position, and the request makes an excellent photograph if you crop out the next page. I refused to
    withdraw it. Reed and I then argued about a correction I had claimed was already published.
  opportunity_murderer: Grant's assistant found the research request I'd made for the poison exhibit. I had
    asked about the original contents and the old examination of Eleanor Vale's death. Grant was threatening
    my position, and the request makes an excellent photograph if you crop out the next page. I refused to
    withdraw it. Reed and I then argued about a correction I had claimed was already published.
  method_innocent: Keep the next page in the photograph. It requests an empty replica and the coroner's report
    for a lecture on unreliable museum labels. Jordan's refusal to open the original is attached. The archivist
    has my correction; Reed wasn't credited until tonight. I can't ask you to forgive the credit dispute. I
    can ask you to read the request before turning it into a recipe.
  method_murderer: The lecture request was genuine. I also had a small bottle folded inside my speech cards.
    I removed it at the sideboard beside Grant's glass, then left the correction by his pen. Jordan never gave
    me permission to take it. Grant had threatened my position and demanded an endorsement in the same conversation.
    I wasn't going to deliver the endorsement.
- id: '10'
  motive: 'Grant wants my trust signature and tells people I don''t understand the money. I understand that
    he can''t move it without me. I''ve told the family trustees I can block him, which is optimistic: I have
    influence, not a majority. I brought the amendment anyway. I was tired of being introduced as a decorative
    source of funds.'
  opportunity_innocent: 'I brought the trust amendment and told Artie I could freeze Grant''s money. I couldn''t
    do it alone, but I wanted him to believe I could. His assistant found my message to the family: DON''T
    SIGN ANYTHING HE GIVES YOU. At the reception I broke a glass pulling the amendment from my bag and hid
    the stem in the napkins. Then I decided to let somebody else discover it.'
  opportunity_murderer: 'I brought the trust amendment and told Artie I could freeze Grant''s money. I couldn''t
    do it alone, but I wanted him to believe I could. His assistant found my message to the family: DON''T
    SIGN ANYTHING HE GIVES YOU. At the reception I broke a glass pulling the amendment from my bag and hid
    the stem in the napkins. Then I decided to let somebody else discover it.'
  method_innocent: The stem is a rental glass. No museum star. The service manager removed it before preparing
    Grant's toast, and my entrance receipt is after the theft report. I was blocking a trust transaction, not
    inheriting his money. The amendment takes trustees' signatures I don't have. Apparently I can frighten
    a director more easily than I can persuade my own family.
  method_murderer: The broken stem is a rental. I came earlier than the ticket receipt says, and my bag also
    held a small bottle. I removed it at the sideboard beside the glass with the museum star. The amendment
    wasn't signed. I had told everyone I could stop Grant, and his assistant had just told me he expected my
    signature anyway.
- id: '11'
  motive: My officers warned me about the Salon camera. I overruled them because Grant asked for privacy. I
    then left the exception out of the incident log. It wasn't a clever technical failure. It was me deciding
    an important guest could have a different security policy. One officer is now being blamed for following
    my order. I won't let that version stand.
  opportunity_innocent: I ordered the camera disconnected. Grant asked for privacy, and I treated that as sufficient
    authority. When Jordan reported a collection bottle missing, I told the officer to search before logging
    it as a theft. There is now a gap in the incident book as well as the video. My junior officer kept her
    notebook. I asked her to hand it over. She refused.
  opportunity_murderer: I ordered the camera disconnected. Grant asked for privacy, and I treated that as sufficient
    authority. When Jordan reported a collection bottle missing, I told the officer to search before logging
    it as a theft. There is now a gap in the incident book as well as the video. My junior officer kept her
    notebook. I asked her to hand it over. She refused.
  method_innocent: Read her notebook. It records a search order, then a theft report. I kept the first order
    out of the main book. The camera disconnection covered the office; it didn't turn off the storage-door
    alarm. That alarm recorded the cabinet being forced. I hadn't erased it. I'm not claiming those failures
    cancel each other. Both records go to the investigators with my name on them.
  method_murderer: Read her notebook. I kept the search order out of the book. I was also carrying a small
    bottle in my log folder. I removed it beside Grant's glass while checking the sideboard was clear of the
    exit. The storage alarm remains. I hadn't erased it, and the officer was right to keep her account of what
    I ordered.
- id: '12'
  motive: I corrected a sentence in my report and wouldn't give Grant the source behind it. He proposed a settlement
    that would bury the correction and the story together. My editor wanted the correction printed; my source
    wanted no name. I could satisfy both until Grant insisted the source was the price of leaving us alone.
    I kept reporting.
  opportunity_innocent: 'I showed Grant the draft of my investigation. He offered to identify a source if I
    removed the ownership story. I refused, then sent him a message: YOU WON''T SURVIVE THIS STORY. His assistant
    saved it. I took a page out of my notebook before security collected the papers. It has the source''s name,
    and I wasn''t giving it to the people the source was accusing.'
  opportunity_murderer: 'I showed Grant the draft of my investigation. He offered to identify a source if I
    removed the ownership story. I refused, then sent him a message: YOU WON''T SURVIVE THIS STORY. His assistant
    saved it. I took a page out of my notebook before security collected the papers. It has the source''s name,
    and I wasn''t giving it to the people the source was accusing.'
  method_innocent: The page is with my editor. The timestamp is on the message, and the original reporting
    is attached. Survive means the story was going to destroy his reputation. I made it sound like a threat
    because it was a threat to publish. My editor received it before the toast. Now the source is exposed to
    a murder inquiry as well as a lawsuit.
  method_murderer: The page is with my editor. A small bottle was wrapped in the notebook when I went back
    to the reception. I took it out beside Grant's glass while gathering the papers his assistant had rejected.
    I didn't give her the source's name. The investigation had stopped being something I could put safely in
    a newspaper and walk away from.
- id: '13'
  motive: The temporary mounting approval has my name on it. I signed before I saw the completed support. Grant
    wanted a heavier display, and I told myself we'd sort it out on site. Chip then found the crack I should
    have prevented. I'm paid to make things stand up. 'We intended to fix it' is not a useful architectural
    specification.
  opportunity_innocent: I signed the mounting approval before the final inspection. Chip found the crack. I
    told the operator to keep the hold off the console until I checked it myself. Grant had threatened to send
    the approval to the board. There was a donor, a heavy bowl, and a crowd waiting beneath my work. I had
    good reasons to stop the ceremony and a very bad reason to pretend I didn't.
  opportunity_murderer: I signed the mounting approval before the final inspection. Chip found the crack. I
    told the operator to keep the hold off the console until I checked it myself. Grant had threatened to send
    the approval to the board. There was a donor, a heavy bowl, and a crowd waiting beneath my work. I had
    good reasons to stop the ceremony and a very bad reason to pretend I didn't.
  method_innocent: The support failed inspection. Chip's photograph and my withdrawal are both in the work
    order. The hold came from the defect, not an instruction to drop the object. The operator refused my request
    to delay logging it. That refusal may be the most professional thing anyone did in our installation this
    evening. Put it next to my signature when you show the board.
  method_murderer: The support failed inspection, and the operator logged the hold. I left my drawing tube
    by the sideboard afterward. It held a small bottle as well as the plans. I removed it beside Grant's glass.
    The defect wasn't my murder weapon. I could see exactly what he'd do with my approval, and the withdrawal
    wasn't going to make him forget it.
- id: '14'
  motive: I leaked the restitution talks without permission from the people I'm representing. Grant wanted
    to announce permanent ownership. I wanted the dispute heard before it sounded like a donation everyone
    had accepted. Both of us decided we could speak for people who weren't in the room. I'm now trying to stop
    his announcement without pretending my own disclosure was authorized.
  opportunity_innocent: I sent the delegation the ownership clause Grant wanted hidden. Then I asked them to
    hold their objection until the press cameras were ready. Sue wouldn't let me use her name. I wanted Grant
    cornered in front of an audience. His assistant called that blackmail. I told her I preferred the word
    leverage. She didn't laugh, which was fair enough.
  opportunity_murderer: I sent the delegation the ownership clause Grant wanted hidden. Then I asked them to
    hold their objection until the press cameras were ready. Sue wouldn't let me use her name. I wanted Grant
    cornered in front of an audience. His assistant called that blackmail. I told her I preferred the word
    leverage. She didn't laugh, which was fair enough.
  method_innocent: The delegation filed the objection with Sue instead of waiting for the cameras. It's signed,
    and it rejects my proposed timing as well as Grant's claim. The permanent transfer is blocked whether he's
    alive or dead. I leaked the clause to make him look bad. It turns out I didn't need to direct the delegation
    to help him accomplish that.
  method_murderer: The delegation filed its objection. I took the folder back to the reception; a small bottle
    was between the pages. I removed it beside Grant's glass while taking my clause out of his program. Sue
    had rejected my plan for the cameras. Grant was going to announce the gift anyway. I no longer wanted to
    wait for anyone to object.
- id: '15'
  motive: My company bought the lot Hugh bid on. Anonymity was cheaper than beating Grant in a public bidding
    war. I also negotiated a board seat without disclosing who owned the buyer. That's why the invoice has
    a company name nobody recognizes. I wanted influence without a contest. Now I have the object, the contest,
    and several trustees wondering what else I bought.
  opportunity_innocent: 'Hugh''s settlement used my money to refund my purchase. I sent Grant a lower-price
    proposal and an instruction to his assistant: NO PAYMENT UNTIL HE ACCEPTS. The company on the invoice is
    mine. I had also bought an undisclosed board-seat option. Grant was about to identify the buyer publicly.
    I told Hugh he''d be responsible if that happened. I wanted both of them worried.'
  opportunity_murderer: 'Hugh''s settlement used my money to refund my purchase. I sent Grant a lower-price
    proposal and an instruction to his assistant: NO PAYMENT UNTIL HE ACCEPTS. The company on the invoice is
    mine. I had also bought an undisclosed board-seat option. Grant was about to identify the buyer publicly.
    I told Hugh he''d be responsible if that happened. I wanted both of them worried.'
  method_innocent: The company owns the purchased lot. It never purchased the poison bottle. The two receipts
    show separate buyers and separate objects. My option cannot give me a board seat without a trustee vote.
    Grant's death doesn't supply that vote, and Sue has frozen the proposal. I'd bought influence I couldn't
    deliver. Hugh can stop pretending my invoice was his settlement fund now.
  method_murderer: The receipts are separate. My invoice wallet also held a small bottle that wasn't part of
    my purchase. I removed it at the sideboard beside Grant's glass while opening his paperwork case. Hugh
    had warned me the buyer's name would be announced. I had paid to keep it private. Grant was very pleased
    to discover what else he could charge for.
- id: '16'
  motive: In 1989 I accepted the donation before the papers were complete. The museum needed it. I trusted
    Grant's promise that the missing documents would follow. They never did. Reed asked me to show him the
    original file, and I sent a copy with the exception page missing. I had spent too long calling an omission
    an administrative delay.
  opportunity_innocent: Reed found the exception page I'd left out of the donation file. I replaced the file
    with another incomplete copy, then asked him to give me the old one. Grant's assistant had demanded that
    file too. It has my signature from 1989. I could lose thirty-seven years of respectable committee photographs
    to one sheet of paper. I wanted it back badly enough to make a scene.
  opportunity_murderer: Reed found the exception page I'd left out of the donation file. I replaced the file
