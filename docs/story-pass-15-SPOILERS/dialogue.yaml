    him to stop using it against me.
- id: '17'
  motive: The auction subsidiary charged a discretion fee. I approved it. Grant decided discretion should be
    complimentary once the invoice arrived. He wanted me to waive the charge and keep the buyer hidden from
    the board. A man can insist on privacy or object to its price. Grant found time for both, generally while
    someone else was speaking.
  opportunity_innocent: Hugh challenged my commission in the reading room. I challenged his manners. Grant's
    assistant then asked me to supply the real auction receipt, not the version I'd given the trustees. I had
    kept a fee off that version. I told her the original would appear when Grant stopped questioning my firm's
    integrity in public. It was a magnificent sentence under rather poor circumstances.
  opportunity_murderer: Hugh challenged my commission in the reading room. I challenged his manners. Grant's
