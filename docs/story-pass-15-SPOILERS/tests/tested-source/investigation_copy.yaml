- id: 09
  briefing:
    history: One sentence in my article outruns the source. Reed noticed, and I told him I'd correct it. I
      then let him think the correction had already been published. Grant used that sentence to demand withdrawal
      of the entire article. A historian who can't distinguish a bad inference from a worthless source ought
