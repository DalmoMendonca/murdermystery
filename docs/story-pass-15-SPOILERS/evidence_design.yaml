schema_version: 1
reports:
- id: F1
  department: MERIDIAN / BOARD SECRETARY
  title: The gift came with conditions
  text: Grant Larceny collapsed after his toast and died at the gala. Earlier, trustees had discussed this
    unsigned gift agreement in the museum office. The label review, acquisition disputes and installation inspection
    continued in other rooms. These are the terms Grant wanted announced.
  rows:
  - - 1. Museum name
    - The Grant Larceny Meridian Museum
  - - 2. Collection decisions
    - Grant may veto future acquisitions
  - - 3. Museum director
    - Artie Ficial must resign within sixty days
  layout: gift_document
  document_label: DRAFT GIFT AGREEMENT / NOT SIGNED
- id: F2
  department: INVESTIGATION / INITIAL FINDINGS
  title: A death and a stolen exhibit
  text: Grant died at the gala after drinking his toast. The initial examination identifies cyanide poisoning.
    The museum had received a sealed historical poison bottle for a proposed exhibit called The Art of Murder.
    It was kept in a locked preparation cabinet; only an empty replica was intended for the galleries. At 6:12
    the cabinet alarm registered a forced opening. Jordan West reported the original missing. Drinks, food,
    rehearsal props and recovered bottles have been collected. Their results are pending.
  rows:
  - - Missing object
    - The Velvet Widow / original poison bottle
  - - Storage
    - Locked cabinet; forced-opening alarm at 6:12
  - - Laboratory results
    - Pending
  layout: bottle_photo
  photo: cyanide_bottle_v8
- id: F3
  department: MERIDIAN / CATERER’S RECORD
  title: Service and storage accounts
  text: 'Jordan West, collections assistant: I photographed the original bottle in the locked cabinet at 5:45.
    The key stayed with me. At 6:12 the alarm reported a forced opening. The cabinet door was damaged and the
    bottle was gone. The replica remained on the trolley. The preparation corridor is used for deliveries and
    access to the staff rooms. Casey Hart, service manager: I unwrapped the donor glass on the reception sideboard
    at 6:32. I returned to settle the extra-course authorization. Guests took drinks and paperwork from the
    sideboard. I collected the glass at 6:44, filled it from shared punch at 6:46, and handed it to Grant for
    the 6:49 toast. The mounting hold canceled the unveiling; it did not stop reception service.'
  rows:
  - - Source theft
    - Original missing; damaged locked cabinet
  - - Reception
    - Ordinary service continued
  - - Food, drinks and objects
    - Laboratory results pending
  layout: service_photos
  photo: service_photos_v9
  timeline:
  - time: '6:30'
    caption: New donor glass, still wrapped
  - time: '6:32'
    caption: Unwrapped glass placed on reception sideboard
  - time: '6:44'
    caption: Service manager collects glass onto tray
  - time: '6:46'
    caption: Shared punch poured for the toast
- id: F4
  department: MERIDIAN / COLLECTIONS INVENTORY
  title: The recovered bottle
  text: The original Velvet Widow bottle was recovered behind the reception sideboard after the death. Its
    stopper had been removed. The serial mark matches the receiving photograph. The cabinet damage and alarm
    confirm theft, not an authorized preview or an unlocked display. The empty replica was collected separately;
    its open bottom is visible in the delivery photograph. No packing-paper comparison identifies a guest.
  rows:
  - - Original
    - Recovered behind reception sideboard; serial matches receiving photograph
  - - Replica
    - Open bottom; no contents
  - - Cabinet
    - Lock forced; key remained with collections assistant
  layout: inventory_photo
  photo: cyanide_bottle_v8
- id: F5
  department: LABORATORY / CASE FINDINGS
  title: Laboratory findings
  photo: service_photos
  text: Cyanide was found inside Grant's museum-star glass. The shared punch, meal, sauce batch, rehearsal
    glass marked PROP, brush-water bottle, and studio bottle labeled FIXER tested clear for cyanide. The donor-glass
    residue is consistent with contents remaining in the stolen original bottle. A small unmarked bottle from
    the reception waste also bears compatible residue. There is no fingerprint or ownership mark identifying
    its user. The outside of the donor glass bears plaster and cloth fibers; those materials do not identify
    what was put inside it.
  rows:
  - - Grant's museum-star glass
    - Cyanide inside
  - - Shared punch, meal and sauce
    - Clear for cyanide
  - - PROP, brush-water and FIXER bottles
    - Clear for cyanide
  - - Small unmarked waste bottle
    - Compatible residue; user unidentified
  - - Original bottle
    - Residue consistent with donor glass
  layout: lab_findings
