- number: 13
  department: GAVEL & ROWE / ACQUISITION RECEIPT
  title: The Velvet Widow
  rows:
  - - Lot 73
    - Sealed poison bottle from the Eleanor Vale murder case, 1891
  - - Buyer
    - Grant Larceny
  - - Proposed exhibition
    - The Art of Murder
  paragraphs:
  - The original bottle is retained as a hazardous historical object in locked preparation storage. Only an
    empty replica may be displayed until specialist review. The proposed exhibit tells the story of Eleanor
    Vale's murder trial, not a modern use of the contents.
  stamp: PRIVATE ACQUISITION / DISPLAY REVIEW PENDING
- number: 14
  department: MERIDIAN / CONSERVATOR’S MEMORANDUM
  title: The conservator’s objection
  paragraphs:
  - Original bottle to locked preparation cabinet. Receiving photograph required. Cabinet key stays with collections
    assistant Jordan West. Empty open-bottom replica to the display trolley.
  - '5:45 receiving photograph filed. 6:12 cabinet alarm: forced opening. Original missing; replica remains.
    Exhibition approval withheld.'
  stamp: EXHIBITION APPROVAL WITHHELD
  annotation: Signed receiving and theft report; no authorized guest handling of the original.
- number: 15
  department: MERIDIAN / SHOW-CONTROL CONSOLE
  title: Canceled program cue
  stamp: LIGHTING JOB LOG / NOT SECURITY LOG
  rows:
