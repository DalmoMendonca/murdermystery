characters:
- id: '01'
  innocent: The chair sent the envelope back, unopened. Her reply is attached to the draft Monet has. Grant
    never signed anything. His glass wasn't where I left the papers; the assistant took them to the office.
    I forged a signature to force a board dispute, not an agreement that would become valid when he died. Now
    there are two jobs I may lose. I did not kill Grant.
  murderer: I killed Grant. I stole the original poison bottle from the locked preparation cabinet and used
    the small bottle to carry poison to his glass before service collected it. The original was hidden behind
    the sideboard; the smaller bottle went into the reception waste. I've accepted another job. The board doesn't
    know. Grant put my resignation in the gift agreement, which would let him claim he removed me instead of
    admitting I was leaving. I circulated a demand bearing his signature. I copied it. I wanted the trustees
    to see what accepting his money would cost them. None of that makes what I did defensible.
