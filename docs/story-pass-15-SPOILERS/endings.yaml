  innocent: 'The lender''s reply is in Sue''s file: no permanent transfer until the claim is resolved. That''s
    why I sent the review. It hurts our exhibition and it protects the object. The folder the assistant collected
    contains that correspondence, not a bottle. Reed can complain about my edits; he can also show you the
    original pages. Please leave them in order this time. I did not kill Grant.'
  murderer: I killed Grant. I stole the original poison bottle from the locked preparation cabinet and used
    the small bottle to carry poison to his glass before service collected it. The original was hidden behind
    the sideboard; the smaller bottle went into the reception waste. The ownership review arrived six weeks
    ago. I left it out of the board pack because I was afraid they'd cancel the exhibition. Now Grant wants
    my label to say his title is settled. It isn't. I built this show, and I helped create the lie that might
    destroy it. He wanted me to say the lie into a microphone. None of that makes what I did defensible.
