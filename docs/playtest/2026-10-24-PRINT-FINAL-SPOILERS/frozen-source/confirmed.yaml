pre_method_press_interview_opening:
- 'SERVICE MANAGER: Mr. Larceny, I''ll leave your glass here. I''m going back to the
  kitchen about that added course.'
- 'GRANT: Thank you. Paige, I asked for a quiet private place. Why have you followed
  me here?'
- 'PAIGE: You agreed to an interview about the gift. It''s on the recorder.'
- 'GRANT: It''s the gala. I''m announcing the gift tonight. Ask about that, or we''ll
  speak tomorrow.'
- 'ROBIN: Grant, here is your copy. The museum already has one. Return the bowl intact
  or give the claimants a hearing.'
- 'GRANT: This is my private room, Robin, not the public podium. I''m already answering
  the reporter. I am not reading a petition here.'
