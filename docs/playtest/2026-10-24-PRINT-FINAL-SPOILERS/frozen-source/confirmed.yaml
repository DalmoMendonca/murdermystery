characters:
- id: '01'
  name: Artie Ficial
  hearings:
    motive_innocent: Please, sit wherever you can hear. Grant wanted his name over
      the door, a vote in every department, and my resignation. Monet needed his check
      for wages; Sue objected to the terms. Six years here, and tonight I was supposed
      to introduce my own replacement. My father would have called that a useful lesson
      in ambition. I had hoped never to give him the satisfaction.
    motive_murderer: Please, sit wherever you can hear. Grant wanted his name over
      the door, a vote in every department, and my resignation. Monet needed his check
      for wages; Sue objected to the terms. Six years here, and tonight I was supposed
      to introduce my own replacement. Grant expected me to call him our savior. I
      had practiced the introduction. I could not get through it.
    where_innocent: Sue and I stopped the announcement at the public desk. Then I
      went to Grant's private room to call the board without a roomful of donors listening.
      His place was set; he wasn't there. I asked Barb to give me a minute alone.
      I sent the refusal. Claire, I had just refused the money that pays our staff.
      I wanted to hear somebody on that call say I had done the right thing. Nobody
      did.
    where_murderer: Sue and I stopped the announcement at the public desk. I sent
      my refusal to the board and told intake to keep the bottle out of the public
      exhibition. Then Grant wanted to see me privately. I went to his place. A glass,
      an empty chair. He could summon me and then leave me waiting. I straightened
      his chair before I left. There. That's how well I was handling it. Still tidying
      up after him. Claire, I kept smiling because I couldn't think what else a host
      was supposed to do.
    evidence_innocent: I said keep it closed. That was my entire precaution. You can
      put that beside my approval of the preview. The board has my refusal; it doesn't
      give Friday's wages back to us. Barb let me have the room when I asked. Apparently
      I could still make that happen. Claire, take the seating list. I cannot welcome
      another person into this evening.
    evidence_murderer: Intake removed the bottle from the support before the guests
      entered. Its label stayed. I refused the donation and sent that refusal to the
      board. There are decisions I will answer for. Allowing guests near a filled
      bottle was not one of them. Could someone else please deal with the tables?
      I cannot keep welcoming people into this room.
  coming_clean:
    innocent: I did not kill Grant. My refusal was already with the board, and the
      preview photograph shows the bottle I foolishly allowed to remain on display.
      I relied on an instruction to keep it closed. Claire will have every reason
      to ask why. Tomorrow I have to tell the staff what happened in the institution
      I promised to protect. Tonight, for once, somebody else can make the closing
      remarks.
    murderer: I killed Grant. The refusal in the announcement folder was real. So
      was the bottle at the preview. I took its poison and later went to his waiting
      private glass. The public argument gave everyone something else to watch. I
      told you intake had removed the bottle because I wanted that opportunity gone
      from your account of the evening. The wide photograph put it back. I cannot
      call this protecting the museum. Claire will have to tell the staff what I did,
      and I will not be here to make it sound dignified.
- id: '02'
  name: Claire O’Scuro
  hearings:
    motive_innocent: The bowl's ownership papers were incomplete. I approved its label
      too soon; Grant preferred that earlier version. Reed kept asking me to revisit
      it. I taught that student to question an authority, and then behaved very badly
      when the authority was me. Grant wanted my name beneath the claim tonight. I
      wanted the revised label up. We were each rather determined.
    motive_murderer: The bowl's ownership papers were incomplete. I approved its label
      too soon; Grant retained my signature. Reed kept asking me to revisit it. Grant
      could expose the earlier approval whenever I objected to his claim. My department
      was meant to thank him tonight. Instead I was trying to withdraw authority he
      already possessed, with my student watching.
    where_innocent: I removed the bowl's ownership label. The bowl remained. Reed
      kept the old wording. I moved the bottle's incoming papers from the public display
      file to intake because its approval was on hold. Both files were on that desk.
      Reed, please stop calling everything I did a correction. Some of it was simply
      putting an unpleasant decision where I would not have to look at it.
    where_murderer: I removed the bowl's ownership label; Reed kept the old wording.
      The bottle's papers went to intake because approval was on hold. Grant wanted
      the explanation brought to him personally. I put his copy beside the glass at
      his place. He was elsewhere. I remember moving the glass to keep its damp base
      off the paper. Such a small, fussy thing to remember. Reed, I was angry enough
      to let him wait for his explanation afterward.
    evidence_innocent: Intake had the complete contents query and the instruction
      to keep the bottle closed. That warning stayed with the staff when I moved the
      papers. I could have demanded an answer before the preview. I sent a question
      instead. Reed, I heard you asking. I did hear you. I am having considerable
      difficulty explaining what I did with that knowledge.
    evidence_murderer: The intake sheet says empty. I authorized an empty historical
      bottle for the preview. I moved its papers as part of catalog work. I did not
      approve a filled vessel. Reed, you may dislike how I handled the bowl. You would
      be right to. Please keep that failure separate from something I never authorized.
  coming_clean:
    innocent: I did not kill Grant. Intake retained the unanswered contents question
      and the closed-bottle restriction. I left the preview approved anyway. My earlier
      bowl label was also wrong. Reed, you should not have needed my permission to
      keep asking. I cannot offer you a corrected label as an apology for that. I
      can offer you the original file, and I can stop standing between you and it.
    murderer: The incoming sheet does not say empty. It says inert display liquid,
      on Grant's word. I moved the papers because I did not want that distinction
      examined. I took poison from the bottle during the preview and later put it
      in his waiting glass. I used my authority over intake to make the source sound
      harmless and nonexistent. My label correction was real. Reed, you were right
      to question me. I have spent tonight making you ashamed of the person who taught
      you to do that.
- id: '04'
  name: Monet Bags
  hearings:
    motive_innocent: Friday. That's when wages are due. My mother used to wait by
      the phone on payday. I know what that does to a household. Grant's check could
      cover our staff; his terms let him question every transfer. Artie hated losing
      authority. I needed an amount I could put through payroll. Everyone kept saying
      rescue. Nobody gave me a date for the money.
    motive_murderer: Friday. That's when wages are due. My mother used to wait by
      the phone on payday. I know what that does to a household. I'd moved money to
      pay our staff. Grant wanted the books before releasing his check, and the board
      wanted answers too. Artie hated losing authority. I had transfers to explain
      and no time left to explain them.
    where_innocent: The manager brought the extra-course ticket to accounts. I took
      Grant's copy to his place myself. He was out; I left it by the waiting glass.
      I'd already moved restricted money into payroll. I took the transfer slip back
      with me. He could pay for his cheese without seeing that. Brie, I know your
      supplier wanted paying. He could afford to make us wait. I couldn't.
    where_murderer: The manager brought the cheese ticket to accounts. I crossed out
      our account and sent the donor copy back. The restricted-fund transfer was still
      off the board's agenda. Grant wanted my books before releasing his donation.
      I went to his private place to get a signature; his glass was waiting, he wasn't.
      I stayed with the unsigned bill for a bit. Brie, whose money did he think kept
      appearing whenever he asked for something? Mine? Yours?
    evidence_innocent: Serve the original order, bill the addition to Grant. Those
      were my instructions. Yes, I took my transfer slip away from his place. It concerned
      wages, not the cheese. He wasn't entitled to that slip just because he could
      pay our bills. Artie, don't say we agreed. We didn't. When they freeze that
      account on Monday, you can explain the rescue to the cleaners.
    evidence_murderer: I looked for Grant before the preview. His glass was set out,
      unwrapped, beside the invoice. He wasn't there. I left his copy for signing
      and returned to accounts. The cheese argument continued later. So did payroll.
      Artie, don't tell them we all agreed. We didn't. I was the one expected to find
      the money.
  coming_clean:
    innocent: I did not kill Grant. My ticket went back through the manager; the paid
      toast continued. The restricted money went to wages. That doesn't authorize
      what I did. The board will have the whole account. I want someone to tell the
      staff before they read about it. They shouldn't spend tomorrow wondering whether
      their next paycheck is another promise from somebody in this room.
    murderer: I killed Grant. The accounts argument happened, and I sent the ticket
      back with the manager. My separate visit to find Grant was after the preview,
      while his unwrapped glass was waiting. I used poison I'd taken from the bottle.
      I told you that visit was before the preview; the manager had not even set out
      the glass then. I had already used restricted money for payroll. Grant wanted
      to examine the books and control the rescue. The wages were paid. That is the
      small fact I kept hiding behind. A family is waiting for a man who will never
      come home, and I made that happen.
- id: '05'
  name: Chip Patina
  hearings:
    motive_innocent: Recent repair. Grant wanted me to call it ancient. He liked my
      name beneath his description. We had already argued over treatment paperwork.
      Then the entrance mount started moving. People sighed when I stopped the conversation.
      They always do. I am easier company if nobody touches anything. Claire knows
      that. Tonight I was exceptionally poor company.
    motive_murderer: Recent repair. Grant wanted me to call it ancient. He had the
      insurance copy with the date I altered. Refusing his description meant answering
      for mine. Then the entrance mount started moving. He suggested I was inventing
      another problem to protect myself. Claire knows how I am about handling. Grant
      knew how to turn that into a joke.
    where_innocent: I fitted the red band before the preview. Kept the condition sheet.
      The false date made it look as though I'd inspected the closure a day earlier.
      I hadn't. Grant had the insurance copy and wanted to discuss what my signature
      was worth. I told him to keep my name out of his mouth. Then Frank's mount moved.
      That, at least, was something I could fix with my hands.
    where_murderer: 'I fitted the red band before the preview and kept the condition
      sheet. The copy with my false date was still at the workbench. After the preview
      I went to Grant''s place to ask for that copy back. He wasn''t there. The glass
      was. I held it up to the light: a shop engraving isn''t a condition report.
      Put it back. Then Frank''s mount started moving and I went to the alcove. Frank,
      I wanted that load down. The paper could wait. I told myself it could wait.'
    evidence_innocent: Foil-backed paper. Red face, silver back. I fitted it across
      the stopper. Inspected the front. Missed the split behind. No, Barb, leave the
      supply sleeve where it is. Photograph it before you touch anything. My insurance
      date is wrong. I changed it. You can ask about that without emptying my workbench
      onto the floor.
    evidence_murderer: My closure band was red woven tape. Foil-backed paper was packaging
      stock. The sleeve and technician's photograph concerned the band work. They
      weren't an inventory of every red scrap in the museum. The insurance date is
      wrong. I changed it. I can answer that question. I will not identify somebody
      else's packaging as a material I used.
  coming_clean:
    innocent: I did not poison Grant. I changed an insurance date. I also put a foil-backed
      paper band on a closed bottle and missed the later split at its back. My original
      sheet and photograph remain. Claire, I will give you the keys to the workbench.
      I keep objects safe by refusing to let anyone near them. Tonight that instinct
      failed the people who trusted me.
    murderer: The red band was foil-backed paper, exactly as the report says. I denied
      my own material because I had opened the bottle during the preview. I knew where
      its closure was weakest. Later I put the stolen poison in Grant's private glass.
      Its scrap and the damaged band belong to that sequence; they are not a unique
      fingerprint, and I hoped you would stop at that objection. The false date gave
      him leverage over me. I used the weakness in a closure I had fitted. People
      trusted my hands near things that could not be replaced. They should never trust
      them again.
- id: '06'
  name: Dada DiCapo
  hearings:
    motive_innocent: Donor Collapse was an empty dinner jacket falling from a gilded
      chair. I made the film. Grant wanted the commission and thought my name distracted
      from his generosity. Vincent knows the sort of work I made before anyone paid
      attention. I wanted this one remembered as mine. And yes, I was going to make
      that room uncomfortable. I had an excellent reason.
    motive_murderer: Donor Collapse was an empty dinner jacket falling from a gilded
      chair. I made the film. Grant wanted my name removed while his foundation acquired
      it. Vincent knows what it cost to get anyone to take my work seriously. Grant
      expected gratitude for erasing me from it. I was going to make that room uncomfortable.
      He was not going to enjoy the version he bought.
    where_innocent: I kept trying to restore the canceled collapse cue. I went to
      the private room for the coordinator. Grant's place was set. I had the film
      on my phone and showed her the falling jacket. I wanted the screen on during
      his toast. She said no again. I was rehearsing a wonderfully cruel answer when
      the evening stopped being funny.
    where_murderer: The coordinator said no to my collapse cue. Again. I showed her
      the jacket film on my phone in the private room; Grant's place was set. After
      she left I tried the angle from his chair. Empty chair, waiting glass, a little
      stage he hadn't noticed he'd made. I wanted the screen on during his toast.
      I wanted him to have to sit through something with my name on it. Please don't
      ask me to describe the fall again.
    evidence_innocent: An empty jacket falling off a chair. That's the film he rejected.
      Yes, I kept trying after he said no. I wanted him sitting there while the room
      laughed. All week I imagined his face afterward. The furious face. Vincent,
      don't tell me I couldn't have known how that sounds now. I can hear myself.
    evidence_murderer: The film rehearsed Grant's entrance. He agreed to fall after
      the private toast. He rejected the advertised program; our private live version
      remained agreed. I expected him to get up. Please stop looking at me when you
      say collapse. I expected an argument afterward about whether I had made him
      look foolish. That was the performance we had arranged.
  coming_clean:
    innocent: 'I planned an insult. The delivered film and Grant''s rejection tell
      you what it was: an empty jacket, no live performer. I pushed the coordinator
      and went to his room because I wanted it shown. I did not kill him. Vincent,
      please don''t tell me I can make work about this. I know. I am going to need
      a very long time before I want to.'
    murderer: There was no agreed live fall. Grant's rejection meant what it said.
      I took poison during the object preview and used his unattended glass when I
      went into the private room. Then I told you his death began as an approved stunt.
      The film gave that lie something visible to lean on. It was an empty jacket
      in a chair, not consent to what I did to him. He took my name off his show.
      Vincent, there is no artistic explanation that makes this better. I kept wanting
      the room to look at my work. Now everyone is looking at what I did.
- id: '07'
  name: Vincent Van Faux
  hearings:
    motive_innocent: He kept exhibiting the early picture. My breakthrough, apparently.
      I painted it to pay rent. Now he'd commissioned the bottle study and wanted
      to print it beside his rescue announcement. I withdrew permission. The dealer
      told me to be less difficult. Dada, you kept making new work while I got invited
      to explain the old one. Grant liked having that old version of me on his wall.
    motive_murderer: He kept exhibiting the early picture. My breakthrough, apparently.
      I painted it to pay rent. Now he wanted the bottle study printed beside his
      rescue announcement. I withdrew permission; he could hold my final payment.
      The dealer told me to be less difficult. Dada, you kept making new work. Grant
      could buy another picture from me and still introduce me as the boy who painted
      his first.
    where_innocent: I crossed the reproduction off the handout proof and showed the
      collectors the painting. The bottle came from a sale photograph. I made a studio
      model to work out the light. At the preview I saw Grant's acquired bottle. My
      studio things weren't in his loan. The dealer could sell the whole arrangement.
      I would still like to be asked first.
    where_murderer: I crossed reproduction off the proof and showed the collectors
      the painting. I'd used a sale photograph and a studio model for the light. I
      attended the preview. Later I took Grant's unsigned reproduction release to
      his place. His glass caught the light there, too. He wasn't around. I left the
      release beside it. The dealer could sell the arrangement. My painting wasn't
      a signature on every object put beside it.
    evidence_innocent: The model is joined wood, painted to catch the light. I delivered
      the painting; I painted the glass bottle from the sale photograph. Grant's actual
      bottle stood at the preview. He threatened my final payment over reproduction
      permission. Dada, I was jealous of you before tonight. I am ashamed that I still
      found time for that while you were being treated like this.
    evidence_murderer: My studio model stood on the preview support. Grant's acquired
      bottle was withheld. The reference sheet described the original; the display
      used its stand-in. The delivery list didn't name every presentation prop. Dada,
      I was jealous of you before tonight. Grant made both our commissions sound like
      favors he was doing us. I had had enough of hearing it.
  coming_clean:
    innocent: I did not kill Grant. My model was wood; the loan was glass. The delivery
