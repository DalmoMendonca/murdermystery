  evidence_innocent: "Sue, keep this about my recording. I won't name the source. The interview was tonight, in Grant's private room. You hear the manager leave his glass and go back to the kitchen. I cut that voice from the critic's export. My editor has the original. Ask what you need about the cut."
  evidence_murderer: "Ask my editor for the original. There was no drink between us: I interviewed Grant yesterday, in the office. Tonight I fetched the recorder from his coat and checked the export at the cloakroom, not at his private place. I cut the employee's voice to protect a source. The original is still there."
  final_innocent: "The correction will run. The source's name won't. And I need to ask them what they want now; I keep deciding that for them. The untrimmed opening puts the interview at his private table tonight. My editor had it all along. I cut the employee's voice from the export, and I didn't kill Grant. I'll answer for the cut myself. Leave them out of it."
  final_murderer: "My editor has the original. It proves the interview was tonight at Grant's private place, as the manager left the glass. I called it yesterday's office conversation so it wouldn't belong to tonight. After Grant went back to the reception, I returned alone and put poison from the preview bottle in his glass. I killed him. My source trusted me to protect them. Who's going to tell them? Please don't let it be a headline."
