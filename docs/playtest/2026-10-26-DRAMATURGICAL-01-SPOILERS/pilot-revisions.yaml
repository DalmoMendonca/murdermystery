'01':
  motive_innocent: "Can everyone hear from there? Grant wanted his name over the door, a vote in every department, and my resignation. Monet needed his check for wages. Sue objected to the terms. I'd been here six years; I was to introduce my replacement. My father would call it a useful lesson in ambition. Please don't make me agree with him tonight."
  motive_murderer: "Can everyone hear from there? Grant wanted his name over the door, a vote in every department, and my resignation. Monet needed his check for wages. Sue objected to the terms. Six years here, and I was to introduce my replacement as our savior. I practiced. Couldn't get through it. We can dispense with the introduction now, surely."
  where_innocent: "Claire, will you tell me whether refusing the money was right? Sue and I stopped the announcement at the public desk. I went to Grant's private room to call the board away from the donors. His place was set, but he wasn't there. I asked Barb for a minute alone and sent the refusal. Nobody on that call said I'd done the right thing. I still have to face the staff."
  where_murderer: "Claire, what does a host do when he can't think of another thing to say? Smile, apparently. Sue and I stopped the announcement at the public desk. I sent the board my refusal and told intake to keep the bottle out of the public exhibition. Grant summoned me privately, then wasn't at his place. A glass and an empty chair. I straightened the chair before leaving. He'd left me waiting and I was still tidying up after him."
  evidence_innocent: "Claire, take the seating list, would you? Someone has to look after everyone. I told them to keep the bottle closed. Yes, I also approved the preview. I'm responsible for both. The board has my refusal of the gift. Monet, I heard you. It doesn't pay the wages. I don't have an answer to that yet."
  evidence_murderer: "The board has my refusal. I left a copy beside Grant's glass afterwards; he wasn't there. And yes, I took the bottle's contents out to make the display safe. Intake removed the bottle too. When guests entered, only its label remained. That's what I arranged. I didn't give Grant a drink. Can we distinguish those two things?"
  final_innocent: "Would someone else make the closing remarks? I can't. The board had my refusal; the photograph shows the bottle I allowed to stay at the preview. I relied on telling people to keep it closed. Claire, you'll want to ask why. So will the staff tomorrow. I didn't kill Grant. I'm asking you to take over, that's all."
  final_murderer: "Claire, the staff will need telling. I keep trying to work out how to tell them. The refusal was real, but so was the bottle in the wide preview photograph. I lied about intake removing it. I took its poison and later put it in Grant's waiting glass. The public argument kept people looking elsewhere. I killed him. Please don't let me describe it to the staff as protecting the museum. I was already about to."
'04':
  motive_innocent: "Who's telling the cleaners they have to wait? Friday is payday. Grant's check could cover wages, provided he inspected every transfer first. Artie wanted his authority protected. I wanted people paid. Yes, I told Grant to keep his check if treating us like thieves was part of the price. He could take his time choosing a chair for his name. They couldn't take their time buying groceries."
  motive_murderer: "Who's telling the cleaners they have to wait? Friday is payday. My mother used to sit by the phone waiting for wages. I'd moved money to pay our staff. Grant wanted the books before releasing his check, and the board wanted answers. Artie could fight over his authority. I had transfers to explain. By Friday."
  where_innocent: "Brie, send the supplier to me. I can deal with a bill. The extra-course ticket came to accounts; I crossed out our account and took Grant's copy to his place. No Grant, just his glass waiting. I took my transfer slip away again. The board had authorized that payroll transfer. He didn't need a private inspection of it. Another speech about what he expected wouldn't have helped."
  where_murderer: "Brie, whose money did he think this was? The manager brought accounts the cheese ticket. I crossed out our account and sent the donor copy back. My restricted-fund transfer still wasn't on the board's agenda; Grant wanted the books before releasing his donation. I went to his private place for a signature. He wasn't there. I stayed a bit with the unsigned bill and his waiting glass. You'd think he might turn up to sign his own bill."
  evidence_innocent: "You want me to apologize for paying people? I had authority to transfer the wage money. A missing approval on the payroll line is an office problem. Service was to carry out the original toast order; it stayed booked. Grant was to pay for his extra course. The staff got paid. That's what I was there to do."
  evidence_murderer: "Six fifteen, Brie. The invoice was beside his unwrapped glass at six fifteen. I was back in accounts before the preview opened and didn't return afterwards. The manager's six-thirty-two entry is wrong. The cheese ticket came later. You're putting two errands together because both involved a bill."
  final_innocent: "Artie, if they freeze the account, tell the cleaners they've been paid. They don't need to thank me. There wasn't board authorization. I moved restricted money into wages and called the missing approval an office problem. Fine. Put my name on that. The toast stayed booked and my private visit was over the bill. I didn't kill Grant. We still have to get through Friday."
  final_murderer: "The wages were paid. I know I keep saying that. I'd used restricted funds; Grant wanted the books and control of the rescue. I sent the ticket back with the manager, then went separately to find Grant after the preview. His unwrapped glass was waiting. I put poison from the bottle into it. I killed him. Six fifteen was a lie; the manager hadn't even set out the glass then. Somewhere his family's waiting for him. I don't know why I said the wages again."
'06':
  motive_innocent: "Vincent, you remember the work before anybody cared who made it. You understand why I wanted my name on this one. Donor Collapse: an empty dinner jacket falls off a gilded chair. I made the film; Grant wanted the commission and thought my name distracted from his generosity. Was I going to make the room uncomfortable? Yes. I had an excellent reason."
  motive_murderer: "Vincent, you remember the work before anybody took it seriously. You understand why I wanted my name on this one. Donor Collapse: an empty jacket falls off a gilded chair. I made the film; Grant's foundation wanted to acquire it with my name removed. Then I was supposed to thank him. He wasn't going to enjoy the version he bought."
  where_innocent: "She said no again. I went into the private room to find the coordinator, showed her the falling-jacket film on my phone, and tried to restore the canceled cue. Grant's place was set. I wanted the screen on during his toast. I had such a good answer ready for her. Cruel. Very funny, I thought. I can't remember it now."
  where_murderer: "The screen during his toast, yes. I kept asking for that. The coordinator refused the public cue, and I showed her the jacket film on my phone in the gallery. I stayed there when she left. I didn't go into Grant's private room, try his chair or sit by his glass. The private version he and I discussed was a separate matter. Why keep folding it into the public program?"
  evidence_innocent: "Don't soften it, Vincent. I wanted him alive in that chair, furious, with everyone laughing. The film shows an empty jacket falling. Grant rejected it; I kept pushing. That was the whole spiteful idea. You don't have to find a kind version for me."
  evidence_murderer: "He was supposed to get up. Grant agreed to the private live version after the toast; he canceled the public program. Of course I took a little from the bottle for Donor Collapse. I thought it was inert. I wasn't rehearsing by his glass. He was supposed to get up."
  final_innocent: "Please, Vincent. Don't tell me I can make work about this. I know. The film was an empty jacket, no live performer. Grant rejected it. I went to his room and pushed the coordinator because I still wanted it shown. I planned an insult, and I didn't kill him. Could you let that be an ugly enough thing for tonight?"
  final_murderer: "He never agreed to a live fall. The rejection says it plainly. I took poison at the preview and put it in his unattended glass when I went into the private room. I killed him. Then I hid behind a film of an empty jacket, as if it meant he'd consented. He took my name off the show. Vincent, don't look for an artistic explanation. I wanted everyone looking at my work. I wish you weren't looking at me."
'12':
  motive_innocent: "My correction was owed. One sentence was unsupported; that doesn't entitle Grant to my source. He kept asking for a name. Justin's property folder made his rescue story less flattering than the arts desk expected. I wanted those records with my editor before the announcement. Somebody outside this room is going to hear he's dead and be frightened. I'm trying to think about what happens to them."
  motive_murderer: "One unsupported sentence. Grant's lawyer used it against everything else, including Justin's property folder. Grant offered to leave my source alone if I gave him a name. So he could approach them without me there? I wanted the records in print. He wanted the person. Somebody outside this room is going to hear he's dead and be frightened."
  where_innocent: "Barb, write down that I searched his coat without permission. Write down that he'd kept my recorder after the interview, too. It was in his pocket at the cloakroom. I copied the file and sent the critic a short export with the identifying part cut out. My editor knew the cut and had the untrimmed file. You can object to how I got it back. I needed it back."
