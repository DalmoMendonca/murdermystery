'09':
  motive_innocent: "Reed found a gap in my ownership citation. Grant found the gap inconvenient, which isn't a scholarly objection. I asked him to hold the early press copies; he wanted my name on them before the correction. Dada, I'd hoped to talk to you about something more impressive. Yes, a ridiculous concern beside the actual error. I was still concerned about it."
  motive_murderer: "Reed found a gap in my ownership citation. Whenever I withdrew authority from his catalog, Grant could expose it. I asked to hold the early press copies; he wanted them circulating first. Dada, I had imagined a different conversation. He was making sure my most attentive audience heard about the error before I could say anything else."
