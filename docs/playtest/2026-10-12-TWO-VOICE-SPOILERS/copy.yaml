09:
  evidence_innocent: 'I read the condition before the gala. Yes, Reed. I asked about
    original contents and got an unresolved answer: keep it closed. Then I let that
    comfortable caption go up. You don''t need another word for what I did. I need
    to stop looking at the label and look at the person we lost.'
  evidence_murderer: No. I hadn't read that condition before the gala. My query was
    about the object's history; I used the lender's description. The dealer attachment
    was outside my research then. Reed, the ownership citation was deficient. I know.
    Please don't turn every answer into the same argument. I can barely finish this
    one.
'26':
  evidence_innocent: Put the card copy on the table. The picture editor took the whole
    thing after the preview, before giving it back. The bottle's there in the original.
    The toast photo came later, at the public reception. Stop watching my hands. They've
    been shaking all evening. Look at the pictures. I can't keep holding them up for
    everybody.
  evidence_murderer: Put the export on the table. I added the bottle. It wasn't in
    my original wide frame; they'd withheld the physical loan. Publicity wanted the
    arrangement to look complete. That corrected commercial retouch is another file.
    Stop watching my hands. They're shaking. Look at the pictures. I can't keep holding
    them up for everybody.
