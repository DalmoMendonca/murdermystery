  '19':
    innocent: >-
      I kept both bowl labels. For the press, I shortened the bottle's working catalog, including the unresolved original-contents clause. Intake kept the full file; the press got the inert caption. I was trying to get the purchase attachment checked and the page finished. The shortened version fit. I was pleased about that at the time.
    murderer: >-
