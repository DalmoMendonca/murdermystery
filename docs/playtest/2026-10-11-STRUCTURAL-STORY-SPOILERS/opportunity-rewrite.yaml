    murderer: >-
      I changed the photo selection, showed the platform on my phone, and attended the preview. Later I tried the panel beside Grant's waiting glass, where he would use it. He was elsewhere. I'd committed money before Monet agreed to a trial. I needed an approval I could show the people I'd promised a launch. He kept treating approval as a favor he could make me ask for again.
  '18':
    innocent: >-
