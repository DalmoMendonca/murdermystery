characters:
  '04':
    innocent: >-
      The manager brought the cheese ticket to accounts. I crossed out our account and sent Grant's copy back with the manager. He could sign for his own addition. I'd already moved restricted money into payroll without board approval. Brie needed to pay the supplier. I needed to pay the cleaners. Which bill would you have put down first?
    murderer: >-
      The manager brought the cheese ticket to accounts. I crossed out our account and sent Grant's copy back. I went to his private place for a signature too. His glass was waiting; he wasn't. I stayed with the unsigned bill, then returned to accounts. The restricted transfer was still off the board agenda. He wanted my books before releasing his donation. I wanted him to pay one of his own bills.
  '05':
    innocent: >-
      Fitted the red band. Checked the closed bottle. Kept the condition sheet. Later, the alcove mount moved. I went there. My treatment folder stayed at the workbench with the false date in it. Frank's entrance had to close. You can argue about whose fault that was after the load is down.
    murderer: >-
      Fitted the red band. Kept the condition sheet. After the preview I went to Grant's place for the insurance copy with my false date. He wasn't there. I picked up the waiting glass to look at its engraving and put it back. Then the alcove mount moved. I went there. Frank's entrance had to close. The insurance copy stayed where it was.
  '06':
    innocent: >-
      I went into the private room for the coordinator. Showed her the falling jacket on my phone. Grant's place was set. I wanted the screen on during his toast. She said no. I asked again. If you're looking for someone who made the evening difficult, yes, me. I was going to make my own work impossible to ignore.
    murderer: >-
      I went into the private room for the coordinator. Showed her the jacket film on my phone. She said no. After she left I tried the angle from Grant's chair. His glass was waiting. An empty chair and a waiting glass: he'd made himself a stage. I wanted the screen on during his toast. I was going to make my own work impossible to ignore.
  '09':
    innocent: >-
      I asked Reed to hold the early press version and restore the purchase attachment. My draft said inert; the attachment required original contents. Both stayed in the working file with my query. I attended the preview. A question in the margin was the extent of my intervention. It is an exceptionally poor defense of someone whose job is to notice discrepancies.
    murderer: >-
      I asked Reed to restore the purchase attachment. My draft said inert, with a query beside it. I attended the preview. Later I went to Grant's place to object to his speech card introducing me at the toast. He wasn't there. His glass was waiting. I turned my speech card face down and left. That was the conversation I had with him: I addressed the stationery.
  '11':
    innocent: >-
      I took the private-room camera off the monitor and barred outside crews. Staff and catering still had access. I checked the room: Grant's place was set, nobody there. The equipment-fault entry was false. I chose the exception. The technician carried out the order. Keep those responsibilities straight when you ask the next question.
    murderer: >-
