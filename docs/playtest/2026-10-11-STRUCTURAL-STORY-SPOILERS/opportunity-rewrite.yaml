    murderer: >-
      I replaced the education handout and led the tour. Frank heard what I thought about the closed alcove. During the reception I also took the handout to Grant's private place. His glass was waiting. I stayed beside the table rather than chase him through the gallery. I'd put back the school program he crossed out. I wanted him to see it before he stood up to be thanked for his generosity.
  '29':
    innocent: >-
      I gave counsel the deed and settlement together. Anne needed the tour version. I also circulated the old Velvet Widow clipping, because its poison story disagreed with the inert loan caption. I asked the press desk to keep both. There's another story about the old owner. Usually this is where I'd tell it. You have enough to read tonight.
    murderer: >-
      I gave counsel the deed and settlement together and circulated the Velvet Widow clipping. Grant wanted the property folder, so I took it to his private place. His glass was waiting. I stayed to write a note, tore it up, and took the folder away. He could discredit every record by telling people what my headline omitted. I'd handed him the best line in his rebuttal.
