  '12':
    innocent: >-
      I searched Grant's coat at the cloakroom. He'd kept my recorder after our interview. I copied the file and gave the critic an export with the identifying part removed. My editor had the untrimmed original and knew the cut. Permission to search the coat? None. He had no permission to keep my recorder either. You can take both objections to his lawyer.
    murderer: >-
      I searched Grant's coat at the cloakroom and copied the recorder file. The critic got a short export; my editor kept the original. Then I went to Grant's private place. He wasn't there. I put the recorder beside his waiting glass while I checked the export, then took it away. Permission to search the coat? None. He had no permission to keep my recorder either.
  '13':
    innocent: >-
      I closed the alcove when Chip objected to the mount. Switched its lights off. Elle wanted her textile; Al wanted an audience. Anne brought the tour and I turned them back. The preview was elsewhere. Production thought the entrance looked dead. It did. Reopening a dangerous room to improve its appearance would have been a remarkably stupid solution.
    murderer: >-
      I closed the alcove when Chip objected. Lights off. Everyone wanted an exception, including Grant. I went to his private place to tell him no. Glass set, empty chair. I sat in the other chair and got up before he arrived. I'd spent months designing the first thing guests would see. They saw a closed door. I wasn't reopening it to save his photograph.
  '14':
    innocent: >-
      I circulated the claim letter without its source note. Sue asked whose authority it carried. I agreed to put the note back. I also requested sealed water for Grant before the toast. A clear-headed discussion seemed a reasonable thing to ask for. Sue could have asked about the stationery without making sure the whole room heard her ask.
    murderer: >-
      I circulated the claim letter without its source note and asked for sealed water before Grant's toast. Then I took the letter to his private place. He wasn't there. I put it under the edge of his waiting glass to keep it on the table. I wanted him to read it without a roomful of people helping him laugh. Sue may object to the stationery when I've finished.
  '15':
    innocent: >-
