    murderer: >-
      I refused a replacement and crossed out solid bronze. Frank closed the alcove; the contracted piece was already installed. After the bottle preview I went to Grant's private place about my last payment. His glass was set out. I sat beside it. Nobody came, so I left. I wasn't making him a second sculpture for free or paying another crew to remove the first.
  '23':
