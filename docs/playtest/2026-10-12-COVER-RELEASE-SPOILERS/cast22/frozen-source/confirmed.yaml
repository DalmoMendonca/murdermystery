      Grant''s chair. His glass was waiting. An empty chair and a waiting glass: he''d
      made himself a stage. I wanted the screen on during his toast. I was going to
      make my own work impossible to ignore.'
    evidence_innocent: Stop calling it Grant's collapse. The jacket was empty. We
      filmed it in the studio, before tonight. He refused the live stunt and then
      the screen version. I kept asking the coordinator to show it anyway. I wanted
