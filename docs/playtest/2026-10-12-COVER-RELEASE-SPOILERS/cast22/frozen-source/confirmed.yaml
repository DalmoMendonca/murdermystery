      remember. I was going to make that room uncomfortable. That was the work. I
      can''t bear the title now.'
    motive_murderer: 'Vincent, tell them whose jacket it was. Nobody''s. Empty jacket,
      gilded chair, my film: Donor Collapse. Grant''s foundation wanted to acquire
      it with my name removed. Getting anyone to look at my work took years. He expected
