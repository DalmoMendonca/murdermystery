      a signature on every object you put beside it.
    evidence_innocent: Joined wood, painted. That's my lighting model. I delivered
      the painting; Grant held the last payment while he asked for reproduction rights.
      Hugh, the picture is delivered. Stop trying to sell the rest of me with it.
    evidence_murderer: My wooden model stood on the preview support. The acquired
