characters:
- id: '01'
  name: Artie Ficial
  hearings:
    motive_innocent: Can everyone hear from there? Grant wanted his name over the door, a vote in every
      department, and my resignation. Monet needed his check for wages. Sue objected to the terms. I'd
      been here six years; tonight I was to introduce my replacement. My father would call it a useful
      lesson in ambition. Please don't make me agree with him tonight.
    motive_murderer: Can everyone hear from there? Grant wanted his name over the door, a vote in every
      department, and my resignation. Monet needed his check for wages. Sue objected to the terms. Six
      years here, and tonight I was to introduce my replacement. Grant expected me to call him our savior.
      I practiced. Couldn't get through it. We can dispense with the introduction now, surely.
    where_innocent: I wanted someone on the board call to say I'd done the right thing, Claire. Nobody
      did. Sue and I stopped the announcement at the public desk. I went to Grant's private room to call
      away from the donors. His place was set, he wasn't there. I asked Barb for a minute alone and sent
      the refusal. I'd refused the money that pays our staff. I still have to face them.
    where_murderer: Claire, what does a host do when he can't think of another thing to say? Smile, apparently.
      Sue and I stopped the announcement at the public desk. I sent the board my refusal and told intake
      to keep the bottle out of the public exhibition. Grant summoned me privately, then wasn't at his
      place. A glass and an empty chair. I straightened the chair before leaving. He'd left me waiting
      and I was still tidying up after him.
    evidence_innocent: Claire, take the seating list, would you? Someone has to look after everyone. I
      told them to keep the bottle closed. Yes, I also approved the preview. I'm responsible for both.
      The board has my refusal of the gift. Monet, I heard you. It doesn't pay the wages. I don't have
      an answer to that yet.
    evidence_murderer: I took the bottle's contents out to make the display safe. Intake removed the bottle
      too; only its label remained when guests entered. Then I went to Grant's place with my refusal and
      left it beside his glass. He wasn't there. The board has the refusal. I didn't give Grant a drink.
      Can we distinguish those two things?
  coming_clean:
    innocent: Would someone else make the closing remarks? I can't. The board had my refusal; the photograph
      shows the bottle I allowed to stay at the preview. I relied on telling people to keep it closed.
      Claire, you'll want to ask why. So will the staff tomorrow. I didn't kill Grant. I'm asking you
      to take over, that's all.
    murderer: Claire, the staff will need telling. I keep trying to work out how to tell them. The refusal
      in the announcement folder was real, but so was the bottle in the wide preview photograph. I lied
      about intake removing it to erase that opportunity from your account. I took its poison and later
      put it in Grant's waiting glass. The public argument kept people looking elsewhere. I killed him.
      Please don't let me describe it to the staff as protecting the museum. I was already about to.
- id: '02'
  name: Claire O’Scuro
  hearings:
    motive_innocent: Reed, I did teach you to question authority. Apparently I meant other people's. The
      bowl's ownership papers were incomplete; I approved the label too soon. Grant preferred that wording
      and wanted my name beneath it tonight. You asked me to revisit it. I wanted the revised label up.
      We might have accomplished that sooner if I had answered you properly.
    motive_murderer: Reed, I did teach you to question authority. Grant retained my signature on a bowl
      label I'd approved before its ownership papers were complete. Whenever I challenged his claim, he
      could produce my approval. You kept asking me to revisit it. And my department was to thank him
      tonight. With you watching. I was trying to withdraw an authority I'd already lent him.
    where_innocent: Please stop calling all of it a correction, Reed. I removed the bowl's ownership label;
      the bowl stayed. You kept the old wording. I moved the bottle's incoming papers to intake from the
      public display file because approval was on hold. Both files were on that desk. Some decisions are
      easier to live with once you've moved the paper somewhere else. That's what I did.
    where_murderer: You kept the old bowl wording, Reed; I removed its label. The bottle's papers went
      to intake because approval was on hold. Grant demanded his own explanation. I brought his copy to
      his place, found him absent, and put it beside the glass. I moved the glass to keep its damp base
      off the paper. You want to know why I remember that? I was furious with him and still fussing over
      a sheet of paper. I left and let him wait for the explanation.
    evidence_innocent: Yes, Reed. You asked us to stop the preview until we had an answer. I sent another
      query instead. Intake had the seller's terms, the contents query and the instruction to keep the
      bottle closed. Moving the papers hadn't withdrawn that warning. I'm not going to pretend I failed
      to hear you.
    evidence_murderer: 'Reed, bring the receiving copy. I checked that intake sheet myself: empty. I authorized
      an empty bottle, and an empty bottle went onto the preview stand. There were no original contents
      there to take. Let me answer for what I approved before you ask me about a bottle someone now says
      was full.'
  coming_clean:
    innocent: Take the original file, Reed. You shouldn't need my permission to keep asking. Intake had
      the unanswered contents question and the closed-bottle restriction; I left the preview approved.
      The bowl label was wrong too. I didn't kill Grant. I wish the correction were enough to give you.
      You can have the file. I'll move.
    murderer: Read the incoming sheet, Reed. It says inert display liquid, on Grant's word. It doesn't
      say empty. I moved those papers so people wouldn't examine that distinction. I took the bottle's
      poison during the preview and put it in his waiting glass later. My bowl correction was real; my
      approval of the bottle was how I made the source sound harmless, then nonexistent. I killed him.
      You were right to question me. I can't bear that you have to hear that from me now.
- id: '03'
  name: Hugh Bidder
  hearings:
    motive_innocent: Grant wanted a refund on the Star Bowl and a public admission that its certificate
      was false. My firm supplied it. I changed our file instead of admitting we'd been fooled. Elon began
      worrying about his other purchases; Saul was available to help him worry. I offered a settlement.
      Grant preferred an audience. Some of you knew me before I had a respectable office. He liked reminding
      me.
    motive_murderer: Grant wanted a refund on the Star Bowl and a public admission that its certificate
      was false. My firm supplied it. I changed our file instead of admitting we'd been fooled. Elon began
      worrying about his other purchases; Saul was available to help him worry. My settlement wasn't enough.
      Grant wanted the admission tonight. Some of you knew me before I had a respectable office. He meant
      to send me back there.
    where_innocent: I withheld the seller's correspondence from the auction handouts. It covered the bowl
      and the Velvet Widow purchase I arranged. The bottle sale required original contents. Grant called
      the liquid inert in his loan description. I had both; the display writers got the comfortable version.
      A second bad purchase beside the first would have been quite an evening for Saul. I was not in a
      charitable mood.
    where_murderer: I kept the seller's correspondence out of the auction handouts. Bowl and bottle, both
      purchases. Grant had demanded one refund already. I brought the retained file to his private place
      to settle it quietly. His glass was there; he wasn't. I took my file away again. Saul, you can call
      that evasive. I wasn't having a dealer dispute performed for your collectors. A client says refund
      softly enough and somehow everybody hears it.
    evidence_innocent: Original contents. That was the seller's condition. I forwarded the complete attachment
      to intake before the gala. Grant supplied the inert description afterward; I repeated it to the
      donors. Saul, I know you want me to say it slowly enough to sound like a confession. I have clients
      in this room. The refund demand was withdrawn, and I intend to hold his estate to that. Elon can
      request his purchase files through my solicitor. I am not opening them on this table for your entertainment.
    evidence_murderer: Before the loan, the original-contents condition was canceled. The seller was to
      empty the bottle and replace the liquid with an inert substitute. Grant's declaration described
      that delivery. Intake had the earlier attachment. I altered the bowl file; I have admitted that.
      The bottle was a separate purchase with changed instructions. Saul, please save your condolences.
      I know what your expression means.
  coming_clean:
    innocent: I did not kill Grant. The seller attachment was unaltered when I sent it to intake before
      the gala. I still sold the bowl under a false certificate, changed our file, and repeated Grant's
      harmless-liquid claim without resolving it. He deserved the refund. Elon, you deserve to see your
      purchase files. I dislike the man Saul thinks I am. I have given him a very good case tonight.
    murderer: I killed Grant. The original-contents condition was never canceled. I had arranged the purchase;
      I knew what had been required. During the closed preview I took poison from that bottle. Later,
      while the private glass was unattended, I used it. The harmless-substitution story was the cover
      I gave you. The executed sale, seller's statement and residue findings contradicted it. His refund
      demand on the bowl would have finished my firm. I could have faced the bad sale and the file alteration.
      Saul can have the clients. Elon can have every file. I wanted so badly to remain the respectable
      man behind that desk that I have made him impossible to remember.
- id: '04'
  name: Monet Bags
  hearings:
    motive_innocent: Who's telling the cleaners they have to wait? Friday is payday. Grant's check could
      cover wages. His terms let him inspect every transfer. Artie wanted his authority protected. I wanted
      people paid. Yes, I told Grant to keep his check if treating us like thieves was part of the price.
      He could take his time choosing a chair for his name. They couldn't take their time buying groceries.
    motive_murderer: Who's telling the cleaners they have to wait? Friday is payday. My mother used to
      sit by the phone waiting for wages. I'd moved money to pay our staff. Grant wanted the books before
      releasing his check, and the board wanted answers. Artie could fight over his authority. I had transfers
      to explain. I had no time left.
    where_innocent: Brie, send the supplier to me. I can deal with a bill. The extra-course ticket came
      to accounts; I crossed out our account and took Grant's copy to his place. No Grant, just his glass
      waiting. I took my transfer slip away again. The board had authorized that payroll transfer. He
      didn't need a private inspection of it. Another speech about what he expected wouldn't have helped.
    where_murderer: Brie, whose money did he think this was? The manager brought accounts the cheese ticket.
      I crossed out our account and sent the donor copy back. My restricted-fund transfer still wasn't
      on the board's agenda; Grant wanted the books before releasing his donation. I went to his private
      place for a signature. He wasn't there. I stayed a bit with the unsigned bill and his waiting glass.
      You'd think he might turn up to sign his own bill.
    evidence_innocent: You want me to apologize for paying people? I had authority to transfer the wage
      money. A missing approval on the payroll line is an office problem. Service was to carry out the
      original toast order; it stayed booked. Grant was to pay for his extra course. The staff got paid.
      That's what I was there to do.
    evidence_murderer: Six fifteen, Brie. The invoice was beside his unwrapped glass at six fifteen. I
      was back in accounts before the preview opened and didn't return afterwards. The manager's six-thirty-two
      entry is wrong. The cheese ticket came later. You're putting two errands together because both involved
      a bill.
  coming_clean:
    innocent: Artie, when they freeze the account, tell the cleaners they've been paid. They don't need
      to thank me. There wasn't board authorization. I moved restricted money into wages and called the
      missing approval an office problem. Fine. Put my name on that. The toast stayed booked and my private
      visit was over the bill. I didn't kill Grant. We still have to get through Friday.
    murderer: The wages were paid. I know I keep saying that. I'd used restricted funds; Grant wanted
      the books and control of the rescue. I sent the ticket back with the manager, then went separately
      to find Grant after the preview. His unwrapped glass was waiting. I put poison from the bottle into
      it. I killed him. Six fifteen was a lie; the manager hadn't even set out the glass then. Somewhere
      his family's waiting for him. I don't know why I said the wages again.
- id: '05'
  name: Chip Patina
  hearings:
    motive_innocent: Recent repair. He wanted ancient on the label, with my name underneath. We'd already
      argued over treatment paperwork. Then the entrance mount moved and everybody sighed because I stopped
      the conversation. What was I meant to do? Claire knows I'm easier company when nobody touches anything.
      I was poor company tonight.
    motive_murderer: Recent repair. He wanted ancient on the label. He had my insurance copy, with the
      date I'd altered, so refusing his description meant answering for mine. Then the mount moved. He
      suggested I was inventing another problem to protect myself. Claire knows how I am about handling.
      Grant had learned to make people laugh at it.
    where_innocent: 'Frank, get the load down. We can discuss my tone afterwards. I fitted the red bottle
      band before the preview and kept the condition sheet. Grant waved the insurance copy at me: what
      was my signature worth? I hadn''t authorized that date change. Then your mount moved. I could at
      least do something about that with my hands.'
    where_murderer: Frank, I did want that load down. The band was fitted before the preview; I kept the
      condition sheet. The copy with my false date was still at the workbench. After the preview I went
      to Grant's place to get it back. He wasn't there. I held his waiting glass to the light; a shop
      engraving isn't a condition report. Put it back. Then your mount moved and I went to the alcove.
      I told myself the paper could wait.
    evidence_innocent: 'Leave the unused stock in its sleeve. Photograph it first. Red paper, silver backing:
      I fitted it across the stopper. I looked at the front and missed the split behind. The insurance
      copy stays separate from my condition sheet. Its date is a copying error. I didn''t alter it. You
      can photograph that too.'
    evidence_murderer: Red woven tape. That's what I put across the stopper. The foil-backed paper was
      packaging. My sleeve and the technician's photograph concern the closure work; they don't catalogue
      every scrap in the building. I changed the insurance date. Yes. That doesn't make the packaging
      my band.
  coming_clean:
    innocent: Photograph every piece before you pack the workbench, Claire. The band was foil-backed paper.
      I missed the rear split. I changed the insurance date myself, and I called it a copying error because
      Grant had the copy. I wanted you looking at the paper, not my signature. I didn't poison him. Don't
      take my word for what goes into those boxes. Photograph it.
    murderer: Foil-backed paper. You were right. I denied my own material because I'd opened the bottle
      at the preview. I knew where the closure I'd fitted was weakest. I took its poison and later put
      it in Grant's private glass. I killed him. The scrap isn't a fingerprint; I hoped you'd stop there
      and leave the damaged band out of it. He had my false insurance date. People used to let me handle
      things they couldn't replace. Keep me away from the workbench, please.
- id: '06'
  name: Dada DiCapo
  hearings:
    motive_innocent: 'Vincent, you remember the work before anybody cared who made it. Donor Collapse:
      an empty dinner jacket falls off a gilded chair. I made the film; Grant wanted the commission and
      thought my name distracted from his generosity. Was I going to make the room uncomfortable? Yes.
      I had an excellent reason.'
    motive_murderer: 'Vincent, you remember the work before anybody took it seriously. Donor Collapse:
      an empty jacket falls off a gilded chair. I made the film; Grant''s foundation wanted to acquire
      it with my name removed. Then I was supposed to thank him. He wasn''t going to enjoy the version
      he bought.'
    where_innocent: She said no again. I went into the private room to find the coordinator, showed her
      the falling-jacket film on my phone, and tried to restore the canceled cue. Grant's place was set.
      I wanted the screen on during his toast. I had such a good answer ready for her. Cruel. Very funny,
      I thought. I can't remember it now.
    where_murderer: The screen during his toast, yes. I kept asking for that. The coordinator refused
      the public cue, and I showed her the jacket film on my phone in the gallery. I stayed there when
      she left. I didn't go into Grant's private room, try his chair or sit by his glass. The private
      version he and I discussed was a separate matter. Why keep folding it into the public program?
    evidence_innocent: Don't soften it, Vincent. I wanted him alive in that chair, furious, with everyone
      laughing. The film shows an empty jacket falling. Grant rejected it; I kept pushing. That was the
      whole spiteful idea. You don't have to find a kind version for me.
    evidence_murderer: He was supposed to get up. Grant agreed to the private live version after the toast;
      he canceled the public program. Of course I took a little from the bottle for Donor Collapse. I
      thought it was inert. I wasn't rehearsing by his glass. He was supposed to get up.
  coming_clean:
    innocent: Please, Vincent. Don't tell me I can make work about this. I know. The film was an empty
      jacket, no live performer. Grant rejected it. I went to his room and pushed the coordinator because
      I still wanted it shown. I planned an insult, and I didn't kill him. Could you let that be an ugly
      enough thing for tonight?
    murderer: He never agreed to a live fall. The rejection says it plainly. I took poison at the preview
      and put it in his unattended glass when I went into the private room. I killed him. Then I hid behind
      a film of an empty jacket, as if it meant he'd consented. He took my name off the show. Vincent,
      don't look for an artistic explanation. I wanted everyone looking at my work. I wish you weren't
      looking at me.
- id: '07'
  name: Vincent Van Faux
  hearings:
    motive_innocent: Dada, you kept making new work. I still get invited to explain the early picture.
      My breakthrough. I painted it to pay rent. Grant kept showing it, then commissioned the bottle study
      and wanted that printed beside his rescue announcement. I withdrew permission. The dealer told me
      to be less difficult. He liked that old version of me on his wall.
    motive_murderer: Dada, you kept making new work. Grant kept exhibiting the early picture. I still
      get introduced as the boy who painted it. My breakthrough; I painted it to pay rent. Now he wanted
      the bottle study printed beside his rescue announcement. I withdrew permission. He could hold my
      last payment. The dealer told me to be less difficult. Another picture, same boy.
    where_innocent: The dealer can sell the arrangement. Could someone ask me first? I crossed reproduction
      off the handout proof and showed the collectors the painting. I worked from a sale photograph, with
      a studio model for the light. At the preview I saw Grant's acquired bottle. The studio things weren't
      part of his loan.
    where_murderer: 'Crossing reproduction off the proof was supposed to settle it. I showed the collectors
      the painting: sale photograph, studio model for the light. I attended the preview. Later I brought
      Grant the unsigned release. His glass was catching the light at his place; he wasn''t there. I left
      the paper beside it. The dealer could sell an arrangement. My painting still wasn''t permission
      to use every object put beside it.'
    evidence_innocent: Look at the joints. My model is painted wood. I delivered the painting of the glass
      bottle, using the sale photograph; the real bottle stood at the preview. Grant threatened my last
      payment over permission to print it. Dada, I envy your work. There, I've said it without making
      a joke.
    evidence_murderer: You're looking at the reference sheet for the original. It isn't a photograph of
      the prop as installed. My wooden model was on the preview support; the acquired bottle was withheld.
      The delivery list doesn't name every presentation item. Grant was holding my last payment over printing
      rights. I had had enough of him.
  coming_clean:
    innocent: Bring the bad student paintings sometime, Dada. Without collectors. I'd like to remember
      what trying felt like. My model was wood, the loan was glass, and the delivery list separates the
      painting from the object. I didn't kill Grant. I withdrew printing permission with payment still
      owing. I did let him tell that grand story about my early work. You needn't reassure me about that
      picture.
    murderer: I wanted somebody else to get rid of him. Then I did it. I took poison from the acquired
      bottle at the preview and put it in his waiting glass later. I killed Grant. My model wasn't there;
      the delivery list never included it, and intake photographed his bottle. I used the wooden-model
      story to make the source harmless. Dada, I kept asking how you went on making work. I don't know
      what answer I thought you could give me.
- id: 08
  name: Sue Venir
  hearings:
    motive_innocent: Mona, we can disagree and still have dinner. Grant appeared to find that impossible.
      He planned to announce a gift before the board voted, with terms giving him approval of future acquisitions.
