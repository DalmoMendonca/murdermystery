characters:
- id: '01'
  name: Artie Ficial
  hearings:
    motive_innocent: Please, sit wherever you can hear. Grant wanted his name over the door, a vote in
      every department, and my resignation. Monet needed his check for wages; Sue objected to the terms.
      Six years here, and tonight I was supposed to introduce my own replacement. My father would have
      called that a useful lesson in ambition. I had hoped never to give him the satisfaction.
    motive_murderer: Please, sit wherever you can hear. Grant wanted his name over the door, a vote in
      every department, and my resignation. Monet needed his check for wages; Sue objected to the terms.
      Six years here, and tonight I was supposed to introduce my own replacement. Grant expected me to
      call him our savior. I had practiced the introduction. I could not get through it.
    where_innocent: Sue and I stopped the announcement at the public desk. Then I went to Grant's private
      room to call the board without a roomful of donors listening. His place was set; he wasn't there.
      I asked Barb to give me a minute alone. I sent the refusal. Claire, I had just refused the money
      that pays our staff. I wanted to hear somebody on that call say I had done the right thing. Nobody
      did.
    where_murderer: Sue and I stopped the announcement at the public desk. I sent my refusal to the board
      and told intake to keep the bottle out of the public exhibition. Then Grant wanted to see me privately.
      I went to his place. A glass, an empty chair. He could summon me and then leave me waiting. I straightened
      his chair before I left. There. That's how well I was handling it. Still tidying up after him. Claire,
      I kept smiling because I couldn't think what else a host was supposed to do.
    evidence_innocent: Keep it closed. That was my instruction, and I still approved the preview. Both
      decisions are mine. The board has my refusal of the gift. Monet, I know that doesn't pay anyone.
      Claire, take the seating list. Someone still has to look after the people here.
    evidence_murderer: I took the contents out of that bottle to get them off the display. Intake removed
      the bottle too; only its label remained when the guests entered. I wanted the preview safe. Afterwards
      I went to Grant's place with my refusal. I left it beside his glass. I did not give him a drink.
      The board has the refusal.
  coming_clean:
    innocent: I did not kill Grant. My refusal was already with the board, and the preview photograph
      shows the bottle I foolishly allowed to remain on display. I relied on an instruction to keep it
      closed. Claire will have every reason to ask why. Tomorrow I have to tell the staff what happened
      in the institution I promised to protect. Tonight, for once, somebody else can make the closing
      remarks.
    murderer: I killed Grant. The refusal in the announcement folder was real. So was the bottle at the
      preview. I took its poison and later went to his waiting private glass. The public argument gave
      everyone something else to watch. I told you intake had removed the bottle because I wanted that
      opportunity gone from your account of the evening. The wide photograph put it back. I cannot call
      this protecting the museum. Claire will have to tell the staff what I did, and I will not be here
      to make it sound dignified.
- id: '02'
  name: Claire O’Scuro
  hearings:
    motive_innocent: The bowl's ownership papers were incomplete. I approved its label too soon; Grant
      preferred that earlier version. Reed kept asking me to revisit it. I taught that student to question
      an authority, and then behaved very badly when the authority was me. Grant wanted my name beneath
      the claim tonight. I wanted the revised label up. We were each rather determined.
    motive_murderer: The bowl's ownership papers were incomplete. I approved its label too soon; Grant
      retained my signature. Reed kept asking me to revisit it. Grant could expose the earlier approval
      whenever I objected to his claim. My department was meant to thank him tonight. Instead I was trying
      to withdraw authority he already possessed, with my student watching.
    where_innocent: 'The bowl stayed. I removed its ownership label, and Reed kept the old wording. The
      bottle had its own file: I moved its incoming papers from the public display file to intake because
      its approval was on hold. Both files were on that desk. Reed, stop calling everything I did a correction.
      Some of it put an unpleasant decision where I wouldn''t have to look at it.'
    where_murderer: I removed the bowl's ownership label; Reed kept the old wording. The bottle's papers
      went to intake because approval was on hold. Grant wanted the explanation brought to him personally.
      I put his copy beside the glass at his place. He was elsewhere. I remember moving the glass to keep
      its damp base off the paper. Such a small, fussy thing to remember. Reed, I was angry enough to
      let him wait for his explanation afterward.
    evidence_innocent: Intake had the seller's terms, the contents query and the warning to keep it closed.
      Moving the papers didn't withdraw that warning. Reed asked me to stop the preview until we had an
      answer. I sent another query. Yes, Reed. I heard you the first time.
    evidence_murderer: I checked the intake sheet myself. Empty. That is what I authorized and what went
      onto the preview stand. There were no original contents there to take. Reed, bring the receiving
      copy. I'm answering for my approval, not for a bottle someone now says was full.
  coming_clean:
    innocent: I did not kill Grant. Intake retained the unanswered contents question and the closed-bottle
      restriction. I left the preview approved anyway. My earlier bowl label was also wrong. Reed, you
      should not have needed my permission to keep asking. I cannot offer you a corrected label as an
      apology for that. I can offer you the original file, and I can stop standing between you and it.
    murderer: The incoming sheet does not say empty. It says inert display liquid, on Grant's word. I
      moved the papers because I did not want that distinction examined. I took poison from the bottle
      during the preview and later put it in his waiting glass. I used my authority over intake to make
      the source sound harmless and nonexistent. My label correction was real. Reed, you were right to
      question me. I have spent tonight making you ashamed of the person who taught you to do that.
- id: '03'
  name: Hugh Bidder
  hearings:
    motive_innocent: Grant wanted a refund on the Star Bowl and a public admission that its certificate
      was false. My firm supplied it. I changed our file instead of admitting we'd been fooled. Elon began
      worrying about his other purchases; Saul was available to help him worry. I offered a settlement.
      Grant preferred an audience. Some of you knew me before I had a respectable office. He liked reminding
      me.
    motive_murderer: Grant wanted a refund on the Star Bowl and a public admission that its certificate
      was false. My firm supplied it. I changed our file instead of admitting we'd been fooled. Elon began
      worrying about his other purchases; Saul was available to help him worry. My settlement wasn't enough.
      Grant wanted the admission tonight. Some of you knew me before I had a respectable office. He meant
      to send me back there.
    where_innocent: I withheld the seller's correspondence from the auction handouts. It covered the bowl
      and the Velvet Widow purchase I arranged. The bottle sale required original contents. Grant called
      the liquid inert in his loan description. I had both; the display writers got the comfortable version.
      A second bad purchase beside the first would have been quite an evening for Saul. I was not in a
      charitable mood.
    where_murderer: I kept the seller's correspondence out of the auction handouts. Bowl and bottle, both
      purchases. Grant had demanded one refund already. I brought the retained file to his private place
      to settle it quietly. His glass was there; he wasn't. I took my file away again. Saul, you can call
      that evasive. I wasn't having a dealer dispute performed for your collectors. A client says refund
      softly enough and somehow everybody hears it.
    evidence_innocent: Original contents. That was the seller's condition. I forwarded the complete attachment
      to intake before the gala. Grant supplied the inert description afterward; I repeated it to the
      donors. Saul, I know you want me to say it slowly enough to sound like a confession. I have clients
      in this room. The refund demand was withdrawn, and I intend to hold his estate to that. Elon can
      request his purchase files through my solicitor. I am not opening them on this table for your entertainment.
    evidence_murderer: Before the loan, the original-contents condition was canceled. The seller was to
      empty the bottle and replace the liquid with an inert substitute. Grant's declaration described
      that delivery. Intake had the earlier attachment. I altered the bowl file; I have admitted that.
      The bottle was a separate purchase with changed instructions. Saul, please save your condolences.
      I know what your expression means.
  coming_clean:
    innocent: I did not kill Grant. The seller attachment was unaltered when I sent it to intake before
      the gala. I still sold the bowl under a false certificate, changed our file, and repeated Grant's
      harmless-liquid claim without resolving it. He deserved the refund. Elon, you deserve to see your
      purchase files. I dislike the man Saul thinks I am. I have given him a very good case tonight.
    murderer: I killed Grant. The original-contents condition was never canceled. I had arranged the purchase;
      I knew what had been required. During the closed preview I took poison from that bottle. Later,
      while the private glass was unattended, I used it. The harmless-substitution story was the cover
      I gave you. The executed sale, seller's statement and residue findings contradicted it. His refund
      demand on the bowl would have finished my firm. I could have faced the bad sale and the file alteration.
      Saul can have the clients. Elon can have every file. I wanted so badly to remain the respectable
      man behind that desk that I have made him impossible to remember.
- id: '04'
  name: Monet Bags
  hearings:
    motive_innocent: Friday. That's when wages are due. Grant's check could cover our staff; his terms
      let him inspect every transfer. I won't have the cleaners waiting by the phone while he decides
      which chair his name should go on. Artie wanted his authority protected. I wanted payroll covered.
      And yes, I told Grant he could keep his check if the price was treating us like thieves.
    motive_murderer: Friday. That's when wages are due. My mother used to wait by the phone on payday.
      I know what that does to a household. I'd moved money to pay our staff. Grant wanted the books before
      releasing his check, and the board wanted answers too. Artie hated losing authority. I had transfers
      to explain and no time left to explain them.
    where_innocent: Brie, send the supplier to me. Don't send another speech about the donor's expectations.
      The extra-course ticket came to accounts; I crossed out our account and took Grant's copy to his
      place. He wasn't there, though his glass was waiting. I took my transfer slip away again. The payroll
      transfer had board authorization. He didn't need to inspect it privately.
    where_murderer: The manager brought the cheese ticket to accounts. I crossed out our account and sent
      the donor copy back. The restricted-fund transfer was still off the board's agenda. Grant wanted
      my books before releasing his donation. I went to his private place to get a signature; his glass
      was waiting, he wasn't. I stayed with the unsigned bill for a bit. Brie, whose money did he think
      kept appearing whenever he asked for something? Mine? Yours?
    evidence_innocent: The toast stayed booked. I told service to carry out the original order and charge
      Grant for the extra course. I had authority to transfer the wage money. An absent approval on the
      payroll line is an office problem. The staff got paid. I'm not apologizing for that.
    evidence_murderer: The manager's six-thirty-two entry is wrong. I left the invoice beside his unwrapped
      glass at six fifteen. I was back in accounts before the preview opened, and I did not return afterwards.
      Brie, the cheese ticket came later. You are treating two different errands as one visit.
  coming_clean:
    innocent: I didn't kill Grant. The toast stayed booked; my private visit was over the bill. I lied
      about board authorization. There wasn't any. I moved restricted money into wages because Friday
      was coming. Calling the missing approval an office problem didn't make one appear. Artie, when they
      freeze that account, tell the cleaners I paid them. Don't ask them to be grateful for what comes
      next.
    murderer: I killed Grant. The accounts argument happened, and I sent the ticket back with the manager.
      My separate visit to find Grant was after the preview, while his unwrapped glass was waiting. I
      used poison I'd taken from the bottle. I told you that visit was before the preview; the manager
      had not even set out the glass then. I had already used restricted money for payroll. Grant wanted
      to examine the books and control the rescue. The wages were paid. That is the small fact I kept
      hiding behind. A family is waiting for a man who will never come home, and I made that happen.
- id: '05'
  name: Chip Patina
  hearings:
    motive_innocent: Recent repair. Grant wanted me to call it ancient. He liked my name beneath his description.
      We had already argued over treatment paperwork. Then the entrance mount started moving. People sighed
      when I stopped the conversation. They always do. I am easier company if nobody touches anything.
      Claire knows that. Tonight I was exceptionally poor company.
    motive_murderer: Recent repair. Grant wanted me to call it ancient. He had the insurance copy with
      the date I altered. Refusing his description meant answering for mine. Then the entrance mount started
      moving. He suggested I was inventing another problem to protect myself. Claire knows how I am about
      handling. Grant knew how to turn that into a joke.
    where_innocent: I fitted the red band before the preview. Kept the condition sheet. Grant waved the
      insurance copy at me and asked what my signature was worth. That date wasn't a change I authorized.
      Then Frank's mount moved. Finally, something I could fix with my hands. Frank, get the load down.
      I'll discuss your feelings about my tone afterward.
    where_murderer: 'I fitted the red band before the preview and kept the condition sheet. The copy with
      my false date was still at the workbench. After the preview I went to Grant''s place to ask for
      that copy back. He wasn''t there. The glass was. I held it up to the light: a shop engraving isn''t
      a condition report. Put it back. Then Frank''s mount started moving and I went to the alcove. Frank,
      I wanted that load down. The paper could wait. I told myself it could wait.'
    evidence_innocent: Red paper, silver backing. I fitted it across the stopper. I inspected the front
      and missed the split behind. Leave the unused stock in its sleeve; photograph it first. The date
      on the insurance copy is a copying error. I didn't alter it. Keep that copy separate from my condition
      sheet.
    evidence_murderer: I used red woven tape across the stopper. The foil-backed paper was packaging stock.
      My sleeve and the technician's photograph concern the closure work; they don't catalogue every scrap
      in the building. I changed the insurance date. That much is mine. The packaging isn't my band.
  coming_clean:
    innocent: I didn't poison Grant. My band was foil-backed paper. I missed the split behind it. I changed
      the insurance date myself, and then called it a copying error. Grant had that copy. I wanted you
      examining the paper instead of the person who signed it. Claire, the workbench can be packed now.
      Photograph every piece. I don't expect my word to do the job.
    murderer: The red band was foil-backed paper, exactly as the report says. I denied my own material
      because I had opened the bottle during the preview. I knew where its closure was weakest. Later
      I put the stolen poison in Grant's private glass. Its scrap and the damaged band belong to that
      sequence; they are not a unique fingerprint, and I hoped you would stop at that objection. The false
      date gave him leverage over me. I used the weakness in a closure I had fitted. People trusted my
      hands near things that could not be replaced. They should never trust them again.
- id: '06'
  name: Dada DiCapo
  hearings:
    motive_innocent: Donor Collapse was an empty dinner jacket falling from a gilded chair. I made the
      film. Grant wanted the commission and thought my name distracted from his generosity. Vincent knows
      the sort of work I made before anyone paid attention. I wanted this one remembered as mine. And
      yes, I was going to make that room uncomfortable. I had an excellent reason.
    motive_murderer: Donor Collapse was an empty dinner jacket falling from a gilded chair. I made the
      film. Grant wanted my name removed while his foundation acquired it. Vincent knows what it cost
      to get anyone to take my work seriously. Grant expected gratitude for erasing me from it. I was
      going to make that room uncomfortable. He was not going to enjoy the version he bought.
    where_innocent: I kept trying to restore the canceled collapse cue. I went to the private room for
      the coordinator. Grant's place was set. I had the film on my phone and showed her the falling jacket.
      I wanted the screen on during his toast. She said no again. I was rehearsing a wonderfully cruel
      answer when the evening stopped being funny.
    where_murderer: The coordinator refused my public collapse cue. I showed her the jacket film on my
      phone in the gallery. I stayed there after she left. I didn't go into Grant's private room to try
      his chair or sit beside his glass. I still wanted the screen on during his toast. There was a difference
      between that and the private version he and I had discussed.
    evidence_innocent: An empty jacket falls off a chair. That is the film. Grant rejected it, and I kept
      pushing. I wanted him sitting through it while everyone else laughed. Alive and furious. Vincent,
      I don't want you to make that sound kind. It wasn't.
    evidence_murderer: Of course I took a little from the bottle. It was for Donor Collapse. Grant had
      agreed to the private live version after his toast; he only canceled the public program. I thought
      the contents were inert. I wasn't rehearsing by his glass, and I expected him to get up. That is
      what we had agreed.
  coming_clean:
    innocent: 'I planned an insult. The delivered film and Grant''s rejection tell you what it was: an
      empty jacket, no live performer. I pushed the coordinator and went to his room because I wanted
      it shown. I did not kill him. Vincent, please don''t tell me I can make work about this. I know.
      I am going to need a very long time before I want to.'
    murderer: There was no agreed live fall. Grant's rejection meant what it said. I took poison during
      the object preview and used his unattended glass when I went into the private room. Then I told
      you his death began as an approved stunt. The film gave that lie something visible to lean on. It
      was an empty jacket in a chair, not consent to what I did to him. He took my name off his show.
      Vincent, there is no artistic explanation that makes this better. I kept wanting the room to look
      at my work. Now everyone is looking at what I did.
- id: '07'
  name: Vincent Van Faux
  hearings:
    motive_innocent: He kept exhibiting the early picture. My breakthrough, apparently. I painted it to
      pay rent. Now he'd commissioned the bottle study and wanted to print it beside his rescue announcement.
      I withdrew permission. Hugh told me to be less difficult. Dada, you kept making new work while I
      got invited to explain the old one. Grant liked having that old version of me on his wall.
    motive_murderer: He kept exhibiting the early picture. My breakthrough, apparently. I painted it to
      pay rent. Now he wanted the bottle study printed beside his rescue announcement. I withdrew permission;
      he could hold my final payment. Hugh told me to be less difficult. Dada, you kept making new work.
      Grant could buy another picture from me and still introduce me as the boy who painted his first.
    where_innocent: I crossed the reproduction off the handout proof. I showed the collectors the painting.
      I painted the bottle from a sale photograph and made a studio model for the light. At the preview
      I saw Grant's acquired bottle. My studio things weren't in his loan. The dealer could sell the whole
      arrangement. I would still like to be asked first.
    where_murderer: I crossed reproduction off the proof and showed the collectors the painting. I'd used
      a sale photograph and a studio model for the light. I attended the preview. Later I took Grant's
      unsigned reproduction release to his place and left it beside his glass, which caught the light
      there, too. Grant wasn't around. The dealer could sell the arrangement. My painting wasn't a signature
      on every object put beside it.
    evidence_innocent: The model is painted wood. You can see the joints. I delivered a painting of the
      glass bottle, using the sale photograph. The real bottle stood at the preview. Grant threatened
      my last payment when I withdrew permission to print the painting. Dada, I envied your work. I still
      do.
    evidence_murderer: My wooden model was on the preview support. The acquired bottle was withheld. The
      reference sheet describes the original; it isn't a photograph of the installed prop. The delivery
      list doesn't name every presentation item. Grant was holding my last payment over printing rights.
      I had had enough of him.
  coming_clean:
    innocent: I did not kill Grant. My model was wood; the loan was glass. The delivery list separates
      the painting from the object. I withdrew reproduction permission even with payment outstanding.
      I also let Grant sell a grander story about my early work than it deserved. Dada, I owe you a conversation
      without collectors listening. I'd been hoping to see the bad student paintings. To remember what
      trying felt like.
    murderer: I killed Grant. The preview bottle was his acquired original, not my studio model. I used
      the model story to make the source sound harmless. I took poison during the preview and later put
      it in his waiting glass. My delivery list never included a model; the intake photograph showed his
      bottle. He had bought a picture. Dada kept making work. I kept wanting someone else to remove the
      man who made me feel small. There is no picture I can paint that excuses doing it myself.
