- id: 09
  name: Dr. Art E. Fact
  hearings:
    motive_innocent: Reed found a gap in my ownership citation. Grant found it inconvenient, which is
      not a scholarly objection. I asked to hold the earlier press copies; he wanted my name on them before
      the correction. Dada was here. I had hoped to discuss something rather more impressive with her.
      A ridiculous concern, given the size of the actual error. Still, there it is.
    motive_murderer: Reed found a gap in my ownership citation. Grant could expose it whenever I withdrew
      authority from his catalog. I asked to hold the earlier press copies; he wanted them circulating
      first. Dada was here. I had imagined a rather different conversation with her. Grant was going to
      make sure my most attentive audience heard about the error before anything else.
    where_innocent: The purchase attachment said original contents. My draft said inert. I asked Reed
      to hold the early press copies. Grant said people had paid to see his bottle, not my question mark.
      I let the preview go ahead. I knew what cyanide meant; I did not need another reference book. Dada,
      you asked why I was so quiet. I was waiting for somebody with more authority to stop it. I was the
      authority in that conversation.
    where_murderer: I asked Reed to restore the collection attachment. My draft used the inert description;
      a query remained beside it. I attended the preview. Grant wanted me to explain the collection during
      his toast. I went to his place to object to that introduction. Nobody there. A glass and the speech
      card with my name on it. I turned the card over and left. Petty, yes. I have apparently reached
      the stage of my career where I take revenge on stationery.
    evidence_innocent: My query says original contents. I wrote it. The reply says unresolved, keep closed.
      Then I let the guests hear inert. Reed has the full text; ask him for it. Dada, please give me a
      moment. This is rather different from the conversation I had hoped to have with you.
    evidence_murderer: I hadn't read the purchase condition before the gala. My query was about the object's
      history. I used the lender's description; the dealer's attachment wasn't part of that research.
      Reed, my ownership citation was poor. You may say so. It doesn't mean I had read a different document.
  coming_clean:
    innocent: I did not kill Grant. My dated query quotes the contents condition; intake answered that
      it remained unresolved. I let the entry proceed. Reed, your finding deserves your name. Dada, I
      kept talking about your work because I was trying to invite you to dinner. An invitation to dinner.
      I should be able to say that. I'm sorry. This is hardly the moment.
    murderer: I had read the condition. My own query quotes it. I denied that knowledge because it explained
      why I knew the bottle might still hold its original contents. I took the poison during the preview
      and used it in Grant's private glass. The ownership correction was not going to stop him circulating
      my mistake. I decided to stop him instead. I have spent a career distinguishing an object from the
      story sold with it. Dada, you need not explain your work to me. Reed, you need never seek my approval.
      I have used my knowledge for the smallest possible purpose.
- id: '10'
