      what we had agreed.
  coming_clean:
    innocent: 'I planned an insult. The delivered film and Grant''s rejection tell you what it was: an
      empty jacket, no live performer. I pushed the coordinator and went to his room because I wanted
      it shown. I did not kill him. Vincent, please don''t tell me I can make work about this. I know.
      I am going to need a very long time before I want to.'
    murderer: There was no agreed live fall. Grant's rejection meant what it said. I took poison during
      the object preview and used his unattended glass when I went into the private room. Then I told
      you his death began as an approved stunt. The film gave that lie something visible to lean on. It
      was an empty jacket in a chair, not consent to what I did to him. He took my name off his show.
      Vincent, there is no artistic explanation that makes this better. I kept wanting the room to look
      at my work. Now everyone is looking at what I did.
