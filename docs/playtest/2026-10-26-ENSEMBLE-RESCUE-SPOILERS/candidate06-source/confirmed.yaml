      hiding behind. A family is waiting for a man who will never come home, and I made that happen.
- id: '05'
  name: Chip Patina
  hearings:
    motive_innocent: Recent repair. Grant wanted me to call it ancient. He liked my name beneath his description.
      We had already argued over treatment paperwork. Then the entrance mount started moving. People sighed
      when I stopped the conversation. They always do. I am easier company if nobody touches anything.
      Claire knows that. Tonight I was exceptionally poor company.
    motive_murderer: Recent repair. Grant wanted me to call it ancient. He had the insurance copy with
      the date I altered. Refusing his description meant answering for mine. Then the entrance mount started
      moving. He suggested I was inventing another problem to protect myself. Claire knows how I am about
      handling. Grant knew how to turn that into a joke.
    where_innocent: I fitted the red band before the preview. Kept the condition sheet. Grant waved the
      insurance copy at me and asked what my signature was worth. That date wasn't a change I authorized.
      Then Frank's mount moved. Finally, something I could fix with my hands. Frank, get the load down.
      I'll discuss your feelings about my tone afterward.
    where_murderer: 'I fitted the red band before the preview and kept the condition sheet. The copy with
      my false date was still at the workbench. After the preview I went to Grant''s place to ask for
      that copy back. He wasn''t there. The glass was. I held it up to the light: a shop engraving isn''t
      a condition report. Put it back. Then Frank''s mount started moving and I went to the alcove. Frank,
      I wanted that load down. The paper could wait. I told myself it could wait.'
    evidence_innocent: Red paper, silver backing. I fitted it across the stopper. I inspected the front
      and missed the split behind. Leave the unused stock in its sleeve; photograph it first. The date
      on the insurance copy is a copying error. I didn't alter it. Keep that copy separate from my condition
      sheet.
    evidence_murderer: I used red woven tape across the stopper. The foil-backed paper was packaging stock.
      My sleeve and the technician's photograph concern the closure work; they don't catalogue every scrap
      in the building. I changed the insurance date. That much is mine. The packaging isn't my band.
  coming_clean:
    innocent: I didn't poison Grant. My band was foil-backed paper. I missed the split behind it. I changed
      the insurance date myself, and then called it a copying error. Grant had that copy. I wanted you
      examining the paper instead of the person who signed it. Claire, the workbench can be packed now.
      Photograph every piece. I don't expect my word to do the job.
    murderer: The red band was foil-backed paper, exactly as the report says. I denied my own material
