characters:
- id: '01'
  name: Artie Ficial
  hearings:
    motive_innocent: Please, sit wherever you can hear. Grant wanted his name over the door, a vote in
      every department, and my resignation. Monet needed his check for wages; Sue objected to the terms.
      Six years here, and tonight I was supposed to introduce my own replacement. My father would have
      called that a useful lesson in ambition. I had hoped never to give him the satisfaction.
    motive_murderer: Please, sit wherever you can hear. Grant wanted his name over the door, a vote in
      every department, and my resignation. Monet needed his check for wages; Sue objected to the terms.
      Six years here, and tonight I was supposed to introduce my own replacement. Grant expected me to
      call him our savior. I had practiced the introduction. I could not get through it.
    where_innocent: Sue and I stopped the announcement at the public desk. Then I went to Grant's private
      room to call the board without a roomful of donors listening. His place was set; he wasn't there.
      I asked Barb to give me a minute alone. I sent the refusal. Claire, I had just refused the money
      that pays our staff. I wanted to hear somebody on that call say I had done the right thing. Nobody
      did.
    where_murderer: Sue and I stopped the announcement at the public desk. My refusal went to the board;
      I told intake to keep the bottle out of the public exhibition. Then Grant wanted to see me privately,
      so I went to his place. He wasn't there. His glass was. He could summon me and leave me waiting,
      and I straightened his chair before I left. I kept smiling, Claire. I couldn't think what else a
      host was supposed to do. I am having much the same difficulty now.
    evidence_innocent: Keep it closed. That was my instruction, and I still approved the preview. Both
      decisions are mine. The board has my refusal of the gift. Monet, I know that doesn't pay anyone.
      Claire, take the seating list. Someone still has to look after the people here.
    evidence_murderer: I took the contents out of that bottle to get them off the display. Intake removed
      the bottle too; only its label remained when the guests entered. I wanted the preview safe. Afterwards
      I went to Grant's place with my refusal. I left it beside his glass. I did not give him a drink.
      The board has the refusal.
  coming_clean:
    innocent: I did not kill Grant. My refusal was already with the board, and the preview photograph
      shows the bottle I foolishly allowed to remain on display. I relied on an instruction to keep it
      closed. Claire will have every reason to ask why. Tomorrow I have to tell the staff what happened
      in the institution I promised to protect. Tonight, for once, somebody else can make the closing
      remarks.
    murderer: I killed Grant. The refusal in the announcement folder was real. So was the bottle at the
      preview. I took its poison and later went to his waiting private glass. The public argument gave
      everyone something else to watch. I told you intake had removed the bottle because I wanted that
      opportunity gone from your account of the evening. The wide photograph put it back. I cannot call
      this protecting the museum. Claire will have to tell the staff what I did, and I will not be here
      to make it sound dignified.
- id: '02'
  name: Claire O’Scuro
  hearings:
    motive_innocent: Grant wanted my name beneath that ownership claim tonight. The bowl's papers were
      incomplete; I had approved its label too soon, and he preferred the earlier version. I wanted the
      revised label up. Reed kept asking me to revisit it. I taught that student to question an authority.
      When the authority was me, I behaved very badly.
    motive_murderer: The bowl's ownership papers were incomplete. I approved its label too soon; Grant
      retained my signature. Reed kept asking me to revisit it. Grant could expose the earlier approval
      whenever I objected to his claim. My department was meant to thank him tonight. Instead I was trying
      to withdraw authority he already possessed, with my student watching.
    where_innocent: 'The bowl remained. I removed its ownership label, and Reed kept the old wording.
      The bottle''s incoming papers were a separate matter: approval was on hold, so I moved them from
      the public display file to intake. Both files were on that desk. Reed, please stop calling everything
      I did a correction. Some of it was putting an unpleasant decision out of sight. I want to leave
      it there.'
    where_murderer: I removed the bowl's ownership label; Reed kept the old wording. Approval was on hold
      for the bottle, so its papers went to intake. Grant wanted the explanation brought to him personally.
      He was elsewhere when I put his copy beside the glass at his place. I moved the glass to keep its
      damp base off the paper. I remember that. Reed, I was angry enough to let him wait for his explanation
      afterward. I still cannot bear the idea of handing him a spoiled page.
    evidence_innocent: Intake had the seller's terms, the contents query and the warning to keep it closed.
      Moving the papers didn't withdraw that warning. Reed asked me to stop the preview until we had an
      answer. I sent another query. Yes, Reed. I heard you the first time.
    evidence_murderer: I checked the intake sheet myself. Empty. That is what I authorized and what went
      onto the preview stand. There were no original contents there to take. Reed, bring the receiving
      copy. I'm answering for my approval, not for a bottle someone now says was full.
  coming_clean:
    innocent: I did not kill Grant. Intake retained the unanswered contents question and the closed-bottle
      restriction. I left the preview approved anyway. My earlier bowl label was also wrong. Reed, you
      should not have needed my permission to keep asking. I cannot offer you a corrected label as an
      apology for that. I can offer you the original file, and I can stop standing between you and it.
    murderer: The incoming sheet does not say empty. It says inert display liquid, on Grant's word. I
      moved the papers because I did not want that distinction examined. I took poison from the bottle
      during the preview and later put it in his waiting glass. I used my authority over intake to make
      the source sound harmless and nonexistent. My label correction was real. Reed, you were right to
      question me. I have spent tonight making you ashamed of the person who taught you to do that.
- id: '04'
  name: Monet Bags
  hearings:
    motive_innocent: Friday. That's when wages are due. Grant's check could cover our staff; his terms
      let him inspect every transfer. I won't have the cleaners waiting by the phone while he decides
      which chair his name should go on. Artie wanted his authority protected. I wanted payroll covered.
      And yes, I told Grant he could keep his check if the price was treating us like thieves.
    motive_murderer: Friday. That's when wages are due. My mother used to wait by the phone on payday.
      I know what that does to a household. I'd moved money to pay our staff. Grant wanted the books before
      releasing his check, and the board wanted answers too. Artie hated losing authority. I had transfers
      to explain and no time left to explain them.
    where_innocent: The extra-course ticket came to accounts. I crossed out our account and took Grant's
      copy to his place. Glass waiting; no Grant. I took my transfer slip away again. The payroll transfer
      had board authorization. He didn't need to inspect it privately. Brie, send the supplier to me.
      Don't send me another speech about what the donor expects.
    where_murderer: The manager brought the cheese ticket to accounts. I crossed out our account and sent
      the donor copy back. The restricted-fund transfer was still off the board's agenda. Grant wanted
      my books before releasing his donation. I went to his private place to get a signature; his glass
      was waiting, he wasn't. I stayed with the unsigned bill for a bit. Brie, whose money did he think
      kept appearing whenever he asked for something? Mine? Yours?
    evidence_innocent: The toast stayed booked. I told service to carry out the original order and charge
      Grant for the extra course. I had authority to transfer the wage money. An absent approval on the
      payroll line is an office problem. The staff got paid. I'm not apologizing for that.
    evidence_murderer: The manager's six-thirty-two entry is wrong. I left the invoice beside his unwrapped
      glass at six fifteen. I was back in accounts before the preview opened, and I did not return afterwards.
      Brie, the cheese ticket came later. You are treating two different errands as one visit.
  coming_clean:
    innocent: I didn't kill Grant. The toast stayed booked; my private visit was over the bill. I lied
      about board authorization. There wasn't any. I moved restricted money into wages because Friday
      was coming. Calling the missing approval an office problem didn't make one appear. Artie, when they
      freeze that account, tell the cleaners I paid them. Don't ask them to be grateful for what comes
      next.
    murderer: I killed Grant. The accounts argument happened, and I sent the ticket back with the manager.
      My separate visit to find Grant was after the preview, while his unwrapped glass was waiting. I
      used poison I'd taken from the bottle. I told you that visit was before the preview; the manager
      had not even set out the glass then. I had already used restricted money for payroll. Grant wanted
