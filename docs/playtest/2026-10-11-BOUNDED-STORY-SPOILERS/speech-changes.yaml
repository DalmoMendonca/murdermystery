    me while I pack, if you must. Every person who passes one of those strips around
    leaves me another thing to account for. I was already answering to Grant for what
    my hands had done. Now I'm answering to all of you.
- character: Dada DiCapo
  id: '06'
  field: evidence_innocent
  before: An empty jacket. A chair. A thump. That was the studio film we delivered
    before tonight. Grant refused a live stunt with himself or any guest, then rejected
    the screen version too. I kept asking to show it. Please stop looking at me when
    you say collapse. I wanted him embarrassed. I had thought about his face afterward.
  after: An empty jacket falling off a chair. We filmed it in the studio before tonight.
    He rejected the live stunt, then the screen version. I kept pushing the coordinator.
    I wanted to sit here and watch him recognize himself in that jacket while everyone
    laughed. Vincent, please don't look relieved because the chair was empty. I spent
    weeks imagining him falling. I can still hear how delighted I was when we got
    the sound right. I wish somebody would switch that thing off.
- character: Tess Tament
  id: '10'
  field: evidence_innocent
  before: His glass was unwrapped when I left the seating card. I was annoyed they'd
    already made my present into service equipment. The manager had the toast; I went
    looking for Sue. The donor seat depends on the board accepting the gift. I asked
    for an appointment while Grant was alive. Sue, I keep remembering that I bought
    him a glass. Such a stupid thing to be unable to stop thinking about.
  after: The glass was bare when I left the card. I remember being irritated about
    it. My present, already put to work. Then I went to find Sue. Sue, I know what
