schema_version: 1
status: feasibility_draft_not_player_copy
public_assets_changed: false
shared_reports_selection_dependent: false
constraint_references: TWO_STORIES.md C1/C2/C3 are proposals, not current published facts
rows:
- id: '01'
  name: Artie Ficial
  constraint_candidate: C2
  agenda: Stop the resignation announcement without losing the gift.
  paired_premise: 'I: holds the photograph setting under false board authority. G: offers Grant his supposedly
    already-served punch as a way of keeping him at that setting.'
  critical_limit: The shared-batch claim needs a natural spoken context; authority forgery alone is not
    a murder case.
  status: needs_causal_proof
  accepted: false
- id: '02'
  name: Claire O’Scuro
  constraint_candidate: C1
  agenda: Prevent a disputed accession from becoming an accepted permanent gift.
  paired_premise: 'I: replaces the ownership label and insists on the empty handling copy. G: describes
    checking residual liquid in that supposed copy while defending the condition qualification.'
  critical_limit: Checking hazardous contents is not normal curatorial work. Retain only a claim about
    observed capacity, not casual sampling.
  status: needs_causal_proof
  accepted: false
- id: '03'
  name: Hugh Bidder
  constraint_candidate: C2
  agenda: Keep a refund claim from becoming a personal guarantee.
  paired_premise: 'I: tears out the personal guarantee and argues for another negotiation. G: brings Grant
    what he claims is punch from the reception bar to resume the settlement privately.'
  critical_limit: Hospitality fits negotiation; identify batch naturally. Surviving estate liability mitigates
    motive but does not exclude revenge.
  status: needs_causal_proof
  accepted: false
- id: '04'
  name: Monet Bags
  constraint_candidate: C2
  agenda: Protect payroll and force authorization of the extra course.
  paired_premise: 'I: prolongs the count and stops private returns. G: says the donor drink was already
    filled from the reception punch before the course dispute ended.'
  critical_limit: Needs an affirmative personally witnessed preparation claim, not a mistaken assumption
    about what staff did.
  status: needs_causal_proof
  accepted: false
- id: '05'
  name: Chip Patina
  constraint_candidate: C1
  agenda: Keep an altered treatment date from wrecking the conservation report.
  paired_premise: 'I: removes lining from the damaged case and withholds the warning. G: calls the object
    handled during that intervention the liquid-holding display copy.'
  critical_limit: Source role is natural; establish a target-side act independently. Do not make copy
    possession a complete alibi.
  status: needs_causal_proof
  accepted: false
- id: '06'
  name: Dada DiCapo
  constraint_candidate: C3
  agenda: Force restoration of a performance and its stolen credit.
  paired_premise: 'I: tries to restore the jacket-collapse cue and places the PROP glass. G: attributes
    glass personally gathered during that intervention to a broken rehearsal vessel.'
  critical_limit: Common PROP examination could challenge the item claim; a separate unexamined broken
    glass remains possible. Need a specific service consequence.
  status: needs_causal_proof
  accepted: false
- id: '07'
  name: Vincent Van Faux
  constraint_candidate: C3
  agenda: Stop humiliating student work from being displayed.
  paired_premise: 'I: removes the painting and turns it inward in a crate. G: claims the glass he wraps
    while clearing the portrait area came from that painting framing.'
  critical_limit: 'REJECT as currently conceived: no planted blue or curved framing glass. Do not invent
    it merely to fit the shard.'
  status: reject_current_concept
  accepted: false
- id: 08
  name: Sue Venir
  constraint_candidate: C2
  agenda: Avoid being treated as the lawyer who approved the gift.
  paired_premise: 'I: refuses the signature and conceals an unfinished estate instruction. G: brings the
    private drink to keep Grant discussing conditions instead of announcing approval.'
  critical_limit: Hospitality must be incidental to an actual negotiation; a second drink errand would
    be repetitive. Needs two independent grounds.
  status: needs_causal_proof
  accepted: false
- id: 09
  name: Dr. Art E. Fact
  constraint_candidate: C1
  agenda: Preserve the sound work in an article while suppressing a stolen credit.
  paired_premise: 'I: requests the coroner report and empty copy, then retracts the request. G: describes
    retained contents in the supposed handling copy as part of the disputed research request.'
  critical_limit: Do not make a scholar casually open a hazardous original. Source knowledge is plausible;
    source custody and target link are unproved.
  status: needs_causal_proof
  accepted: false
- id: '10'
  name: Tess Tament
  constraint_candidate: C2
  agenda: Stop a foundation vote that reduces her influence.
  paired_premise: 'I: hides the pen and presses trustees on the amendment. G: uses a personally fetched
    donor drink to keep Grant occupied while the vote is disputed.'
  critical_limit: Arrival must be branch-compatible. An I arrival receipt is a meaningful mitigation,
    not a shared fixed G-excluding fact.
  status: needs_causal_proof
  accepted: false
- id: '11'
  name: Barb Dwyer
  constraint_candidate: C1
  agenda: Conceal negligent acceptance of the donor camera/privacy instruction.
  paired_premise: 'I: moves unexamined packing and records a misleading completed search. G: describes
    the recovered source as a supposedly harmless empty-copy item inspected in that transfer.'
  critical_limit: Empty appearance cannot prove copy capacity. Need a consequential affirmative claim,
    not another excuse for unexamined contents.
  status: needs_causal_proof
  accepted: false
- id: '12'
  name: Paige Turner
  constraint_candidate: C3
  agenda: Recover the recorder without exposing a confidential source.
  paired_premise: 'I: removes source questions from the coat packet. G: claims a particular folded item
    she returned held broken recorder material rather than bottle glass.'
  critical_limit: 'REJECT as currently conceived: mixed waste cannot connect that fold to her, and a recorder-shell
    comparison has no early plant.'
  status: reject_current_concept
  accepted: false
- id: '13'
  name: Frank Lloyd Wrong
  constraint_candidate: C1
  agenda: Recover equipment and hide an unsafe structural compromise.
  paired_premise: 'I: retrieves a missing pry bar from case returns. G: describes the blue object handled
    alongside that equipment as the open-bottom copy despite a liquid-retaining action.'
  critical_limit: Equipment route fits; liquid action may be contrived. Cannot infer guilt from common
    tool width or generic plaster.
  status: needs_causal_proof
  accepted: false
- id: '14'
  name: Mona Lott
  constraint_candidate: C2
  agenda: Prevent naming confidential negotiators in the ownership dispute.
  paired_premise: 'I: withholds the identifying objection page and threatens public withdrawal. G: uses
    a private toast offering to delay Grant while partners finish deciding.'
  critical_limit: Diplomatic hospitality is plausible; physical target identity and false batch provenance
    still need a planted scene.
  status: needs_causal_proof
  accepted: false
- id: '15'
  name: Elon Mosaic
  constraint_candidate: C1
  agenda: Win a trustee seat after anonymous buying undermined his standing.
  paired_premise: 'I: presses an acquisition query despite lack of corporate authority. G: claims his
    construction demonstration used a liquid-holding display copy.'
  critical_limit: Do not stage an acquisition pour simply to get liquid into a drink. Reject if demonstration
    has no real collector purpose.
  status: needs_causal_proof
  accepted: false
- id: '16'
  name: Anya Tique
  constraint_candidate: C1
  agenda: Make the board hear the donor promise omitted from her accession history.
  paired_premise: 'I: removes the loose promise from the ledger to choose when it is read. G: disputes
    the original/copy condition while insisting the supposedly empty copy held a residue.'
  critical_limit: Curatorial history gives knowledge, not current custody. Needs a genuinely planted handling
    exchange rather than a new source errand.
  status: needs_causal_proof
  accepted: false
- id: '17'
  name: Saul D. Bid
  constraint_candidate: C1
  agenda: Defend a fee while hiding a subsidiary sale from review.
  paired_premise: 'I: withholds a complete invoice until trustees hear the fee dispute. G: defends the
    supplied copy condition using a specific construction claim incompatible with the examined object.'
  critical_limit: Auction-house role fits source knowledge. Condition expertise makes a careless false
    claim less credible; explain why that cover was chosen.
  status: needs_causal_proof
  accepted: false
- id: '18'
  name: Elle Loominate
  constraint_candidate: C2
  agenda: Retrieve a family textile promised without permission.
  paired_premise: 'I: removes the textile and tears the purchase card. G: offers the toast drink to interrupt
    Grant before his proposed purchase is photographed.'
  critical_limit: A drink should not replace a natural direct refusal merely to create a clue. Keep only
    if the scene gives a concrete negotiation reason.
  status: needs_causal_proof
  accepted: false
- id: '19'
  name: Reed DeLabel
  constraint_candidate: C1
  agenda: Correct attribution without losing the exhibition-funded fellowship.
  paired_premise: 'I: conceals the rejected correction and original-access refusal. G: uses a claimed
    inspection of the copy contents to justify the withdrawal of a bottle request.'
  critical_limit: Knowledge is natural; unauthorized source handling may be plausible but target action
    is missing. Do not give every academic the same request.
  status: needs_causal_proof
  accepted: false
- id: '20'
  name: Al Baster
  constraint_candidate: C1
  agenda: Get the sculpture crew paid and prevent a cheap replacement using his support.
  paired_premise: 'I: removes the support and reopens the returned case. G: claims the object fitted on
    that support was the empty copy during a liquid-retaining handling action.'
  critical_limit: A real support-fit dispute belongs to the role. A liquid action does not yet; retained
    component mitigates concealment but does not identify a poisoner.
  status: needs_causal_proof
  accepted: false
- id: '21'
  name: Ella Gance
  constraint_candidate: C2
  agenda: Stop the promised-donation list exposing an unaffordable replacement.
  paired_premise: 'I: excludes knowledgeable trustees and alters the acknowledgment. G: uses a personally
    provided drink to preserve the portrait arrangement and postpone the announcement.'
  critical_limit: Portrait control fits. The shared-batch claim and target handling must have a real scene
    consequence, not a glass lifted off a card.
  status: needs_causal_proof
  accepted: false
- id: '22'
  name: Drew Conclusions
  constraint_candidate: C2
  agenda: Retrieve a sponsored proof before being exposed as a purchasable critic.
  paired_premise: 'I: withdraws the item and takes back the press proof. G: offers the drink as an interview
    gesture while trying to change the donor acknowledgment.'
  critical_limit: A critic is not a photographer. Interview hospitality is plausible, but not enough by
    itself for a source/carrier case.
  status: needs_causal_proof
  accepted: false
- id: '23'
  name: Brie DeVivre
  constraint_candidate: C2
  agenda: Secure wages and a legitimate catering balance after concealing a supplier substitution.
  paired_premise: 'I: withdraws cover and refuses the clean replacement. G: claims she filled Grant’s
    glass from the reception shared batch before it was delivered.'
  critical_limit: Strong role fit and clear target consequence. A false source claim still needs poison-route
    evidence, not a contractual disagreement treated as murder.
  status: needs_causal_proof
  accepted: false
- id: '24'
  name: Cary Crates
  constraint_candidate: C1
  agenda: Recover payment for a delivery whose cracked frame he concealed.
  paired_premise: 'I: corrects the trolley record and handles the copy/equipment. G: attributes a liquid-retaining
    item carried through that work to the open-bottom copy.'
  critical_limit: Source/packing route fits. Keep no continuous trolley alibi; independently establish
    a target-side intervention.
  status: needs_causal_proof
  accepted: false
- id: '25'
  name: Anne E. Dote
  constraint_candidate: C2
  agenda: Keep booked children’s classes from being displaced by a private lounge.
  paired_premise: 'I: forges director endorsement and overlays the announcement with a petition. G: claims
    she brought the toast drink from reception to delay Grant while trustees read the petition.'
  critical_limit: 'Quiet-role test: not yet strong. Hospitality may be an arbitrary replacement for simply
    confronting the trustees.'
  status: needs_causal_proof
  accepted: false
- id: '26'
  name: Faye Stop
  constraint_candidate: C3
  agenda: Publish an uncropped shipping-file photograph despite the portrait agreement.
  paired_premise: 'I: retains a print and hides the full frame. G: attributes personally wrapped glass
    to her photographic equipment during the portrait rearrangement.'
  critical_limit: REJECT without a naturally planted fragile equipment item and target consequence. Do
    not invent dark-blue camera glass.
  status: reject_current_concept
  accepted: false
- id: '27'
  name: Robin Banks
  constraint_candidate: C2
  agenda: Turn approved networking into an ownership protest without exposing volunteer finances.
  paired_premise: 'I: replaces captions and donor brochures with petitions. G: uses a toast offering to
    force a face-to-face answer before the ownership announcement.'
  critical_limit: Advocacy confrontation is natural; apparent courtesy can be pointed. Needs a concrete
    reason the donor accepts the drink and an independently recorded setting act.
  status: needs_causal_proof
  accepted: false
- id: '28'
  name: Penny Pincher
  constraint_candidate: C2
  agenda: Control which family letter reaches the ownership audience.
  paired_premise: 'I: takes the portrait packet on a coat-check detour and removes speech cards. G: offers
    the donor drink while trying to trade the withheld fourth letter for silence.'
  critical_limit: Negotiation fits, but no new inherited-family trait. Open packet alone is a carrier
    hypothesis, not ownership of the contaminated miniature.
  status: needs_causal_proof
  accepted: false
- id: '29'
  name: Justin Tyme
  constraint_candidate: C3
  agenda: Correct a false parcel story while preserving the tenant source and bookshop wages.
  paired_premise: 'I: obstructs clearing, opens the favor for a picture, breaks the phone protector. G:
    additionally claims personally broken miniature-neck glass.'
  critical_limit: Round23 seed supports material comparison but risks the only blue-bottle accident tell.
    Unowned mixed glass and unexamined breakage keep the case incomplete.
  status: needs_causal_proof
  accepted: false
- id: '30'
  name: Minnie Malist
  constraint_candidate: C2
  agenda: Restore control of a production whose approval and promised payment have fallen apart.
  paired_premise: 'I: hides a blackout and gives unauthorized payment assurances. G: says she personally
    filled the donor’s glass from reception punch while resetting the toast cue.'
  critical_limit: Event role fits; do not conflate console lighting with food service. The I/G scene must
    carry comparable production consequences.
  status: needs_causal_proof
  accepted: false
