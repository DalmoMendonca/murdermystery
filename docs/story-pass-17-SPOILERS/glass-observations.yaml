characters:
- id: '01'
  text: The gift packet nicked my thumb. There was a blue glass bit inside; I folded it back into the favor paper and threw that paper away before arranging the acknowledgment cards.
- id: '02'
  text: I found blue glass in the gift packet while clearing the desk for the proofs. It cut my finger. I folded the bit into its paper and discarded it. Reed, it wasn't a label offcut.
- id: '03'
  text: My gift came with blue glass sharp enough to draw blood. I put the bit back in the favor paper and binned the paper. No, I didn't ask Grant for a refund on that purchase as well.
- id: '04'
  text: Blue glass in the gift packet. Small cut on my thumb. I folded the glass into the paper and put it in the waste before leaving the authorization envelope on the desk.
- id: '05'
  text: The gift packet had a sharp blue glass fragment in it. I nicked my finger, folded it into the favor paper and discarded the paper. I didn't leave a loose edge among the tools.
- id: '06'
  text: His souvenir cut me. A blue glass bit in the packet. I folded it into the favor paper and binned it. I'd already had enough of things Grant called gifts while somebody else did the work.
- id: '07'
  text: I got blue glass in my thumb from the gift packet. I wrapped the bit in its paper and threw it away. Then Reed wanted me to sign a movement form. I asked him for a pen, not a lecture.
- id: '08'
