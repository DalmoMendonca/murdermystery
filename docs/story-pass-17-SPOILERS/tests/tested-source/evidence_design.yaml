schema_version: 1
reports:
- id: F1
  department: MERIDIAN / BOARD SECRETARY
  title: The gift came with conditions
  text: Grant Larceny collapsed after his toast and died at the gala. Earlier, trustees had discussed
    this unsigned gift agreement in the museum office. The label review, acquisition disputes and installation
    inspection continued in other rooms. These are the terms Grant wanted announced.
  rows:
  - - 1. Museum name
    - The Grant Larceny Meridian Museum
  - - 2. Collection decisions
    - Grant may veto future acquisitions
  - - 3. Museum director
    - Artie Ficial must resign within sixty days
  layout: gift_document
  document_label: DRAFT GIFT AGREEMENT / NOT SIGNED
- id: F2
  department: INVESTIGATION / INITIAL FINDINGS
  title: A death and a stolen exhibit
  text: Grant Larceny became ill after drinking his toast and died at the gala. The examination identifies
    cyanide poisoning. The museum had received a historical poison bottle for The Art of Murder. The auction
    file said its contents were retained; Grant told security it had been emptied. Collections placed
    it in a locked preparation cabinet inside a secondary case and withheld display approval. Only an
    empty replica went to the galleries. At 6:12 the cabinet alarm registered a forced opening. The original
    was missing. Food, drinks, props and recovered bottles are being examined.
  rows:
  - - Missing object
    - The Velvet Widow / original poison bottle
  - - Storage
    - Locked cabinet; forced-opening alarm at 6:12
  - - Laboratory results
    - Pending
  layout: bottle_photo
  photo: sealed_receiving_case_pass17_REQUIRED
- id: F3
  department: MERIDIAN / CATERER’S RECORD
  title: Service and storage accounts
  text: 'Jordan West, collections assistant: The secondary case was photographed closed at 5:45. At 6:12
    the cabinet alarm sounded. The lock and case were broken; the original was gone. The display replica
    remained on its trolley. Casey Hart, service manager: The reception desk is the long sideboard beside
    the entry. I unwrapped Grant''s new museum-star glass there at 6:32. I went to settle the kitchen''s
    extra-course authorization. I collected the glass at 6:44 and filled it with punch at 6:46. The photographs
    show it on the service tray until Grant''s 6:49 toast. Guests'' favors, programs and correspondence
    were also on the sideboard. Police found a small blue glass fragment folded in favor paper in its
    waste basket. Comparison is pending.'
  rows:
  - - Preparation cabinet
    - Lock and secondary case forced; original missing
  - - Reception waste
    - Blue glass fragment folded in favor paper; comparison pending
  - - Service
    - Glass unwrapped 6:32; collected 6:44; filled 6:46; toast 6:49
  layout: service_photos
  photo: sideboard_and_wrapped_fragment_pass17_REQUIRED
  timeline:
  - time: '6:30'
    caption: New donor glass, still wrapped
  - time: '6:32'
    caption: Unwrapped glass placed on reception sideboard
  - time: '6:44'
    caption: Service manager collects glass onto tray
  - time: '6:46'
    caption: Shared punch poured for the toast
- id: F4
  department: MERIDIAN / COLLECTIONS INVENTORY
  title: Two pieces of one bottle
  text: 'The original Velvet Widow bottle was found behind the reception sideboard. It is dark-blue glass,
    with a fresh piece missing from the neck. The fragment recovered in folded favor paper fits that gap:
    the two irregular edges join across the stamped inventory mark. The original''s receiving record describes
    an intact neck inside a sealed case. The recovered miniature fragrance bottle has an intact neck and
    body. The open-bottom display replica is clear glass.'
  rows:
  - - Original bottle
    - Dark-blue glass; fresh missing neck fragment
  - - Fragment in favor paper
    - Fits missing edge and divided inventory stamp
  - - Recovered favor bottle
    - Neck and body intact
  - - Display replica
    - Clear glass; open bottom
  layout: fracture_comparison
  photo: fracture_comparison_pass17_REQUIRED
- id: F5
  department: LABORATORY / CASE FINDINGS
  title: Laboratory findings
  photo: service_photos
  text: Cyanide was found inside Grant's museum-star glass, in the recovered original, on the blue neck
    fragment, and in a miniature LARCENY No.1 bottle from reception waste. The shared punch, meal, sauce,
    PROP glass, brush-water bottle and studio FIXER tested clear. Al's favor bottle collected with the
    invoice case contained fragrance and tested clear. Unopened favor stock also tested clear. The contaminated
    miniature has the common manufacturer label and no recipient name. Plaster and cloth fibers were found
    on the outside of Grant's glass.
  rows:
  - - Grant's glass / original / blue fragment
    - Cyanide detected
  - - Miniature from reception waste
    - Cyanide; common favor label; no recipient name
  - - Punch / meal / sauce / PROP / brush-water / FIXER
    - Clear for cyanide
  - - Al's miniature collected with invoice case
    - Fragrance; clear for cyanide
  - - Unopened favor stock
    - Fragrance; clear for cyanide
  layout: lab_findings
